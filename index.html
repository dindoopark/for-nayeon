\n드퀘르뱅 건초염은 엄지쪽 손목 건에 통증성 염증이 나타나는\n질병이다."},{"id":"c08-q029","chapterId":8,"number":29,"page":261,"stem":"항고혈압제를 복용 중인 75세 여자가 골다공증으로 진단받았다 이 환자의 항고혈압제 중\n골다공증에도 도움이 되는 약물은?","choices":["이뇨제","베타차단제","칼슘통로차단제","안지오텐신 II 수용체 길항제","안지오텐신 전환효소(ACE) 억제제"],"answer":3,"answerLabel":"③","answerPage":365,"explanation":"고혈압과 칼슘 대사의 연관성이 보고되고 있는데 부갑상선\n호르몬을 증가시키고 골밀도에도 영향을 준다고 알려져\n있다. 칼슘통로차단제는 부갑상선 호르몬을 감소시키고\n칼시토닌을 증가시키는 역할을 하는데 이를 통해 골다공증에서\n나타나는 뼈의 소실을 막는 효과가 있다."},{"id":"c08-q030","chapterId":8,"number":30,"page":262,"stem":"현재 임신 3개월인 30세 여자가 아들과 놀이동산에 다녀온 후 오른쪽 무릎에 통증이 심\n해 밤에 잠을 잘 수 없어 내원하였다. 진통효과를 위해 임신부가 선택할 수 있는 약물은?","choices":["Prednisone (Sterapred)","Acetaminophen (Tylenol)","Naproxen sodium (Aleve)","Baby aspirin (Bayer)","저용량 Ibuprofen (Advil)"],"answer":2,"answerLabel":"②","answerPage":365,"explanation":"acetaminophenol 임신한 여성의 진통효과를 위해서\n선택될 수 있다. 스테로이드(prednisone)는 관절\n진통효과보다는 소염효과로 선택된다. tylen이을 제외한\n3-5번은 NSAIDs이며, 초기 임신에서 유산을 초래할 수\n있다고 알려져 있다. 임시후기에도 금기이다."},{"id":"c08-q031","chapterId":8,"number":31,"page":262,"stem":"50세 남자가 아침에 조깅을 하다가 발을 헛딛고 무릎이 뒤틀린 후 통증이 심해져 내원하\n였다. 무릎이 심하게 부어 있고 만지면 통증을 호소한다. Grade II 염좌로 진단받았을 때\n환자에게 설명하는 적절한 초기 중재는?","choices":["손상된 무릎에 방수드레싱을 부착한 후 온수 샤워를 한다.","첫 24시간동안 냉찜질을 하다가 이후 온찜질을 지속한다.","2시간마다 침상밖으로 나와 목발로 지지하며 가볍게 걷게 한다.","24시간 후 무릎의 관절범위 운동을 다시 확인하여 등척성 운동을 시작한다","지금부터 48시간 동안 냉찜질을 간헐적으로 적용하며 손상된 다리를 상승시킨다."],"answer":5,"answerLabel":"⑤","answerPage":365,"explanation":"RICE 처치가 근골격계 손상의 지침이다. R ： 활동을\n감소하고 손상부위는 부목으로 지지하여 체중부하를 금한다.\nI： 냉찜질을 통해 통증과 부종을 감소시킨다. C： 탄력붕대로\n가볍게 적용하여 부종을 완화시킨다. E ： 손상부위는 심장위로\n상승하여 부종을 완화시킨다."},{"id":"c08-q032","chapterId":8,"number":32,"page":262,"stem":"류마티스 관절염을 진단받고 장기간 비스테로이드성 항염제(NSAIDs)를 복용하던 70세\n여자가 위장장애가 있어 내원하였다. 관절염 약을 복용하는데 왜 위장장애가 생기냐고 묻\n는 환자에게 할 설명으로 옳은 것은?","choices":["약물이 직접 위 점막을 자극하므로","프로스타글란딘 합성을 강화시키므로","약물의 효과로 위장관 운동이 감소하므로","위장관 점막을 보호하는 물질의 합성을 억제하므로","류마티스 관절염 진통효과를 위해 고용량이 처방되므로"],"answer":4,"answerLabel":"④","answerPage":366,"explanation":"NS 시Ds는 RA 에서 염증과통증조절을 위해 사용되어\n왔는데 부작용으로 위궤양과 위염의 발생이 심각하다.\nNSAIDs는 프로스타글란딘 합성을 억제함으로서 항염작용을\n하며, 위점막에서 발견되는 효소인 COX 너과 C0X-2의\n합성을 억제하여 통증과 염증을 조절하는 데 효과적이나\n위장과 신장의 부작용을 초래한다. 특히 C0X-1 은 보호성\n위점막 유지를 포함하여 다양한 기전으로 위를 보호하는\n물질이다."},{"id":"c08-q033","chapterId":8,"number":33,"page":262,"stem":"다음 중 비스테로이드성 항염제(NSAIDs)에 의한 위병변이 발생할 위험이 가장 높은 환\n자는?","choices":["오랜 기간 하루에 4번씩 아스피린을 복용하는 72세 관절염 환자","현재 흡연하고 있으며 월경통이 심하여 매달 월경 기간에 naproxen을 6번 복용하 는 40세 여 スト","요통이 있으면 ketoprofen을 주당 1 〜2회 복용하는 43세 확장성 심근병증 환자","발목염좌로 지난주 ibuprofen을 복용하였고 주말에는 4~6캔의 맥주를 마신 28세 남자","계절이 바뀔 때마다 편두통이 나타나면 아스피린을 최대용량으로 복용하는 18세 여자"],"answer":1,"answerLabel":"①","answerPage":366,"explanation":"NSAIDs 중 아스피린과 이부프로펜이 가장 보편적으로\n사용되는데 , 장기간 높은 용량으로 복용 시 가장 대표적인\n부작용으로 위장 병변이 나타난다고 알려져 있다. 약물의\n반감기는 용량이 증가하면서 함께 증가된다."},{"id":"c08-q034","chapterId":8,"number":34,"page":263,"stem":"섬유근육통을 진단받은 환자에게 퇴원교육을 하였다. 환자가 말한 내용 중 추가교육이 필\n요하다고 생각되는 경우는?","choices":["커피는 한잔으로 줄여보겠습니다.","짜고 기름진 음식은 피하고 건강식으로 먹으려고요.","생활하면서 스트레스를 받지 않으려고 노력할게요.","유연성 강화를 위해 스트레칭 프로그램에 참가할 거예요.","통증관리를 위해 매일 아침 조깅을 시작하려고 합니다."],"answer":5,"answerLabel":"⑤","answerPage":366,"explanation":"섬유근육통에는 복합적 중재가 효과적으로 통증만\n조절하기보다 통합적 관리를 위한 대상자교육이 중요하다.\n신체활동으로 가벼운 저강도 운동이 효과적이며 유연성\n스트레칭, 수중운동등이 통증완화와 기능향상에 도움이\n되며, 조깅 등 고강도 운동은 피한다. 스트레스관리가\n요구되며, 카페인 제한, 건강식이등이 권장된다."},{"id":"c08-q035","chapterId":8,"number":35,"page":263,"stem":"골관절염의주치료목표는?","choices":["관절기능을 보존한다","연골의 파괴를 예방한다.","연골의 생성을 촉진시킨다.","일상활동을 최대수준으로 향상시킨다.","통증 없이 매일 뛸 수 있게 한다."],"answer":1,"answerLabel":"①","answerPage":366,"explanation":"골관절염의 주 치료목표는 관절기능의 보존이다. 따뜻한\n물에 손을 넣어 관절범위운동을 시키거나, 체중부하 관절에\n걷기 운동으로 하도록 하는 것, 침상 안정기간을 줄여주는\n것 모두 관절기능과 유연성을 가능한 정상에 가깝게 유지하기\n위한 중재들이다."},{"id":"c08-q036","chapterId":8,"number":36,"page":263,"stem":"통풍 환자에게 급성 통풍발작을 초래하는 주요 요인은?","choices":["활동과다","고도 비만","고요산혈증","알코올 과다섭취","퓨린 함유 음식의 과다섭취"],"answer":3,"answerLabel":"③","answerPage":366,"explanation":"고요산혈증 정도가 높아지면 요산 결정이 쌓이면서\n통풍발작을 일으키게 되는데, 몸안의 요산이 과다 생성되거나\n배설저하가 나타날 때 발생하게 된다."},{"id":"c08-q037","chapterId":8,"number":37,"page":263,"stem":"통풍 환자에게 이뇨제 처방을 금하는 이유는?","choices":["급성 통풍발작을 초래하므로","혈장 용량을 변화시키기 때문에","전해질 불균형이 초래되므로","사구체여과율을 감소시키므로","신장에서 요산이 배설되는 것을 감소시키므로"],"answer":5,"answerLabel":"⑤","answerPage":366,"explanation":"이뇨제는 신장에서 요산을 제거하는 정도를 감소시ヲ 므로\n통풍 환자에게는 처방하지 않는다."},{"id":"c08-q038","chapterId":8,"number":38,"page":263,"stem":"다음 중 심부정맥 혈전증(DVT) 의 발생 위험이 가장 낯은 경우는?","choices":["무릎 전치환술을 받은 70세 여자","담당절제술을 받은 건강한 35세 여자","복부동맥류 수술을 받은 60세 남자","고관절 전치환술을 받은 건강한 80세 여자","관상동맥조영술을 받은 비만인 50세 남자"],"answer":2,"answerLabel":"②","answerPage":366,"explanation":"복부수술을 받은 40세 이하의 여성은 DVT 위험이\n낮아 DVT prophylaxis 처방대상에서 제외된다. 비만과\n임신도 DVT 위험요인에 포함된다."},{"id":"c08-q039","chapterId":8,"number":39,"page":264,"stem":"류마티스 관절염을 진단받은 35세 여자가 자신의 엄마도 이 질환으로 고생하는 것을 보\n았다며 어느 정도 심각한 질병인지 물었다. 이에 대한 설명으로 옳은 것은?","choices":["심각한 질병이 아니고 정상에 가까운 생활을 유지하실 수 있습니다.","심각한 전신질환으로 5년 생존율이 4기 호지킨병이나 3혈관 관상동맥질환과 유사 합니다.","질병의 진행속도가 빠르지 않아 이전에 비해 덜 심각한 단계로 분류하고 있습니다.","Epstein-Barr 바이러스에 의해 노출되어 발생하는 질환으로 치료가 가능합니다.","침범된 국소 부위만 기능소실을 가져오므로 일상활동에 미미한 장애가 예상됩니다"],"answer":2,"answerLabel":"②","answerPage":366,"explanation":"류마티스 관절염은 전신 장애를 초래하는 심각한\n질병으로 5년 생존율이 4기 호지킨병이나 3혈관\n관상동맥질환과 유사한 것으로 알려져 있다."},{"id":"c08-q040","chapterId":8,"number":40,"page":264,"stem":"정기 신체검진을 하러 고등학교 여자 배구팀이 내원하였다. 이들을 검진하면서 나타난 다\n음 징후 중 여자 운동선수들에게 신체손상을 초래하는 세 징후(ferrule athlete triad)에\n포함되는 것은?","choices":["높은 불안감","낮은 자존감","서맥","섭식장애","족저근막염"],"answer":4,"answerLabel":"④","answerPage":366,"explanation":"1 이개 여자 운동선수들에게 흔히 나타나는 female\nathlete triad는 섭식장애, 무월경, 골다공증이다."},{"id":"c08-q041","chapterId":8,"number":41,"page":264,"stem":"골다공증을 진단받은 62세 여자가 호르몬 대치요법을 포함하여 골밀도를 높이는 어떤 약\n도 복용하지 않겠다고 거부하였다. 이 환자의 건강관리를 위해 효과적인 교육내용은?","choices":["관절전치술에 대한 정보","매년 골밀도 사정을 해야하는 이유","칼슘섭취와 함께 체중부하운동을 하는 효과","칼슘배설을 촉진시키는 음식종류","호르몬대치요법의 장단점"],"answer":3,"answerLabel":"③","answerPage":366,"explanation":"연구결과에 의하면 골다공증을 진단받은 폐경기 여성은\n칼슘섭취와 함께 체중부하운동을 통해 골밀도를 높이는\n효과를 기대할 수 있다."},{"id":"c08-q042","chapterId":8,"number":42,"page":264,"stem":"생후 8개월의 남아가 양쪽 무릎에 혈관절증(hemarthrosis)과 혈뇨가 있어 내원하였다 외\n상 병력은 없으나, 부모는 아이가 항상 멍이 잘 들곤 했다고 말하였다. 이 환아에게 의심\n되는 상태는?","choices":["가정 폭력","백혈병","혈우병","특발성 혈소판감소증","류마티스 관절염"],"answer":3,"answerLabel":"③","answerPage":366,"explanation":"혈우병은 일반적으로 생후 1 년이내 진단되며, 혈관절증,\n연조직의 출혈, 혈뇨, 출혈시간 지연이 나타난다."},{"id":"c08-q043","chapterId":8,"number":43,"page":265,"stem":"무릎 전치환술을 받고 입원 중인 환자에게 가장 흔히 나타나는 합병증은?","choices":["욕창","패혈증","지방색전증","신전근 기능장애","심부정맥혈전증(DVT)"],"answer":4,"answerLabel":"④","answerPage":366,"explanation":"무릎의 전치환술을 받은 후 가장흔히 보고되는 합병증은\n사두근, 건, 무릎뼈 인대와 근접 연조직으로 구성된 신전근\n기전과 관련된 장애이다."},{"id":"c08-q044","chapterId":8,"number":44,"page":265,"stem":"요양원에서 장기간 침상생활을 하는 85세 남자에게 발생한 욕창에 대한 설명으로 옳은\n것은?","choices":["욕창 치료에서는 항생제를 사용할 수 없다.","연쇄상 구균이 패혈성 욕창을 발생시키는 주요 균이다","노인의 영양상태를 향상시키면 욕창의 위험이 줄어든다.","갑상선 저하증은 노인에게 욕창 발생을 촉진시킨다.","둔부에 적용하는 패드는 욕창 발생을 촉진시킨다."],"answer":3,"answerLabel":"③","answerPage":366,"explanation":"침상요양 중인 노인에게 나타나는 욕창은 고단백/\n고비타민식이를 통해 영양상태를 개선하면 욕창위험을 줄일\n수 있다고 알려져 있다. 적절한 식사요법은 빈혈과\n저알부민혈증을 예방하여 욕창 발생의 위험을 줄이게 된다"},{"id":"c08-q045","chapterId":8,"number":45,"page":265,"stem":"노인에게 변비를 초래하는 대표적인 요인은?","choices":["부동","불안","이뇨제","고단백식이","다량의 수분섭취"],"answer":1,"answerLabel":"①","answerPage":366,"explanation":"노인에게 나타나는 변비의 주요 원인은 부동, 수분섭취\n부족, 우울, 배변완화제의 남용 영양상태 저하 등이다."},{"id":"c08-q046","chapterId":8,"number":46,"page":265,"stem":"강직성 척추염을 진단받은 환자에게 적절한 중재는?","choices":["침상안정","금염 (gold salts)","스테로이드 경구투여","스테로이드 관절내 주입","비스테로이드성 항염제(NSAIDs) 처방"],"answer":5,"answerLabel":"⑤","answerPage":366,"explanation":"강직성 척추염의 중재에는 NSAIDs 투여, 신체활동을\n포함한 물리치료가 포함된다."},{"id":"c08-q047","chapterId":8,"number":47,"page":265,"stem":"오른쪽 고관절 전치환술을 받은 80세 여자가 수술 후 3일째인 오늘 아침 왼쪽 다리의 부\n종과 통증이 있으며, 신체검진 시 Homan 징후가 양성이다. 심부정맥 혈전증(DVT) 을 의\n심하는 근거에 대한 설명으로 옳은 것은?","choices":["고관절 수술 후 DVT 는 주로 80세 이상에서 나타난다.","수술 후 항응고제 투여가 금기이므로 DVT 위험이 높아진다.","고관절 전치환술 후 50% 이상의 환자에게 DVT 가 발생한다.","DVT 환자의 대부분은 Homan 징후가 양성이다.","고관절 전치환술의 경우 압박스타킹이 금기이므로 DVT 발생이 높아진다."],"answer":3,"answerLabel":"③","answerPage":366,"explanation":"DVT 는 수술 후 50-70%°| 환자에게서 발생하며, 첫\n24시간 이내에 주로 나타나고 수술후 사망원인의 50% 가\nDVT 와 연관된다고 알려져 있다."},{"id":"c08-q048","chapterId":8,"number":48,"page":266,"stem":"심부정맥 혈전증(DVT) 의 가장 심각한 합병증은?","choices":["뇌색전","폐색전증","심근경색","말초혈관염","말초혈관색전"],"answer":2,"answerLabel":"②","answerPage":366,"explanation":"DVT 의 가장 심각한 합병증은 폐색전이다."},{"id":"c08-q049","chapterId":8,"number":49,"page":266,"stem":"교통사고로 내원한 40세 여자가 골반 골절을 진단받고 입원하였다 입원 2일째 호흡곤란\n과 고열(39℃)이 있으며 의식의 혼돈을 보인다. 신체검진에서 Homan 징후는 음성이었으\n며 양쪽 폐 하엽에 수포음이 들리고 흉부 방사선에서 폐 전반적으로 폐포 충만성 병변\n(기ve이ar filling pattern)이 보이며 동맥혈가스분석에서 저산소증이 있다. 이 환자에게 가\n장 의심되는 상태는?","choices":["폐색전증","지방색전증","수술후 무기폐","흡인 폐렴","수술부위 감염"],"answer":5,"answerLabel":"⑤","answerPage":366,"explanation":"이 상황은 지방색전증에 대한 설명이다. 지방색전증은\n보통 하지의 장골에 외상성 손상을 입은 후 24~48시간에\n발생하며 발열, 의식상태 변화, 저산소증, 저탄산증, 폐포의\n충만성 병변이 폐 전반에 관찰된다."},{"id":"c08-q050","chapterId":8,"number":50,"page":266,"stem":"50세 여자가 급성 경추 신경근증과 흉추 5번의 추간판탈출증을 진단받았다. 이 환자에게\n가장 효과적인 중재는?","choices":["경추 견인","능동적 저항운동","스테로이드 정맥투여","수동적 관절범위 운동","경추 칼라(cervical collar)"],"answer":1,"answerLabel":"①","answerPage":366,"explanation":"추간판탈출증과 경추 신경근증의 치료적 중재는\n침상안정과 경추의 견인(cervical traction)을 포함한다.\n필요시 척수강에 스테로이드를 주입할 수 있으며 수술중재도\n고려될 수 있다."},{"id":"c08-q051","chapterId":8,"number":51,"page":266,"stem":"다음 중 골반의 안정성을 위한 고관절 외전근의 능력을 평가하기 위한 검사는?","choices":["Phalens test","Tinels sign","Trendelenburg test","Kernigs sign","Homans sign"],"answer":3,"answerLabel":"③","answerPage":366,"explanation":"트렌델렌버그(Trendelenburg) 검사는 고관절 측면에서\n안정성을 잡아주는 중둔근 검사이다. 환자가 한발로 서있을\n때 반대편 둔부의 골반선보다 지지하는 골반선이 올라가면\n양성으로 판단하며 지지하는 쪽 중둔근이 약화되었음을\n의미한다."},{"id":"c08-q052","chapterId":8,"number":52,"page":266,"stem":"심한 요통이 있는 환자의 감별진단으로 고려되어야 하는 것은?","choices":["간염","담석증","골수염","심근경색","소화성 궤양"],"answer":3,"answerLabel":"③","answerPage":366,"explanation":"요통을 호소하는 경우 고려해야할 질병은 골수염,\n신우신염, 악성종양, 대동맥류, 불안정성 척추골절 등이다."},{"id":"c08-q053","chapterId":8,"number":53,"page":267,"stem":"걸을 때 통증이 있어 절뚝거리게 되어 내원한 40세 남자가 대퇴골두의 무혈관성 괴사를\n진단받았다. 무혈관성 괴사를 초래하는 가장 흔한 요인은?","choices":["외상","알코올 중독","고지혈증","류마티스 관절염","스테로이드 복용"],"answer":1,"answerLabel":"①","answerPage":366,"explanation":"대퇴골두의 무혈관성 괴사를 초래하는 가장 흔한 원인은\n외상이다. 기타 원인으로는 알코올 섭취, 스테로이드 복용,\n방사선, 겸상적혈구성 빈혈 등이 포함된다."},{"id":"c08-q054","chapterId":8,"number":54,"page":267,"stem":"류마티스 관절염으로 장기간 스테로이드를 복용하고 있는 50대 여자가 일반 마취로 담낭\n절제술을 받기로 예정되어 있을 때 수술 전 시행해야 할 검사는?","choices":["심전도","심초음파","흉부 방사선촬영","스트레스 검사","경추방사선촬영"],"answer":5,"answerLabel":"⑤","answerPage":366,"explanation":"류마티스 관절염을 진단받고 오랫동안 치료하고 있는\n환자가 일반마취를 하려면 경추 방사선 촬영을 통해\n기관내삽관을 위한 목의 신전이 가능한 지를 수술 전 미리\n확인해야 한다."}]},{"id":9,"part":"PART II","partTitle":"전문실무영역","title":"소화기계","count":33,"startPage":269,"endPage":276,"questions":[{"id":"c09-q001","chapterId":9,"number":1,"page":269,"stem":"다음 중 급성 복부 둔상의 병인에 대한 설명으로 옳은 것은?","choices":["복부 둔상은 낙상, 폭행 또는 스포츠에 의해 발생할 수 있다.","둔상으로 인한 복부 상해는 24~48시간 동안 나타나지 않는다.","소장은 복부 둔상에 의해 가장 영향을 많이 받는 기관이다.","복부 둔상은 일반적으로 생명을 위협하지 않는다.","복부 출혈이 동반되는 경우 Cullen 징후는 나타나지 않는다"],"passage":"다음 지문을 읽고 질문에 답하시오(문제 1-6).\n최근 6 시간 이내에 복부와 몸통에 몽둥이로 구타를 당한 환자가 응급실을 통해 중환자실로 입원\n하였다. 중환자실 입실 직후 기관내삽관을 시행하였고. 활력징후는 혈압 80/42 mmHg, 맥박 132\n회堰. 체온 36.6℃이다. 환자는 몸에 여러 군데 타박상이 있고 Cullen 징후와 Gray Turner 징\n후가 관찰된다. 과거력으로 알코올 남용, 당뇨병. 고혈압이 있다.","answer":1,"answerLabel":"①","answerPage":367,"explanation":"몽둥이에 의한 복부 둔상은 국소부위에 큰 힘이 가해졌고,\n상해의 단계가 더 높아졌다. 복부에 발생하는 둔상의 원인\n두 가지는 낙상과 운동이다. 간과 비장이 다친 경우 잠시 동안\n불편할 수 있지만 24~48시간은 걸리지 않는다. 소장은 큰\n장막에 의해 잘 보호되고 비장과 간과 달리 속이 비어있는\n기관이다. 복부는 경직되기 전에 수 리터의 수분을 저장할\n수 있다. 복부의 내출혈이 오랫동안 감지되지 않으면 복부의\n외상이 생명을 위협할 수 있다."},{"id":"c09-q002","chapterId":9,"number":2,"page":269,"stem":"중환자실에서 환자에게 위 감압을 위하여 비위관을 적용하였음에도 불구하고 복부가 더\n단단해졌다면 의심되는 원인은?","choices":["탈장","장 파열","대량 내출혈","복벽의 연조직 부종","알코올 남용으로 인한 정상적인 복부하수(pendulous abdomen)"],"passage":"다음 지문을 읽고 질문에 답하시오(문제 1-6).\n최근 6 시간 이내에 복부와 몸통에 몽둥이로 구타를 당한 환자가 응급실을 통해 중환자실로 입원\n하였다. 중환자실 입실 직후 기관내삽관을 시행하였고. 활력징후는 혈압 80/42 mmHg, 맥박 132\n회堰. 체온 36.6℃이다. 환자는 몸에 여러 군데 타박상이 있고 Cullen 징후와 Gray Turner 징\n후가 관찰된다. 과거력으로 알코올 남용, 당뇨병. 고혈압이 있다.","answer":3,"answerLabel":"③","answerPage":367,"explanation":"복부 경직은 복부에서 대량 출혈에 대한 중요한 사정\n결과이다."},{"id":"c09-q003","chapterId":9,"number":3,"page":270,"stem":"중환자실로 환자를 이송하기 전에 응급실에서 급속 수액요법(rapid fluid resuscitation)을\n수행하였음에도 불구하고 저혈압이 지속되고 있다면 적절한 중재는?","choices":["승압제 투여를 준비한다.","수혈을 위해 혈액형과 교차적합검사(cross matching)를 시행한다.","혈색소와 적혈구용적률 검사를 수행한다.","급속 주입기로 환자가 정상혈압에 도달할 때까지 고장성 용액을 대체한다.","동맥혈가스검사를 실시한다."],"passage":"다음 지문을 읽고 질문에 답하시오(문제 1-6).\n최근 6 시간 이내에 복부와 몸통에 몽둥이로 구타를 당한 환자가 응급실을 통해 중환자실로 입원\n하였다. 중환자실 입실 직후 기관내삽관을 시행하였고. 활력징후는 혈압 80/42 mmHg, 맥박 132\n회堰. 체온 36.6℃이다. 환자는 몸에 여러 군데 타박상이 있고 Cullen 징후와 Gray Turner 징\n후가 관찰된다. 과거력으로 알코올 남용, 당뇨병. 고혈압이 있다.","answer":4,"answerLabel":"④","answerPage":367,"explanation":"수액으로 혈압이 교정되지 않으므로 수혈이 예상된다.\n수혈을 위해 혈액형 및 혈액 교차적합검사(cross matching)\n를 수행하여 환자 간호를 할 수 있다. 다음 단계는 간호사의\n사정에 대한 추가적인 검사가 가능하도록 의사에게 연락하는\n것이다."},{"id":"c09-q004","chapterId":9,"number":4,"page":270,"stem":"환자에게 삽입한 비위관에서 검붉은색 혈액이 지속적으로 나오는 것을 발견하여 응급 수\n술을 준비하고 있다. 이 출혈의 원인은?","choices":["복막염 (peritonitis)","하부 위장관 폐쇄","식도정맥류(esophageal varices)","종양neoplam)","위식도 역류"],"passage":"다음 지문을 읽고 질문에 답하시오(문제 1-6).\n최근 6 시간 이내에 복부와 몸통에 몽둥이로 구타를 당한 환자가 응급실을 통해 중환자실로 입원\n하였다. 중환자실 입실 직후 기관내삽관을 시행하였고. 활력징후는 혈압 80/42 mmHg, 맥박 132\n회堰. 체온 36.6℃이다. 환자는 몸에 여러 군데 타박상이 있고 Cullen 징후와 Gray Turner 징\n후가 관찰된다. 과거력으로 알코올 남용, 당뇨병. 고혈압이 있다.","answer":3,"answerLabel":"③","answerPage":367,"explanation":"식도정맥류는 일반적으로 과도한 알코올 섭취로 인하여\n영향을 받으며, 식도 조직이 약해져 가벼운 외상으로도\n출혈가능성이 높아진다. 알코올 섭취로 식도 벽이 얇아져\n외상이 거의 또는 전혀 없더라도 출혈이 발생한다."},{"id":"c09-q005","chapterId":9,"number":5,"page":270,"stem":"환자의 피부와 결막에 황달이 있는 것을 발견하였다면 황달의 가장 큰 원인은?","choices":["췌장염 (pancreatitis)","간부전(hepatic failure)","담석 (gallstones)","부신기능부전(adrenal insufficiency)","당뇨병"],"passage":"다음 지문을 읽고 질문에 답하시오(문제 1-6).\n최근 6 시간 이내에 복부와 몸통에 몽둥이로 구타를 당한 환자가 응급실을 통해 중환자실로 입원\n하였다. 중환자실 입실 직후 기관내삽관을 시행하였고. 활력징후는 혈압 80/42 mmHg, 맥박 132\n회堰. 체온 36.6℃이다. 환자는 몸에 여러 군데 타박상이 있고 Cullen 징후와 Gray Turner 징\n후가 관찰된다. 과거력으로 알코올 남용, 당뇨병. 고혈압이 있다.","answer":2,"answerLabel":"②","answerPage":367,"explanation":"황달은 체내 빌리루빈 제거능력 불능으로 인한 간부전\n또는 감염의 특징이다."},{"id":"c09-q006","chapterId":9,"number":6,"page":270,"stem":"급성 췌장염의 주요 병태생리학적 특징은?","choices":["췌장 전체 괴사","췌장 효소 결핍","췌장의 ス］가소화(autodigestion)","췌장의 다발성 종양","췌장의 인슐린 분비 증가"],"passage":"다음 지문을 읽고 질문에 답하시오(문제 1-6).\n최근 6 시간 이내에 복부와 몸통에 몽둥이로 구타를 당한 환자가 응급실을 통해 중환자실로 입원\n하였다. 중환자실 입실 직후 기관내삽관을 시행하였고. 활력징후는 혈압 80/42 mmHg, 맥박 132\n회堰. 체온 36.6℃이다. 환자는 몸에 여러 군데 타박상이 있고 Cullen 징후와 Gray Turner 징\n후가 관찰된다. 과거력으로 알코올 남용, 당뇨병. 고혈압이 있다.","answer":3,"answerLabel":"③","answerPage":367,"explanation":"췌장 내 췌장 효소의 활성화는 췌장의 자기용해 및 이로\n인한 염증과 괴사를 초래한다. 급성 췌장염에서 부분적으로\n괴사된 부분이 있을 수 있으나 췌장 전체 괴사는 나타나지\n않는다. 췌장효소의 결핍은 없다. 다발성 종양은 췌장염의\n합병증이지 초기 병리소견은 아니다."},{"id":"c09-q007","chapterId":9,"number":7,"page":270,"stem":"만성 알코올 남용과 정신상태 변화로 입원한 환자가 있다. 간호사는 환자의 필적이 초기\n입원 이후 변화됨을 발견했다. 이 환자에게 의심되는 질환은?","choices":["치매","췌장염","요붕증","간성 뇌증","만성 신부전증"],"answer":4,"answerLabel":"④","answerPage":367,"explanation":"필적의 악화는 간 질환의 초기 징후이다. 필적의 악화와\n더불어 정신상태, 혼란 그리고 졸림의 미묘한 변화는 간성\n뇌증의 후기 징후이다."},{"id":"c09-q008","chapterId":9,"number":8,"page":271,"stem":"급성 췌장염을 진단받은 환자의 혈압이 87/54 mmHg일 때 가장 우선적인 중재는?","choices":["침상머리를 올린 상태로 유지한다.","구강으로 췌장효소를 제공한다.","비위관(nasogastric tube)을 삽입한다.","생리식염수를 정맥주입 한다","상체를 다리보다 높게 유지한다."],"answer":4,"answerLabel":"④","answerPage":367,"explanation":"등장성 용액은 혈액량을 증가시키고 저혈압을 교정한다.\n침상머리를 높이면 혈압이 더 낮아질 수 있다. 췌장효소\n보충은 급성기 이후 단계에서 중요하다. 우선순위는 저혈압을\n교정하는 것이다. 위장감압술은 위장관을 쉬게 할 수는 있지만\n혈압을 개선하는 것이 우선순위이다."},{"id":"c09-q009","chapterId":9,"number":9,"page":271,"stem":"약 4달 전에 C형 간염에 노출된 가능성이 있다고 걱정하는 43세 여자의 검사결과가 다\n음과 같다. 이 환자의 상태에 대한 설명으로 옳은 것은?\nHBsAg Negative\nanti-/-/Bc Negative\nanti-HBs positive\nanti-HCV Nonreactive\nHCV RNA Not detectable","choices":["환자는 B형 간염과 C형 간염이다","환자는 C형 간염은 아니지만 B형 간염 항체를 가지고 있다.","환자는 B형 간염은 아니지만 C형 간염일 수 있다.","환자의 B형 간염 상태를 확정하기 위한 추가 검사가 필요하다.","간염의 위험이 전혀 없다."],"answer":2,"answerLabel":"②","answerPage":367,"explanation":"이 환자는 C형 간염에 감염되지 않았다. HCV 항체\n검사는 감염 초기 선별 검사이다. 그러나 검출 가능한 항체는\n일반적으로 노출 후 2~6개월 사이에 발생한다. 음성이지만\n환자는 노출된 지 6개월이 안되어 확실한 검사(HCV RNA)\n가 필요하다. HCV RNA 가 음성이기 때문에 환자는 C형\n간염이 아니다. 전형적으로 HCV RNA 유무를 검출하기\n위한 후속 평가는 비반응성 HCV 항체검사 이후에는\n불필요하다. 노출된 지 6개월이 안되었기 때문에 HCV RNA\n에 대한 검사가 필요한 HCV 항체가 검출되지 않을 수 있다.\n이 환자는 HCV RNA 가 검출되지 않았다. 이것은 환자가\nHCV 감염에 대한 진음성임을 확인시켜 준다. B형 간염\n핵항체가 음성이고, B형 간염 표면항체 양성은 B형 간염에\n대한 면역성을 나타낸다."},{"id":"c09-q010","chapterId":9,"number":10,"page":271,"stem":"서혜부 탈장이 의심되는 환자를 검진하려고 한다. 이 환자가 취하게 할 자세는?","choices":["선 자세","엎드린 자세","옆으로 누운 자세","쪼그리고 앉은 자세","똑바로 누운 자세"],"answer":1,"answerLabel":"①","answerPage":367,"explanation":"환자는 선 자세로 검진을 받아야 한다. 환자가 배에\n아래로 힘을 주고, 기침하고, 또는 검진 동안 힘을 주도록\n한다. 남성에게 탈장이 훨씬 더 흔하지만 여성에게도 발생할\n수 있다. 남성의 경우 환자는 서 있도록 한다. 검진자는 2,\n3번째 손가락을 넣어 탈장이 되어 나온 바깥 구멍에 음낭을\n넣는다. 환자가 기침을 할 때 부드러운 느낌이 검사자의\n손가락에 닿아 탈장을 쉽게 확인할 수 있다."},{"id":"c09-q011","chapterId":9,"number":11,"page":271,"stem":"다음은 환자의 검사 결과이다. 이 환자의 상태에 대한 설명으로 옳은 것은?\nHBsAg Positive\nanti-HBc Positive\nIgM anti-HBc Positive\nanti 나圾 Negative","choices":["급성 B형 간염이나","B형 간염의 면역이 있다","B형 간염의 면역이 없다.","B형 간염 보균자 이吐","추가적인 자료가 필요하다."],"answer":1,"answerLabel":"①","answerPage":367,"explanation":"B형 간염 표면항원이 양성이고 IgM 양성은 환자가 급성\nB형 간염임을 의미한다. 양성이 되는 첫 번째 혈청학적 마커는\n표면항원이다. 표면항원은 B형 간염에 노출된 후 3-4주에\n양성이 될 수 있다. IgM 양성은 급성 감염을 의미한다."},{"id":"c09-q012","chapterId":9,"number":12,"page":272,"stem":"급성 담낭염 환자에 대한 설명으로 옳은 것은?","choices":["검사대에서 좌우로 구른다.","아파보이고 열이 난다.","고•령 환자는 Murphys sign이 나타날 가능성이 더 높다.","대부분 담석이 담관을 막을 때까지 무증상이다.","소변량이 감소한다"],"answer":2,"answerLabel":"②","answerPage":367,"explanation":"급성 담낭염 환자는 일반적으로 우상사분면 또는\n상복부에 복통을 호소한다. 대부분 오심을 호소한다. 담낭염은\n움직일 시 악화되는 복막염증과 관련 있기 때문에 검사대에\n가만히 누워있다. 고령 환자는 Murphys sign이 나타나지\n않는 경우가 많아 진단이 지연되기 때문에 급성 담낭염의\n합병증을 경험할 가능성이 크다. 무증상의 환자는 급성\n담낭염이 아닌 담석증이다."},{"id":"c09-q013","chapterId":9,"number":13,"page":272,"stem":"85세 여자가 만성 변비가 있으며 건강사정 결과가 다음과 같다. 이 환자의 변비를 초래한\n대표적 원인은?\n• 과거력: 고혈압. 골다공증, 골관절염. 과민성 방광\n• 현재 복용 약물: amlodipine 5 mg. oxybutynin 2.5 mg. naproxen 375 mg, Prevacid\n30 mg. calcium and vitamin D 보충제","choices":["부적절한 수분 섭취","고령으로 활동저하","복용약물","부적절한 섬유소 섭취","방광 팽만"],"answer":3,"answerLabel":"③","answerPage":367,"explanation":"모두 85세의 고령 환자의 변비에 영향을 미칠 수 있지만,\n환자는 변비 위험을 증가시키는 여러 가지 약물을 복용하고\n있다. 칼슘통로차단제인 암로디핀(amlodipine)은 장내\n운동성을 저하시킨다. 옥시부티닌oxybutynin)은 항콜린\n성질이 있어 장에서 점액을 건조시킨다. NSAID 인 나프록센\n(naproxen)은 프로스타글란딘을 억제함으로써 변비를\n일으킨다. 프로톤 펌프 억제제(Proton pump inhibitors)와\n칼슘 보충제는 일반적으로 변비와 관련이 있다."},{"id":"c09-q014","chapterId":9,"number":14,"page":272,"stem":"장폐색 환자의 급성기 간호에서 가장 주의해야 할 사항은?","choices":["흡인(aspiration)","고칼륨혈증(hyperkalemia)","저혈량증(hypovolemia)","대사성 알칼리증(metabilic alkalosis)","고체온증"],"answer":3,"answerLabel":"③","answerPage":367,"explanation":"혈관에서 혈관 밖의 공간으로 액체성분의 이동은 장\n폐색의 생명을 위협하는 현상이며, 일반적으로 소장 폐색에서\n더 심하다. 이차적으로 복부 팽만이 있다면 aspiration이\n발생할 수 있지만 고칼륨혈증, 대사성 알칼리증은 장폐색과\n관련이 없다."},{"id":"c09-q015","chapterId":9,"number":15,"page":272,"stem":"50세 남자가 복통을 호소하며 내원하였다. 내원 당시 미열과 함께 둔탁하고 약한 장음이\n들렸다 입원 후 통증이 더 심해지고, 움직임이 악화되었으며, 장음이 들리지 않고 복부\n강직이 있으며, 복부를 누를 때보다 손을 뗄 때 통증이 더 심하다. 이 환자에게 우선적인\n중재는?","choices":["마약성 진통제(opiate) 용량 증량","수술 준비","비위관 삽관","항생제 치료","복막천자"],"answer":2,"answerLabel":"②","answerPage":368,"explanation":"임상 특성은 복막염 중 하나이다. 문제를 외과적으로\n해결하면 사태 악화를 예방할 수 있다. 환자가 다른 세 가지\n중재를 필요로 할 수 있으나 급성 문제를 확실하게 치료하지는\n못한다."},{"id":"c09-q016","chapterId":9,"number":16,"page":273,"stem":"치질과 관련된 직장출혈에 대한 일반적인 설명으로 옳은 것은?","choices":["닦을 때 혈액이 묻어남","소량의 적갈색 출혈","많은 양의 활동성 선홍빛 출혈","변에 많은 혈전과 점액이 섞임","짙은 갈색에서 검은 색으로 정상적인 변과 섞여 있음"],"answer":1,"answerLabel":"①","answerPage":368,"explanation":"치열에서 직장 출혈이 나타나면 일반적으로 닦을 때\n혈액이 몇 방울 묻어나며 출혈이 오래 발생하지 않는다."},{"id":"c09-q017","chapterId":9,"number":17,"page":273,"stem":"62세 남자가 최근 며칠 대변에 검붉은 피가 조금씩 보여 내원하였다. 신체검진에서 직장\n종양이 아닌 외치질이 있고 검진 손가락에 짙은 갈색의 변이 약간 보였다. 잠혈 검사는 양\n성이고 혈액검사 상 소적혈구성 저색소성 빈혈(microcytic hypochromic anemia)0| 있었\n다. 이 환자에게 가장 적절한 중재는?","choices":["항문경 검사를 시행한다.","환자에게 장운동 후 좌욕을 하도록 권한다.","대장내시경을 통해 소화기질환을 치료한다.","이중조영바륨관장을 지시한다.","육류를 제한한다."],"answer":3,"answerLabel":"③","answerPage":368,"explanation":"지속적인 출혈, 대변과 혼합된 어두운 혈액 또는 직장\n출혈과 관련된 빈혈 증상은 결장암 또는 다른 진단을 위한\n대장내시경 검사의 근거이다."},{"id":"c09-q018","chapterId":9,"number":18,"page":273,"stem":"72세 여자가 지난 24시간 동안 복부 경련과 구토를 보여 내원하였다. 충수염이 의심되는\n환자를 사정하면서 고려해야 할 것은?","choices":["충수의 해부학적 위치에 따라 증상이 다를 수 있다.","고령 환자가 급성 복통을 호소하는 가장 흔한 질환이다.","복통이 시작되기 전의 구토는 자주 관찰된다.","증상이 골반 염증성 질환의 증상과 크게 다르다.","Tunner 징후를 확인한다."],"answer":1,"answerLabel":"①","answerPage":368,"explanation":"급성 충수염이 가장 많이 발병하는 시기는 10~30\n세이다. 신생아나 고령 환자에게 흔하지 않기 때문에 의료진은\n맹장염의 가능성을 고려하지 않아 맹장염 진단의 지연이\n대개 발생한다."},{"id":"c09-q019","chapterId":9,"number":19,"page":273,"stem":"복부 촉진에서 반동 압통이 있을 때 다음 중 양성으로 나타나는 징후는?","choices":["Markels sign","Murphys sign","Blumbergs sign","Nikolshys sign","Rombergs sign"],"answer":3,"answerLabel":"③","answerPage":368,"explanation":"반동 압통은 깊이 눌렀다 뗄 때 통증이 심하고 급성\n충수돌기염 진단에 도움이 된다. 반동 압통이 있는 것은\nBlumbergs sign 양성이다."},{"id":"c09-q020","chapterId":9,"number":20,"page":273,"stem":"47세 여자가 12시간 전부터 시작된 어깨로 방사되는 우상복부 복통과 열, 오한을 호소하\n며 내원하였다. 환자는 과거에도 유사한 증상이 약하게 있었다고 하며, 복부 검진 시 우\n상복부 압통이 있다 이 환자에게 의심되는 상태는?","choices":["간세포암","급성 담낭염","급성 간염","담석증","췌장염"],"answer":2,"answerLabel":"②","answerPage":368,"explanation":"급성 담낭염은 거의 담석에 의해 유발되는 담낭의 급성\n염증질환이다. 우상복부 또는 상복부 통증과 압통이 구토와\n함께 나타나고 경우에 따라 열이 난다. 구토는 종종\n일시적으로 증상이 완화된다. 눌렀다 뗄 때 유발되는\n우상복부의 촉진 시 압통(Murphy’s sigrO은 거의 대부분\n나타난다. 촉진 시 담낭이 만져지는 경우는 거의 없다. 약\n25~50%는 어느 정도의 황달이 있다."},{"id":"c09-q021","chapterId":9,"number":21,"page":274,"stem":"급성 담낭염에서 일반적으로 볼 수 있는 검사결과는?","choices":["혈청 크레아티닌 증가","알칼리인산분해효소(alkaline phosphatase) 증가","백혈구 감소","AST 감소","아밀라아제 감소"],"answer":2,"answerLabel":"②","answerPage":368,"explanation":"Tot기 WBC 12,000~20,000/mm3의 백혈구 증가증이\n일반적으로 나타나고, hepatic enzyme 수치가 상승한다."},{"id":"c09-q022","chapterId":9,"number":22,"page":274,"stem":"담낭염 환자에게 나타나는 가장 흔한 중증 합병증은?","choices":["담낭의 선종(adenocarcinoma)","담낭농증(gallbladder empyema)","간부전","췌장염","담즙 과다생성"],"answer":4,"answerLabel":"④","answerPage":368,"explanation":"담석 질환의 합병증은 췌장염과 패혈증이다."},{"id":"c09-q023","chapterId":9,"number":23,"page":274,"stem":"급성 담낭염 환자에게 가장 많이 관찰되는 증상은?","choices":["발열","구토","황달","촉진되는 담낭","좌상복부 통증"],"answer":2,"answerLabel":"②","answerPage":368,"explanation":"급성 담낭염은 거의 담석에 의해 유발되는 담낭의 급성\n염증질환이다. 우상복부 또는 상복부 통증과 압통이 구토와\n함께 나타나고 경우에 따라 열이 난다. 구토는 종종\n일시적으로 증상이 완화된다. 눌렀다 뗄 때 유발되는\n우상복부의 촉진 시 압통(Mur아ッ‘s sign)은 거의 대부분\n나타난다. 촉진 시 담낭이 만져지는 경우는 거의 없다. 약\n25~50%는 어느 정도의 황달이 있다."},{"id":"c09-q024","chapterId":9,"number":24,"page":274,"stem":"다음 중 결장암 발병 위험을 높이는 요인은?","choices":["50세 이하","폴립증(polyposis) 가족력","BRCA 유전자","장기간 아스피린 치료","CA 19-9 상승"],"answer":2,"answerLabel":"②","answerPage":368,"explanation":"위험인자는 염증성 장질환 과거력궤양성 장염과 크론병),\n종양 과거력 50세 이사 결장암 가족력 폴립증 가족력이다.\n추가로 유전적 비용종증 직장암(hereditary nonpolyposis\ncolorectal cancer； HNPCC)으로 알려진 상염색체 우성이 있다."},{"id":"c09-q025","chapterId":9,"number":25,"page":274,"stem":"68세 남자가 급성 대장게실염이 의심된다. 이 환자의 진단을 뒷받침 할 수 있는 적절한\n검사는?","choices":["X-ray","초음파검사","조영제 사용 CT scan","바륨 관장","대장내시경"],"answer":5,"answerLabel":"⑤","answerPage":368,"explanation":"영상 검사는 진단을 뒷받침하고 질병의 중증도 또는\n합병증을 사정하기 위해서 시행된다. 조영제를 사용한 복부\nCT scan은 장벽이 두꺼워지는 상태를 확인하는 데 도움이\n된다."},{"id":"c09-q026","chapterId":9,"number":26,"page":275,"stem":"다음 소화성궤양치료제(H2RA) 중 phenytoin 및 theophylline과 상호작용을 유발할 가능\n성이 가장 큰 약물은?","choices":["cimetidine","famotidine","nizatidine","ranitidine","omeprazole"],"answer":1,"answerLabel":"①","answerPage":368,"explanation":"Cimetidine은 cytochrome P-450을 억제하는\n유일한 H2RA로 많은 약물의 대사를 지연시킨다. 결과적으로\ncimetidine, warfarin, diazepam, phenytoin,\nquinidine, carbamazepine, theophylline,\nimipramine 및 기타 약물 간의 상호작용이 발생할 수 있다."},{"id":"c09-q027","chapterId":9,"number":27,"page":275,"stem":"Cyclooxygenase-1 (C0X-1)의 작용기전에 포함되는 것은?","choices":["염증 반응","통증 전달","위 보호 점막층 유지","신장 소동맥 수죽","위장관 운동 저하"],"answer":3,"answerLabel":"③","answerPage":368,"explanation":"Cyclooxygenase-1 (COXT) 은적절한 신장관류와\n위 점막층 보호 및 유지를 포함한 여러 기전을 통한 장기의\n건강에 영향을 미친다."},{"id":"c09-q028","chapterId":9,"number":28,"page":275,"stem":"다음 중 역류성식도염 환자에게 처방되는 프로톤 펌프억제제(ppi)에 속하는 약물은?","choices":["loperamide","metoclopramide","nizatidine","lansoprazole","ranitidine"],"answer":4,"answerLabel":"④","answerPage":368,"explanation":"프로톤 펌프 억제제(PPis)에는 omeprazole\n(Prilosec*), esomeprazole (Nexium*1) 및 lansoprazole\n(Prevacid*) 가 포함된다."},{"id":"c09-q029","chapterId":9,"number":29,"page":275,"stem":"다음 중 위궤양치료제인 프로톤 펌프억제제(ppi)를 장기간 사용했을 때 예상되는 위험은?","choices":["변비","대장출혈","오심, 구토","철분의 흡수 증가","골절"],"answer":5,"answerLabel":"⑤","answerPage":368,"explanation":"PPI 사용은 철분, 비타민印? 및 영양소의 흡수 감소와\n관련이 있다. 또한 장기간 PPI 사용은 관절, 척추, 손목 및\n팔뚝 골절의 위험을 증가시킨다. 이는 PPI 사용 중 칼슘과\n마그네슘의 흡수 감소와 관련이 있다. 특히 입원 또는\n장기요양시설에서 만성 PPI 치료를 받는 다양한 건강 문제를\n가진 경우 폐렴과 C. diffi이e c 이itis가 발생할 위험이 높다."},{"id":"c09-q030","chapterId":9,"number":30,"page":275,"stem":"58세 남자가 최근 항고혈압제를 복용하기 시작했는데 심한 속쓰림 증상을 호소한다. 다\n음 중 복용한 것으로 추정되는 약물은?","choices":["atenolol","trandolapril","amlodipine","losartan","verapamil"],"answer":3,"answerLabel":"③","answerPage":368,"explanation":"progesterone/progestin, theophylline, calcium\nchann이 차단제, 니코틴을 포함한 약물을 복용하면\n위괄약근의 압력이 낮아지고 GERD 가 악화될 수 있다.\nAmlodipine은 항고혈압제로 c 기cium 아iann이 차단제\n이다."},{"id":"c09-q031","chapterId":9,"number":31,"page":276,"stem":"57세 남자에게 Barrett 식도를 평가하기 위해 시행할 적절한 검사는?","choices":["H. pylori testing","CT scan","상부 위내시경 및 생검","바륨연하검사","바륨관장"],"answer":3,"answerLabel":"③","answerPage":368,"explanation":"Barrett esophagus 위험이 있는 환자는 상부 위장관\n내시경 검사를 시행하고 생검을 시행해야 한다. Barrett\nesophagus는 오랫동안 식도선암의 위험인자로 언급되어\n왔으나 이전만큼 심각하게 여겨지지는 않는다."},{"id":"c09-q032","chapterId":9,"number":32,"page":276,"stem":"다음 중 c 형 간염 감염에 대한 설명으로 옳은 것은?","choices":["일반적으로 황달, 열, 심한 간비대를 나타낸다.","의료진 중 특히 간호사에게 주로 발견된다.","급성 C형 간염 환자의 적어도 50% 는 만성 감염으로 진행된다.","인터페론 치료가 지속적으로 효과가 있다.","타액을 통해 전파된다."],"answer":3,"answerLabel":"③","answerPage":368,"explanation":"오심, 식욕부잔, 열, 권태감, 복부통증, 황달은 전형적인\nA형 간염의 증상이다. ©형 간염은 혈액과 체액 교환을 통해\n전염된다. HCV 감염의 50% 이상이 바늘 공유와 함께\n주사제 사용으로 인해 발생하며 기타 원인으로는 문신,\n피어싱 또는 약하게 살균된 장비 사용 등이 있다. C형 간염\n환자의 50~80%는 만성 감염으로 진행된다. 현재, 선택적\n항바이러스제를 포함하거나 포함하지 않은 pegylated\ninterferon 치료가 만성 C형 간염 환자의 완화를 유도하는\n임상적 유용성이 나타났다. 다른 건강문제, 바이러스 유전자형\n등을 포함한 여러 요인에 따라 반응이 다르다."},{"id":"c09-q033","chapterId":9,"number":33,"page":276,"stem":"췌장암이 의심되는 환자를 사정할 때 예상되는 결과는?","choices":["Cullens sign 양성","등 중앙 또는 등 아래부분으로 방사되는 상복부 통증","복부 정중앙에서 만져지는 덩어리","폐쇄근 징후(obturator sign)와 요근징후(psoas sign) 양성","바빈스키반사 양성"],"answer":2,"answerLabel":"②","answerPage":368,"explanation":"췌장암 환자는 대부분 복통, 체중감소, 식욕부진,\n오심, 구토 증상이 있다. 통증은 일반적으로 갑자기 시작되며,\n통증 정도가 심하고 대개는 걷거나 똑바로 누울 때 심해지고\n앉거나 앞으로 기울일 때 완화된다."}]},{"id":10,"part":"PART II","partTitle":"전문실무영역","title":"내분비계","count":37,"startPage":277,"endPage":286,"questions":[{"id":"c10-q001","chapterId":10,"number":1,"page":277,"stem":"당뇨성 케톤산증(DKA) 환자의 동맥혈가스분석(ABG) 결과가 다음과 같을 때 적절한 간\n호중재는?\n• pH 6.8\n• PaO2 92 mmHg\n• PCO2 35 mmHG\n• HCO315 mEq/L","choices":["비강캐뉼라로 산소 2 L/min를 적용한다.","매 시간마다 간이혈당검사를 시행한다.","생리식염수 200 mL에 중탄산나트륨 100 mEq을 투여한다.","두 시간 후에 ABG를 다시 확인한다.","분당 18회 미만의 과소호흡을 유도한다."],"answer":3,"answerLabel":"③","answerPage":369,"explanation":"DKA 치료에서 우선치료는 수액공급이며, 중탄산염의\n투여는 거의 요구되지 않으나, 임상지침에서는 pH가 6.9\n미만으로 낮은 경우 DKA 대상자에게 중탄산나트륨을\n등장성수액과 혼합하여 투여하도록 권장한다. 산소 보충은\nDKA 대상자의 산소포화도를 향상시키는 데 도움을 주는\n중재이므로 오답이다. 시간당 간이혈당검사는 혈당을\n모니터하는 것이므로 오답이다. ABG를 자주 그리고\n연속적으로 확인하는 것은 산염기 불균형을 모니터할 때\n필요하므로 오답이다. 과소호흡은 산증 개선에 도움이 되지\n않는다."},{"id":"c10-q002","chapterId":10,"number":2,"page":277,"stem":"당뇨성 케톤산증 환자의 인슐린 정맥주사를 인슐린 피하주사로 전환할 때 우선적으로 고\n려해야 하는 것은?","choices":["인슐린 피하주사를 시작한 후 1 ~2시간 동안 정맥주사 인슐린을 유지한다.","24시간 동안 30분마다 혈당을 확인한다.","인슐린 피하주사를 투여하자마자 인슐린 정맥주입을 중단한다.","환자의 경련 징후를 면밀히 모니터한다.","포도당 용액을 정맥으로 유지한다."],"answer":1,"answerLabel":"①","answerPage":369,"explanation":"SC 인슐린(장기지속형)을 투여한 후 1-2시간 동안 IV\n인슐린(단기형)을 계속 투여하면 단기형 IV인슐린을 중단하기\n전에 장기지속형 인슐린이 최대효과를 나타내어 고혈당을\n예방할 수 있다. SC 인슐린으로 전환하는 DKA 대상자는\n30분마다 혈당수치 확인을 하지 않고 혈당 측정 횟수를\n줄이며, 장기지속형 SC 인슐린이 최대치에 도달하기 전에\nIV인슐린을 중단하면 고혈당을 유발하므로 3번은 오답이다.\nSC 인슐린으로 전환하는 DKA 대상자는 안정적이며 경련에\n대한 모니터가 필요하지 않으며, 포도당용액을 정맥으로\n유지할 필요가 없다."},{"id":"c10-q003","chapterId":10,"number":3,"page":278,"stem":"심한 저혈당으로 의식이 저하되어 반응이 없는 환자에게 적절한 중재는?","choices":["물 25 mL에 50 g 포도당 용액을 정맥주사 하고 한 시간 후 재사정한다","치즈와 크래커를 제공하고 15분 후에 재사정한다.","물 50 mL에 25 g 포도당 용액을 정맥주사하고 30분 후 재사정한다.","젤리 10개를 제공하고 6분 후 재사정한다","30분간 지켜보다가 재사정한다."],"answer":3,"answerLabel":"③","answerPage":369,"explanation":"③번은 정확한 포도당 정맥주사의 용량을 설명하고 있고,\n또한 포도당 수치가 다시 떨어지지 않도록 확인하는 재사정\n단계를 포함하므로 정답이다. ①번의 용량은 너무 고농도이다.\n대상자는 반응이 없기 때문에 자발적인 구강 섭취가\n불가능하므로 ②번과 ④번은 오답이다."},{"id":"c10-q004","chapterId":10,"number":4,"page":278,"stem":"뇌종양을 진단받고 중환자실에 입원한 30세 여자가 물을 지나치게 많이 섭취하는 것이\n관찰되었다. 간호사는 환자의 물병을 6시간 동안 8번이나 채웠으며, 지난 24시간의 섭취\n량 및 배설량 상에서 환자의 배뇨량은 2아_를 초과하였다. 이 환자에게 의심되는 상태는?","choices":["탈수","요붕증(diabetes insipidus)","항 이뇨 호르몬분비이상증후군 (SIADH)","급성 부신기능부전증(acute adrenal insufficiency)","고혈당성고삼투압증후군"],"answer":2,"answerLabel":"②","answerPage":369,"explanation":"이 경우는 특발성 요붕증이다. 환자는 ADH 분비가\n억제되어 다뇨를 유발하며, 과도한 양의 물을 마시게 된다."},{"id":"c10-q005","chapterId":10,"number":5,"page":278,"stem":"고혈당성고삼투압증후군(HHS) 환자에서 고혈당 이외에 다음 중 HHS와 관련 있는 결과는?","choices":["케톤뇨증 없음","혈청 삼투압 감소","아세톤 호흡","신경학적 변화 없음","소변량 감소"],"answer":1,"answerLabel":"①","answerPage":369,"explanation":"HHS에서 일반적으로 이ucose >400 mg/dL이고,\n케톤뇨증이 적거나 없다. HHS에서 심한 탈수로 인하여 혈중\n삼투압이 상승되고, 아세톤 호흡은 HHS가 아닌, DKA 에서\n관찰되는 증상이며 , 심한 신경학적 이상은 전형적으로 HHS\n에서 나타나고, DKA 에서는 드물다."},{"id":"c10-q006","chapterId":10,"number":6,"page":278,"stem":"최근 항암치료를 시작한 악성 폐암 환자에게 현재의 건강 상태와 치료요법으로 인해 나\n타날 위험이 높은 질환은?","choices":["쿠싱증후군(Cushing syndrome)","항 이뇨 호르몬분비이상증후군 (SIADH)","애디슨 병(Addison disease)","갑상선 중독증(thyroid storm)","요붕증(DI)"],"answer":2,"answerLabel":"②","answerPage":369,"explanation":"과도한 ADH 생산 또는 활용은 악성종양, 중추신경계\n장애 및 이러한 상태를 치료하는 데 사용되는 약물에서\n나타난다."},{"id":"c10-q007","chapterId":10,"number":7,"page":278,"stem":"항이뇨호르몬분비이상증후군(SIADH) 환자의 치료 및 간호로 옳은 것은?","choices":["식이섭취량을 면밀히 모니터한다.","Democlocycline, lithium, dilantin을 투여한다.","수분 정체를 위해서 저장성 식염수를 주입한다.","BUN 과 Creatinine 수치를 모니터한다.","바소프레신을 투여한다."],"answer":2,"answerLabel":"②","answerPage":369,"explanation":"Demo이。c^line, lithium, dilantin은 혈청 삼투압을\n증가시키고, 발작 위험을 감소시키며, 과도한 fluid의 제거를\n증가시키는 고장성 용액과 제공할 때, 소변 농축을 예방한다."},{"id":"c10-q008","chapterId":10,"number":8,"page":279,"stem":"항이뇨호르몬분비이상증후군(SIADH)에서 ADH의 과다 분비로 인해 나타나는 결과는?","choices":["저혈량증(hypovolemia)","고혈량증(hypervolemia)","저칼슘혈증(hypoclacemia)","고요산혈증(hyperuricemia)","고나트륨혈증(hypcmatrcmia)"],"answer":2,"answerLabel":"②","answerPage":369,"explanation":"ADH의 과다분비는 고혈량증으로 알려진 혈중 과도한\n정체 또는 과부하를 야기한다."},{"id":"c10-q009","chapterId":10,"number":9,"page":279,"stem":"고혈당성고삼투압증후군(HHS)이 있는 환자에게 나타나는 징후는?","choices":["과다호흡","저체온","말초부종","빈맥","고혈압"],"answer":4,"answerLabel":"④","answerPage":369,"explanation":"고혈당성고삼투압증후군(HHS)는 빈맥, 혈당 증가,\n고삼투압을 야기한다."},{"id":"c10-q010","chapterId":10,"number":10,"page":279,"stem":"당뇨신장병(diabetic nephropathy)을 확인하는 가장 적절한 검사는?","choices":["크레아티닌청소율(creatinine clearance)과 사구체여과율(eGFR)","소변의 알부민과 크레아티닌 비율과 사구체여과율","미세알부민뇨(microalbuminuria)","혈청 크레아티닌","혈청 알부민"],"answer":2,"answerLabel":"②","answerPage":369,"explanation":"2017 ADA (American Diabetes Association) 당뇨병\n가이드라인은 2형 당뇨병 환자에게 적어도 1 년에 한 번\n소변알부민과 크레아티닌비율 및 사구체여과율 검사를\n권장한다. 이는 진단받지 않은 당뇨병성신증에 대한 적절한\n선별 검사이다. 이전에는 미세알부민뇨가 통상적이 었다."},{"id":"c10-q011","chapterId":10,"number":11,"page":279,"stem":"신경과민과 체중감소를 호소하는 38세 여자의 혈액검사 결과가 다음과 같다. 식이 섭\n취량이나 운동 수준은 변화가 없다고 한다. 다음 중 가장 의심되는 상태는?\n• TSH： 0.01 mIU/L (Normal values : 0.4-3.8 mIU/L)\n• Free T4： 6 ng/dL (Normal val니es : 0.8-2.8 ng/dL)\n• Free T3* 205 ng/dL (Normal values : 70-205 ng/dL)","choices":["갑상선기능저하증","갑상선기능항진증","무증상 갑상선기능항진증","무증상 갑상선기능저하증","갑상선중독증"],"answer":2,"answerLabel":"②","answerPage":369,"explanation":"갑상선기능항진증은 일반적으로 20~40대 중반\n여성에게서 진단된다. TSH 감소와 T4 또는 T3 의 상승은\n갑상선기능항진증의 특징이다. 불안, 일일 섭취량과\n운동수준에 맞지 않는 체중 감소, 심계항진, 떨림은\n갑상선기능항진증을 진단받은 젊은 환자에게 나타나는\n일반적인 증상이다. 심방세동과 같은 심한 심혈관 증상은\n갑상선기능항진증이 있는 노년층(〉66MI)에게 가장 흔한\n결과이다. 무증상 갑상선기능항진증은 TSH 수치가 감소하고,\nT4 또는 T3 수치는 정상이다. 낮은 TSH 는 갑상선기능저하증\n증상이아니다."},{"id":"c10-q012","chapterId":10,"number":12,"page":280,"stem":"주 2회 측정한 공복혈당수치가 각각 ⑵ mg/dL, 136 mg/dL인 환자가 이것이 어떤 의미\n인지 묻는다면 가장 적절한 설명은?","choices":["혈당수치가 정상입니다.","1 형 당뇨병입니다.","2형 당뇨병입니다.","혈당수치가 비정상적입니다.","진단을 위해 당화혈색소(Hb A1C)검사가 요구됩니다."],"answer":5,"answerLabel":"⑤","answerPage":369,"explanation":"이 환자의 혈당 수치는 상승되어 있다. 한 결과(100T25\nmg/dL)는 손상된 공복혈당수치이고, 다른 결과(126 mg/\ndL 이상)는 2형 당뇨병의 가능성이 있다. 진단을 확인하기\n위한 추가적인 검사가 수행되어야 한다. 당화혈색소(Hb\nA1C) 검사는 확진을 위한 유용한 검사이다. Hgb A1C\n결과가 6.5% 이상 시 2형 당뇨병을 확진한다. Hb A1C가\n5.7~6.4%는 공복혈당장애라 할 수 있다."},{"id":"c10-q013","chapterId":10,"number":13,"page":280,"stem":"당뇨병이 있는 55세 여자의 공복 지질과 Hb서C 결과가 다음과 같다. 이 환자의 지질수\n치와 Hgb A1C의 관계에 대한 설명으로 옳은 것은?\n• LDL Cholesterol： 120 mg/dL\n• HDL Cholesterol: 45 mg/dL\n• Total Cholesterol: 200 mg/dL\n• Triglycerides： 309 mg/dL\n• Glycosylated Hemoglobin (Hb A1C): 9.2%","choices":["특별한 관련이 없다.","LDL은 Hb A1C가 증가함에 따라 증가할 것이다.","Hb A1C가 감소됨에 따라 triglycerides가 감소한다.","HDL이 증가함에 따라 Hb A1C가 감소될 것이다.","Hb A1C가 증가함에 따라 Total 사lolester이이 감소한다."],"answer":3,"answerLabel":"③","answerPage":369,"explanation":"트리글리세라이드 상승에 영향을 미치는 두 가지 요인은\n혈당수치 상승과 과도한 음주이다. 트리글리세라이드와\nHgb A1Cフト 높은 당뇨병 환자는 대개 Hgb A1C가\n정상화되면서 트리글리세라이드가 증가할 수 있다."},{"id":"c10-q014","chapterId":10,"number":14,"page":280,"stem":"2형 당뇨병을 가장 빨리 진단할 수 있는 혈당 이상은?","choices":["식후 혈당수치 상승","야간 고혈당","공복혈당 상승","비정상적인 Hgb A1C 수치","새벽 저혈당"],"answer":1,"answerLabel":"①","answerPage":369,"explanation":"초기 혈당 이상은 식후 혈당의 증가이다. 당뇨병 발병\n초기에 혈당 수치는 식후에 비정상적으로 증가한다. 그 후\n몇 시간 동안 환자가 음식을 섭취하지 않는다면 다양한\n생리학적 기전을 통해 혈당 수치는 다시 정상범위로 떨어질\n것이다. 이는 혈당 수치가 지속적으로 상승되기 전에 수개월\n또는 수년 동안 발생할 수 있으며 장기간 금식에도 정상으로\n돌아가지 않는다. 혈당 수치가 상승되고 상승된 상태로\n유지되면 환자는 대개 피로, 갈증, 빈뇨, 배고픔과 같은\n증상을 경험한다."},{"id":"c10-q015","chapterId":10,"number":15,"page":281,"stem":"levothyroxine을 복용 중인 45세 갑상선기능저하증 환자의 검사결과가 다음과 같다. 이\n때 적절한 중재는?\n• TSH： 32.7 mlll/L (Normal values： 0.4-3.8 mlll/L)\n• Free T4： 0.09 ng/dL (Normal values： 0.8-2.8 ng/dL)\n• Total Cholesterol： 260 mg/dL\n• LDL Cholesterol： 190 mg/dL\n• HDL Cholesterol： 37 mg/dL\n• Triglyceride： 140 mg/dL","choices":["스타틴 치료(statin therapy)를 시작한다.","levothyroxine 용량을 조절한다.","식습관 개선을 격려한다.","생활습관 변화를 격려한다.","매일 규칙적으로 혈당을 측정하도록 한다."],"answer":2,"answerLabel":"②","answerPage":370,"explanation":"이상지질혈증은TSH 가 10mIU/L를초과할때일반적으로\n나타난다. 갑상선저하증 환자는 LDL 대사가 감소되는데 주로\nLDL 세포 표면 수용체의 감소로 인하여 발생한다. 이는 LDL\n콜레스테롤의 축적을 유발한다. 먼저 TSH 를 10 mIU/L\n이하로 치료해야 한다. 만약 TSH 가 10 mIU/L 미만임에도\n혈중지질이 높다면 혈중지질을 치료해야 한다."},{"id":"c10-q016","chapterId":10,"number":16,"page":281,"stem":"환자의 검사 결과가 다음과 같다면 예상되는 진단은?\n• TSH： 14 mIU/L (정상치: 0.4~3.8 mIU/L)\n• Free T4： 0.1 ng/dL (정상치: 0.8~2.8 mIU/L)","choices":["갑상선기능저하증","갑상선기능항진증","무증상의 갑상선기능항진증","무증상의 갑상선기능저하증","점액수종"],"answer":1,"answerLabel":"①","answerPage":370,"explanation":"주로 갑상선기능저하증은 갑상선자극호르몬(TSH)이\n상승하고 혈중 T4 이 저하되었을 때 진단된다. 무증상\n갑상선기능저하증에서는 TSH 는 상승되나 T4 는 정상이다.\n갑상선기능항진증 환자는 TSH7^ 저하된다. CBC와 ESR\n결과는 정상범위이다."},{"id":"c10-q017","chapterId":10,"number":17,"page":281,"stem":"45세 여자가 지난 3개월 동안 피로감을 느끼고 체중이 약 4.5 Kg 증가했다. 이전에는 약\n30일 주기로 규칙적으로 생리를 하였으나 지난 3개월 동안에는 30~45일로 다양했다. 갑\n상선자극호르몬(TSH) 수치는 13 mIU/L (정상치: 0.4~3.8 mIU/L)이었으며, 주일 후에 재\n검사 시 15 mIU/L였다. 이 환자에게 의심되는 상태는?","choices":["갑상선기능항진증","갑상선기능저하증","뇌하수체기능저하증","폐경전후증후군","갑상선 중독증"],"answer":2,"answerLabel":"②","answerPage":370,"explanation":"이 환자는 TSH フト 5 mU/L가 넘기 때문에 갑상선\n기능저하증이다. 갑상선기능저하증은 대개 피로, 체중 증가,\n피부 건조, 추위 민감성, 변비, 생리불순, 머리카락이나\n손톱이 쉽게 깨지는 증상이 나타난다."},{"id":"c10-q018","chapterId":10,"number":18,"page":282,"stem":"원발성 갑상선기능저하증을 선별하고 확인하는 데 가장 민감한 검사는?","choices":["TSH(Thyroid-stimulating hormone)","TSH(Thyroid—stimulating hormone), T4","TSH(Thyroid-stim니lating hormone), T4, T3","TSH(Thyroid—stimulating hormone), TRH (thyrotropin-releasing hormone)","Troponin"],"answer":1,"answerLabel":"①","answerPage":370,"explanation":"TSH 는 매우 민감하여 갑상선기능저하증을 초기 단계에서\n진단할 수 있다. 그러므로 TRH 측정은 더 이상 필요하지\n않다. 갑상선기능저하증 환자의 95% 가 원발성이다. 외래\n환자에게 TSH, T4 검사를 수행하는 경우는 두 가지가 있다.\n만약 뇌하수체 또는 시상하부 질환이 의심되는 경우 또는\nTSH 분비에 영향을 주는 특정 질병이 있거나 약물치료 중인\n경우이다. TSH 분비를 증가시키는 약물이나 질병의 예로는\nmeto이。pramide, amiodarone, 부신기능부전,\n뇌하수체선종, 그리고 갑상선호르몬 내성이 있다. 입원\n환자의 경우, 많은 요인들이 TSH 분비에 영향을 미칠 수\n있으므로 TSH 를 갑상선 질환을 평가하는 유일한 검사로\n사용해서는 안 된다."},{"id":"c10-q019","chapterId":10,"number":19,"page":282,"stem":"이 환자에게 예상되는 검사 결과는?","choices":["혈청 삼투압 265 mOsm/Kg","혈청 나트륨 151 mEq/L, 요비중 1.030","혈청 삼투압 280 mOsm/Kg","혈청 나트륨 151 mEq/L, 요비중 1.001","혈청 삼투압 330 mOsm/Kg"],"passage":"다음 지문을 읽고 질문에 답하시오(문제 19-20).\n개두술 환자를 사정한 결과가 다음과 같다.\n• 시간당 소변량 400~500 mL\n• 혈청 포도당 100 mg/dL\n• 혈압 100/68 mmHg, 맥박수 102회得. 호흡수 22회/분","answer":4,"answerLabel":"④","answerPage":370,"explanation":"임상사례는 두부 손상에 이차적인 요붕증(diabetes\ninsipidus; DI)이다. 불충분한 ADH이 희석된 다량의 소변을\n야기한다. 혈청 삼투압은 낮거나 정상이지 않고 높아진다.\n혈청 나트륨은 감소하지 않고 증가할 것이다."},{"id":"c10-q020","chapterId":10,"number":20,"page":282,"stem":"이 환자에게 가장 적절한 정맥주입 수액은?","choices":["lactated Ringers","5% dextrose in water","Normal saline","10% dextrose in water","3% Saline"],"passage":"다음 지문을 읽고 질문에 답하시오(문제 19-20).\n개두술 환자를 사정한 결과가 다음과 같다.\n• 시간당 소변량 400~500 mL\n• 혈청 포도당 100 mg/dL\n• 혈압 100/68 mmHg, 맥박수 102회得. 호흡수 22회/분","answer":1,"answerLabel":"①","answerPage":370,"explanation":"환자는 나트륨의 양이 더 적은 등장성의 정질(crystalloid)\n이 필요하다(생리식염수는 나트륨 양이 더 많다). 저장성 용액,\n나트륨이 많은 용액 또는 포도당이 높은 용액은 저혈량성\n쇼크를 예방하지 못한다."},{"id":"c10-q021","chapterId":10,"number":21,"page":282,"stem":"다음 중 고혈당성고삼투압증후군(HHS) 환자에게 예상되는 검사결과는?","choices":["pH 7.15","요비중 1.030","혈청 칼륨 6.1 mEq/L","혈청 삼투압 270 mOsm/Kg","혈당 180 mg/dL"],"answer":2,"answerLabel":"②","answerPage":370,"explanation":"HHS 환자는 며칠 동안 혈당이 극도로 높다. 이 기간\n동안 수분 손실과 함께 과도한 이뇨작용이 발생한다. 4가지\n선택지 가운데 요비중 상승만 혈액량 감소의 결과이다.\n산증과 고칼륨혈증은 DKA 에서 나타난다. 낮은 혈청 삼투압은\n체액 손실이 아닌 체액 과다로 발생한다."},{"id":"c10-q022","chapterId":10,"number":22,"page":283,"stem":"metformin (Glucophage)의 작용 기전은?","choices":["인슐린 생산 촉진","sulfonylureas 작용과 동일","말초 조직에서 인슐린 작용 증가와 간내 포도당 생성 감소","신장의 포도당 배설 촉진","포도당 신생 억제"],"answer":3,"answerLabel":"③","answerPage":370,"explanation":"Biguanide계인 metformin (Glucophage)은 장내\n포도당 흡수와 간내 포도당 생산, 증가된 말초 포도당 흡수\n및 이용을 통한 인슐린 반응개선제를 감소시킨다."},{"id":"c10-q023","chapterId":10,"number":23,"page":283,"stem":"Sulfonylureas의 작용 기전은?","choices":["인슐린 수용체 활성화의 길항제","인슐린 분비를 증진하는 약물","신장 포도당 배설 촉진제","간내 포도당 생산을 감소시키는 약물","포도당 흡수 억제"],"answer":2,"answerLabel":"②","answerPage":370,"explanation":"Sulfonylureas (SU) 는 glipizide (Glucotrol\"),\nglyburide (DiaBeta) glimepiride (Amaryl) 등의 약물을\n포함한다. 이 약물은 췌장 베타 세포에 인슐린이 분비되는\n인슐린 분비 촉진제 역할을 한다."},{"id":"c10-q024","chapterId":10,"number":24,"page":283,"stem":"당뇨병과 고혈압을 진단받았고, 지속적인 단백뇨가 있는 환자에게 투여할 수 있는 항고혈\n압제는?","choices":["furosemide","methyldopa","fosinopril","nifedipine","spironolactone"],"answer":3,"answerLabel":"③","answerPage":370,"explanation":"ADA권고에 따라 2형 당뇨병 및 고혈압과병용하는환자에게\n권장되는 약물은 안지오텐신전환효소억제제 (\"-pril” 접미사가\n붙은약물, suffix-lisinopril, enalapril 등), 안지오텐산수용체차단제\n(\"-sartan\" 접미사가 붙은 약물), 베타차단제(“니ol\" 접미사가 붙은\n약물), 칼슘채널차든仄II［암로디핀(Norvasc叉), 딜티아젬(Cardizerガ\n외), 베라파밀(Calan\\ Verelan*, 기타)］이다. DM 환자에서 베타\n차단제와 알파 베타 차단제를 사용하는 것은 과거에 금기였지만\n현재는 상당한 심혈관 위험을 줄이므로 사용한다."},{"id":"c10-q025","chapterId":10,"number":25,"page":283,"stem":"biguanide (Metformin)를 사용할 때 주기적으로 검사해야 하는 것은?","choices":["creatine kinase (CK)","alkaline phosphatase (ALP)","alanine aminotransferase (ALT)","creatinine (Cr)","neutrophil"],"answer":4,"answerLabel":"④","answerPage":370,"explanation":"Metformin 사용 시 유의해야 할 점은 잠재적으로\n치명적인 질병인 젖산혈증이 드물게 발생하는 경우이다.\n신장 기능이 정상인 환자의 경우, 몸에서 생성된 젖산은\nMetformin 복용으로 약간 증가할 가능성이 높으며 신장을\n통해 배설된다. 신장 장애가 있는 환자는 metformin과\n젖산이 덜 효과적으로 제거된다. 저혈량증, 심부전 또는\n고령을 포함하여 잠재적으로 신장 관류를 감소시키는 상태는\nmetformin 관련 젖산으로 인한 산증 위험을 증가시킨다.\n그러므로 Creatinine을 모니터하고, 신장기능이 손상된\n경우 중단해야 한다."},{"id":"c10-q026","chapterId":10,"number":26,"page":283,"stem":"2형 당뇨병에서 meglitinide analogues는 특히 어떠한 위험을 최소화하는 데 유용한가?","choices":["공복 저혈당","야행성 고혈당","식후 고혈당","식후 저혈당","식전 고혈당"],"answer":3,"answerLabel":"③","answerPage":370,"explanation":"Me 이itinidean겡ogues는 인슐린 분비를증가시키고\n반감기가 짧아 식전에 복용하여 식후 혈당 조절에 기여한다."},{"id":"c10-q027","chapterId":10,"number":27,"page":284,"stem":"당뇨병 환자가 복용하는 alpha-glucosidase inhibitor의 가장 흔한 부작용은?","choices":["위장 장애","간독성","신장 기능 장애","증상이 있는 저혈당","이명"],"answer":1,"answerLabel":"①","answerPage":370,"explanation":"Alpha-이ucosidase inhibitor는 위장 장애가 주요\n부작용이다. 염증성 장질환이나 신기능장애 시 복용을 피해야\n한다."},{"id":"c10-q028","chapterId":10,"number":28,"page":284,"stem":"2형 당뇨병을 진단받은 75세 남자에게 위마비증이 있을 때 투여할 수 없는 혈당조절 약\n물은?","choices":["insulin glargine (Toujeo, Lantus)","insulin aspart (NovoLog)","glimepiride (Amaryl)","liraglutide (Victoza)","metformin (Glucophage)"],"answer":4,"answerLabel":"④","answerPage":370,"explanation":"Glucagon-like peptide (GLP)-1 agonist의\n예로는 Exenatide (ByettaK , Bydureon®, liraglutide\n(Victoza り가 있다. 혈장 포도당 증가에 대한 반응으로 인슐린\n생산을 촉진하고 식후 글루카곤 분비를 억제한다. 위배출을\n느리게 하여 식욕 억제와 체중 감소를 유도한다. 주요\n부작용은 오심, 구토이고 일반적으로 복용량을 조절한다.\n위마비증이 있으면 중단해야 한다."},{"id":"c10-q029","chapterId":10,"number":29,"page":284,"stem":"Metformin을 수술 후 48시간까지 중단해야 하는 이유는 다음 중 이 약물이 어떤 위험을\n증가시키기 때문인가?","choices":["감염","저혈당","간손상","젖산혈증","마취효과 과다"],"answer":4,"answerLabel":"④","answerPage":370,"explanation":"신장 기능이 정상인 환자의 경우 몸에서 생성된 젖산은\nMetformin 복용으로 약간 증가할 가능성이 높으며 신장을\n통해 배설된다. 신장 장애가 있는 환자에게는 metformin\n과 젖산이 덜 효과적으로 제거된다. 저혈량증, 심부전 또는\n고령을 포함하여 잠재적으로 신장 관류를 감소시키는 상태는\nmetformin 관련 젖산 산증 위험을 증가시킨다. 또한 환자의\n연령과 관계없이 metformin은 수술 당일 또는 방사선\n정답및배설 I 370\n조영제 사용 또는 수분 상태에 영향을 주는 상태의 경우\n사용을 중단해야 하며 수분상태와 신장 기능이 돌아 왔을\n때만 복용을 시작해야 한다."},{"id":"c10-q030","chapterId":10,"number":30,"page":284,"stem":"Graves,disease 치료 시 방사성 요오드를 사용하는 목적은?","choices":["고활동성 갑상선 조직 파괴","TSH 생성 감소","갑상선 대사율 변경","증가된 갑상선 크기로 인한 고통 완화","갑상선 호르몬 생산 촉진"],"answer":1,"answerLabel":"①","answerPage":371,"explanation":"Graves' disease 치료는 먼저 methimazole이나\npropylthioura이과 같은 항갑상선제제를 사용한다. 다음\n단계로 갑상선 절제를 위한 방사성 요오드가 치료에서\n사용된다."},{"id":"c10-q031","chapterId":10,"number":31,"page":284,"stem":"다음 중 갑상선기능항진증 환자의 떨림 및 빈맥의 완화에 효과가 있는 약물은?","choices":["propranolol","diazepam","carbamazepine","verapamil","furosemide"],"answer":1,"answerLabel":"①","answerPage":371,"explanation":"베타차단제는 갑상선 호르몬 합성에는 영향을 주지\n않지만 갑상선 중독증의 임상증상빈맥, 떨림, 불암)을\n개선시키고, 말초에서 갑상선 호르몬 활성화를 억제하는\n효과가 있기 때문에 갑상선기능항진증의 보조적인 약물로\n사용한다. 주로 propran이이, atenol이 등이 사용된다."},{"id":"c10-q032","chapterId":10,"number":32,"page":285,"stem":"노인 환자에게 levothyroxine를 사용할 때 주의사항에 대한 설명으로 옳은 것은?","choices":["고령자는 levothyroxine 치료를 빨리 시작하는 것이 필요하다.","용량 조정 후 약 2일 정도 TSH 를 확인해야 한다.","노인에게는 성인 용량의 75% 이하로 처방한다.","TSH 는 검출 불가능한 수준으로 억제되어야 한다.","칼슘과 함께 투여해야 한다."],"answer":3,"answerLabel":"③","answerPage":371,"explanation":"갑상선 대체 요법으로 성인에게 사용되는 레보티록신\n용량은 75~125 mcg, 즉 약 1.6 mcg/Kg/d이匚卜. 비만\n상태에서도 지방제외체중이 levothyroxine양을 가장 잘\n반영하기 때문에 이상적인 체중으로 계산되어야 한다.\n저체중인 사람은 실제 체중을 사용해야 한다. 노인의 경우,\n예상 복용량은 성인 복용량의 75% 이하이다."},{"id":"c10-q033","chapterId":10,"number":33,"page":285,"stem":"levothyroxine을 과다 사용했을 때 초래될 수 있는 부작용은?","choices":["변비","피로감","신부전","골다공증","범혈구감소증"],"answer":4,"answerLabel":"④","answerPage":371,"explanation":"Levothyroxine의 주요 부작용은 골밀도 감소이다."},{"id":"c10-q034","chapterId":10,"number":34,"page":285,"stem":"34세 여자가 점진적 심약 피로감 식욕부진, 체중감소 등을 호소하며, 손가락, 팔꿈치, 무\n릎을 중심으로 과다 색소침착이 있어 Addisons disease가 의심된다. 이 질환의 확진을\n위해 필요한 검사는?","choices":["calcium","TSH","cortisol","folate","catecholamine"],"answer":3,"answerLabel":"③","answerPage":371,"explanation":"Addison's disease에 대한 혈액검사에는 potassium,\nsodium, cortisol, ACTHフト 있다."},{"id":"c10-q035","chapterId":10,"number":35,"page":285,"stem":"다음 중 기능장애가 있을 때 이차적 부신기능부전을 초래하는 기관은?","choices":["뇌하수체","갑상선","췌장","시상하부","부갑상선"],"answer":1,"answerLabel":"①","answerPage":371,"explanation":"이차적 부신기능부전은 뇌하수체 질환이 있는 경우\n발생할 수 있다. 뇌하수체는 부신피질을 자극하여 호르몬을\n생성시키는 부신피질자극호르몬(ACTH)를 생산한다. ACTH\n생산이 부적절하면 불충분한 부신호르몬 생산을 유발할 수\n있다."},{"id":"c10-q036","chapterId":10,"number":36,"page":285,"stem":"뇌하수체절제술(hypophysectomy)을 받은 43세 남자가 저혈압, 심한 오심과 구토가 있\n으며, 청색증과 함께 혼동 증상을 보인다. 이 환자에게 투여할 가장 적절한 약물은?","choices":["epinephrine","insulin","adrenaline","hydrocortisone","glucose"],"answer":4,"answerLabel":"④","answerPage":371,"explanation":"이환자상태는부신위기이며, 스테로이드 투여 등으로\n치료한다."},{"id":"c10-q037","chapterId":10,"number":37,"page":286,"stem":"56세 여자가 과거 2년 동안 류마티스 관절염 치료를 위해 경구 스테로이드제를 복용했으\n며, 현재 쿠싱증후군이 의심된다. 이 환자에게 우선적인 중재는?","choices":["스테로이드제 사용을 점차적으로 줄인다.","수술을 의뢰한다.","방사선 치료를 고려한다.","mifepristone을 처방한다.","이뇨제를 투여한다."],"answer":1,"answerLabel":"①","answerPage":371,"explanation":"고용량의 스테로이드제를 장기간 사용한 환자에게\nCushing's syndromeOl 의심된다. 치료는 체내 스테로이드\n수치를 줄이도록 하며 장기간 스테로이드 치료를 받는 환자의\n경우 가능한 빨리 복용량을 줄이는 것이 좋다. 장기간 사용한\n스테로이드를 갑자기 중단할 경우 부신 위기를 초래할 수\n있다. 따라서 사용량을 줄이거나 유지하는 것이 안전한 첫\n번째 접근법이다."}]},{"id":11,"part":"PART II","partTitle":"전문실무영역","title":"기타","count":76,"startPage":287,"endPage":304,"questions":[{"id":"c11-q001","chapterId":11,"number":1,"page":287,"stem":"만성신장질환(CKD) 환자의 요독증(Uremia) 증상에 해당하지 않는 것은?","choices":["혈관의 경화","말초신경병증","고칼슘혈증","위장관계 출혈 위험 증가","빈혈위험 증가"],"answer":3,"answerLabel":"③","answerPage":372,"explanation":"만성신장질환일 때 저칼슘혈증, 고인산혈증의 양상이\n나타난다. 빈혈과 출혈의 위험이 증가하고 혈관의 경색될\n위험이 증가한다. 말초신경병증은 당뇨나 신장 질환으로 인한\n요독증의 내과적인 문제로 기인될 수 있다."},{"id":"c11-q002","chapterId":11,"number":2,"page":287,"stem":"다음 중 만성신장질환(CKD) 환자에게 나타난 빈혈을 완화시키기 위한 가장 효과적인 중\n재는?","choices":["Bicarbonate 투여","단백질 섭취 제한","Erythropoietin 투여","고혈압 조절","철분섭취 강화"],"answer":3,"answerLabel":"③","answerPage":372,"explanation":"만성신부전은 적혈구 생산이 감소되는데, 이것은 신장에서\n적혈구 생성 촉진 인자(Erythropoietin)의 분비가 감소되기\n때문이다. 따라서 만성신부전으로 인한 빈혈은 Erythro\npoietin 투여로 완화될 수 있匚!■."},{"id":"c11-q003","chapterId":11,"number":3,"page":287,"stem":"신장으로 유입되는 혈액량은 심박출량의 몇 %인가?","choices":["80%","40%","20〜25%","10-15%","5%"],"answer":3,"answerLabel":"③","answerPage":372,"explanation":"신장은 매일 18아_의 혈액을 여과한다. 심박출량의 20~\n25% 가신장으로 유입된다."},{"id":"c11-q004","chapterId":11,"number":4,"page":288,"stem":"만성신장질환(CKD) 을 진단하기 위한 임상진단검사에 대한 설명으로 옳은 것은?","choices":["CKD 를 정확히 진단하기 위해 조영제를 사용한 CT 가 이용된다.","CKD 에서 일반적으로 신피질의 부종을 볼 수 있다.","소변에서 혈액이 검출되면 사구체 기능장애를 의미한다.","알부민:크레아티닌 비율이 30~299 mg/g일 때 미세알부민뇨로 판단한다.","CKD 환자의 헤모글로빈 수치가 9~10 g/dL이면 악성빈혈로 진단한다."],"answer":4,"answerLabel":"④","answerPage":372,"explanation":"소변의 알부민/크레아티닌비율은 30 mg 미만인 경우\n정상이고, 신장이 손상되었을 때 상승한다. 상승된 수치가\n30~299 mg 수준이면 미세알부민뇨, 300 mg 이상이면\n거대알부민뇨로 분류한다. 만성신장질환인 경우 신장의\n기능이 저하된 상태이므로 조영제의 사용은 주의해야 하며 ,\n신피질이 위축된 양상을 보인다. 악성빈혈은 헤모글로빈 뿐\n아니라 백혈구, 혈소판 수를 통해 진단한다."},{"id":"c11-q005","chapterId":11,"number":5,"page":288,"stem":"혈액투석여과(hemodiafiltration)에 대한 설명으로 옳은 것은?","choices":["확산에 의해 혈액을 여과한다","수분전해질 수치가 급격하게 변하지 않아 심장 부담이 적다","혈류속도가 최소 300 mL/min 이면 가능하므로 작은 혈관에 적용하기 쉽다","저분자 용질 제거에는 유리하나 중분자 제거의 효과는 적다","투석의 효과가 강하나 여과의 효과는 적다"],"answer":2,"answerLabel":"②","answerPage":372,"explanation":"혈액투석여과는 주로 확산(diffusion)에 의해 용질을\n제거하는 혈액투석과 대류(convection)에 의해 용질을\n제거하는 혈액여과법의 장점을 겸비한 혈액정화법이다.\n확산과 대류가 동시에 일어나기 때문에, 투석 중\n혈액 투석보다는 저혈압의 발생이 감소하고 수분 전해질의\n변화가 급격하게 일어나지 않아 심장의 부담이 적다."},{"id":"c11-q006","chapterId":11,"number":6,"page":288,"stem":"빈맥, 빈호흡, 저혈압을 보이며 폐색전증이 의심되는 환자에게 신장 기능 손상 여부를 가\n장 신속히 확인할 수 있는 검사는?","choices":["MRI","소변검사","폐혈관조영술","V/Q perfusion scan","조영제를 이용한 폐 CT"],"answer":5,"answerLabel":"⑤","answerPage":372,"explanation":"가장 빠르고 정확한 영상진단법은 IV 조영제를 주입한\nCT 촬영이다. 조영제를 사용하지 않는다면 폐혈관의\n폐색여부를 확인할 수 없다. 폐혈관조영술이 좋은 진단법이기는\n하지만 시간이 소요되며, V/Q perfusion scan도 즉각적인\n시행이 어렵다."},{"id":"c11-q007","chapterId":11,"number":7,"page":288,"stem":"신장의 허혈성 손상이 시작되는 상황은?","choices":["40시간 이상 지속적으로 평균동맥압이 60 mmHg 이하","평균동맥압이 60 mmHg 이상이나 시간당 소변량이 30 mL 이하","60시간 이상 간헐적으로 수축기압이 100 mmHg 이하","수축기압이 100 mmHg 이하","이완기압이 60 mmHg 이하"],"answer":1,"answerLabel":"①","answerPage":372,"explanation":"40시간 이상 지속적으로 저혈압일 때 신장으로의 혈류\n유입이 감소되고 이로 인한 세뇨관 손상이 일어난다. 소변량\n감소만으로는 신장의 손상여부를 단정자을수 없으며, 수축기압\n만으로는 허혈 여부를 판단할 수 없다."},{"id":"c11-q008","chapterId":11,"number":8,"page":288,"stem":"신장이식을 받은 환자에게 나타나는 다음 상황 중 가장 신속한 조치가 요구되는 것은?","choices":["PTT 20 sec","크레아티닌 감소","체온 38℃","혈당 260 mg/dL","Hemoglobin 9.6 g/dL"],"answer":3,"answerLabel":"③","answerPage":372,"explanation":"장기이식수술 후 투여하는 면역억제제에 의해 면역기능이\n저하되고 외부의 박테리아, 바이러스, 결핵, 진균 등에 감염될\n확률이 높아진다. 이때 발열은 감염가능성을 나타내는 중요한\n징후이므로 신속한 조치가 필요하다. 다른 것은 지속적인"},{"id":"c11-q009","chapterId":11,"number":9,"page":289,"stem":"환자의 사구체여과율을 평가하기 위한 가장 적절한 검사는?","choices":["proteinuria","serum creatinine","serum amylase","blood urea nitrogen (BUN)","urine creatinine clearance"],"answer":5,"answerLabel":"⑤","answerPage":372,"explanation":"크레아티닌청소율은 사구체여과율과 세뇨관의 기능을\n반영하는 가장 의미있는 지표이다. BUN 은 혈액량, 수분량에\n의해 변화하며 , 혈청 아밀라아제는 신장기능을 반영하지\n않는다. 혈청 크레아틴이 사구체여과율을 계산하기 위해\n필요하고 BUN 보다는 세뇨관의 기능을 더 잘 반영하기는\n하지만, 크레아티닌 청소율만큼 의미 있는 것으로 평가되지는\n못한다."},{"id":"c11-q010","chapterId":11,"number":10,"page":289,"stem":"조영제가 주입된 CT 검사 후의 간호중재로 가장 중요한 것은?","choices":["적절한 수분 섭취를 강조한다.","항생제를 투약한다.","과량의 염분을 제공한다.","절대 침상안정을 유지한다.","활력징후를 15분마다 4회, 매시간 4회, 이후부터 4시간마다 측정한다."],"answer":1,"answerLabel":"①","answerPage":372,"explanation":"위험요인을 가진 환자에서 조영제는 신장병증을 유발할\n수 있다. 검사 전 수분섭취의 증가는 신전성 신부전을 유발할\n수 있다. 검사 후 적절한 수분섭취를 강조하는 것이 중요하다.\n②〜⑤번은 신장병증의 위험을 증가시키거나 예방에 도움이\n되는 처치에 해당하지 않는다."},{"id":"c11-q011","chapterId":11,"number":11,"page":289,"stem":"식도정맥류 파열 후 내원한 35세 남자가 상부위장관의 과도한 출혈을 보인 후 급성신부\n전 상태가 되었다. 다음 중 예상되는 임상검사 결과는?","choices":["낮은 요 삼투압, 요 중 높은 나트륨 비중","높은 요 삼투압, 요 중 높은 나트륨 비중","낮은 요 삼투압, 요 중 낮은 나트륨 비중","높은 요 삼투압, 요 중 낮은 나트륨 비중","낮은 요 삼투압, 요 중 나트륨 정상"],"answer":4,"answerLabel":"④","answerPage":372,"explanation":"실이 발생한 초기에 급성으로 신전성신부전으로\n이어질 수 있으나, 세뇨관의 기저막까지는 손상이 되지\n않으므로 신전성 신부전으로 이어지지는 않는다. 세뇨관은\n나트륨을 흡수할 수 있고 요를 농축하므로 요는 높은 삼투압과\n낮은 나트륨비중을 보인다. ①번은 신장성신부전에서 나타날\n수 있고,(2), (3), ⑤번은 특정신장의 문제를 반영해주지\n못한다."},{"id":"c11-q012","chapterId":11,"number":12,"page":289,"stem":"다음 중 furosemide의 효과는?","choices":["수분을 세뇨관으로 끌어당기는 삼투압제제로 작용","헨레고리의 상행각에서 나트륨과 수분의 재흡수를 감소시킴","항이뇨호르몬(ADH)의 길항제로 작용","adolsterone 길항제로 작용","집합관에서 칼륨 분비를 증가"],"answer":2,"answerLabel":"②","answerPage":372,"explanation":"Furosemide는 헨레고리상행각에서 나트륨과 수분의\n재 흡수를 감소시킴으로써 이뇨작용을 촉진한다 .\nFurosemide가 아닌 mannit이인 삼투압제제로 작용한다.\nFurosemide는 ADH4 adolsterone의 길항제로 작용하지\n않는다."},{"id":"c11-q013","chapterId":11,"number":13,"page":290,"stem":"이 환자에게 신장손상을 최소화하기 위해 가장 우선적으로 처치되어야 하는 중재는?","choices":["루프계 이뇨제 투여","sodium bicarbonate 1 ample 투여","0.9% 식염수를 투여하여 시간당 소변배출량을 300 mL로 유지","가능한 한 빨리 복막투석 실시","sorbitol 구강투여"],"passage":"다음 지문을 읽고 질문에 답하시오(문제 13-14).\n부엌에서 쓰러진 후 으キ 48 시간 동안 움직일 수 없었던 상태에서 이송되어 온 50 세 여자의 소변이\n짙은 홍차색깔이며 myoglobinOl 검출되었다. BUN 은 52 mEq/L, 혈청 creatinine은 4.2 mEq/L,\n혈청 포타슘은 5.6 mEq/L이다.","answer":3,"answerLabel":"③","answerPage":372,"explanation":"이 상황은 횡문근융해증(Rhabdomyolysis)과 관련된\n내용이다. 횡문근융해증은 홍차색 소변, 소변에서 마이오\n글로빈이 검출된다. 신장을 세척해내기 위해서 다량의 수액을\n투여하는 것은 신장세뇨관의 영구적인 손상을 예방하기\n위해 필요한 처지이다. 이뇨제와 복막투석은 영구적인 손상을\n예방할 수는 없다."},{"id":"c11-q014","chapterId":11,"number":14,"page":290,"stem":"이 환자에게 나타날 것으로 예측되는 검사수치는?","choices":["CK 30,000","amylase 500","troponin 12","bilirubin 4.2","BUN 10"],"passage":"다음 지문을 읽고 질문에 답하시오(문제 13-14).\n부엌에서 쓰러진 후 으キ 48 시간 동안 움직일 수 없었던 상태에서 이송되어 온 50 세 여자의 소변이\n짙은 홍차색깔이며 myoglobinOl 검출되었다. BUN 은 52 mEq/L, 혈청 creatinine은 4.2 mEq/L,\n혈청 포타슘은 5.6 mEq/L이다.","answer":1,"answerLabel":"①","answerPage":372,"explanation":"횡문근융해증(Rhabdomyolysis)은 충격에 의해 골격근이\n손상될 때 혈중으로 방출되는 마이오글로빈과 CK 가 세뇨관을\n폐색시킬 수 있다. ②~⑤번은 횡문근융해증의 전형적인\n수치에 해당되지 않는다."},{"id":"c11-q015","chapterId":11,"number":15,"page":290,"stem":"다발성 장기손상을 입은 16세 남자의 검사결과 BUN 60 mEq/L, BP 98/50 mmHg이었\n다. 이 상황에서 제공되는 가장 적절한 중재는?","choices":["혈액투석","교질용액 bolus 투여","루프계 이뇨제","복막투석","지속적 신대체요법(CRRT)"],"answer":5,"answerLabel":"⑤","answerPage":372,"explanation":"환자에게는 혈류역동학적인 불안정성 때문에 급성신부전이\n나타났다. CRRT 는 혈액투석보다 혈류역동상태를 상대적으로\n적게 변화시키므로 보다 적절한 조치에 해당한다."},{"id":"c11-q016","chapterId":11,"number":16,"page":290,"stem":"교통사고 후 ICU에서 치료 중인 26세 여자에게 2일째 급성세뇨관괴사(ATN) 가 나타났다.\n입원 시 혈압은 정상이었다면 다음 중 ATN 을 초래한 원인으로 생각되는 것은?","choices":["출혈","횡문근융해증","크레아티닌 방출","부정맥","저혈당"],"answer":2,"answerLabel":"②","answerPage":372,"explanation":"횡문근융해증(Rhabdomyolysis)은 충격에 의해 골격근이\n손상될 때 혈중으로 방출되는 마이오글로빈과 CK 가 세뇨관을\n폐색시킬 수 있다. 따라서 신장을 세척해내기 위해서 다량의\n수액을 투여하는 것은 신장세뇨관의 영구적인 손상을 예방하기\n위해 필요한 처지이다."},{"id":"c11-q017","chapterId":11,"number":17,"page":290,"stem":"급성세뇨관괴사증이 발생하였을 때 신부전의 원인이 신장성(intrarenal)인지 신전성(prerenal)\n인지를 파악하기 위해 요구되는 검사는?","choices":["요비중","요삼투압","BUN 과 creatinine 비율","소변 전해질","C—반응성 단백(C—reactive protein； CRP)"],"answer":3,"answerLabel":"③","answerPage":373,"explanation":"BUN : creatinine의 비율은 신장성 신부전에서 20：1\n보다 낮고, 신전성 신부전에서 20：1보다 높다. 탈수 화상,\n출혈 등의 순환혈액감소에 따른 신전성 문제의 경우는\n신장관류가 감소하여 BUN : creatinine의 비율이 20：1\n보다 높다."},{"id":"c11-q018","chapterId":11,"number":18,"page":291,"stem":"중증 패혈증 치료를 위해 수액요법(fUd resuscitation)을 받고 있는 환자의 평균동맥압\n(MAP) 이 55 mmHg이고 norepinephrine이 처방되었을 때 예상되는 효과는?","choices":["신장관류액 유지","관상동맥 내 혈액흐름의 증가","정맥귀환율과 전부하(preload)의 증가","혈관긴장도와 후부하(afterload)의 회복","사규체여과율 증가"],"answer":4,"answerLabel":"④","answerPage":373,"explanation":"평균동맥압(mean arterial pressure)은 80-180 mmHg\n범위이다. norepinephrine은 a, B수용체 자극제로\n심근수축력과 심박동수를 증가시ヲ 평균동맥압을 증가시카는\n효과가 있다."},{"id":"c11-q019","chapterId":11,"number":19,"page":291,"stem":"심한 탈수로 수액소생술(fhjid resuscitation) 요법이 제공되는 환자에게 중재가 효과적임\n을 나타내는 지표는?","choices":["CVP 2 mmHg","HR 가 감소함","맥압이 감소함","혈청 bicarbonate 16 mEq/L","소변량이 감소함"],"answer":2,"answerLabel":"②","answerPage":373,"explanation":"체액량 감소는 신장 내 염분소실이뇨제 사용, 염분 소실\n신증, 염류 코르티코이드 결핍, 급성세뇨관괴사 삼투성이뇨)이나\n체액소실위장관 호흡기, 피부 화상, 발열, 패혈증)을 통한 소실\n혹은 체액축적(third space accumulation) 등으로 유발된다.\n체액량 감소 시 보상기전에 의한 일반적 증상(예: 빈맥, 빈호흡,\n발한, 털 세움), 쇼크의 증후나 장기의 관류장애를 암시하는\n징후예: 의식저하, 핍뇨, 말초 청색증)가 나타난다. 이때 치료의\n목표는 혈관내 체액량을 등장성 수액으로 보충하여 체내의\n수분 균형을 회복시키는 것이다. 보통 생리 식염수(0.9%\nNaCI)가 초기에 처방되며 , 특히 저혈압 혹은 쇼크가 있을\n때 처방된다. 보통, 등장액 1~2 L를 체액량 결핍 정도에\n따라 정맥내 대량주입(bolus)으로 투여한 이후 체액량을\n다시 평가하고, 이러한 주기를 반복해서 수액을 투여한다."},{"id":"c11-q020","chapterId":11,"number":20,"page":291,"stem":"다음 환자의 상태를 고려할 때 가장 우선적으로 사정해야 하는 환자는?","choices":["복수가 동반되지 않은 간경변증 환자","복수가 동반된 췌장염 환자","우측 신장이 촉진되는 환자","말초부종과 간염이 있는 환자","식사 직후 고창과 미열이 동반된 환자"],"answer":2,"answerLabel":"②","answerPage":373,"explanation":"복수는 호흡곤란과 호흡억제를 유발할 수 있다. 다른\n보기들은 이러한 생명위협적인 상황을 초래한다고 보기\n어렵다."},{"id":"c11-q021","chapterId":11,"number":21,"page":291,"stem":"다음 중 중증 환자의 체액불균형을 판단하기 위한 가장 민감성 높은 지표는?","choices":["체중","I/O balance","환자사정","소변 내 전해질 수치","혈액검사 상 백혈구 수치"],"answer":1,"answerLabel":"①","answerPage":373,"explanation":"매일 환자의 체중을 측정하는 것은 ICU에서 환자의\n수액보유 여부를 판단하는데 있어 중요한 지표가 된다."},{"id":"c11-q022","chapterId":11,"number":22,"page":291,"stem":"CHF, 고혈압, 당뇨병이 있는 70세 환자가 폐렴과 패혈증으로 CU 에서 약 2주간 치료받고\n있으며 만성신장질환으로 투석도 진행중이다. 갑자기 호흡곤란, 빈맥과 빈호흡을 호소하\n고 폐색전증이 의심될 때 다음 중 진단을 위해 요구되는 검사는?","choices":["D-dimer","chest x-ray","조영제를 투입한 CT 촬영","ventilation/perfusion scan","blood culture"],"answer":4,"answerLabel":"④","answerPage":373,"explanation":"만성신장질환이 있는 경우 조영제 사용은 금기시된다.\nventilation/perfusion scan는 조영제를 사용할 필요가\n없기 때문에 보기 중에서는 가장 적절한 검사이다. D-dimer\n는 환자의 다른 병력에 의해서도 양성으로 나타날 수 있으므로\n민감도가 떨어진다. 폐색전증은 chest x-ray로 감별될\n수없다."},{"id":"c11-q023","chapterId":11,"number":23,"page":292,"stem":"급성세뇨관괴사가 발생한 후 하루 4L의 소변을 배출하는 환자의 간호에서 가장 중요한\n고려사항은?","choices":["수분섭취 제한","체액부족과 전해질 농도 사정","고장성 용액주입","이뇨제 주입","염분섭취 증가"],"answer":2,"answerLabel":"②","answerPage":373,"explanation":"급성세뇨관괴사로 인한 다뇨기에 하루 4L의 소변이\n배출된다. 수액이 보충되지 않으면 탈수되면서 전해질 농도가\n상승한다. 따라서 이때 체액부족과 전해질 농도를 사정하는\n것이 중요하다."},{"id":"c11-q024","chapterId":11,"number":24,"page":292,"stem":"현재 만성신장질환의 가장 일반적인 원인은?","choices":["조절되지 않는 당뇨","패혈증","급성사구체신염","신정맥혈전증","고혈압"],"answer":1,"answerLabel":"①","answerPage":373,"explanation":"오래 전 만성신장질환의 가장 많은 원인은 신 손상을\n유발하는 사구체염증의 판별과 치료가 늦어진 것이었匚卜.\n그러나 최근에는 조절되지 않는 당뇨병으로 인한 손상이\n가장 많은 원인에 해당한다."},{"id":"c11-q025","chapterId":11,"number":25,"page":292,"stem":"조영제 부작용으로 급성신손상을 입은 환자에게 예상되는 임상결과는?","choices":["BUN 20, creatinine 0.9","BUN 47, creatinine 3.8","BUN 60, creatinine 1.5","BUN 90, creatinine 2.5","BUN 110, creatinine 5.2"],"answer":2,"answerLabel":"②","answerPage":373,"explanation":"조영제는 신독성으로 작용할수 있고 아로 안해 신성신부전을\n유발할수있다. 혈액요소질소 47 대비 크레아티닌 3.8의 비율은\n1231 이며 이것은 신성신부전(intra-renal failure)의 양상을\n나타낸다. BUN : creatinine의 비율은 신성신부전에서 20：1\n보다 낮고, 신전성 신부전에서 20：1보다 높다. ①은\n정상비율이고, ③과 ④는 각각 40：1, 36：1의 비율로 신전성\n신부전양상을 나타낸다."},{"id":"c11-q026","chapterId":11,"number":26,"page":292,"stem":"60 세 여자가 요로감염으로 항생제를 복용하던 중 혈뇨가 나온다고 호소하며 내원하였다.\n다음 약물 중 소변을 오렌지색으로 착색시켜 혈뇨처럼 혼돈할 수 있는 작용이 있는 약물\n은?","choices":["Nutrofurantoin","Ampicillin","Fluoroquinolones","Phenazopyridine","Trimethoprim"],"answer":4,"answerLabel":"④","answerPage":373,"explanation":"Phenazopyridine는 항생제가아닌 Az。계 염색약으로\n요로점막에 대한 국소마취작용 및 진통효과가 있어 요로\n감염이나 수술 등으로 배뇨기통의 문제가 있을 때 사용되며 ,\n소변색을 주황색으로 만들기도 하므로 혈뇨와의 혼돈에\n유의해야 한다."},{"id":"c11-q027","chapterId":11,"number":27,"page":292,"stem":"말기신장질환의 특징을 설명한 것은?","choices":["네프론 기능이 약 90% 소실","혈청 creatinine 이 3.0 mg/dL 이상","BUN 60 mg/dL","요의 농축도 감소","지속적인 혈뇨"],"answer":1,"answerLabel":"①","answerPage":373,"explanation":"정상 신장기능이 10% 이하인 경우 말기신장질환으로\n분류되며 , 이 경우 혈액투석이나 신장이식술을 받아야 한다."},{"id":"c11-q028","chapterId":11,"number":28,"page":293,"stem":"급성신부전을 진단 받은 후 환자가 하루 4L의 소변을 배출하고 있을 때 사정해야 할 전\n해질 불균형은?","choices":["고칼륨혈증, 저나트륨혈증","저나트륨혈증, 저칼륨혈증","고칼륨혈증, 고나트륨혈증","고칼슘혈증, 저나트륨혈증","저칼슘혈증, 고나트륨혈증"],"answer":2,"answerLabel":"②","answerPage":373,"explanation":"급성신부전의 이뇨기7~1 猿)에는 다뇨3~6L/일)로\n인해 소변으로 배설되는 나트륨량이 늘어나기 때문에\n저나트륨혈증의 위험과 저칼륨혈증의 위험이 있다."},{"id":"c11-q029","chapterId":11,"number":29,"page":293,"stem":"급성신부전의 원인 중 신전성(prerenal) 요인에 해당하는 것은?","choices":["급성사구체신염","양성 전립선비대증","조영제 사용","부정맥","결석"],"answer":4,"answerLabel":"④","answerPage":373,"explanation":"결석은 신후성(postrenal) 요인이고 부정맥은 신전성,\n급성사구체신염, 조영제 사용은 신성(renal) 요인이다."},{"id":"c11-q030","chapterId":11,"number":30,"page":293,"stem":"단백뇨와 부종이 관찰되며 스테로이드 고용량치료를 받고 있는 신증후근 환자에게 권장\n되는 식이에 대한 설명으로 옳은 것은?","choices":["수분 섭취 권장","엄격한 열량제한 식이","단백질 섭취 적정량 유지","동물성 지방 섭취 권장","염분과 포타슘 섭취 권장"],"answer":3,"answerLabel":"③","answerPage":373,"explanation":"신증후군은 단백뇨가 발생하며 단백질이 소실되어\n저알부민혈증이 나타나고, 이로 인해 고지혈증이 나타난匚卜.\n단백질의 소실과 스테로이드 치료 시 단백질 요구량이 증가할\n수 있으므로 단백질 섭취가 중요하나 단백질 섭취 후 노폐물인\n요소가 신장에 부담이 되므로 신장기능에 맞는 적정량의\n단백질을 섭취하는 것이 중요하다. 부종이 발생하면 염분\n섭취와 수분을 제한한다. 한편, 단백질의 소실에 따른\n저알부민 혈증으로 고지혈증의 위험이 높아지므로 가급적\n동물성지방이 함유된 음식을 제한하는 것이 권장된다."},{"id":"c11-q031","chapterId":11,"number":31,"page":293,"stem":"다음 중 레닌-안지오텐신-알도스테론 체계를 활성화 시키는 요인은?","choices":["저칼륨혈증","저나트륨혈증","체액량 과다","BUN 과 creatinine 비율의 증가","평균동맥압 저하와 신동맥 저혈압"],"answer":5,"answerLabel":"⑤","answerPage":373,"explanation":"레닌-안지오텐신-알도스테론 체계는 교감신경계를\n활성화시킨다. 따라서 신장으로 유입되는 혈류의 부족이나\n저혈량 등은 이 체계를 활성화 시킨다. 전해질 이상은 이\n체계의 활성화에 관여하지 않는다."},{"id":"c11-q032","chapterId":11,"number":32,"page":293,"stem":"급성신부전으로 진단받은 환자의 심전도에서 QRS 폭이 넓어지고 T 파가 높아지는(peaked\nT wave) 양상을 보일 때 어떤 전해질의 불균형이 있는 것으로 볼 수 있는가?","choices":["저칼륨혈증","고인산혈증","고칼륨혈증","고염소혈증","저칼슘혈증"],"answer":3,"answerLabel":"③","answerPage":373,"explanation":"칼륨농도가 6 mEq/L인 경우 ECG 상 T 파가 높아지고,\n이것이 진행되면서 PR 간격이 넓어지고, P파가 보이지\n않으며, QRS 파형이 넓어진다."},{"id":"c11-q033","chapterId":11,"number":33,"page":294,"stem":"중환자실에서 치료 중인 환자에게 유치도뇨관이 삽입되어 있으나 지난 2시간 동안 소변\n이 배출되지 않았다면 가장 먼저 취해야 할 조치는?","choices":["추후 처방을 위해 주치의에게 연락","도뇨관 제거","정맥수액주입량 증가","환자의 의식 확인","도뇨관의 개방성 확인"],"answer":5,"answerLabel":"⑤","answerPage":373,"explanation":"소변배출이 안 되는 환자의 경우는 총체적인 사정이\n이루어져야 한다. 먼저 다른 간호중재보다는 유치도뇨관의\n개방성을 확인하는 것이 우선이다."},{"id":"c11-q034","chapterId":11,"number":34,"page":294,"stem":"이 상황에서 간호사가 즉각적으로 해야 하는 것은?","choices":["니트로글리세린 설하투여","주치의에게 연락","수혈을 즉각적으로 중단","지지적인 간호를 제공하면서 활력징후를 지속적으로 관찰","생리식염수를 즉각적으로 정맥투여"],"passage":"다음 지문을 읽고 질문에 답하시오(문제 34-36).\n수혈이 시작된 직후. 환자가 짧은 호흠과 가슴통증을 호소하고 있다. 활력징후는 BP 100/56, PR\n110, RR 22, 체온 38.7℃ 이다. 이후 헤모글로블린뇨증(hemoglobrinuria)과 홍차색 소변을 보였다.","answer":3,"answerLabel":"③","answerPage":373,"explanation":"수혈 중 열, 오한, 짧은 숨, 가슴통증, 관절통증, 요통,\n복부통증, 오심/구토, 빈맥, 빈호흡, 두드러기 저혈압 등의\n증상들이 나타나면 수혈부작용을 의미하므로 즉시 수혈을\n멈추고 담당의사에게 보고해야 한다."},{"id":"c11-q035","chapterId":11,"number":35,"page":294,"stem":"이 상황은 혈액의 어떤 반응이 나타난 것인가?","choices":["용혈반응","아나필락틱반응","발열반응","순환성 과부하","치료적 반응"],"passage":"다음 지문을 읽고 질문에 답하시오(문제 34-36).\n수혈이 시작된 직후. 환자가 짧은 호흠과 가슴통증을 호소하고 있다. 활력징후는 BP 100/56, PR\n110, RR 22, 체온 38.7℃ 이다. 이후 헤모글로블린뇨증(hemoglobrinuria)과 홍차색 소변을 보였다.","answer":1,"answerLabel":"①","answerPage":374,"explanation":"용혈성 수혈반응은 전형적으로 수혈 시작 후 10분\n이내에 나타나지만 수혈 중 언제라도 발생할 수 있다. 열,\n오한, 짧은 숨, 가슴통증, 관절통증, 요통, 복부통증, 오심/\n구토, 빈맥, 빈호흡, 두드러기 저혈압 등의 증상은 이러한\n용혈반응과 관련된 것일 수 있다."},{"id":"c11-q036","chapterId":11,"number":36,"page":294,"stem":"이 상황에서 기술된 수혈반응이 나타난 원인은?","choices":["수혈된 혈액의 혈장단백질에 대한 알레르기반응","공여자의 백혈구에 대한 환자의 항체반응","환자의 혈액형과 일치하지 않는 혈액의 수혈","혈액이 너무 빨리 주입되었기 때문","약화된 신체 상태로 인한 과민반응"],"passage":"다음 지문을 읽고 질문에 답하시오(문제 34-36).\n수혈이 시작된 직후. 환자가 짧은 호흠과 가슴통증을 호소하고 있다. 활력징후는 BP 100/56, PR\n110, RR 22, 체온 38.7℃ 이다. 이후 헤모글로블린뇨증(hemoglobrinuria)과 홍차색 소변을 보였다.","answer":3,"answerLabel":"③","answerPage":374,"explanation":"용혈성 수혈반응은 환자의 혈장 내 항체가 공여자\n혈액의 적혈구를 공격하여 파괴하는 현상이다. 가장 일반적\n원인은 혈액 부적합성이고 , 혈뇨와 홍차색 소변은 적혈구가\n용혈된 것을 의미한다."},{"id":"c11-q037","chapterId":11,"number":37,"page":295,"stem":"다음 중 다발성 장기부전을 나타내는 결과는?","choices":["시간당 소변량 30 mL 이하, BUN 18 mg/dL, WBC 5,120","상부 위장관 출혈, GCS 점수 15, Het 25%","총 빌리루빈 15 mg/dL, 혈청 creatinine 8 mg/dL, 혈소판 2,300 mm5","분당 호흡수 45회, PaCO2 60 mmHg, 희미하게 투영된 흉부 X-ray","고혈압, 빈맥, 빈호흡"],"answer":3,"answerLabel":"③","answerPage":374,"explanation":"③번 상황은 간, 신장, 골수 기능이 저하되어 있음을\n의미한다. ①번은 정상범위에 있고, ②번의 GCS 는 정상이며\n④번은 폐기능 ⑤번은 심혈관 폐의 일반적인 상태를 반영한다."},{"id":"c11-q038","chapterId":11,"number":38,"page":295,"stem":"25세 남자가 교통사고로 인한 다발성손상으로 12시간 동안 수술을 받은 후 ICU에서 기\n관내 삽관, 기계적 환기, 여러 번의 수혈을 받았다. 이러한 외상을 입은 환자에게 나타날\n수 있는 생명을 위협하는 합병증의 초기 징후는?","choices":["알칼리증 고혈압, 위장관 운동저하","산증, 저체온, 폐부종","저혈압, 부정맥, 폐부종","출혈, 감염, 피부긴장도 감소","알칼리증, 고혈압, 피부긴장도 감소"],"answer":2,"answerLabel":"②","answerPage":374,"explanation":"치명적 손상을 입은 경우 조직관류의 저하가 동반된다.\n상기 환자의 경우 다량의 수혈로 인해 외부성분에 노출되었고,\n수술로 인한 저체온의 위험이 있다. 따라서 보기 중 초기\n징후로 나타날 수 있는 것은 ②번이 가장 적절하다."},{"id":"c11-q039","chapterId":11,"number":39,"page":295,"stem":"53세 여자가 지난 3일간 오심과 구토가 지속됨을 호소하며 응급실로 내원하였는데, 초기\n혈액검사에서 BUN 28, creatinine 1.0, K + 5.9, Het 58이었다. 의식은 명료하며 지난 이틀\n간 소량의 액체류만 섭취할 수 있었다고 할 때 예상되는 상황은?","choices":["급성신부전","만성신부전","탈수","급성세뇨관괴사","급성사구체신염"],"answer":3,"answerLabel":"③","answerPage":374,"explanation":"BUN 과 creatinine의 정상적인 비율은 20：1보다\n적다. 이 문제에서 비율은 28：1인데, 이것은 오심과 구토,\ncreatinine 정상 수치로 볼 때 탈수가 진행된 것으로 볼 수\n있다. 칼륨과 Het가 증가한 것은 탈수로 인해 나타난 것으로\n볼 수 있다. 탈수가 급성세뇨관괴사나 급성신부전의\n위험요인이기는 하나, 위 상황에서와 같이 며칠간의 탈수로\n인해 급성신부전으로 이환되기는 어렵다."},{"id":"c11-q040","chapterId":11,"number":40,"page":295,"stem":"고칼륨혈증에서 나타나는 심전도의 변화는?","choices":["넓어진 QRS 폭 ST 상승 넓어진 PR 간격","QT 지연, 서맥","U 파 출현, ST 하강, 심실빈백","빈맥, 심실부정맥","넓어진 T 파, ST 하강, 좁아진 PR 간격"],"answer":1,"answerLabel":"①","answerPage":374,"explanation":"고칼륨혈증은 심실의 탈분극 속도를 줄이고 재분극\n시간을 단축시키며 방실전도율을 저하시킨다. 따라서\n고칼륨혈증에 의한 변화를 가장 적절히 나타낸 것은 ①번에\n해당된다."},{"id":"c11-q041","chapterId":11,"number":41,"page":295,"stem":"적혈구생성 촉진인자(erythropoietin)의 약 90%가 만들어지는 곳은?","choices":["골수","신장","간","폐","뼈의 말단부"],"answer":2,"answerLabel":"②","answerPage":374,"explanation":"신장은 erythropoietin 합성의 주요 기관이고, 약\n10%의 erythropoietin만이 간에서 합성된다. 골수는\nRBC 의 생성 장소이고 erythropoietin이 합성되지는 않으며,\n폐는 RBC 나 erythropoietin 합성과는 아무런 관계가\n없다."},{"id":"c11-q042","chapterId":11,"number":42,"page":296,"stem":"전신성 염증반응증후군(Systemic Inflammatory Response Syndrome； SIRS) 과 패혈증\n(sepsis)의 차이를 가장 잘 설명한 것은?","choices":["감염이 동반되면 SIRS 이다.","맥박과 호흡이 낮아지면 sepsis이다.","체온상승은 SIRS 에서만 나타난다.","빈맥은 sepsis에서만 나타난다.","혈액배양검사에서 양성이면 sepsis이다"],"answer":5,"answerLabel":"⑤","answerPage":374,"explanation":"SIRS 는 빈맥, 열, 때로는 체온저하를 동반한 광범위\n염증이 동반된 상황이다. 감염이 동반될 때 패혈증으로\n명명한다."},{"id":"c11-q043","chapterId":11,"number":43,"page":296,"stem":"신부전 환자의 ABGA 검사 결과 pH 7.32, PaCO2 35, HCO318로 나왔다 이러한 산염기\n불균형이 초래된 이유는?","choices":["호흡을 통한 이산화탄소의 배출 저하","신장을 통한 중탄산이온의 배출 저하","신장을 통한 칼슘이온의 배출 증가","호흡을 통한 나트륨이온의 배출 증가","신장을 통한 대사성 산물인 산의 배출 저하"],"answer":4,"answerLabel":"④","answerPage":374,"explanation":"ABGA 정상범위는 pH 7.35~7.45, PaC02 35~45,\nHC03 22~26이다. 문제에서 제시된 검사결과는 대사성\n산증을 나타내는 것으로 신부전 환자는 신장에서 산의\n배출능력이 손상되었기 때문에 H+ 농도가 증가한다. 산의\n농도가 증가할 때 HOC% 는 산을 중화하기 위해 소모되어\n감소한다(HCQ 18). PaC02 35는 정상범위에 있으므로\n이산화탄소의 배출은 문제가 되지 않는다. 중탄산이온의\n배출은 문제가 되지 않으며, 이 수치는 Hex%의 농도가\n증가하면서 함께 증가한다."},{"id":"c11-q044","chapterId":11,"number":44,"page":296,"stem":"환자의 혈청 K+ 수치가 8.8 mEq/L이며, 심전도에서 QRS 가 넓어지고 서맥을 보일 때 가장\n적절한 응급 중재는?","choices":["Kayexalate 관장","Calcium gluconate, glucose, insulin 정맥투여","sorbitol 구강투여","혈액투석","Furosemide 투여"],"answer":2,"answerLabel":"②","answerPage":374,"explanation":"혈중 K+ 의 정상수치는 3.5~5 mEq/L이다. 칼륨은\n세포막을 안정화시키는 역할을 한다. 인슐린은 칼륨이\n세포내로 이동할 수 있도록 촉진하여 혈중 칼륨수치를 낮춘다.\nkayex기ate와 투석은 전체 칼륨의 농도를 낮출 수 있지만\n시간이 소요된匚ヒ sorbit이은 칼륨수치를 감소시키지 못한다."},{"id":"c11-q045","chapterId":11,"number":45,"page":296,"stem":"다음 중 헤파린에 의한 혈소판감소증이 의심되는 상황은?","choices":["정맥주사 주입부위 주변 출혈, PTT 50 secs","맥박소실, INR 5","점상출혈, 혈소판 수치 50,000/mnf","의식수준의 변화","bilirubin 7 mg/dL"],"passage":"다음 지문을 읽고 질문에 답하시오(문제 45-46).\n58 세 여자가 심부정맥혈전증(DVT)와 폐색전으로 내원하였다. 환자는 헤파린 bolus를 투여 받고\n지속적인 헤파린 주입치료를 받고 있다. 다음날 헤파린에 의한 혈소판감소증이 나타났고 헤파린\n주입이 중단되었다.","answer":3,"answerLabel":"③","answerPage":374,"explanation":"점상출혈은 항상 그런 것은 아니지만, 헤파린에 의한\n혈소판감소증의 징후이다 . 헤파린에 의한 혈소판감소증의\n진단기준은 혈소판이 150,000/mm3 이하로 감소했거나\n30~50%가 갑작스럽게 감소했을 때이다. IV sites 주변의\n출혈이나 지연된 PTT, 지연된 INR 은 헤파린에 의한\n혈소판감소증의 지표에 해당되지 않는다. 의식수준의 변화가\n혈소판감소증에 의한 뇌졸중때문에 발생할 수도 있지만\n점상출혈이나 혈소판 수치 감소가 더 민감성 있는 지표이匚卜."},{"id":"c11-q046","chapterId":11,"number":46,"page":297,"stem":"이 환자가 추후 색전의 위험으로부터 폐를 보호하기 위해 이틀 후에 Greenfield 필터 주\n입이 예정되어 있匚卜. 사전검사 결과 혈소판 수치가 20,000/mm3이었다면 가장 적절한 중\n재는?","choices":["추가처방을 위해 주치의에게 검사결과를 보고함","굵은 사이즈로 여분의 IV line을 확보함","신경학적 상태를 주의 깊게 관찰함","항응고제 argatroban을 중단함","배뇨상태를 주의 깊게 관찰함"],"passage":"다음 지문을 읽고 질문에 답하시오(문제 45-46).\n58 세 여자가 심부정맥혈전증(DVT)와 폐색전으로 내원하였다. 환자는 헤파린 bolus를 투여 받고\n지속적인 헤파린 주입치료를 받고 있다. 다음날 헤파린에 의한 혈소판감소증이 나타났고 헤파린\n주입이 중단되었다.","answer":1,"answerLabel":"①","answerPage":374,"explanation":"시술이 시행되기 전 담당의사가 혈소판 주입여부를\n결정할 수 있도록 혈소판 수치가 급격히 감소한 것을 보고해야\n한다."},{"id":"c11-q047","chapterId":11,"number":47,"page":297,"stem":"패혈성쇼크가 있는 환자에게 나타난 다음 상황에서 파종성혈관내응고(dic)가 생긴 것으\n로 의심되는 것은?","choices":["ELISA 양성","혈소판 수치 감소","지연된 PR, PTT, bleeding time","감소된 hemoglobin과 hematocrit","섬유소분해산물과 D-dimer의 증가"],"answer":5,"answerLabel":"⑤","answerPage":374,"explanation":"파종성 혈관내 응고 증후군은 발생 원인 및 진행과정에서\n다양한 형태로 나타나기 때문에 확립된 진단 기준이 없으며,\n여러 가지의 임상적 및 검사 소견을 근거로 진단한다. DIC\n진단 시 검토할 있는 검사의 종류는 혈소판 수의 측정과,\n피브리노겐 • 안티트롬빈 • 플라스민과 혈액 응고인자의 측정이\n있으며 , 프로트롬빈 시간, 활성화 부분 트롬보플라스틴 시간,\n트롬빈 시간 등의 응고검사가 있다. 아주 중요한 응고 검사로\n이차적 섬유소 용해 현상(FDP 생성)을 증명하는 것이다.\n섬유소분해산물은 파종 성혈 관내 응고와 함께 발생한 다량의\n이OtS이 분해되면서 생성된 것이다. 다른 지표들은 이。\n에서만 특이적으로 나타나는 것은 아니다."},{"id":"c11-q048","chapterId":11,"number":48,"page":297,"stem":"약물의 종류에 상관없이 중독 환자에게 제공되는 초기 중재의 목적은?","choices":["약물의 배출을 증가","적절한 때에 해독제를 투여","추가적인 약물의 흡수를 방지","환자의 기도확보와 적절한 호흡을 유지","환자의 의식사정과 지남력 유지"],"answer":4,"answerLabel":"④","answerPage":374,"explanation":"중독 환자의 치료는 기도유지, 호흡보조, 순환보조,\n신속한 평가로 시작된다. 중독환자는 갑자기 빠른 속도로\n상태가 악화될 수 있다. 증상이 심각하거나 중독물질의\n노출여부를 검사하는 동안, 중추신경계 기능저하 또는\n혈역학적 불안정성, 경련의 발생을 신속하게 찾아내고\n치료한다. 아주 드문 상황을 제외하고는 위장관 세척 , 전장관\n세척, 구토유발 시럽의 투여는 더 이상 권장되지 않으며,\n적절한 해독제가 없는 치명적인 독성물질을 섭취 후 1 시간\n이내인 환자에게 활성탄을 1 회 투여하는 것이 일반적이나\n반드시 의식을 확인하여 의식이 명료한 경우나 기도가\n확보되어 있는 경우에만 투여한다.\n정답및애설 I 374"},{"id":"c11-q049","chapterId":11,"number":49,"page":297,"stem":"과응고장애(hypercoagulation disorder)를 진단받은 환자에게 헤파린을 정맥투여하고 있\n다. 와파린 치료를 시작할 예정이라면 헤파린 주입을 중단하는 시점은?","choices":["환자가 퇴원할 때","ICU에서 일반병실로 이동할 때","와파린 치료를 받으면서 치료적 INIS]] 이를 때","와파린 경구투여가 시작되었을 때","경구섭취가 가능하여 영양섭취를 보충할 수 있을 때"],"answer":3,"answerLabel":"③","answerPage":375,"explanation":"와파린 치료 시 항응고효과가 즉각적으로 나타나지는\n않으므로 다른 형태의 항응고제가 함께 사용되어야 한다.\n헤파린 치료는 퇴원 시까지 필요하지는 않으며 , 환자치료가\n장소에 따라 달라지지는 않는다."},{"id":"c11-q050","chapterId":11,"number":50,"page":297,"stem":"입원 후 환자의 젖산농도가 8시간 동안 2 mm이/L에서 6 mm이/L로 상승했다면 어떤 상\n황이라고 판단되는가?","choices":["적절한 수액치료가 진행 중이다.","TPN 요법을 즉시 시작할 필요가 있다.","조직관류가 부적절한 상태이다.","신선동결혈장 20 units을 즉시 수혈해야 한다.","알부민을 즉시 보충할 필요가 있다."],"answer":3,"answerLabel":"③","answerPage":375,"explanation":"젖산의 증가는 부적합한 조직관류와 산소공급을\n나타낸다. 젖산의 증가는 당뇨성 케톤산증의 경우에도 나타날\n수 있으며 대사성산증으로 진전될 수 있다."},{"id":"c11-q051","chapterId":11,"number":51,"page":298,"stem":"복부 수술 후 Co시madin을 처방받아 퇴원한 60세 환자가 혈뇨가 보인다며 응급실로 내\n원하였다. INR 2.1, Hgb 9.5, Het 29%일 때 다음 중 초기치료로 적용될 수 있는 것은?","choices":["FFP 주입","동결혈장수혈","혈소판 수혈","비타민 K 주입","전혈 수혈"],"answer":4,"answerLabel":"④","answerPage":375,"explanation":"NR0| 상승한환자의 초기치료는 Coumadin의 효과를\n감소시키기 위한 해독제인 비타민 K 를 투여하는 것이다. 이\n환자의 경우 출혈이 진행되는지 알 수 없기 때문에 RB,\nFFP, 동결혈장의 수혈 필요성을 판단할 수 없다."},{"id":"c11-q052","chapterId":11,"number":52,"page":298,"stem":"다음 지문의 사정요소 중 환자에게 발생한 혈소판감소증의 기여요인으로 생각되는 것은?\n55 세 남자가 지난 5 일간 선홍색 토혈을 하고 어제부터는 검은 변이 나온다고 호소하며 내원하였다\n과거에는 출혈병력이 없었다고 한다. 제2형 당뇨를 진단받았고 관절염이 있다. 매일 2〜4정의 아스\n피린을 관절염 통증조절을 위해 복용한다고 하였다. 매일 맥주를 8 병에서 10병정도 마시며 이전에\n알코올중독으로 진단받은 적이 있다. 신체검진 결과 창백하고 피부긴장도가 감소하였으며 상체와\n허벅지 부분에 반상출혈이 관찰되었다. 심장과 폐, 복부검진결과는 정상이다. 초기 혈액검사에서\nhemoglobin 7.0 g/dL, hematocrit 20%, platelet 75000/mm3, INR 2.0, PT 18.0, PPT 50 이었다.","choices":["남성","제 2형 당뇨","관절염","알코올중독","아스피린의 습관적 복용"],"answer":4,"answerLabel":"④","answerPage":375,"explanation":"알코올중독은 골수 억제를 초래하여 폴산염(folate)\n부족으로 인해 혈소판감소증의 발생에 기여하게 된다."},{"id":"c11-q053","chapterId":11,"number":53,"page":298,"stem":"파종성혈관내응고증(dic)이 있는 환자에게 즉각적인 조치가 필요한 검사 결과는?","choices":["International Normalized Ration (INR) 2.0","혈소판 8,000","aPTT 60초","fibrinogen 300 mg/dL","PTT 40초"],"answer":2,"answerLabel":"②","answerPage":375,"explanation":"혈소판 수치 8,000은 치명적으로 낮은 수치이고(정상범위\n150,000~450,000/mL), 뇌내출혈의 위험이 있기 때문에\n즉각적인 조치가 필요하다. INR 2.0은 다소 높은 수치로(\n정상범위 0.6〜 1.7) 관심 있게 지켜봐야 하지만 치명적이진\n않다. aPTT 60초는 다소 높으나但상범위 25~35초) 치명적이진\n않은 범위이며, fibrinogen 300 mg/dL은 정상이다정상범위\n200〜400 mg/dL)."},{"id":"c11-q054","chapterId":11,"number":54,"page":298,"stem":"32세 여자가 먼지나 테이프 등 먹을 수 없는 것들을 먹고 싶은 이상 충동증세를 보이고\n있다 다음 중 이런 행동을 유발할 가능성이 가장 높은 것은?","choices":["파종성혈관내응고","혈소판감소증","철분결핍성 빈혈","겸상적혈구 빈혈","백혈구감소증"],"answer":3,"answerLabel":"③","answerPage":375,"explanation":"철분결핍성 빈혈이 있는 환자는 먼지나 흙 등의 먹을\n수 없는 것들을 먹으려는 충동을 경험하는데, 이런 증상은\n보통 철분을 보충해 주면 혈액 내 헤모글로빈 수치가 상승하지\n않았더라도 바로 사라진다."},{"id":"c11-q055","chapterId":11,"number":55,"page":299,"stem":"다음 중 파종성혈관내응고증을 진단받은 환자에게 즉각적인 관리가 필요한 상태는?","choices":["체온이 39℃일 때","짙은 색 소변을 보일 때","환자의 의식이 저하될 때","환자가 침상 밖으로 나오길 원할 때","환자가 손발 저림을 호소할 때"],"answer":3,"answerLabel":"③","answerPage":375,"explanation":"의식수준의 저하는 잠재적으로 뇌저산소증이나\n뇌내출혈의 신호이다. 홍차색소변은 대부분 농축요나 혈뇨\n때문에 나타난다. 체온 39℃는 우려할 만한 수치이지만\n신경계 변화를 유도하는 주요인은 아니며, 침상 밖으로\n나오려고 하는 환자욕구는 즉각적인 처치를 해야 하는\n상황은 아니다."},{"id":"c11-q056","chapterId":11,"number":56,"page":299,"stem":"파종성혈관내응고증을 가진 환자의 섬유소 용해능(fibrinolytic activity)을 사정할 때 다음\n중 주의 깊게 관찰해야 하는 결과는?","choices":["혈소판","헤모글로빈과 헤마토크릿","프로트롬빈 시간과 INR","피브린 분해산물","적혈구 수치"],"answer":4,"answerLabel":"④","answerPage":375,"explanation":"피브린 분해산물(fibrin degradation products： FDP)\n은 섬유소 용해로 인한 산물로 일차적으로 섬유소용해\n정도를 반영해 준다. ①번의 헤모글로빈이나 헤마토크릿은\n혈액소실의 지표이고, ②번의 혈소판은 혈소판감소증의\n지표이며, ③번의 프로트롬빈 시간과 INR 은 파종성\n혈관내응고가 있는 경우 확인하는 수치이다."},{"id":"c11-q057","chapterId":11,"number":57,"page":299,"stem":"혈우병과 같은 응고인자결핍이 있는 환자가 다음 중 어떤 성분을 수혈 받는 것이 도움이\n되는가?","choices":["농축적혈구(packed red blood cells)","전혈","신선한 동결혈장","혈소판","백혈구"],"answer":3,"answerLabel":"③","answerPage":375,"explanation":"동결혈장은 응고결핍증에서 부족한 응고인자가 많이\n포함되어 있다. 동결혈장은 응고인자 II, V, VII, IX, X, XI\n가 결핍된 경우 치료에 효과적이다."},{"id":"c11-q058","chapterId":11,"number":58,"page":299,"stem":"횡문근융해증을 진단받은 환자의 검사결과 중 즉각적인 처치가 요구되는 것은?","choices":["BUN 50 mg/dL","creatinine 2.0 mg/dL","potassium 6.9 mEq/L","calcium 7.5 mg/dL","sodium 138 mEq/L"],"answer":3,"answerLabel":"③","answerPage":375,"explanation":"칼륨 6.9 mEq/L는 심각하게 높은 수치로(정상수치\n3.於60 田/□ 심실빈맥, 심블록(방실차단) 등의 생명에 치명적인\n부정맥이 발생할 수 있다. 혈액요소질소(BUN) 50 mg/dL은\n다소 높은 수치이나(참고: 정상수치 6~20 mg/dL) 생명에\n치명적인 수치는 아니다. 크레아티닌 2.0 mg/dL은 다소\n높으나(참고 정상수치 0.6〜 1.5 mg/dL) 응급상황은 아니며,\n칼슘 7.5는 다소 낮으나(8.6~10.2 mg/dL) 즉각적인 조치가\n필요한 수준은 아니다"},{"id":"c11-q059","chapterId":11,"number":59,"page":299,"stem":"다음 중 혈소판감소증 시 투여되어야 하는 혈액성분으로 가장 적절한 것은?","choices":["전혈","신선한 동결혈장","혈소판","적혈구","백혈구"],"answer":3,"answerLabel":"③","answerPage":375,"explanation":"혈소판감소증은 혈소판 수치가 감소한 것이다.\n혈소판감소증이 있는 환자에서 출혈의 징후가 있고 혈소판\n수치가 50,000 미만으로 떨어질 때 수혈을 실시한다.\n전혈에도 혈소판이 포함되어 있으나 혈소판 감소증이 있는\n경우에 우선되는 수혈성분은 아니다."},{"id":"c11-q060","chapterId":11,"number":60,"page":300,"stem":"모든 혈액세포의 기본적인 전구체는?","choices":["거핵세포(megakaryocyte)","망상적혈구(reticulocyte)","줄기세포(stem cell)","과립구(granulocyte)","원시세포(archaeocytes)"],"answer":3,"answerLabel":"③","answerPage":375,"explanation":"모든 혈액세포의 전구체는 줄기세포이다. 거핵세포나\n과립구, 망상적혈구는 백혈구나 적혈구의 전구체이다."},{"id":"c11-q061","chapterId":11,"number":61,"page":300,"stem":"만성 질환으로 염증반응을 보이는 노인 환자에게 빈혈이 발생되는 주요 기전은?","choices":["식욕부진에 의한 철, 칼슘, 비타민 c 의 부족","위장관계 잠행성 출혈로 인한 만성 철분 부족","복합질환에 의한 염증성 시토카인의 증가","조절되지 않는 당뇨와 이에 따른 신장질환","침상안정과 부동으로 인한 대사작용 저하"],"answer":3,"answerLabel":"③","answerPage":375,"explanation":"만성 질환에 의한 염증성 시토카인의 증가로 인해\n조혈기능의 저하가 유발될 수 있다. 영양결핍은 만성 염증으로\n인해 빈혈을 유발하는 주요인이 아니다. 위장관 잠혈, 당뇨,\n신장질환은 만성 질환의 빈혈과 관련될 수 있으나 주요인은\n아니다."},{"id":"c11-q062","chapterId":11,"number":62,"page":300,"stem":"AB형 혈액형을 가진 환자에 대한 설명으로 옳은 것은?","choices":["A형 또는 B형 혈액의 항원을 갖고 있다.","A형과 B형 혈액에 대한 항체를 갖고 있다","A형 혈액을 가진 사람에게 혈액을 공여할 수 있다.","모든 혈액형으로부터 수혈 받을 수 있다.","〇형 혈액형을 가진 사람에게 혈액을 공여할 수 있다."],"answer":4,"answerLabel":"④","answerPage":375,"explanation":"AB형 혈액형은 세포 표면에 A와 B형 혈액의 항원을\n갖고 있고, 이에 대한 항체는 없다. 따라서 모든\n혈액형으로부터 혈액을 수혈받을 수 있으나 AB형에게만\n혈액을 공여할 수 있다."},{"id":"c11-q063","chapterId":11,"number":63,"page":300,"stem":"항생제를 정맥투여한 직후 환자가 천명음을 동반한 짧은 호흡, 두드러기, 저혈압을 보이\n고 있다. 이 경우 환자안전을 위해 가장 즉각적으로 수행해야 하는 중재는?","choices":["비재호흡마스크 (non-rebreather mask) 를 통한 산소공급","에피네피린 피하투여","교질용액 bolus 투입","알레르기원의 제거","주입속도를 줄임"],"answer":2,"answerLabel":"②","answerPage":375,"explanation":"아나필락틱 반응이 전신적으로 나타나는 경우 치료의\n한 부분으로 에피네피린이 투여된다. 에피네피린은 생명에\n치명적인 부작용이 나타났을 때 적용하는 약이다."},{"id":"c11-q064","chapterId":11,"number":64,"page":300,"stem":"다음 중 염증반응을 자극하는 히스타민을 방출하는 세포는?","choices":["비만세포","T cells","B cells","단핵구","B helper cells"],"answer":1,"answerLabel":"①","answerPage":375,"explanation":"비만세포는 알레르기원이 염증성 반응을 유발할 때\n히스타민을 분비한다."},{"id":"c11-q065","chapterId":11,"number":65,"page":301,"stem":"Antiretrovir기 therapy를 받고 있는 후천성 면역결핍질환(AIDS) 환자의 상태가 호전되었\n다고 판단할 수 있는 상황은?","choices":["CD4+ T cell 수 감소","ami notransferase 수치의 증가","약물 저항력 증가","Viral load의 감소","Wasting syndrome의 발현"],"answer":4,"answerLabel":"④","answerPage":375,"explanation":"HIV/AIDS 감염에 대한 바이러스 억제제(Antiretroviral\nTherapy； ART) 치료의 유효성을 평가하는 지표로 가장\n많이 적용되고 있는 두 가지는 바이러스 부하(viral load)\n감소와 CD4 세포의 수(CD4 cell counts) 증가이다."},{"id":"c11-q066","chapterId":11,"number":66,"page":301,"stem":"다음 중 인체조직적합항원(HLA) 항체의 역할과 밀접하게 연관되어 있는 질환은?","choices":["Malignancies","Infectious disease","Neurologic disease","Autoimmune disorders","Gastrointestinal disease"],"answer":4,"answerLabel":"④","answerPage":375,"explanation":"인체조직적합항원/사람백혈구항원(Human leukocyte\nantigen； HLA)은 자기 자신과 다른 사람을 구별하는 면역학적\n표지가 되므로 자가면역성질환과 가장 관련이 많다."},{"id":"c11-q067","chapterId":11,"number":67,"page":301,"stem":"25세 여자가 최근 체중감소, 원인모를 설사, 전신피로감, 발열의 증상으로 내원 후 HIV\nassay를 실시한 결과, HIV 항체 양성, CD4 T cell 이 500 cells/uL로 나타났다. 이 상황\n에 대한 적절한 설명은?","choices":["AIDS 라고 확진할 수 있다","AIDS 에 대한 면역력을 가지고 있다고 볼 수 있다","감염을 전파시킬 위험이 있다.","정확한 진단을 위해 성병검사를 추가로 실시해야 한다.","Antiretroviral therapy를 통해 완치될 수 있는 가능성이 높다."],"answer":3,"answerLabel":"③","answerPage":375,"explanation":"인간면역결핍바이러스니IV) 감염 환자들에서 CD4+\nT 세포수와 바이러스 핵산량은 임상 경과를 반영하는 주요\n정보이다. CD4+ T 세포수의 정상범위는 800~1200\nc 이Is/uL이다. 감염 초기에는 감기와 같은 증상이 나타나고\nCD4+ T 세포수가 일시적으로 감소한다. 이 시기는 순환\nHIV 바이러스 load가 높은 시기로 타인에게 감염시킬\n위험이 높은 시기이다. 급성기가 지나고 무증상 기간이\n지속되다가 HIV 바이러스의 수가 증가하는 것에 비해 면역계의\n기능회복이 저하될 때 CD4+ T 세포수가 200 cells/uL\n이하로 떨어지면서 심각한 면역력의 저하와 기회감염의\n위험이 높아진다."},{"id":"c11-q068","chapterId":11,"number":68,"page":301,"stem":"한번 노출된 경험이 있는 항원에 다시 재차 노출되었을 때 급격히 증가하는 면역글로불린\n은?","choices":["IgA","IgM","IgE","IgG","IgD"],"answer":4,"answerLabel":"④","answerPage":376,"explanation":"항원에 처음 노출될 때 IgM 이 먼저 반응하고 뒤이어\nIgG가 반응하나, 동일한 항원에 재감염 되었을 때에는 IgG\n가 먼저 반응한다."},{"id":"c11-q069","chapterId":11,"number":69,"page":301,"stem":"이식수술 전 수행해야 하는 수여자와 공여자 간의 면역검사는?","choices":["ABO 적합성만 평가","ABO 및 HLA 적합성 모두","HLA 적합성만 평가","ABO, Rh, HLA 적합성 모두 평가","Rh, HLA 적합성 평가"],"answer":2,"answerLabel":"②","answerPage":376,"explanation":"장기이식을 위해서는 ABO 혈액형과 조직적합성항원\n(Human Leukocyte Antigen； HLA)0| 일치해야 한다."},{"id":"c11-q070","chapterId":11,"number":70,"page":302,"stem":"신장이식술 후 중환자실에서 치료중인 56세 여자에게 거부반응이 의심되는 검사 결과는?","choices":["소변량 증가","BUN 과 creatinine 비율의 감소","creatinine의 증가","혈소판 수치의 증가","혈압의 감소"],"answer":3,"answerLabel":"③","answerPage":376,"explanation":"조직거부반응을 보이고 있는 환자는 잠재적인 신장기능\n저하를 평가할 수 있는 검사가 필요하다. 소변량 증가나\nBUN/creatinine 비율의 감소는 신장기능이 어느 정도\n적절한 상태를 의미하고 , 이식거부반응으로 혈소판수치는\n대체로 감소한다."},{"id":"c11-q071","chapterId":11,"number":71,"page":302,"stem":"장기간 입원하여 침상안정 상태에 있는 70세 노인에게 욕창 예방을 위해 제공되는 가장\n효과적인 중재는?","choices":["둔부에 방수포를 깔아준다.","1 〜2시간마다 환자의 체위를 변경해준다","매주 정해진 시간에 압박부위를 모니터한다.","고탄수화물, 고지방식이를 제공한다.","압박 부위를 하루 2번 알코올로 마사지해 준다."],"answer":2,"answerLabel":"②","answerPage":376,"explanation":"침상안정 상태로 움직임이 어려운 노인의 욕창을 예방하는\n가장 효과적인 중재는 1 ~2시간마다 체위변경을 해주는\n것이다. 압박부위 모니터링은 최소 하루 2회 하도록\n되어있으며, 알코올 마사지는 금한다. 수치료, 운동과,\n고단백/고비타민 식이를 제공한다."},{"id":"c11-q072","chapterId":11,"number":72,"page":302,"stem":"50세 여자가 오른 팔에 2도 화상을 입고 내원하였다. 화상으로 인한 부종을 가라앉히는\n가장 효과적인 중재는?","choices":["냉찜질","석고붕대","압박 드레싱","국소적 항생제 연고","팔을 상승시키고 조기 이상"],"answer":5,"answerLabel":"⑤","answerPage":376,"explanation":"화상 후 손상부위의 부종을 가라앉히는 가장 효과적인\n방법은 부위를 상승시키고 조기 이상(early amb니ation)을\n권유하는 것이다. 압박드레싱과 석고붕대 적용은 손상부위의\n순환을 저하시키므로 금기이다."},{"id":"c11-q073","chapterId":11,"number":73,"page":302,"stem":"50세 남자가 앉은 자세에서 끓는 물이 담긴 보온통이 쏟아져 오른쪽 다리에 화상을 입고\n내원하였다. 검진 결과 오른쪽 다리의 앞 표면이 붉어져 있고 접촉 시 통증을 호소하였다.\n화상을 입은 추정 신체표면적은?","choices":["5%","9%","13%","18%","27%"],"answer":2,"answerLabel":"②","answerPage":376,"explanation":"성인의 9의 법칙에서 한쪽 하지 전체는 18%이며, 앞 표면은 약 9%로 계산한다."},{"id":"c11-q074","chapterId":11,"number":74,"page":302,"stem":"오른손 세 손가락에 열화상을 입고 내원한 30세 여자에게 화상부위의 상처 감염을 예방\n하기 위해 처방하는 약물은?","choices":["topical corticosteroid","topical silver sulfadiazine","oral erythromycin","oral moxifloxacin","parenteral cephalosporin"],"answer":2,"answerLabel":"②","answerPage":376,"explanation":"화상부위의 감염예방을 위한 치료는 도포용 항생연고\n[mafenide acetate (Sulfamylon)이나 silver sulfadiazine\n(Silvadene)]가 포함되며, 예방적 항생제를 투여하는 것은\n국소 적용보다 효과적이지 않다."},{"id":"c11-q075","chapterId":11,"number":75,"page":303,"stem":"30세 여자가 오른손에 열화상을 입고 응급실에 내원하였다. 손가락에 수포가 보이며 통\n증을 호소할 때 가장 적절한 초기대응 방안은?","choices":["화상특화병원(병동)으로 의뢰한다.","예방적 항생제를 복용하도록 한다.","화상부위에 마취연고(anesthetic cream)를 바르고 수포를 터뜨린다.","화상부위를 느슨하게 드레싱으로 감싼 후 진통제를 처방해 준다.","화상부위에 silver sulfadiazine cream(Silvadene)을 바르고 두껍게 드레싱을 한다."],"answer":1,"answerLabel":"①","answerPage":376,"explanation":"화상환자는 우선 사고가 난 경위와 개인 병력에 대한\n문진을 통해 추후 발생할 수 있는 합병증을 예방하는 것이\n중요하다. 특히 화상 고위험군어린이, 노약자, 흡연가 등)에\n대한 화상예방을 위한 교육이 필요하다. 손이나 발 등의\n고기능 부위나 얼굴, 성기 등과 같은 부위의 화상일때는\n즉시 화상특화병원/병동으로 의뢰하도록 하며, 기타부위는\n응급실이나 외래에서 치료할 수 있다."},{"id":"c11-q076","chapterId":11,"number":76,"page":303,"stem":"손에 2도 화상을 입어 내원한 환자의 피부를 관찰한 결과 2~3 cm 정도 맑은 액체가 들\n어 있는 병변이 관찰되었다면 이 병변을 칭하는 용어는?","choices":["vesicles","bullae","cysts","wheals","ulticaria"],"answer":2,"answerLabel":"②","answerPage":376,"explanation":"Bullae는 6 mm 이상 직경을 가진 수포를 의미하며\n2도 화상에서 흔히 나타난다. vesicle도 수포지만 5 mm\n이하의 직경을 가진 수포를 뜻한다. cysts는 액체가 찬\n주머니이며, whe겡s이나 니ticaria는 불규칙하게 피부에\n생기는 발진, 두드러기이다.\n전문간豆사 자격시험 대비 문제집\n저スト 소그 H\n편집저자\n이영희 강지연 김민주 민혜숙 송라윤 안숙희 이윤미 하이경\n집필저자\n신수진 이화여자대학교\n안숙희 충남대학교\n염현이 충남대학교\n윤선영 영산대학교\n이민주 동아대학교\n이영희 성균관대학교\n이윤미 인제대학교\n장연수 연세대학교\n최수정 성균관대학교\n최혜란 울산대학교\n최희선 동아대학교병원\n하이경 부산대학교\n강지연 동아대학교\n고명균 삼성서울병원\n구미지 양산부산대학교 병원\n김민주 동아대학교\n김상희 인제대학교\n김영숙 고신대학교\n민혜숙 동아대학교\n박명화 충남대학교\n박지영 인제대학교\n박진희 아주대학교\n배선형 아주대학교\n송라윤 충남대학교\n1판 1쇄 丨 2019 년 6 월 28 일\n1 판 2쇄 I 2021 년 4월 23 일\n저 자 | 중환자전문간호교육과정협의회 저\n발행 인 | 회장박철용\n대표 박세원\n발행 처 | 수문사\n주 소 I 경기도 파주시 직지길 522(문발동499-4) 파주출판도시\n전 화 I 031-955-77
