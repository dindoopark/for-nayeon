면 0.6 이하로 유지하도록\n한다. 호기말양압을 낮추면 산소분압이 낮아지게 되므로\n산소화의 개선을 위해서는 높은 호기말양압을 유지해야 하고,\n도파민은 수액 공급으로 혈압이 올라가지 않을 때 사용할 수\n있으나 먼저 수액 보충부터 해야 한다. 급성호흡곤란증후군에서\n일회호흡량은 5~8 mL/Kg (6 mL/Kg)フト 권장된다."},{"id":"c06-q073","chapterId":6,"number":73,"page":179,"stem":"다음 중 기계환기 중인 급성호흡곤란증후군 환자의 생존율을 높이기 위해 강력한 임상적\n근거에 의해 추천되는 중재는?","choices":["산화질소 흡입","고빈도환기","저일회호흡량","높은 호기말양압","글루코코르티코이드 투여"],"answer":3,"answerLabel":"③","answerPage":344,"explanation":"저일회호흡량은 무작위 임상시험으로부터 강력한\n임상적 근거에 의거하여 추천되는 치료(幻이다. 높은\n호기말양압은 증거가 충분하지 않아 대체요법으로만 추천되는\n치료(C)이며, 산화질소 흡입, 고빈도환기와 글루코코르\n티코이드는 치료 효과에 반한 임상 증거에 근거하여 추천되지\n않는다 (D)."},{"id":"c06-q074","chapterId":6,"number":74,"page":179,"stem":"급성호흡곤란증후군에서 나타나는 임상 양상으로 옳은 것은?","choices":["폐포 부종","폐사강 감소","폐동맥압 감소","폐내단락 감소","폐순응도 증가"],"answer":1,"answerLabel":"①","answerPage":344,"explanation":"급성호흡곤란증후군은 삼출기, 증식기, 섬유화기로\n나타나며, 각각의 단계에서 임상 및 병리학적 양상이\n특징적이다. 삼출기에는 미세혈관의 폐쇄로 환기가 잘\n이루어지는 폐포에 대한 폐동맥 혈류의 감소(단락), 이로\n인한 사강의 증가, 폐동맥 고혈압을 초래하여 폐포 상황이\n악화되며 , 폐사강의 증가로 인한 고탄산혈증과 폐 아래쪽의\n많은 분비물로 인한 허탈에 의해 폐순응도 감소가 현저하게\n나타난다. 폐포 부종은 중력에 의해 눌리는 주로 폐의\n아래쪽에 발생하며 무기폐를 초래한다. 증식기에는 일부\n환자에서 진행성 폐손상과 폐섬유증의 초기 변화가 발생한다.\n섬유화기에는 기흉의 위험성이 증가되고 폐순응도 감소,\n폐사강 증가가 있다."},{"id":"c06-q075","chapterId":6,"number":75,"page":179,"stem":"60세 남자가 호흡곤란이 심해 기계환기를 위해 중환자실에 입원하였다. 단순흉부촬영상\n에서 양쪽 폐에 침윤이 보이며 동맥혈 가스분석 결과가 pH 7.29, PaCO2 50 mmHg,\nPaO 272 mmHg, HCO「26 mEq/L, SaO 2 92% (FiO2 0.6)일 때, 이 환자에게 필요한 효\n과가 입증된 중재는?","choices":["산화질소 흡입","표면활성제 투여","저일회호흡량 적용","낮은 호기말양압 적용","글루코코르티코이드 투여"],"answer":3,"answerLabel":"③","answerPage":344,"explanation":"미국국립보건원이 후원하고 급성 호흡곤란증후군\n네트워크에서 관리한 대규모 무작위 대조실험에서 지금까지\n시도되었던 어떤 중재 방법보다 저일회호흡량예측체중 1 Kg\n당 6 mL)이 가장 의미 있게 생존율을 향상시켰다."},{"id":"c06-q076","chapterId":6,"number":76,"page":179,"stem":"기계환기 중인 급성호흡곤란증후군 환자의 동맥혈 가스분석 결과가 Fio2 to인 상태에서\nPaO 2 58 mmHg일 때, 적절한 중재는?","choices":["고빈도환기 적용","스테로이드 투여","호기말양압 추가","기관지확장제 투여","산화질소 흡입"],"answer":3,"answerLabel":"③","answerPage":344,"explanation":"급성호흡곤란증후군에서는 폐포와 간질의 용액 존재와\n표면활성제의 손실로 폐순응도가 현저하게 감소하므로\n호기말양압PEEP) 의 증가가 없으면 호기말에 폐포 허탈이\n발생하고 단락에 의해 산소공급이 저하된다. 그러므로 대부분의\n임상환경에서는 경험적으로 日5를 최소화하고 PaO 2>\n최대화하는 PEEP 을 결정한다 (만약 曰“ 0.6 이하에서 PaO 2\n60 mmHg으로 유지되지 않으면 PEEP 을 더해야 한다)."},{"id":"c06-q077","chapterId":6,"number":77,"page":180,"stem":"물에 빠져 거의 익사 직전에 구조된 45세 남자가 호흡곤란이 심하고 흡입산소농도 50%\n로 산소 투여 중인 상태에서 동맥혈 가스분석 결과가 pH 7.22, PaCO2 50 mmHg, PaO 2\n65 mmHg, HCO「23 mEq/L, SaO 2 88%이고, 단순흉부촬영상에서 양쪽 폐에 침윤이\n있다. 이 환자에게 가장 적절한 중재는?","choices":["복와위","스테로이드 투여","산화질소 흡입","표면활성제 투여","기관내삽관과 기계환기"],"answer":5,"answerLabel":"⑤","answerPage":344,"explanation":"이 환자는 급성호흡곤란증후군이 있으며 , 그 치료는\n비정상적인 가스교환과 확인된 원인을 교정하는 것이다.\n저산소혈증을 개선하기 위해 기관내삽관을 하고 기계환기를\n해야한다."},{"id":"c06-q078","chapterId":6,"number":78,"page":180,"stem":"급성호흡곤란증후군 환자에게 기계환기를 적용할 때 호기말양압을 설정하였다 기대되는\n효과는?","choices":["기흉 방지","폐단락 증가","폐순응도 증가","폐포 허탈 방지","기능잔기용량 감소"],"answer":4,"answerLabel":"④","answerPage":344,"explanation":"급성호흡곤란증후군에서는 폐포와 간질의 용액 존재와\n표면활성제의 손실로 폐순응도가 현저하게 감소하므로\n호기말양압PEEP) 의 증가가 없으면 호기말에 폐포 허탈이\n발생하고 산소공급이 저하된다."},{"id":"c06-q079","chapterId":6,"number":79,"page":180,"stem":"평소 건강했던 35세 남자가 오토바이 사고로 인한 흉부손상으로 응급 수술을 받은 후 호\n흡곤란을 호소하였다 호기 시 쌕쌕거림, 수포음이 들리고 객담에 붉은 거품이 있으며, 단\n순흉부촬영상에서 미만성 폐포 침윤이 보인다. 이 환자에게 의심되는 상태는?","choices":["기흉","무기폐","폐부종","폐색전증","흡인 폐렴"],"answer":3,"answerLabel":"③","answerPage":344,"explanation":"이 환자는 급성호흡곤란증후군01 의심되며, 0| 상태는\n기왕의 폐질환이 없던 환자가 흉부손상으로 폐 모세혈관 및\n폐포 상피세포의 투과성이 증가되어 초래된 심한 상태의\n투과성 폐부종을 의미한다."},{"id":"c06-q080","chapterId":6,"number":80,"page":180,"stem":"47세 여자가 차량 충돌사고로 가슴을 크게 다친 후 빈호흡, 호흡곤란이 있어 응급실에 왔\n다. 폐에서 수포음이 들리고, 즉시 산소를 공급했으나 저산소혈증이 호전되지 않는다. 이\n환자에게 의심되는 상태는?","choices":["폐암","천식","폐색전증","기관지확장증","급성호흡곤란증후군"],"answer":5,"answerLabel":"⑤","answerPage":345,"explanation":"급성호흡곤란증후군의 특징적인 증상은 갑작스러운\n호흡곤란, 빈호흡, 노력성 호흡, 청진 상 수포음, 심각한 (\n불응성) 저산소혈증 등이다."},{"id":"c06-q081","chapterId":6,"number":81,"page":181,"stem":"62세 여자가 급성호흡부전으로 입원하였다. 만성폐쇄폐질환의 과거력이 있으며, 현재 의\n식은 명료하나 호흡곤란이 심하고 입술 주위 청색증이 있으며 동맥혈 가스분석 결과가\npH 7.22, PaCO2 60 mmHg, PaO 2 53 mmHg, HCO「26 mEq/L, SaO 2 80% (FiO2 0.3)\n이다. 우선적인 중재는?","choices":["체위배액","기관내삽관","인공호흡기 적용","기관지확장제 투여","흡입산소농도(FiO) 올림"],"answer":5,"answerLabel":"⑤","answerPage":345,"explanation":"급성호흡부전의 치료는 비정상적인 가스교환과 확인된\n원인을 교정하는 것이다. 이 환자는 비록 환기가 정상적으로\n이루어지고 있지는 않으나 의식이 명료하므로 PaCO2 상승은\n덜 긴급한 문제이다."},{"id":"c06-q082","chapterId":6,"number":82,"page":181,"stem":"22세 남자가 교통사고로 둔기 흉부손상(blunt chest trauma)과 뇌진탕이 있어 중환자실\n로 입원하였다. 입원 2일째 환자는 호흡곤란이 있으며, 안절부절 못하고 죽을 것 같아 무\n섭다고 한다. 호흡수 34회/분, 비재호흡마스크로 100% 산소 투여 중인 상태에서 동맥혈\n가스분석 결과가 pH 7.35, PaO 2 58 mmHg, PaCO2 50 mmHg, HCO3~ 26 mEq/L이고,\n단순흉부촬영상에서 양쪽 폐에 침윤이 있다. 우선적인 중재는?","choices":["체위배액","흉관 삽입","기관지확장제 투여","기관내삽관과 기계환기","재호흡마스크로 100% 산소 투여"],"answer":4,"answerLabel":"④","answerPage":345,"explanation":"이 환자는 급성호흡부전이 의심되며, 급성호흡부전의\n치료는 비정상적인 가스교환과 확인된 원인을 교정하는\n것이다. 진통제를 투여하고 저산소혈증을 개선하기 위해\n기관내삽관을 하고 기계환기를 해야 한다."},{"id":"c06-q083","chapterId":6,"number":83,"page":181,"stem":"급성호흡곤란증후군 환자에게 기계환기를 시작하려고 할 때 고려해야 할 사항으로 옳지\n않은것은?","choices":["일회호흡량은 6 mL/Kg로 설정한다.","기도내압은 최대 30-35 mmHg를 초과하지 않도록 한다.","산소포화도는 90%가 유지되도록 한다.","흡입산소농도는 1.0으로 시작하여 동맥혈 산소분압이 60 mmHg가 될 때까지 점차 감소시킨다.","호기말양압은 가능하면 추가하지 않는다."],"answer":5,"answerLabel":"⑤","answerPage":345,"explanation":"급성 호흡곤란 환자에서는 다음과 같은 보호환기 전략을\n적용하는 것이 가장 안전하고 좋은 치료결과를 가져올\n가능성이 높다: ⑴목표 일회호흡량은 이상체중 Kg당 6 mL\n로 한다. ⑵고평부압이 30 cm% 。를 넘지 않게 한다. ⑶\n산소포화도〉90%를 유지할 수 있는 최소한의 흡입산소농도를\n사용한다. ⑷PEEP 은 폐포가 열린 상태가 유지되고 과팽창과\n폐쇄/재개방이 방지될 수 있게 조절한다."},{"id":"c06-q084","chapterId":6,"number":84,"page":181,"stem":"65세 남자가 저산소증이 있으며 폐동맥관(Swan-Ganz catheter)을 통해 폐동맥쐐기압\n이 12 cmHQ로 측정되었다. 이 환자의 저산소증의 원인으로 볼 수 있는 것은?","choices":["급성 폐손상","급성 심장성 폐울혈","기관지 경련으로 인한 환기/관류 불균형","모세혈관 폐색으로 인한 호흡사강의 증가","급성 폐고혈압으로 인한 폐동맥 폐쇄"],"answer":1,"answerLabel":"①","answerPage":345,"explanation":"급성 폐손상은 폐동맥쐐기압이 정상 범위이고, 심장성\n폐울혈증과 폐고혈압의 경우 폐동맥쐐기압이 증가한다."},{"id":"c06-q085","chapterId":6,"number":85,"page":182,"stem":"기관지염의 초기 임상적 특성으로 옳은 것은?","choices":["호흡 시 통증","기도 분비물 증가","휴식 시 호흡곤란","촉각진동감 증가","속삭임 가슴소리 증가"],"answer":2,"answerLabel":"②","answerPage":345,"explanation":"만성 기관지염 초기에는 기도 분비물의 증가, 발열, 기침,\n오한 등의 증상이 있으나 폐경화가 없으므로 촉각진동감이\n증가되거나 청진 시 속삭임 가슴소리가 증가되지 않는다."},{"id":"c06-q086","chapterId":6,"number":86,"page":182,"stem":"66세 남자가 만성적인 객담과 기침을 호소하며 내원하였다 잦은 호흡기질환에 감염된 과\n거력이 있고, 객담이 있는 기침과 피부 청색증이 있다 이 환자에게 의심되는 상태는?","choices":["천식","폐심장증","낭성 섬유증","만성 기관지염","급성호흡곤란증후군"],"answer":4,"answerLabel":"④","answerPage":345,"explanation":"만성 기관지염은 폐쇄성 폐질환으로 잦은 호흡기 감염에\n의한 인해 흡기 자극으로 기도 상피세포의 두께가 두꺼워지며 ,\n기도가 좁아진 증상으로 객담을 동반한 기침과 저산소증이\n특징이다."},{"id":"c06-q087","chapterId":6,"number":87,"page":182,"stem":"다음 중 지속되면 최종적으로 기관지확장증을 유발할 수 있는 상태는?","choices":["객혈","폐고혈압","IgG 결핍","수면성 호흡장애","심부전으로 인한 폐울혈"],"answer":5,"answerLabel":"⑤","answerPage":345,"explanation":"이차적 기관지확장증의 원인은 지속적인 기관지 자극이\n있거나 오염된 공기 노출, 흡연, 폐손상, IgG 결핍 등이다."},{"id":"c06-q088","chapterId":6,"number":88,"page":182,"stem":"다음 중 폐기종을 유발하는 원인으로 옳지 않은 것은?","choices":["흡연","가족력","알레르기","상기도 감염","오염된 공기 환경"],"answer":3,"answerLabel":"③","answerPage":345,"explanation":"흡연, 상기도 감염, 가족력, 오염된 공기 환경 등은\n폐기종을 유발할 수 있는 일차적 이차적 위험인자이다."},{"id":"c06-q089","chapterId":6,"number":89,"page":182,"stem":"60세 남자가 기침과 호흡곤란으로 내원하였다. 25갑년의 흡연력이 있고, 단순흉부촬영상\n에서 폐포의 비정상적인 확대가 보인다. 이 환자에게 의심되는 상태는?","choices":["천식","폐렴","폐기종","만성 기관지염","폐쇄수면무호흡"],"answer":3,"answerLabel":"③","answerPage":345,"explanation":"폐기종에서는 호흡곤란, 쌕쌕거림, 만성 기침과 피로,\n체중 감소 등의 증상과 폐포의 비정상적인 영구적 확대가\n나타난다."},{"id":"c06-q090","chapterId":6,"number":90,"page":183,"stem":"다음 중 폐기종과 관련이 있는 것은?","choices":["과다환기","폐포 허탈","흡기 곤란","환기/관류비 균등","알파1-항트립신 결핍"],"answer":5,"answerLabel":"⑤","answerPage":345,"explanation":"폐기종은 폐쇄성 폐질환으로 알파 1 -항트립신 결핍 시\n나타나며, 폐포의 과대팽창, 호기 시 쌕쌕거림이 발생한다."},{"id":"c06-q091","chapterId":6,"number":91,"page":183,"stem":"폐기종으로 기계환기 중인 환자에서 기계환기와 관련된 내용으로 옳은 것은?","choices":["흡입산소농도(FiOj를 증가시켜도 산소분압은 올라가지 않을 것이다.","무기폐를 예방하기 위해 일회호흡량(tidal volume)을 15 mL/Kg까지 증가시킬 수 있다.","환기 방식은 압력 조절형 방식(pressure controlled mode)이어야 한다.","폐의 과다팽창을 방지하기 위해 호기말양압(PEEP) 은 적용하지 말아야 한다.","압력손상의 위험이 크므로 기도내압(airway pressure)의 변화 여부를 주의 깊게 감 시해야 한다."],"answer":5,"answerLabel":"⑤","answerPage":345,"explanation":"폐기종은 폐포 벽이 파열되어 기흉이 발생할 위험이 있다.\n그러므로 기계환기 치료를 할 경우에는 기도내압을 주의 깊게\n감시하고, 적거나 정상적인 일회호흡량(8~ 12 mL/Kg)을\n적용한다 . 폐기종의 경우에는 급성호흡곤란증후군에서\n나타나는 폐포/동맥 확산 결손이 없기 때문에 흡입산소농도를\n증가시키면 산소분압이 올라갈 것이다. 또한 폐기종 환자를\n위한 표준화된 기계환기 방식은 없다. 높은 호기말양압을\n적용하면 과다팽창을 유발할 수 있으므로 적정한 호기말양압에\n대해서는 이론이 분분하나 일반적으로 5 cml%。의 호기말\n양압은 과다팽창의 위험 없이 호흡을 도울 수 있다."},{"id":"c06-q092","chapterId":6,"number":92,"page":183,"stem":"다음 중 제한성 폐질환(restrictive lung disease)에 대한 내용으로 옳은 것은?","choices":["폐조직의 탄력성 증가","호흡근육 약화","강제폐활량 감소","호기 곤란","기도저항 증가"],"answer":3,"answerLabel":"③","answerPage":345,"explanation":"제한성 폐질환은 폐조직의 탄력성이 감소하고 폐활량이\n감소하여 호흡곤란이 유발된다. 흡인 폐렴, 기관지확장증,\n폐부종, 급성호흡곤란증후군 등이 포함된다."},{"id":"c06-q093","chapterId":6,"number":93,"page":183,"stem":"다음 중 미만성 간질성 폐질환(Interstitial lung disease)의 증상에 해당하는 것은?","choices":["객혈","쌕쌕거림","곤봉형 손톱","객담을 동반한 기침","얕은 노력성 호흡"],"answer":3,"answerLabel":"③","answerPage":345,"explanation":"미만성 간질성 폐질환의 가장흔한증상은 호흡곤란이며,\n이로 인해 청색증이 유발되고 폐섬유화가 진행되면 곤봉형\n손톱이 나타날 수 있다. 객담을 동반하지 않은 기침, 수포음\n등이 특징이다."},{"id":"c06-q094","chapterId":6,"number":94,"page":183,"stem":"20세 남자가 호흡곤란으로 내원하였다. 반복적인 부비동 및 호흡기계 감염이 있었으며,\n지방변, 입안에서 짠맛이 나는 증상이 있다고 한다. 이 환자에게 의심되는 상태는?","choices":["천식","폐심장증","낭성 섬유증","만성 기관지염","급성호흡곤란증후군"],"answer":3,"answerLabel":"③","answerPage":345,"explanation":"낭성 섬유증(cystic fibrosis)은 유전성 질환으로 폐점막의\n증대로 인해 기도가 폐쇄되며, 지방변, 입안에서 짠맛이\n나는 증상, 잦은 호흡기계 감염 등이 나타난다."},{"id":"c06-q095","chapterId":6,"number":95,"page":184,"stem":"흉부 손상으로 인한 동요가슴(flail chest)에서 볼 수 있는 것은?","choices":["협착음(stridor)","코벌렁임 (nasal flaring)","교대맥박(pulsus alternans)","발작 기침(paroxysmal cough)","모순호흡(paradoxical respiration)"],"answer":5,"answerLabel":"⑤","answerPage":345,"explanation":"동요가슴은 주로 외상으로 인한 흉벽 혹은 흉골의\n손상으로 초래되며, 모순호흡(paradoxical respiration),\n공기 흐름의 저하, 가스교환 장애가 유발될 수 있다."},{"id":"c06-q096","chapterId":6,"number":96,"page":184,"stem":"심근경색증으로 관상동맥우회술을 받은 76세 환자가 급작스러운 흉통과 호흡곤란을 호\n소하였다. 폐고혈압과 심부전의 과거력이 있는 이 환자에게 발생 가능한 호흡기 문제는?","choices":["흡인","기흉","혈흉","폐색전증","흉벽 손상"],"answer":4,"answerLabel":"④","answerPage":345,"explanation":"폐색전증은 혈전, 지방, 조직 부산물 등이 폐혈관을\n폐색시켜 야기되는 질환으로 혈액정체를 유발하는 상태(\n심부정맥염, 침상 안정 중인 환자 등에서 흔히 나타난다."},{"id":"c06-q097","chapterId":6,"number":97,"page":184,"stem":"폐색전증을 확진할 수 있는 진단검사는?","choices":["폐혈관조영술","단순흉부촬영","폐 환기/관류 스캔","동맥혈 가스분석","가슴경유심초음파검사"],"answer":1,"answerLabel":"①","answerPage":345,"explanation":"비록 침투성으로 인해 자주 수행되지 않지만\n혈관조영술만이 폐쇄된 혈관을 시각화할 수 있다. 폐색전증은\n단순흉부촬영으로 어떠한 특정적 독특한 견해를 낼 수는\n없다. 환기/관류 스캔은 관류 결함을 확인할 수 있다."},{"id":"c06-q098","chapterId":6,"number":98,"page":184,"stem":"다음 중 대량의 폐색전증을 나타내는 것은?","choices":["혈압 78/58 mmHg, SpO2 88%, 폐모세혈관쐐기압 증가","혈압 82/52 mmHg, SpO, 85%, 폐포 사강 증가","혈압 150/90 mmHg, SpO, 88%, 중심정맥압 감소","혈압 170/102 mmHg, SpO, 86%, 평균 폐동맥압 감소","혈압 158/98 mmHg, SpO, 89%, 폐혈관저항 감소"],"answer":2,"answerLabel":"②","answerPage":345,"explanation":"관류가 없는 환기가 있기 때문에 폐색전증에서 사강\n환기가 증가한다. 또한 다량의 폐색전증이 있으면서 ‘\n폐고혈압의 중증도’와 호ワ I/관류 불균형‘ 때문에 저혈압과\n저산소증이 나타난다. 폐모세 혈관쐐기 압은 좌심 실 압력으로\n폐색전증에서는 증가하지 않는다. 평균 폐동맥압과\n중심 정맥압은 다량의 폐색전증에서 증가하고 폐혈관저 항은\n증가할 수 있으나 감소하지는 않는다."},{"id":"c06-q099","chapterId":6,"number":99,"page":184,"stem":"3일 전 고관절 치환술을 받은 90세 환자가 중등도의 호흡곤란을 호소한다. 호흡수 40\n회/분, 므박 128회/분 혈압 80/60 mmHg이며, 폐 기저부의 호흡음이 감소되었고, 심음\n은 정상이다. 심전도에서 심실박동수 130회의 심방세동이 관찰될 때 이 환자에게 의심되\n는 상태는?","choices":["폐부종","폐색전증","흡인 폐렴","심근경색증","수술후 무기폐"],"answer":2,"answerLabel":"②","answerPage":345,"explanation":"인공고관절수술후 폐색전은주요 합병증 중의하나이며,\n이 환자의 증상으로 보면 폐색전증이 의심된다."},{"id":"c06-q100","chapterId":6,"number":100,"page":185,"stem":"폐색전증으로 인한 급성 호흡부전으로 입원한 환자가 혈압 88/58 mmHg, 호흡수 28\n회/분이고, 양쪽 폐는 깨끗하며, 비강캐뉼라로 4L/분으로 산소를 공급하는 상태에서\nSp5는 88%이다. 이 환자의 상태에 대한 설명으로 옳은 것은?","choices":["단락이 크고 호기말양압(PEEP) 적용이 필요하다.","색전이 크고 폐포 사강이 증가되었다.","산소공급을 위해 기관절개술이 필요하다.","기계환기와 노르에피네프린 주입이 필요하다.","환자의 D-이합체(D-dimer)는 음성이고 섬유소 용해요법이 필요하다."],"answer":5,"answerLabel":"⑤","answerPage":345,"explanation":"이 환자는 저혈압과 저산소혈증이 있는데 이는 다량의\n폐색전이 있다는 증거이다. 폐색전은 폐 관류를 막아 사강을\n만드는데 색전이 클수록 사강의 정도가 커진다. D-dimer\n는 혈전이 존재하기 때문에 음성이 아니라 양성일 것이다.\n환자에게 금기사항이 없는 경우 섬유소 용해요법 , 기계환기와\n혈압상승제 주입 등을 적용할 수 있다. 폐색전은 단락이 아닌\n사강을 증가시키므로 PEEP 은 적용하지 않는다. 아직까지는\n기관내삽관이 필요하지 않다."},{"id":"c06-q101","chapterId":6,"number":101,"page":185,"stem":"78세 환자가 왼쪽 대퇴 골절로 수술한 지 3일째에 몹시 불안해하고 호흡곤란을 호소하\n며, 혈압 125/80mmHg, 미胆キ 130회/분, 호흡 35회/분이다. 이 환자에게 우선적인 중재\n는?","choices":["산소 투여","심장초음파 시행","혈전용해제 투여","대정맥 필터(vena cava filter) 삽입","순차적 압박장치 (sequential compression device) 적용"],"answer":1,"answerLabel":"①","answerPage":346,"explanation":"이 환자는 폐색전증이 의심된다. 폐색전증은 조기\n진단과 중재가 중요하며, 산소화와 환기의 개선,\n심혈관기능의 향상, 재혈전 형성 예방, 폐색전의 예방이\n관리 목표이다. 이 환자의 경우 산소 치료는 폐색전증과\n관련된 저산소증을 해결하기 위해 매우 효과적이며,\n심폐기능이 심하게 저하된 경우에는 기계환기를 적용할\n수도 있匚上 ventilation-perfusion lung scanOl\n폐색전증을 진단하는 주요 검사이며 , 심장초음파는 우심실\n비대를 확인할 수 있으나 특이적이지는 않다. 혈전용해제\n및 대정맥 필터는 더 이상의 혈전형성과 심혈관기능이\n손상되는 것을 방지하기 위한 이차 치료이며,\n깊은정맥혈전증(DVT)과 폐색전을 예방하기 위해서 대정맥\n필터 삽입, 순차적 압박장치 등을 이용할 수 있다."},{"id":"c06-q102","chapterId":6,"number":102,"page":185,"stem":"85세 여자가 왼쪽 발목 골절로 6주간 거의 누운 상태로 지내던 중 갑자기 호흡곤란과","choices":["폐기능검사","단순흉부촬영","동맥혈 가스분석","D-dimer","관상동맥조영술"],"answer":4,"answerLabel":"④","answerPage":346,"explanation":"이 환자는 폐색전증이 의심된다. 폐색전증에 의한\n흉통은 폐동맥 팽창이나 흉막에 가까운 폐 분절의 경색에\n의한 것으로 알려져 있다. 흉통 이외에 호흡곤란, 때로는\n객혈을볼수 있으며, 대부분에서 빈맥이 관찰된다. 폐색전증\n환자에서는 plasmin이 fibrin을 분해하기 때문에 혈장\nD-dimer 정략 측정값이 올라가며, 폐색전증에 대한 이\n검사법의 민감도는 95% 이상이다."},{"id":"c06-q103","chapterId":6,"number":103,"page":185,"stem":"환자의 동맥혈 가스분석 결과가 pH 7.32, PaCO2 33 mmHg, HCO「16 mEq/L일 때, 이\n결과를 초래할 수 있는 문제는?","choices":["불안","쇼크","기흉","전해질 불균형","마약성 진통제 과다복용"],"answer":2,"answerLabel":"②","answerPage":346,"explanation":"낮은 pH는 산증을 의미하며 낮은 중탄산염은 대사성\n산증을 의미한다. 낮은 Pac。?는 보상작용으로 시작된\n과환기하고 있음을 보여주는 것으로 대사성 산증은 대사와\n관련된 원인에 의해 발생하거나 신부전, 쇼크 등에서\n발생한다. 일반적으로 불안은 호흡성 알칼리증을 유발하고\n마약성 진통제(opiate계) 약물 과다복용과 기흉에서는\n호흡성 산증이 나타나고 전해질 불균형저 염화물은 대사성\n알칼리증을 유발한다."},{"id":"c06-q104","chapterId":6,"number":104,"page":186,"stem":"다음 중 조영제를 사용한 흉부 컴퓨터단층촬영 전후로 0.9% 생리식염수 1 mL/Kg의 투여가\n필요한 경우는?","choices":["천식이 있는 30세 남자","고혈압이 있는 55세 남자","베타 아드레날린 차단제를 복용 중인 40세 남자","급성 관상동맥증후군으로 입원한 50세 여자","관절염으로 6시간마다 비스테로이드항염증제(NSAIDs)를 복용하는 80세 남자"],"answer":5,"answerLabel":"⑤","answerPage":346,"explanation":"NSAIDsB 복용하는 것과 연령은 조영제 유발 신장병에\n위험하다. 나머지 보기들은 이 문제의 위험 사항이 아니다."},{"id":"c06-q105","chapterId":6,"number":105,"page":186,"stem":"천식으로 입원한 환자가 호흡수 28회/분이며 현재 3L/분의 산소를 비강캐뉼라로 공급\n받고 있다. 다음 중 기관내삽관이 필요하다고 판단되는 동맥혈 가스분석 결과는?","choices":["pH 7.41, PaCO, 39 mmHg, PaO, 83 mmHg","pH 7.50, PaCO, 29 mmHg, PaO, 72 mmHg","pH 7.46, PaCO, 33 mmHg, PaO, 62 mmHg","pH 7.36, PaCO, 41 mmHg, PaO, 62 mmHg","pH 7.44, PaCO, 41 mmHg； PaO, 80 mmHg"],"answer":4,"answerLabel":"④","answerPage":346,"explanation":"천식이 악회된 과호흡 환자의 Pac.와 저산소혈증을\n회복시키기 위해서는 기계적 도움이 필요하다. ①, ②,\n⑤번은 Pac。?는 정상이고 Pa， 는 적당한 수준이다.\n③번은 위험할 수 있는 저산소혈증을 보이나 PaC〇2를\n보면 과환기가 여전히 유지되고 있다."},{"id":"c06-q106","chapterId":6,"number":106,"page":186,"stem":"다음 중 호흡성 산증과 심각한 저산소혈증을 나타내는 동맥혈 가스분석 결과는?","choices":["pH 7.56, PaCO, 28 mmHg, PaO 2 38 mmHg, HCOJ 24 mEq/L","pH 7.19, PaCO, 78 mmHg, PaO, 40 mmHg, HCOj 28 mEq/L","pH 7.34, PaCO, 46 mmHg, PaO, 60 mmHg, HCO「21 mEq/L","pH 7.21, PaCO, 29 mmHg, PaO, 48 mmHg, HCO「14 mEq/L","pH 7,35. PaCO, 38 mmHg, PaO, 65 mmHg, HCOj 20 mEq/L"],"answer":2,"answerLabel":"②","answerPage":346,"explanation":"호흡성 산증은 PaCO27^ 비정상이고 pH는 PaCO2\n와 반대방향으로 변화한다. PaCO2>44 mmHg, 동맥혈\npH가 감소한 경우는 호흡성 산증이다."},{"id":"c06-q107","chapterId":6,"number":107,"page":186,"stem":"환자의 동맥혈 가스분석 결과가 pH 7.47, PaCO2 32 mmHg, HCO「23 mEq/L일 때, 이\n결과를 초래한 문제로 볼 수 있는 것은?","choices":["불안","쇼크","기흉","전해질 불균형","마약성 진통제 과다복용"],"answer":1,"answerLabel":"①","answerPage":346,"explanation":"높은 pH는 알칼리증을 의미하며 낮은 PaCO2는\n과환기를 하고 있음을 보여주는 것으로 이는 호흡성\n알칼리증을 나타낸다. 일반적으로 불안은 호흡성 알칼리증을\n유발하고 대사성 산증은 대사와 관련된 원인에 의해\n발생하거나 신부전, 쇼크 등에서 발생한다. 마약성 진통제\n(opiate계) 약물 과다복용과 기흉에서는 호흡성 산증이\n나타나고 전해질 불균형(저 염화물)은 대사성 알칼리증을\n유발한다."},{"id":"c06-q108","chapterId":6,"number":108,"page":186,"stem":"8주 이상 지속되는 기침이 있어 내원한 환자의 단순흉부촬영상이 정상일 때, 이 기침의\n원인으로 가장 가능성이 적은 것은?","choices":["천식","후비루","위식도역류","바이러스성 감기","안지오텐신전환효소 억제제(ACEI)복용"],"answer":4,"answerLabel":"④","answerPage":346,"explanation":"만성 기침의 원인은 천식, 후비루, 위식도역류가 가장\n흔하며 , ACE 억제제의 부작용도 만성 기침이다. 바이러스성\n감기로 만성 기침을 하지는 않는다."},{"id":"c06-q109","chapterId":6,"number":109,"page":187,"stem":"65세 환자가 폐렴과 패혈증으로 인해 2주 이상 중환자실에 입원 중이다. 울혈심부전, 고\n혈압 당뇨, 만성 신부전의 과거력이 있으며 현재 투석을 하고 있다. 환자가 갑자기 빈맥,\n저산소증, 빈호흡을 보이며 폐색전증이 의심될 때 적절한 진단검사는?","choices":["조영제를 사용한 흉부 컴퓨터단층촬영","폐 환기/관류 스캔","단순흉부촬영","기관지내시경","폐기능검사"],"answer":5,"answerLabel":"⑤","answerPage":346,"explanation":"폐 환기/관류 스캔은 조영제를 사용하지 않기 때문에\n신부전이 있는 환자에게 가장 적절한 진단검사이다.\n조영제를 사용한 흉부 컴퓨터단층촬영은 조영제를 사용하기\n때문에 최고의 선택은 아니다."},{"id":"c06-q110","chapterId":6,"number":110,"page":187,"stem":"60세 여자가 지난 2주 동안 호흡곤란과 피로가 지속되어 내원하였다. 다른 과거력은 없\n으며 칼슘제와 비타민을 복용하는 것을 제외하고는 다른 투약력도 없다. 전면 단순흉부\n촬영상에서 오른쪽 횡격막거상(이evation of right hemidiaphragm)이 보일 때 다음으로\n시행해야 할 검사는?","choices":["측와위 (lateral decubitus) 흉부촬영","폐동맥조영술","흉부 자기공명영상","흉부 컴퓨터단층촬영","심초음파"],"answer":1,"answerLabel":"①","answerPage":346,"explanation":"전면 단순흉부촬영 상 오른쪽 횡격막거상이 있을 때는\n측와위 흉부촬영이 추가적으로 필요하다. 횡격막거상은\n대개 복부내압 상승으로 인해 유발된다."},{"id":"c06-q111","chapterId":6,"number":111,"page":187,"stem":"단순흉부촬영상에서 컬리 B선(Kerley B line)이 보이는 경우는?","choices":["폐렴","무기폐","폐부종","대동맥 협착","급성호흡곤란증후군"],"answer":3,"answerLabel":"③","answerPage":346,"explanation":"컬리 B선은 폐부종이 있는 환자에게서 관찰된다."},{"id":"c06-q112","chapterId":6,"number":112,"page":187,"stem":"23세 여자가 최근 2주 동안 기침과 혈액이 섞인 가래가 있어 내원하였다. 낮은 발열이\n동반되고 최근 5 Kg의 체중 감소가 있고, 흡연력은 없으며, 몇 개월 전 방학동안 남미\n여행을 다녀온 적이 있다고 한다. 이 환자에게 의심되는 상태는?","choices":["폐렴","결핵","폐색전","기관지염","기관지확장증"],"answer":2,"answerLabel":"②","answerPage":346,"explanation":"폐결핵은 흡연력이 없거나 호흡기계 감염이 없는\n환자가 폐결핵이 흔히 발생하는 지역에 노출된 후 기침과\n객혈, 낮은 발열, 식욕저하, 피로감, 체중저하등의 증상이\n나타난다."},{"id":"c06-q113","chapterId":6,"number":113,"page":188,"stem":"다음 중 결핵에 감염될 가능성이 있는 경우는?","choices":["동성애 환자와 접촉 시","활동성 결핵이 있는 사람과 접촉 시","결핵이 있는 사람의 분비물이나 혈액 접촉 시","결핵이 있는 사람과 음식이나 수저를 같이 사용하는 경우","피부 결핵 반응검사에서 양성으로 나온 사람과 공기접촉 시"],"answer":2,"answerLabel":"②","answerPage":346,"explanation":"결핵은 활동성 결핵이 있는 사람과 접촉 시에만\n감염된다."},{"id":"c06-q114","chapterId":6,"number":114,"page":188,"stem":"최근 폐결핵으로 진단되어 isoniazid (Lania기d), rifampin (Rifa셰n), pyrazinamide를 복\n용 중인 환자가 소변이 붉은 오렌지색이라고 할 때 적절한 간호사의 반응은?","choices":["요로감염의 증상이니 수분을 많이 섭취하세요.","rifampin으로 인해 나타난 반응이며, 약물 복용은 중단하지 않아도 됩니다.","간독성일 수 있으니 추가검사를 할 때까지 약물 복용을 중지하세요.","혈액이 섞여 나오는 것일 수 있으니 즉시 신장검사를 해야 합니다.","음식 조절이 필요하니 영양상담을 예약해 드■리겠습니다."],"answer":2,"answerLabel":"②","answerPage":346,"explanation":"rifampin의 흔한 부작용이기 때문에 약물 복용을\n중단하지 않아도 된다."},{"id":"c06-q115","chapterId":6,"number":115,"page":188,"stem":"폐결핵 환자를 위한 약물 처방으로 적절한 조합은?","choices":["rifampin (Rifadin)과 병행된 mont이ukast (Singulair) 약물 치료","streptomycin, pyrazinamide오卜 rimantadine (Flumadine)의 병용 치료","isoniazid (INH), pyrazinamide와 rifampin (Rifadin)의 병용 치료","pyrimethamine (Fansidar)의 단일 약물 치료","isoniazid(INH)의 단일 약물 치료"],"answer":3,"answerLabel":"③","answerPage":346,"explanation":"결핵 치료는 흔히 병용 치료를 한다. rimantadine은\n항바이러스제이고 , pyrimethamine 은 항말라리아제이다.\n단일 약물 치료는 결핵균의 독성과 내성 때문에 시행하지\n않는다."},{"id":"c06-q116","chapterId":6,"number":116,"page":188,"stem":"대한결핵 및 호흡기학회(2005)에서 제시한 도말양성 폐결핵 환자의 표준 처방은?","choices":["Isoniazid+Rifampicin+Ethambutol 6개월","Isoniazid+Rifampicin+Pyrazinamide 9개월","Isoniazid+Rifampicin+Pyrazinamide 2개월, Isoniazid+Rifampicin+Strepto- mycin 4개월","Isoniazid+Rifampicin+Ethambutol+Streptomycin 2개월, Isoniazid+Rifampicin 4 개월","Isoniazid+Rifampicin+Ethambutol+Pyrazinamide 2개월, Isoniazid+Rifampi- cin+Ethambutol 4개월"],"answer":4,"answerLabel":"④","answerPage":346,"explanation":"현재 도말양성 폐결핵 환자는 전 세계적으로 INH,\nRMP, PZA 의 세 가지 필수 약물에 EMB 또는 SM 을 네\n번째 약물로 추가하기도 하여 2개월간 INH, RMP, PZA\n(EMB 또는 SM ) 투여하고 그 이후 4개월간 INH, RMP 을\n투여하는 단기 치료가 권장되고 있다. 우리나라에서는\n대한결핵 및 호흡기학회(2005)에서 위와 동일한 6개월\n단기치료(표준처방)를 진료지침으로 제시하고 있다."},{"id":"c06-q117","chapterId":6,"number":117,"page":189,"stem":"폐결핵으로 6개월 단기치료 중인 32세 여자 환자가 항결핵약 복용 전의 간기능은 정상\n이었으나 복용 2주 후 시행한 간기능검사 결과가 아스파르테이트아미노전이효소(AST)\n65 U/L, 알라닌아미노전이효소(ALT) 70U/L이며 황달 등의 증상은 없을 때, 적절한 중\n재는?","choices":["비타민 를 투여한다.","현재 복용중인 약들을 계속 복용하게 한다.","간 독성이 악화될 수 있어 모든 약의 복용을 중단하게 한다.","간 독성을 유발하는 Isoniazid를 제외한 나머지 약들은 계속 복용하게 한다.","간 독성을 유발하는 Ethambutol을 제외한 나머지 약들은 계속 복용하게 한다."],"answer":2,"answerLabel":"②","answerPage":346,"explanation":"항결핵약 치료 시 치료 초기 수주일간은 증상 없이\n약간의 혈중 간효소 수치의 일시적 상승이 있을 수 있다.\nAST 와 ALT 상승이 정상치(AST ； 여자 7 〜34 U/L, 남자\n8 ~46 U/L ； ALT: 4~36U/L )의 3배 이내이면 약을 계속\n투여하면서 경과를 관찰한다. 그러므로 이 경우에는 약을\n중단할 필요는 없다. 그러나 AST 와 ALT フト 정상치의 3\n배에 달하거나 황달이 있을 때, 급성신부전, 혈소판감소증,\n청신경장애, 안독성, 심한 약제열 및 발진이 있을 때는 약물\n복용을 중단해야 하며 , 간기능검사를 추적하여 정상화되면\n하나씩 다시 투여한다. Ethambutol, Streptomycin,\nCy이。serine을 제외한 모든 약은 정도의 차이는 있으나\n간독성이 있으므로 간기능이 회복되는 기간이 길어지면\n이런 간 독성이 없는 약물을 투여하며 재투약을 시도한다."},{"id":"c06-q118","chapterId":6,"number":118,"page":189,"stem":"요양시설에서 활동성 결핵을 진단 받은 환자와 같은 병실에 있는 환자에게 화학적 예방\n법을 시작하려고 할 때 옳은 것은?","choices":["PPD 피부검사 결과가 양성일 때만 시작한다.","PPD 피부검사 결과를 얻은 후 72시간 이내에 시작한다.","반복된 피부검사가 양성일 때 3개월 이내에 시작한다.","PPD 피부검사가 음성이면 1 년 이내에 재검사를 실시하고 시작한다.","가능한 한 빨리 PPD 피부검사를 하고 화학적 예방법을 시작한다."],"answer":5,"answerLabel":"⑤","answerPage":347,"explanation":"화학적 예방법은 피부검사를 시행할 때에 맞춰\n시행되어야 한다. 첫 번째 검사결과가 음성인 경우에는 3\n개월 이내에 피부검사가 재시행 되어야 한다. 만약에 두\n번째 피부검사까지 음성이라면 화학적 예방법은 멈출 수\n있다."},{"id":"c06-q119","chapterId":6,"number":119,"page":189,"stem":"폐결핵의 수술 적응증에 해당하지 않는 경우는?","choices":["소아","암과의 감별이 어려운 경우","지속되는 다량의 재발성 객혈이 있는 경우","중하엽의 결핵성 기관지확장증이 있는 경우","6개월간의 화학요법 후에도 객담검사 결과가 양성인 경우"],"answer":1,"answerLabel":"①","answerPage":347,"explanation":"폐결핵은 기본적으로 내과적 치료가 원칙이나 암이\n의심될 때, 지속되는 다량의 재발성 객혈이 있는 경우, 6\n개월간의 화학요법 후에도 객담검사 결과가 양성인 경우,\n중하엽의 결핵성 기관지확장증이 있는 경우, 세균성 혹은\n진균성 감염이 동반된 파괴 폐가 있는 경우, 결핵균은\n음성이나 벽이 두꺼운 공동이 있어서 재발의 가능성이 있는\n경우 등에서는 수술을 고려할 수 있다. 소아의 폐결핵도\n원칙적으로는 약물요법 이다."},{"id":"c06-q120","chapterId":6,"number":120,"page":189,"stem":"폐 고혈압으로 유발될 수 있는 문제는?","choices":["폐동맥 협착","좌심실 부전","삼첨판 역류","승모판 협착","폐 순응도 증가"],"answer":3,"answerLabel":"③","answerPage":347,"explanation":"폐동맥 고혈압으로 폐동맥압이 점점 높아져서 우심실\n긴장과 팽창을 일으키고 삼첨판이 완전히 닫히지 않을 수\n있다. 폐동맥 고혈압은 폐동맥 협착, 좌심실 부전 또는 폐\n순응도를 증가시키지 않고, 승모판 협착은 폐 고혈압과\n관련되지 않는다."},{"id":"c06-q121","chapterId":6,"number":121,"page":189,"stem":"폐려 급성 폐손상 또는 급성호흡곤란증후군 환자의 치료 시 호기말양압(PEEP) 의 적용\n효과는?","choices":["폐동맥 단락 감소","모세혈관 누출 감소","최고기도압 상승","폐포 동원(alveolar recruitment) 증가","사강환기 (dead space ventilation) 증가"],"answer":4,"answerLabel":"④","answerPage":347,"explanation":"PEEP 은 급성 폐손상/급성호흡곤란증후군이 단락을\n발생시킬 경우에 사용되는 치료법이지만 PEEP0I 반드시\n단락 자체를 줄이지는 않는다. 오히려 PEEP 은 폐포 동원을\n증가시킴으로써 심각한 저산소혈증을 개선한다. PEEP 은\n모세혈관 누출을 감소시키지 않으며 사강환기나 최고기도압을\n상승시키지 않는다."},{"id":"c06-q122","chapterId":6,"number":122,"page":190,"stem":"급성 폐손상과 패혈 쇼크가 있는 환자에게서 가장 많은 산소 투여가 필요한 경우는?","choices":["PO 2 50 mmHg, SvO, 50 %","PO 2 80 mmHg, SvO, 80 %","PO, 50 mmHg, SvO, 85 %","PO, 55 mmHg, SvO, 50 %","PO, 85 mmHg, SvO? 60 %"],"answer":3,"answerLabel":"③","answerPage":347,"explanation":"불응성 저산소혈증은 급성 폐손상/급성호흡곤란\n증후군과 빈약한 산소소비량(VOJ 에서 보이며, 이로 인해\n패혈 쇼크에서 혼합된 정맥 내 산소가 상승된다."},{"id":"c06-q123","chapterId":6,"number":123,"page":190,"stem":"지난 며칠 동안 호흡곤란 기침, 피로감, 체위 의존 부종을 호소하는 50세 환자의 치료\n계획 시 고려해야 할 것은?","choices":["스트렙토키나아제(streptokinase) 치료","심장 기능 평가를 위한 입원 의뢰","furosemide 40 mg 경구 투여","칼슘통로차단제 추가 투여","흉관 삽입"],"answer":2,"answerLabel":"②","answerPage":347,"explanation":"기침이 증가함에 따라 호흡 곤란과 피로를 보이면\n조기 폐부종을 의심할 수 있다. 폐부종이 있거나 의심되는\n환자는 외래에서 치료하면 안 되고 입원해야 하며 , 산소치료,\n정맥주사로 furosemide (Lasix), morphine 투여가\n필요하다. 칼슘통로차단제는 거의 도움이 되지 않는다."},{"id":"c06-q124","chapterId":6,"number":124,"page":190,"stem":"만성폐쇄폐질환이 있는 50세 환자가 호흡곤란이 심해지고, 체온 39℃, 므백박 104회/분,\n호흡수 44회/분 산소포화도 84% 이며, 양쪽 폐 기저부에서 수포음이 들려 폐렴이 의심\n된다. 0| 환자는 현재 Tenormin 25 mg, PO, qd； prednisone 10 mg, PO, qd； Lovastatin\n20mg, PO, qd； ipratropium bromide 18 pg, 1-2 puffs, qid, pm； fluticasone propionate\n100/50, 2 puffs, bid로 약물치료 중이다. 이 중 면역 손상을 초래할 수 있는 약물은?","choices":["Tenormin","Lovastatin","Prednisone","Ipratropium bromide","Fluticasone propionate"],"answer":3,"answerLabel":"③","answerPage":347,"explanation":"prednisone은 면역기능을 억제하는 작용을 하는\n약물로 면역력이 저하된 환자에게 투여 시 면역기능을 더욱\n악화시킬 수 있다."},{"id":"c06-q125","chapterId":6,"number":125,"page":190,"stem":"68세 남자가 3일 동안 389C의 발열, 권태감, 오한 피로감, 호흡곤란이 있어 입원하였\n匚卜. 최근 2주간 폐렴막대균(Klebsi에a pneumonia)을 치료하다가 퇴원하였고, 고혈압, 관\n절염, 당뇨병의 과거력이 있으며, 매일 반 갑〜한 갑 정도 흡연하고, 소주 1~2병을 주 2\n회 마신다고 한다 단순흉부촬영상에서 오른쪽 폐상엽의 경화가 보인다 이 환자에게 의\n심되는 상태는?","choices":["폐결핵","폐농양","폐출혈","폐색전증","재발성 폐렴"],"answer":2,"answerLabel":"②","answerPage":347,"explanation":"최근 그람음성균 폐렴의 과거력을 고려할 때 폐농양을\n의심할수 있다."},{"id":"c06-q126","chapterId":6,"number":126,"page":191,"stem":"다음 중 기흉에 대한 설명으로 옳은 것은?","choices":["폐동맥압이 30 mmHg를 초과한다.","병변 부위에서 쌕쌕거림이 청진된다.","빈맥, 호흡곤란, 저혈압이 동반된다.","병변 부위의 촉각진동감이 증가된다.","갑작스럽게 날카로운 흉막 통증이 유발된다."],"answer":3,"answerLabel":"③","answerPage":347,"explanation":"기흉은 발생한 부위의 호흡음이 감소 혹은 소실되고,\n빈맥, 호흡곤란, 저혈압이 동반된다. 갑작스럽게 날카로운\n흉막 통증이 유발되는 것은 흉막염의 증상이다."},{"id":"c06-q127","chapterId":6,"number":127,"page":191,"stem":"다음은 오토바이 사고로 내원한 30세 남자환자의 흉부 컴퓨터단층촬영 사진이다 흉통\n을 호소하는 이 환자에게 의심되는 상태는?","choices":["기흉","폐렴","폐색전","폐좌상","공기낭종"],"answer":1,"answerLabel":"①","answerPage":347,"explanation":"이 환자는 기흉이 있으며, 오른쪽 폐에 검게 표시된\n곳이 공기가 찬 것이다."},{"id":"c06-q128","chapterId":6,"number":128,"page":191,"stem":"키가 크고 마른 21 세 남자가 오른쪽 흉부의 통증과 호흡곤란이 있어 내원하였다. 환자\n는 숨을 들이마실 때 칼로 찌르는 듯한 통증이 갑자기 생겼다고 하며 통증이 사라졌다\n가 다시 나타나는 것이 반복된다고 한다. 오른쪽 흉부의 촉각진동감과 호흡음이 감소되\n었고 단순흉부촬영상이 다음과 같을 때 이 환자에게 의심되는 상태는?","choices":["자발 기흉","만성 기관지염","흉막염","기관지확장증","폐렴"],"answer":1,"answerLabel":"①","answerPage":347,"explanation":"자발 기흉은 키가 크고 마른 젊은 남자에서 주로\n발생하며 통증 양상을 보면 숨을 크게 들이마실 때 칼로\n찌르는 듯한 통증이 있고 지속적이지 않고 사라졌다가\n다시 나타나는 것이 반복된다. 단순흉부촬영상에서도\n오른쪽 폐에 기흉이 있음을 알 수 있다."},{"id":"c06-q129","chapterId":6,"number":129,"page":192,"stem":"36세 환자가 폐렴으로 인해 호흡곤란이 있어 기계환기 중이다. 갑자기 인공호흡기의 고\n압 경고음(high-pressure alarm)이 계속 울리며, 환자는 안절부절 못하고, 빈호흡, 빈맥\n과 혈압 저하가 있으며 산소포화도가 82%이고, 오른쪽 폐의 호흡음이 감소되고 왼쪽으\n로 기관이 편위 되었다. 가장 우선적인 중재는?","choices":["PEEP 올림","단순흉부촬영","morphine 투여","흉강천자 시행","혈압상승제 투여"],"answer":4,"answerLabel":"④","answerPage":347,"explanation":"이 환자는 기계환기로 인한 긴장 기흉(tension pneu\nmothorax)이 발생한 경우로 증상으로는 빈맥, 빈호흡,\n초조, 발한, 기관지 이동, 이환된 폐의 호흡음 감소,\n최대기도압(PIP) 상승, 산소포화도 또는 동맥혈 산소분압\n감소, 저혈압, 심정지 등이 있다. 즉시 흉관또는 주사바늘)\n을 삽입하여 공기를 외부로 뺌으로써 흉곽내 압력을 줄여야\n한다."},{"id":"c06-q130","chapterId":6,"number":130,"page":192,"stem":"3 m 높이에서 추락하여 응급실에 온 40세 남자가 호흡곤란을 호소하며 단순흉부촬영\n상에서 오른쪽 폐에 절반 정도의 기흉이 있을 때 적절한 중재는?","choices":["단순 관찰","고농도산소 투여","기관내삽관","흉관 삽입","응급 개흉술((thoracotomy)"],"answer":4,"answerLabel":"④","answerPage":347,"explanation":"이 환자는 외상성 기흉(traumatic pneumothorax)0|\n있는 상태로 모든 외상성 기흉은 흉관을 삽입하여 치료해야\n한다."},{"id":"c06-q131","chapterId":6,"number":131,"page":192,"stem":"키가 크고 마른 20세 남자가 오늘 오후 안정 시 발생한 흉통이 있어 응급실에 왔다. 단\n순흉부촬영상에서 왼쪽 폐에 기흉이 있을 때 고려할 중재로 옳지 않은 것은?","choices":["단순 관찰","고농도산소 투여","기관내삽관","단순 흉강천자","흉관 삽입"],"answer":3,"answerLabel":"③","answerPage":347,"explanation":"0| 환자는 원발성 자발フ|흉(primary spontaneous\npneumothorax)0| 의심되며, 치료로는 단순 관찰, 산소\n공급, 단순 공기 제거, 흉관 삽입, 개흉술 등이 있는데\n기흉의 크기와 상황에 따라 알맞은 방법을 선택한다."},{"id":"c06-q132","chapterId":6,"number":132,"page":192,"stem":"24세 남자가 갑자기 발생한 흉통이 있어 응급실에 왔다. 혈압 110/80 mmHg, 맥박 100\n회/분, 호흡수 27회/분이고 왼쪽 폐 타진 시 과다공명음이 들리며 호흡음이 감소되어 있\n다. 이 환자에게 필요한 검사는?","choices":["심전도","심초음파","기관지경술","단순흉부촬영","흉부 컴퓨터단층촬영"],"answer":4,"answerLabel":"④","answerPage":347,"explanation":"이 환자는 원발성 자발 기흉(primary spontaneous\npneumothorax)0| 의심되며, 치료를 위해서는 기흉의\n크기가 매우 중요한 지표가 돈！다. 기흉의 크기는\n단순흉부촬영상에서 기흉이 흉곽의 몇 %를 차지하는가를\n측정하는 것이다."},{"id":"c06-q133","chapterId":6,"number":133,"page":193,"stem":"55세 남자가 달리던 오토바이에 치여 왼쪽 가슴 전체가 멍이 들었고 숨 쉴 때마다 가슴\n통증이 심해 응급실에 왔다. 왼쪽 폐 타진 시 둔탁음이 있고 호흡음이 잘 들리지 않으\n며, 혈압 100/70 mmHg, 맥박 110회/분, 호흡수 25회/분, 체온 36.8℃이다. 이 환자에게\n우선적으로 시행해야 할 것은?","choices":["심초음파","흉관 삽입","기관내삽관","흉부 컴퓨터단층촬영","개흉술(thoracotomy)"],"answer":2,"answerLabel":"②","answerPage":347,"explanation":"이 환자는 외상성 혈흉이 의심되므로 지체 없이 흉관을\n삽입해야 한다."},{"id":"c06-q134","chapterId":6,"number":134,"page":193,"stem":"24세 남자가 날아온 야구공에 오른쪽 가슴을 맞은 후 가슴 통증과 호흡곤란이 있다고\n한匚卜. 오른쪽 가슴에 반상출혈이 보이고 혈압 120/70 mmHg, 므너브キ 105회/분, 호흡수 26\n회/분, 체온 36.7℃이다. 단순흉부촬영상이 다음과 같을 때, 우선적인 중재는?","choices":["흉관 삽입","이뇨제 투여","고농도산소 투여","기관내삽관과 기계환기","응급 개흉술(thoracotomy)"],"answer":1,"answerLabel":"①","answerPage":347,"explanation":"이환자는 외상성 혈흉이 의심되므로 지체 없이 흉관을\n삽입해야 한다."},{"id":"c06-q135","chapterId":6,"number":135,"page":193,"stem":"68세 남자가 폐암으로 진단되어 폐절제술을 시행하려고 한다. 이 환자의 수술을 위해\n확인할 사항으로 옳지 않은 것은?","choices":["빈혈이 없는가?","소세포암이 분명한가?","전해질 이상이 없는가?","병변의 완전 절제가 가능한가?","1 초간 노력성 호기량(FEVJ 이 1 L는 되는가?"],"answer":2,"answerLabel":"②","answerPage":347,"explanation":"폐암에서 수술을 고려할 때 ⑴비소세포암이 분명한가,\n⑵환자의 생리적 상태가 수술을 감당할 만한가, ⑶병변의\n완전 절제가 가능한가에 대한 답이 있어야 한다. 즉 정확한\n병리학적 병기와 환자의 생리학적 상태에 대한 판정이\n있어야 한다. 생리적 상태: 빈혈, 전해질 이상은 미리\n교정하고 수술 전 FEM 이 1 L 미만일 경우에는 어떤\n절제술도 힘들다."},{"id":"c06-q136","chapterId":6,"number":136,"page":194,"stem":"다음 비소세포폐암의 병기 중 수술이 불가능한 경우는?","choices":["Stage I","Stage IIA","Stage IIB","Stage IHA","Stage IIIB"],"answer":4,"answerLabel":"④","answerPage":348,"explanation":"Stage II旧와 Stage IV는 절제 불가능하다."},{"id":"c06-q137","chapterId":6,"number":137,"page":194,"stem":"다음 중 수술이 불가능한 폐암은?","choices":["선암","대세포암","소세포암","편평상피암","기관지폐포암"],"answer":3,"answerLabel":"③","answerPage":348,"explanation":"치료와 관련해 임상적으로 폐암은 소세포암과\n비소세포암으로 분류한다. 임상적으로 편평상피암, 선암,\n대세포암(기관지폐세포암은 선암의 일종)은 병기 판정과\n치료방법이 동일하기 때문에 비소세포암으로 분류된다.\n소세포암은 다른 종류의 폐암과 달리 초기인 경우에도\n수술적 치료보다는 항암화학요법으로 치료한다 ."},{"id":"c06-q138","chapterId":6,"number":138,"page":194,"stem":"다음 중 폐암 수술 전 반드시 시행해야 할 검사가 아니 것은?","choices":["폐기능검사","흉부 컴퓨터단층촬영","양전자방출단층촬영","뇌 자기공명영상","대장내시경검사"],"answer":5,"answerLabel":"⑤","answerPage":348,"explanation":"폐암의 확진과 병기 결정을 하기 위해서는 단순흉부촬영,\n흉부 컴퓨터단층촬영 , 객담세포진검사 조직검사를 시행하고 ,\n전이 여부를 확인하기 위해서 뇌 자기공명영상,\n양전자방출단층촬영을 시행한다. 흉부 CT 는 종양의 크기,\n위夭I, 주위 장기와의 곤切I, 림프절 침범을 평가하는 데\n필수적인 검사이다. PET 는 병기 판정에 이용되며, 종격동\n림프절의 전이 여부와 원격 전이 여부를 알 수 있다. 최근에는\nCT 와 PET 를 동시에 시행하는 PET-CT 도 사용된다. Brain\nCT 또는 MRI 는 폐암에서 뇌전이 여부를 확인하기 위해\n시행하며 , 특히 선암의 경우 증상 없이 뇌전이가 있는 경우가\n많으므로 병기 판정에 이 검사를 하는 경우가 많다."},{"id":"c06-q139","chapterId":6,"number":139,"page":194,"stem":"다음 폐암 환자 중 수술이 가능한 경우는?","choices":["T4N2M0","소세포암","수술 전 FEV 1 2.2 L","2개월 전 심근경색증 발생","폐확산능(DLco)의 수술후 예측치 75%"],"answer":3,"answerLabel":"③","answerPage":348,"explanation":"T4N2M0 (=stage IIIB), 소세포암은 수술이\n불가능하며 , 환자가 수술에 견딜만한 생리적 상태인지를\n혹인하기 위해 3개월 이내에 발생한 심근경색증, DLco\n의 수술후 예측치 80% 이상인지를 확인하는 것이 중요하다."},{"id":"c06-q140","chapterId":6,"number":140,"page":194,"stem":"65세 남자가 비소세포폐암으로 진단 받았으며, 병기는 T2N1M00I4. 현재 다른 전신상\n태는 양호하며, 폐기능검사 상 1 초간 노력성 호기량(FEV1) 이 2.6L일 때, 가장 적절한 중\n재는?","choices":["폐절제술","방사선 치료","항암화학요법","항암화학요법과 방사선 치료","항암화학요법. 폐절제술, 방사선 치료"],"answer":1,"answerLabel":"①","answerPage":348,"explanation":"비세포폐암의 경우 stage I~IIIA까지는 수술이\n가능하다. 이 환자는 stage IIB로 환자가 수술을 견딜 수\n있다면 최선의 치료는 수술적 절제이다. 수술 가능성은\n생리적 병기(physiologic staging)에 의해 결정되는데\n폐기능검사 상 FEV)2.5L이거나 예측치의 80% 이상이면\n일반적으로 폐절제술이 가능하다."},{"id":"c06-q141","chapterId":6,"number":141,"page":195,"stem":"간경화증으로 복수가 있는 50세 남자가 심한 호흡곤란과 기침을 호소하여 시행한 단순\n흉부촬영상에서 오른쪽 폐 기저부에 흉수가 관찰되었다. 흉수를 분석한 결과가 누출액\n(transudate)일 때 적절한 중재는?","choices":["흉강 천자","흉관 배액","항생제 투여","흉막복막 션트","간경화증과 복수 치료"],"answer":5,"answerLabel":"⑤","answerPage":348,"explanation":"간경화와 복수가 있는 환자의 약 5% 에서 흉수가\n동반되며, 가장 중요한 발생기전은 복수가 횡격막의 작은\n구멍결함 부위을 통해 흉막강으로 이동하는 것이다. 흉수는\n보통 오른쪽에 나타나고 심한 호흡곤란을 보일 정도록 많은\n양의 흉수를 보이는 경우가 많다. 흉수와 복수가 모두\n누출액(transudate)임을 확인하여 진단하며, 누출액인\n경우는 원인을 치료하는 것이 원칙이므로 간경화증과\n복수를 치료한다."},{"id":"c06-q142","chapterId":6,"number":142,"page":195,"stem":"흉통을 호소하는 환자의 단순흉부촬영상에서 심장비대와 폐의 양쪽에 소량의 흉막삼출\n(pleural effusion)0| 관찰되었고, 흉강천자를 하여 흉수를 분석한 결과가 단백질 3.0 g/\ndL, 유수탈수소효소(LDH) 100 U/L이었다. 이 환자의 혈청 단백질이 7.0 g/dL, LDH가\n250 U/L일 때 적절한 중재는?","choices":["흉관 배액","항생제 투여","항결핵제 투여","치료적 흉강천자 시행","심장 수축촉진제(inotropics) 투여"],"answer":5,"answerLabel":"⑤","answerPage":348,"explanation":"이 환자의 흉수는 누출액(transudate)이며, 누출액의\n가장 흔한 원인인 울혈심부전증(congestive heart failure)\n관련 흉막삼출이다. 누출액의 경우는 원인을 치료하는\n것이 원칙으로 이 환자의 경우 질환 자체를 치료하는 것이\n원칙이다. 치료는 전부하를 감소시키기 위한 이뇨제 투여,\n심박출량을 증가시키기 위한 수축촉진제 투여, 적정한\n혈압 조절을 통한 후부하의 감소 등을 포함한다. 흉막삼출이\n있는 경우 단순한 치료적 흉강천자는 흉강압을 더 감소시켜\n흉막삼출을 더 악화시킬 수 있고, 흉수내 단백질이나\n혈액응고 성분이 원인질환을 더 악화시킬 수 있다(단, 대량의\n흉수로 인해 심한 호흡곤란을 호소하면 500~1000 mL를 천자해\n준다). 심부전 치료를 해도 흉수가 계속 남아 있으면 진단\n목적으로 흉강천자를 시행한다."},{"id":"c06-q143","chapterId":6,"number":143,"page":195,"stem":"38세 남자가 3일전부터 열이 나고 호흡 시 오른쪽 가슴에 통증이 있다고 한다 단순흉\n부촬영상에서 오른쪽 폐에 흉막삼출이 있어 흉강천자를 하여 흉수를 분석한 결과 농이\n보이며, 단백질 4.1 g/dL, 포도당 35 mg/dL이었고, 이 환자의 혈청 단백질 6.5 g/dL, 포\n도당 110 mg/dL일 때 적절한 중재는?","choices":["흉관 배액","항암제 투여","흉막성형술","항결핵제 투여","종격동 방사선 치료"],"answer":1,"answerLabel":"①","answerPage":348,"explanation":"누출성 흉수와 삼출성 흉수는 흉수의 단백질과 LDH\n농도를 측정하여 구분한다. 삼출성 흉수는 다음 기준 중\n최소 한 가지에 해당되지만 누출성 흉수는 어느 한 가지도\n해당되지 않는다: 1) 흉수 단백질/혈청 단백질〉0.5, 2)\n흉수 LDH/혈청 LDH > 0.6, 3) 흉수 LDH〉혈청 LDH\n의 정상 상한값의 2/3. 이 경우는 흉통과 고열이 있는\n세균성 폐렴으로 인한 부폐렴 삼출액임을 알 수 있다.\n흉수가 농인 상태는 흉관 삽입으로 흉수의 지속적인 배출01\n필요하다."},{"id":"c06-q144","chapterId":6,"number":144,"page":195,"stem":"55세 남자가 호흡곤란으로 내원하였다. 단순흉부촬영상에서 오른쪽 폐상엽에 덩어리가\n있으며, 얼굴과 팔이 많이 부어 있고 목의 정맥이 확장되어 있을 때 이 환자에게 의심되\n는 상태는?","choices":["폐농양","결핵종","폐색전증","심장눌림증","상대정맥증후군"],"answer":5,"answerLabel":"⑤","answerPage":348,"explanation":"상대정맥증후군(superior vena cava syndrome)은\n상대정맥 폐색으로 인한 두경부와 상지로부터의 정맥\n순환의 심한 감소로 초래되는 임상 양상이다. 주 원인은\n폐암, 림프종, 전이성 암 같은 악성 종양이다. 특히 소세포\n폐암과 편평상피세포폐암과 같은 폐암은 모든 원인이 되는\n악성 종양의 약 85% 를 차지한다. 대개 목과 얼굴의 부종\n(특히 눈 주변), 호흡곤란과 기침을 동반한다."},{"id":"c06-q145","chapterId":6,"number":145,"page":196,"stem":"비소세포암으로 진단 받은 73세 남자가 호흡곤란과 얼굴이 붓고 충혈되어 내원하였다.\n목의 정맥이 확장되어 있고 다리 부종은 없다. 이 환자에게 적절한 중재는?","choices":["염분 공급","이뇨제 투여","산소공급 제한","화학요법 (chemotherapy)","바로 누운 자세로 침상 안정"],"answer":2,"answerLabel":"②","answerPage":348,"explanation":"이 환자는 상대정맥증후군이 의심되며, 저염식0|,\n이뇨제, 머리 올리기와 산소공급은 일시적으로 증상을\n완화시킬 수 있다. 방사선 치료는 비소세포폐암과 다른\n전이성 고형암에 의해 야기된 상대정맥증후군의 일차적인\n치료이다."},{"id":"c06-q146","chapterId":6,"number":146,"page":196,"stem":"폐절제술 후 기계환기 중인 환자의 간호에 있어 인공호흡기 관련 폐렴(ven胎tor associated\npneumonia)을 예방하기 위한 근거중심실무는?","choices":["침상머리를 30~45° 올린다.","매 8시간 마다 구강간호를 시행한다.","매일 인공호흡기 회로를 교환한다.","환자의 구강점막을 건조하게 유지한다.","장기간 기관내관이 필요하면 비강으로 배치한다."],"answer":1,"answerLabel":"①","answerPage":348,"explanation":"24시간 이상 기관내관을 가지고 있는 환자에서는\n인공호흡기 관련 폐렴(VAP) 의 발생빈도가 의미 있게\n증가한다. 구강 또는 위내 액체의 흡인과 구강내 집락형성\n(colonization)Ol VAP 를 발생시키는 전구물질로 생각되고\n있다. 환자가 바로 누운 자세(supine)로 있으면 흡인 발생이\n증가하므로 침상머리를 30~45로 상승시키는 것이 발생을\n감소시킬 수 있다. 구강간호는 2~4시간마다 시행해야\n하며 , 구강간호가 4시간 이상 지연되면 효과가 감소된다.\n또한 연구에 의하면 인공호흡기 회로를 오래 사용해서\nVAP 의 발생이 증가하지 하지 않았으므로 자주 회로를\n교환하는 것이 필요하지 않다. 기계환기는 침에 영향을\n주어 구강점막을 건조하게 만들고 점막염(mucositis과\n그람 음성 집락형성을 만들므로 구강 청결 시 구강 보습제를\n적용해야 한다. 장기간(3일 이상의 기관내관과 위관은\n금기가 아니거나 환자가 참을 수 있다면 구강으로 배치해야\n한다."},{"id":"c06-q147","chapterId":6,"number":147,"page":196,"stem":"기계환기를 위해 기관내삽관을 시행하였다 기관내관의 위치가 적절한지 확인하는 방법\n으로 옳지 않은 것은?","choices":["단순흉부촬영","상복부 청진","호기말 이산화탄소분압 측정","대칭적인 흉곽 움직임 관찰","위관 삽입"],"answer":5,"answerLabel":"⑤","answerPage":349,"explanation":"상복부(명치 부위에서 공기 소리나 콸콸하는 소리\n(gur이ing)가 청진되면 식도내 삽관을 의심한다. 식도내\n삽관을 감별하기 위해 호기말 이산화탄소분압 측정기를\n사용하고, 양쪽 흉곽 팽창을 관찰하거나 호흡음을 비교하여\n청진한다. 단순흉부촬영으로 기관내관의 끝을 확인한다."},{"id":"c06-q148","chapterId":6,"number":148,"page":196,"stem":"기관내삽관이 정확하게 되었음을 알 수 있는 소견이 아닌 것은?","choices":["일회용 이산화탄소 감지기를 통해 색깔의 변화가 확인된다.","상복부 청진 시 공기 흐름이나 콸콸하는 소리(gurgling)가 들린다.","양쪽 폐의 첨부와 기저부에서 동일한 호흡음이 들린다.","기관내관 안에 호기 시 수증기가 생긴다.","대칭적인 흉곽의 움직임이 관찰된다."],"answer":2,"answerLabel":"②","answerPage":349,"explanation":"일회용 이산화탄소 감지기를 통해 색깔의 변화가\n있으면 CO? 가 나오는 것을 알 수 있으며，이는 기관내관의\n적절한 위치를 나타내는 지표가 된다. 기관내관의 적절한\n위치는 일차적으로 성대를 통해 기관내관이 통과하는 것을\n눈으로 확인하는 것, 상복부 위로 공기 흐름이나 콸콸하는\n소리의 부재이런 소리는 식도내 삽관이 되었음을 의미함), 양쪽\n폐의 동일한 호흡음, 양쪽 흉곽의 대칭적인 움직임 , 기관내관\n내의 수증기로 확인할 수 있다."},{"id":"c06-q149","chapterId":6,"number":149,"page":196,"stem":"폐엽절제술 후 아직 기관내관을 가지고 있는 환자의 간호로 옳지 않은 것은?","choices":["정기적인 기도 흡인","적절한 전신 수분 공급","1 일 2회 이상 칫솔을 이용한 구강 간호","2~4시간마다 구강 세척제를 이용한 구강 소독","주기적으로 기관내관의 커프 압력 측정"],"answer":1,"answerLabel":"①","answerPage":349,"explanation":"기도 흡인은 정기적이고 정해진 시간에 이루어지는\n처치가 아니라 실제로 필요한 상황에서만 시행해야 한다.\n적절한 전신 수분 공급과 흡입 가스(inspired gas)에 대한\n보조적인 가습은 분비물을 묽게 하여 기도 흡인을 쉽게\n한다. 좋은 구강 위생은 VAP 와 관련 있는 구인두 집락을\n감소시키며, 구강 간호는 2~4시간마다 시행해야 구강\n건강이 눈에 띄게 좋아지는 것을 볼 수 있다. 기관내관의\n커프 압력은 20~25mmHg로 유지하여 흡인의 위험을\n줄이고, 과도한 팽창으로 인한 기도 손상을 막기 위해\n주기적으로 커프 압력을 모니터 하도록 한다."},{"id":"c06-q150","chapterId":6,"number":150,"page":197,"stem":"1일 전 폐엽절제술을 받은 환자에게 흉부물리요법을 시행하려고 할 때 사용할 수 있는\n방법으로 옳지 않은 것은?","choices":["체위배액","흉부 타진","횡격막 호흡","기침 유발을 위해 고장성 식염수 흡입","고빈도흉벽진동(high-freq니ency chest wall oscillation) 조끼 적용"],"answer":4,"answerLabel":"④","answerPage":349,"explanation":"흉부물리요법에는 체위배액, 흉부 타진과 진동, 기침,\n호흡 재훈련(횡격막 호흡, 입술 오므리고 숨쉬기이 포함된다.\n기관지나 기관의 벽에 붙어 있는 분비물을 떼어 내고 밖으로\n배출시키기 위해서는 흉벽 타진과 진동 또는 고빈도 흉벽진동\n조끼를 활용하기도 한다. 이 조끼는 공기를 이용하여 흉벽을\n초당 8~18회 두드림으로써 기도 벽에 붙어 있는 분비물을\n분리시켜 환자가 기침을 해서 뱉어낼 수 있게 해준다."},{"id":"c06-q151","chapterId":6,"number":151,"page":197,"stem":"오른쪽 폐상엽절제술을 받은 환자가 중환자실로 왔다. 입실 당시 통증에 반응이 없고,\n자발호흡이 없으며, SIMV 방식, 호흡수 10회/분 일회호흡량 10 mL/Kg, PEEP 5 cmH20,\nFiO2 0.4로 기계환기를 시작했다 15분후 시행한 동맥혈 가스분석 결과가 pH 7.38, PaCO2\n41 mmHg, PaO 2 72 mmHg, HCOj 24 mEq/L일 때, 적절한 중재가 아닌 것은?","choices":["산소농도를 올린다.","마취제의 종류를 확인한다.","수술 시 진정제 사용 여부를 확인한다.","수술 시 신경근육차단제의 사용 여부를 확인한다.","뇌 컴퓨터단층촬영을 시행한다"],"answer":1,"answerLabel":"①","answerPage":349,"explanation":"이 환자는 PaO 2 60~70 mmHg를 유지하는 것을\n목표로 曰。?를 내린다. 환자가 자발호흡이 없고 반응이\n없으므로 마취 관련하여 사용한 마취제 종류, 마취 형태,\n수술 시 진정제 사용 여부를 확인하고 급성 신경계 손상\n여부도 고려할 필요가 있다."},{"id":"c06-q152","chapterId":6,"number":152,"page":197,"stem":"폐절제술 후 나타날 수 있는 합병증 중 수분을 제한함으로써 예방할 수 있는 것은?","choices":["폐부종","흡인 폐렴","심근경색증","수술후 무기폐","폐쇄후 폐부종"],"answer":1,"answerLabel":"①","answerPage":349,"explanation":"흉복부 수술을 받은 환자에서 이전에 없던 폐부종\n발생의 가장 흔한 원인은 수액과다 투여나 울혈심부전\n같은 심장성 폐부종이다. 폐쇄후 폐부종(post-obstructive\npulmonary embolism)은 마취 후 기관내관 발관 후 갑작스런\n상기도 폐쇄에도 불구하고 흡기에 의한 음압이 너무 강하면\n발생할 수 있으며 , 치료는 산소 투여 , 이뇨제 투여 등\n보존적 요법이다."},{"id":"c06-q153","chapterId":6,"number":153,"page":197,"stem":"수술로 인한 폐의 변화에 관한 설명으로 옳은 것은?","choices":["마취 후 저하된 폐 기능이 정상으로 회복되기 위해서는 평균 72시간 정도 소요 된다.","총폐활량(TLC)과 폐활량(VC )이 모두 감소한다.","마취로 인해 정상 기도 방어 기전이 소실되어 무기폐의 위험이 높다.","수술 시 마취로 인한 호흡 자극의 약화 또는 소실로 인해 저산소증이나 고탄산 혈증이 초래된다.","환기/관류비 불균형(V/Q mismatching)으로 인해 호흡성 산증이 초래된다."],"answer":4,"answerLabel":"④","answerPage":349,"explanation":"정상폐기능의회복은 보통 7일 정도소요되며수술\n후 가장 많이 발생하는 폐합병증은 무기폐가 대표적이다.\n마취 시 기도의 정상 방어 기전의 소실은 흡인 폐렴을 유발할\n수 있다. 수술 후 마취제나 진통제의 사용은 호흡 유발 반사를\n저하시켜 호흡성 산증을 야기할 수 있으며 혼卜기/관류비\n불균형은 저산소증을 초래할 수 있다."},{"id":"c06-q154","chapterId":6,"number":154,"page":197,"stem":"수술 후 저산소증을 초래할 수 있는 원인에 해당하는 것은?","choices":["분당 환기량 감소","호흡일(WOB ) 증가","기능잔기용량(FRC ) 감소","마취로 인한 호흡근 약화","점액섬모청소율(mucociliary clearance) 저하"],"answer":5,"answerLabel":"⑤","answerPage":349,"explanation":"호흡근의 약화, 기능잔기용량(FRC) 의 감소, 분당\n환기량의 감소는 수술 후 고탄산혈증을 일으킬 수 있다.\n점액섬모청소율 저하로 인해 가래 양이 증가하면 저산소증을\n초래할수 있다."},{"id":"c06-q155","chapterId":6,"number":155,"page":198,"stem":"수술 후 폐합병증인 무기폐를 유발하는 가장 큰 원인은?","choices":["심박출량 감소","고농도 산소 적용","반복적인 얕은 호흡","중추신경계의 과도한 자극","조절되지 않는 고열증(hyperpyrexia)"],"answer":3,"answerLabel":"③","answerPage":349,"explanation":"점막 섬모의 기능 저하 호흡근의 약화 환기 자극 감소,\n통증, 약물 사용 등은 기침 반사를 억제하고 심호흡을\n저해하여 이로 인한 빠르고 얕은 호흡은 무기폐를 초래한다."},{"id":"c06-q156","chapterId":6,"number":156,"page":198,"stem":"오른쪽 폐 하엽에 가래로 인한 무기폐가 발생하였을 경우 체위배액 방법으로 옳은 것은?","choices":["두부 거상 30° 이상","왼쪽으로 돌아누워 하지 거상 18인치","왼쪽으로 돌아누워 하지 거상 15인치","오른쪽으로 돌아누워 하지거상 18인치","오른쪽으로 돌아누워 하지거상 15인치"],"answer":2,"answerLabel":"②","answerPage":349,"explanation":"체위배액의 목적은 중력을 이용하여 가래를 용골\n(carina)쪽으로 이동하게 하여 배출시키는 것이다. 하엽의\n병변인 경우 하지 쪽을 18인치(45 cm) 이상 거상하여\n용골보다 위쪽으로 위치하도록 한다."},{"id":"c06-q157","chapterId":6,"number":157,"page":198,"stem":"다음 중 수술 전후 흉부물리요법 시행이 적절하지 않은 경우는?","choices":["급성 악화로 입원한 천식 환자","낭성섬유증으로 수술대기 중인 소아 환자","대장암 수술 후 괴사성 폐렴이 발생한 환자","폐절제술 후 오른쪽 상엽의 무기폐가 발생한 폐암 환자","고관절 수술 후 양쪽 폐 침윤으로 인한 저산소증이 있는 환자"],"answer":1,"answerLabel":"①","answerPage":349,"explanation":"급성기 기도 청결 간호가 필요한 경우는 다량의 가래,\n가래로 인한 호흡부전이 예상되는 경우(호흡음의 변화, 동맥혈\n가스분석의 악화, 단순흉부촬영상의 변화), 무기폐, 폐침윤이나\n경화로 인한 환기/관류 불균형이 발생한 경우이다. 천식의\n급성 악화 시 흉부물리요법은 기도 경련이나 공기걸림(air\ntrapping의 증가를 초래하여 호흡일(W0B) 을 증가시킬\n수 있다."},{"id":"c06-q158","chapterId":6,"number":158,"page":198,"stem":"유발폐활량측정법(incentive spirometry) 적용 시 500 mL/초의 속도로 볼을 올려 3초\n정도 숨을 멈추었다면 실제 흡입된 공기량은 얼마인가?","choices":["1 L","1.5 L","2 L","2.5 L","3 L"],"answer":2,"answerLabel":"②","answerPage":349,"explanation":"flow=tidal volume/inspiratory time이므로 500\nmL/초 * 3초거 500 mL 또는 1.5 L"},{"id":"c06-q159","chapterId":6,"number":159,"page":198,"stem":"수술 후 유발폐활량측정법(incentive spirometry) 적용 후 환자가 입 주위가 저리고 어\n지럼증을 호소한다. 이 증상의 원인으로 생각되는 것은?","choices":["피로","과환기","복부팽만","폐 압력손상","호흡성 산증"],"answer":2,"answerLabel":"②","answerPage":349,"explanation":"유발폐활량측정법(incentive spirometry) 적용 시\n부작용은 과환기 및 호흡성 알칼리증, 부적절한 통증 조절로\n인한 불편감, 폐 압력 손상, 기관지 경련의 악화, 피로\n등이다."},{"id":"c06-q160","chapterId":6,"number":160,"page":199,"stem":"수술 후 폐 합병증이 발생하여 객담을 검사하려고 한다. 하기도에서 객담을 채취하기 위\n한 적절한 방법은?","choices":["비강 흡인","기관지 흡인","기관지내시경","구강 인후두 흠인","하기도 내 경침 흡인"],"answer":2,"answerLabel":"②","answerPage":349,"explanation":"비강 흡인, 구강 인후두 흡인, 기관지 내시경, 하기도\n내 경침 흡인은 상기도의 타액이 채취될 위험이 높아 검사의\n신뢰도가 떨어지며 , 멸균 카테터를 사용하여 기관 내에서\n객담을 채취하는 것이 가장 효과적이다."},{"id":"c06-q161","chapterId":6,"number":161,"page":199,"stem":"만성폐쇄폐질환이 있는 75세 남자가 대장암 수술 후 기관내관을 가진 상태에서 중환자\n실에 입실하였다. 흡입산소농도(FiOj 0.6, 공기 유량(flow) 10 L로 기관내관을 통해 산소\n를 공급하고, 2시간 후 환자의 의식이 회복되면서 시행한 동맥혈 가스분석 결과가 pH\n7.20, PaCO2 93.7 mmHg, PaO2155.3 mmHg, HCO「36.7 mEq/L, Base excess 5.6,\nSaO 2 99.1%일 때, 이 환자에게 적절한 중재는?","choices":["기관내관 발관","흡입산소농도 감소","산소 유량 증가","인공호흡기 연결","흉부물리요법 시행"],"answer":1,"answerLabel":"①","answerPage":349,"explanation":"만성폐쇄폐질환 환자에서 기관내삽관 후 인공호흡기를\n적용하지 않는 경우 기관내관으로 인한 기도 저항 증가로\n인해 호흡일(WOB) 의 증가를 초래할 수 있어 의식이 회복되고\n혈역학적으로 안정이 되었다면 기관내관의 발관을 먼저\n고려한다."},{"id":"c06-q162","chapterId":6,"number":162,"page":199,"stem":"다음 중 호흡재활의 목적으로 옳지 않은 것은?","choices":["증상 경감","폐기능 향상","삶의 질 향상","폐기능의 최대화","호흡곤란의 예방과 감소"],"answer":2,"answerLabel":"②","answerPage":350,"explanation":"호흡재활은 실제적인 폐기능의 개선이 아닌 호흡곤란\n증상을 경감시켜 삶의 질 향상을 도모하기 위함이다."},{"id":"c06-q163","chapterId":6,"number":163,"page":199,"stem":"다음 중 호흡재활 환자로 적절한 경우는?","choices":["맹장염 수술을 받은 치매 환자","최근 불안정협심증으로 치료받은 환자","낭성섬유증으로 폐 이식이 예정된 환자","무릎에 만성 관절염이 있어 서 있기 힘든 환자","왼쪽 폐절제술을 받은 지적 능력이 저하되어 학습이 불가능한 환자"],"answer":3,"answerLabel":"③","answerPage":350,"explanation":"심혈관계가 불안정하거나 관절염 또는 의식 저하가\n있는 경우 호흡재활 시 상태가 악화 될 수 있다."},{"id":"c06-q164","chapterId":6,"number":164,"page":199,"stem":"호흡근 훈련에 관한 설명으로 옳은 것은?","choices":["복부 근육이 흡기 근육의 주 역할을 담당한다.","호흡근의 근력이 정상치의 30% 정도로 약해진 경우에 효과적이다.","제한성 폐질환인 경우 호기근 훈련이 호흡근력 향상에 도움이 된다.","최대흡기압(maximal negative inspiratory pressure)과 동일한 압력에서 시작한다.","유량 저항성 (flow resistive) 호흡운동 기구와 역치 저항성 (threshold resistive) 호 흡운동 기구 방법이 일반적이다."],"answer":5,"answerLabel":"⑤","answerPage":350,"explanation":"흡기근은 횡격막이 주 근육으로서 70~80%의 역할을\n담당한다. 호흡근의 근력이 정상치의 25~30% 정도로\n약해지면 시행하지 않는 것이 좋다. 제한성 폐질환 환자에게는\n측 기저부 저항 운동법이나 흡기근 훈련이 호흡근력 향상에\n도움이 된다. 최대흡기압(Pimax)의 30% 에서 시작하여\n60~70%가 성취되도록 강도를 올린다. 유량 저항성(flow\nresistive) 호흡운동 기구 방법은 여러 가지 크기의 구멍을\n통해 흡입을 실시하게 함으로써 호흡 시 저항을 받게 한다.\n역치 저항성(threshold resistive) 방법은 일정한 압력 도달\n시 기구의 밸브를 열리게 함으로써 흡기 시 저항을 받게 한다."},{"id":"c06-q165","chapterId":6,"number":165,"page":200,"stem":"폐암으로 폐엽절제술을 시행한 환자의 호흡재활에 관한 설명으로 옳은 것은?","choices":["기저 폐질환이 없으면 최소 2주 전에 금연하게 한다.","수술 후 섬망 증세가 심하면 억제대를 적용하고 시행한다.","혈압 저하가 있는 경우에는 조기 재활을 위해 침대에 걸터앉기를 시행한다.","호흡곤란 시 개구리 호흡법(glossopharyngeal breathing 또는 frog breathing)이 효과적이다.","수술 전 FEV<1 L 또는 수술 후 DLco〈40% 미만, VO, max〈15 mL/Kg인 경우 조기 재활을 시행한다."],"answer":5,"answerLabel":"⑤","answerPage":350,"explanation":"금연은 최소 8주 전에 시행하도록 하는 것이 폐합병증\n감소에 도움이 된다. 일반적으로 섬망 증세는 억제대\n사용으로 더 진행할 수 있어 폐 수술 후 호흡재활 시 억제대\n사용은 하지 않으며, 섬망을 조절하는 약물요법이 더\n추천된다. 혈역학적으로 불안정하거나 의식이 명확하지\n않은 경우 재활은 보류하도록 한다. 개구리 호흡법은 상부,\n경부 척수 손상에 의한 사지 마비나 신경근육질환으로\n인한 호흡근 마비인 경우, 혀와 인두 근육을 이용하여 마치\n입안의 공기를 폐로 밀어 넣듯이 호흡하는 방법으로 한번에\n60-120 mL 정도 들이마시는 것을 6번 내지 9번 반복하여\n일회호흡량을 완성하고 분당 12~14회 시행한다특히\n예기치 않은 인공호흡기 작동 장애 시 시행할 수 있다). 흡기 근육\n보조 방법 중 가장 효과적이며 다른 흡기근 및 호기근\n기능이 전혀 없어도 이 호흡법을 통해 정상에 가까운 일회\n호흡량과 분당 환기량의 유지가 가능하다. 수술 전\n폐기능검사 확인 후 합병증의 가능성이 높은 지표들을\n관리하여 필요시 조기재활에 더 역점을 둔다."},{"id":"c06-q166","chapterId":6,"number":166,"page":200,"stem":"만성폐쇄폐질환이 있는 60세 환자에게 호흡재활을 시행하려고 할 때 옳은 것은?","choices":["횡격막 호흡이나 입술 오므리기 호흡법 등을 교육한다.","호흡근 강화를 위해 개구리 호흡법을 시행하도록 한다.","호흡곤란 시 공기 누적 훈련(air-stacking)으로 폐활량을 증진시킨다.","폐기능 개선을 위해 유발폐활량계(incentive spirometer)에 대해 교육한다.","폐용적 감소로 인해 산소화 장애가 발생할 수 있어 재활 시행 시 산소를 제공해 야 한다."],"answer":1,"answerLabel":"①","answerPage":350,"explanation":"제한성 폐질환 시 흡기근 향상을 위해 incentive\nspirometer에 대한교육을시행할수 있으며, 공기 누적\n훈련(air-stacking)은 주로 제한성 폐질환자에게 시행된다."},{"id":"c06-q167","chapterId":6,"number":167,"page":200,"stem":"척추 손상이 있는 75세 환자가 재발성 폐렴으로 입원하였다. 호흡재활을 시행하기 위해\n우선적으로 고려되어야 할 것은?","choices":["무기폐 예방을 위한 심호흡 교육","폐 확장을 위한 공기 누적(air-stacking) 훈련 시행","호기 시 분비물 배출을 위한 진동 유발 기기(flutter breathing) 사용","혈액가스 상태 개선과 호흡수 감소를 위한 입술 오므리기 호흡법 권장","호흡근의 근력과 지구력 증가를 위한 흡기근 훈련 보조 장비(inspiratory muscle trainer) 사용"],"answer":3,"answerLabel":"③","answerPage":350,"explanation":"가래 배출의 저하로 인해 반복적인 폐렴이 발생하는\n경우 가장 먼저 분비물 배출을 위한 간호를 제공해야 하며 ,\nflutter breathing 등과 같이 폐내 진동을 전달하는 장비를\n사용할 수 있다. 이는 호기압을 증가시켜 기도를 넓어지게\n하는 양압 호기 호흡법의 치료 효과와 기도 내 발생하는\n진동 효과를 이용하여 분비물 제거에 도움을 주는 기기이다."},{"id":"c06-q168","chapterId":6,"number":168,"page":200,"stem":"호흡재활 평가 중 운동능력 평가에 해당되지 않는 것은?","choices":["보그 스케일(Borg scale)","걷기검사(Walking tests)","운동부하검사(Incremental exercise tests)","최대하 운동검사(Submaximal exercise tests)","1 초간 노력 호기 폐활량/강제 폐활량의 비율(FEV/FVC)"],"answer":5,"answerLabel":"⑤","answerPage":350,"explanation":"1 초간 노력 호기 폐활량/강제 폐활량의 비율FEV1/\nFVC) 은 폐쇄성 폐질환의 지표이다."},{"id":"c06-q169","chapterId":6,"number":169,"page":200,"stem":"호기말 이산화탄소분압(Etcoj 측정과 관련된 설명으로 옳지 않은 것은?","choices":["EtCO2 파형으로 폐포 산소화의 적절성을 사정할 수 있다.","기관내관이 기도 내로 정확하게 삽입 되었는지를 확인하는 방법이다.","Pac。?는 EtCQ와 같으나 정상적인 경우 2〜5 mmHg 이하의 차이를 보이기도 한다","소아의 경우 빠른 호흡수로 인해 Etc。?가 PACQ 를 반영하지 못해 차이가 있을 수 있다.","심폐소생술 시 EtCQ가40 mmHg로 상승하면 순환이 회복되었음을 의미한다."],"answer":1,"answerLabel":"①","answerPage":350,"explanation":"소생술 시 터CO? 가 10 mmHg 이하로 저하되면\n심박출량이 충분치 않음을 의미하며 , 소생술이 성공적으로\n이루어져 순환이 완전히 회복되면 타C5가 40 mmHg\n이상으로 상승하게 된다. 폐포 환기의 적절성을 사정할 수\n있다."},{"id":"c06-q170","chapterId":6,"number":170,"page":201,"stem":"호기말 이산화탄소분압측정술(capnography)에서 정상적인 파형을 보이면서 EtCO?수치\n가 상승하는 것이 의미하는 것은?","choices":["과환기","폐포 환기 감소","심박출량 감소","기관내관 발관","완전 기도폐쇄"],"answer":2,"answerLabel":"②","answerPage":350,"explanation":"정상 파형을 보이면서 태(メム 수치가 감소하는 경우는\n분당 환기량 증가로 인한 과환기, 공기 색전증, 심박출량\n감소, 혈압 하강 등으로 인한 폐순환 감소, 폐포 사강의\n증가, 호기 가스 희석에서 나타난다. 파형이 감소하다가\n비정상 파형으로 변화되는 경우는 인공호흡기의 회로가\n새거나 또는 기관내관이 새거나 위치가 빠진 경우이다.\n정상 파형을 보이다 갑자기 사라지는 경우는 인공호흡기\n연결 확인, 완전 기도폐쇄인 경우이다. 파형의 정점에서\n톱니 모양을 보이는 경우는 기계환기 중 자발 호흡이 발생한\n경우이다."},{"id":"c06-q171","chapterId":6,"number":171,"page":201,"stem":"기계환기 중인 환자의 호기말 이산화탄소분압(타coj 감시 중 다음과 같은 파형이 나타\n났다. 이 파형의 원인을 파악하기 위한 방법으로 옳지 않은 것은?","choices":["체온 확인","기도폐쇄 여부 확인","기관내관의 커프 압력 재측정","감시장치의 보정 (calibration) 시행","인공호흡기 회로의 연결 부위 재확인"],"answer":1,"answerLabel":"①","answerPage":350,"explanation":"이 경우는 타C5가 갑자기 낮은 수치로 감소하는\n경우로 완전한호기가 제대로 감지되지 않을 때, 즉 airway\nsystem상에 새는 곳이 있거나 부분적인 기도 폐쇄,\n인공호흡기의 오작동 또는 회로의 분리가 있을 때 나타날\n수 있다. 터CO? 가 점진적으로 증가하는 경우에는 고체온,\n대사 증가 등에 대해 혹卜인한다."},{"id":"c06-q172","chapterId":6,"number":172,"page":201,"stem":"맥박산소측정법(p니se oximetry)에 대한 설명으로 옳은 것은?","choices":["빈혈(헤모글로빈 5 g/dL) 시 정확도가 감소한다.","혈액순환 저하 시 센서의 위치를 코로 이동한다.","메트헤모글로빈 증가 시 산소포화도가 실제 보다 높게 측정된다.","피부가 검게 색소침착이 되는 경우 산소포화도가 높게 나타날 수 있다.","손가락 탐색자(Anger probe)가 귀 탐색자(ear probe)보다 반응 시간이 빨라 주로 손가락 탐색자를 선택한다."],"answer":1,"answerLabel":"①","answerPage":350,"explanation":"귀 탐색자가 반응 시간이 빨라 혈액순환 저하 시 주로\n귀로 위치를 이동 시킨다. COHb 시 실제보다 높게\n측정되며, MetHb 증가 시에는 산소포화도가 약간\n감소한다."},{"id":"c06-q173","chapterId":6,"number":173,"page":201,"stem":"45세 남자가 교통사고로 응급실로 이송되었다. 도착 시 안색은 창백하고 복부에서 다량\n의 출혈이 있으며 맥박은 매우 약하게 촉지되었다. 맥박산소측정 시 불규칙한 파형을 보\n이면서 측정값이 일정하지 않을 때, 그 원인으로 생각되는 것은?","choices":["빈혈","측정 오류","메트헤모글로빈 증가","관류(perfusion) 저하","동맥혈 산소분압 저하"],"answer":4,"answerLabel":"④","answerPage":350,"explanation":"환자는 다량 출혈로 인한 저혈량 상태(hypovolemia)\n로 혈압 저하는 조직 관류압을 감소시켜 맥박산소측정 시\n적절하게 감지가 되지 않을 수 있다."},{"id":"c06-q174","chapterId":6,"number":174,"page":202,"stem":"다음 중 급성 호흡성 산증을 일으킬 수 있는 상황은?","choices":["불안","폐부종","이뇨제 투여","과도한 제산제 복용","바르비투르산염(barbiturate) 중독"],"answer":5,"answerLabel":"⑤","answerPage":350,"explanation":"호흡성 산증은 과소환기(약물 과용, 흉곽 손상, 기흉)시\n발생하며 , 호흡성 알칼리증은 과다환기(패혈증 두부 손상,\n천식) 시 발생한다. 대사성 산증은 요독증, 설사, 당뇨병\n케톤산증에서 발생하고 , 대사성 알칼리증은 중탄산나트륨\n(Bivon) 투여, 이뇨제, 저칼륨혈증, 스테로이드 투여,\n위장관 배액 , 구토 시 발생한다."},{"id":"c06-q175","chapterId":6,"number":175,"page":202,"stem":"30세 여자가 5일간 심한 복통과 구토가 지속되어 식사나 음료를 전혀 섭취하지 못해 입\n원하였다. 과거력은 없고, 입원하기 4일전에 생리가 끝났으며, 투여 중인 약물도 없다. 체\n온 37.8℃, 맥박 120회/분, 호흡수 20회/분 혈압 100/60 mmHg이고, 혈장 Na 138, K\n3.0, Cl 87, bicarbonate 34, BUN 40, Ccr 1.6이며, 산소를 공급하지 않은 상태에서 동\n맥혈 가스분석 결과가 pH 7.5, PaCO2 45 mmHg, PaO 2 80 mmHg이었다. 0| 환자의\n산/염기 상태는?","choices":["대사성 산증","대사성 알칼리증","호흡성 산증","호흡성 알칼리증","호흡성 알칼리증과 대사성 산증 혼합"],"answer":2,"answerLabel":"②","answerPage":350,"explanation":"대사성 알카리증의 원인은 구토, 위액 배출, 설사,\n이뇨제 사용, 원발성 고알도스테론혈증, 쿠싱증후군, 심한\n저칼륨혈증, 다량의 수혈 등이다. 이 환자는 대사성\n알카리증으로 보이며 충분한 보상을 하는 경우라면 PaC\n。2=40+0.7小(3。J-24)=40+0.7(34-24)=47까지 증フト할\n것으로 예상되나 정상 범위에 있어 보상하지 않은 대사성\n알칼리증이 존재한다고 할 수 있다. Anion gap을 계산하여\n대사성 산증이 있는지 알아보는 것이 혼합성 산염기장애를\n확인하는 데 도움이 된다. 이 환자의 aion gap=138-\n87-34너 7로 높은 편이므로 경한 대사성 산증이 존재할\n수도 있다."},{"id":"c06-q176","chapterId":6,"number":176,"page":202,"stem":"만성폐쇄폐질환이 있는 55세 광부가 세균성 폐렴으로 입원하였다. 혈장 Na 135, Cl 95,\nbicarbonate 24, CK 1.0, 포도당 80이었고, 동맥혈 가스분석 결과는 pH 7.15, PaCO2\n60 mmHg이었다. 이 환자의 산/염기 상태는?","choices":["호흡성 산증","호흡성 알칼리증","호흡성 산증과 대사성 알카리증","호흡성 알칼리증과 대사성 산증","음이온차이(anion gap)가 큰 상태의 대사성 산증과 만성 호흡성 산증"],"answer":5,"answerLabel":"⑤","answerPage":351,"explanation":"이 환자는 만성폐쇄폐질환으로 만성 호흡성 산증이\n있으며(현재는 세균성 폐렴으로 인해 급성 상태가 겹친 상태일\n것일 수 있다), 보상작용으로 만성 상태에서는 HCO3-\n=24+4x(PaCO2-40)/10=32, pH=7.4-0.03*2=7.34\n수준일 것이다. 또한 현재 HCOJ는 만성에서 보상할 때\n예상하는 32보다 훨씬 낮은 수준이고, 예상되는 pH보다\n낮은 수준으로 대사성 산증이 동반된 상태로 추측할 수\n있다. 제시된 anion gap二135-95-24二 16을 통해서도\n경한 대사성 산증이 동반되었다는 것을 알 수 있다."},{"id":"c06-q177","chapterId":6,"number":177,"page":202,"stem":"70세 남자가 일주일부터 호흡곤란 기침과 가래가 증가하고 내원 하루 전부터 고열을 동\n반한 의식저하가 있어 입원하였다. 50세 때부터 만성폐쇄폐질환으로 진단받고 지속적으\n로 기관지확장제를 사용 중이다. 이 환자에게 산소요법을 시행하려고 할 때 주의 깊게 관\n찰해야 할 것은?","choices":["저환기","의식 저하","체온 상승","대사성 산증","산소독성으로 인한 무기폐"],"answer":1,"answerLabel":"①","answerPage":351,"explanation":"만성폐쇄폐질환 환자들은 기류제한으로 인해 환기\n기능이 감소하여 저산소혈증과 고탄산혈증이 나타난다."},{"id":"c06-q178","chapterId":6,"number":178,"page":203,"stem":"다음 중 산소공급 장치에 대한 설명으로 옳은 것은?","choices":["비강캐뉼라(nasal cannula)는 가습장치가 필요하다.","고유량 비강캐뉼라는 5 cmH,O 정도의 일정한 호기말양압을 제공할 수 있다.","단순마스크(simple mask)는 100% 이상의 흡입산소농도를 공급할 수 있다.","밴튜리마스크(venturi mask)는 고농도 산소를 정확하게 공급할 수 있다.","밴튜리마스크는 베르누이의 원리를 이용한 것이다."],"answer":5,"answerLabel":"⑤","answerPage":351,"explanation":"비강캐뉼라는 6 L 미만의 유속으로 산소를 공급하며\n가습을 필요로 하지 않는다. 고유량 비강캐뉼라는 낮은\n수준의 양압을 제공하는 효과가 있다. 단순마스크는 최대\n흡입산소농도 60%까지 공급할 수 있고, 밴튜리 마스크는\n관을 통과하는 유체의 속도가 가장 빠른 부위가 측압이\n가장 낮다는 베르누이의 원리를 적용하여 유체가 가장\n빨리 흐르는 관의 좁아진 곳 옆에 구멍을 만들어 공기가\n이곳을 통해 유입되어 산소와 혼합되어 혼합가스를 흡입하게\n되며, 주로 저농도 산소를 정확하게 공급하고자 할 때\n사용된다."},{"id":"c06-q179","chapterId":6,"number":179,"page":203,"stem":"인공호흡기 이탈 시행 3일째로 기관절개관을 통해 曰. 0.28, 유량 5 L로 산소를 투여\n하고 있던 환자가 상태가 호전되어 산소 투여를 중지하려고 한다. 이 환자에게 인공기도\n의 가습을 위해 열가습 교환장치(heat and moisture exchangers)를 적용할 때 주의해\n야 할 경우는?","choices":["체온 37℃","호흡수〈10회/분","환기량 6 ~7 L/분","묽은 객담 배출","붉은 가래 배출"],"answer":5,"answerLabel":"⑤","answerPage":351,"explanation":"환기량이 10 L/분 이상인 경우, 저체온, 탈수, 가래\n점도의 끈적임, 출혈이 의심되는 경우에는 열가습\n교환장치의 적용은 권장하지 않는다."},{"id":"c06-q180","chapterId":6,"number":180,"page":203,"stem":"기계환기 중 분무약물의 효과를 증대시키기 위한 가장 적절한 방법은?","choices":["흡기시간 연장","호기시간 단축","기도저항 감소","일회호흡량 증가","호기 최고유량 감소"],"answer":1,"answerLabel":"①","answerPage":351,"explanation":"분무 입자가 폐포 내에 머무르는 시간이 증가하여\n분무 효과가 높아지게 하기 위해 자발호흡인 경우는\n충분하게 심호흡을 하거나 인공호흡기를 적용하는 경우에는\n흡기 시간을 길게 한다."},{"id":"c06-q181","chapterId":6,"number":181,"page":203,"stem":"인공호흡기 이탈 후 공기유입 분무기(air entrainment nebulizer)로 가습과 산소를 공급\n하려고 한다. FiO2 0.4, 유량 10 L로 공급 시 실제 환자에게 제공되는 총 유량은 얼마인\n가? (FiO2 0.4일 때 대기와 산소의 비율二3：1)","choices":["10 L","20 L","30 L","40 L","50 L"],"answer":4,"answerLabel":"④","answerPage":351,"explanation":"공기와 산소의 비율이 3：1, 산소 유입량이 10L이면\n제공되는 총 유량은 10*(3：1)=40 L이다."},{"id":"c06-q182","chapterId":6,"number":182,"page":204,"stem":"만성폐쇄폐질환이 있는 환자의 산소요법에 관한 설명으로 옳은 것은?","choices":["하루 8시간 이상의 산소 투여가 생존율을 높인다.","장기 산소요법 사용의 결정은 수면 시간의 Pa。로 한다.","저농도 산소를 공급하기 위해 밴튜리마스크를 이용한다.","호흡 여부와 상관없이 PaO 2<45 mmHg이거나 Sa。4%% 인 경우에 산소를 투여 한다.","산소에 대한 저항성을 증가시키기 위해 음식 섭취나 운동 시 산소는 공급하지 않 는다."],"answer":3,"answerLabel":"③","answerPage":351,"explanation":"하루 15시간 이상의 산소 투여가 생존율을 높이며,\n장기 산소요법 사용의 결정은 깨어 있을 때 Pa\"로 하며,\nPaO 2<55 mmHg이거나 SaO 2<88%^ 경우에 산소를\n투여한다."},{"id":"c06-q183","chapterId":6,"number":183,"page":204,"stem":"수동 소생백(bag-v시ve mask system, ambu bag)에 대한 설명으로 옳은 것은?","choices":["저유량법 산소 전달방식이다.","성인인 경우 500-1000 mL의 용량을 측정할 수 있다.","산소를 연결하지 않은 경우 제공되는 산소 농도는 40% 이상이다.","산소포화도를 적절히 유지하기 위해서는 가능한 빨리 소생백으로 공기 주입(am- bu-bagging)을 한다.","고농도 산소를 제공하기 위하여 반드시 보유주머니(reservoir bag)를 연결해야 한다"],"answer":5,"answerLabel":"⑤","answerPage":351,"explanation":"수동 소생백은 고유량 산소 전달 방식이며, 성인인 경우\n1400~1600 mL의 용량을 측정할 수 있다. 산소포화도를\n적절히 유지하기 위해서는 가능한 천천히 ambu-bagging\n한다. 산소를 연결하지 않은 경우 제공되는 산소 농도는 21%\n이다."},{"id":"c06-q184","chapterId":6,"number":184,"page":204,"stem":"기관내관에 있는 머피눈(Murphy eye)의 기능으로 옳은 것은?","choices":["흡인 예방","기관내관의 위치 적절성 사정","기관내삽관 시 산소 공급 통로","기관내삽관 시 기도 점막 손상 최소화","기관내관이 막혔을 때 가스 유량(gas flow) 확보"],"answer":5,"answerLabel":"⑤","answerPage":351,"explanation":"기관내관에는 방사선 불투과성 물질(radiopaque\nindicator line)이 표시되어 있어 단순흉부촬영상에서\n기관내관의 위치를 알수 있다. 기관내관의 외관은 비스듬한\n사면 각도(bevel an이e)를 유지하고 있어 기관내삽관 시\n기도 점막 손상을 최소화할 수 있다."},{"id":"c06-q185","chapterId":6,"number":185,"page":204,"stem":"기관내삽관 시행 후 기관내관의 위치를 확인하기 위해 단순흉부촬영을 하였다. 기관내\n관의 위치는 용골(carina)로부터 어느 정도 거리에 위치해야 하는가?","choices":["1—2 cm","2—4 cm","3—6 cm","6—8 cm","8—10 cm"],"answer":3,"answerLabel":"③","answerPage":351,"explanation":"용골로부터 거리가 3 cm 미만인 경우 오른쪽 주\n기관지로 삽입되거나 6 cm 이상인 경우 목 신전 시\n기관내관이 빠질 위험이 있다."},{"id":"c06-q186","chapterId":6,"number":186,"page":204,"stem":"기관절개술 시행 후 io일이 경과된 환자로 기관절개관의 이탈이 의심될 때 가장 우선적\n인 중재는?","choices":["청진을 통해 호흡음 유무 확인","커프를 팽창시켜 공기 누출 확인","수동 소생백으로 폐의 확장 확인","흡인 카테터를 진입하여 기도 폐색 여부 확인","단순흉부촬영으로 기관절개관 위치의 부적절성 확인"],"answer":4,"answerLabel":"④","answerPage":351,"explanation":"기관절개관이 이탈되면 호흡음이 감소되거나\n기관절개관 공기의 이동이 감소된다. 응급 상황이라고\n판단되면 흡인 카테터의 진입 여부를 확인하고, 이탈이\n확인되면 기관절개관을 제거하고 재삽관을 준비한다.\n인공호흡기를 적용 중인 경우에는 공기 이동 소리가 입이나\n위장 쪽에서 들릴 수 있다"},{"id":"c06-q187","chapterId":6,"number":187,"page":205,"stem":"기관내관을 발관한 후 흡기 시 고음조의 잡음이 들리는 경우 가장 우선적인 중재는?","choices":["6시간 정도 환자의 호흡양상 관찰","에피네프린 분무 흡입","스테로이드 정맥주사","비강을 통한 기관내삽관","따뜻한 식염수 분무 흡입"],"answer":2,"answerLabel":"②","answerPage":351,"explanation":"기관내관 발관 후 상기도 부종을 의미하는 협착음\n(stridor)이 들리는 경우 주로 에피네프린을 분무 흡입하게\n한다."},{"id":"c06-q188","chapterId":6,"number":188,"page":205,"stem":"기관절개술 후 3일째인 환자가 용적 보조조절방식(assist volume control)으로 기계환기\n중이다. 기관절개관 교환 후 갑자기 최고 흡기압(peak inspiratory pressure)O| 50 cmH20\n이상 증가하면서 알람이 울리기 시작했고 청진 시 양쪽 폐의 호흡음이 감소되어 있다. 가\n장 먼저 의심해야 할 상태는?","choices":["기흉","폐부종","폐색전증","기관절개관의 부분 폐쇄","점액마개 (mucus plug)로 인한 주 기관지 폐쇄"],"answer":4,"answerLabel":"④","answerPage":351,"explanation":"자발호흡을 하는 환자는 부분 기도 막힘의 발생 시\n양쪽 폐의 호흡음이 감소되며 기관절개관을 통한 공기\n유량이 감소된다. 기흉이나 가래로 인한 기관지 막힘이\n발생하면 주로 병변이 있는 쪽으로 일측성으로 호흡음이\n감소되거나 공기 유량이 감소된다."},{"id":"c06-q189","chapterId":6,"number":189,"page":205,"stem":"기관절개술 후 첫 24시간 이내에 가장 많이 발생하는 합병증은?","choices":["출혈","기흉","폐하기종","흡인 폐렴","절개 부위 감염"],"answer":1,"answerLabel":"①","answerPage":351,"explanation":"기흉은 시술 중 발생 가능하고, 감염은 시술 후 보통\n2일 이후에 주로 발생하며 , 폐하기종은 시술 중 또는 수일\n경과 후 주로 발생한다."},{"id":"c06-q190","chapterId":6,"number":190,"page":205,"stem":"50갑년의 흡연력이 있는 환자가 폐렴으로 입원하여 항생제 치료와 흉부물리요법을 시행\n중이다. 2일 경과 후 단순흉부촬영상에서 폐 침윤이 더 악화되었을 경우 다음 단계의 중\n재로 옳은 것은?","choices":["기관지확장제 투여","흉부 컴퓨터단층촬영 시행","경직성(rigid) 기관지내시경 시행","굴곡성(flexible) 기관지내시경 시행","기침 유발을 위해 고장성 식염수 흡입"],"answer":4,"answerLabel":"④","answerPage":351,"explanation":"체위백액 등 흉부물리요법을 시행해도 상태가\n악화된다면 단순 폐렴보다는 종양 등의 확인을 위해\n기관지 내시경을 고려한다. 경직성 기관지 내시경은 흡인관이\n넓어 이물질을 제거하거나 일반적인 기관지내시경의 작은\n흡인관으로 배출이 곤란한 다량의 객혈이 있는 경우에\n주로 치료목적으로 사용하고, 굴곡성내시경은 진정제를\n사용하지만 환자가 깨어 있는 상태로 편하고 빠르게 검사를\n시행할 수 있어 호흡기질환 진단에 광범위하게 사용한다."},{"id":"c06-q191","chapterId":6,"number":191,"page":205,"stem":"인공호흡기 설정 시 호기 시간이 부적절하게 짧은 경우에 발생할 수 있는 것은?","choices":["기흉","폐부종","흉수 생성","기관지경련","スト가 호기말양압(auto-PEEP)"],"answer":5,"answerLabel":"⑤","answerPage":351,"explanation":"흡기와 호기 비율에서 호기 시간이 부적절하면 호기\n유량이 빠지기 전에 흡기가 시작되는 경우가 발생하며 이를\n자가 호기말양압(auto-PEEFO이라고 한다."},{"id":"c06-q192","chapterId":6,"number":192,"page":206,"stem":"호흡부전 환자에게 강제 용적조절방식(V이ume contr이 mode), 일회호흡량(VT) 10 mL/\nKg, 고평부압(Bateau pressure) 45 cmH©의 설정으로 인공호흡기를 적용하였다면 가\n장 먼저 시행되어야 할 것은?","choices":["호흡수 증가","일회호흡량 감소","호기말양압 추가","기관지확장제 투여","흡기유량(inspiratory flow) 감소"],"answer":2,"answerLabel":"②","answerPage":351,"explanation":"용적조절방식에서는 고평부압(Plateau pressure)을\n30 cmH20 이하로 유지하여 인공호흡기로 인한 폐 손상을\n감소시키며 , 일회호흡량의 감소로 조정할 수 있다."},{"id":"c06-q193","chapterId":6,"number":193,"page":206,"stem":"흡인 폐렴으로 입원한 75세 환자의 인공호흡기 그래프 파형이 다음과 같다. 환자는 지\n속적으로 30회 이상 빈호흡이 있으며, P0.1 은 -5로 측정되고 있다. 이 환자에게 적절한\n중재는?","choices":["압력 감소","흡기시간 단축","일회호흡량 증가","호기말양압 증가","유발 민감도(trigger sensitivity) 감소"],"answer":3,"answerLabel":"③","answerPage":351,"explanation":"압력-시간형 그래프 파형이며, 흡기 시 움푹 패인\n모양은 흡기 시 유량(flow)의 부족으로 나타난다. P0.1 은\n1~2 정도가 정상이며 숫자가 증가할수록 호흡일(WOB)\n이 증가함을 나타내며, 중재로는 압력(pressure) 또는\n용적(volume)을 증가시킨다."},{"id":"c06-q194","chapterId":6,"number":194,"page":207,"stem":"폐암으로 수술 후 중환자실로 입실하여 인공호흡기를 적용 중인 환자의 그래프 파형이\n다음과 같을 때 적절한 중재는?","choices":["일회호흡량 감소","용적의 변화 감시","흡입산소농도 감소","최고흡기압의 변화 감시","객담 배출이 용이한 체위 유지"],"answer":5,"answerLabel":"⑤","answerPage":352,"explanation":"이 그래프는 최고흡기압(peak pressure)과 고평부압\n(plateau pressure)의 차이가 큰 것으로 기도 저항이 증가될\n때 나타나므로 기도 저항을 감소시킬 수 있는 간호를\n시행한다."},{"id":"c06-q195","chapterId":6,"number":195,"page":207,"stem":"수술 후 호흡부전이 발생한 환자에게 용적조절방식, 일회호흡량 850 mL, 호흡수 20회/\n분으로 인공흡기를 적용하던 중 공기걸림(air trapping)0| 발생하였다. 이 환자에게 적절\n한 중재는?","choices":["호흡수 증가","호기시간 감소","일회호흡량 감소","분당 환기량 증가","흡기 유량속도 감소"],"answer":3,"answerLabel":"③","answerPage":352,"explanation":"공기걸림(air trapping)은 호기가 불충분할 때 주로\n발생하므로 충분히 호기할 수 있는 시간을 주거나 분당\n환기량을 감소시킨다."},{"id":"c06-q196","chapterId":6,"number":196,"page":207,"stem":"강제 압력조절방식(pressure controlled mode)으로 인공호흡기를 적용하려고 할 때, 흡\n기 시간을 충분히 유지해야 할 질환은?","choices":["폐색전증","양측성 폐렴","중증 폐섬유증","만성폐쇄폐질환","급성호흡곤란증후군"],"answer":5,"answerLabel":"⑤","answerPage":352,"explanation":"강제 압력조절방식에서 흡기 시간을 길게 설정하면\nPa。?를 개선시키므로 산소화의 장애를 해결하는 데\n효과적이다."},{"id":"c06-q197","chapterId":6,"number":197,"page":208,"stem":"인공호흡기 적용 시 흡입산소농도(FiOj 0.6에서 가장 적절한 호기말양압(PEEP) 은?\n호기말양압 0 5 10 15 20 25\n동맥혈 산소분압 46 54 67 73 75 74\n폐 순응도 18 23 26 30 24 19\n수축기혈압 25 123 114 115 104 94\n확장기혈압 90 88 83 84 76 68","choices":["5","10","15","20","25"],"answer":3,"answerLabel":"③","answerPage":352,"explanation":"호기말 양압(PEEP) 증가 시 폐 순응도(compliance)\n가 감소되지 않는 가장 높은 호기말양압을 찾는다."},{"id":"c06-q198","chapterId":6,"number":198,"page":208,"stem":"인공호흡기 적용 시 유발 민감도(trigger sensitivity)를 증가시키는 경우 발생할 수 있는\n것은?","choices":["일회호흡량 증가","호흡일(WOB) 증가","압력손상(barotrauma)","スト동유발(auto-triggering)","유량 비동시성 (flow dyssynchrony)"],"answer":4,"answerLabel":"④","answerPage":352,"explanation":"유발 민감도를 낮게 설정하여 둔감할수록 환자의 자발\n호흡을 놓치는 경우(missed triggering)フト 발생하고 이로\n인해 호흡일(WOB) 이 증가할 수 있다. 유발 민감도를 높게\n설정하여 민감하게 할수록 자발 호흡의 움직임이 아닌\n다른 요소들까지 모두 호흡으로 잘못 오인하여(aut。\ntriggering) 압력이나 용적을 제공하는 경우가 발생할 수\n있다"},{"id":"c06-q199","chapterId":6,"number":199,"page":208,"stem":"비침습적 인공호흡기(nippv) 적용을 고려해 볼 수 있는 경우는?","choices":["가래가 많은 환자","급성호흡곤란증후군 환자","혈역학적으로 불안정한 환자","급성으로 악화된 만성폐쇄폐질환자","비계획적인 발관 후 의식저하가 있는 환자"],"answer":4,"answerLabel":"④","answerPage":352,"explanation":"호흡정지나 곧 기관내삽관이 필요한 경우, 혈역학적\n불안정, 기침 또는 삼킴 능력이 저하된 경우, 과다한 가래,\n의식 저하, 얼굴 기형으로 mask fitting이 어려운 경우,\n호흡이 불안정한 뇌 손상 환자 등은 비 침습적 인공호흡기\n(NIPPV) 적용을 피한다."},{"id":"c06-q200","chapterId":6,"number":200,"page":208,"stem":"흉관 관리에 관한 설명으로 옳지 않은 것은?","choices":["물기둥의 높이는 일정하게 음압을 적용하기 위한 것으로 보통 15〜20 cmHq로 설정한다.","필요시 흡인기에 연결하며 과도한 흡인 압력은 통증을 유발할 수 있다.","흉관 제거 시 흡인을 멈추고 환자에게 기침을 시켜 밀봉배액병(water seal bottle) 에 공기방울이 보이지 않으면 흉관을 제거한다.","흉관 제거는 환자의 흡기말 또는 호기말에 발살바조작(valsalva maneuver)을 하 는 동안 시행한다.","기흉 발생 시 흉관은 오른쪽 또는 왼쪽 5번째 또는 6번째 늑간을 통해 후방으로 삽입한다."],"answer":5,"answerLabel":"⑤","answerPage":352,"explanation":"공기 제거는 2번째 늑간을 통해 전방으로 삽입하고\n혈흉인 경우는 5번째 또는 6번째 늑간을 통해 후방으로\n삽입한다. 흉관 제거 시 환자에게 기침을 시켜 밀봉배액병에\n공기방울이 보이지 않으면 제거한다."}]},{"id":7,"part":"PART II","partTitle":"전문실무영역","title":"신경계","count":200,"startPage":209,"endPage":254,"questions":[{"id":"c07-q001","chapterId":7,"number":1,"page":209,"stem":"요추천자를 요추 3~4번째 척추사이 공간에서 시행하는 이유는?","choices":["척추 사이의 간격이 가장 넓다.","시술자가 접근하기에 용이하다.","척수를 손상시킬 위험이 적다.","통증이 가장 적은 부위이다.","뇌척수액이 가장 많다."],"answer":3,"answerLabel":"③","answerPage":353,"explanation":"척수가 L1-L2에서 끝나므로 그 이하에서 천자를\n실시하면 척수손상을 예방할 수 있다."},{"id":"c07-q002","chapterId":7,"number":2,"page":209,"stem":"뇌졸중 환자가 말을 간호사의 말은 이해하지만 본인이 하고 싶은 말은 하지 못한다 의심\n되는 상태는?","choices":["완전 실어증","유창 실어증","알츠하이머병","감각성 실어증","운동성 실어증"],"answer":5,"answerLabel":"⑤","answerPage":353,"explanation":"운동성 실어증은 말을 하는 데 심각한 어려움을 겪지만\n이해력은 정상적으로 보존된다. 이 실어증은 운동영역\n인접부위(브로카영역의 손상으로 인해 발생하고, 편마비를\n동반하는 경우가 많다."},{"id":"c07-q003","chapterId":7,"number":3,"page":209,"stem":"67세 남자가 갑작스럽게 말이 어눌해지고, 어지럽고, 몸에 힘이 빠졌으나 3~4시간 후에\n회복되었다. 이 환자에게 의심되는 상태는?","choices":["뇌경색","심인성 실신","출혈성 뇌졸중","혈관억제성 실신","일과성허혈성 발작"],"answer":5,"answerLabel":"⑤","answerPage":353,"explanation":"일과성 허혈성 발작은 일시적인 신경학적 증상이\n나타나지만 수분 혹은 수시간 이내에 완전히 회복되며 이로\n인한 뇌조직의 손상은 없을 수 있다. 그러나 일과성 허혈성\n발작 환자의 50% 에서 뇌경색이 재발될 수 있으므로 진단하고\n치료해야 한다."},{"id":"c07-q004","chapterId":7,"number":4,"page":210,"stem":"환자에게 극소동공(pinpoint pupil)이 관찰된다면 의심되는 상태는?","choices":["심정지","뇌교출혈","각성제 중독","동안신경마비","아트로핀 투약"],"answer":2,"answerLabel":"②","answerPage":353,"explanation":"극소동공(〈 1 mm)은 ⑴교출혈 혹은 ⑵모르핀이나\n헤로인 등의 마약류 효과를 암시한다. 빛에 대한 반응은\n확대경으로 확인할 수 있다."},{"id":"c07-q005","chapterId":7,"number":5,"page":210,"stem":"신경계의 조정기능을 평가하는 검사는?","choices":["근력검사","소멸검사","발꿈치-무릎검사","회내근 처짐검사","바빈스키반사검사"],"answer":3,"answerLabel":"③","answerPage":353,"explanation":"의 조정기능은 손가락-코검사, 발꿈치-무릎검사,\n빠른 교대운동검사 등으로 평가할 수 있다."},{"id":"c07-q006","chapterId":7,"number":6,"page":210,"stem":"척추관협착증 환자의 간헐적파행증(intermittent 이audication)의 특징은?","choices":["한쪽 다리만 아프다.","통증이 갑자기 시작된다","족배동맥 박동이 감소한다.","누운 상태에서 다리를 못 든다","걸음을 멈추면 증상이 사라진다."],"answer":2,"answerLabel":"②","answerPage":353,"explanation":"걷거나 운동할 때 다리에 통증이 있거나 저린 간헐적\n파행증의 원인이 다리혈관의 죽상경화증인 경우 일측성이며 ,\n휴식을 취하면 10분 이내에 완화된다."},{"id":"c07-q007","chapterId":7,"number":7,"page":210,"stem":"교통사고 후 환자가 통증자극을 줄 때만 눈을 뜨고, 말은 못하지만 신음소리를 내고, 지\n시를 따르지 못하면서 다만 통증자극을 줄 때 몸을 피하려고 한다. 이 환자의 글래스고\n혼수척도(GCS) 점수는?","choices":["E3V4M5","E3V3M4","E2V2M5","E2V2M4","E3V2M3"],"answer":4,"answerLabel":"④","answerPage":353,"explanation":"글래스고 혼수척도는 눈뜨기반응(E), 언어반응(V),\n운동반응(M) 으로 구성된다. 통증자극에 눈을 뜨면 E2,\n신음, 웅얼거림과 같은 이해할 수 없는 언어반응은 V2,\n통증으로부터 회피하는 운동반응은 M4로 평가할 수 있다."},{"id":"c07-q008","chapterId":7,"number":8,"page":210,"stem":"파킨슨병의 증상에 해당하는 것은?","choices":["휴식 시 떨림이 완화된다.","초기 증상은 하지에서 시작된다.","수의적 움직임 시 진전이 악화된다.","글씨 쓸 수 있지만 속도가 느려진다.","주먹을 꼭 쥔 것 같은 손동작이 특징적이다."],"answer":4,"answerLabel":"④","answerPage":353,"explanation":"병의 증상에는 안정 시 떨림(resting tremor),\n운동완만(bradykinesia), 경직, 자세 불안정 등이 있다."},{"id":"c07-q009","chapterId":7,"number":9,"page":211,"stem":"중증근무력증 환자에게 진단 목적으로 텐실론(Tensilon)을 주사할 때 예상되는 반응은?","choices":["혈압이 하강한다.","오심/구토가 심해진다.","증상이 일시적으로 심해진다.","30초 이내에 근력이 향상된다.","구강이 건조해지고 통증이 초래된다"],"answer":4,"answerLabel":"④","answerPage":353,"explanation":"텐실론검사는 중증근무력증을 진단하기 위한 검사로\n텐실론을 정맥주입 하였을 때 근력이 뚜렷하게 호전되면\n양성으로 간주한다."},{"id":"c07-q010","chapterId":7,"number":10,"page":211,"stem":"길랑바레(Guillain-Barre)증후군의 증상에 해당하는 것은?","choices":["하행성 운동마비","심부건반사 감소","비대칭성 근 약화","진전을 동반한 운동실조","근위축을 동반한 강직성 마비"],"answer":2,"answerLabel":"②","answerPage":353,"explanation":"길랑바레증후군은 자가면역반응에 의한 다발성\n신경병증으로 상행성 양측 이완성 운동마비와 심부건반사\n소실이 특징적이다."},{"id":"c07-q011","chapterId":7,"number":11,"page":211,"stem":"경추수술 후 환자에게 가장 우선적으로 사정해야 하는 것은?","choices":["운동마비","호흡장애","배뇨장애","욕창 발생","수술부위 감염"],"answer":2,"answerLabel":"②","answerPage":353,"explanation":"척수손상 후 가스교환장애，무기폐 小려, 피부통합성\n장애, 강직, 감염 등의 합병증이 발생할 수 있지만 가장 우선\n순위가높은 것은 ‘호흡문제‘이다. T12 이상의 척수손상 시에는\n호흡근육 조절 능력이 저하된다."},{"id":"c07-q012","chapterId":7,"number":12,"page":211,"stem":"유두부종(papilledema)에 대한 설명으로 옳은 것은?","choices":["망막동맥의 출혈이다.","황반변성과 관련이 있다.","주변시야에 문제가 생긴다.","검안경으로 확인할 수 있다.","시신경유두의 염증으로 인해 발생한다."],"answer":4,"answerLabel":"④","answerPage":353,"explanation":"검안경으로 확인할 수 있는 유두부종(papilledema)은\n시신경유두의 부종과 생리적 함몰의 전방돌출을 의미한다.\n유두부종은 뇌막염, 지주막하출혈, 외상, 종양병변과 같은\n뇌병변을 의미하는 경우가 많으므로 안저검사 시 반드시\n확인해야 한다."},{"id":"c07-q013","chapterId":7,"number":13,"page":211,"stem":"항이뇨호르몬부적절분비증후군(SIADH)에 대한 설명으로 옳은 것은?","choices":["탈수가 나타난다.","고나트륨혈증이 발생한다.","S-Osm가 320 이상으로 상승한다.","항이뇨호르몬의 분비가 감소한다","권태감, 발작, 혼수가 발생할 수 있다."],"answer":5,"answerLabel":"⑤","answerPage":353,"explanation":"항이뇨호르몬부적절분비증후군은 외상성 뇌손상 후\n발생할 수 있는 합병증이다. ADH의 지나친 분비로 체액량이\n증가하고 저나트륨혈증이 발생한다. 환자는 권태감, 발작,\n혼돈, 혼수를 경험할 수 있다."},{"id":"c07-q014","chapterId":7,"number":14,"page":212,"stem":"교통사고로 외상성 뇌손상 진단을 받은 환자에게 탈수 체중감소 체위성 저혈압이 발생\n하였다. 이 환자에게 의심되는 상태는?","choices":["애디슨병","쿠싱증후군","중추성 요붕증","대뇌염분소모증후군","항이뇨호르몬부적절분비증후군"],"answer":4,"answerLabel":"④","answerPage":353,"explanation":"대뇌염분소모증후군은 외상성 뇌손상 후 발생할 수\n있는 합병증이다. 신세뇨관의 기능이 손상되어 체액고갈과\n염분배출이 일어난다. 주요 증상은 탈수, 체중감소, 체위성\n저혈압이고 수분균형의 장애가 나타난다."},{"id":"c07-q015","chapterId":7,"number":15,"page":212,"stem":"척수쇼크의 징후에 해당하는 것은?","choices":["빈맥","혈압저하","반사소실","소변량 감소","피부온도 하강"],"answer":3,"answerLabel":"③","answerPage":353,"explanation":"척수쇼크는 척수손상 후 손상부위 이하의 모든 운동,\n지각, 반사 기능이 소실된 상태를 의미하며, 부적절한\n세포관류로 인한 증상은 나타나지 않는다."},{"id":"c07-q016","chapterId":7,"number":16,"page":212,"stem":"교통사고 환자의 코에서 맑은 물이 흐르고 눈 주변에 반상출혈이 있을 때 의심할 수 있는\n손상은?","choices":["경막상혈종","경막하혈종","두개저골절","지주막하출혈","두개함몰골절"],"answer":3,"answerLabel":"③","answerPage":353,"explanation":"전두와 두개저골절이 발생하면 눈 주변에 멍이 드는\n너구리징후, 뇌척수액이 코로 흘러나오는 비루 혹은 귀로\n흘러나오는 이루가 발생할 수 있다."},{"id":"c07-q017","chapterId":7,"number":17,"page":212,"stem":"교통사고로 허리를 다친 환자의 신경계검진 결과 손상부위 이하로 동측의 운동과 촉각 그\n리고 반대측의 통증감각과 온도감각이 저하되어 있다. 이 환자에게 의심되는 상태는?","choices":["척수쇼크","전척수증후군","중심척수증후군","측방척수증후군","후방척수증후군"],"answer":4,"answerLabel":"④","answerPage":353,"explanation":"척수의 한쪽만 손상되었을 때 나타나는 측방척수증후군은\n손상부위 이하 동측의 운동마비 , 동측의 촉감각, 위치감각,\n진동감 소실, 그리고 반대측의 통각과 온도감각 소실이\n특징이다."},{"id":"c07-q018","chapterId":7,"number":18,"page":212,"stem":"급성뇌졸중 환자의 병원 전단계에서 사용되는 Cincinnati Prehospit셍 Stroke Scale 항목\n에 포함되는 것은?","choices":["두통","구토","감각","언어","의식"],"answer":4,"answerLabel":"④","answerPage":353,"explanation":"병원 전단계에서 뇌졸중을 선별할 수 있는 도구로\n활용되는 Cincinnati Prehospital Stroke Scale은\n얼굴의 처짐, 팔의 처짐, 언어로 구성된다."},{"id":"c07-q019","chapterId":7,"number":19,"page":213,"stem":"뇌졸중 의심 환자의 초기 치료 결정에 가장 큰 영향을 주는 검사는?","choices":["뇌컴퓨터단층촬영","뇌자기공명영상","뇌혈관조영술","요추천자","심전도"],"answer":1,"answerLabel":"①","answerPage":353,"explanation":"급성기뇌졸중이 의심되는 환자는 신속히 뇌영상검사를\n시행하며, 대부분의 경우, 비조영증강 컴퓨터단층촬영(CT)\n이 치료 결정에 중요한 정보를 제공한다."},{"id":"c07-q020","chapterId":7,"number":20,"page":213,"stem":"중추신경계 감염이 의심되는 환자의 뇌척수액검사 결과가 다음과 같을 때 가장 가능성이\n높은 원인은?\n• WBC7OO 개/*\n• Protein 200 mg/dL\n• Glucose 30 mg/dL","choices":["세균","진균","정상","결핵균","바이러스"],"answer":1,"answerLabel":"①","answerPage":353,"explanation":"세균이 원인인 경우 뇌척수액의 압력이 상승하고,\n백혈구수フト 100-5000개/mm3 증フト하며, 포도당이 40\nmg/dL 미만으로 감소하고, 단백질은 100 mg/dL 이상으로\n상승한다."},{"id":"c07-q021","chapterId":7,"number":21,"page":213,"stem":"응급실로 이송된 환자의 양쪽 동공이 확장되어 있고 빛 반사가 있다. 이 환자에게 의심되\n는 상태는?","choices":["항우울제 중독","중뇌의 병변","코카인 복용","심장마비","뇌탈출"],"answer":3,"answerLabel":"③","answerPage":353,"explanation":"양쪽 모두 확대되고 빛 반사가 있는 동공은 마약코카인 ,\n암페타민, LSD), 교감신경계 자극 약물 때문일 수 있다."},{"id":"c07-q022","chapterId":7,"number":22,"page":213,"stem":"두개내압 상승의 징후에 해당하는 것은?","choices":["확장기혈압 상승","유두부종","맥압 저하","저체온","빈맥"],"answer":2,"answerLabel":"②","answerPage":353,"explanation":"두개내압이 상승되면 급성기에는 의식장애, 동공의\n변화, 시야장애, 운동 및 감각장애, 두통, 발작, 뇌신경마비\n등이 나타난다. 두개내압 상승이 지속되면 의식상태 악화,\n활력징후의 변화맥압상승, 서맥, 고체온), 시신경유두부종\n등이 나타난다."},{"id":"c07-q023","chapterId":7,"number":23,"page":214,"stem":"주로 볼, 턱, 입술 부위에 타는 듯한 느낌이 특징적인 질환은?","choices":["지주막하출혈","삼차신경통","측두동맥염","군집두통","편두통"],"answer":2,"answerLabel":"②","answerPage":354,"explanation":"동맥이나 정맥의 이상에 의해 삼차신경(CNV )이 압박되어\n발생하는 삼차신경통은 볼, 턱, 입술, 잇몸 등에 전기 자극과\n같은 찌르는 듯하고 타는 듯한 통증을 초래한다."},{"id":"c07-q024","chapterId":7,"number":24,"page":214,"stem":"두통, 발열 목의 경직 호소하는 환자의 뇌척수액검사 결과, 외양이 투명하고, 압력은 약간\n상승하였으며, 포도당과 단백질은 정상이다 이 환자의 진단을 위해 가장 필요한 검사는?","choices":["뇌파검사","소변배양검사","머리방사선촬영","뇌검퓨터단층활영","중합효소연쇄반응검사"],"answer":5,"answerLabel":"⑤","answerPage":354,"explanation":"두통, 발열, 목의 경직이 있는 환자의 뇌척수액검사\n결과가 정상에 가깝다면 바이러스성 뇌수약염을 의심할 수\n있다. 이 경우 뇌척수액에서 바이러스 DNA 나 RNA 를\n검출하기 위한 중합효소연쇄반응 검사를 실시하여 중추신경계\n바이러스 감염을 혹卜인한다."},{"id":"c07-q025","chapterId":7,"number":25,"page":214,"stem":"바이러스 수막염의 징후에 해당하는 것은?","choices":["편마비","목 경직","혈압 상승","시야결손","안구진탕"],"answer":2,"answerLabel":"②","answerPage":354,"explanation":"바이러스 수막염의 증상과 징후에는 두통, 발열, 눈부심,\n목 경직이 포함된다."},{"id":"c07-q026","chapterId":7,"number":26,"page":214,"stem":"미국국립보건원 뇌졸중 척도(NIH Stroke Scale)에 대한 설명으로 옳은 것은?","choices":["정상인의 표준점수와 비교한다.","점수가 높을수록 중증이다.","3개 항목으로 구성된다.","혈액검사가 포함된다.","3-5분 정도 소요된다."],"answer":2,"answerLabel":"②","answerPage":354,"explanation":"미국국립보건원 뇌졸중 척도는 초기 뇌졸중 중증도\n평フト척도이다. 의식수준, 응시, 시야, 안면마비, 운동, 운동실조,\n감각, 언어능력, 구음장애, 인식상실 등으로 구성되며 점수가\n높을수록 중증이다."},{"id":"c07-q027","chapterId":7,"number":27,"page":214,"stem":"성인에게 발생하는 만성 수두증의 주요 증상에 해당하는 것은?","choices":["실신","구토","허약","감각장애","보행장애"],"answer":5,"answerLabel":"⑤","answerPage":354,"explanation":"성인기에 점진적으로 발생하는 수두증의 3대 증상은\n치매, 보행장애, 실금이다."},{"id":"c07-q028","chapterId":7,"number":28,"page":215,"stem":"항이뇨호르몬부적절분비증후군(SIADH)의 특성으로 옳은 것은?","choices":["소변량 증가","체액량 감소","혈청나트륨 감소","혈청삼투질농도 증가","소변삼투질농도 감소"],"answer":3,"answerLabel":"③","answerPage":354,"explanation":"항이뇨호르몬부적절분비증후군은 항이뇨호르몬이\n지속적으로 작용하여 수분 배출이 되지 않아 저나트륨혈증과\n저삼투압 상태가 되는 것이다. 소변의 삼투질 농도가 증가하며\n급성 뇌부종을 초래할 수 있다."},{"id":"c07-q029","chapterId":7,"number":29,"page":215,"stem":"허혈성 뇌졸중 치료 후 퇴원약에 와파린(warfarin)이 포함된 환자에게 주기적으로 체크해\n야 하는 혈액검사는?","choices":["INR","aPTT","Bleeding time","혈중칼륨농도","혈중와파린농도"],"answer":1,"answerLabel":"①","answerPage":354,"explanation":"지속 또는 발작 심방세동을 가진 허혈성 뇌졸중 또는\n일과성 허혈발작 환자에게는 특별한 금기가 없는 한 INR\n2.0-3.0 목표의 와파린 치료가 권장된다."},{"id":"c07-q030","chapterId":7,"number":30,"page":215,"stem":"의식명료기간(lucid interval 동반하는 두부손상은?","choices":["지주막하출혈","경막외혈종","기저골절","뇌진탕","뇌좌상"],"answer":2,"answerLabel":"②","answerPage":354,"explanation":"두개골과 경막 사이의 출혈인 경막외혈종이 발생하면\n손상 시 잠깐 동안의 의식 소실이 있고 그 후 의식명료기간이\n수분에서 수시간 동안 지속될 수 있다."},{"id":"c07-q031","chapterId":7,"number":31,"page":215,"stem":"복시 안검하수 근력 약화를 호소하는 40대 여자의 진단을 위하여 주사할 수 있는 약물은?","choices":["텐실론","도파민","피리독신","스테로이드","아드레날린"],"answer":1,"answerLabel":"①","answerPage":354,"explanation":"복시, 안검하수, 근력악화는 중증근무력증의 대표적인\n징후이다. 텐실론 검사는 중증근무력증을 진단하기 위한\n검사로 텐실론을 정맥주입 하였을 때 근력이 뚜렷하게 호전되면\n양성으로 간주한다."},{"id":"c07-q032","chapterId":7,"number":32,"page":215,"stem":"파킨슨병 환자의 징후에 대한 설명으로 옳은 것은?","choices":["근긴장이 저하된다.","고혈압을 동반한다.","원발성 떨림이 있다.","운동마비가 발생한다.","사지와 관절이 뻣뻣하다."],"answer":5,"answerLabel":"⑤","answerPage":354,"explanation":"기저핵과 흑질의 세포 소실로 인하여 발생하는 파킨슨병의\n주 증상은 안정 시 떨림, 근육경직, 운동완만증 등이며,\n이차적으로 위장관장애 , 기립성저혈압, 이상운동증, 수면장애\n등이 나타날 수 있다."},{"id":"c07-q033","chapterId":7,"number":33,"page":216,"stem":"L4-5 추간판 탈출증 환자의 임상증상에 해당하는 것은?","choices":["하지로 방사되는 통증","무릎 굴곡 시 목 통증","늑골 하부의 통증","손과 팔의 저림","호흡곤란"],"answer":1,"answerLabel":"①","answerPage":354,"explanation":"L5와 S1 그리고 L4와 L5 사이에서 주로 발생하는\n추간판탈출증은 극돌기, 척추사이 관절, 척추주위 근육,\n천장절흔, 좌골 신경의 압통을 야기한다. 좌골신경은 요추와\n천추에서 시작하여 엉덩이를 거쳐 다리로 연결된다."},{"id":"c07-q034","chapterId":7,"number":34,"page":216,"stem":"뇌하수체선종 절제술 후 환자에게 요붕증이 발생하였다. 이 환자의 상황에 대한 적절한\n설명은?","choices":["혈압이 상승한다.","소변량이 감소한다.","수분중독의 위험이 있다.","저나트륨혈증이 예상된다.","혈중 항이뇨호르몬 농도가 낮다."],"answer":5,"answerLabel":"⑤","answerPage":354,"explanation":"혈중 항이뇨호르몬의 부족으로 인하여 발생하는 요붕증은\n다뇨, 요삼투질농도 저하, 혈중 삼투질농도 증가, 혈중 나트륨\n정상 혹은 상승 등을 초래한다."},{"id":"c07-q035","chapterId":7,"number":35,"page":216,"stem":"뇌농양의주진단방법은?","choices":["뇌컴퓨터단층촬영","경두개초음파","뇌동맥조영술","뇌조직검사","요추천자"],"answer":1,"answerLabel":"①","answerPage":354,"explanation":"감염원이 있고 두개내압 상승 증상 및 국소적 신경학적\n이상이 있다면 뇌농양을 의심할 수 있다. CT 나 MRI 가\n진단에 가장 도움을 주는 검사인데, 고리 모양으로 조영제의\n증강이 나타나고 뇌부종이 동반된다."},{"id":"c07-q036","chapterId":7,"number":36,"page":216,"stem":"다음 중 건강한 성인에게는 나타나지 않는 병적 반사는?","choices":["바빈스키반사","심부건반사","각막반사","복부반사","구역반사"],"answer":1,"answerLabel":"①","answerPage":354,"explanation":"바빈스키반사는 신생아에게는 정상적으로 나타날 수\n있지만 성인의 바빈스키반사 양성은 상위운동신경원의\n병소를 의미한다."},{"id":"c07-q037","chapterId":7,"number":37,"page":216,"stem":"미국국립보건원 뇌졸중 척도(NIH Stroke Sc 게e)의 검사 항목에 포함되는 것은?","choices":["각막반사","시야검사","심부건반사","안구전정검사","동공의 빛반사"],"answer":2,"answerLabel":"②","answerPage":354,"explanation":"미국국립보건원 뇌졸중 척도는 초기 뇌졸중 중증도\n평가척도_이다. 의식수준, 응시, 시야, 안면마비, 운동,\n운동실조, 감각, 언어능력, 구음장애, 인식상실 등으로\n구성되며 점수가 높을수록 중증이다."},{"id":"c07-q038","chapterId":7,"number":38,"page":217,"stem":"경막하혈종(subdur시 hematoma)에 대한 설명으로 옳은 것은?","choices":["초승달 모양이다.","주원인 고혈압이다.","혈관조영술로 진단한다.","주 손상혈관은 중경막동맥이다.","두개골과 경막 사이에 혈종이 발생한다."],"answer":1,"answerLabel":"①","answerPage":354,"explanation":"경막하혈종은 뇌경막과 지주막 사이에 혈약이 고인\n것을 의미한다. 대부분 두부의 외상에 의해 발생하고 CT\n로진단이 가능하다. CT 상경막외 혈종은볼록랜즈모양이고\n경막하혈종은 초승달 모양이다."},{"id":"c07-q039","chapterId":7,"number":39,"page":217,"stem":"중증근무력증 환자의 근허약이 심해지고, 동공이 축소되고, 서맥이 있을 때 확인해야 할\n것은?","choices":["복용 약의 용량","뇌졸중의 증상","흉선의 크기","영양부족","임신"],"answer":1,"answerLabel":"①","answerPage":354,"explanation":"근무력증 환자가 치료를 제대로 받지 않으면 호흡곤란을\n동반하는 근무력성 위기가 발생하고, 약물이 과다한 경우\n복부경련, 과대한 기도분비물, 서맥 등을 동반하는 콜린성\n위기가 나타날 수 있다."},{"id":"c07-q040","chapterId":7,"number":40,"page":217,"stem":"편두통에 대한 설명으로 옳은 것은?","choices":["이차성이다.","전조를 동반한다.","머리의 뒤편에 주로 발생한다.","눈물과 콧물을 흔히 동반한다","지속적인 근육긴장에 의해 유발된다."],"answer":2,"answerLabel":"②","answerPage":354,"explanation":"원발성 두통에는 편두통, 군집두통, 삼차신경통 등이\n있다. 이차성 두통은 잠재된 구조적, 전신적 또는 감염성\n원인에서 비롯되고 생명을 위협할 수도 있다. 편두통은\n전조증상이 선행될 수 있으며, 다음의 5가지 'POUND• 중\n3가지 이상이면 편두통일 가능성이 높다.\n• 박동성 (P 니 satile)\n• 하루(One-day) 또는 치료하지 않으면 4〜72 시간 이상 지속\n• 한쪽 (Unilateral)\n• 오심(Nausea) 또는 구토\n• 일상활동이불가능할정도(Disabling) 로심함"},{"id":"c07-q041","chapterId":7,"number":41,"page":217,"stem":"갑작스럽게 어지럼증, 구음장애, 근육약화가 발생하여 응급실을 방문하였으나 증상들이\n사라지고 영상검사 결과도 음성이었다. 이 환자에게 의심되는 상태는?","choices":["뇌색전증","뇌내출혈","메니에르병","동정맥기형","일과성 허혈발작"],"answer":5,"answerLabel":"⑤","answerPage":354,"explanation":"갑작스럽게 생긴 혈관성 기원의 신경학적 증상이 24\n시간 이내에 완전히 회복된 것을 일과성 뇌허혈발작이라고\n한다."},{"id":"c07-q042","chapterId":7,"number":42,"page":217,"stem":"지주막하 출혈의 원인을 파악하기 위하여 반드시 실시해야 하는 검사는?","choices":["요추천자","경두개초음파","뇌혈관조영술","뇌자기공명영상","뇌컴퓨터단층촬영"],"answer":3,"answerLabel":"③","answerPage":354,"explanation":"뇌혈관조영술은 뇌혈관의 순환상태를 보여주므로\n지주막하출혈의 원인과 치료방향을 결정하기 위해 필수적으로\n선택된다."},{"id":"c07-q043","chapterId":7,"number":43,"page":218,"stem":"지주막하출혈 환자의 뇌혈관연축 조기발견을 위하여 필요한 검사는?","choices":["요추천자","경두개초음파","뇌혈관조영술","뇌자기공명영상","뇌컴퓨터단층촬영"],"answer":2,"answerLabel":"②","answerPage":354,"explanation":"뇌혈관연축은 지주막하출혈의 가장 흔한 합병증으로\n경두개초음파 검사 상 혈류속도가 증가하는 것으로 발견할\n수 있다."},{"id":"c07-q044","chapterId":7,"number":44,"page":218,"stem":"다발성 경화증 환자의 진단을 위하여 필요한 검사는?","choices":["근전도","뇌전도","척수천자","뇌자기공명영상","뇌컴퓨터단층촬영"],"answer":4,"answerLabel":"④","answerPage":355,"explanation":"중추신경계의 백질을 침범하는 다발성경화증의 일차적\n증상은 허약, 피로, 떨림, 통증, 강직, 마비, 인지변화,\n감각변화, 우울 등으로 매우 다양하다. 다발성경화증의\n진단은 뇌척수액검사, MRI, 유발전위 등이 있으며 이중\nMRI 는 백질의 수출탈락으로 인한 반(이aque)을 보여줄 수\n있으므로 가장 도움이 된다."},{"id":"c07-q045","chapterId":7,"number":45,"page":218,"stem":"루게릭병에 대한 설명으로 옳은 것은?","choices":["하체부터 증상이 시작된다.","혈중 CK 농도로 확진한다.","호흡기감염 후 발생한다.","인지기능은 보존된다.","건반사가 항진된다."],"answer":4,"answerLabel":"④","answerPage":355,"explanation":"근위축측삭경화증(루게릭병)은 피질, 연수, 척수\n운동신경원의 퇴행성 변화로 상지에서 시작되는 진행성\n근위축, 점진적인 원발성 측삭경화, 진행성 연수마비를\n동반한다. 혈중 CK 검사, 근전도 검사, 자기공명영상 검사가\n환자의 상태를 평가하는 데 도움이 되지만 루게릭병을 확진할\n수 있는 검사는 없다."},{"id":"c07-q046","chapterId":7,"number":46,"page":218,"stem":"뇌농양의 증상 및 징후로 옳은 것은?","choices":["국소 신경학적 장애가 나타난다.","의식수준에는 영향을 주지 않는다","뇌척수액 천자 시 압력이 감소한다.","질병이 진행되면 오한과 발열이 나타난다.","전두엽 농양인 경우 안구진탕이 발생한다."],"answer":1,"answerLabel":"①","answerPage":355,"explanation":"뇌농양은 두개외 혹은 두개내 감염으로 인하여\n이차적으로 발생하며 화농성 뇌염과 농양 형성이 특징이다.\n초기 단계에서 감염의 징후들이 나타나고 진행되면 농양의\n위치에 따라 국소적인 신경학적 징후들이 동반되게 된다."},{"id":"c07-q047","chapterId":7,"number":47,"page":218,"stem":"두부외상 후 뇌컴퓨터촬영 상 국소 병소가 없으나, 임상적으로 혼수상태가 6시간 이상 지\n속되는 것은?","choices":["뇌수막염","척수쇼크","경막외혈종","경막하혈종","광범위축삭손상"],"answer":5,"answerLabel":"⑤","answerPage":355,"explanation":"두부외상의 광범위한 형태로 뇌컴퓨터촬영 상 혼수의\n원인이 될 만한 뚜렷한 국소 병소가 없으나, 임상적으로\n혼수상태가 6시간 이상 지속되는 것을 광범위축삭손상\n(diffuse axonal injury)이라고 한다. CT 에 뇌량, 기저핵,\n뇌실 주위에 소량의 출혈이 있을 수 있다"},{"id":"c07-q048","chapterId":7,"number":48,"page":219,"stem":"눈머리반사검사(oc니。ceph싱ic reflex test)를 할 수 없는 환자는?","choices":["무의식 환자","뇌출혈 환자","경추손상 환자","교통사고 환자","뇌간손상이 의심되는 환자"],"answer":3,"answerLabel":"③","answerPage":355,"explanation":"눈머리반사(oculocephalic reflex)는 의식이 없는\n환자의 안구운동을 검사하는 것으로 머리를 돌려야 하므로\n경추손상이 의심되는 환자에게는 시행할 수 없다."},{"id":"c07-q049","chapterId":7,"number":49,"page":219,"stem":"다음 그림과 같은 검사 결과가 양성일 때 의심할 수 있는 상태는?","choices":["봉와직염","대퇴탈구","골관절염","추간판탈출증","심부정맥혈전증"],"answer":4,"answerLabel":"④","answerPage":355,"explanation":"추간판탈줄증은 추간판의 수핵이 약해진 섬유륜을\n밀어 신경근을 압박하는 질환으로 요추에 발생하면\n좌골신경통과 함께 그림처럼 다리를 똑바로 들어 올릴 때\n통증이 심해진다(straight leg raising test)."},{"id":"c07-q050","chapterId":7,"number":50,"page":219,"stem":"환자의 측두근과 저작근을 교대로 촉진하면서 이를 꽉 깨물도록 하여 근수축의 강도를\n확인하는 것은 어느 뇌신경의 기능을 검사하기 위함인가?","choices":["제 1 뇌신경","제3뇌신경","제5뇌신경","제7뇌신경","제9뇌신경"],"answer":3,"answerLabel":"③","answerPage":355,"explanation":"제5뇌신경인 삼차신경은 저작과 얼굴의 감각을 담당한다.\n삼차신경의 운동기능은 측두근과 저작근을 교대로 촉진하면서\n이를 꽉 깨물도록 하여 근수축의 강도를 확인함으로써 평가할\n수 있다."},{"id":"c07-q051","chapterId":7,"number":51,"page":220,"stem":"55세 남자가 2시간 전에 갑자기 발생한 좌측 반신마비와 안면마비를 호소하며 응급실에\n도착하였다. 내원 당시 혈압은 190/110 mmHg이다. 이 환자에게 가장 먼저 시행해야 할\n검사는?","choices":["뇌 CT","뇌 MRI","뇌파검사","뇌혈류검사","뇌혈관조영술"],"answer":1,"answerLabel":"①","answerPage":355,"explanation":"갑작스럽게 신경학적 장애가 발생하는 경우 뇌졸중을\n의심해야 한다. 뇌졸중은 CT 를 통하여 허혈성인지 출혈성인지\n우선적으로 감별해서 출혈성이 아니라면 혈전용해를 위한\n치료가 필요하다."},{"id":"c07-q052","chapterId":7,"number":52,"page":220,"stem":"뇌졸중 증상 중 출혈성 뇌졸중에서 두드러지게 나타나는 것은?","choices":["편마비","수면 중발생","발병 시 심한 두통","일과성 허혈증이 선행함","의식 장애보다 신경학적 장애가 많음"],"answer":3,"answerLabel":"③","answerPage":355,"explanation":"출혈성 뇌졸중의 경우 출혈로 인한 혈종으로 공간을\n점유하기 때문에 증상 발생부터 두통이 심하고 의식장애가\n흔히 동반된다. 반면 허혈성 뇌졸중의 경우 신경학적 장애\n(반신마비 등)가 심해도 두통이 없고, 의식이 명료한 경우가\n많다."},{"id":"c07-q053","chapterId":7,"number":53,"page":220,"stem":"평소 고혈압, 당뇨병이 있는 62세 남자가 갑자기 우측 상지 마비와 실어증 발생으로 인해\n20분 만에 응급실에 도착하였다. 환자의 의식은 명료하고, 뇌 CT 상 출혈 소견은 없고,\n혈액 응고검사 결과는 정상이다. 이 환자에게 가장 적절한 치료 방법은?","choices":["스텐트 삽입술","경동맥내막절제술","정맥내 혈전용해제 투여","혈관확장제 투여","코일색전술"],"answer":3,"answerLabel":"③","answerPage":355,"explanation":"신경성 마비 증상 발생 20분 후 내원한 허혈성 뇌졸중\n환자로 출혈 위험이 없다면 1 차적으로는 정맥 내 혈전용해제를\n투여한다."},{"id":"c07-q054","chapterId":7,"number":54,"page":220,"stem":"뇌 ct 상 출혈 흔적이 없는 급성기 뇌경색으로 진단되어 정맥내 혈전용해술을 시행하고\n자 한다 다음 중 정맥혈전용해술이 가능한 경우는?","choices":["혈당 45 mg/dL","혈소판 수치 90,000 mn?","수축기 혈압 200 mmHg","2개월 전 심근경색 발생 병력","경구항응고제 복용 중이며, 현재 INR 1.5"],"answer":5,"answerLabel":"⑤","answerPage":355,"explanation":"뇌졸중학회 가이드라인에 따르면 급성기 뇌경색\n혈전용해술 제외대상은 다음과 같다.\n• 혈당 50mmHg/dL 이하\n• 혈소판 수치 100,000 mm3 이하\n• 혈압은 수축기혈압이 185 mmHg 및 이완기 혈압 110 mmHg\n이내로 조절되어야 함\n• 최근 3 개월 이내에 심근경색이 없어야 하며, 경구 항응고제를\n복용하고 있다면 INR 1.7 이하이어야 함"},{"id":"c07-q055","chapterId":7,"number":55,"page":220,"stem":"급성 뇌경색으로 정맥 내 혈전용해술 치료를 받는 환자에게 적절한 간호중재는?","choices":["몸무게 Kg당 0.9 mg을 계산한 용량의 50% 는 5분 동안 일시주입하고, 나머지는 60 분간 주입한다","혈전용해제 투여 후 6시간 동안은 1 시간마다 신경학적 평가를 시행한다.","혈전용해제 투여 후 첫 2시간 동안 15분마다 혈압을 측정한다.","정맥 내 혈전용해제 투여는 일반 병실에서 시행 후 모니터한다.","수축기 혈압이 1
