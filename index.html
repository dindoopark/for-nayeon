상태는?","choices":["호흡성 산증","호흡성 알칼리증","중탄산 부족","대사성 산증","대사성 알칼리증"],"passage":"다음 지문을 읽고 질문에 답하시오문제 55-56).\n하루에 10회 이상의 구토를 주호소로 50 대 여자가 응급실로 내원하였다. 동맥혈가스분석을 시행\n한 결과 pH 7.50, PaCO2 40.0 mmHg. HCO； 30.0 mEq/L이었다.","answer":5,"answerLabel":"⑤","answerPage":315,"explanation":"구토는 위의 내용물을 입으로 배출하는 것으로, 배출된\n구토물에는 염산(HCI)이 다량 함유되어 있다. 염산의 손실은\n위 내벽의 상피세포가 수소이온을 보충하도록 촉발한다. 이\n세포는 위의 속공간으로 수소이온을 배출하는 동시에\n중탄산이온을 혈액으로 운반한다. 중탄산이 온이 혈액으로\n들어가면 혈액의 pH가 상승하고 대사성 알칼리증이 발생할\n수 있다."},{"id":"c02-q056","chapterId":2,"number":56,"page":43,"stem":"이 환자에서 산-염기 장애에 대한 보상기전을 나타내는 증상 및 징후로 가장 적절한 것은?","choices":["pH < 7.35","pH〉7.45","HCOJ < 22 mEq/L","호흡수 증가","호흡수 감소"],"passage":"다음 지문을 읽고 질문에 답하시오문제 55-56).\n하루에 10회 이상의 구토를 주호소로 50 대 여자가 응급실로 내원하였다. 동맥혈가스분석을 시행\n한 결과 pH 7.50, PaCO2 40.0 mmHg. HCO； 30.0 mEq/L이었다.","answer":5,"answerLabel":"⑤","answerPage":315,"explanation":"이 환자는 장기간의 구토로 인해 대사성 알칼리증이\n발생한 상태이다. 대사성 알칼리증에 대한 보상기전으로\n콩팥은 수소이온과 암모니아의 형성을 억제하고,\n중탄산이온을 배출한다. 또한 호흡수와 깊이가 감소하여\n동맥혈 내 PaCC>2가 상승하고 호흡성 산증을 유발시켜\n대사성 알칼리증을 보상한다. 따라서 ABGA 결과는 pH\n는정상, HCC『와 PaC5는정상보다 높아진다."},{"id":"c02-q057","chapterId":2,"number":57,"page":43,"stem":"실질적으로 수소 이온과 중탄산 이온의 재흡수와 배출을 통해 혈액의 ph를 조절하는 인\n체 기관은?","choices":["콩팥","폐","심장","근육","간"],"answer":1,"answerLabel":"①","answerPage":315,"explanation":"콩팥과 호흡계통은 생리적 완충계로 인체로부터 산,\n염기, 이산화탄소의 배출량을 조절하여 pH를 안정화한다.\n콩팥은 중탄산 이온과 수소 이온의 재흡수와 배출을 통해\n혈액의 pH를 조절한다."},{"id":"c02-q058","chapterId":2,"number":58,"page":43,"stem":"중탄산염 완충계(bicarbonate buffer system)에서 강염기가 추가될 경우 약산으로 작용\n하여 pH를 낮추는 역할을 하는 이온은?","choices":["co 2","H2cQ","HCOJ","h2po4-","-COOH"],"answer":2,"answerLabel":"②","answerPage":315,"explanation":"중탄산염 완충계에서 중심이 되는 구성요소는 중탄산이온\n(HCO『)과 탄산(H2cO'이다. 중탄산이온은 약염기의 역할을\n하며, 탄산은 약산의 역할을 한다. 카복시기(-COOH)는\n강한 산성을 나타내는 물질로 염기와 중화하여 염을 형성한다."},{"id":"c02-q059","chapterId":2,"number":59,"page":44,"stem":"이 환자의 상태로 적절한 것은?","choices":["호흡성 산증","호흡성 알칼리증","대사성 산증","대사성 알칼리증","중탄산 부족"],"passage":"다음 지문을 읽고 질문에 답H시오(문제 59-60).\n강도를 만난 20대 여성이 호흡곤란을 주호소로 응급실로 이송되었다. 동맥혈가스분석(ABGA )검\n사 결과 pH 7.50, PaCO2 20.0 mmHg, HCO； 24.0 mEq/L이었다.","answer":2,"answerLabel":"②","answerPage":315,"explanation":"호흡성 알칼리증은 호흡이 증가하여 PaCO27^ 35\nmmHg 미만으로 내려가는 것이다. 극도의 불안, 산소를\n충분히 공급받지 못하는 상황고지대 , 심한 빈혈 등), 아스피린\n과용(호흡중추 자극) 등의 상황에서 발생할 수 있다.\n이산화탄소가 계속 배출되면 혈중 이산화탄소 농도가\n감소하며 , 혈중 탄산이 감소하고 수소 농도가 낮아진다."},{"id":"c02-q060","chapterId":2,"number":60,"page":44,"stem":"이 환자의 산염기 불균형 상태가 지속될 경우 나타날 수 있는 전해질 불균형은?","choices":["고나트륨혈증","저나트륨혈증","고칼륨혈증","저칼륨혈증","고칼슘혈증"],"passage":"다음 지문을 읽고 질문에 답H시오(문제 59-60).\n강도를 만난 20대 여성이 호흡곤란을 주호소로 응급실로 이송되었다. 동맥혈가스분석(ABGA )검\n사 결과 pH 7.50, PaCO2 20.0 mmHg, HCO； 24.0 mEq/L이었다.","answer":4,"answerLabel":"④","answerPage":315,"explanation":"알칼리증 상태에서는 수소이온이 세포내액에서\n세포외액으로 확산되고, 동시에 칼륨은 세포외액에서\n세포내액으로 들어간다. 또한 더 많은 칼륨이 수소이온의\n손실을 보상하기 위해 세포내액에 남게 되고, 이것이\n세포외액의 칼륨 농도를 감소시킨다."},{"id":"c02-q061","chapterId":2,"number":61,"page":44,"stem":"양성종양의 특성으로 옳은 것은?","choices":["빠른 유사분열이 일어난다.","다양한 크기와 모양의 핵이 존재한다","미분화된 세포로 구성되어 있다.","일정하고 규칙적인 모양이다.","주변조직으로의 침윤이 일어난다."],"answer":4,"answerLabel":"④","answerPage":315,"explanation":"양성종양은 정상속도에 가까운 유사분열을 하며 핵의\n크기와 모양이 일정하고, 세포분화가 잘 일어난다. 또한\n악성종양에 비해 모양이 일정하고 규칙적이며 대부분 피막으로\n싸여 있고 주위 조직으로 침윤현상이 나타나지 않는다."},{"id":"c02-q062","chapterId":2,"number":62,"page":44,"stem":"암과 관련된 일반적 증상에 대한 설명으로 옳은 것은?","choices":["초기부터 특이적 증상이 나타난다.","전신적 증상으로 체중감소, 피로감, 식욕저하 등의 증상이 나타날 수 있다.","초기의 대표적인 증상은 통증이다.","황달은 대장암, 담도암의 대표적 증상이다.","객혈은 폐암의 대표적인 초기 증상으로 나타난다."],"answer":2,"answerLabel":"②","answerPage":315,"explanation":"암의 일반적 증상은 암의 종류, 크기, 위치에 따라\n다양하게 나타난다. 암 발생 초기에는 무증상이 많으며\n비특이적으로 나타난다. 암의 진행에 따라 주위기관, 구조물,\n혈관, 신경을 압박하여 증상이 나타난다.\n• 황달: 췌장암, 담관암\n• 기침, 객혈: 폐암\n• 통증: 신경압박, 뼈 전이\n• 혈변, 빈혈: 위암, 대장암\n• 혈뇨: 방광암\n• 전신적인 증상: 체중감소, 발열, 피로감, 전신쇠약, 식욕저하"},{"id":"c02-q063","chapterId":2,"number":63,"page":45,"stem":"발암의 단계 중 발암물질에 의해 DNA 손상을 초래하는 단계는?","choices":["가］시 (initiation)","촉진(promotion)","진행(progression)","세포자멸사 (apoptosis)","전위 (translocation)"],"answer":1,"answerLabel":"①","answerPage":315,"explanation":"• 개시(initiation) 단계: 발암물질에 의해 영구적인 DNA 손상을\n초래한다.\n• 촉진(promotion) 단계: 발암의 가역적인 과정으로 촉진을 유도하는\n원인이 제거되면 이 과정은 멈출 수 있다.\n• 진행(progression) 단계: 종양세포로 변형된 세포가 지속적으로\n증식하는 단계이다.\n• 세포자멸사(apoptosis)： 노화세포나 손상세포에서 세포가 사멸하는\n것을 의미함. 암세포는 아포토시스 과정에 저항한다.\n• 전위(translocation)： 염색체 전위가 일어난다."},{"id":"c02-q064","chapterId":2,"number":64,"page":45,"stem":"종양세포가 체액이나 피막을 따라 복강의 재생하기 적합한 환경에 정착하여 이차 종양을\n생성하는 암종으로 옳은 것은?","choices":["폐암","난소암","유방암","뇌종양","갑상샘암"],"answer":2,"answerLabel":"②","answerPage":315,"explanation":"암에는 3가지기본전이가 있다\n• 국소전이: 침윤(infiltration) 및 침범(invasion)\n• 원거리 전이: 림프성 전이, 혈관성 전이\n• 파종: 악성 종양세포가 체강 내로 파종되는 것으로 복강에서 가장\n빈번하게 발생"},{"id":"c02-q065","chapterId":2,"number":65,"page":45,"stem":"다음 종양 중 양성종양에 해당하는 것은?","choices":["연골육종(chondrosarcoma)","지방육종(liposarcoma)","위샘암종(gastric adenocarcinoma)","골종(osteoma)","혈관육종(angiosarcoma)"],"answer":4,"answerLabel":"④","answerPage":316,"explanation":"연골육종(chondrosarcoma)은 연골조직에, 지방육종\n(liposarcoma) 지방조직에, 위샘암종(gastric adeno\ncarcinoma)은 위에, 혈관육종(angiosarcoma)은 혈관에\n생기는 악성종양이다. 골종(osteoma)은 뼈에서 발생하는\n양성종양이다."},{"id":"c02-q066","chapterId":2,"number":66,"page":45,"stem":"종양세포 검사 결과 크기와 모양이 다양한 미분화된 세포가 나타났다. 분화도의 등급은?","choices":["Grade I","Grade II","Grade III","Grade IV","Grade V"],"answer":4,"answerLabel":"④","answerPage":316,"explanation":"분화도(grade) 검사는 암의 중요한 세포학적\n진단방법으로 정상세포와 얼마나 닮았는지와 유사분열 상\n보이는 수에 기초하여 4단계로 분류한다. 분화도가 높을수록\n생존율이 감소하며 재발률이 높다.\n• Grade I： 25% 탈분화, 75% 정상세포와 닮음\n• Grade II： 50% 탈분화, 50% 정상세포와 닮음\n• Grade III： 75% 탈분화, 25% 정상세포와 닮음\n• Grade IV： 100% 미분화되거나 역분화되어 종양이 유래한 모조직을\n알아내기 힘든 경우"},{"id":"c02-q067","chapterId":2,"number":67,"page":45,"stem":"위암 환자의 병기가 T1N1M0 일 때 이에 대한 해석으로 옳은 것은?","choices":["종양이 위벽의 점막층 혹은 점막하층까지 침범하고 전이가 없다.","종양이 위벽의 점막층 혹은 점막하층까지 침범하고 1 〜2개까지 림프절 주위로 침범 이 있다.","종양이 위벽의 점막층 혹은 점막하층까지 침범하고 림프절 주위로 침범이 없다.","종양이 위벽의 점막층 혹은 점막하층까지 침범하고 원격전이가 있다.","종양이 장막하층까지 침범하고 원격전이가 있다. ch叩ter 근 병태생리 I 45"],"answer":2,"answerLabel":"②","answerPage":316,"explanation":"병기는 종양의 크기(T), 림프절 침범 정도(N), 종양의\n전이(M) 정도에 따라 분류한다."},{"id":"c02-q068","chapterId":2,"number":68,"page":46,"stem":"종양의 전신적 영향에 대한 설명으로 옳은 것은?","choices":["종양세포 증식으로 인한 대사요구 증가로 체중감소가 나타난다.","종양이 소화관과 같은 관을 압박하여 폐쇄증상이 나타난다.","종양주변의 감염으로 인해 조직이 괴사, 궤양이 발생한다.","정상세포의 대사요구가 증가하여 체중감소가 촉진된다.","암 발생 초기 단계에서부터 통증이 발생한다."],"answer":1,"answerLabel":"①","answerPage":316,"explanation":"종양으로 인한 국소적 증상으로 종양이 소화관 같은\n관을 압박하는 폐쇄증상, 종양 감염으로 인한 조직 괴사,\n궤양 등01 나타날 수 있으며 , 종양의 진행으로 인해 국소적인\n통증이 유발된다. 전신적 증상으로는 체중감소, 악액질,\n빈혈, 감염, 출혈 증상이 나타난다."},{"id":"c02-q069","chapterId":2,"number":69,"page":46,"stem":"종양표지자(tumor marker)와 의심 가능한 암종의 연결로 옳은 것은?","choices":["고환암: 알파태아단백(a-FP)","전립선암: 암배아성항원(CEA)","난소암: CA 15-3 (cancer antigen 19)","유방암: CA 19一9 (cancer antigen 19)","대장암: CA 125 (cancer antigen 125)"],"answer":1,"answerLabel":"①","answerPage":316,"explanation":"• 알파태아단백(a- FP)： 간세포암, 고환암\n• CA -125 ： 난소암\n• CA 19-9： 대장암, 췌장암\n• 전립샘특이항원(PSA)： 전립샘암\n• CEA ： 대장암, 췌장암, 위암, 폐암"},{"id":"c02-q070","chapterId":2,"number":70,"page":46,"stem":"암 치료방법 중 방사선 치료에 대한 설명으로 옳은 것은?","choices":["종양과 필요시 종양 주위 림프절을 포함하여 주변 조직의 제거가 가능하다","방사선 치료 시 반감기가 긴 방사선을 사용함으로서 치료의 효과를 높일 수 있다","DNA 의 변이나 변화를 일으켜 유사분열을 억제하거나 세포사멸을 유발한다.","방사선 치료의 부작용으로 감각 및 지각 이상과 관련된 운동장애가 나타날 수 있다.","정상세포의 파괴 없이 암세포에만 치료효과가’나타난다."],"answer":3,"answerLabel":"③","answerPage":316,"explanation":"방사선치료는 DNA 에 변이나 변화를 일으켜 유사분열을\n억제하거나 세포사멸을 유발하며 , 종양세포 및 정상세포도\n파괴한다. 종양과 필요시 종양 주위 림프절을 포함하여 주변\n조직의 제거는 수술요법의 기능이다. 감각 및 지각 이상과\n관련된 운동장애는 항암화학요법의 부작용이다 ."},{"id":"c02-q071","chapterId":2,"number":71,"page":46,"stem":"바이러스는 암을 유발하는 발암요인이다. 사람유두종바이러스(human papillomavirus；\nHPV)와 관계 있는 암종은?","choices":["전립선암","버킷림프종","간세포암","대장암","자궁경부암"],"answer":5,"answerLabel":"⑤","answerPage":316,"explanation":"HPV는 약 70가지 유형이 동정되었고, 이 중 1, 2, 4,\n7형은 양성 편평유두종사마귀)를 일으키고, 고위험군에 속하는\n16, 18형은 자궁경부와 항문, 성기 부위의 편평세포암종의\n발생에 관여한다. HPV는 으キ 20%의 구개인두암과도 관련\n있다. Epstein-Bar virus- 버킷림프종, B형, C형\n간염바이러스(HBV, HCV)는 간세포암종의 약 70〜85% 을\n유발하는 바이러스이다."},{"id":"c02-q072","chapterId":2,"number":72,"page":46,"stem":"42세 여자 환자가 유방암 치료 후에 BRCA-1, 2 (breast cancer-1, 2)를 검사하였다. 검\n사의 목적은?","choices":["치료 여부를 확인하기 위해","암의 재발 또는 진행을 감시하기 위해","원격 전이 여부를 확인하기 위해","종양의 성장분률(growth fraction)을 예측하기 위해","악성세포의 분화정도를 결정하기 위해"],"answer":2,"answerLabel":"②","answerPage":316,"explanation":"BRCA-1 , 2(breast cancer 1, 2)는 유방암, 난소암과\n같은 암에서 이상이 발견되는 종양억제유전자로서, 이\n유전자의 이상으로 돌연변이 세포의 DNA 교정에 이상이\n초래되어 암세포가 활성화된다."},{"id":"c02-q073","chapterId":2,"number":73,"page":47,"stem":"위암 발생의 고위험군에 속하는 환자의 스크리닝 검사로 적합한 것은?","choices":["바륨관장","상복부 X-ray 촬영","위내시경","알파태아단백(a— fetoprotein)","잠혈반응검사"],"answer":3,"answerLabel":"③","answerPage":316,"explanation":"위암 스크리닝 검사는 위내시경이 대표적인 검사이다."},{"id":"c02-q074","chapterId":2,"number":74,"page":47,"stem":"방광암 발생의 가장 일반적인 관련요인은?","choices":["만성 방광감염","흡연력","잦은 요도감염으로 인한 만성 자극","기생충 주혈 흡충(Schstomsoma haematobium)에 노출","잦은 신장염"],"answer":2,"answerLabel":"②","answerPage":316,"explanation":"방광암으로 진단받은 환자의 50% 이상에서 흡연력을\n가지고 있다."},{"id":"c02-q075","chapterId":2,"number":75,"page":47,"stem":"필라델피아 염색체와 관련된 백혈병의 유형은?","choices":["급성 림프성 백혈병","급성 골수성 백혈병","만성 골수성 백혈병","비호지킨림프종","호지킨림프종"],"answer":3,"answerLabel":"③","answerPage":316,"explanation":"9번과 22번 염색체 전위와 관련된 필라델피아 염색체는\n만성 골수성 백혈병(chronic myeloid leukemia)의 진단에\n이용된다."},{"id":"c02-q076","chapterId":2,"number":76,"page":47,"stem":"암세포에 대한 설명으로 옳은 것은?","choices":["암세포는 종양유전자의 활성으로 인해 성장인자와 같은 외부 증식신호가 있을 때 증식한다.","암세포는 종양억제유전자의 활성화로 성장을 지속한다","암세포는 p53 유전자의 활성화에 의해 세포자멸 신호를 회피한다.","암세포는 종양세포의 생존을 위해 신생혈관형성을 유도한다.","암세포는 발암물질에 의해 유발된 DNA 손상을 복구하려고 노력한다."],"answer":4,"answerLabel":"④","answerPage":316,"explanation":"암세포는 종양유전자의 활성으로 인해 외부 증식신호\n없이도 스스로 증식할 수 있다. 종양억제유전자의 활성화로\n증식억제신호(TGF-B, CDKIs)에 반응하지 않는다. 암세포는\np53과 같은 종양억제유전자의 불활성화나 세포자멸사\n억제유전자의 활성화로 세포자 멸사를 회피한다 . 암세포는\n종양세포의 성장과 생존을 위해 산소와 영양을 공급할\n신생혈관형성을 유도한다 암세포는 손상된 DNA 의 복구에\n장애를 보이며 , 이로 인해 유전적으로 불안정성을 초래하여\n유전자의 돌연변이를 초래한다."},{"id":"c02-q077","chapterId":2,"number":77,"page":47,"stem":"다음 중 후두암의 위험이 가장 높은 대상자는?","choices":["20년 흡연자","만성 부비동염을 앓은 사람","잦은 상기도 감염자","80세 노인","후두에 손상을 입은 사람"],"answer":1,"answerLabel":"①","answerPage":316,"explanation":"후두암의 주요 위험요인은 장기간의 흡연과 음주를\n동시에 하는 경우이다. 후두암 환자가 대부분 50~75세\n남자이지만 나이가 들수록 위험도가 높아지는 것은 아니다.\n후두 손상과 만성 부비동염은 위험요인이 아니다."},{"id":"c02-q078","chapterId":2,"number":78,"page":48,"stem":"일반적인 백혈병의 특징을 설명한 내용으로 옳은 것은?","choices":["조혈 조직 내 악성 형질세포의 증식","Reed-Stenberg 세포의 증식","비정상적이거나 미성숙한 백혈구의 과다한 증식","저혈소판증으로 인한 적혈구의 증가","과다한 혈구 생성으로 인한 혈액 점성도 증가"],"answer":3,"answerLabel":"③","answerPage":316,"explanation":"백혈병은 비정상적이거나 미성숙한 백혈구의 증가,\n정상 백혈구 생성의 감소로 인한 비정상적인 세포의 증식으로\n골수, 비장, 림프구, 간, 신장, 폐, 피부, 중추신경계 손상의\n원인이 된다. 조혈 조직 내 악성형질세포의 증식은 다발성\n골수종, Reed-Stenberg 세포의 증식은 호지킨병림프종)\n을의미한다."},{"id":"c02-q079","chapterId":2,"number":79,"page":48,"stem":"종양 발생과 관련된 유전자에 대한 설명으로 옳은 것은?","choices":["RB ： 핵 내에 존재하는 인단백의 하나로 혈관내피 성장인자를 조절하는 종양유전자 이다.","p53： 인체암의 50% 이상에서 발견되는 가장 흔하게 유전자 이상을 보이는 종양억 제유전자이다.","APC： 성장촉진신호를 활성화하는 종양유전자이다.","TGF-/ 수용체: 혈관내피 성장인자를 조절하는 종양유전자이다.","BRCA-1 ： 유방암과 난소암에서 발견되는 종양유전자로서 DNA 교정을 억제한다."],"answer":2,"answerLabel":"②","answerPage":316,"explanation":"RB 는 핵 내에 존재하는 인단백의 하나로 혈관내피\n성장인자를 조절하는 종양억제유전자이 다. p53은 인체암의\n50% 이상에서 발견되는 가장 흔하게 유전자 이상을 보이는\n종양억제유전자로서, 세포주기 정지와 DNA 손상에 대한\n세포자멸사를 유도한다. APC는 성장촉진신호를 억제하는\n종양억제유전자로 , 특히 유전성 대장암과 산발성 대장암에서\n이상이 발견된다. TGF-B 는 상피세포, 혈관내피세포 및\n조혈세포의 강력한 증식억제작용을 하는 종양억제유전자0 H다.\nBRCA 너은 유방암과 난소암에서 발견되는 종양억제유전자로서\nDNA 를 교정한다."},{"id":"c02-q080","chapterId":2,"number":80,"page":48,"stem":"소세포폐암(small cell lung cancer)에 대한 설명으로 옳은 것은?","choices":["소세포암 발생의 98%는 석면과 관련이 있다.","다른 암보다 성장 속도가 느리다.","전체 폐암의 60%를 차지한다.","타 장기로의 전이가 드물게 나타난다.","중심부와 주기관지 주변에 잘 발생하여 기관지를 외부적으로 압박한다."],"answer":5,"answerLabel":"⑤","answerPage":316,"explanation":"소세포폐암 발생의 98%는 흡연과 관련이 있다. 세포\n자체의 성장속도가 빠르며 조기 전이하는 경향이 있어\n진단받은 시점에 광범위하게 퍼져 있는 경우가 많으며,\n기관지 양쪽 중앙 위치에 잘 발생하며 전체 폐암의 25%를\n차지한다."},{"id":"c02-q081","chapterId":2,"number":81,"page":48,"stem":"인체가 항원에 노출되었을 때 IgE 항체가 항원과 결합으로 인한 비만세포의 탈과립현상\n으로 히스타민, 류코트리엔 등의 강력한 염증 매개물질을 방출하는 제1 형 과민반응은?","choices":["접촉성 피부염","전신홍반루푸스","아나필락시스 반응","자가면역성 용혈성 빈혈","류마티스성 관절염"],"answer":3,"answerLabel":"③","answerPage":317,"explanation":"• 제1 형 과민반응: 아나필락시스\n• 제3 형 과민반응: 전신홍반루푸스, 류마티스성 관절염\n• 제4형 과민반응: 접촉성 피부염"},{"id":"c02-q082","chapterId":2,"number":82,"page":48,"stem":"항원과 항체의 결합으로 면역복합체(항원-항체 복합체)를 형성하여 조직 내 주로 혈관 벽\n에 침전되고 보체작용을 활성화함으로써 조직을 파괴시키는 과민반응과 관련된 질환은?","choices":["접촉성 피부염","류마티스성 관절염","알레르기성 피부발진","아나필락틱 쇼크","아토피성 피부염"],"answer":2,"answerLabel":"②","answerPage":317,"explanation":"• 제1 형 즉시형 과민반응, 아나필락시스: 아나필락틱 쇼크반응\n• 제2형 세포용해성-세포독성 과민반응: 수혈반응\n• 제3 형 면역복합체성 과민반응: 사구체염, 활막염, 류마티스성\n관절염, 혈청병\n• 제4형 서포매개형/ 지연형 과민반응: 접촉성 파부염 , 결핵항원검사반응,\n이식대 숙주질환 이식거부반응"},{"id":"c02-q083","chapterId":2,"number":83,"page":49,"stem":"제1 형 과민반응인 아나필락틱 반응 시 분비되는 히스타민의 기능에 대한 설명으로 옳은\n것은?","choices":["말초혈관 수축 모세혈관 투과성 증가","모세혈관 투과성 감소, 말초혈관 이완","기관지 평활근 수축, 모세혈관 투과성 증가","기관지 평활근 수축, 말초혈관 수축","기관지 평활근 이완, 말초혈관 수축"],"answer":3,"answerLabel":"③","answerPage":317,"explanation":"아나필락틱 반응 시 분비되는 히스타민으로 인해 말초혈관\n이완, 모세혈관 투과성 증가, 기관지 평활근 수축이 일어난다."},{"id":"c02-q084","chapterId":2,"number":84,"page":49,"stem":"제4형 과민반응에 대한 설명으로 옳은 것은?","choices":["과민반응 속도가 빠르다.","대표적인 질환은 전신홍반루푸스 질환이다.","항원-항체 복합체 면역반응이다.","항원에 감작된 T 세포에 의해 반응한다","과민반응으로 보체가 활성화된다."],"answer":4,"answerLabel":"④","answerPage":317,"explanation":"제4형 과민반응은 세포-매개성/지연성 과민반응으로\n반응속도가 느리고 항원에 감작된 T 세포에 의해 반응한다.\n항원-항체 면역복합체는 제3형 과민반응으로서 , 대표적인\n질환으로는 전신홍반루푸스와 류마티스성 관절염이 있다 ."},{"id":"c02-q085","chapterId":2,"number":85,"page":49,"stem":"전신홍반루푸스(systemic lupus erythematosus； SLE) 에 대한 설명으로 옳은 것은?","choices":["여자보다 남자에게서 호발한다.","가장 흔하게 침범하는 부위는 관절부위이다","초기에는 주로 폐와 신장을 침범한다.","제4형 과민반응에 속한다","주로 노인에게서 발병한다."],"answer":2,"answerLabel":"②","answerPage":317,"explanation":"젊은 여자에게 호발하며, 흔하게 발병하는 부위는\n관절, 신장, 폐, 심장, 뇌, 피부, 소화기관이다. 초기에는\n주로 피부발진부터 시작되어 폐, 신장으로 침범한다. 다양한\n증상을 가지며 악화와 완화과정을 반복한다."},{"id":"c02-q086","chapterId":2,"number":86,"page":49,"stem":"체액성 면역에 대한 설명으로 옳은 것은?","choices":["T 림프구 표면의 특수 수용기에 있는 항원을 인식한다.","이물질 침입에 대한 세포 매개반응이다.","B 림프구가 항체를 생성하여 이종 단백질을 파괴하는 반응이다.","자연살해세포(natural killer cell)는 바이러스 감염세포, 종양세포 등을 파괴한다.","비자기를 통해 자기를 식별하는 고도의 능력을 통해 신체를 보호한다."],"answer":3,"answerLabel":"③","answerPage":317,"explanation":"체액성 면역은 B 림프구 활동과 관련된 후천성 면역이다."},{"id":"c02-q087","chapterId":2,"number":87,"page":49,"stem":"태아가 모체의 태반을 통해 항체를 받거나 또는 출생 후에 모유를 통해 항체를 받는 면\n역은?","choices":["자연적 수동면역","인위적 수동면역","자연적 능동면역","인위적 능동면역","자연면역"],"answer":1,"answerLabel":"①","answerPage":317,"explanation":"• 자연적 능동면역 : 질병을 앓고 난후 획득한 면역으로 강하고 장기간\n지속\n• 인위적 능동면역: 예방접종\n• 자연적 수동면역 : 태반을 통해 또는 모유를 통해 항체전달\n• 인위적 수동면역: 면역혈청 glob니in 또는 항독소"},{"id":"c02-q088","chapterId":2,"number":88,"page":50,"stem":"b 림프구가 항체를 생성하도록 돕고 대식세포를 활성화시키는 세포는?","choices":["억제 T 림프구(suppressor T lymphocyte)","보강 T 림프구(amplifier T lymphocyte)","살해 T 림프구(killer T lymphocyte)","자연살해세포(nat니ral killer cell)","보조 T 림프구(h이per T lymphocyte)"],"answer":5,"answerLabel":"⑤","answerPage":317,"explanation":"• 보조 T 림프구: B 림프구가 항체를 생성하도록 돕고 대식세포를\n활성화\n• 억제 T 림프구: B 림프구 및 일부 T 림프구의 작용억제\n• 보강 T 림프구: 보조 T 림프구와 억제 T림프구의 작용 보강"},{"id":"c02-q089","chapterId":2,"number":89,"page":50,"stem":"40세 남자가 penicillin 투여 후 아나필라틱 쇼크 증상이 발생하였다. 이에 대한 설명으로\n옳은 것은?","choices":["제2형 과민반응에 해당된다","화학적 매개물질로 인해 전신 혈관의 수축이 나타나고 심박동수가 증가한다.","초기 증상으로 호흡기 폐쇄로 인해 어지러움과 의식소실 증상이 나타난다.","히스타민과 화학적 매개물질이 감각신경을 자극하여 피부소양증이나 두드러기가 초 기증상으로 나타난다.","면역복합체 침착으로 염증과 조직파괴 증상이 나타난다."],"answer":4,"answerLabel":"④","answerPage":317,"explanation":"Penicillin 투여 후 아나필라틱 쇼크 증상은 제1 형\n과민반응에 속하며, histamine 분비로 인해 소양증, 저림,\n열감, 두드러기 증상을, 세기관지 평활근 수축, 부종, 객담\n증가로 호흡곤란, 기침, 천명 증상을, 전신 혈관 확장으로\n인해 저혈압을 동반하고 이로 인한 심박동수가 증가한다.\n후기 증상으로는 혈압감소와 호흡기 폐쇄로 인해 뇌로 가는\n산소가 부족하여 어지러움, 의식소실 , 허약 증상이 나타난다."},{"id":"c02-q090","chapterId":2,"number":90,"page":50,"stem":"비만세포(mast cell)와 호염기구(basophils)의 므キ 표면에 존재하며 알레르기 반응을 일으\n키는 면역글로불린은?","choices":["IgG","Ig A","Ig E","Ig D","Ig M"],"answer":4,"answerLabel":"④","answerPage":317,"explanation":"• Ig G ： 인체에 가장 많은 면역글로불린으로, 항원의 활동을\n중화시키거나 백혈구의 식균작용을 촉진하며 태반을 통과할 수\n있다.\n• lg A： 눈물, 유즙, 타액, 기관지, 장관에 많이 분포하며 신체표면을\n보호한다.\n• Ig E ： 비만세포(mast cell)와 호염기구(basophils)의 막 표면에\n존재하며 알레르기 반응을 일으킨다.\n• Ig D： B 세포의 표면에서 항원 수용체로 작용한다.\n• Ig M ； ABO 항원에 대한항체를 형성한다."},{"id":"c02-q091","chapterId":2,"number":91,"page":50,"stem":"후천성면역결핍증후군(AIDS)으로 입원한 50세 남자의 체간에 보라색의 가렵지 않고 통\n증이 없는 결절이 나타났다. 이것이 의미하는 질환은?","choices":["림프절병증(Lymphadenopathy)","단순 발진","카포시육종","비호지킨림프종","대상포진"],"answer":3,"answerLabel":"③","answerPage":317,"explanation":"후천성면역결핍증후군(AIDS)으로 나타나는 증상은\n노출기간에 따라 단계별로 나타난다.\n• 1 단계: 미열, 피로, 근육통, 인후통과 같은 경미한 감기 증상\n• 2단계: 잠복기, 림프절병증, 림프절 비대\n• 3 단계: 면역결핍이 명확해지는 단계, 소화기관, 신경계, 이차 감염,\n악성종양등이 나타남"},{"id":"c02-q092","chapterId":2,"number":92,"page":50,"stem":"후천성면역결핍증후군 환자의 사망을 초래하는 심각한 폐렴의 일반적인 원인은?","choices":["Shigella","Adenovirus","Cryptosporidum","Herpes virus","Pneumocystis carinii"],"answer":5,"answerLabel":"⑤","answerPage":317,"explanation":"후천성면역결핍증후군 환자에게 이차감염은 흔하게\n나타나고 사망의 선행요인이 된다. 곰팡이균인\nPneumocystis carinii는 심각한 폐렴을 일으키는 사망의\n주요 원인이다."},{"id":"c02-q093","chapterId":2,"number":93,"page":51,"stem":"결핵진단을 위해 투베르쿨린 반응검사를 시행하고 48~72시간 후에 주사부위를 판독한\n다. 이 검사는 어떤 유형의 과민반응에 해당하는가?","choices":["초과민반응","아토피반응","세포독성 항체매개반응","면역복합체 매개반응","세포매개성 반응"],"answer":5,"answerLabel":"⑤","answerPage":317,"explanation":"• 제1 형: 초과민형(아나필락시스)\n• 제2형: 세포독소형, ABO 부적합 약물로 인한 용혈성 빈혈\n• 제3 형: 면역복합체 과민반응, 혈청병, 전신홍반루푸스, 급성\n사구체신염\n• 제4형: 투베르쿨린 검사반응, 접촉성 피부염, 장기 이식반응"},{"id":"c02-q094","chapterId":2,"number":94,"page":51,"stem":"이종이식(xenograft)이 가능한 조직으로 옳은 것은?","choices":["각막","간","신장","폐","심장의 혈관"],"answer":1,"answerLabel":"①","answerPage":317,"explanation":"이종이식이 가능한 조직은 각막, 심장판막과 같은\n무혈관조직이다."},{"id":"c02-q095","chapterId":2,"number":95,"page":51,"stem":"다음 중 후천성면역결핍증후군 환자에게서 hiv가 전파되는 경우로 옳은 것은?","choices":["제왕절개 분만","감염자의 재채기, 콧물","상처 있는 손에 환자의 체액이 묻는 경우","화장실 변기 공동 사용하기","감염자인 산모가 아기에게 분유 수유하기"],"answer":3,"answerLabel":"③","answerPage":317,"explanation":"전파경로는 혈액, 정액, 질 분비물과 같은 체액으로\n전염, 감염된 혈액 수혈, 감염자의 체액 접촉, 질 분만,\n감염된 환자로부터 모유수유 등이다."},{"id":"c02-q096","chapterId":2,"number":96,"page":51,"stem":"신장을 이식받고 5개월 후 다시 병원을 방문한 환자에게 장기이식의 만성 반응에 대해 교\n육을 실시하였다 주의해서 관찰해야 하는 증상으로 옳은 것은?","choices":["저혈압","소변량 증가","체중증가","빈혈","발진"],"answer":3,"answerLabel":"③","answerPage":317,"explanation":"장기이식 후 만성 반응증상으로 고질소혈증, 소변량\n감소, 고혈압, 체중증가 등이 발생한다."},{"id":"c02-q097","chapterId":2,"number":97,"page":51,"stem":"이식거부반응에 대한 설명으로 옳은 것은?","choices":["모든 자가이식은 이식거부(transplant rejection)를 일으킨다.","이식거부반응은 과민반응 중 제 1형 초과민 반응에 해당한다.","이식거부반응의 단계 중 초급성 반응은 수혜자가 기증자의 항원에 대한 항체를 형 성하였기 때문에 발생하며 주로 수술 중에 발생한다.","이식거부반응의 단계 중 급성 거부반응은 항체매개 및 세포매개 면역반응이 모두 관여하며 항체는 주로 신경을 손상시킨다.","이식거부반응의 단계 중 만성반응은 조직의 관류와 만성 허혈로 인해 저혈압, 체중 증가 등의 증상이 나타난다. ch叩ter 2 병태생리 | 51"],"answer":3,"answerLabel":"③","answerPage":317,"explanation":"동종이식은 이식거부(transplant rejection)을 일으키며\n항체 매개성 및 세포매개성 면역반응이다. 이식거부반응 시\n항체는 주로 혈관을 손상시킨다. 만성반응은 조직의 관류와\n만성 허혈로 인해 고혈압, 체중증가, 소변량 감소 등의 증상이\n나타난다."},{"id":"c02-q098","chapterId":2,"number":98,"page":52,"stem":"만성 신부전으로 10년간 혈액투석을 받아오던 53세 환자가 신장이식을 위한 준비를 하고\n있다 기증자와 수여자의 면역학적 검사에 반드시 포함되어야 하는 것은?","choices":["ABO 적합성 검사","ABO 적합성 검사와 몸무게 적합성 검사","ABO 적합성 검사와 HLA 적합성 검사","HLA 적합성 검사와 몸무게 적합성 검사","HLA 적합성 검사"],"answer":3,"answerLabel":"③","answerPage":317,"explanation":"심장이식은 ABO 적합성 검사와 몸무게 적합성 검사가\n필요하며, 신장이식은 ABO 적합성 검사와 HLA 적합성\n검사를 실시해야 한다."},{"id":"c02-q099","chapterId":2,"number":99,"page":52,"stem":"모체태아성 Rh 부적합으로 인한 태아 용혈성 질환으로 태아의 적혈구가 파괴된다 이때\n태반을 거쳐 통과하는 항체로 옳은 것은?","choices":["Ig A","IgD","Ig E","Ig G","Ig M"],"answer":4,"answerLabel":"④","answerPage":318,"explanation":"아성 Rh 부적합으로 인해 모체의 |g G 항체가\n태반을 거쳐 태아의 적혈구를 파괴한다."},{"id":"c02-q100","chapterId":2,"number":100,"page":52,"stem":"T 림프구에 대한 설명으로 옳은 것은?","choices":["흉선에서 생성되고 성숙한다.","체액성 면역반응에 관여한다.","B림프구에 의해 활성화된다.","순환림프구 중 10%를 차지한다.","면역반응을 조절하는 기능을 가지고 있다."],"answer":5,"answerLabel":"⑤","answerPage":318,"explanation":"T 림프구는 골수의 줄기세포에서 생성되고 흉선에서\n성숙된다. 세포 매개형 면역반응에 관여하고, B 림프구를\n활성화시킨다. 전체 순환림프구 중 70~80%를 차지하며\n면역반응을 조절하는 기능을 가지고 있다."}]},{"id":3,"part":"PART I","partTitle":"공통영역","title":"약리","count":100,"startPage":53,"endPage":74,"questions":[{"id":"c03-q001","chapterId":3,"number":1,"page":53,"stem":"55세 여자가 건강검진에서 고지혈증 진단을 받았다. 특히 혈청 트라이글리세라이드 수치\n가 높았다. 이 환자에게 효과적인 고지혈증 치료제는?","choices":["Gemfibrozil","Nicotinic acid","Lovastatin","Cholestyramine","Colestid"],"answer":1,"answerLabel":"①","answerPage":319,"explanation":"Gemfibro기은 트리글리세라이드 및 VLDL 수준이\n과다하게 높은 중증 고중성지방혈증 치료에 선호된다."},{"id":"c03-q002","chapterId":3,"number":2,"page":53,"stem":"약물대사는 일반적으로 phase I과 II로 이루어지는데, 다음 중 제 1 상(phase I) 대사과\n정에 관여하는 효소는?","choices":["Methylase","Sulfotransferase","Acetylase","UDP glucuronosyltransferase","Cytochrome P450"],"answer":5,"answerLabel":"⑤","answerPage":319,"explanation":"약물대사의 phase I은 oxidation으로 cytochrome\nP450이관여한다."},{"id":"c03-q003","chapterId":3,"number":3,"page":53,"stem":"생체이용률(bioavaiは게ity)은 투여 약물이 전신순환에 도달하는 분획을 의미한다. 생체이\n용률에 직접적으로 영향을 주는 인자는?","choices":["분포용적","약물의 반감기","일차통과효과","제거상수","혈장청소율"],"answer":3,"answerLabel":"③","answerPage":319,"explanation":"일차 통과 효과(first fastpass effect)란 투여한 약물이\n전신 순환에 도달하는 과정에서 농도가 감소하는 현상을\n말한다."},{"id":"c03-q004","chapterId":3,"number":4,"page":54,"stem":"다음 중 치료적 약물 모니터링(therapeutic drug monitoring)이 필요한 약물의 기준은?","choices":["치료범위가 넓은 경우","약물농도 측정이 어려운 경우","약물의 치료 효과를 판단하기 쉬운 경우","환자 간 약동학적 지표의 변이가 작은 경우","약물효과와 농도 간의 상관관계가 큰 경우"],"answer":5,"answerLabel":"⑤","answerPage":319,"explanation":"약물의 농도가 조금만 변해도 작용 효과가 크게 변하는\n경우는 약물의 농도 변화를 유심히 살펴보아야 하므로\n치료적 약물 모니터링이 중요하다."},{"id":"c03-q005","chapterId":3,"number":5,"page":54,"stem":"양성 전립선비대 환자의 배뇨장애에 사용되는 독사조신(doxazosin)은 방광괄약근에 분포\n된 수용체에 특이적으로 작용한다 작용기전은?","choices":["41 수용체 차단","a2수용체 항진","f 1 수용체 차단","偿수용체 차단","무스카린수용체 차단"],"answer":1,"answerLabel":"①","answerPage":319,"explanation":"a1 수용체차단제는 방광괄약근을 이완시키는 작용을\n하므로 양성 전립선비대 환자의 배뇨장애에 사용된다, a1\n수용체차단제에는 terazosin, 게fuzosin, tams니osin,\ndoxazosin 등이 있다"},{"id":"c03-q006","chapterId":3,"number":6,"page":54,"stem":"소변을 산성화시키면 약산성 약물은 어떻게 변화하는가?","choices":["이온화가 억제되어 배설이 빨라진다.","이온화가 촉진되어 배설이 빨라진다.","이온화가 촉진되어 배설이 느려진다.","이온화가 억제되어 배설이 느려진다.","이온화 정도 및 배설은 영향을 받지 않는다."],"answer":4,"answerLabel":"④","answerPage":319,"explanation":"Henderson-Hasselbach 식을 통해 소변을\n산성화시키면 약물의 이온화정도가 억제됨을 알 수 있다.\n약산성 약물은 양성자가 제거된 형태 A-의 형태로\n수송되므로 배설이 느려질 것이다."},{"id":"c03-q007","chapterId":3,"number":7,"page":54,"stem":"53세 남자가 녹내장을 치료하기 위하여 티몰롤(tim이이) 안약을 점적하였다. 이 약물이 작\n용하는 수용체는?","choices":["仅수용체","。수용체","니코틴수용체","도파민수용체","무스카린수용체"],"answer":2,"answerLabel":"②","answerPage":319,"explanation":"티몰롤은 B아드레날린수용체차단제이 다."},{"id":"c03-q008","chapterId":3,"number":8,"page":54,"stem":"50세 여자가 호흡곤란으로 응급실에 왔다 숨을 헐떡거리며 청진기에서 천명이 들렸으며,\n호흡수와 심박수가 증가되었다. 오늘 새벽 운동에 찬바람을 맞은 후 갑작스럽게 숨이 막\n히기 시작했다고 한다. 증상 완화를 위해 즉시 투여할 약물은?","choices":["Albuterol","Cromolyn","Fluticasone","Ipratropium","Montelukast part I 공통영역 I 54"],"answer":1,"answerLabel":"①","answerPage":319,"explanation":"천명음이 나타나며, 아침에 찬바람을 맞으며 갑작스럽게\n숨이 막혔다는 점에서 기관지 수축 질환에 의한 반응을\n의심할수 있다. 기관지 이완 목적으로 사용되는 약물군은\n02수용체작용제로 albuterol, metaproterenol,\nritodrine 등이 있다"},{"id":"c03-q009","chapterId":3,"number":9,"page":55,"stem":"65세 남자가 농약을 살포하던 중 의식을 잃고 쓰러져 응급실로 이송되었다. 눈동자는 작\n아져 있으며, 호흡곤란이 있었다. 우선적으로 투여해야 할 약물은?","choices":["Edrophonium","Naloxone","Bethanechol","Atropine","Pyridostigmine"],"answer":4,"answerLabel":"④","answerPage":319,"explanation":"농약에는 acetylcholinesterase와 비가역적으로\n결합하는 유기인화합물(organop hosphorus)이 주로\n사용된다. 농약 복용에 의한 독성은 콜린의 무스카린성,\n니코틴성 작용의 강화로 나타나며, 이에 대한 치료로는\n무스카린수용체를 가역적으로 억제하는 atropine이\n사용된다."},{"id":"c03-q010","chapterId":3,"number":10,"page":55,"stem":"만성폐쇄성폐질환을 동반한 허혈성 심장질환 환자에서 B수용체차단제를 사용하고자 한\n다. 다음 중 가장 적절한 약물은?","choices":["Nadolol","Pindolol","Atenolol","Propranolol","Carvedil이"],"answer":3,"answerLabel":"③","answerPage":319,"explanation":"만성폐쇄성폐질환을 동반되어 있으므로 P1 선택적\n차단제를 쓰는 것이 적절하다."},{"id":"c03-q011","chapterId":3,"number":11,"page":55,"stem":"50세 남자가 과수원에서 쓰러진 채로 발견되어 응급실로 이송되었다 환자의 심박수는 분\n당 45 회, 혈압은 80/40 mmHg, 과도한 땀과 침 분비가 동반되어 있다. 이 환자에게 즉\n시 투여해야 할 약물은?","choices":["Dopamine","Norepinephrine","Atropine","Physostigmine","Echothiophate"],"answer":3,"answerLabel":"③","answerPage":319,"explanation":"환자는 콜린제 중독증상을 보이고 있으며 유기인제제\n(organophosphate)에 의한 중독으로 생각된다. 치료에는\natropineol 효과적이다 무스카린성 증상이 없어질 때까지\natropine 을 투여한다."},{"id":"c03-q012","chapterId":3,"number":12,"page":55,"stem":"신경근 접합 부위에 대한 tubocurarine°l 작용을 길항할 수 있는 약물은?","choices":["Mecamylamine","Succinylcholine","Scopolamine","Neostigmine","Epinephrine"],"answer":4,"answerLabel":"④","answerPage":319,"explanation":"Tubocurarine은 비탈분극성 신경근차단제로,\n신경근접 합부의 니코틴수용체에 아세 틸콜린과 경쟁적으로\n작용하여 아세틸콜린이 결합하는 것을 억제한다. 이들 약물의\n작용은 시냅스 공간에 아세틸콜린의 농도를 증가시키는\nacetylcholinesterase 억제제이다."},{"id":"c03-q013","chapterId":3,"number":13,"page":55,"stem":"다음 중 구강 건조, 시력장애, 변비, 배뇨곤란 등의 유해반응이 있는 약물은?","choices":["도파민 ”수용체길항제","무스카린수용체길항제","히스타민 凡수용체길항제","세로토닌 5-HT3수용체길항제","a아드레날린수용체길항제"],"answer":2,"answerLabel":"②","answerPage":319,"explanation":"항무스카린제 사용 시 구강 근조, 시력장애, 변비,\n배뇨곤란 등의 부작용이 나타난다."},{"id":"c03-q014","chapterId":3,"number":14,"page":56,"stem":"천식 환자가 심한 기침, 호흡곤란 쌕쌕거림으로 약물이 투여된 후 증상은 호전되었으나\n떨림(tremor), 두근거림 (p시pitation) 등의 부작용이 나타났다. 투여된 약물은?","choices":["Albuterol","Cromolyn","Theophylline","Montelukast","Beclomethasone"],"answer":1,"answerLabel":"①","answerPage":319,"explanation":"천식 치료제로 쓰이는 대표적 약물은 02작용제이다.\n이 약물의 흔한 부작용은 골격근 떨림과 빈맥 등이다"},{"id":"c03-q015","chapterId":3,"number":15,"page":56,"stem":"알레르기 질환으로 diphenhydramine을 복용 중인 45세 여자가 멀미 예방을 위해 패치\n형 약물을 붙인 후 졸음 눈부심과 함께 구강건조 증상을 호소하며 내원하였다. 이 환자\n에게 유해반응을 초래한 약물은?","choices":["Scopolamine","Phentolamine","Atenolol","Norepinephrine","Phenylephrine"],"answer":1,"answerLabel":"①","answerPage":319,"explanation":"Diphenhydramine은 제 1 세대 항히스타민제이며,\n동시에 항무스카린제로도 작용한다. 항콜린제의 경우 두\n가지를 동시에 복용하면 약물 상호작용에 의해 항콜린 효과를\n더 크게 나타내게 된다. 따라서 멀미약으로 쓰이는 항콜린제인\nscop이amine과 diphenhydramine과 함께 약물\n상호작용으로 synergic effect를 가져온 것이라 볼 수\n있다."},{"id":"c03-q016","chapterId":3,"number":16,"page":56,"stem":"다음 중 간호사가 사정해야 할 lithium 중독의 증상은?","choices":["소변량 증가, 설사, 떨림","구강건조, 구토, 저혈압","변비, 흐린 시력, 근육강직","식욕증가, 활기증가, 기억력 저하","피로, 고혈압, 혼돈"],"answer":1,"answerLabel":"①","answerPage":319,"explanation":"Lithium의 유해반응은 현기증 피로, 단기적 기억상실,\n소변량 증가, 오심, 구토, 식욕상실, 복부통증, 설사,\n구강건조, 근육쇠약, 가벼운 떨림을 유발할 수 있다."},{"id":"c03-q017","chapterId":3,"number":17,"page":56,"stem":"58세 남자가 소변보는 시간이 길어지고, 잔뇨감이 계속 있어서 병원에 왔다. 환자는 이전\n에 고혈압을 앓고 있었으며, 치료를 위하여 B수용체길항제를 꾸준히 복용하고 있었다 이\n환자에게 새로운 약물을 추가한다巴 가장 좋은 것은?","choices":["Midodrine","Albuterol","Dobutamine","Timolol","Tamsulosin"],"answer":5,"answerLabel":"⑤","answerPage":319,"explanation":"Tams니。sin은 a1 아드레날린수용체차단제이匚卜. 혈관의\na아드레날린수용체에 작용하여 말초혈관을 확장시켜 혈압을\n떨어트리는 역할을 한다. 고혈압의 치료 중 전립샘 비대증이\n나타나는 노인 환자에서 고혈압 약제와 함께 병용된다. 이\n경우 요도 민무늬근육을 이완하는 효과를 가져오게 되어\n소변 시의 불편감을 해소할 수 있다."},{"id":"c03-q018","chapterId":3,"number":18,"page":57,"stem":"17세 남자가 1 년 전부터 눈꺼풀에 힘이 없어져서 눈꺼풀이 자꾸 쳐지고 복시가 나타났다.\n3개월 전부터는 음식을 씹거나 삼키기도 곤란한 증상이 발생하여 내원하였다. 환자에게\nedrophonium을 정맥주사 하였더니 증상들이 호전되었다. 이 약물의 작용기전으로 옳은\n것은?","choices":["나트륨 통로에 결합하여 신경세포활성을 증가시킨다.","칼슘 통로에 결합하여 아세틸콜린의 방출을 증가시킨다.","Cholinesterase에 결합하여 아세틸콜린의 파괴를 억제한다.","무스카린수용체에 결합하여 민무늬근의 수축을 증가시킨다.","니코틴수용체에 결합하여 가로무늬근의 수축을 증가시킨다."],"answer":3,"answerLabel":"③","answerPage":319,"explanation":"Myasthenia gravis(중증근무력증)은 시냅스 후 접합부에\n있는 acetylcholine receptor에 경쟁적으로 결합하여\n작용을 막는 자가항체가 존재하여 근육 수축이 지속되지\n못하고 빨리 피로해지는 질병이다. Edrophonium과 같은\nacetyCh이inesterase 억제제를 사용하면 시냅스 틈에서의\nacetylch이ine의 농도가 올라가 좀 더 오래 작용할 수 있다."},{"id":"c03-q019","chapterId":3,"number":19,"page":57,"stem":"약리작용이 12시간 이상 지속되는 약제로서, 야간천식 조절을 위하여 취침 전에 예방적\n으로 사용되는 약물은?","choices":["Albuterol","Isoproterenol","Metaproterenol","Salmeterol","Terbutaline"],"answer":4,"answerLabel":"④","answerPage":319,"explanation":"S 기meter이은 천식을 조절하기 위해 사용되는 선택적인\n跖작용제 중에서 장기간 작용하는 효능제이다."},{"id":"c03-q020","chapterId":3,"number":20,"page":57,"stem":"갑상선 절제술을 받은 57세 여자가 레보티록신(levothyroxine)을 과량 복용한 후 빠른맥,\n두근거림, 가슴 통증이 생겼다 혈중 TSH 농도는 0.이 mIU/L이었다(참고치 0.4~4.0). 가\n장 먼저 투여해야 할 약물은?","choices":["Propranolol","Propylthiouracil","Amiodarone","Triiodothyronine","Methimazole"],"answer":1,"answerLabel":"①","answerPage":319,"explanation":"갑상선호르몬제를 과량 복용하여 갑상선 중독증 증상을\n나타내고 있다. 문제의 보기는 모두 갑상선을 억제하는\n약물이나 현재 빠른맥, 두근거림 등의 증상이 있기 때문에\npropran이이을 먼저 써서 이러한 증상들을 완화시킬 필요가\n있다. 또한 B차단제는 말초에서 T4 가 一「3로 전환되는 것을\n막는 효과도 있다."},{"id":"c03-q021","chapterId":3,"number":21,"page":57,"stem":"40세 남자가 교통사고로 우측 대퇴골에 개방골절로 응급실에 실려 왔다. 전신마취제 투\n여를 위하여 기도에 관을 삽입하려 할 때 투여하는 약물은?","choices":["Succinylcholine","Atracurium","Pancuronium","Tubocurarine","Rocuronium"],"answer":1,"answerLabel":"①","answerPage":320,"explanation":"Succinylch이ine은 작용시간이 짧기 때문에 단시간의\n근육 이완을 필요로 하는 위내시경 혹은 기관지 내시경 삽입\n시 등에 자주 이용된다."},{"id":"c03-q022","chapterId":3,"number":22,"page":58,"stem":"진정작용과 관계 깊은 신경전달물질은?","choices":["GABA","Dopamine","Glutamate","Acetylcholine","Serotonin"],"answer":1,"answerLabel":"①","answerPage":320,"explanation":"GABA수용체에 GABA가 결합하면, 염소통로가\n열리면서 세포막은 과분극을 일으킨다. 이로 인해 신경활동은\n억제된다."},{"id":"c03-q023","chapterId":3,"number":23,"page":58,"stem":"70세 남자가 파킨슨병을 진단받았다. 이 병 치료에 사용되는 레보도파(levodopa)가 말초\n에서 도파민(dopamine) 으로 전환되는 것을 막는 약물로서 레보도파와 병용 투여하는\n경우 레보도파 용량을 줄일 수 있는 약물은?","choices":["L-도파 (L—dopa)","카비도파(carbidopa)","셀레길린(selegiline)","트리헥시페니딜(trihexyphenidyl)","브로모크립틴(bromocri ptine)"],"answer":2,"answerLabel":"②","answerPage":320,"explanation":"Carbidopa는 DOPA decarboxylase(aromatase\nL -amino acid decarboxylase)# 막기 때문에 levodopa\n가 말초에서 전환되는 것을 방지한다, 파킨슨병 치료를 위해\nlevodopa 와 carbidopaS 함께 투여함을 기억해야 한다.\n참고로 s이egiline은 MAO B 억제제로 도파민이 분해되는\n것을 막으며 , bromocriptine은 도파민수용체작용제이고,\ntrihexyphenidyl은 항무스카린제이다. 보기에 나온 답\n모두 파킨슨병 치료제로 이용되고 있다."},{"id":"c03-q024","chapterId":3,"number":24,"page":58,"stem":"15세 남자가 전신발작으로 응급실에 왔다. 6년 전부터 간간이 발작이 있었고 심할 때는\n수십 회 발생하면서 20-60초씩 의식소실도 동반되었다고 한다. 실신발작에서 우선적으\n로 투여해야 할 약물은?","choices":["Gabapentin","Phenobarbital","Lamotrigine","Ethosuximide","Carbamazepine"],"answer":4,"answerLabel":"④","answerPage":320,"explanation":"실신발작에 사용되는 치료제를 묻는 문제이다. 1 차\n치료제로는 low voltage activated calcium channel\n억제제인 ethosuximde를 사용하며, 대부분의 실신발작의\n경우 ethosuximide에 잘 반응한다. Lamotrigine 또한\n사용될 수 있으나 효과가 적어 우선적으로 시용되지는 않는다."},{"id":"c03-q025","chapterId":3,"number":25,"page":58,"stem":"22세 여자가 혼수상태로 응급실로 이송되었다. 외부 자극에 대한 반응이 미미하였匚卜 혈\n압은 80/40mmHg, 호흡은 5분이었고, 동공은 매우 심하게 축소되어 있었다. 보호자에\n의하면 그녀는 수개월 전부터 아편유사제(opioid)를 투여해 왔다고 한다. 이 환자에게 즉\n시 투여해야 하는 약물은?","choices":["Atropine","Chlorpromazine","Lorazepam","Morphine","Naloxone"],"answer":5,"answerLabel":"⑤","answerPage":320,"explanation":"Opioid 중독에는 opioid antagonist인 n기。xone\n을 투여한다."},{"id":"c03-q026","chapterId":3,"number":26,"page":59,"stem":"Parkinson병 치료에 dopamine 대신 —dopa를 사용하는 이유 중 가장 옳은 것은?","choices":["Dopamine은 체내 반감기가 짧기 때문이다.","Dopamine은 중추에서 쉽게 대사되기 때문이다.","Dopamine 보다 L-dopa가 효능이 크기 때문이다.","Dopamine은 혈관-뇌장벽을 통과하지 못하기 때문이다.","Dopamine은 위장관에서 흡수가 잘 되지 않기 때문이다."],"answer":4,"answerLabel":"④","answerPage":320,"explanation":"파킨슨병은 운동 기능 이상을 초래하는 중추신경계\n퇴행성 질환으로 흑질(substantia nigra)의 도파민 뉴런의\n소실과 그에 따른 선조체(striat닌m)에서의 도파민 결핍이\n특징으로 나타나게 된다. 따라서 도파민 뉴런의 활성을\n높이는 것이 치료의 목표가 된다. 도파민은 혈관-뇌장벽을\n통과하지 못하는 반巴 도파민의 전구체인 levo-dopa\n(L-dopa)는 혈관-뇌장벽을 통과할 수 있기 때문에 파킨슨병의\n치료로 쓰일 수 있다"},{"id":"c03-q027","chapterId":3,"number":27,"page":59,"stem":"57세 남자가 뇌전증(간질) 치료를 위하여 페노바르비탈(phenobarbital)을 투여 받았다. 초\n기에는 치료가 잘 되었지만 반복 투여로 인하여 치료 효과가 감소되었다. 치료 효과가 감\n소된 주요 원인은?","choices":["약물분포 감소","혈장단백결합 감소","수용체 작용 감소","약물대사 효소 유도","약물배설 증가"],"answer":4,"answerLabel":"④","answerPage":320,"explanation":"Barbiturate 계열의 약물은 반복 투여 시 약물대사\n효소의 촉진이 일어나서 초기보다 효과가 감소한다."},{"id":"c03-q028","chapterId":3,"number":28,"page":59,"stem":"75세 남자가 심부전으로 병원에 왔다. 이 환자의 과거력에 15년 전 당뇨병 진단 20세부\n터 30년 동안 하루에 1 갑씩 흡연, 20년 전 고혈압 진단, 가끔 저혈당 증상 호소라고 기록\n되어 있다. 심부전 치료를 위해서 우선적으로 고려해야 할 약물은?","choices":["니트로글리세린(nitroglycerin)","，차단제 (beta blocker)","고용량 디곡신(high dose digoxin)","티아지드 이뇨제(thiazide diuretics)","안지 오텐신전환효소억 제 제 (ACE inhibitor)"],"answer":5,"answerLabel":"⑤","answerPage":320,"explanation":"• 환자의 병력을 고려하면 만성 심부전이 의심되므로 ACE inhibitor\n를 사용해야 한다.\n• Nitroglycerin은급성 심부전에 사용되며, 당뇨 환자에게 0차단제는\n사용하지 않는다.\n• Digoxin은 ACE inhibitor. 0차단제, diuretics를 썼음에도\n불구하고 악화되는 경우에 사용한다.\n• Thiazide는 heart failure 치료제로 단독으로 쓰지는 않는다.\n심부전에 주로 쓰이는 이뇨제는 loop 이뇨제이다. ACE inhibitor\n와 Angiotensin receptor blocker (ARB)는 hypertension\n치료에도 도움이 된다."},{"id":"c03-q029","chapterId":3,"number":29,"page":59,"stem":"55세 여자가 1 주 전 시행한 건강검진에서 저밀도 지질단백질 콜레스테롤(LD—ch이ester이)\n이 270 mg/dL(참고치〈130)로 측정되었다. HMG-CoA reductase# 억제하여 주로 저밀\n도 지질단백질 콜레스테롤 농도를 낮추는 약물은?","choices":["Niacin","Cholestipol","Gemfibrozil","Clofibrate","Atorvastatin"],"answer":4,"answerLabel":"④","answerPage":320,"explanation":"HMG-coA reductase# 경쟁적으로 억제하여 LDL\n수치를 낮추는 약은 statin이다."},{"id":"c03-q030","chapterId":3,"number":30,"page":60,"stem":"55세 남자가 고혈압치료제로 안지오텐신전환효소억제제(AC티)를 처방받았다. 이 약물 복\n용 후 환자는 마른기침을 하였다 이 증상은 어느 물질의 증가에 의한 것인가?","choices":["엔도텔린(endothelin)","세로토닌(serotonin)","브라디키닌(bradykinin)","안ス］오시텐시노겐(angiotensinogen)","안지오텐신 I(angiotensin I)"],"answer":5,"answerLabel":"⑤","answerPage":320,"explanation":"AC티은 angiotensin receptor 이o아くer와 달리\nbradykinin의 lev이을 높여 혈관부종(angioedema)과\n마른기침(dry cough)이라는 부작용(side effect)이 발생한다."},{"id":"c03-q031","chapterId":3,"number":31,"page":60,"stem":"65세 남자가 30분 전 갑자기 시작된 의식혼미와 운동장애로 응급실에 왔다. CT 검사 결\n과 중대뇌동맥에서 막힌 부분이 보였고 주변 부위에서 허혈성 소견이 관찰되었다. 이 환\n자에 적절한 처치는?","choices":["Heparin 정맥주사","Warfarin 경구투여","Ticlopidine 경구투여","Aspirin 경구투여","Anistreplase 정맥주사"],"answer":5,"answerLabel":"⑤","answerPage":320,"explanation":"Anistreplase는 thrombolytic drug로 plasminogen\n을 plasmin으로 바꿔 fibrin을 녹인다. 뇌졸중, 폐색전증 등\n급성 혈전색전 질환에서 혈전 용해를 위해서는 thromb이ytic\nagent 가 이용된다."},{"id":"c03-q032","chapterId":3,"number":32,"page":60,"stem":"60세 남자가 흉통 때문에 병원에 왔다. 협심증으로 진단되어 B차단제를 투여 받은 후 협\n심증 증상 호전되었다. 협심증 치료에서 B차단제의 작용기전은?","choices":["관상동맥 이완","혈소판응집 억제","말초혈관저항 감소","심근산소 요구량 감소","방실결절 전도속도 감소"],"answer":4,"answerLabel":"④","answerPage":320,"explanation":"허혈성 심질환은 산소의 공급요구량이 더 많을 때\n발생하며,。차단제는 심박수와 수축력을 통해 심근 산소\n요구량을 감소시킨다."},{"id":"c03-q033","chapterId":3,"number":33,"page":60,"stem":"50세 여자가 심전도에서 심실성 빈맥(ventricular tachycardia)O| 진단되었다. 이 환자에\n게 적합한 약물은?","choices":["딜티아잼 (diltiazem)","에스몰롤(esmolol)","리도카인(lidocaine)","아미오다론(amiodarone)","아데노신(adenosine)"],"answer":3,"answerLabel":"③","answerPage":320,"explanation":"리도카인은 inactivated된 심장 Na 채널을 차단하여\n심실성 빈맥 치료에 이용된다. Esm이이은 반감기가 짧아\n부작용이 많고 amiodarone은 ventricular tachycardia\n가 재발하거나 다른 약에 저항이 있는 경우 사용된다.\nAdenosine은 supraventricular tachycardia에\n이용된다. Diltiazem 역시 ventricular tachycardia\n보다는 atri기 fibrillation 등 다른 부정맥에 사용된다."},{"id":"c03-q034","chapterId":3,"number":34,"page":60,"stem":"50세 여자가 심방세동으로 응급실에 입원하였다. 치료를 위하여 amiodarone를 투여 받았\n다. 약물의 부작용인 TDP (Torsades de pointes) 발생기전은?","choices":["재진입(re-entry)","전도차단(conduction block)","자동능변화(altered automaticity)","조기 후탈분극(early afterdepolarization)","지연 후탈분극(delayed afterdepolarization)"],"answer":4,"answerLabel":"④","answerPage":320,"explanation":"Class III 항부정맥 약물은 재분극에 관여하는 칼륨통로\n차단에 작용하여 활동전위 기간(action potential duration)\n을 연장하는 방식으로 작용한다. 활동전위기간의 연장은\n직접적으로 효과적 불응기의 연장을 가져와서 항부정맥효과를\n나타낸다. 그러나 활동전위기간의 연장은 동시에 QT 간격\n(QT interval)의 증가를 초래하여 early afterdepolarization\n에 의한 torsades de pointes의 발생 위험성을 증가시킨다.\nClass III 항부정맥 약물의 예로는 amiodarone, sotal,\nibutilide 등이 있다."},{"id":"c03-q035","chapterId":3,"number":35,"page":61,"stem":"50세 여자가 숨이 차고 다리가 붓고, 최근 1 주일 사이에 체중이 5 Kg 증가하여 심장기능\n상실 치료 약물을 복용하였다. 약물을 복용하면서 오심과 사물이 흐릿하게 보이는 증상\n을 호소하여 다시 응급실에 왔다 심전도에서 P-R 간격이 길어지고 간헐적인 방실결절\n차단의 소견이 보였다. 복용한 심장기능상실 치료약물은?","choices":["Losartan","Dobutamine","Digoxin","Diltiazem","Amlodipine"],"answer":3,"answerLabel":"③","answerPage":320,"explanation":"방실차단, 식욕부진/구역질/구토, 혼돈/환각/섬망/\n시력장애 등은 digitalis 중독에 의해서 나타나는 증상들이다."},{"id":"c03-q036","chapterId":3,"number":36,"page":61,"stem":"류코트리엔수용체를 차단하며, 천식 치료에 사용되는 약물은?","choices":["Fluticasone","Cromolyn","Albuterol","Mont아〈ukast","Tiotropium"],"answer":4,"answerLabel":"④","answerPage":320,"explanation":"Montekukast는 류코트리엔수용체를 차단하는\n약물이다."},{"id":"c03-q037","chapterId":3,"number":37,"page":61,"stem":"천식병력이 있는 12살 여아가 새 아파트에 이사 후 기침, 호흡곤란 및 천명이 심해져 응\n급실에 왔다 발한 호흡곤란 빈맥과 뻐른 호흡이 있으며, 호흡수 42/회/분 맥박 110회/분\n혈압 132/65 mmHg이다. 이 환자의 기관지 수축을 신속히 역전시키기 위한 가장 적절한\n약물은?","choices":["흡입용 cromolyn","흡입용 beclometasone","흡입용 albuterol","정맥용 propranolol","정맥용 aminophylline"],"answer":3,"answerLabel":"③","answerPage":320,"explanation":"발작성 천식에 가장 적합한 약물은 흡입용 B작용제이다.\nAlbuterol 는 B2 작용제이다."},{"id":"c03-q038","chapterId":3,"number":38,"page":61,"stem":"6세 여아가 바이러스 감염에 의한 발열 및 근육통이 있다. 다음 중 증상을 치료하는 데\n가장 적절한 약물은?","choices":["Acetaminophen","Baby aspirin","Celecoxib","Fenoprofen","Indomethacin"],"answer":1,"answerLabel":"①","answerPage":320,"explanation":"6세 이하의 소아에게 아스피린 계통의 NS 시D는 라이\n증후군을 일으킬 수 있음으로 해열진통제로 아세트아미노펜을\n주어야 한다."},{"id":"c03-q039","chapterId":3,"number":39,"page":62,"stem":"70세 남자가 손목에 부종과 통증을 호소하여 의사는 NSAIDs을 처방하였다. 그런데 이\n환자는 위궤양의 과거력을 가지고 있다. 궤양질환의 활성을 예방하기 위해 NS 시Ds와 함\n께 투여할 수 있는 약물은?","choices":["Allopurinol","Probenacid","Misoprostol","Sulindac","Colchicine"],"answer":3,"answerLabel":"③","answerPage":320,"explanation":"NSAIDs는 위점막의 프로스타글란딘의 생성을 억제하여\n위궤양을 촉진시킨다. 따라서 프로스타글란딘 유도체인\nmisoprostol 를 복용해야 한다.\n정답및배설 I 320"},{"id":"c03-q040","chapterId":3,"number":40,"page":62,"stem":"택시 운전을 하는 57세 남자의 운전 능력을 현저하게 손상시킬 것으로 기대되는 약물은?","choices":["Diphenhydamine","Ergotamine","Fexofenadine","Ranitidine","Sumatriptan"],"answer":1,"answerLabel":"①","answerPage":321,"explanation":"Diphenhydamine은 제 1 세대 항히스타민제로 혈액-\n뇌장벽을 통과하여 졸음을 유발할 수 있다."},{"id":"c03-q041","chapterId":3,"number":41,"page":62,"stem":"시스플라틴 항암화학요법을 받은 환자가 심한 메스꺼움과 구토증상을 보였다 다음 중 환\n자의 메스꺼움과 구토를 감소시킬 수 있는 약물은?","choices":["Bismuth subsalicylate","Ondansetron","Loperamide","Diphenhydramine","Dronabinol"],"answer":2,"answerLabel":"②","answerPage":321,"explanation":"구토를 억제하는 약물은 세로토닌길항제인\n0 ndansetron 이匚 卜."},{"id":"c03-q042","chapterId":3,"number":42,"page":62,"stem":"벽세포에서 proton pump를 저해시켜 위산분비를 억제하는 약물은?","choices":["Omeprazole","Famotidine","Pirenzepine","Sucralfate","Misoprostol"],"answer":1,"answerLabel":"①","answerPage":321,"explanation":"벽세포에서 proton pump를 억제하는 약물은\nomeprazole 이다."},{"id":"c03-q043","chapterId":3,"number":43,"page":62,"stem":"협심증 환자인 50세 남자가 amlodipine을 처방받아 투약하고 있다 환자가 기립성 저혈\n압을 경험하였다면 이 환자에게 간호사가 내려야 할 지시로 옳은 것은?","choices":["증상이 사라질 때까지 누워 있게 한다.","저혈압을 최소화하기 위해 서서히 몸의 자세를 변화시킨다.","칼슘통로차단제의 용량을 증가시킨다","저혈압 증세가 없어질 때까지 약물 투여를 중단한다.","혈당을 측정한다."],"answer":2,"answerLabel":"②","answerPage":321,"explanation":"Amlodipine는 칼슘통로차단제로 혈관을 확장시켜\n기립성 저혈압을 경험할 수 있다. 따라서 기립성 저혈압을\n예방하기 위해 자세를 변경할 때 천천히 하도록 교육한다."},{"id":"c03-q044","chapterId":3,"number":44,"page":63,"stem":"협심증 치료에서 전부하를 감소시키는 약물은?","choices":["Propranolol","Verapamil","Nifedipine","Isosorbide dinitrate","Amlodipine"],"answer":4,"answerLabel":"④","answerPage":321,"explanation":"Isosorbide 게nitrate는 정맥혈관을 확장하여 심장으로\n들어오는 혈액을 감소시켜 전부하를 감소시킨다."},{"id":"c03-q045","chapterId":3,"number":45,"page":63,"stem":"시험을 하루 앞둔 20세 여자가 시험에 대한 스트레스로 인해 심장 박동이 빨라졌다. 시험\n에 대한 불안으로 공부에 집중도 할 수 없었다. 처방을 하면 좋을 것으로 기대되는 약물\n은?","choices":["Verapamil","Quinidine","Propranolol","Sotalol","Amiodarone"],"answer":3,"answerLabel":"③","answerPage":321,"explanation":"스트레스로 인한 빈맥의 치료제는 B차단제인\npropran 이이을 투약한다."},{"id":"c03-q046","chapterId":3,"number":46,"page":63,"stem":"Spironolatone (Aldactone)을 투여할 때, 간호사가 가장 면밀히 관찰해야 하는 전해질 불\n균형은?","choices":["고나트륨혈증","저나트륨혈증","고칼륨혈증","저칼륨혈증","고칼슘혈증"],"answer":3,"answerLabel":"③","answerPage":321,"explanation":"Spironolatone (시dactone)는 알도스테론 분비를\n억제하여 칼륨 배출을 억제시킴으로 고칼륨혈증을 유발할\n수 있다."},{"id":"c03-q047","chapterId":3,"number":47,"page":63,"stem":"네프론에서 thiazide계 이뇨제가 주로 작용하는 곳은?","choices":["근위세뇨관","헨레고리","원위세뇨관","사구체여과부의 capsule area","삼투성 요소 채널(osmotic urea channel)"],"answer":3,"answerLabel":"③","answerPage":321,"explanation":"Thiazide계 이뇨제가 작용하는 부위는 원위세뇨관이다."},{"id":"c03-q048","chapterId":3,"number":48,"page":63,"stem":"안지오텐신 II의 형성의 감소와 브라디키닌의 농도의 증가에 의해 혈관확장 작용을 일으\n키는 것은?","choices":["Enalapril","Losartan","Amlodipine","Prazosin","Minoxidil"],"answer":1,"answerLabel":"①","answerPage":321,"explanation":"Enalapril은 안지오텐신 II의 형성을 감소시키고,\n브라디키닌의 농도를 증가시킨다."},{"id":"c03-q049","chapterId":3,"number":49,"page":64,"stem":"고혈압이 있는 75세 여자 환자가 thiazide 이뇨제를 복용하고 있다 혈압은 120/76 mmHg\n이다. 약물 투여 수개월 후에 이 환자는 피곤함과 무력함을 호소하였다. 다음 중 환자의\n혈액분석 결과에서 낮을 것으로 기대되는 것은?","choices":["칼슘","요산","칼륨","나트륨","포도당"],"answer":3,"answerLabel":"③","answerPage":321,"explanation":"Thiazide 이뇨제는 저칼륨혈증을 유발한다."},{"id":"c03-q050","chapterId":3,"number":50,"page":64,"stem":"다음 중 마른기침, 발적 등의 약물 이상반응에 대해 환자에게 교육을 해야 하는 약물은?","choices":["Ramipril","Losartan","Minoxidil","Doxazosin","Amlodipine"],"answer":1,"answerLabel":"①","answerPage":321,"explanation":"마른기침, 발적 등은 안지오텐신전환효소억제제(AC티)\n의 특징적인 약물 유해반응이다"},{"id":"c03-q051","chapterId":3,"number":51,"page":64,"stem":"뇌의 a2수용체를 흥분시켜 교감신경계를 억제시키는 항고혈압약물은?","choices":["Hydralazine","Clonidine","Diltiazem","Losartan","Captopril"],"answer":2,"answerLabel":"②","answerPage":321,"explanation":"• Hydralazine： 혈관확장제\n• Clonidine： a2차단제\n• Diltiazem： 칼륨통로차단제\n• Losartan： ARB\n• Captopril： 안지오텐 신전환효소억제제"},{"id":"c03-q052","chapterId":3,"number":52,"page":64,"stem":"의사가 고혈압 환자에게 nifedipine# 처방하였다 처방을 수행하려는 간호사는 이 약물\n이 다음 중 어떤 기전에 의해서 혈관을 이완시킨다고 환자에게 교육해야 하는가?","choices":["칼슘의 유입을 억제한다.","Catecholamines의 분비를 촉진한다.","Aldosterone의 분비를 촉진한다.","Angiotensin I °] Angiotensin 11 로 전환되는 것을 억제한다.","칼륨분비를 촉진한다."],"answer":1,"answerLabel":"①","answerPage":321,"explanation":"Nifedipine은 칼슘통로차단제로 칼슘의 유입을\n억제한다."},{"id":"c03-q053","chapterId":3,"number":53,"page":64,"stem":"신경근육차단제의 작용기전이 다른 약물은?","choices":["Tubocurarine","Pancuronium","Vecuronium","Suxamethonium","Atracurium"],"answer":4,"answerLabel":"④","answerPage":321,"explanation":"Suxamethonium은 탈분극성 근육이완제이며, 다른\n약물은 비탈분극성 근육이완제이다."},{"id":"c03-q054","chapterId":3,"number":54,"page":65,"stem":"약물 100 mg을 복용하였다. 복용 후 45 mg은 위에서 흡수되지 않아 배설되었고, 위에\n서 흡수된 약 용량 중 30 mg이 간에서 대사되었다 이 약물의 생체이용률(%)은?","choices":["35","25","15","0.35","0.25"],"answer":2,"answerLabel":"②","answerPage":321,"explanation":"간에 흡수된 양은 55 mg이며, 이 중에서 30 mg이\n대사되었으므로 체순환에 도달된 양은 25 mg이다. 따라서\n생체이용률은 25%이다."},{"id":"c03-q055","chapterId":3,"number":55,"page":65,"stem":"다음 중 captopril의 작용기전으로 옳은 것은?","choices":["레닌의 활성 억제","브라디키닌의 비활성화","안지오텐신 口 형성 억제","신장에서 소변 배줄 증가","혈관 평활근에서 칼슘 유입을 방해"],"answer":3,"answerLabel":"③","answerPage":321,"explanation":"Captopril은 안지오텐신전환효소억제제(AC티)로\n안지오텐신 II 형성을 억제하고, 브라디키닌의 비활성화를\n억제한다."},{"id":"c03-q056","chapterId":3,"number":56,"page":65,"stem":"50세 여자가 극심한 두통으로 응급실에 내원하였다. CT 검사 결과 뇌부종 소견이 보였다.\n통증 감소를 위해 다음 중 투여할 수 있는 약물은?","choices":["Mannitol","Amiloride","Metoprolol","Acetazolamide","Hydrochlorthiazide"],"answer":1,"answerLabel":"①","answerPage":321,"explanation":"Mannit이은 삼투성 이뇨제로 뇌압증가가 있는 환자에게\n사용된다."},{"id":"c03-q057","chapterId":3,"number":57,"page":65,"stem":"신장결석이 있는 40세 남자에게 칼슘배설을 감소시키기 위해 이뇨제를 투여하였다. 3주\n후 통풍이 발생하였다. 이 환자가 복용하였을 것으로 기대되는 약물은?","choices":["Urea","Furosemide","Spironolactone","Acetazolamide","Hydrochlorthiazide"],"answer":5,"answerLabel":"⑤","answerPage":321,"explanation":"Thia기de 계 이뇨제는 칼슘 재흡수를 증가시키므로\n신장결석에 사용되나 요산배설도 억제하여 요산축적을\n일으키므로 일부 환자들에게 통풍발작을 일으킬 수 있다."},{"id":"c03-q058","chapterId":3,"number":58,"page":65,"stem":"체내 단백질(알부민)이 부족하다면 약동학의 요소 중 어디에 가장 크게 영향을 주는가?","choices":["약물의 흡수","약물의 분포","약물의 대사","약물의 배설","약물의 효과"],"answer":2,"answerLabel":"②","answerPage":321,"explanation":"약물의 분포는 신체 전체로의 약물 이동을 말한匚卜.\n알부민과 결합한 약물은 약물-단백 복합체를 이루며,\n결합에서 분리된 유리 약물만이 표적세포로 이동한다."},{"id":"c03-q059","chapterId":3,"number":59,"page":66,"stem":"천식을 앓고 있는 환자가 최근 고혈압 진단을 받았다 이 환자에게 고혈압 치료 목적으로\n사용해서는 안 되는 약물은?","choices":["Amlodipine","Candesartan","Dichlorothiazide","Enalapril","Propranolol"],"answer":5,"answerLabel":"⑤","answerPage":321,"explanation":"Propran이이은 p1, 2를 모두 차단하므로 기관지\n수축을 일으킬 수 있어 천식 환자에게 금기이다."},{"id":"c03-q060","chapterId":3,"number":60,"page":66,"stem":"임신한 여자에게 혈전색전증 예방 약물을 사용하고 있는데 대변에 잠혈이 있어 약물 투여\n를 즉시 중단하였다. 체내에 남아 있는 약물의 작용을 차단하기 위해 투여해야 할 약물은?","choices":["비타민K","Clopidogrel","Fondaparinux","Dipyridamole","Protamine sulfate"],"answer":5,"answerLabel":"⑤","answerPage":321,"explanation":"안티트롬빈을 활성화시켜 작용하는 항응고제는 heparin\n이다. Heparin의 길항약물은 protamine s니fate로\nheparin과 결합하여 안정성 복합체를 형성함으로써\nheparin의 작용을 막는다."},{"id":"c03-q061","chapterId":3,"number":61,"page":66,"stem":"50세 남자의 혈액 LD\"ch이ester이이 240 mg/dL이었匚卜 의사는 환자의 LD—ch이ester이\n을 낮추려고 아1 이ester이 합성 효소인 HMG-CoA reductase를 억제하는 약물을 사용하\n기로 하였다. 다음 중 이런 작용 기전을 가진 약물은?","choices":["Atorvastatin","Cholestyramine","Ezetimibe","Gemfibrozil","Niacin"],"answer":1,"answerLabel":"①","answerPage":321,"explanation":"HMG-CoA reductase의 억제제로 쓰이는 약물은\nstatin계 약물이다."},{"id":"c03-q062","chapterId":3,"number":62,"page":66,"stem":"제2형 당뇨병 치료 약물 중 단독 사용 시 저혈당 유발 가능성이 큰 것은?","choices":["Miglitol","Glyburide","Acarbose","Metformin","Rosiglitazone"],"answer":2,"answerLabel":"②","answerPage":321,"explanation":"S 니fonylurea 제제는 인슐린 분비촉진제(ins니in\nsecretagogue)에 속하는 당뇨병 치료제로 주된 부작용으로는\n체중의 증가와 저혈당이다."},{"id":"c03-q063","chapterId":3,"number":63,"page":66,"stem":"65세 후두암 환자가 항암치료와 방사선치료를 시작하였다. 치료 중 구역감과 구토가 있\n을 때 이를 완화하기 위하여 투여할 약물은?","choices":["로페라미드(loperamide)","메클리진(meclizine)","온단세트론(ondansetron)","메토클로프라미드(metoclopramide)","프로메타진(promethazine)"],"answer":3,"answerLabel":"③","answerPage":321,"explanation":"〇ndansetron과 같은 5-HT수용체길항제는\n항구토제로 항암치료, 방사선치료 , 수술 후 구역 , 구토치료에\n이용된다."},{"id":"c03-q064","chapterId":3,"number":64,"page":67,"stem":"50세 여자가 호흡곤란이 있어 병원에 왔고, 천식 진단을 받아 mont이ukast를 투여하려고\n한다. 기관지 수축을 억제하는 mont이ukast는 어느 내인성물질의 수용체를 차단하는가?","choices":["브라디키닌(bradykinin)","트롬복산(thromboxane)","히스타민(histamine)","류코트리엔(leukotriene)","프로스타글란딘(prostaglandin)"],"answer":4,"answerLabel":"④","answerPage":321,"explanation":"Mont이ukast는 류코트리엔길항제이다."},{"id":"c03-q065","chapterId":3,"number":65,"page":67,"stem":"Furosemide를 투여했을 때 나타나는 이뇨 작용은 신장의 어느 부위에서 나트륨의 재흡\n수를 감소키는 것인가?","choices":["근위세뇨관(proximal tubule)","헨레고리 하행각(descending limb of the loop of Henle)","헨레고리 상행각(ascending limb of the loop of Henle)","원위곡세관(distal convoluted tubule)","집합관(collecting duct)"],"answer":5,"answerLabel":"⑤","answerPage":321,"explanation":"Furosemide는 헨레고리의 thick ascending loop\n에 작용한다."},{"id":"c03-q066","chapterId":3,"number":66,"page":67,"stem":"50세 여자가 복통을 호소하며 병원에 왔다. 복통은 3주 전부터 발생하였으며, 6년간 골\n관절염으로 NS 시Ds를 복용 중이다. 위내시경에서 활동성 위궤양 소견이 보였다. 위궤양\n치료를 위해 사용할 수 있는 약제와 그 기전으로 적합한 것은?","choices":["미소프로스톨(misoprostol)： 제산제","라니티딘(ranitidine)： 위점막보호제","파모티딘(famotidine)： 위혈류개선제","란소프라졸(lansoprazole)： 匕수용체길항제","오메프라졸(omeprazole)： 양성자 펌프억제제"],"answer":5,"answerLabel":"⑤","answerPage":321,"explanation":"란소프라졸과 오메프라졸은 모두 앙성자 펌프억제제이며 ,\n라니티딘과 파모티딘은 乩수용체길 항제이다 . 미소프로스톨은\n합성 프로스타글란딘 유도체이다."},{"id":"c03-q067","chapterId":3,"number":67,"page":67,"stem":"55세 남자가 9개월간 이뇨제를 복용한 후 혈당이 상승하였다. 소변 검사 결과 정상보다\nNa+, K+ 이 증가하였고 Ca?+은 감소하였匚卜. 복용한 이뇨제는?","choices":["Acetazolamide","Furosemide","Chlorothiazide","Amiloride","Spironolactone"],"answer":3,"answerLabel":"③","answerPage":321,"explanation":"Thia기de 는 나트륨과 칼륨을 증가시키고 칼슘을\n감소시킨다."},{"id":"c03-q068","chapterId":3,"number":68,"page":68,"stem":"66세 남자가 급성 호흡곤란을 호소하여 병원에 왔다. 남자는 심부전을 앓고 있었으며, 단\n순흉부촬영에서 광범위한 폐부종이 발견되었다. 다음 중 이 환자에게 가장 적절한 이뇨\n제는?","choices":["Spironolactone","Triamterene","Acetazolamide","Furosemide","Chlorthalidone"],"answer":4,"answerLabel":"④","answerPage":321,"explanation":"Diuretics 중 가장 먼저 선택되는 것은 loop diuretics\n로, furosemide를 많이 쓴다. Diuretic effect와 함께\n정맥혈관 확장의 효과도 있어 전부하를 감소시킨다."},{"id":"c03-q069","chapterId":3,"number":69,"page":68,"stem":"다음 중 소화성 궤양 치료 약물인 omeprazoleOl 작용하는 부위는?","choices":["H+ K+-ATPase","무스카린 Ml수용체","Na+ K+-ATPase","무스카린 M ：수용체","Histamine 凡수용체"],"answer":1,"answerLabel":"①","answerPage":321,"explanation":"Omeprazole은 PPI (proton pump inhibitor)로 H+\nK+-ATPase를 억제해 산 분비를 줄인다."},{"id":"c03-q070","chapterId":3,"number":70,"page":68,"stem":"급성 상기도 감염 증상으로 병원을 찾은 남자는 기침, 발열, 걸을 때 숨가쁨을 호소하였\n다. 이 환자에게 숨가쁨을 직접 완화시키는 약물은?","choices":["Budesonide","Guaifenesin","Ipratropium","Hydrododone","Acetaminophen"],"answer":3,"answerLabel":"③","answerPage":322,"explanation":"항콜린제는 기관지 확장을 유발하여 천식을 비롯한\n폐질환에 사용될 수 있다. 가장 널리 사용되는 약물은\nipratropium (Atrovent)으로 흡입으로 투여되어\n기관지경련을 빠르게 완화한다."},{"id":"c03-q071","chapterId":3,"number":71,"page":68,"stem":"다음 중 혈중 phenytoin 수치를 증가시키는 항경련제는?","choices":["Ethosuximide","Phenobarbital","Carbamazepine","Clonazepam","Valporic acid"],"answer":1,"answerLabel":"①","answerPage":322,"explanation":"Ethosuximide는 phenytoin의 혈중농도를\n상승시킨다."},{"id":"c03-q072","chapterId":3,"number":72,"page":68,"stem":"류마티스 관절염 환자가 한 달간의 약물 복용 후 속쓰림을 호소하였다. 검사결과 간, 신\n장, 심장 기능은 정상이었다. 적합한 대체 약물은?","choices":["Aspirin","Ibuprofen","Celecoxib","Indomethacin","Sulindac"],"answer":5,"answerLabel":"⑤","answerPage":322,"explanation":"NSAID 가 위장관에서 prostaglandin 생성을 억제시켜\n궤양을 유발하기 때문으로 COX-2 s이ective inhibitor\n인 c 이ecoxib으로 대체해 주면 위장관 부작용을 감소시킬\n수 있다."},{"id":"c03-q073","chapterId":3,"number":73,"page":69,"stem":"40세 택시 기사가 음식을 먹고 온몸에 발진, 가려움증으로 병원에 왔다. 환자는 운전을\n계속해야 하므로 졸음을 유발하지 않는 약을 처방 받길 원하였다. 가장 적절한 약물은?","choices":["Chloropheniramine","Diphenhydramine","Fexofenadine","Hydroxyzine","Promethazine"],"answer":3,"answerLabel":"③","answerPage":322,"explanation":"Fexofenadine은 제2세대 H1 수용체길항제로 혈액-\n뇌장벽을 통과하지 않아 졸음이 오지 않는다. 호흡기\n민무늬근육의 수축이나 경련 차단, 부종 형성 차단, 가려움\n억제, 아나필락시스와 알레르기 작용을 억제한다."},{"id":"c03-q074","chapterId":3,"number":74,"page":69,"stem":"다음 중 심한 호흡억제, 중추신경계 억제 혼수 사망 등을 유발할 수 있는 항경련제는?","choices":["Phenytoin","Clonazepam","Phenobarbital","Diazepam","Varlporic acid"],"answer":3,"answerLabel":"③","answerPage":322,"explanation":"Phenobarbital은 과다투여 시 심각한 호흡억제,\n중추신경계 억제, 혼수 사망 등을 유발할 수 있다."},{"id":"c03-q075","chapterId":3,"number":75,"page":69,"stem":"8세 아이가 해열제 시럽 300 mL를 갑자기 마신 후 식은땀을 흘리고 구역 및 구토를 하였\n다. 의사가 독작용을 방지하기 위하여 N-acetylcysteineS 투여했다. 아이가 마신 해열제\n시럽의 성분은?","choices":["Aspirin","Ibuprofen","Diphenhydramine","Bromhexine","Acetaminophen"],"answer":5,"answerLabel":"⑤","answerPage":322,"explanation":"N-acetylcysteine은 acetaminophenOI 과량\n섭취되었을 때 간독성을 방지하기 위해 쓰이는 약이다.\nAcetaminophenOI 과량 복용되었을 때 이의 대사물인\nnacetyl-p-benzoquinone imine (NAPQI) フト 축적된匚卜."},{"id":"c03-q076","chapterId":3,"number":76,"page":69,"stem":"장기이식 환자에게 이식 거부반응을 예방하기 위한 약물을 선택하려고 한다. 다음 면역억\n제제 중 T 세포 기능을 억제하는 약물은?","choices":["Azathioprine","Mercaptopurine","Methotrexate","Prednisone","Tacrolimus"],"answer":5,"answerLabel":"⑤","answerPage":322,"explanation":"T 세포의 신호 전달 과정을 억제하는 면역억제제는\ncyclosporin, tacrolimusフト 여기에 속한다."},{"id":"c03-q077","chapterId":3,"number":77,"page":69,"stem":"35세 남자가 고환암으로 항암제를 투여 받던 중 적혈구 백혈구, 혈소판 수가 감소하기 시\n작하였다. 이 환자에게 사용했을 것 같은 항암제는?","choices":["Etoposide","Cisplatine","Daunomycin","Methotrexate","Cyclophosphamide"],"answer":2,"answerLabel":"②","answerPage":322,"explanation":"Cisplatine은 알킬화제이며 이 분류의 약물들의 심각한\n유해반응은 골수억제이다. 골수억제의 징후로 투여 후 적혈구,\n백혈구, 혈소판 수가 감소한다."},{"id":"c03-q078","chapterId":3,"number":78,"page":70,"stem":"50세 여자가 신장이식 수술 후 사이클로스포린(cy이osporine)으로 이식 거부반응을 조절\n하던 중 폐결핵이 발병하여 항결핵약을 복용하였다. 결핵 치료 7일 후부터 고열과 함께\n몸이 부었고, 혈액검사에서 크레아틴이 증가하는 이식 거부반응이 관찰되었다. 거부반응\n의 원인이 되는 항결핵 약물은?","choices":["Rifampin","Isoniazid","Ethambutol","Streptomycin","Pyrazinamide"],"answer":1,"answerLabel":"①","answerPage":322,"explanation":"간과 신장독성이 특징적으로 나타나는 항결핵 약물은\nrifampin 이다."},{"id":"c03-q079","chapterId":3,"number":79,"page":70,"stem":"항균화학요법제를 병용 투여하는 경우, 길항작용이 나타날 수 있는 조합은?","choices":["Piperacillin - Tazobactam","Sulfamethoxazole - Trimethoprim","Ampicillin - Gentamicin","Amoxicillin - Tetracycline","Vancomycin - Tobramycin"],"answer":4,"answerLabel":"④","answerPage":322,"explanation":"일반적으로 정균제와 살균제를 병용할 때 길항작용이\n나타날 수 있다 대표적 예로, penicillin은 세균 증식이\n왕성할 때 세포벽 합성을 억제하여 살균 작용을 일으키는\n항생제로, tetracycline과 같이 세균의 단백 합성 및 성장을\n억제하는 정균제와 병용하면 penicillin의 살균 효과가 잘\n나타나지 않을 수 있다."},{"id":"c03-q080","chapterId":3,"number":80,"page":70,"stem":"임신부가 녹농균(pseudomonas aeruginosa) 요로감염이 의심되어 겐타마이신(gentamycin)\n으로 치료할 경우 태아에게 나타날 수 있는 부작용은?","choices":["기형","청각손상","성장지연","골격변형","시력상실"],"answer":2,"answerLabel":"②","answerPage":322,"explanation":"Gentamycin이 포함된 amino이ycoside계 약물의\n대표적인 부작용 두 가지는 이독성과 신독성이다."},{"id":"c03-q081","chapterId":3,"number":81,"page":70,"stem":"다음 항균제 중 성장 연골을 손상시켜 관절병증을 일으킬 수 있어서 18세 이하에게는 사\n용을 제한하고 있는 것은?","choices":["Aztreonam","Chloramphenicol","Ciprofloxacine","Clarithromycin","Vancomycin"],"answer":3,"answerLabel":"③","answerPage":322,"explanation":"Ciprofloxacine은 어린아이에서 연골을 손상시켜 18\n세 이하의 어린이에게는 승인되지 않는다."},{"id":"c03-q082","chapterId":3,"number":82,"page":70,"stem":"융모막암종 진단을 받은 환자에게 methotrexateOl 투여되었다. 이 약물의 작용기전은?","choices":["엽산합성을 방해한다.","에스트로겐수용체를 차단한다.","DNA 의 이중나선 모양을 변형한다.","핵산합성을 억제한다.","호르몬 의존 종양의 성장을 늦춘다."],"answer":1,"answerLabel":"①","answerPage":322,"explanation":"Methotrexate는 엽산합성을 방해한다."},{"id":"c03-q083","chapterId":3,"number":83,"page":71,"stem":"응급실에 내원한 70세 급성심부전 환자에게 즉각적으로 투여될 것으로 예상되는 약물은?","choices":["Albuterol","Epinephrine","Dobutamine","Phenylephrine","Norepinephrine"],"answer":3,"answerLabel":"③","answerPage":322,"explanation":"Dobutamine은 심박동수 증가 없이 심박출량을\n증가시킨다. Epinephrine은 심박동수를 현저하게\n증가시키므로 급성 심부전에는 통상적으로 사용하지 않는다.\nAlbuter이는 02작용제로 심장수축력 개선에 작용하지\n않는다. Phenylephrine, norepinephrine는 cd 작용제로\n혈압상승을 유발하고 이는 심부전의 악화요인이다."},{"id":"c03-q084","chapterId":3,"number":84,"page":71,"stem":"고혈압을 앓고 있는 40세 남자가 의사로부터 aten이이를 처방받았다. 간호사가 관심을 가\n져야 할 환자의 과거력은?","choices":["천식","변비","소화성 궤양","전립성 비대","과민성 대장염"],"answer":1,"answerLabel":"①","answerPage":322,"explanation":"Aten이이은 선택적 国차단제이다. 비선택적。차단제는\n기관지 수축을 유도할 수 있어 천신과 호흡계 관련 질환이\n있는 환자에게는 선택적 R 차단제를 투여해야 한다."},{"id":"c03-q085","chapterId":3,"number":85,"page":71,"stem":"환자가 magnesium hydroxide (Mylanta)B 투여 받을 때 간호사가 사정해야 할 것은?","choices":["설사","변비","신경병증","복부팽만","호흡관련 질환"],"answer":1,"answerLabel":"①","answerPage":322,"explanation":"Magnesium hydroxide(Mylanta)는 유해반응을\n설사, 오심, 구토, 위경련, 고마그네슘 혈증을 유발할 수\n있다."},{"id":"c03-q086","chapterId":3,"number":86,"page":71,"stem":"Omepraz이e을 복용 중인 환자에게 간호사가 교육해야 할 중요한 내용은?","choices":["이 약물은 장기간 사용해야 한다.","이 약물은 2개월 이상 사용하면 안 된다.","효과가 나타나려면 몇 주가 걸릴 수 있다.","제산제를 같이 복용하면 효과가 상승한다.","주로 취침 전에 투여해야 한다."],"answer":2,"answerLabel":"②","answerPage":322,"explanation":"〇meprazole은 소화성 궤양과 위식도 역류에 대한\n단기 치료에서 4~8주간 사용된다. 장기간 사용될 때 위암\n발병의 증가와 관련이 있는 것으로 나타나 2개월간으로\n제한되는 경우가 많다."},{"id":"c03-q087","chapterId":3,"number":87,"page":71,"stem":"소화성 궤양 치료를 위해 ranitidine 亿antae)을 복용 중인 환자에게 간호사가 교육해야\n할 사항은?","choices":["중추신경계 억제의 징후와 증상은 보고하도록 한다.","약물 치료는 몇 주에서 몇 달까지 걸릴 수 있다.","약물 치료는 며칠밖에 걸리지 않는다.","간질환의 징후와 증상에 대해 정보를 제공한다.","약물상승효과를 위해 제산제와 함께 복용하도록 한다."],"answer":2,"answerLabel":"②","answerPage":322,"explanation":"Ranitidine은 궤양 치유를 위해 약 4주에서 8주\n소요되지만 더 장기간의 치료가 필요하다. Ranitidine은\n유해반응이 드물고 혈액-뇌장벽을 통과하지 않아 중추신경계\n억제효과가 나타나지 않는다. 제산제 복용이 흡수를\n방해하므로 함께 복용하지 않는다."},{"id":"c03-q088","chapterId":3,"number":88,"page":72,"stem":"54세 여자가 고지혈증 치료를 위해 lovastatine을 처방받았다 가장 효과적인 투여 시간\n은?","choices":["아침","저녁","다른 약물과 함께","공복","식후 30분"],"answer":2,"answerLabel":"②","answerPage":322,"explanation":"스타틴류는 경구로 투여하며 저녁에 복용해야 한다.\n그 이유는 콜레스테롤 생합성이 밤에 더 활발하기 때문이다."},{"id":"c03-q089","chapterId":3,"number":89,"page":72,"stem":"알레르기 비염 환자에게 oxymetaz이ine이 처방되었다. 간호사가 환자에게 교육해야 할\n사항은?","choices":["고혈압이 나타나는지 확인한다.","반동성 충혈을 방지하기 위하여 3〜5일 넘게 사용하지 않는다.","긴장이 나타나는지 확인한다.","다른 약물과 병용하지 않도록 한다.","카페인이 함유된 식품은 먹지 않는다"],"answer":2,"answerLabel":"②","answerPage":322,"explanation":"Oxymetazoline는 비강 내 분무와 점적투여로 수분\n내 효과를 얻을 수 있다. 비강 내 교삼신경흥분제의 투여는\n순환계에 거의 흡수되지 않으므로 전신적인 유해반응이\n나타나지 않는다. 가장 심한 유해반응으로 반동성 충혈을\n들 수 있다. 그래서 3~5일 이상 사용해서는 안 된다."},{"id":"c03-q090","chapterId":3,"number":90,"page":72,"stem":"Cyclosphosphamide를 투여 받는 환자에게 교육해야 할 사항은?","choices":["탈모증은 회복할 수 없음","신경독성 징후와 증상","신장독성 징후와 증상","오심, 구토, 설사가 치료 1 〜2일 후에 일어날 수 있음","발열, 오한 현기증이 나타날 수 있음"],"answer":4,"answerLabel":"④","answerPage":322,"explanation":"Cyclosphosphamide는 대표적인 알킬화제\n항종양약물이며 , 가장 심각한 유해반응은 골수억제이며\n투여 후 며칠 내에 적혈구, 백혈구, 혈소판이 감소하며\n위장관계 상피세포도 손상을 받아 메스꺼움, 구토, 설사를\n유발한다. 탈모증은 가역적으로 대부분 회복된다."},{"id":"c03-q091","chapterId":3,"number":91,"page":72,"stem":"결핵 환자가 isonia기de (INH)를 처방받았다 치료기간 동안 한 달에 한 번 해야 할 검사는?","choices":["간 효소","PT","CBC","BUN","칼륨 농도"],"answer":1,"answerLabel":"①","answerPage":322,"explanation":"Isonia기de(iNH)의 가장 흔한 유해반응은 손발의\n무감각, 발진, 발열이다. 드물지만 심각한 유해반응으로\n간독성이 있다. 따라서 의료인은 황달, 피로, 간 효소 수치\n상승, 식욕상실 등의 징후에 유의해야 한다. 치료기간 동안\n간독성을 일찍 발견하기 위해 주로 한 달에 한 번 간 효소\n검사를 한다.\n정답및배설 I 322"},{"id":"c03-q092","chapterId":3,"number":92,"page":72,"stem":"9세 미만의 아동에게 tetracycline 항생제를 투여하지 않아야 하는 이유는?","choices":["광선과민증이 발생할 수 있으므로","중복감염이 일어날 수 있으므로","치아가 변색할 수 있으므로","혈소판 수치가 감소되므로","구토를 유발할 수 있으므로"],"answer":3,"answerLabel":"③","answerPage":323,"explanation":"Tetracy이ine은 9세 이하의 환자에게는 치아가\n영구적으로 황갈색으로 변색되므로, 생명을 위협하는 감염이\n없다면 투여하지 않는다."},{"id":"c03-q093","chapterId":3,"number":93,"page":73,"stem":"이식을 받은 환자에게 cyclosporine> 처방하였다. 치료기간 동안 주요한 유해반응을 사\n정하기 위해 주기적으로 필요한 검사는?","choices":["혈청크레아틴","간 효소","CBC","PT","전해질"],"answer":3,"answerLabel":"③","answerPage":323,"explanation":"Cyclosporines 치료하는 동안 기회감염이 흔히\n발생한다. 백혈구수가 4000, 혈소판수가 75000이 되는지\n정기적으로 검사해야 한다."},{"id":"c03-q094","chapterId":3,"number":94,"page":73,"stem":"다음 중 저혈량 쇼크 상태인 환자에게 가장 적절한 정맥주사 용액은?","choices":["0.45% 생리식염수","0.33% 생리식염수","정상 혈청 알부민","5% 포도당 용액","Dextran"],"answer":3,"answerLabel":"③","answerPage":323,"explanation":"정상 혈청 알부민은 전혈이나 혈장에서 추출한\n단백질이다. 정맥으로 투여하는 알부민은 저혈량성 쇼크에서\n혈장 양을 회복하거나 저단백혈증 환자의 혈중단백질을\n회복하는 데 사용된다."},{"id":"c03-q095","chapterId":3,"number":95,"page":73,"stem":"45세 남자가 흉통을 호소하여 응급실에 내원하였다. 검사 결과 급성 심근경색증 소견이\n보여 바로 reteplases를 투여하였다. 이때 간호사가 주의 깊게 사정해야 할 것은?","choices":["구토","설사","혈압 상승","심박수 증가","비정상적 출혈"],"answer":4,"answerLabel":"④","answerPage":323,"explanation":"Reteplases는 심근경색 증상이 나타난 지 30분\n이내에 투여했을 때 가장 효과적이며, 12시간보다 늦지\n않도록 한다. 의료인은 혈전용해제 치료 중 비정상적 출혈이\n있는지 사정해야 한다."},{"id":"c03-q096","chapterId":3,"number":96,"page":73,"stem":"정맥 내 heparin을 투여 중인 환자에게 warfarin (Coumadin)0| 처방되어 투여가 시작되\n었다 두 약물을 중복해서 투여하는 이유는?","choices":["약물상호작용으로 효과를 증가시키기 위해","Heparin의 용량을 감소시키기 위해","Warfarin은 효과가 나타나려면 며칠이 걸리므로","Eparin은 저분자량이어서 작용시간이 짧으므로","Warfarin이 heparin보다 효과적이므로"],"answer":3,"answerLabel":"③","answerPage":323,"explanation":"Warfarin은 최대 항응고효과에 달하기까지 며칠이\n걸린다. 이 때문에 heparin에서 warfarin으로 전환할\n때는 두 약물을 중복투여 한다."},{"id":"c03-q097","chapterId":3,"number":97,"page":73,"stem":"고혈압 치료에도 사용되는 항부정맥 약물은?","choices":["Digoxin","Dlitiazem","Adenosine","Quinidine","Amiodarone"],"answer":2,"answerLabel":"②","answerPage":323,"explanation":"Dlitiazem은 칼륨통로차단제로 고혈압 치료에 사용된다."},{"id":"c03-q098","chapterId":3,"number":98,"page":74,"stem":"Nitroglycerin의 가장 흔한 유해반응은?","choices":["고혈압","이뇨","두통","서맥","설사"],"answer":3,"answerLabel":"③","answerPage":323,"explanation":"Nitroglycerin은 뇌혈관을 확장시킬 수 있기 때문에\n두통이 흔한 유해반응이며 심할 수도 있다."},{"id":"c03-q099","chapterId":3,"number":99,"page":74,"stem":"심부전 환자에게 digoxin과 furosemide (Lasix)フト 처방되었匚卜. 다음 중 간호사가 가장 주\n의 깊게 살펴야 할 전해질은?","choices":["칼슘","포타슘","소디음","마그네슘","크레아티닌"],"answer":2,"answerLabel":"②","answerPage":323,"explanation":"Furosemide (Lasix)는 저칼륨혈증을 유발할 수\n있으며, 저칼륨혈증 시 digoxin의 유해반응이 나타날 수\n있으므로 칼륨농도를 주의 깊게 확인해야 한다."},{"id":"c03-q100","chapterId":3,"number":100,"page":74,"stem":"심부전 환자에게 정맥 내 투여하는 milrinone이 투여되었다. 간호사가 사정해야 할\nmilrinone의 유해반응은?","choices":["두통","혼란","졸음","서맥","부정맥"],"answer":5,"answerLabel":"⑤","answerPage":323,"explanation":"Milrinone의 심각한 유해반응은 심실부정맥이다.\n환자의 심전도를 약물 투입 중에 지속적으로 모니터해야\n한다."}]},{"id":4,"part":"PART I","partTitle":"공통영역","title":"계통별 신체검진법","count":100,"startPage":75,"endPage":98,"questions":[{"id":"c04-q001","chapterId":4,"number":1,"page":75,"stem":"환자의 오른쪽에서 심음을 청진할 때, 흡기 중에 더 잘 들리는 심음은?","choices":["s,","S 2 split","s2","S3","S,"],"answer":4,"answerLabel":"④","answerPage":324,"explanation":"S 3 제3음: 심실의 확장기의 시초에 심방에서 유입하는\n혈액 때문에 심실벽이 진동하는 것과 이첨판의 진동 때문에\n생기는 음으로(rapid ventricular filling 시) 저음이고 소리의\n지속이 짧기 때문에 청취하기 힘들다. 오른쪽 S3은 흡기\n시에 증가하며 왼쪽 S3은 호기 시에 증가하는 양상을 보인다."},{"id":"c04-q002","chapterId":4,"number":2,"page":75,"stem":"신체검진 중 환자의 오른쪽보다 왼쪽 손의 온도가 더 낮게 촉진되었을 때, 다음 중 대상\n자에게 우선적으로 수행해야 하는 것은?","choices":["양측 요골동맥의 맥박을 측정한다.","양손에서 Allen 검사를 실시한다.","손등으로 전박의 온도를 측정한다.","양측 족배동맥의 맥박을 측정한다.","측정하려는 손을 지지한 상태에서 재검사를 실시한다."],"answer":3,"answerLabel":"③","answerPage":324,"explanation":"우선적으로 손의냉기가 다른 부위로 확장되는지 확인하는\n것이 필요하며 , 그 이후에 맥박을 측정하는 것이 적절하다."},{"id":"c04-q003","chapterId":4,"number":3,"page":75,"stem":"류마티스열을 앓은 적이 있는 대상자의 심음을 청진하고자 할 때, 가장 적절한 위치는?","choices":["왼쪽 흉골 경계의 네 번째 늑간","왼쪽 쇄골중간선상의 다섯 번째 늑간","왼쪽 흉골 경계의 두 번째 늑간","왼쪽 흉골 경계의 세 번째 늑간","오른쪽 흉골 경계의 두 번째 늑간"],"answer":2,"answerLabel":"②","answerPage":324,"explanation":"승모판협착증의 가장 흔한 원인(40%)은 류마티스열이다.\n승모판음을 청진하기 적절한 위치는 왼쪽 쇄골중간선상의\n제5늑간이다. 증상은 제 1 심음은 대개 증가되고, 약간\n지연되며, 마차가구르는듯한이완기 심잡음을 들을수 있다."},{"id":"c04-q004","chapterId":4,"number":4,"page":76,"stem":"심방부정맥이 있는 환자의 신체검진 시 맥박은 no회/분이었으며 맥박결손으로 불규칙적\n인 양상을 보였다. 환자의 맥박결손을 확인하기 위해 필요한 검사는?","choices":["P-R 간격의 길이를 확인하기 위해 12유도 심전도를 실시한다.","심첨맥박과 요골동맥 맥박을 차례로 확인하여 두 지점의 맥박수의 차이가 있는지 확인한다","심첨맥박을 확인한 후 호흡에 따라 변화하는지 확인한다.","심첨맥박과 요골동맥 맥박을 동시에 확인하여 심첨맥박이 더 빠른지 확인한다.","P파의 결손을 확인하기 위해 12유도 심전도를 실시한다."],"answer":2,"answerLabel":"②","answerPage":324,"explanation":"심첨맥박 후 요골맥박이 존재해야 하므로, 심첨맥박을\n확인한 후 요골동맥 맥박을 확인하여 그 차이가 벌어지는\n경우 맥박결손이라고 판단한다."},{"id":"c04-q005","chapterId":4,"number":5,"page":76,"stem":"80세 남자가 심부전으로 퇴원한 후 정기적인 추적관찰을 위해 내원하였다. 신체검진 시\n폐기저부에서 미세한 수포음이 들리고, 혈압 170/90 mmHg, 심박수 80회/분으로 규칙적\n이며, 왼쪽 흉골 경계에서 S3가 들린다. 이 환자의 S3에 대한 설명으로 옳은 것은?","choices":["정상 소견","심근 경색","울혈성 심부전","감염성 심내막염","심낭염"],"answer":3,"answerLabel":"③","answerPage":324,"explanation":"이 고령의 환자에서 S3는 정상소견이 아니다. 좌심실\n및 우심실 부전시 제3심음이 청진 가능하다. 심근경색\n시에는 부정맥이 있고, 심음이 잘 들리지 않으며, 초기\n감염성 심내막염의 경우 심음은 정상적이다. 심낭염 시\n심낭마찰음이 청진 가능하다."},{"id":"c04-q006","chapterId":4,"number":6,"page":76,"stem":"대동맥협착(aortic stenosis) 시 잡음이 방사되는 곳은?","choices":["심첨부위","오른쪽 흉골 경계","왼쪽 액와","승모판막","경동맥"],"answer":5,"answerLabel":"⑤","answerPage":324,"explanation":"퇴행성 대동므q 협착은 노인에서 흔한 질환으로, 이는\n대동맥 판막의 비후와 강직으로 발생하기 때문에 심장 내\n압력이 점차 증가할수록 심잡음의 강도가 커지며 경동맥으로\n방사된다."},{"id":"c04-q007","chapterId":4,"number":7,"page":76,"stem":"대동맥협착이 의심되는 환자가 내원하였다. 다음 중 이 환자에게 의심되는 질환과 관련된\n증상으로 가능성이 적은 것은?","choices":["부종","실신","협심통","호흡곤란","발작성 야간 호흡곤란 및 기좌호흡"],"answer":1,"answerLabel":"①","answerPage":324,"explanation":"대동맥협착의 주요 증상은 실신, 협심통, 호흡곤란,\n심부전 증상으로 부종은 일반적인 증상이 아니다."},{"id":"c04-q008","chapterId":4,"number":8,"page":77,"stem":"60세 남자가 중중의 대동맥협착(severe aortic stenosis)으로 대동맥판막술(aortic valve\nreplacement)을 받기 위해 내원하였다. 심장도관술 시 관상동맥은 정상으로 확인되었으\n며, 문진 시 흉통을 수차례 경험한 적이 있다고 하였다. 이 환자의 신체검진 시 청진 가능\n한 잡음은?","choices":["왼쪽 흉골경계에서 들리는 수축기말 잡음(late systolic murmur)","왼쪽 흉골경계에서 들리고 액와로 방사되는 범수축기 잡음(holosystolic murmur)","왼쪽 흉골경계에서 들리는 확장기말 잡음(late diastolic murmur)","오른쪽 두 번째 늑간에서 들리고 액와로 방사되는 수축전기 잡음(presystolic murmur)","오른쪽 두 번째 늑간에서 들리고 목으로 방사되는 다이아몬드 형태의 수축기 잡음 (diamond-shaped systolic murmur)"],"answer":5,"answerLabel":"⑤","answerPage":324,"explanation":"일반적인 대동맥협착에서 청진 가능한 잡음은 강해졌다가\n약해지는 잡음(crescendo-decrescendo murmur)으로\n다이아몬드유형을 가지며, 오른쪽두 번째 늑간에서 청진이\n가능하며, 목이나 심첨으로 방사되기도 한다."},{"id":"c04-q009","chapterId":4,"number":9,"page":77,"stem":"승모판탈출증(mitr게 V기ve prolapse) 환자에서 가장 흔하게 관찰되는 소견은?","choices":["확장기말 잡음","확장전기 잡음","확장기 클릭 (diastolic click)","수축기말 잡음","수축전기 잡음"],"answer":4,"answerLabel":"④","answerPage":324,"explanation":"승모판탈출증 환자에서는 보통 수축기 클릭과 수축기말\n잡음이 청진된다."},{"id":"c04-q010","chapterId":4,"number":10,"page":77,"stem":"62세 남자가 20분간 지속된 가벼운 두통과 피로를 주호소로 내원하였다. 2주 전에도 비\n슷한 증상을 경험한 적이 있어서 약간 불안하다고 한다. 활력징후는 체온 36.5℃, 심박수\n50회/분, 호흡수 18회/분, 혈압 100/80 mmHg이었다. 호흡음은 깨끗했으며, ECG 상 P\n파는 분리되지 않았으며 350회/분 이상의 불규칙한 심방활동이 확인되었다. 심실박동\n(ventricular rate)은 불규칙하였으나 비정상적인 박동은 관찰되지 않았다. 이 환자의 임상\n소견은?","choices":["심방조동(atrial flutter)","심방세동(atrial fibrillation)","심실조동(atrial flutter)","심실세동(atrial fibrillation)","심실전위(ventricular ectopy)"],"answer":2,"answerLabel":"②","answerPage":324,"explanation":"심방세동은 심방박동이 350회/분 이상으로 수를 세기가\n어려우며, P파는 구분하기 어렵다."},{"id":"c04-q011","chapterId":4,"number":11,"page":77,"stem":"64세 남자가 30분간 지속되는 흉골하부의 흉통을 주호소로 내원하였다. 흉통과 함께 오\n심, 발한이 있었고, 과거에 협심증으로 NTG 를 복용한 적이 있으며, 흡연력은 30갑？년이\n라고 한다. 내원전 NTG 3알을 섭취하였지만 흉통이 완화되지 않았으며, 신체검진 시 심\n박수 80회得, 호흡 30회座, 혈압 104/60 mmHg이다. 심전도검사 시 II, HI과 aVF 유도에\n서 ST 분절의 상승이 확인되었을 때, 손상이 의심되는 심장 부위는?","choices":["전방(anterior)","왼쪽 측방(left lateral)","오른쪽 측방(rightt lateral)","후방(posterior)","하방(inferior)"],"answer":5,"answerLabel":"⑤","answerPage":324,"explanation":"Lead II, III과 aVF 는 Lead의 아래쪽을 의미하는\n것으로 심장 하방에 문제가 있음을 의미한다. 하벽 심근경색\n(inferior wall myocardial infarction)은 종종 오심을 동반한다."},{"id":"c04-q012","chapterId":4,"number":12,"page":78,"stem":"승모판협착의 가장 일반적인 원인은?","choices":["심내막염","선천적 첨판(leaflet) 결손","류마티스열","성홍열","고혈압"],"answer":3,"answerLabel":"③","answerPage":324,"explanation":"승모판협착증의가장 흔한원인은류마티스열이며,\n이는 승모판을 융합시켜 영향을 미친다."},{"id":"c04-q013","chapterId":4,"number":13,"page":78,"stem":"40세 여자가 심방중격결손증으로 내원하였다. 이 환자의 신체검진 시 예상되는 결과는?","choices":["불규칙적인 S,","규칙적인 S 2","규칙적인 S3","규칙적인 s4","일정한 S 2 split(S2 분열음)"],"answer":4,"answerLabel":"④","answerPage":324,"explanation":"심방중격결손증의 경우 일정한 S? 분열음이 청진된다."},{"id":"c04-q014","chapterId":4,"number":14,"page":78,"stem":"30세 여자가 8주간의 열, 오한, 기침을 주호소로 내원하였다 환자는 20세 때 심잡음이\n있다는 이야기를 들은 적이 있으나 그 외 특별한 문제없이 지냈다고 한다. 마른 체형으로,\n내원 시 활력징후는 체온 37.8℃, 므胆卜 110회席 혈압 100/40 mmHg이었다. 신체검진 시\n왼쪽 흉골경계에서 정상적인 も과 함께 IIA/1의 확장기 잡음, 미세한 수포음이 청진되었으\n며, 간과 비장은 촉진되지 않았고, 양 팔에 점상출혈(Petechiae)이 있다. 가장 의심되는\n질환은?","choices":["울혈성 심부전","폐렴","심내막염","심낭염","결핵"],"answer":3,"answerLabel":"③","answerPage":324,"explanation":"이는 심내막염(endocarditis)의 증상이다. 8주 이상\n지속되는 고열, 오한, 권태감은 감염의 과정에 따른 것이며,\n확장기 잡음과 고열을 동반하는 점상출혈은 심내막염의 주요\n증상이다."},{"id":"c04-q015","chapterId":4,"number":15,"page":78,"stem":"70세 남자가 4일 전 심근경색증을 진단 받았다. 환자는 현재 호흡곤란이 있고 산소를 투\n여하지 않은 상태에서 산소포화도 85%, 혈압 80/60 mmHg, 심박수 120회/분으로 CCU\n에 입원할 예정이다. 신체검진 시 왼쪽 흉골경계에서 액와로 방사되는 범수축기 잡음\n(h이。syst이ic murmur)이 새로 청진되었을 때, 가장 의심되는 질환은?","choices":["연장된 심근경색증","폐색전증","급성호흡곤란증후군","급성 심실중격결손","대동맥박리"],"answer":4,"answerLabel":"④","answerPage":324,"explanation":"새로운 범수축기 잡음(holosystolic murmur)과 저혈압\n소견에서 급성 심실중격 결손을 추정할 수 있다."},{"id":"c04-q016","chapterId":4,"number":16,"page":79,"stem":"호흡음 청진 시 부드럽고, 낮은 음조의 호흡음으로 흡기 시 잘 청진이 되는 것은?","choices":["기관음","기관지음","기관지폐포음","폐포음","건성수포음"],"answer":4,"answerLabel":"④","answerPage":324,"explanation":"폐포음은 폐 전반에서 청진되며 호기보다 흡기 시 더\n잘들리고, 저음의 부드러운 호흡음이다. 기관지음(bronchial\nsound)은 고음의 큰 소리이며, 기관지-폐포음(bronch\novesicular sound)은 중간음으로 흡기와 호기 시의 길이가\n동일하다. 건성수포음은 비정상적인 호흡음으로 저음의\n코고는 소리이다."},{"id":"c04-q017","chapterId":4,"number":17,"page":79,"stem":"폐조직의 경화를 확인하기 위해 환자에게 “이라고 소리 내게 하면서 청진 했을 때 “아\n이~”라고 들렸다. 이는 무엇인가?","choices":["촉각진동감(Tactile fremitus)","기관지폐포음(Bronchovesicular breath sound)","염소울음소리 (Egophony)","속삭임가슴소리(Whispered pectoriolquy)","기관ス］ 소리 (Bronchophony)"],"answer":3,"answerLabel":"③","answerPage":324,"explanation":"이 검사법 및 결과는 염소울음소리를 의미한다. 촉각\n진동감은 대상자가 소리를 낼 때 흉벽의 진동을 촉각으로\n확인하는 것이며, 기관지 소리는 크고 명료하게 청진되는\n성대공명음이다. 속삭임가슴소리는 대상자가 ‘하나, 하나\n를 말할 때 청진기를 통해 확인되는 소리이다."},{"id":"c04-q018","chapterId":4,"number":18,"page":79,"stem":"폐활량기(spirometry)로 측정되지 않는 폐기능 항목은?","choices":["노력성폐활량(forced vital capacity； FVC)","강제호기량(forced expiratory volume at 1 second； FEV)","동맥혈산소포화도","강제중간호기량(forced mid-expiatory flow； FEF 25〜75%)","일회 호흡량(tidal volume； TV)"],"answer":3,"answerLabel":"③","answerPage":324,"explanation":"폐활량기(spirometry)로는 동맥혈산소포화도를 제외한\n폐기능을 측정할 수 있다."},{"id":"c04-q019","chapterId":4,"number":19,"page":79,"stem":"폐를 타진한 결과 과다공명음이 확인되었다. 이에 대한 설명으로 옳은 것은?","choices":["성인에서 정상적으로 확인된다.","아동에서는 흔한 소견이다.","부드럽고 높은 음조로 짧고, 둔한 소리를 가진다.","크고 높은 음조로 중간정도로 길고, 둔한 소리를 가진다.","매우 크고 낮음 음조로 길고, 정상보다 높은 공명음을 가진다."],"answer":2,"answerLabel":"②","answerPage":324,"explanation":"과다공명음은 성인에서 비정상적인 소견이지만 아동\n에서는 흔히 발견된다. 이는 매우 크고 높은 음조로 길며,\n정상보다 높은 공명음을 가진다."},{"id":"c04-q020","chapterId":4,"number":20,"page":79,"stem":"FEM 대 FVC (강제 폐활량) 비율이 낮을 경우, 가장 가능성이 높은 질환은?","choices":["정상 폐기능","제한성 폐질환","천식","폐쇄성 폐질환","결핵"],"answer":4,"answerLabel":"④","answerPage":324,"explanation":"FEV, 대 FVC (강제 폐활량) 비율이 낮을 경우, 가장 진단\n가능성이 높은 질환은 폐쇄성 폐질환이다."},{"id":"c04-q021","chapterId":4,"number":21,"page":80,"stem":"인간면역결핍바이러스(human immunodeficiency virus； HIV)를 진단받은 환자에게 PPD\n검사를 수행하였다. 양성판단의 기준은?","choices":["5 mm 이상","20 mm 이상","10 mm 이상","15 mm 이상","12 mm 이상"],"answer":1,"answerLabel":"①","answerPage":324,"explanation":"HIV 환자는 5 mm 이상일 경우, 고위험은 10 mm\n이상일 경우, 정상인은 15 mm 이상일 경우에 PPD 검사의\n양성으로 판단한다."},{"id":"c04-q022","chapterId":4,"number":22,"page":80,"stem":"다음 중 초기 단계의 특발성 폐섬유화증(idiopathic pulmonary fibrosis) 환자에서 관찰\n가능한 비정상 소견은?","choices":["폐용적 감소","정상적인 일상생활","FEV/FVC 비율의 감소","정상 확산능력","호기성 수포음"],"answer":1,"answerLabel":"①","answerPage":324,"explanation":"초기 단계의 특발성 폐섬유화증의 대표적인 소견은\n폐용적의 감소이다. 질병이 진행하면 운동 시 더 심해지는\n저산소혈증 및 폐색성 폐기능 검사소견이 확인된다."},{"id":"c04-q023","chapterId":4,"number":23,"page":80,"stem":"35세 여자가 취업을 위해 신체검진을 받기 위해 내원하였다. 검진 시 양손의 곤봉형 손톱\n이 관찰되었고, 과거 심혈관계나 호흡기계 질환은 없다고 한다. 추가로 필요한 검사는?","choices":["심장초음파","전혈구혈액검사","단순흉부촬영","간기능검사","류마티스 요인 혈액검사"],"answer":3,"answerLabel":"③","answerPage":324,"explanation":"무증상의 호흡기계 이상을 확인하기 위해 단순흉부촬영을\n실시한다."},{"id":"c04-q024","chapterId":4,"number":24,"page":80,"stem":"65세 남자가 고열, 가슴 울혈(chest congestion), 권태감 및 부패성 객담(putrid sputum)\n을 주호소로 내원하였다. 가장 가능성이 높은 질환은?","choices":["폐부종","천식","폐농양","결핵","기관지염"],"answer":4,"answerLabel":"④","answerPage":324,"explanation":"이는 폐농양의 증상 및징후이다."},{"id":"c04-q025","chapterId":4,"number":25,"page":80,"stem":"신체검진 시 빈호흡과 경정맥 팽창이 있고 심방성 주마음(Atri게 g시lop 또는 Sj과 염소\n울음소리(Egophony)가 청진된 환자에서 가장 가능성이 높은 질환은?","choices":["경화된 폐렴","만성폐쇄성폐질환(COPD)","흉막 삼출(Pleural effusion)","천식","울혈성 심부전"],"answer":3,"answerLabel":"③","answerPage":325,"explanation":"흉막삼출 환자의 신체검진 시 경정맥 팽창, 심실성\n주마음 빈호흡 및 염소울음소리(egophony)를 확인할 수\n있다."},{"id":"c04-q026","chapterId":4,"number":26,"page":81,"stem":"45세 여자가 경화된 폐렴을 진단받았다. 이 환자의 신체검진 시 예상되는 소견은?","choices":["감소된 촉각진동감(tactile fremitus)","폐포음(vestic니air breath sounds)","둔탁음(dullness)","과다공명음(hypewsonance)","속삭임7]•슴소리(whispered pectoriolq니y)"],"answer":3,"answerLabel":"③","answerPage":325,"explanation":"경화된 폐렴(pneumonia with consolidation) 환자에서는\n촉각진동감 증가, 둔탁음, 기관지성 호흡음(bronchial breath\nsounds)dmf 확인할 수 있다."},{"id":"c04-q027","chapterId":4,"number":27,"page":81,"stem":"35세 여자가 하루 동안 지속된 오른쪽 흉막 부위의 갑작스러운 흉통과 호흡곤란을 주호\n소로 내원하였다. 평소 건강에는 문제가 없었으며, 복용하는 약물은 없고, 매달 정기적으\n로 월경을 한다고 한다. 이 환자에게 가장 의심되는 질환은?","choices":["폐색전증","흉막염","폐렴","자발성 기흉","혈흉"],"answer":4,"answerLabel":"④","answerPage":325,"explanation":"자발성 기흉은 갑작스러운 흉통과 호흡곤란을 동반하며 ,\n증상은 보통 휴식 시 나타나 24시간 이내에 완화된다."},{"id":"c04-q028","chapterId":4,"number":28,"page":81,"stem":"기이哪pulsus paradoxus)0| 흔히 관찰되는 질환은?","choices":["천식","폐기종","폐색전","폐렴","기흉"],"answer":1,"answerLabel":"①","answerPage":325,"explanation":"맥박은 빠르며 심한 기도폐쇄 때문에 흉곽내압 진폭\n과대로 인한 흡기 시 혈압의 증가된 하강(〉10 mmHg)이 있는\n현상인 기이맥(pulsus paradoxus)은 천식과 밀접한 관련이\n있다."},{"id":"c04-q029","chapterId":4,"number":29,"page":81,"stem":"폐기종이 있는 환자의 특징적인 신체검진 소견은?","choices":["입술을 오므린 호흡 및 삼각대 자세","흉통 및 차고 축축한 피부","기이한 흉부움직임 및 기도 이탈","기침, 점액 분비 증가, 수포음","촉각진동감 감소, 호흡음 소실"],"answer":1,"answerLabel":"①","answerPage":325,"explanation":"폐가종 환자는 체중감소, 술통형 흉곽으로 조금만 움직여도\n쉽게 숨이 찬다. 환자가 숨이 차면 입술을 오므리고 숨을 쉬며,\n삼각대 자세를 자주 취한다."},{"id":"c04-q030","chapterId":4,"number":30,"page":81,"stem":"폐색전증으로 인한 폐경색이 있는 환자에게서 볼 수 있는 가장 흔한 증상은?","choices":["객혈","기침","흉막 통증","호흡곤란","고열"],"answer":1,"answerLabel":"①","answerPage":325,"explanation":"폐색전증으로 인한 폐경색의 가장흔한 증상은 객혈이다."},{"id":"c04-q031","chapterId":4,"number":31,"page":82,"stem":"노인 환자에게 감각신경계 기능을 확인하기 위해 입체감각인식(stereognosis)을 검진하\n고자 한다. 적절한 검진법은?","choices":["환자의 검지로 검진자의 검지와 환자의 코를 빠르게 반복적으로 짚어보게 한다.","눈을 감은 상태에서 손 위에 올려놓은 동전과 열쇠를 촉각으로 확인하게 한다","발꿈치를 붙인 상태에서 눈을 감고 자세를 유지하게 한다.","눈을 감은 상태에서 냄새를 구분하게 한다.","눈을 감은 상태에서 검진자가 환자의 손 위에 적은 숫자나 글자를 구분하게 한다"],"answer":2,"answerLabel":"②","answerPage":325,"explanation":"입체감각인식(stereognosis)의 검사법은 눈을 감은\n상태에서 손 위에 올려놓은 동전과 열쇠를 촉각으로 확인하는\n것이다."},{"id":"c04-q032","chapterId":4,"number":32,"page":82,"stem":"손목굴증후군(carpal tunnel syndrome) 환자에서 양성으로 나타나는 Tinel sign에 대한\n설명으로 옳은 것은?","choices":["주관절의 신전 시 통증을 호소하는 것","손목을 두드렸을 때 통증을 호소하는 것","손등을 마주 대었을 때 통증을 호소하는 것","어깨를 외전할 때 통증을 호소하는 것","영향 받은 부위의 요골맥박이 결손되는 것"],"answer":2,"answerLabel":"②","answerPage":325,"explanation":"Tin이 sign은 정중신경이 지나는 부위의 손목을\n두드렸을 때 통증을 호소하는 것을 의미한다."},{"id":"c04-q033","chapterId":4,"number":33,"page":82,"stem":"환자에게 눈썹을 올리고, 미소를 짓고, 찡그리며, 볼을 부풀려 보라고 지시하는 것은 어\n떠한 뇌신경을 검사하기 위함인가?","choices":["I","IV","V","VII","XII"],"answer":4,"answerLabel":"④","answerPage":325,"explanation":"제7뇌신경인 안면신경은 안면근육의 움직임을 담당한다."},{"id":"c04-q034","chapterId":4,"number":34,"page":82,"stem":"슬개골 반사가 소실된 환자에게 재검사를 수행하기 전에 어떠한 자세를 취하도록 해야 하\n는가?","choices":["머리 위로 양 팔을 들어 올린 뒤 검사를 하는 동안 천천히 5를 센다.","양측 다리를 천천히 올리고 검사를 하는 동안 내리도록 한다.","검사를 하는 동안 한쪽 다리를 굴곡 시키도록 한다.","양손을 단단히 깍지를 끼고 검사를 하는 동안 양손을 밀게 한다","검사를 하는 동안 눈을 감고 숨을 참도록 한다"],"answer":4,"answerLabel":"④","answerPage":325,"explanation":"슬개골 반사 중 환자를 이완하기 위해 근육의 정적\n수축을 통해 긴장상태를 가지도록 한다. OS Jendrassiks\nmaneuver 라고 한다."},{"id":"c04-q035","chapterId":4,"number":35,"page":82,"stem":"앙와위 자세에서 환자의 목을 굴곡 시켜 턱이 가슴에 닿도록 했을 때, 목의 굴곡 시 환자\n가 통증과 저항감을 호소하고 동시에 엉덩이와 무릎이 굴곡되었다. 이는 어떤 징후에 대\n한 양성소견인가?","choices":["Cullens sign","Phalens sign","Rombergs sign","Kernigs sign","Brudzinski s sign"],"answer":5,"answerLabel":"⑤","answerPage":325,"explanation":"목을굴곡 시켜 턱이 가슴에 닿도록 했을 때, 목의 굴곡\n시 환자가 통증과 저항감을 호소하고 동시에 엉덩이와 무릎이\n굴곡 되는 것은 Brudzinskis sign 양성소견이다."},{"id":"c04-q036","chapterId":4,"number":36,"page":83,"stem":"34세 남자가 최근에 타는 냄새를 맡은 뒤 갑작스럽게 발작으로 쓰러졌으며, 주변사람의\n말에 따르면 입을 다셨다고 하였다. 이 환자에게 의심되는 발작은?","choices":["단순 부분발작(simple partial seizure)","복합 부분발작(complex partial seizure)","소발작(absence or petit mal seizure)","이차성 전신 부분발작(secondary generalized partial seizure)","전신 대발작(grand mal seizure)"],"answer":2,"answerLabel":"②","answerPage":325,"explanation":"복합 부분발작 시 의식소실, 조짐(aura), 응시(staring)\n및 자동행동(automatisms) 혹은 반복적이며 목적이 없는\n움직임이 나타난다."},{"id":"c04-q037","chapterId":4,"number":37,"page":83,"stem":"4년 전 중증 근육무력증(myasthenia gravis)을 진단받은 32세 여자가 갑작스러운 왼쪽\n안검하수(ptosis), 복시(diplopia), 언어장애(dysphasia) 및 왼쪽 하지의 허약이 있어 내원\n하였다. Tensilon 검사 후 이러한 증상이 즉시 개선되었을 때, 가장 가능성이 높은 질환\n은?","choices":["콜린성 위기 (cholinergic crisis)","갑상선중독 위기 (thyrotoxicosis crisis)","근무력 위기 (myasthenic crisis)","급성 일과성허헐발작(acute transient ischemic attack)","길랑바레증후군(Guillain-Banre syndrome)"],"answer":3,"answerLabel":"③","answerPage":325,"explanation":"Tensilon 검사는 근육무력증(myasthenia gravis)를\n진단받은 환자에서 근무력 위기(myasthenic) 또는 콜린성\n위기(cholinergic crisis)를 감별하기 위해 사용된다. 에드로포늄\n(Edrophoninum： tensilon)은 항콜린 에스테라아제 억제제\n(anticholinesterase inhibitor)로 근무력 위フ |(myasthenic\ncrisis) 시 일시적으로 근육강도를 향상시키는 효과를 가진다."},{"id":"c04-q038","chapterId":4,"number":38,"page":83,"stem":"39세 남자가 일주일 이상 지속된 사지의 감각이상 및 강직을 주호소로 내원하였다. 환자\n는 증상이 발현되기 2주 전에 고열을 동반한 호흡기 감염성 질환을 앓았으나 따로 치료\n를 받지는 않았다고 한다. 신체검진 시 환자의 양쪽 하지의 허약과 심부건반사 감소가 확\n인되었을 때, 가장 가능성이 높은 질환은?","choices":["류머티스성 관절염 (rhe니matoid arthritis)","근육무력증(myasthenia gravis)","길랑바레증후군(G니illain-Barre syndrome)","일과성 허헐발작(acute transient ischemic atta사。","말초신경병증(peripheral ne니ropathy)"],"answer":3,"answerLabel":"③","answerPage":325,"explanation":"길랑바레증후군(Guillain-Barre syndrome)은 진행성\n상행 마비(progressive ascending paralysis)# 보이며,\n증상 발현 전 바이러스성 감염이 선행되기도 한다."},{"id":"c04-q039","chapterId":4,"number":39,"page":83,"stem":"17세 남자가 교통사고로 한 시간 전에 내원하였다. 의식수준은 명료하며, 사지 움직임의\n제한이나 불편한 곳은 없다고 한다. CT 를 위해 환자를 준비하던 중 왼쪽 유양돌기 뒤쪽\n으로 반상출혈이 관찰되었다. 가장 가능성이 높은 진단은?","choices":["부비동 골절","내이도 출혈","기저골 골절","경막하 출혈","뇌하수체 종양"],"answer":3,"answerLabel":"③","answerPage":325,"explanation":"유양돌기의 반상출혈은 Battle sign이라고도 하며,\n기저골 골절(basilar skull fracture) 시 관찰된다."},{"id":"c04-q040","chapterId":4,"number":40,"page":84,"stem":"55세 남자가 일주일 동안 38.3℃의 고열, 콧물, 가슴 울혈, 기침 및 피로를 주호소로 내원\n하였다. 환자는 식욕이 감소하였고 오심과 구토가 3일 정도 지속되었다고 하며, 내원 당\n일 하지에 진행성 대칭성의 허약이 나타났다고 한다 전반적으로 아파 보이며, 체온 38.0℃,\n맥박수 120회/분 호흡수 16회/분 혈압 100/60 mmHg이다. 신체검진 시 심장과 폐는 정\n상이었고, 전경부 림프절비대(anterior cervical adenopathy)フト 있으며, 상지의 반사가 감\n소되었다. 가장 가능성이 높은 진단은?","choices":["다발성 경화증(multiple sclerosis)","근육무력증(myasthenia gravis)","길랑바레증후군(Guillain-Barre syndrome)","뇌졸중(cerebrovascular accident)","말초신경병증(peripheral neuropathy)"],"answer":3,"answerLabel":"③","answerPage":325,"explanation":"길랑바레증후군(Guillain-Barre syndrome)은 진행성\n상행 마비를 보이며, 증상발현 전 바이러스성 감염이\n선행되기도한다."},{"id":"c04-q041","chapterId":4,"number":41,"page":84,"stem":"다음 중 갑상선 검진방법에 대한 설명으로 옳은 것은?","choices":["대상자의 뒤에 서서 목을 과신전 시킨 후 갑상선의 양측을 동시에 촉진한다.","대상자의 턱을 약간 숙여서 한쪽으로 기울인 다음 반대쪽의 갑상선을 촉진한다.","대상자의 목을 과신전 시킨 후 한쪽으로 기울인 다음 기울인 쪽의 갑상선을 촉진한다","대상자가 물을 삼켰을 때, 갑상선이 아래로 이동하는지 확인한다.","대상자가 물을 삼켰을 때, 갑상선이 앞으로 돌출되었다가 원위치로 회복하는지 확 인한다."],"answer":2,"answerLabel":"②","answerPage":325,"explanation":"갑상선 검진 동안 대상자를 이완시키기 위해 턱을 약간\n숙여서 한쪽으로 기울인 다음 반대쪽의 갑상선을 촉진한匚上\n그리고 갑상선은 기관에 고정되어 있으므로 물을 삼키면\n위로 올라갔다가 내려오는 것이 관찰된다."},{"id":"c04-q042","chapterId":4,"number":42,"page":84,"stem":"50세 남자가 지난 6개월 동안 근육통증 두통, 발한 성욕감퇴, 요통을 주호소로 내원하였\n다. 평소에 건강문제는 없었으며 지난 6개월간 복용한 약물은 없다고 한다 신체검진 시 영\n양상태는 우수하였으며, 치아 사이의 간격이 넓었고, 머리카락은 거칠었다. 손은 축축하고,\n상대적으로 크기가 컸으며, 활력징후는 정상이었다. 가장 가능성이 높은 질환은?","choices":["요붕증(diabetes inspidus； Di)","그레이브스병 (Grave's disease)","부갑상선 과형성증(parathyroid hyperplasia)","말단비대증(acromegaly)","당뇨(diabetes mellitus； DM)"],"answer":4,"answerLabel":"④","answerPage":325,"explanation":"이 대상자는 성장호르몬의 과다분비에 따른\n말단비대증으로 의심된다. 말단비대증은 주로 두통,\n시력장애, 근육통, 성욕감퇴, 발안, 거친 피부 및 넓어진\n치아사이의 간격이 특징적으로 관찰된다."},{"id":"c04-q043","chapterId":4,"number":43,"page":84,"stem":"저칼슘혈증을 보이는 65세 남자의 턱과 이주 앞의 근육을 두드리자 안면근육이 수축하\n는 것이 관찰되었다. 이는 무엇인가?","choices":["Chvostek's sign","Trousseau sign","Mueller's sign","Cullen's sign","Waddell's sign"],"answer":1,"answerLabel":"①","answerPage":325,"explanation":"츠보스텍 사인(Chvostek‘s sign)은 입 주위의 안면\n신경을 건드리면 안면 근육이 수축하는 것으로\n저칼슘혈증에서 관찰된다."},{"id":"c04-q044","chapterId":4,"number":44,"page":85,"stem":"갑상선항진증 대상자에서 흔히 관찰되는 신경계 증상은?","choices":["망상 및 정신병증","기억력, 집중력 및 문제해결력 저하","심부건 반사 감소","중증 인지장애","환각 및 환청"],"answer":2,"answerLabel":"②","answerPage":325,"explanation":"갑상선 호르몬의 증가 시 심부건 반사증가, 손의 미세한\n진전, 안절부절, 불안정, 불면증, 악몽 등의 증상이 발생하나\n중증의 인지장애 및 정신병증(psychosis)는 거의 나타나지\n않는다."},{"id":"c04-q045","chapterId":4,"number":45,"page":85,"stem":"다음 중 갑상선암 진단과 가장 밀접하게 연관되는 병력은?","choices":["갑상선암 가족력","갑상선 기능항진증 과거력","목주변의 방사선요법","15년 이상의 흡연력","10년 이상의 음주력"],"answer":3,"answerLabel":"③","answerPage":325,"explanation":"가장 흔한 갑상선암인 유두암papillary carcinoma)\n의 경우 방사선에의 노출력과 밀접한 관련이 있다. 가족력,\n갑상선항진증의 과거력, 흡연 및 음주는 위험한 요인이\n아니다."},{"id":"c04-q046","chapterId":4,"number":46,"page":85,"stem":"다음 중 갑상선저하증과 관련된 선별검사가 필요한 대상자는?","choices":["2주간 출산 우울증을 경험하고 있는 여자","갑상선 호르몬 약제를 복용 중인 사람","심부건 반사가 증가한 20대 남자","이유를 알 수 없는 진전을 보이는 40세 남자","최근 정신장애를 경험한 여성 노인"],"answer":5,"answerLabel":"⑤","answerPage":325,"explanation":"인지장애를 보인 노인에서 갑상선 호르몬의 분비가\n적절하지 않을 경우가 있으므로 관련 검사를 실시한다."},{"id":"c04-q047","chapterId":4,"number":47,"page":85,"stem":"다음 중 대표적인 쿠싱증후군의 징후는?","choices":["근육약화","비만","고혈압","색소침착","가는 모발"],"answer":2,"answerLabel":"②","answerPage":325,"explanation":"쿠싱증후군은 ACTH의 과다분비로 인해 당류피질\n호르몬이 생산이 증가하기 때문에 비만이 대표적인 징후이며\n나머지는 이차적인 증상이다."},{"id":"c04-q048","chapterId":4,"number":48,"page":85,"stem":"요붕증을 진단받은 40세 남자가 응급실로 내원하였다. 이 환자에게서 관찰 가능한 소견\n은?","choices":["소변량 감소","요 삼투압 250 mOsm/Kg 미만","낮은 혈청 삼투압","고칼륨혈증","말초 포도당 이용 저하"],"answer":2,"answerLabel":"②","answerPage":325,"explanation":"요붕증 환자에게서는 다뇨로 인한 삼투압 저하소변희석),\n다갈 및 수분섭취의 유지에 따른 약간의 혈청 삼투압 상승\n등이 관찰된다. 말초 포도당 이용 저하는 당뇨질환자의\n특징이다."},{"id":"c04-q049","chapterId":4,"number":49,"page":86,"stem":"갑상선암의 특징적인 소견은?","choices":["갑상선 비후","갑상선 고립결절(solitary thyroid nodules)","다결절성 갑상선종(multinodular goiter)","비정상적인 갑상선기능 검사","목안의 단단한 느낌(tight feeling in throat)"],"answer":2,"answerLabel":"②","answerPage":325,"explanation":"비정상적인 갑상선기능 검사결과는 갑상선종(goiter)\n의 비 악성의 원인일 수 있으며, 목 안의 단단한 느낌tight\nfeeing in throat), 갑상선샘 비후는 갑상선종의 징후이다."},{"id":"c04-q050","chapterId":4,"number":50,"page":86,"stem":"당뇨병 환자에게 검안경 검사를 실시한 결과, 망막성 미세동맥류(retin에 microaneurysm)\n가 확인되었다. 망막성 미세동맥류의 소견은?","choices":["면화반(cotton wool spots)","소형 붉은 반점 (small
