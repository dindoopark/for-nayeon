<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>전문간호사 자격시험 문제풀이</title>
  <style>
    :root {
      --ink: #181611;
      --muted: #6f695f;
      --line: #d8d0c2;
      --paper: #fffdf8;
      --warm: #f3efe7;
      --accent: #4e1f18;
      --accent-2: #8f4d2d;
      --ok: #1f6f43;
      --bad: #a6342b;
      --shadow: 0 18px 40px rgba(42, 33, 23, 0.14);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      background:
        linear-gradient(90deg, rgba(78,31,24,.06) 0 1px, transparent 1px 100%),
        linear-gradient(#eee8db, #faf7ef 34%, #efe8da);
      font-family: "Noto Serif KR", "Batang", "Apple SD Gothic Neo", "Malgun Gothic", serif;
    }
    button, input, select {
      font: inherit;
    }
    .app {
      display: grid;
      grid-template-columns: 320px minmax(0, 1fr);
      min-height: 100vh;
    }
    aside {
      position: sticky;
      top: 0;
      height: 100vh;
      padding: 24px 18px;
      background: #f8f3e9;
      border-right: 1px solid var(--line);
      overflow: auto;
    }
    .brand {
      padding: 4px 4px 18px;
      border-bottom: 2px solid var(--accent);
      margin-bottom: 18px;
    }
    .brand small {
      display: block;
      color: var(--accent-2);
      font-size: 12px;
      letter-spacing: .08em;
      font-weight: 700;
    }
    .brand h1 {
      margin: 6px 0 0;
      line-height: 1.15;
      font-size: 24px;
      font-weight: 800;
    }
    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-bottom: 16px;
    }
    .stat {
      padding: 10px 8px;
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: 6px;
      text-align: center;
    }
    .stat b { display: block; font-size: 20px; }
    .stat span { color: var(--muted); font-size: 12px; }
    .search {
      width: 100%;
      height: 42px;
      padding: 0 12px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: var(--paper);
      color: var(--ink);
    }
    .filters {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
      margin: 10px 0 16px;
    }
    .chip {
      height: 34px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: var(--paper);
      color: var(--muted);
      cursor: pointer;
    }
    .chip.active {
      border-color: var(--accent);
      background: var(--accent);
      color: #fffaf0;
    }
    .chapters {
      display: grid;
      gap: 8px;
    }
    .chapter {
      width: 100%;
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: 7px;
      background: var(--paper);
      text-align: left;
      cursor: pointer;
    }
    .chapter.active {
      border-color: var(--accent);
      box-shadow: inset 3px 0 0 var(--accent);
    }
    .chapter strong {
      display: block;
      font-size: 14px;
      line-height: 1.35;
    }
    .chapter span {
      display: block;
      margin-top: 5px;
      color: var(--muted);
      font-size: 12px;
    }
    main {
      display: grid;
      grid-template-rows: auto 1fr;
      min-width: 0;
    }
    .topbar {
      position: sticky;
      top: 0;
      z-index: 3;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 16px 28px;
      background: rgba(250, 247, 239, .88);
      border-bottom: 1px solid var(--line);
      backdrop-filter: blur(12px);
    }
    .selects {
      display: flex;
      gap: 8px;
      min-width: 0;
    }
    select {
      min-width: 130px;
      height: 38px;
      padding: 0 10px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: var(--paper);
      color: var(--ink);
    }
    .nav {
      display: flex;
      gap: 8px;
    }
    .iconbtn {
      width: 42px;
      height: 38px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: var(--paper);
      color: var(--ink);
      cursor: pointer;
    }
    .stage {
      display: grid;
      place-items: start center;
      padding: 32px 28px 44px;
    }
    .page {
      width: min(920px, 100%);
      min-height: 760px;
      padding: 42px 52px 28px;
      background: var(--paper);
      border: 1px solid #e7dfd2;
      border-radius: 8px;
      box-shadow: var(--shadow);
    }
    .page-head {
      display: flex;
      justify-content: space-between;
      gap: 18px;
      border-bottom: 2px solid var(--ink);
      padding-bottom: 12px;
      margin-bottom: 22px;
    }
    .chapter-title {
      min-width: 0;
    }
    .chapter-title small {
      display: block;
      color: var(--accent-2);
      font-size: 13px;
      font-weight: 700;
    }
    .chapter-title h2 {
      margin: 4px 0 0;
      font-size: clamp(22px, 3vw, 34px);
      line-height: 1.15;
      letter-spacing: 0;
    }
    .page-no {
      flex: 0 0 auto;
      color: var(--muted);
      font-size: 13px;
      text-align: right;
    }
    .passage {
      margin: 0 0 22px;
      padding: 18px 20px;
      border-left: 4px solid var(--accent);
      background: var(--warm);
      white-space: pre-line;
      line-height: 1.75;
    }
    .question-line {
      display: grid;
      grid-template-columns: 58px minmax(0, 1fr);
      gap: 12px;
      align-items: start;
      margin-bottom: 22px;
    }
    .qnum {
      color: var(--accent);
      font-size: 28px;
      font-weight: 800;
      line-height: 1;
    }
    .stem {
      white-space: pre-line;
      font-size: 20px;
      line-height: 1.75;
      word-break: keep-all;
      overflow-wrap: anywhere;
    }
    .options {
      display: grid;
      gap: 10px;
      margin-left: 70px;
    }
    .option {
      display: grid;
      grid-template-columns: 34px minmax(0, 1fr);
      gap: 10px;
      align-items: start;
      min-height: 48px;
      padding: 12px 14px;
      border: 1px solid var(--line);
      border-radius: 7px;
      background: #fffefa;
      color: var(--ink);
      text-align: left;
      cursor: pointer;
      line-height: 1.6;
    }
    .option:hover { border-color: #b79d86; }
    .option .mark {
      color: var(--accent);
      font-weight: 800;
    }
    .option.correct {
      border-color: rgba(31,111,67,.55);
      background: #eef8f1;
    }
    .option.wrong {
      border-color: rgba(166,52,43,.55);
      background: #fff0ee;
    }
    .answer {
      display: none;
      margin: 24px 0 0 70px;
      padding: 18px 20px;
      border-top: 2px solid var(--accent);
      background: var(--warm);
      line-height: 1.75;
      white-space: pre-line;
    }
    .answer.show { display: block; }
    .answer b {
      display: block;
      color: var(--accent);
      margin-bottom: 8px;
      font-size: 18px;
    }
    .page-foot {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      margin-top: 34px;
      padding-top: 12px;
      border-top: 1px solid var(--line);
      color: var(--muted);
      font-size: 13px;
    }
    .bookmark {
      border: 0;
      background: transparent;
      color: var(--accent);
      cursor: pointer;
      font-size: 18px;
    }
    .empty {
      width: min(720px, 100%);
      margin: 80px auto;
      padding: 34px;
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: var(--shadow);
      text-align: center;
    }
    @media (max-width: 900px) {
      .app { grid-template-columns: 1fr; }
      aside {
        position: static;
        height: auto;
        border-right: 0;
        border-bottom: 1px solid var(--line);
      }
      .chapters {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
      .topbar {
        position: static;
        padding: 14px 16px;
        flex-wrap: wrap;
      }
      .stage { padding: 18px 12px 32px; }
      .page {
        min-height: 0;
        padding: 26px 18px 20px;
      }
      .question-line {
        grid-template-columns: 1fr;
        gap: 8px;
      }
      .qnum { font-size: 22px; }
      .stem { font-size: 17px; }
      .options, .answer { margin-left: 0; }
      .selects {
        width: 100%;
        display: grid;
        grid-template-columns: 1fr 1fr;
      }
      select { min-width: 0; width: 100%; }
    }
    @media (max-width: 560px) {
      .chapters { grid-template-columns: 1fr; }
      .filters { grid-template-columns: repeat(2, 1fr); }
      .page-head { display: block; }
      .page-no { margin-top: 10px; text-align: left; }
      .option { grid-template-columns: 28px minmax(0, 1fr); }
    }
  </style>
</head>
<body>
  <div class="app">
    <aside>
      <div class="brand">
        <small>Practice Nurse</small>
        <h1>전문간호사<br>자격시험 대비</h1>
      </div>
      <div class="stats">
        <div class="stat"><b id="doneCount">0</b><span>풀이</span></div>
        <div class="stat"><b id="rightCount">0</b><span>정답</span></div>
        <div class="stat"><b id="rateCount">0%</b><span>정답률</span></div>
      </div>
      <input class="search" id="search" type="search" placeholder="검색">
      <div class="filters">
        <button class="chip active" data-filter="all">전체</button>
        <button class="chip" data-filter="unsolved">미풀이</button>
        <button class="chip" data-filter="wrong">오답</button>
        <button class="chip" data-filter="bookmarked">표시</button>
      </div>
      <div class="chapters" id="chapters"></div>
    </aside>
    <main>
      <div class="topbar">
        <div class="selects">
          <select id="chapterSelect"></select>
          <select id="questionSelect"></select>
        </div>
        <div class="nav">
          <button class="iconbtn" id="prev" title="이전">‹</button>
          <button class="iconbtn" id="shuffle" title="무작위">↯</button>
          <button class="iconbtn" id="next" title="다음">›</button>
        </div>
      </div>
      <section class="stage" id="stage"></section>
    </main>
  </div>
  <script>
    const QUIZ_DATA = {"source":"전문간호사 자격시험 대비 문제집.pdf","createdAt":"2026-05-08T21:31:04","totalQuestions":1200,"chapters":[{"id":1,"part":"PART I","partTitle":"공통영역","title":"전문간호사의 역할 및 정책","count":100,"startPage":8,"endPage":30,"questions":[{"id":"c01-q001","chapterId":1,"number":1,"page":8,"stem":"간호서비스를 위한 마케팅 믹스에서 제품 전략에 해당되는 것은?","choices":["전문간호사 채용","전문간호 수가 책정","중환자실 퇴원 환자 24시간 상담콜","인터넷을 활용한 퇴원 후 정보 제공","퇴원한 환자에게 1：1 전화 상담"],"answer":1,"answerLabel":"①","answerPage":306,"explanation":"제품 전략은 간호서비스의 수준 향상을 위해 기존\n간호서비스의 향상과 새로운 간호서비스를 개발하기 위한\n노력을 포함한다. 수가 책정은 가격전략에 해당되며, 퇴원\n환자 24시간 상담콜과 퇴원 후 정보 제공과 전화상담은\n유통전략에 해당된다."},{"id":"c01-q002","chapterId":1,"number":2,"page":8,"stem":"마케팅 믹스의 4P 중 촉진 전략에 포함되는 내용은?","choices":["전문간호 관리료 조정","심장내과 중환자 병동 오픈","지역주민 봉사활동","병원예약 시스템 개선","전문간호사제도 도입의 효과성에 대한 광고"],"answer":5,"answerLabel":"⑤","answerPage":306,"explanation":"촉진전략은 간호서비스의 가치와 효용성을 이미지화하여\n전달하는 것을 의미한다."},{"id":"c01-q003","chapterId":1,"number":3,"page":8,"stem":"전문간호서비스를 제공함에 있어 서비스 접점에 대한 관리를 강화하고 환자의 참여를 촉\n진시키는 데 적용되는 의료서비스의 특성은?","choices":["무형성","소멸성","시차성","가변성","동시성 PARTI 공통영역 I 8"],"answer":5,"answerLabel":"⑤","answerPage":306,"explanation":"동시성은 비분리성이라고도 하며, 의료서비스의 생산과\n소비가 동시에 일어남을 의미한다. 의료서비스 제공자와\n소비자가 분리되기 어렵고 서비스 제공자가 서비스의 한\n부분이 된다."},{"id":"c01-q004","chapterId":1,"number":4,"page":9,"stem":"a병원 중환자 전문간호사는 자신이 교육과 감독을 담당하는 중환자의료센터 직원의 생일\n에 카드를 써서 축하해 준다. 이에 해당되는 마케팅 전략은?","choices":["관계 마케팅","내부 마케팅","외부 마케팅","거래 마케팅","정보 마케팅"],"answer":2,"answerLabel":"②","answerPage":306,"explanation":"내부 소비자인 직원을 잘 관리하여 더 좋은 성과를 내도록\n동기를 부여하는 마케팅 활동을 내부 마케팅이라고 한다."},{"id":"c01-q005","chapterId":1,"number":5,"page":9,"stem":"대한간호협회는 전문간호사 제도를 활성화하기 위해 일반 대중을 상대로 공모를 통해 전\n문간호사의 이미지를 상징하는 로고에 투표하게 하고 투표 참여자에게는 추첨을 통해 선\n물을 주었다. 해당되는 마케팅 전략은?","choices":["차별화 마케팅","외부 마케팅","내부 마케팅","관계 마케팅","마케팅 믹스"],"answer":4,"answerLabel":"④","answerPage":306,"explanation":"관계 마케팅은 서비스 제공자가 소비자 등 이해관계자와\n강한 이해관계를 형성하고 유지 및 발전시키는 과정으로\n장기간의 이익을 확보하기 위해 소비자와 대화하고 더 좋은\n서비스를 제공하고자 한다."},{"id":"c01-q006","chapterId":1,"number":6,"page":9,"stem":"전문간호사는 새로이 적용된 호흡재활프로토콜의 효과를 알아보기 위해 임상실험을 하고\n자 한다. 대상자에게 사전동의를 받는 것은 어떠한 윤리적 원칙을 기반으로 하는가?","choices":["자발성의 원칙","선행의 원칙","정의의 원칙","악행금지의 원칙","비밀유지의 원칙"],"answer":1,"answerLabel":"①","answerPage":306,"explanation":"내적인 실제적 압박이나 외적인 강요에 의거하지 않고\n자기 자신이 자율적으로 동의하는 것을 의미한다."},{"id":"c01-q007","chapterId":1,"number":7,"page":9,"stem":"간호사에게 자신의 역할을 위임한 전문간호사가 해당 간호사의 업무 수행 중 과정과 결과\n를 살펴보아야 하는 의무는?","choices":["동의 의무","확인 의무","설명 의무","결과예견 의무","결과회피 의무"],"answer":2,"answerLabel":"②","answerPage":306,"explanation":"위임하였다 하더라도 간호의 내용 및 그 행위가 정확하게\n이루어지는가를 확인해야 하는 의무가 있다."},{"id":"c01-q008","chapterId":1,"number":8,"page":9,"stem":"다음 중 환자에게 설명의무가 면제되는 경우가 아닌 것은?","choices":["환자가 설명청취를 포기한 경우","환자가 처치 및 검사를 거부한 경우","위험이 중대하거나 시간적으로 급한 경우","설명이 환자에게 악영향을 끼칠 것이 우려되는 경우","발생할 위험이 매우 비전형적이고 발생개연성이 아주 희박한 경우"],"answer":2,"answerLabel":"②","answerPage":306,"explanation":"설명의 의무는 알 권리를 가진 자가 그 권리를 유효하게\n포기한 경우, 응급환자인 경우와 가정적인 승낙이 전제된\n경우 설명이 환자의 심신에 중대한 역기능을 미치는 경우에\n면제 가능하다."},{"id":"c01-q009","chapterId":1,"number":9,"page":10,"stem":"환자가 주사약으로 인한 부작용을 경험 후 민사소송을 제기하였다. a병원과 전문간호사의\n민사책임에 대한 설명으로 옳은 것은?","choices":["피고용인인 간호사의 불완전한 이행으로 인한 과실은 간호사에게 손해배상 책임이 있다.","피고용인인 간호사의 불완전한 이행으로 인한 과실이 인정되면 의료기관은 이에 대 한 책임이 있다.","피고용인인 간호사의 위법한 간호행위로 인한 과실에 대해서 의료기관 은 사용자 배상책임이 있다.","간호사 업무 수행에 있어 위법한 간호행위로 인해 과실이 발생할 경우 피고용인인 간호사와 의료기관은 공동 책임을 지게 된다.","의사의 위임 업무를 수행하면서 간호사의 위법한 간호행위로 인해 과실이 발생하면 의사가 단독 또는 전문간호사와 공동 책임을 지게 된다."],"answer":3,"answerLabel":"③","answerPage":306,"explanation":"피고용인의 고용범위에서 발생한 과실에 대하여 고용주가\n직접적인 책임을 지는 사용자의 배상책임이 있다."},{"id":"c01-q010","chapterId":1,"number":10,"page":10,"stem":"전단적 의료(unauthorized medical care)가 발생하지 않도록 전문간호사가 준수해야 할 의\n무는?","choices":["확인 의무","결과예견 의무","결과회피 의무","설명과 동의 의무","비밀누설금지 의무"],"answer":4,"answerLabel":"④","answerPage":306,"explanation":"의료인이 어떤 위험성이 있는 의료행위를 실시하기 전에\n환자로부터 동의를 얻지 않고 의료행위를 하는 것은 전단적\n의료에 해당한다. 즉 설명 및 동의의 의무를 다하지 않은\n것이다."},{"id":"c01-q011","chapterId":1,"number":11,"page":10,"stem":"안락사와 관련된 윤리원리와 규칙으로 적절하지 않은 것은?","choices":["평등의 원칙","정직의 원칙","정의의 원칙","선행의 원칙","편안의 원칙"],"answer":5,"answerLabel":"⑤","answerPage":306,"explanation":"윤리 원칙에는 평등, 정직, 정의, 선행의 원칙이 있다."},{"id":"c01-q012","chapterId":1,"number":12,"page":10,"stem":"전문간호사의 항암화학요법 투약행위가 기관의 표준에 부합하는지를 관찰하는 것은 어\n떤 관리 기술에 연결되는가?","choices":["기획(Planning)","조정(Coordinating)","인력관리(Staffing)","지휘 (Directing)","통제(Controlling)"],"answer":5,"answerLabel":"⑤","answerPage":306,"explanation":"수행 측정 기준을 설정하고, 결과를 보고하고, 교정\n행위를 취하고, 전반적으로 임상적/재정적 결과를 감독하는\n것이 통제에 해당된다."},{"id":"c01-q013","chapterId":1,"number":13,"page":11,"stem":"수술 환자의 통증감소를 위한 책임을 전문간호사에게 전임하는 것은 다음 관리기술 중\n어디에 해당되는가?","choices":["기획(Planning)","조정 (Coordinating)","인력관리(Staffing)","지휘 (Directing)","통제 (Controlling)"],"answer":3,"answerLabel":"③","answerPage":306,"explanation":"조직과 구성원의 목적을 달성하기 위해 필요한 인적\n자원을 효율적으로 배치하는 것은 인력관리의 중요한\n목적이다."},{"id":"c01-q014","chapterId":1,"number":14,"page":11,"stem":"행정가의 역할은 다양한 관리지식을 필요로 한다. 중환자실 운영예산 확보와 중환자실의\n인력과 물품을 효과적으로 관리하여 목적을 달성하도록 계획하는 것은 어떤 관리 기술에\n연결되는가?","choices":["기획 (Planning)","조정 (Coordinating)","인력관리(Staffing)","지휘 (Directing)","통제 (Controlling)"],"answer":1,"answerLabel":"①","answerPage":306,"explanation":"행정가의 역할은 특정 부서나 분야의 이익을 위한 가장\n효과적인 행동이나 사업을 결정하거나 사업에 영향을 미칠\n미래의 사건이나 경향을 예측하고 의사결정하는 과정으로\n예산확보, 조직의 시간과 자원의 소비를 효과적으로 관리하여\n원하는 산출을 얻도록 하는 것이다."},{"id":"c01-q015","chapterId":1,"number":15,"page":11,"stem":"새로운 병원으로 입사한 전문간호사가 여러 가지 프로그램을 도입하려고 한다. 프로그램\n을 도입할 병원의 공식적 구조를 확인하는 가장 좋은 방법은?","choices":["조직의 철학, 미션, 가치 등을 검토","조직 내 정보의 흐름과 양을 판단","전문간호사와 행정가의 리더십 유형 비교","정치적으로 문제가 될 소지가 있는 조직 내 문제들을 파악하기","조직에 오래 일하고 있는 간호사와 면담"],"answer":1,"answerLabel":"①","answerPage":306,"explanation":"프로그램 계획 첫 단계는 새 프로그램이 적용되거나\n기존의 프로그램이 수정될 환경에 대한 정보를 수집하여\n필요한 점을 결정하는 상황평가를 실시하는 것이다. 병원의\n철학, 미션, 가치에 관한 지식은 프로그램의 우선순위와\n프로그램의 설계 그리고 조직 내에서 전문간호사의 위치에\n관한 정보를 제공한다."},{"id":"c01-q016","chapterId":1,"number":16,"page":11,"stem":"병원 간에 서로 연계된 암환자관리프로그램을 구축할 책임자로서 전문간호사가 초기에\n취해야 할 조정 행위는?","choices":["참여 병원의 전문의, 전문간호사와 병동 직원들과 인간적 관계 형성","각 병원 내 해당 병동 근무에 적합한 간호사를 모집하고 선정","프로그램에 참가할 모든 직원의 전문적 발전을 위한 교육 개발","공유 데이터베이스를 만들기 위해 각 병원 정보체계를 연결","간호사의 수와 경력의 정도를 사정하고 효율성 평가하기"],"answer":1,"answerLabel":"①","answerPage":306,"explanation":"계획된 변화가 성공적으로 정착되기 위해서는 프로젝트에\n가장 많이 영향력을 미칠 사람들의 흥미를 끌기 위해 주요\n관계자들을 확인하고, 그들과 개인적인 관계를 형성하고,\n이들이 앞에 나서서 적극 참여하도록 이끌어야 계획이\n원활하고 성공적으로 진행된다."},{"id":"c01-q017","chapterId":1,"number":17,"page":11,"stem":"전문간호사가 수행하고 있는 프로그램의 효과와 목적 달성도를 평가할 때 가장 적합한\n방식은 어느 것인가?","choices":["Criterion ranking","SWOT 분석","Management by objectives (MBO)","Force-field analysis","Communication skill analysis"],"answer":3,"answerLabel":"③","answerPage":306,"explanation":"목표관리(MBO)는 프로그램 기획의 효과와 성과 달성을\n향상시키기 위해 사용되는 방식이다. 개인의 성격과 같은\n주관적인 측면에 초점을 맞추기보다는 설정한 목적이\n성취되었는지에 초점을 둔다."},{"id":"c01-q018","chapterId":1,"number":18,"page":12,"stem":"전문간호사가 자신이 주관한 모임에서 팀 구성원들이 소속 부서 직원끼리만 소그룹을 형\n성하고, 자문역할로 참석하기로 한 의사가 팀의 핵심인 것처럼 행동하는 것을 목격하였다\n이런 상황에서 취할 수 있는 가장 효과적인 리더십 전략은?","choices":["해당 모임이 핵심구성원들만의 모임임을 의사에게 통보한다.","팀의 업무를 자연적으로 형성된 소그룹별로 나눈다.","그룹의 기능에 대한 당신의 의견과 기대를 자유롭게 알린다.","그룹의 규범과 목적을 명확히 정한 후 팀을 이끌어 나간다.","팀원의 부적절한 행동을 강력하게 통제한다."],"answer":4,"answerLabel":"④","answerPage":306,"explanation":"목표와 계획의 진술이 명확하지 않으면, 팀 구성원들은\n팀의 목표나 수행 시간, 목표 수행에서 본인들이 맡은 역할\n등을 파악하는 과정에서 혼란스러워 하거나, 좌절하기도\n한다. 규범은 그룹 행동의 범위를 처방해 주고 모든 팀\n구성원들이 자유롭게 참여하기 위해 필요한 신뢰를 형성할\n수 있게 팀의 지속성과 예측성을 확보해 준다."},{"id":"c01-q019","chapterId":1,"number":19,"page":12,"stem":"새로운 중환아 병동이 만들어질 계획이 수립되자 누가 수액 영양제의 혼합과 투약에 책\n임을 질 것인가에 대해 의견이 분분하다. 약사와 의사들이 책임이 있다는 의견과 전문간\n호사가 책임이 있다는 의견이 있다. 이 문제를 해결할 가장 좋은 방법은?","choices":["병원 행정부에 기관의 가치/자원/역할을 고려한 해결책을 제시해 달라고 한다.","진료부, 약제부, 간호부에서 수액 영양제와 관련된 전문지식을 바탕으로 세 분야에 해당되는 새로운 규정을 각자 만든다.","해당 문제를 다학제적 중환자 위원회에서 토의하게 하고 병원 행정부에 해결책을 제 시할 수 있게 한다.","대부분의 투약이 실제 이루어지는 병동 간호관리자에게 해당 문제로 인한 갈등을 해결하도록 책임을 위임한다.","팀원의 업무분담을 사정하고, 업무분장서를 확정하여 이를 따르도록 지시한다."],"answer":3,"answerLabel":"③","answerPage":306,"explanation":"직종 간 갈등이 있는 경우 다학제 구성원의 합의를 통해\n해결책을 제시한다."},{"id":"c01-q020","chapterId":1,"number":20,"page":12,"stem":"성공적인 중환자 간호팀의 구성을 저해하는 행동은?","choices":["팀의 핵심 구성원이 기대에 미치지 못할 때 그 구성원을 대체할 사람을 찾는 것","팀 구성원들의 다양한 의견을 듣기 위해 상충되는 의견이나 부정적 감정도 자유로 이 표현하도록 허용하는 것","그룹의 응집력이 형성되고 구성원들이 본인의 임무를 잘 완수하면 팀을 ‘자율적 운 영에 맡기는 것","팀의 업무 활동 목표 달성, 팀 관계, 그룹에 대한 개인적인 감정들을 나누는 것","팀원 간 자율적 협력과 효과적인 의사소통을 통해 팀워크 구성과 역동이 자율적인 것"],"answer":1,"answerLabel":"①","answerPage":306,"explanation":"팀으로서의 응집력을 방해하는 것은 안정적이지 않은\n구성원 자격이다."},{"id":"c01-q021","chapterId":1,"number":21,"page":13,"stem":"전문간호사의 이러한 행동에 해당되는 윤리적 원칙은?","choices":["전문직 통합","분배적 정의","건강권","자율성","팀원의 부적절한 행동을 강력하게 통제한다."],"passage":"다음 지문을 읽고 질문에 답하시오(문제 21-22).\n수년전 도입된 호스피스 완화의료 프로그램이 경제적으로 수지가 맞지 않기 때문에 병원 지도\n부에서 이를 폐지하기로 결정하였다. 전문간호사는 지난 몇 년에 걸쳐서 이 프로그램을 개발했\n고 그동안 달성한 결과에 자부심을 느껴왔다. 해당 전문간호사는 프로그램을 폐지하라는 결정으\n로 스트레스를 받고 있다. 전문간호사는 어느 한 쪽의 입장도 아닌 모든 관련자의 입장을 다함\n께 들여다보기로 했다.","answer":1,"answerLabel":"①","answerPage":306,"explanation":"전문직 통합은 윤리적 행위의 기초인 기본적 가치이다.\n전문간호사는 환자, 동료, 고용인, 본인의 전문직, 그리고\n본인 등 다양한 대상자의 의무 사이에서 균형을 유지해야\n한다."},{"id":"c01-q022","chapterId":1,"number":22,"page":13,"stem":"이 사례에서 윤리적 원칙을 지키는 행동은?","choices":["수익을 창출하지 않는 프로그램을 폐지하여 비용을 절감하려는 관리자의 의견을 지 지한다.","호스피스 완화의료 프로그램에 대한 대상자와 가족의 요구를 옹호한다.","프로그램 폐지를 논의하기 위해 관리자와 면담 스케줄을 만든다.","팀 구성원들의 팀 내 갈등을 줄일 수 있도록 대안이 될 다른 업무를 찾을 수 있도 록 돕는다.","상위 행정부서가 부적절한 결정을 내렸다고 항의서를 발송한다."],"passage":"다음 지문을 읽고 질문에 답하시오(문제 21-22).\n수년전 도입된 호스피스 완화의료 프로그램이 경제적으로 수지가 맞지 않기 때문에 병원 지도\n부에서 이를 폐지하기로 결정하였다. 전문간호사는 지난 몇 년에 걸쳐서 이 프로그램을 개발했\n고 그동안 달성한 결과에 자부심을 느껴왔다. 해당 전문간호사는 프로그램을 폐지하라는 결정으\n로 스트레스를 받고 있다. 전문간호사는 어느 한 쪽의 입장도 아닌 모든 관련자의 입장을 다함\n께 들여다보기로 했다.","answer":2,"answerLabel":"②","answerPage":307,"explanation":"이 상황에서 전문간호사는 고용인에 대한 의무가 있기는\n하나 대상자의 요구를 옹호할 의무도 가지고 있다. 그\n프로그램의 제거에 대해 토의하기 위해 상사를 만나는 것은\n최종 결정을 내리는 최고 그룹이 토의할 여지를 없애버리며,\n더 나아가서는 전문간호사가 환자의 가족의 요구를 옹호할\n책임을 고수할 의무로부터 멀어지게 한다."},{"id":"c01-q023","chapterId":1,"number":23,"page":13,"stem":"중환자실에 새로이 배치된 중환자전문간호사는 중환자실에 오랜 기간 근무한 간호사의\n말을 구성원들이 잘 따르는 것을 발견하였다. 어떤 유형의 권력과 리더십인가?","choices":["전문적 권력을 가진 비공식적 지도자이다.","합법적인 권력을 가진 공식적 지도자이다.","교육과 직위에 근거한 자연스런 지도자이다.","전문간호사의 리더십보다 자격 면에서 우월하다.","연령과 경력을 존중하는 동양적 인식을 갖고 있다."],"answer":1,"answerLabel":"①","answerPage":307,"explanation":"전문적 권력은 특수한 능력이나 기술, 혹은 지식을\n내보임으로써 생기는 권력이다. 그룹 내 의사들은 자신들이\n가진 전문성에 대한 그룹의 인식과 조직 내에서의 위치에\n의해서 비공식적인 지도자로 다루어진다."},{"id":"c01-q024","chapterId":1,"number":24,"page":13,"stem":"새롭게 도입되는 프로젝트를 위해 중환자 직원을 재배치할 계획을 발표하자 팀 구성원들\n의 의견이 부정적인 쪽으로 기울어졌다. 팀 구성원들은 본인들이 익숙한 현재 업무에서\n다른 업무로 배치되고 싶지 않으며 직원의 수를 줄이려는 구조조정이 목적이라고 생각하\n고 프로젝트의 원래 목적도 신뢰하지 않는 상황이다. 이런 상황에서 프로젝트 책임자인\n전문간호사가 사용하기에 가장 적절한 권력은?","choices":["강압적 권력","전문적, 합법적 권력","정보적 권력","보상적 권력","복종적 권력"],"answer":2,"answerLabel":"②","answerPage":307,"explanation":"전문간호사는 관련된 분야의 전문지식과 기술을 가지고\n있으므로 전문적 권력을 소유하고 있고, 이번 프로젝트의\n팀 지도자로 공식 임명을 받았으므로 합법적 권력을 소유하고\n있다."},{"id":"c01-q025","chapterId":1,"number":25,"page":14,"stem":"각 병동에 전문간호사를 배치하는 것과 관련하여 발생할 수 있는 여러 가지 저항에 대한\n대응을 고려하여 변화를 계획할 때, 어떤 변화 추진력을 고려해야 하는가?","choices":["마케팅과 홍보 계획","규칙/절차 그리고 업무 규정","리더십과 조직의 분위기","전문간호사 관련 법","팀원의 협동과 조정 요구도 파악"],"answer":3,"answerLabel":"③","answerPage":307,"explanation":"변화는 달라져가는 과정, 정적인 상태에서의 수정, 한\n가지가 다른 것으로 대체되는 상황, 환경의 개조 등으로\n다양하게 정의된다. 내외부의 힘이 변화라는 현상을\n추진하는데 전문간호사는 체계 내에서 변화의 요구가 있을\n때 관련 절차나 과정에 대해 잘 알고 있는 사람들로 그룹을\n조직하여 그 요구에 대응하는 사람이므로 성공적인 변화를\n일으킬 가능성이 높다."},{"id":"c01-q026","chapterId":1,"number":26,"page":14,"stem":"우리나라의 전국민의료보험이 실시된 해는?","choices":["1983년","1985년","1987년","1989년","1991년"],"answer":4,"answerLabel":"④","answerPage":307,"explanation":"1989년에 전국민의료보험이 실시되었다."},{"id":"c01-q027","chapterId":1,"number":27,"page":14,"stem":"보건의료제도의 구성요소로 적절하지 않은 것은?","choices":["보건의료인력","보건의료조직","의료전달체계","재원조달","보건의료관리"],"answer":1,"answerLabel":"①","answerPage":307,"explanation":"보건의료인력은 보건의료 자원의 하나이다."},{"id":"c01-q028","chapterId":1,"number":28,"page":14,"stem":"다음에서 설명하는 진료비 지불제도는?\n등록된 환자나 사람의 수에 따라 일정액을 받는 방식으로, 등록된 수만큼 사전에 결정된 수입을\n보장받고 일정 기간 동안 의료서비스를 제공한다. 상대적으로 저렴한 비용이 들며, 예방에 대한\n관심이 커지나 환자의 선택권이 제한된다.","choices":["행위별 수가제","인두제","봉급제","포괄수가제","총괄계약제"],"answer":2,"answerLabel":"②","answerPage":307,"explanation":"인두제는 의사가 맡고 있는 환자 수, 즉 자기의 환자가\n될 가능성이 있는 일정 지역의 주민 수에 일정금액을 곱하여\n이에 상응하는 보수를 지급받는 방식이다."},{"id":"c01-q029","chapterId":1,"number":29,"page":15,"stem":"다음에서 설명하는 진료비 지불제도는?\n제공된 의료서비스의 단위당 가격에 서비스의 양을 곱한 만큼 보상하는 방식이다. 짧은 시간 내\n에 많은 환자를 대할 수 있고 새로운 의료기술을 도입하거나 연구를 촉진하는 장점이 있으나 과\n잉 진료나 과잉 투약이 발생할 소지가 있다.","choices":["행위별 수가제","인두제","봉급제","포괄수가제","총괄계약제"],"answer":1,"answerLabel":"①","answerPage":307,"explanation":"행위별수가제는 진료에 소요되는 약제 또는 재료비를\n별도로 산정하고 , 의료인이 제공한 진료행위 하나하나 마다\n항목별로 가격을 책정하여 진료비를 지급하도록 하는\n제도이다."},{"id":"c01-q030","chapterId":1,"number":30,"page":15,"stem":"다음에서 설명하는 진료비 지불제도는?\n환자의 종류 당 총괄보수단가를 설정하여 보상하는 방식이다. 경제적으로 진료를 행하도록 할 수\n있으며 의료기관의 생산력이 증대되며 행정적으로 간편하나. 서비스의 양이 최소화되거나 규격\n화될 수 있다.","choices":["행위별 수가제","인두제","봉급제","포괄수가제","총괄계약제"],"answer":4,"answerLabel":"④","answerPage":307,"explanation":"포괄수가제는 한 가지 치료행위가 기준이 아니고,\n환자가 어떤 질병의 진료를 위하여 입원했는가에 따라 질병군\n(또는 환자군별로 미리 책정된 일정액의 진료비를 지급하는\n제도이다."},{"id":"c01-q031","chapterId":1,"number":31,"page":15,"stem":"다음에서 설명하는 진료비 지불제도는?\n일정기간에 따라 의료인이 보상받는 방법으로 불필요한 경쟁을 억제할 수 있다.","choices":["행위별 수가제","인두제","봉급제","포괄수가제","총괄계약제"],"answer":3,"answerLabel":"③","answerPage":307,"explanation":"봉급제는 사회주의 국가나 영국과 같은 국영의료체계의\n병원급 의료기관의 근무의에게 주로 적용되는 방식으로 농 •\n어촌 등 벽 •오지에 거주하는 국민이라도 쉽게 필요한 때\n의료서비스를 제공받을 수 있으나 그 진료수준은 낮은 편이다."},{"id":"c01-q032","chapterId":1,"number":32,"page":16,"stem":"다음에서 설명하는 진료비 지불제도는?\n진료보수 총액을 사전에 결정하여 총진료비 억제가 가능한 장점이 있으나 매년 진료비 계약을 해\n야 하고, 새로운 기술을 도입하는 데에는 제한이 따르는 단점이 있다.","choices":["행위별 수가제","인두제","봉급제","포괄수가제","총괄계약제"],"answer":5,"answerLabel":"⑤","answerPage":307,"explanation":"총액(총괄) 계약제는 보험자 측과 의사단체(보험의협회)\n간에 국민에게 제공되는 의료서비스에 대한 진료비 총액을\n추계하고 협의한 후, 사전에 결정된 진료비 총액을 지급하는\n방식으로의사단체는 행위별 수가기준 등에 의하여 각 의사에게\n진료비를 배분함) 독일의 보험의에게 적용되는 방식이다."},{"id":"c01-q033","chapterId":1,"number":33,"page":16,"stem":"제한된 보건의료자원을 효율적으로 활용하여 국민에서 동등한 수준의 의료와 접근도를\n유지함으로써 국민건강의 최대화를 달성하고자 보건의료 자원의 조화를 통해 의료서비스\n의 전달을 체계화하는 것을 무엇이라 하는가?","choices":["보건의료체계","보건복지체계","건강전달체계","건강관리체계","건강의료체계"],"answer":1,"answerLabel":"①","answerPage":307,"explanation":"보건의료전달체계라고도 한다."},{"id":"c01-q034","chapterId":1,"number":34,"page":16,"stem":"국민의 건강권을 보장하기 위하여 보건의료서비스를 필요로 하는 국민에게 적절한 방법\n으로 이를 전달하는 체계는?","choices":["보건복지전달체계","보건의료전달체계","건강의료체계","건강관리체계","건강서비스체계"],"answer":2,"answerLabel":"②","answerPage":307,"explanation":"보건의료서비스를 전달하는 체계를 의미한다."},{"id":"c01-q035","chapterId":1,"number":35,"page":16,"stem":"보건의료체계의 목적을 가장 적절하게 설명한 것은?","choices":["의료보험수가를 결정하기 위하여","국민의 의료기관 선택의 자유를 최대한 보장하기 위하여","국민에게 평등한 의료를 제공하기 위하여","국민에게 적절한 의료를 체계적이고 효율적으로 제공하기 위하여","시장원리에 따라 의료서비스를 배분하기 위하여"],"answer":3,"answerLabel":"③","answerPage":307,"explanation":"보건의료체계는 국민에게 적절한 의료를 체계적이고\n효율적으로 제공하기 위함이다."},{"id":"c01-q036","chapterId":1,"number":36,"page":17,"stem":"우리나라 보건의료체계의 특성으로 적절하지 않은 것은?","choices":["보건인력 생산 시 드는 비용이 높고 공급의 탄력성이 높다.","고가의 의료장비 및 병상이 과잉공급되어 있다.","의료기관 종별 기능이 명확하지 않게 운영된다.","의료기관 양극화현상이 발생한다.","민간의료 중심으로 보건의료가 공급된다"],"answer":1,"answerLabel":"①","answerPage":307,"explanation":"보건인력은 공급의 탄력성이 낮다."},{"id":"c01-q037","chapterId":1,"number":37,"page":17,"stem":"우리나라 보건의료의 특성으로 적절하지 않은 것은?","choices":["정보의 비대칭성이 존재한다.","충분한 설명에 근거하여 동의를 받도록 한다.","의료인의 면허 범위 내에서 의료행위가 가능하다.","질병 발생 여부와 시점. 진료결과 등이 예측 가능하다.","국가가 기본적인 보건의료를 제공하고 국민의 건강권을 보장한다."],"answer":4,"answerLabel":"④","answerPage":307,"explanation":"질병 발생 여부와 시점, 진료결과 등이 예측 불가능하다."},{"id":"c01-q038","chapterId":1,"number":38,"page":17,"stem":"우리나라보건의료제도는?","choices":["조세형","민간보험형","기초보장형","시장경제형","전국민사회보험형"],"answer":5,"answerLabel":"⑤","answerPage":307,"explanation":"조세형은 영국의 제도가 대표적이며, 민간보험형은\n미국의 제도가 대표적이다."},{"id":"c01-q039","chapterId":1,"number":39,"page":17,"stem":"보건의료체계 중 자원 배치와 관련한 사항으로 적절하지 않은 것은?","choices":["의료보험프로그램으로 의료보험이 있다.","기타 정부기관으로 결핵 관리기관이 있다.","비정부기관으로 각종 보건관련 단체가 있다.","독립적 민간부분으로 의사, 치과의사 등이 있다.","국가보건의료 당국으로 보건복지부가 대표적이다."],"answer":2,"answerLabel":"②","answerPage":307,"explanation":"결핵관리기관은 비정부기관이다."},{"id":"c01-q040","chapterId":1,"number":40,"page":17,"stem":"미국 전문간호사 제도에 관한 설명 중 옳지 않은 것은?","choices":["전문간호사의 역할이 간호법에 분명히 명시되어 있다.","법적 책임과 권한을 가진다.","전문간호사 실습교육이 전문간호사의 지도 하에 이루어진다.","전문간호사의 자격, 면허, 갱신 등에 대한 통합관리부서를 가지고 있다.","전 지역 통합된 면허에 대한 법령과 규정을 따르고 있다."],"answer":5,"answerLabel":"⑤","answerPage":307,"explanation":"주별로 면허 법령과 규정이 있다."},{"id":"c01-q041","chapterId":1,"number":41,"page":18,"stem":"국내에 전문간호사가 도입된 배경으로 적절하지 않은 것은?","choices":["보건의료분야의 전문화 추세","전공의 부족, 낮은 의료수가 해결","국민의 의료서비스 기대수준에 부응","간호사 인력 증가로 인한 일자리 증가 목적","의료기술의 발전, 인구와 질병 구조 변화로 의료 이용 증가"],"answer":4,"answerLabel":"④","answerPage":307,"explanation":"전문간호사는 의료의 전문화, 부족한 의료인의 보완,\n전문 지식과 술기의 요구도에 부응하고자 도입되었다."},{"id":"c01-q042","chapterId":1,"number":42,"page":18,"stem":"‘분야별 간호사에서 전문간호사로 개정된 해는?","choices":["19 乃년","1990년","2000년","2005년","2006년"],"answer":3,"answerLabel":"③","answerPage":307,"explanation":"2000년에 분야별간호사에서 전문간호사로 의료법이\n개정되었다."},{"id":"c01-q043","chapterId":1,"number":43,"page":18,"stem":"‘전문간호사 자격인정 등에 관한 규칙‘이 제정된 해는?","choices":["1990년","2000년","2003년","2006년","2008년"],"answer":4,"answerLabel":"④","answerPage":307,"explanation":"2006년에 전문간호사 자격인정 등에 관한 규칙이\n제정되었다."},{"id":"c01-q044","chapterId":1,"number":44,"page":18,"stem":"미국 전문간호사에 포함되어 있지 않은 것은?","choices":["돌봄전문간호사","마취전문간호사","임상전문간호사","전문실무간호사","조산전문간호사"],"answer":1,"answerLabel":"①","answerPage":307,"explanation":"미국의 전문간호사는 마취전문간호사, 임상전문간호사,\n전문실무간호사, 조산전문간호사이 다 ."},{"id":"c01-q045","chapterId":1,"number":45,"page":18,"stem":"국내 전문간호사 자격시험을 관리하는 기관은?","choices":["보건복지부","대한간호협회","병원간호사회","한국간호교육평가원","한국전문간호사협회"],"answer":4,"answerLabel":"④","answerPage":307,"explanation":"한국간호교육평가원에서는 전문간호사 시험 기준\n설정, 문항개발 및 관리 , 시행 등을 담당한다."},{"id":"c01-q046","chapterId":1,"number":46,"page":19,"stem":"전문간호사의 영역별 자격이 옳게 구성된 것은?","choices":["보건, 마취, 보험심사","종양, 임상, 아동","감염관리, 산업, 재활","보건진료, 중환자, 응급","가정, 호스피스, 수술"],"answer":2,"answerLabel":"②","answerPage":307,"explanation":"전문간호사 자격은 보건 • 마취 • 정신 가정 • 감염관리 •\n산업 • 응급 노인 • 중환자 • 호스피스 • 종양 • 임상 및 아동\n분야로 구분한다."},{"id":"c01-q047","chapterId":1,"number":47,"page":19,"stem":"국내 전문간호사 교육의 학제 기준은 무엇인가?","choices":["학사","석사","박사","자격취득과정","학제기준 없음"],"answer":2,"answerLabel":"②","answerPage":307,"explanation":"전문간호사 교육기관은 대학원과정으로 석사학위이다."},{"id":"c01-q048","chapterId":1,"number":48,"page":19,"stem":"국내 전문간호사 자격 취득에 대한 설명으로 옳은 것은?","choices":["자격시험의 합격자는 1 차 시험과 2차 시험 합산 점수의 60퍼센트 이상을 득점한 자 로한다.","전문간호사 교육과정은 공통과목, 공통실습과목, 전공이론과목 및 전공실습과목으 로 구분한다.","보건복지부장관이 지정하는 교육기관에서 교육과정을 이수한 경우에만 전문간호사 시험에 응시할 수 있다.","전문간호사 교육과정은 보건복지부장관이 지정하는 전문간호사 교육기관이 실시하 고 그 교육기간은 2년 이상으로 한다.","전문간호사 교육과정을 신청할 수 있는 자는 교육을 받기 전 10년 이내에 해당분야 의 기관에서 5년 이상 간호사로서의 실무경력이 있는 자로 한다."],"answer":4,"answerLabel":"④","answerPage":307,"explanation":"① 자격시험의 합격자는 1 차시험과 2차시험에서 각각총점의\n60퍼센트 이상을 득점한 지로 한다. ② 전문간호사 교육과정의\n과목은 공통과목, 전공이론과목 및 전공실습과목으로 구분한다\n③ 보건복지부장관이 지정하는 교육기관과 인정하는 외국의\n해당분야 전문간호사 자격이 있는 자가 해당된다. ⑤ 전문간호사\n교육과정을 신청할 수 있는 자는 교육을 받기 전 10년 이내에\n해당분야의 기관에서 3년 이상 간호사로서의 실무경력이 있는\n자로 한다."},{"id":"c01-q049","chapterId":1,"number":49,"page":19,"stem":"한국 전문간호사 제도를 정립하기 위한 사항으로 적절하지 않은 것은?","choices":["전문간호사 핵심능력 강화","전문간호사 영역 중복 문제 해결","전문간호사 실무영역 축소를 위한 제재","전문간호사 분야별 역할 규정의 타당성 검증","전문간호사와 간호사 간의 역할 차별화 및 정체성 확립"],"answer":3,"answerLabel":"③","answerPage":308,"explanation":"전문간호사 정립을 위해 간호사의 핵심능력을 강화하\n영역간 중복 문제를 해결하고, 분야별 역할규정의 타당성을\n검정하고, 전문간호사만의 독특한 역할 정립을 통한 정체성을\n확립해야 한다."},{"id":"c01-q050","chapterId":1,"number":50,"page":19,"stem":"우리나라 전문간호사의 교육과정으로 적절하지 않은 것은?","choices":["공통 필수학점은 13학점 이상이다.","전공 실습은 500시간 이상이다.","전문간호사 교육기간은 2년 이상이다.","전문이론은 10학점 이상이다.","전문간호사과정 입학 시 최근 1 이년 이내에 해당분야에서 3년 이상의 실무경력이 필 요하다."],"answer":2,"answerLabel":"②","answerPage":308,"explanation":"전공실습은 300시간 이상이다."},{"id":"c01-q051","chapterId":1,"number":51,"page":20,"stem":"중환자실 전문간호사는 중환자실에 입실하여 중심정맥관을 삽입한 환자 중 카테터가 정\n맥을 뚫어 혈흉을 형성한 환자의 비율을 조사하여 개선활동을 하고자 한다. 혈흉을 형성\n한 환자의 비율은 다음 중 어떠한 지표에 해당하는가?","choices":["결과지표","과정지표","대리지표","구조지표","간접지표"],"answer":1,"answerLabel":"①","answerPage":308,"explanation":"결과지표는 사람, 집단, 기관이나 공동체에 대한 행동이나\n중재에 대하여 관찰하고 판단할 효과의 근거를 의미한다.\n이는 서비스나 행동을 제공받은 이들에 대한 변화를 나타내나\n제공자에 대한 지표를 의미하지는 않는다. 반면 과정지표는\n간호를 전달하는 치료제공자의 행동과 태도에 대한 측정을\n의미한다."},{"id":"c01-q052","chapterId":1,"number":52,"page":20,"stem":"다음의 질 지표 중 과정지표에 해당하는 것은?","choices":["투약 오류를 줄이기 위해서 약물의 배치를 재조정하였다.","신입간호사가 업무에 참고할 수 있는 지침서를 비치하였다.","환자들의 낙상을 예방하기 위해 낙상예방전담팀을 신설하였다.","환자에게 질적인 간호를 제공하기 위해 간호사당 2명의 환자를 배치하였다.","병원감염의 발생을 예방하기 위하여 의료인의 손 씻기 수행여부를 조사하였다."],"answer":5,"answerLabel":"⑤","answerPage":308,"explanation":"과정지표는 간호를 전달하는 치료제공자의 행동과\n태도에 대한 측정을 의미한다. 과정지표는 의료팀원에 의한\n대상자와의 대면 및 대화를 포함하고, 인과관계에 있는\n중재와 결과 사이를 밝히는 데 필요한 요소를 의미한다.\n반면, 구조지표는 간호전달 과정에서 사용된 인력, 장비 ,\n다른 자원들을 측정한다. 구조지표에 대한 예로 전문간호사와\n총 간호사의 비율, 간호사-환자 비율, 각환자당 간호시간이\n있다."},{"id":"c01-q053","chapterId":1,"number":53,"page":20,"stem":"중환자실 전문간호사는 전문간호사의 특성과 역할을 규명하기 위한 연구를 수행하고자\n한다. 본 기초 연구를 통해 간호전달 결과에 직 •간접적으로 영향을 주는 전문간호사의\n역할을 명확히 하는 데 도움을 주고자 한다. 이는 다음 중 어떠한 연구영역에 해당하는\nフト？","choices":["역할 기술 연구","수행향상 연구","질병관리활동 연구","간호전달 과정 연구","역할 인식/수용 연구"],"answer":1,"answerLabel":"①","answerPage":308,"explanation":"역할 기술 연구는 전문간호사의 직업특성과 역할을\n설명하고 정의하는 것을 중점으로 한다. 즉, 연구들이\n제공하는 것은 진보적 간호실무자의 특성 혹은 전문간호사\n역할의 한부분이 간호전달결과에 기여를 한다는 것에 대한\n이론적 발전을 이끌어 내기 위한 증거로 이용될 수 있다."},{"id":"c01-q054","chapterId":1,"number":54,"page":20,"stem":"당신은 질 향상 활동의 일환으로 중환자실 간호사들의 환자안전 활동을 모니터하는 중이\n다. 간호사의 환자안전에 대한 평가표를 작성하던 중 일부 간호사들이 지침을 지키지 않\n는 것을 직접 목격하였다 이때 취할 수 있는 행동으로 적절한 것은?","choices":["개인적으로 면담을 하여 주의를 준다.","해당 병동의 수간호사에게 즉각 알린다","무엇이 잘못 되었는지 즉시 알려 수정하도록 한다.","해당 병동의 간호사들을 대상으로 지침을 재교육한다","일단 모니터링을 진행하고 결과를 분석 후 개선방안을 강구한다."],"answer":5,"answerLabel":"⑤","answerPage":308,"explanation":"질 향상 활동은 보다 나은 질적 서비스를 제공하기 위한\n활동이라 할 수 있다. 이를 위해서는 문제의 원인과 관련요인을\n규명하고 효과적인 개선과제를 찾아야 한다."},{"id":"c01-q055","chapterId":1,"number":55,"page":21,"stem":"중환자 전문간호사가 수술을 거부하고 있는 환자를 만났다. 이때 취할 수 있는 행동으로\n적절한 것은?","choices":["의사에게 이 사실을 즉각 알린다.","환자에게 압력을 가할 수 있도록 가족들과 논의한다.","환자의 의견을 적극 수용하여 수술을 하지 않게 돕는다.","환자가 수술을 거부하는 이유에 대해 환자와 진지하게 이야기를 나눈다.","수술하지 않으면 죽을 수 있으니 어리석은 결정을 하지 않도록 조언한다"],"answer":4,"answerLabel":"④","answerPage":308,"explanation":"전문간호사는 환자의 질병에 대한 경험을 이해하는 데\n도움이 될 정보를 얻어낼 뿐만 아니라 환자가 자신의 질환을\n어떻게 관리할지에 대한 결정에 참여하도록 격려한다. 이렇듯\n전문간호사는 환자와 치료적 동반자 관계를 형성하는 것이\n중요하다."},{"id":"c01-q056","chapterId":1,"number":56,"page":21,"stem":"역할 내부의 마찰로서 소아과 환자가 다수를 차지하는 소아 중환자실에 근무하도록 고용\n된 성인 전문간호사가 경험하게 되는 역할 개념은?","choices":["역할 긴장","역할 모호","역할 모순","역할 갈등","역할 스트레스"],"answer":3,"answerLabel":"③","answerPage":308,"explanation":"역할 모순은 기술 및 능력과 역할의무가 비양립적인\n혹은 개인적 가치 및 자아와 역할의무가 비양립적인 역할을\n의미한다."},{"id":"c01-q057","chapterId":1,"number":57,"page":21,"stem":"30세 남자가 바이러스성 폐렴으로 중환자실에 입원하였다. 입원기간 중 HIV 검사가 시행\n되었으며 양성으로 판명되었다. 그는 부인에게 말하기를 거절하며, 전문간호사에게 절대\n알리지 말 것을 당부했다. 이때 취할 수 있는 행동으로 적절한 것은?","choices":["부인에게 곧장 사실을 알린다.","환자가 부인에게 알릴 때까지 모른척한다.","관할 보건소에 연락하여 부인에게 알리도록 한다.","부인이 있는 상태에서 환자에게 검사결과를 설명한다.","환자에게 부인에게 알리는 것의 중요성을 설명하고 지지해준다."],"answer":5,"answerLabel":"⑤","answerPage":308,"explanation":"전문간호사는 환자의 질병에 대한 경험을 이해하는 데\n도움이 될 정보를 얻어낼 뿐만 아니라 환자가 자신의 질환을\n어떻게 관리할지에 대한 결정에 참여하도록 격려한다. 이렇듯\n전문간호사는 환자와 치료적 동반자 관계를 형성하는 것이\n중요하다."},{"id":"c01-q058","chapterId":1,"number":58,"page":21,"stem":"다음 중 효과적인 협력의 특성에 해당하는 것은?","choices":["개인의 이득","독단적 리더십","신뢰와 상호배타","효과적인 의사소통","다양한 문화, 지식, 기술의 배척"],"answer":4,"answerLabel":"④","answerPage":308,"explanation":"협력의 필수 특성은 임상적 역량 및 책임, 공통 목적,\n대인 관계 능력 및 효과적인 의사소통, 신뢰, 상호존중,\n다양하고 상호 보완적인 지식과 기술의 인정과 가치 평가,\n유머가 포함된다"},{"id":"c01-q059","chapterId":1,"number":59,"page":21,"stem":"다음 중 성공적인 협력을 위한 전략에 해당하는 것은?","choices":["당신은 틀렸다는 말을 자주하도록 한다.","자신의 말에 즉각 동의해 줄 것을 강요한다.","상대방의 관점을 이해하는 것은 불필요하다.","공통의 목표보다 개인의 이득이 우선시되어야 한다.","협상이 여러 상호작용을 통해 발생할 수 있음을 알아야 한다"],"answer":5,"answerLabel":"⑤","answerPage":308,"explanation":"협력의 필수 특성은 임상적 역량 및 책임, 공통 목적,\n대인 관계 능력 및 효과적인 의사소통, 신뢰, 상호존중,\n다양하고 상호 보완적인 지식과 기술의 인정과 가치 평가,\n유머가 포함된다."},{"id":"c01-q060","chapterId":1,"number":60,"page":22,"stem":"다음 중 사례관리의 특성에 해당하는 것은?","choices":["병원에서 사례관리의 주체는 의사이다.","사례관리는 전문간호사의 핵심적인 역할이다.","사례관리의 주요 목표는 환자의 재원일수 감소이다.","사례관리는 진료의 질보다는 비용감소에 목표를 두고 있다.","사례관리는 단절된 건강관리 체계 내에서만 운영이 가능하다."],"answer":2,"answerLabel":"②","answerPage":308,"explanation":"사례관리는 진료의 질을 높이고 재원일수 감소를 통해\n비용효과를 얻고자 한다. 또한 이는 건강관리 체계 내에서\n연속성 있는 서비스의 제공을 목표로 한다. 사례관리는\n전문간호사에게 갈수록 강조되는 역할 중 하나이다."},{"id":"c01-q061","chapterId":1,"number":61,"page":22,"stem":"최근 전문간호사에게 근거기반실무(Evidence Based Practice； EBP) 를 바탕으로 한 연\n구자로서의 역할이 강조되고 있다. 다음 중 근거기반실무의 단계로 적절한 것은?","choices":["비평적 분석一임상질문一근거검색一평가一실무적용","임상질문一근거검색一비평적 분석一평가一실무적용","근거검색一임상질문一비평적 분석一평가一실무적용","임상질문一근거검색一비평적 분석一실무적용一평가","근거검색一임상질문一비평적 분석一실무적용一평가"],"answer":4,"answerLabel":"④","answerPage":308,"explanation":"근フI기반실무(Evidence Based Practice； EBP) 란 개별\n환자간호를 결정할 때, 명백하고 신뢰성 있는 최신의 연구기반\n근거를 사용하는 것을 말하며, 최근 전문간호사들에게\n근거기반실무를 수행하기 위한 연구역량 강화가 요구된다."},{"id":"c01-q062","chapterId":1,"number":62,"page":22,"stem":"중환자 전문간호사인 당신은 중환자실의 낙상예방과 관련한 최상의 근거를 찾고 있는 간\n호사를 돕고자 한다. 다음 중 가장 높은 강도의 근거를 제공하는 연구는?","choices":["사례 연구","코호트 연구","전문가의 의견","체계적 문헌고찰","환자-대조군 연구"],"answer":4,"answerLabel":"④","answerPage":308,"explanation":"근거피라미드(Levels of Evidence에서 가장 높은\n강도의 근거에 해당하는 것은 체계적 문헌고찰 연구이며,\n전문가의 의견이 가장 낮은 단계에 속한다."},{"id":"c01-q063","chapterId":1,"number":63,"page":22,"stem":"행정가의 관리과정 역할 중 특정 부서나 서비스 분야의 이익을 위해 가장 효과적인 행동\n결정이나 사업 결정에 영향을 미칠 미래의 사건이나 경향을 예측 의사결정 과정과 조직\n의 목적을 규명하고 그에 따르도록 하는 기술은 어떤 행위인가?","choices":["기획 (Planning)","조정 (Coordinating)","인력관리(Staffing)","지휘(Directing)","통제 (Controlling)"],"answer":1,"answerLabel":"①","answerPage":308,"explanation":"관리과정에서 기획은 해당 부서의 시간과 자원의 소비를\n효과적으로 관리하여 원하는 성과를 성취하도록 하는 방안을\n예측하고, 이에 대한 목적을 명시하고 이를 추진하는 방법을\n기술하는 것이다."},{"id":"c01-q064","chapterId":1,"number":64,"page":22,"stem":"다음 행정가의 관리행위 중 기획행위에 적절한 관리 기술은 어떤 것인가?","choices":["중환자실 병동 운영에 필요한 예산의 확보","내과계 중환자실장을 만나 직원들의 업무 수행상 문제점을 토의","제안된 새로운 임상실험연구가 기관의 자원에 미칠 영향을 평가","안위간호수행 향상에 대한 책임을 전문간호사에서 경력간호사에게 위임","새로 마련된 심장내과중환자 병동 간호 조정자 직위의 업무 규정 개발"],"answer":4,"answerLabel":"④","answerPage":308,"explanation":"기획은 조직의 자원과 시간을 효율적으로 효과적으로\n관리하여 원하는 성과를 성취하도록 하는 행위이다. ①은\n지휘, ②는 통제, ③은 지휘, ⑤는 인력관리에 해당한다."},{"id":"c01-q065","chapterId":1,"number":65,"page":23,"stem":"다음 행정가의 관리행위 중 인력관리에 적절한 관리 기술은?","choices":["심혈관 질환 조기발견 프로그램에 참여하도록 해당 부서 직원들의 흥미를 유발","새로운 통증 조절법에 대한 거부감에 대해 다학제적 토의 시간 마련","기계환기를 받는 환자들에게 배치될 간호사가 지녀야 할 역랑 열거","중환자 인권 위원회를 구성하도록 의장과 주요 구성원들에게 제안","말기 환자에게 항암요법 투약 행위가 기관의 표준에 부합하는지를 관찰"],"answer":3,"answerLabel":"③","answerPage":308,"explanation":"인력관리는 직원을 채용하고 업무 분담을 하는 체계와\n구조를 설립하여 직원의 근무 스케쥴을 결정하고 수정한다.\n①과 ②는 기회 ④는 조정, ⑤는 통제에 해당한다."},{"id":"c01-q066","chapterId":1,"number":66,"page":23,"stem":"소아중환자실의 별도 운영이 결정되었기에, 이 계획을 추진하기 위해서 소아중환자실에\n근무할 직원이 얼마나 필요한가를 판단해야 한다. 이때 가장 필요한 자료는?","choices":["가용 직원 수 스케줄링 방식","환자의 유형과 수 중증도, 제공할 간호의 복잡성","직원의 교육배경, 경험, 전문간호사 자격증 소유 여부","환자의 입원기간, 합병증 발생률","교대근무시간 선호도, 밤번 전담간호사 수"],"answer":2,"answerLabel":"②","answerPage":308,"explanation":"해당 부서에서 일할 직원의 수, 단계, 종류를 예상하기\n위해서는 서비스를 제공하게 될 환자의 수, 단계, 유형과\n제공할 간호의 복잡성을 알아야 한다."},{"id":"c01-q067","chapterId":1,"number":67,"page":23,"stem":"새로운 팀을 형성할 때 이 팀이 방해를 받지 않도록 하거나 방해를 최소화하기 위해서 반\n드시 사정할 내용은?","choices":["팀 내 개인 구성원의 역할과 상호관계 유형","개인 구성원이 과거에 소속해 있던 팀의 성과","개인 구성원의 업무량과 스케줄","팀 성공 가능성에 대한 팀 내외의 인지도","특정 임상기술과 흥미의 정도"],"answer":5,"answerLabel":"⑤","answerPage":308,"explanation":"팀의 성격, 개인 구성원의 역할과 상호관계 유형, 팀 내\n의사소통 방식을 사정하는 것은 필수이다."},{"id":"c01-q068","chapterId":1,"number":68,"page":23,"stem":"전문간호사가 새로운 세팅에 필요한 장비와 소모품을 확인하는데 사용할 수 있는 방법으\n로 적절하지 않은 것은?","choices":["필요한 장비를 보고하는 근거기반 가이드라인 사용","전문간호사의 과거 경험에 의존하여 물품을 확인","필요한 장비를 나열한 임상절차 매뉴얼을 참조","표준화된 장비목록을 참조","동일하거나 유사 업무를 수행하는 타 의료인과 면담하여 확인"],"answer":2,"answerLabel":"②","answerPage":308,"explanation":"필요로 하는 장비와 소모품은 전문간호사의 전문성,\n가이드라인, 매뉴얼, 표준장비 목록, 타의료인과의 협조를\n통해 확인하는 것이 가장 비용 효율적이다."},{"id":"c01-q069","chapterId":1,"number":69,"page":23,"stem":"대부분의 기관에서 환자 관리와 보험료 청구를 관리하기 위해 전산시스템을 사용한다. 이\n러한 정보 관리에 있어 전문간호사가 반드시 지켜야 할 사항은?","choices":["개인 정보의 보호와 비밀보장","정보의 전달 매체 증가","정보의 검색식 이용","정보의 접근성 용이","대용량 서버"],"answer":5,"answerLabel":"⑤","answerPage":308,"explanation":"의료인으로서 지켜야 할 윤리 중 개인정보 보호와\n비밀보장은 필수 사항이다."},{"id":"c01-q070","chapterId":1,"number":70,"page":24,"stem":"사업프로그램 계획 시 예산을 고려할 때 수입에 포함되는 항목으로 적절하지 않은 것은?","choices":["예상 수입금","창업 대출금","지속적인 자원-환자가 내는 진료비","건강보험 공단으로부터 환급금","사업 참여 직원의 월급"],"answer":5,"answerLabel":"⑤","answerPage":309,"explanation":"예산에는 예상 수입, 창업 자본으로 대출금 또는 보조금,\n지속적인 자본으로 환자로부터 받는 진료비 , 국민건강보험\n또는 장기요양보험에서 오는 환급금이 포함된다."},{"id":"c01-q071","chapterId":1,"number":71,"page":24,"stem":"전문간호서비스를 제공함에 있어 휴대폰이나 태블릿pc와 같은 휴대용 정보관리 장치를 사\n용한다 이러한 휴대용 기기가 전문간호사의 정보관리에 미치는 가장 큰 이익은?","choices":["환자의 정보에 접근할 수 있다.","업데이트된 정보 이용으로 오류를 줄여준다.","젊은 간호사일수록 기계 이해 속도가 빠르다.","개인적 용도의 소통 수단으로 사용이 가능하다.","환자 간호시 필요로 하는 전산기계의 무게가 줄어든다."],"answer":5,"answerLabel":"⑤","answerPage":309,"explanation":"휴대용 장치들은 환자 간호 시 정보에 접근하는 시간을\n줄이고, 나아가 업데이트된 정보 이용을 통해 오류를\n줄여주고, 간호를 계획할 수 있는 시간을 증가시켜 서비스를\n향상시킨다."},{"id":"c01-q072","chapterId":1,"number":72,"page":24,"stem":"의료인 간 협동은 전문간호사의 업무 성과를 높이는데 필수적이다. 다음 중 협력적 실무\n모델에 대해 가장 잘 설명한 것은?","choices":["성과를 얻기 위해서는 팀구성원을 다른 팀의 구성원으로 교체하는 것이 가능하다","의4； 전문간호사 모두 환자를 사정하고. 요구도에 따라 관리계획과 수행까지 함께 한다","의사와 간호사가 맡은 개개인의 역할을 각자 수행하는 것이다.","전문간호사의 역할과 실무 영역은 협력하는 의사의 선호도, 요구도 및 실무 형태에 기초한다.","각 업무 영역에 보완적 파트너로 역할을 수행한다."],"answer":2,"answerLabel":"②","answerPage":309,"explanation":"협력적 실무모델의 핵심은 케어 제공 시 환자의 필요가\n최우선이어야 하는 것이 원칙이다."},{"id":"c01-q073","chapterId":1,"number":73,"page":24,"stem":"전문간호사의 역할 중 관리는 조직의 목적 달성에 필요한 인적 물적 자원을 조달하고 조\n정하는 행위를 말한다. 다음 중 관리 과정에 속하는 역할에서 제외되는 것은?","choices":["기획","조직/조정","인력관리","지휘","교육"],"answer":5,"answerLabel":"⑤","answerPage":309,"explanation":"관리의 주요 과정에는 기획, 조직, 인력관리, 지위,\n조정 그리고 통제가 있다."},{"id":"c01-q074","chapterId":1,"number":74,"page":24,"stem":"전문간호사가 상급간호실무를 수행하고 이를 통해 획득한 성과를 기록하는 것은 매우 중\n요하다. 다음 중 기대하는 간호성과에서 제외되는 것은?","choices":["대상자에게 합병증 발생률을 낮춘다.","대상자와 가족의 만족도를 높인다.","병원의 입원 횟수를 낮춘다.","병원에서의 재원기간을 줄인다.","대상자의 약물복용 이행이 증가한다."],"answer":5,"answerLabel":"⑤","answerPage":309,"explanation":"상급간호실무는 대상자의 합병증을 낮추고, 대상자와\n가족의 만족도를 높이며, 재원기간을 줄여주고, 약물복용\n이행을 증진시킨다."},{"id":"c01-q075","chapterId":1,"number":75,"page":25,"stem":"전문간호사가 지속적인 질 향상(continuous quality improvement)을 수행할 때 도달 가\n능한 목표에서 제외되는 것은?","choices":["전문간호사의 과실 위험 감소","적절한 진단과 치료 중재 수행 보장","환자 간호 성과를 평가하는 도구 제시","환자 챠트에 간호수행 기록의 향상","전문간호사의 실무능력 강화"],"answer":2,"answerLabel":"②","answerPage":309,"explanation":"지속적인 질 향상이 대상자의 진단이나 치료를보장하지는\n않는다, 대신 최상의 실무 수행과 기록을 할 수 있게 함으로써\n전문간호사의 과실은 낮추고 대상자 성과는 높이는 결과를\n가져온다."},{"id":"c01-q076","chapterId":1,"number":76,"page":25,"stem":"실무의 질 향상을 위해 수행하는 연구자로서의 전문간호사 역할로 적절한 것은?","choices":["실무에 필요한 자료를 수집하는 역할에만 참여","실무에서 연구수행, 평가와 비평 및 연구 활용까지 참여","실무에서 대상자 전문간호가 우선이므로 연구는 차선으로 고려","실무 문제를 해결하고자 연구 활용 과정에만 참여","팀원의 간호 행위가 차이가 있는 이유를 탐색"],"answer":2,"answerLabel":"②","answerPage":309,"explanation":"전문간호사는 연구과정에 참여하고, 연구 평가 및\n비평, 활용 및 확산에까지 광범위한 연구과정에 모두\n참여한다."},{"id":"c01-q077","chapterId":1,"number":77,"page":25,"stem":"전문간호사의 역할을 마케팅할 때 관련된 활동 시 고려할 사항으로 올바른 것은?","choices":["지역사회 건강봉사 활동에 전문간호사로써 참여 제한","전문간호사가 의사와 다른 역할을 한다는 브로셔 배포","환자를 만날 때 환자 간호 질 향상을 위한 전문간호사임을 밝히기","간호학 학술대회에서 자신의 직무를 전문간호사로 밝히기","타부서 직원들에게 전문간호사의 자격과 역할을 알리기"],"answer":3,"answerLabel":"③","answerPage":309,"explanation":"마케팅에는 내가 누구이고, 무슨 일을 하는가를 전달하는\n것이 기본이다. 자신을 전문간호사로 밝히고 대상자를 위해\n무슨 일을 하는지를 설명한다."},{"id":"c01-q078","chapterId":1,"number":78,"page":25,"stem":"병동 담당 전문간호사로 발령 받고 환자 교육을 향상하고자 지속적인 노력을 하라는 직\n무를 받았다. 다음 중 어떤 역할을 요구하는 것인가?","choices":["상담","교육","임상 경로 개발","질 향상","관리"],"answer":4,"answerLabel":"④","answerPage":309,"explanation":"병동의 효율성과 결과를 높이고자, 지속적인 질 향상\n또는 과정 향상을 위한 직무를 수행한다."},{"id":"c01-q079","chapterId":1,"number":79,"page":25,"stem":"상담가가 전문화된 지식을 가지고 있다고 인정되는 두 전문가 사이의 상호작용을 무엇이\n라 하는가?","choices":["의뢰 (referral)","교육(education)","협력 (collaboration)","상담자문(consultation)","공동관리 (comanagement)"],"answer":4,"answerLabel":"④","answerPage":309,"explanation":"상담자문, 공동관리, 협력, 의뢰는 비슷한 의미를 가진\n용어로 자주 서로 통용되어 사용된다. 이들 4가지 용어\n사이의 미묘한 차이들을 정확히 이해하는 것이 중요하다."},{"id":"c01-q080","chapterId":1,"number":80,"page":26,"stem":"다음 중 상담자문의 원칙에 해당하는 것은?","choices":["상담자문은 기록할 필요가 없다","상담가는 의뢰자에게 처방을 한다.","상담가와 의뢰자 사이의 관계는 위계적이다.","상담자문은 일반적으로 상담가에 의해 시작된다.","상담가는 상담자문 요청에 응답할 때 항상 맥락적 요인들을 고려한다."],"answer":5,"answerLabel":"⑤","answerPage":309,"explanation":"상담자문은 기록되어야 하며, 상담가는 처방하는 것이\n아니라 권장을 한다. 듈 사이의 관계는 위계적이지 않고\n협력적이며 , 상담자문은 일반적으로 의뢰자에 의해 시작된匚卜."},{"id":"c01-q081","chapterId":1,"number":81,"page":26,"stem":"환자 대상의 교육을 계획 시, 학습목표와 목적은 측정 가능한 용어로 서술되어야 하며,\n주로 어떤 사람의 행동을 서술해야 하는가?","choices":["의사","환자","간호사","환자의 가족","환자에게 의미 있는 타인"],"answer":2,"answerLabel":"②","answerPage":309,"explanation":"학습목표와 목적은 환자의 욕구를 충족시키기 위해\n간호사 및 환자에 의해 결정되어야 한다. 그들은 환자의\n배움에 대한 행동을 기술해야 한다. 환자의 중요한 타인, 즉\n가족과 간호사가 환자의 목표를 정하는데 관여할 수 있지만\n궁극적으로는 환자 자신에게 맞추어야 한다."},{"id":"c01-q082","chapterId":1,"number":82,"page":26,"stem":"전문간호사들은 환자 및 가족의 건강교육을 계획하고 수행할 때 성인학습이론을 적용한\n다. 이의 특성에 해당하는 것은?","choices":["학습 평가는 교육자만이 할 수 있다","학습자의 수동적인 활동과 개입을 강조한다.","학습목표, 내용, 방법을 교육자가 단독으로 설정한다.","교수학습방법 중 강의법이 성인학습이론에 있어 가장 효과적이다.","학습자가 자원을 확인하고 이 자원을 사용할 전략을 개발하게 한다."],"answer":5,"answerLabel":"⑤","answerPage":309,"explanation":"성인학습이란 인간이 자신의 생애 전반에 걸쳐 경험을\n지식, 태도, 가치, 정서 등과 함께 행동변화로 전환시키는\n활동을 의미하며 , 자기주도학습 등을 통해 학습자 스스로\n학습하기 위한 동기와 역량을 키워주는 것이 중요하다."},{"id":"c01-q083","chapterId":1,"number":83,"page":26,"stem":"다음 중 컴퓨터 보조학습의 특성에 해당하는 것은?","choices":["컴퓨터 이외에 한 가지 이상의 추가적인 교육매체가 필요하다.","필요장비를 갖추기 위해서는 상당한 비용과 시간이 요구된다.","학습자가 협동학습을 하는데 효과적인 학습 과정을 제공한다","학습자별로 이해도에 따라 학습속도를 조절하는 것이 가능하다.","정해진 시간에만 접속이 가능하여 학습자들의 접근성이 제한적이다."],"answer":4,"answerLabel":"④","answerPage":309,"explanation":"컴퓨터 보조학습은 컴퓨터를 활용하여 실제수업과\n유사한 과정을 컴퓨터가 제공하는 교육방법이다. 학습자\n개개인에 맞는 수준과 속도로 학습의 기회를 제공한다는\n장점이 있다."},{"id":"c01-q084","chapterId":1,"number":84,"page":26,"stem":"컴퓨터 및 정보통신기술의 교육적 활용 유형 중 수치나 문자 등의 부호데이터, 정지영상\n동영상, 음성, 음악 등 여러 가지 다른 형식의 데이터를 통합하여 제공하는 기술 또는 매\n체를 무엇이라 하는가?","choices":["이러닝","엠러닝","멀티미디어","시뮬레이션","텔레컨퍼런스"],"answer":3,"answerLabel":"③","answerPage":309,"explanation":"이러닝(e-learning)은 웹 기술과 인터넷을 이용하여\n학습을 전달하고 수행하는 것이며, 엠러닝(M니earning은\n휴대용 컴퓨터와 휴대폰과 같은 모바일 기기를 활용한\n교육방법이다. 이 방법들은 시간과 장소에 구애를 받지 않고\n개별학습이 가능하다는 장점이 있다."},{"id":"c01-q085","chapterId":1,"number":85,"page":27,"stem":"다음 중 보건교육의 정의로 적절한 것은?","choices":["보건교육은 건강증진과 동일한 개념이다.","보건교육은 질병을 예방하는 태도를 기르는 것이다.","보건교육은 대상자에게 전문 건강지식을 가르치는 것이다.","보건교육은 얻어진 지식을 비판 없이 받아들여 실천에 옮기도록 하는 것이다.","보건교육은 교육을 통해 대상자의 태도, 생각을 변화시켜 실천에 옮기도록 하는 것 이다."],"answer":5,"answerLabel":"⑤","answerPage":309,"explanation":"보건교육이란 단순히 지식을 전달하는 것이나 지식을\n가지고 있게 하는 데 그치는 것이 아니라, 건강은 자기\n스스로가 지켜야 한다는 긍정적인 태도를 가지고 올바른\n행동을 일상생활에서 습관화하도록 돕는 교육 과정이라 할\n수 있다."},{"id":"c01-q086","chapterId":1,"number":86,"page":27,"stem":"금연을 실천한 지 6개월 된 환자가 가끔 흡연을 하고 싶다는 충동은 느끼지만 예전보다\n는 흡연의 충동에 덜 빠지며 금연에 점차 자신감을 갖게 되었다. 현재 환자는 범이론적 모\n§(Trans-Theoretical Model； TTM) 의 변화단계 중 어디에 해당하는가?","choices":["계획이전단계","계획단계","준비단계","행동단계","유지단계"],"answer":4,"answerLabel":"④","answerPage":309,"explanation":"범이론적 모형은 개인이 어떻게 건강행동을 시작하고\n이를 유지하는가에 대한 행동변화의 원칙과 과정을 설명하는\n통합적 모형으로, 변화단계는 계획이전단계, 계획단계,\n준비단계, 행동단계 , 유지단계로 구성된다."},{"id":"c01-q087","chapterId":1,"number":87,"page":27,"stem":"중환자 전문간호사가 환자의 퇴원을 앞두고 보건교육을 계획하고 있다 이때 가장 먼저\n해야 할 일로 적절한 것은?","choices":["학습목표 설정","환자의 요구도 확인","학습목표의 우선순위 정하기","보건교육의 기준과 방침 확인","보건교육 내용의 선정 및 조직"],"answer":2,"answerLabel":"②","answerPage":309,"explanation":"보건교육사업의 기대효과를 높이기 위해서 교육 대상자의\n현실적인 상황이 고려된 정보에 의해 보건교육사업이\n계획되어야 한匚卜. 그러므로 보건교육사업을 계획하기 위하여\n교육 요구를 명확하게 사정하여야 한다. 따라서 보건교육을\n계획하고자 할 때 , 제일 먼저 실시해야 하는 과정은 학습자의\n요구를 사정하는 것이다."},{"id":"c01-q088","chapterId":1,"number":88,"page":27,"stem":"다음 중 학습목표를 설정할 때 고려해야 할 ‘정의적 영역의 특성에 해당하는 것은?","choices":["학습자의 행동변화와 관련된 부분이다.","학습자의 응용능력과 관련된 부분이다.","학습자의 분석능력과 관련된 부분이다.","학습자의 평가능력과 관련된 부분이다.","학습자의 태도, 느낌, 감정 등과 관련된 부분이다."],"answer":5,"answerLabel":"⑤","answerPage":309,"explanation":"학습목표는 인지적 영역, 정의적 영역, 심리운동적\n영역으로 구분할 수 있으며 , 정의적 영역은 학습자의 태도,\n느낌, 감정 등과 관련된 부분이다."},{"id":"c01-q089","chapterId":1,"number":89,"page":27,"stem":"다음 중 학습목표가 갖추어야 할 조건에 해당하는 것은?","choices":["학습목표는 직관적으로 기술되어야 한다.","학습목표는 실현 가능성이 부족해도 상관없다.","학습목표는 측정 가능성이 부족해도 상관없다","학습목표는 학습자만 명확히 이해할 수 있으면 된다.","변화하고자 하는 목적과 밀접한 관련성이 있어야 한다."],"answer":5,"answerLabel":"⑤","answerPage":309,"explanation":"학습목표는 논리적으로 기술되어야 하며, 실현가능성과\n측정 가능성이 있는 목표가 설정되어야 한다. 또한 학습목표는\n학습자나 교육자 모두가 명확히 이해하고 이에 기준하여\n교수 학습이 일어날 수 있도록 명확하게 설정되어야 한다."},{"id":"c01-q090","chapterId":1,"number":90,"page":28,"stem":"다음은 교육방법 선정에 영향을 미치는 요소들이다. 이 중 영향력이 가장 적은 요인은?","choices":["교육일자","교육 대상자의 수","학습목표의 난이도","교육실시 장소 및 시설","교육 참여자들의 교육수준"],"answer":1,"answerLabel":"①","answerPage":309,"explanation":"교육방법 선정은 교육으로 도달하여야 할 학습목표가\n무엇인지 , 그 학습목표의 난이도는 얼마나 복잡한 것인지를\n먼저 알아야 한다. 다음으로는 교육에 참여하는 대상자의\n수가 몇 명이지를 고려하여야 하며 , 그 이외에 대상자의\n교육배경과 학습장소의 시설 등이 고려되어야 한다."},{"id":"c01-q091","chapterId":1,"number":91,"page":28,"stem":"교육평가방법 중 교육이 시작되기 전 교육 대상인 학습자의 준비도를 알아보기 위한 평\n가는?","choices":["형성평가","진단평가","종합평가","절대평가","상대평가"],"answer":2,"answerLabel":"②","answerPage":309,"explanation":"진단평가란 교육이 시작되기 전에 교육 대상자들의\n교육에 대한 이해도와 사전 측정 목적으로 시도되기도 하며 ,\n또한 교육계획 수립 시에 무엇을 교육할 것인가를 알아보기\n위한 목적으로도 활용된다"},{"id":"c01-q092","chapterId":1,"number":92,"page":28,"stem":"전문간호사가 병동 신규간호사를 교육하고자 프리셉터 프로그램을 기획할 때, 프리셉터\n방식에 대해 올바르게 설명한 것은?","choices":["프리셉터는 경험있는 실무자와 초보자가 일대일로, 장기간 계약하는 공식적인 관계 이다","전문간호사는 프리셉터 프로그램에서 프리셉터의 기능은 수행하지 않는다.","프리셉터를 선택하고 훈련을 조정하며 오리엔테이션 목적과 목표를 설정한다.","오리엔테션을 받는 신규 간호사는 평가하되, 프리셉터는 평가하지 않는다.","프리셉터는 각 상황에 대한 직감력이 뛰어난 사람이 우선 선발된다."],"answer":3,"answerLabel":"③","answerPage":310,"explanation":"프리셉터는 경험 있는 실무자와 초보자가 일대일,\n단기간 계약하는 공식적 관계이다. 전문간호사는 프리셉터\n프로그램을 기획하고, 프리셉터로서 기능도 하며 , 프리셉터\n선발과 훈련 및 평가과정에 참여한다."},{"id":"c01-q093","chapterId":1,"number":93,"page":28,"stem":"프리셉터 역할을 수행할 간호사를 선택할 때 고려할 요인에서 제외되는 것은?","choices":["의사소통 능력","대인관계 능력","가르치는 것에 대한 흥미","전문직 발전에 헌신적","학위과정 여부"],"answer":5,"answerLabel":"⑤","answerPage":310,"explanation":"프리셉터로 발탁되는 간호사는 충분한 경험, 자신의\n분야에서 뛰어나고 전문직 발전에 헌신적이어야 한다. 또한\n고도의 의사소통 능력, 조직력, 대인관계 능력을 보여야\n하고, 문화적 차이에 민감하고, 학습을 위한 지지적 환경을\n조성한다. 가르치는 것에 흥미가 있고 자발적인 사람이\n선발되어야한다."},{"id":"c01-q094","chapterId":1,"number":94,"page":28,"stem":"간호사 교육 시 사용하는 학습전략 중에서 컴퓨터 보조교육의 특징을 올바르게 설명한\n것은?","choices":["강사 1 인이 다수 학습자를 상대로 컴퓨터를 이용하여 교육한다.","학습자와 컴퓨터가 상호작용하며 학습한다.","강의실 환경과 시간 및 강사의 질이 중요하다.","해당 분야 전문가의 견해를 수용하는 기회이다.","경력자의 시범을 바탕으로 해당 역할을 배워간다."],"answer":2,"answerLabel":"②","answerPage":310,"explanation":"교육 전략에는 강의 이외에 그룹토론, 역할 모델링,\n시연법, 사전 자율학습을 통해 학습효과를 올릴 수 있다.\n또한 컴퓨터 보조교육computer assisted instruction)은\n학습자와 컴퓨터가 상호작용을 하며, 교사는 학습의\n보조자이자 조력자 역할을 한다."},{"id":"c01-q095","chapterId":1,"number":95,"page":29,"stem":"퇴원을 앞둔 대상자에게 퇴원 간호교육을 웹기반 교육프로그램을 이용하여 10분간 수행\n하였다. 교육을 제공한 후, 대상자의 교육목표 달성도를 평가하는 효율적인 방법은?","choices":["다지선다형 테스트","수행 체크리스트","시범 보이기","그룹토의 평가","기술 시뮬레이션"],"answer":1,"answerLabel":"①","answerPage":310,"explanation":"교육과정의 평가는 학습목표 달성이 되고 있는가를\n다양한 평가 전략을 이용하여 얻어진 결과이다. 주관식 또는\n다지선다형 시험, 수행 체크리스트, 재연(return\ndemonstration) 등은 학습목표에 맞게 선택하고, 사전에\n기획되어야한다."},{"id":"c01-q096","chapterId":1,"number":96,"page":29,"stem":"전문간호사는 신입간호사를 위한 4주 프리셉터 프로그램을 기획하여 운영하려고 한다. 이\n때 매주 평가를 통해 간호사의 성취도가 얼마나 향상되었는지 성찰하고, 프로그램 내용의\n피드백을 받아 개선점을 도출하여 다음 교육에 반영하려고 한다 이러한 평가전략은?","choices":["총괄 평가","형성 평가","구조화된 평가","임상수행 평가","상대 평가"],"answer":2,"answerLabel":"②","answerPage":310,"explanation":"교육을 기획할 때 교육 평가 전략을 미리 수립해야\n한다. 형성평가는 학습 중간에 학습효과를 파악하기 위해\n또는 피드백을 위해 수행하는 방법이다. 반면 총괄평가는\n과정이나 프로그램 완료 후 학습성과를 평가하는 방법이다."},{"id":"c01-q097","chapterId":1,"number":97,"page":29,"stem":"대상자에게 hiv 예방과 같은 예방적 건강행위를 수행할 수 있도록 교육할 때, 프로그램\n의 이론적 기틀과 교육 콘텐츠를 건강신념모델에 근거하여 구성하려고 한다. 교육내용에\n포함되어야 하는 개념에 해당되지 않는 것은?","choices":["해당 질병의 민감성","해당 질병의 심각성","건강관리 행위의 유익성","건강관리 행위의 장애성","건강관리 행위에 대한 통제력"],"answer":5,"answerLabel":"⑤","answerPage":310,"explanation":"건강신념 모델은 건강행위를 수행할 준비에 관한\n예측이론으로 많이 사용된다. 이 모델은 질병의 민감성,\n심각성, 위협성에 대한 개인의 신념뿐 아니라, 건강관리\n행위에 대한 유익성과 장애성에 대한 신념에 근거한다. 최근에\n추가된 건강동기와 자기 효능감은 건강행위 실천을 높이는\n개념으로 중요도가 높다."},{"id":"c01-q098","chapterId":1,"number":98,"page":29,"stem":"노인 대상자를 위한 안전사고 예방 교육을 계획할 때, 장애요소에서 제외되는 것은?","choices":["저하된 신경 감각 기능이 교육에의 집중을 방해한다.","시력 저하가 교육 팸플릿을 통한 학습을 방해한다.","침대난간 올리기를 반복적으로 설명해도 기억하기 어렵다.","야간 수면이 길어져서 시간과 장소 오리엔테이션의 혼란이 발생한다","병원 환경이 익숙하지 않아 손상에 대한 불안감이 높아진다."],"answer":4,"answerLabel":"④","answerPage":310,"explanation":"노인의 학습 장애요인을 확인하여 보다 효율적인 학습\n전략을 기획하고 수행해야 한다. 감소된 신체기능과 인지력\n저하 및 변화된 환경에의 미적응이 교육효과를 떨어뜨린다."},{"id":"c01-q099","chapterId":1,"number":99,"page":30,"stem":"지역사회에서 CABG 수술 후 퇴원한 노인 환자를 위한 교육 프로젝트를 효율적으로 수\n행하기 위한 전략으로 적절한 것은?","choices":["지역사회 TV 방송을 이용하여 교육을 실시한다.","가가호호 방문을 통해 개별 교육을 실시한다","이동식 교육 차량에서 교육을 매시간 실시한다","노인들이 모이기 쉬운 노인정에서 교육을 여러 번 실시한다.","당사자 보다는 가족을 대상으로 교육을 실시한다."],"answer":4,"answerLabel":"④","answerPage":310,"explanation":"지역사회 특성과 노인의 생활양식에 맞는 창의적인\n교육프로그램을 제공한다. 낮시간에 제공하고 , 교통수단의\n제약없이 쉽게 접근 가능한 노인정, 공공시설을 활용한다.\n안전하고 편안한 장소에서 실시하고, 반복교육을 통해 교육의\n효과를 높인다."},{"id":"c01-q100","chapterId":1,"number":100,"page":30,"stem":"환자 보호자가 만성 질환을 가진 어머니를 장기간 돌보면서 신체적, 심리적, 재정적 부담\n이 크고, 가족 내 의사소통의 문제와 갈등이 커지고 있다고 호소한다 이러한 교육 요구를\n충족시키기 위한 교육전략으로 가장 적합한 것은?","choices":["질병 관련 정서반응 설명","역할극","역할 모델링","효과적인 의사소통 강의","가족들과 개별 면담과 경청"],"answer":2,"answerLabel":"②","answerPage":310,"explanation":"역할극을 통해 상대방의 입장을 이해하고 효율적인\n의사소통과 문제해결 방식을 학습할 수 있다.\n정답및애설 I 310"}]},{"id":2,"part":"PART I","partTitle":"공통영역","title":"병태생리","count":100,"startPage":31,"endPage":52,"questions":[{"id":"c02-q001","chapterId":2,"number":1,"page":31,"stem":"세포손상을 일으키는 가장 흔한 원인은?","choices":["세포의 저산소증(산소결핍)","영양결핍","세균, 바이러스, 진균 등의 생물학적 요인","유전성 인자","자외선, 방사선 등의 물리적 인자"],"answer":1,"answerLabel":"①","answerPage":311,"explanation":"세포에 공급되는 산소가 감소되는 세포의 저산소증은\n세포손상을 유발하는 가장 흔하고 중요한 원인으로서 ,\n세포에 산소공급이 중단되거나 감소되면 산화적 인산화가\n억제되어 세포손상이 일어난다."},{"id":"c02-q002","chapterId":2,"number":2,"page":31,"stem":"저산소증으로 인한 세포손상 시 세포에 나타나는 변화로 옳은 것은?","choices":["세포호흡기관인 사립체(mitochondria)가 제일 먼저 손상을 받는다.","세포 내 pH가 올라간다","ATP 생성 감소로 세포내 수분이 감소한다.","용해소체 (lysosome)가 수축된다.","세포내 나트륨과 칼륨의 농도가 증가한다."],"answer":1,"answerLabel":"①","answerPage":311,"explanation":"산소결핍으로 인한 세포손상 시 가장 먼저 사립체가\n손상을 받게 되며, 그 결과 에너지 공급원인 ATP 생성이\n저하되어 나트륨-칼륨 펌프의 기능이 정지된다. 이로 인해\n세포내에 나트륨이 축적되고 칼륨은 상실되어 세포는\n팽창하게 된다. 또한 세포는 포도당을 사용하여 에너지원을\n만들게 되며, 세포내 젖산이 축적되어 세포 내 pH가\n저하된다."},{"id":"c02-q003","chapterId":2,"number":3,"page":31,"stem":"자극이 약하고 지속시간이 짧은 경우 수분과 이온이 손상된 막을 통하여 세포 내로 유입\n되는 가역적 손상의 한 형태는?","choices":["지방변성","세포종창","액화괴사","건락괴사","유리질 변성"],"answer":2,"answerLabel":"②","answerPage":311,"explanation":"세포종창은 손상된 세포에서 가장 먼저 나타나는 손상의\n형태로서, 수분과 이온이 손상된 막을 통해 세포 내로\n유입되면 그 기관은 무게가 증가되고 경직되며 창백해진다.\n수분이 세포 내로 유입되면 세포질에 작은 공포들이\n나타나는데 , 이를 수포성 변화(hydropic change) 혹은\n공포 변서vacuolar degeneration)이라 한다. 지방 변성은\n세포에 트리글리세리드가 축적되어 일어난다. 유리질 변성은\n주로 단백질 축적에 의해 발생한다."},{"id":"c02-q004","chapterId":2,"number":4,"page":32,"stem":"세포 자신의 핵내 DNA 와 핵과 세포질 안의 단백질을 파괴하는 과정으로, 세포막의 손상\n보다 선행하여 일어나는 과정은?","choices":["급성 염증반응","유리질 변성","자가용해 (autolysis)","세포자멸사(apoptosis)","습성괴사(wet gangrene)"],"answer":4,"answerLabel":"④","answerPage":311,"explanation":"세포자멸사는 조직집단에서 세포의 수를 조절하거나(\n계획된 세포사) 조직손상과 세포증식을 억제하기 위해 일어나는\n병리적 현상이다. 자가용해는 조직이나 기관 전체가 파괴된\n후 세포질에 있는 용해소체로부터 소화효소가 방출되어\n죽은 세포를 분해하는 과정이다. 습성괴사는 괴사조직에\n세균의 감염으로 액화괴사가 일어나 세균의 증식으로 악취가\n나고 붓고, 차가우며 , 당뇨병일 때 다리 동맥의 폐쇄가 그\n예에 해당한다."},{"id":"c02-q005","chapterId":2,"number":5,"page":32,"stem":"세포자멸사의 형태학적 소견으로 옳은 것은?","choices":["세포의 크기가 커지며 세포질이 얇아진다.","염색질이 핵막 주변에서 멀리 흩어진다.","자멸사체는 강한 호염기성의 물질이다.","자멸사가 일어난 세포와 자멸사체는 대식세포 등에 의해 포식된 후 용해소체에 의 해 분해된다.","자멸사가 활발하게 일어날 때 자멸사체를 관찰하기 쉽다."],"answer":4,"answerLabel":"④","answerPage":311,"explanation":"세포자멸사의 가장 특징적인 소견으로 염색질이\n핵막주변으로 응집하고, 여러 모양과 크기를 가진 작은\n덩어리로 변한다. 자멸사를 일으킨 세포는 처음에는 표면에\n소포를 형성하지만, 차츰 분절되어 막으로 싸인 자멸사체를\n만든다. 자멸사체는 호산성을 띄며 , 실질세포나 대식세포\n등 이웃세포에 의해 포식된 후 용해소체에 의해 분해된다.\n자멸사가 일어난 세포와 자멸사체는 포식으로 빨리\n처리되므로 관찰하기가 어렵다."},{"id":"c02-q006","chapterId":2,"number":6,"page":32,"stem":"세포자멸사의 조절에 이상이 생길 경우 발생하는 질병은?","choices":["악성종양","폐렴","심부전증","ス방증 (steatosis)","홍역"],"answer":1,"answerLabel":"①","answerPage":311,"explanation":"정상적으로 세포가 복구 불가능한 상태로 손상된 경우\n세포자멸사의 기전이 작동하도록 되어 있으나, 악성종양은\n이 기전이 작동하지 않기 때문에 발생한다. 지방증은\n지방변화를 말하는 것으로 실질세포 안에 트리글리세리드가\n비정상적으로 축적되는 현상으로 가역성 변화이며\n괴사주위의 조직에서 흔히 볼 수 있다."},{"id":"c02-q007","chapterId":2,"number":7,"page":32,"stem":"세포가 외부로부터 지속적인 자극을 받을 경우 세포의 크기와 기능이 증가하는 세포의\n적응반응은?","choices":["비대 (hypertrophy)","화생 (metaplasia)","형성이상(dysplasia)","증식 (hypertrophy)","위축(atrophy)"],"answer":1,"answerLabel":"①","answerPage":311,"explanation":"비대는 세포의 크기와 기능이 증가하는 적응반응으로\n결국 장기의 크기도 커진다. 비대는 원인에 따라 생리적\n비대와 병적 비대로 분류된匚卜. 증식은 조직과 장기가 용적을\n늘리는 경우를 말하는 것으로 세포의 비대와 동시에 일어나는\n경우가 많다."},{"id":"c02-q008","chapterId":2,"number":8,"page":32,"stem":"일정 자극이 장기간에 걸쳐 작용함으로써 정상적이었던 조직이 본래의 조직과는 다른 조\n직으로 대치되는 현상은?","choices":["비대 (hypertrophy)","화생 (metaplasia)","형성이상(dysplasia)","증식 (hypertrophy)","위축(atrophy) part I 공통영역 I 32"],"answer":2,"answerLabel":"②","answerPage":311,"explanation":"화생은 성숙세포가 다른 종류의 성숙세포로 바뀌는\n경우로서 특정자극에 대해 감수성을 가진 세포가 내성을\n갖는 세포로 바뀌는 것이다. 담배연기에 오랫동안 노출되거나\n비타민 A가 부족한 경우 기관지의 섬모성 원주상피가 자극에\n강한 편평상피로 변화한다."},{"id":"c02-q009","chapterId":2,"number":9,"page":33,"stem":"위축(atrophy)을 설명한 것으로 옳은 것은?","choices":["위축이 일어나면 세포는 자가탐식 현상이 증가하게 되어 세포자멸사가 일어난다.","위축이 일어나는 세포는 단백질 합성과 산소소비가 증가되어 세포의 분해가 빨라진다.","흉선의 위축은 영양장애로 인하여 일어난다.","압력이 국소조직에 지속적으로 가해질 때 신경성 위축이 발생한다.","위축된 세포 내에서는 결합조직이 감소하여 섬유화(fibrosis)가 나타난다."],"answer":1,"answerLabel":"①","answerPage":311,"explanation":"위축되는 세포는 아미노산의 섭취, 단백질 합성,\n산소소비가 감소되며, 주로 실질조직(parenchyme)\n세포성분이 위축되거나 감소되고 기능도 저하된다. 또한\n세포 사이에 결합조직이 증가함으로써 섬유화(fibrosis)가\n나타난다. 주로 간세포, 심장근, 골격근, 부신피질, 세뇨관\n상피, 신경세포 등에서 볼 수 있다. 흉선의 위축은 사춘기\n이후에 발생하며, 생리적 위축에 해당한다. 압박위축은\n압력이 국소조직에 지속적으로 가해질 때 발생하여\n혈액공급을 차단하고 기능을 방해하는 것으로, 종양이나\n동맥류에 의한 위축, 욕창이 이에 속한다."},{"id":"c02-q010","chapterId":2,"number":10,"page":33,"stem":"화생(metaplasia)에 대한 설명으로 옳은 것은?","choices":["자극이 제거되어도 화생상피가 정상상피로 되돌아오지 못한다.","화생성 변화를 일으키는 세포는 상피세포가 유일하다.","화생은 형태학적인 변화뿐만 아니라 세포 고유의 기능도 상실한다.","화생성 상피로 인한 암 발생의 위험성은 없다.","장상피 화생으로 인한 위 상피조직은 산에 약하다."],"answer":3,"answerLabel":"③","answerPage":311,"explanation":"화생은 일반적으로 가역적이며 자극이 제거되면\n화생상피가 정상상피로 되돌아온다. 화생은 편평상피뿐만\n아니라 중간 엽세 포에서도 발생되어 결합조직이 골조직이나\n연골조직으로 대체될 수 있다. 화생상피는 암 발생 위험이\n높다. 위점막 상피조직은 장상피화생으로 산에 강한 조직으로\n바뀐다."},{"id":"c02-q011","chapterId":2,"number":11,"page":33,"stem":"괴사(necrosis)에 대한 설명으로 옳은 것은?","choices":["외인성으로 가역적 손상 상태에서 일어난다.","단백질 변성이 우세하면 액화괴사가 일어난다.","효소성 소화가 우세하면 응고괴사가 일어난다.","응고괴사는 허혈성 손상을 받는 중추신경계에서 특징적으로 나타난다.","급성 염증반응이 나타나는 액화괴사는 죽은 백혈구의 덩어리인 농을 생성한다."],"answer":4,"answerLabel":"④","answerPage":311,"explanation":"괴사는 외인성으로 비가역적 손상을 받았을 때 발생하는\n세포사의 육안 및 현미경적 소견이다. 응고괴사는\n산소결핍으로 인해 일어나는 세포사의 변화로서 , 뇌를 제외한\n모든 조직에서 발견된다. 액화괴사는 허혈성 손상을 받는\n중추신경계에 나타나는 변화이다. 죽은 세포는 액화가\n일어나며 주위에 급성 염증반응을 동반하여 백혈구가 섞인\n노란색의 농을 형성한다."},{"id":"c02-q012","chapterId":2,"number":12,"page":33,"stem":"증식(hypertrophy)에 대한 설명으로 옳은 것은?","choices":["피부 장상피, 골수에서는 증식이 아닌 비대만 일어난다.","골격근과 심장근에서 증식이 일어난다.","부분적인 간 절제술 후 일어나는 간세포의 증식은 성장인자의 자극에 의해 일어난다.","병적 증식은 세포의 악성화로 진행되지 않는다.","외부 자극이 소실된 경우에도 증식은 지속될 수 있다."],"answer":3,"answerLabel":"③","answerPage":311,"explanation":"간 절제 후 나타나는 간세포의 재생은 대상성 증식에\n속하는 것으로 간세포나 비실질세포에서 분비된 성장인자의\n자극으로 일어나며 , 원래 크기가 되면 간세포에서 생성되는\n억제인자에 의해 증식을 멈춘다. 증식과 비대는 동시에\n일어나며, 수시로 세포의 교체가 일어나는 피부, 장상피,\n골수에서는 증식이 꾸준히 일어나고, 세포가 분열하지 않는\n신경, 심장근, 골격근에서는 증식이 일어나지 않는다. 비정상\n자궁출혈을 일으키는 자궁내막 증식증과 같은 병적증식은\n자궁내막암의 위험을 증가시키는 악성화의 전단계이다.\n증식은 외부자극이 소실된 경우 정지하여 원상태로 돌아갈\n수 있다."},{"id":"c02-q013","chapterId":2,"number":13,"page":33,"stem":"형성이상(dysplasia)에 대한 설명으로 옳은 것은?","choices":["세포의 크기와 모양은 일정하며 규칙적이다.","정상세포와 비교하여 핵의 크기가 작고 불규칙하다.","주로 기관지나 자궁경부에서는 잘 관찰되지 않는다.","전암병변으로 다단계 암 발생 과정의 필수단계이다.","손상자극을 제거하더라도 정상세포로의 회복이 비가역적이다."],"answer":4,"answerLabel":"④","answerPage":312,"explanation":"이형성은 세포의 크기, 모양, 핵의 구조가 비정상적이다.\n전암병변으로서, 다단계 암 발생 과정의 필수 단계이다.\n그러므로 암세포와 모양이 거의 비슷하여 초기암과 고등급\n이형성(형성이상) 간의 구별이 어렵다. 기관지나 자궁경부\n등과 같이 화생이 잘 나타나는 편평상피에서 흔히 관찰된匚上\n화생과 비슷하게 금연이나 사람유두종 바이러스의 제거와\n같은 지속적인 손상성 자극을 제거하면 가역적이다."},{"id":"c02-q014","chapterId":2,"number":14,"page":34,"stem":"나트륨 펌프(sodium pump)에 대한 설명으로 옳은 것은?","choices":["정상세포 안은 밖과 비교하여 교질삼투압이 낮기 때문에 나트륨 펌프 작용을 통해 나트륨의 이온농도를 조절한다.","나트륨 펌프의 이온수송 기전은 나트륨을 세포 안으로 끌어들이고, 칼륨은 밖으로 내보내는 것이다.","나트륨 펌프 작용 시 에너지로 ATP 의 20%를 사용한다.","세포의 산소결핍 시 나트륨 펌프를 이용한 이온수송의 장애가 발생한다.","산소결핍으로 인한 나트륨 펌프 장애 시 세포수축이 발생한다."],"answer":4,"answerLabel":"④","answerPage":312,"explanation":"정상세포는 바깥보다 안쪽의 단백질 농도가 높아 세포안의\n교질삼투압이 더 높다. 이를 교정하기 위해 나트륨 펌프를\n이용하여 나트륨을 세포 밖으로, 칼륨은 세포 안으로\n이온수송을 한다. 실제 세포는 나트륨 펌프 이온수송을 위해\nATP 의 50% 이상을 사용한다. 산소결핍으로 인한 세포의\nATP 감소는 나트륨 펌프의 장애를 초래하여 세포종창을\n일으킨다."},{"id":"c02-q015","chapterId":2,"number":15,"page":34,"stem":"혈전에 대한 설명으로 옳은 것은?","choices":["적색혈전은 섬유소의 응고가 일어날 때 그 안에 백혈구와 적혈구가 혼합되어 나타 나는 혈전의 형태이다.","초자혈전은 주로 혈소판의 과응고에 의해 발생하는 혈전이다.","일반적으로 혈류의 상류 방향으로 혈전 형성이 진행된다.","일반적으로 큰 혈전에서 두부는 적색, 중간부는 혼합색. 미부는 백색으로 나타난다","혈전 형성을 일으키는 가장 흔한 원인은 혈관염이다."],"answer":1,"answerLabel":"①","answerPage":312,"explanation":"혈전은 혈관 내에 혈액이 응고되는 것으로, 백색혈전,\n적색혈전 , 혼합혈전 , 초자혈전으로 구분한다. 초자혈전은\n주로 피브린의 응고에 의해 발생하는 것으로, 혈소판은 소량\n함유되어 있다. 주로 소혈관이나 모세혈관에 나타난다.\n혈전은 일반적으로 혈류의 말초방향으로 형성이 진행되며,\n큰 혈전에서는 일반적으로 형성 초기에는 백색혈전이며,\n몸통은 혼합혈전, 꼬리부분은 적색혈전으로 형성된다.\n혈전이 형성되는 조건은 혈관내피세포의 손상, 혈류의 변화,\n혈액응고능의 변화이며(Virchow의 3 가지 조건), 이중\n혈관내피손상이 가장 중요한 요인이다. 혈관내피세포의\n손상을 일으키는 가장 흔한 원인은 동맥경화증이다."},{"id":"c02-q016","chapterId":2,"number":16,"page":34,"stem":"혈액응고능의 변화로 인해 혈전을 형성하는 질환이나 상황으로 옳은 것은?","choices":["동맥류. 정맥류","피임제 복용","동맥경화증","낫혈구 적혈구빈혈","혈관염"],"answer":2,"answerLabel":"②","answerPage":312,"explanation":"혈전 형성은 동맥경화증, 혈관염과 같은 혈관내피세포의\n손상으로 인해 잘 생긴다. 또한 혈관 내에서 혈류가 천천히\n흐르거나, 정지하거나 와류 등이 생기기 쉬운 부위(동맥류,\n정맥류 정맥의 압박부위에서 잘 생긴다. 혈액응고능의 변화를\n초래하는 경우(고지혈증, 악성종양, 신증후군, 화상이나 외상,\n수술 후, 임신, 특히 태반조기박리, 피임제 복용)에도 호발한다."},{"id":"c02-q017","chapterId":2,"number":17,"page":34,"stem":"경색증(infarction)에 대한 설명으로 옳은 것은?","choices":["연결가지를 가진 작은 혈관에서 나타난다.","대부분 정맥혈관의 폐쇄에 의해 발생하며, 드물게 동맥혈관에서도 발생할 수 있다.","심장의 경색으로 인한 허혈성 괴사는 액화괴사의 형태를 취한다","허혈에 특히 취약한 조직은 신경세포. 심근세포 외에 요세관 상피세포와 비장세포 가 있다.","폐, 위장관, 난소 등에 발생하는 경색은 출혈을 동반하지 않는 백색경색이다."],"answer":4,"answerLabel":"④","answerPage":312,"explanation":"경색증은 연결가지를 가지지 않은 소동맥인 종말동맥에서\n나타난다. 드물게는 정맥의 폐쇄에 의해서도 발생한다.\n동맥경화, 동맥염, 혈전, 색전 등에 의해 폐색된 경우 그\n지배영역에 허헐성 괴사를 일으킨다. 허혈에 취약한 조직은\n신경세포 , 심근세포 , 요세관 상피세포로 심근경색 , 뇌경색,\n신장경색, 비장경색 등이 전형적인 예이다. 심장의 허혈성\n괴사는 응고괴사의 형태로, 뇌의 허혈성 괴사는 액화괴사의\n형태를 취한다. 폐, 위장관, 난소 등에 발생하는 경색은\n출혈을 동반하는 적색경색으로 특히 정맥이 폐쇄된 경우 잘\n관찰된다."},{"id":"c02-q018","chapterId":2,"number":18,"page":34,"stem":"괴사에 대한 설명으로 옳은 것은?","choices":["세포가 괴사해도 세포막의 구조는 유지된다.","괴사조직은 주위조직에 염증반응을 일으키지 않는다","효소성 소화가 우세하면 단백질 응고괴사가 일어난다.","건락괴사는 결핵감염병터에서 볼 수 있는 응고괴사의 한 형태이다.","액화괴사는 죽은 세포가 만성 염증반응으로 인해 액체로 변하는 현상이다."],"answer":4,"answerLabel":"④","answerPage":312,"explanation":"건락괴사는 응고괴사의 독특한 형태로서 결핵감염병터에서\n볼 수 있다. 결핵균의 막에 함유된 지질 다당류 때문에\n발생하는데, 괴사부위가 건락치즈)이라는 육안소견을 갖는다.\n이는 구조가 없는 과립성 부스러기로 보이며, 그 주위를\n육아종성 염증세포가 둘러싸고 있다. 세포가 괴사하면 서포막의\n구조를 유지하지 못해 내용물이 밖으로 빠져나와 주위 조직에\n염증반응을 일으킨다. 괴사는 효소성 소화가 우세하면 단백질\n응고괴사가 일어나고, 단백질 변성이 강하면 응고괴사가\n일어난다. 액화괴사는 백혈구를 강하게 유인하는 세균감염에서\n흔히 볼 수 있으며 , 급성 염증반응을 일으킨다."},{"id":"c02-q019","chapterId":2,"number":19,"page":35,"stem":"화생에 대한 설명으로 옳은 것은?","choices":["조직이 비정상적인 성장과 성숙과정을 보인다.","자극이 계속 되면 암이 발생할 수 있다.","화생성 변화는 주로 결합조직에서 발생한다.","자극을 제거해도 원래의 세포로 돌아오지 않는다.","성숙세포가 다른 종류의 미성숙 세포로 바뀐다."],"answer":2,"answerLabel":"②","answerPage":312,"explanation":"화생은 성숙세포가 다른 종류의 성숙세포로 바뀌는\n경우를 말하며, 특정 자극에 대해 감수성을 가진 세포가\n내성을 갖는 강한 세포로 바뀌는 것이다. 화생은 외부 자극을\n많이 받는 상피세포에서 주로 발생하지만 손상부위의\n결합조직이 골조직이나 연골조직으로 대체되는 것 같이\n중간옆세포에서도 발생할 수 있다. 화생은 자극을 제거하면\n정상세포로 되돌아올 수 있다."},{"id":"c02-q020","chapterId":2,"number":20,"page":35,"stem":"세포자멸사가 발생하는 상황에 해당하지 않는 것은?","choices":["고환절제술 후 전립샘의 퇴화","면역반응의 종료 후 중성구와 림프구의 제거","세포독성 T 세포에 의한 세포사","방사선 조사에 의한 DNA 손상 시 손상세포 제거","염증으로 인한 손상조직과 미생물의 제거과정"],"answer":5,"answerLabel":"⑤","answerPage":312,"explanation":"세포자멸사는 생리적 또는 병적 상태에서 불필요하거나\n위험한 세포를 제거한다. 세포자멸사는 호르몬에 의한 퇴화\n(월경주기에 따른 자궁내막세포의 파괴나 폐경기의 난소, 난포의\n퇴화, 고환절제술 후 전립샘의 퇴화 등), 소화관과 상피세포의\n수를 일정하게 유지하기 위한 증식성 세포의 제거,\n급성염증이나 면역반응의 종료 후 중성구와 림프구의 제거,\n세포독성 T세포에 의한 세포사, 바이러스성 질환에서의\n세포손상 후 감염세포의 제거, 분비관 폐쇄 후 실질세포의\n병적 위축, 종양내 세포사 등에서 관찰된다."},{"id":"c02-q021","chapterId":2,"number":21,"page":35,"stem":"급성 염증 시 혈관벽의 투과성 증가로 혈장 성분이 혈관 밖으로 삼출되어 발생하는 증\n상은?","choices":["열(heat)","발적 (rubor)","종창(swelling)","통증(pain)","기능장애(functional disturbance)"],"answer":3,"answerLabel":"③","answerPage":312,"explanation":"염증의 5 대 징후는 열발열, heat), 발적(rubor), 종창\n(swelling), 통증(pain) 및 기능장애(functional disturbance)\n이다. 이 중 종창은 염증 시 혈관의 투과성 증가로 혈장\n성분이 혈관 밖으로 삼출되어 발생한다."},{"id":"c02-q022","chapterId":2,"number":22,"page":35,"stem":"손바닥을 못에 찔린 후 손바닥에 발적(rubor)이 생겼다. 그 이유로 가장 적절한 것은?","choices":["일시적인 혈관수축","혈관확장으로 인한 혈류 증가","혈장 성분의 혈관 밖 누출","삼출물로 인한 압박","백혈구의 변연화"],"answer":2,"answerLabel":"②","answerPage":312,"explanation":"급성 염증 초기에 혈관반응으로 3~5초간 세동맥이\n일시적으로 수축한 후, 혈관이 확장되고 혈류 증가로\n염증부위가 붉게 변하는 발적 현상이 생긴다. 이외에 염증\n시 열발열. heat), 부기(종창, swelling), 통증(pain), 기능장애\n(functional disturbance) 등의 국소적 증상 및 징후가 발생할\n수 있다."},{"id":"c02-q023","chapterId":2,"number":23,"page":35,"stem":"다음 중 급성 염증과정에서 가장 먼저 일어날 수 있는 혈관의 변화는?","choices":["세동맥의 일시적인 수축","혈관의 확장","혈관의 투과성 증가","혈류 속도의 감소","백혈구의 유주"],"answer":1,"answerLabel":"①","answerPage":312,"explanation":"급성 염증 시 혈관 변화로 가장 먼저 약한 경우에는\n3~5초, 심한 경우에는 수 분간 세동맥의 일시적인 수축이\n나타난다. 이후 혈관 확장, 혈관 투과성 증가, 혈류 속도\n감소, 혈관으로부터 백혈구의 유주 현상 등이 발생한다."},{"id":"c02-q024","chapterId":2,"number":24,"page":36,"stem":"일반적으로 급성 염증 발생 시 첫 6~24시간 내에 염증 부위에 가장 먼저 침윤하는 세\n포는?","choices":["중성구(neutrophil)","단핵구 (monocyte)","호산구(eosinophil)","호염기구(basophil)","림프구(lymphocyte)"],"answer":1,"answerLabel":"①","answerPage":313,"explanation":"급성 염증 발생 시 초기 6~24시간에는 주로 중성구가\n침윤하며, 24~48시간 내에 단핵구로 대체된다. 중성구가\n초기에 많이 침윤하는 이유는 혈액 속에 그 수가 가장 많고,\n화학주성 물질에 빠르게 반응하기 때문이다. 바이러스 감염에\n의한 염증 시는 림프구가 가장 먼저 침윤하고, 일부 과민반응\n시에는 호산구가 주로 침윤한다."},{"id":"c02-q025","chapterId":2,"number":25,"page":36,"stem":"염증 화학매개체인 히스타민(histamine)의 기능으로 가장 적절한 것은?","choices":["통증","발열","백혈구 활성화","조직 손상","혈관 투과성 증가"],"answer":5,"answerLabel":"⑤","answerPage":313,"explanation":"히스타민은 염증과정에서 중요한 역할을 하는 매개체로\n혈관을 확장시키고, 혈관투과성을 증가시키는 기능을 한다.\n그 외 염증반응에 관여하는 매개체는 다음과 같다.\n• 통증: 프로스타글란딘, 브라디키닌\n• 발열: 종양괴사인자(TNF), 인터루킨-1(IL7), 프로스타글란딘\n• 백혈구 활성화: 종양괴사인자(TNF), 인터루킨너(1-1), 류코트리엔,\nC3a, C5a\n• 조직손상: 백혈구의 용해소체 효소, 산화질소, 산소 대사물"},{"id":"c02-q026","chapterId":2,"number":26,"page":36,"stem":"염증과정에서 통증에 관여하는 염증 화학매개체는?","choices":["프로스타글란딘(prostaglandin)","히스타민(histamine)","세로토닌(serotonin)","류코트리엔(leukotriene)","종양괴사인자(TNF)"],"answer":1,"answerLabel":"①","answerPage":313,"explanation":"프로스타글란딘은 염증 시 나타나는 발열과 통증에\n관여한다. 그 외 염증반응에 관여하는 매개체는 다음과\n같다.\n• 혈관확장: 프로스타글란딘, 히스타민, 산화질소\n• 혈관투과성 증가: 히스타민, 세로토닌, 류코트리엔, C3a, C5a\n• 통증: 프로스타글란딘, 브라디키닌\n• 발열: 종양괴사인자(TNF), 인터루킨너 (IL7), 프로스타글란딘\n• 백혈구활성화: 종양괴사인자(TNF), 인터루킨-1(1—1), 류코트리엔,\nC3a, C5a\n• 조직손상: 백혈구의 용해소체 효소, 산화질소, 산소 대사물"},{"id":"c02-q027","chapterId":2,"number":27,"page":36,"stem":"뜨거운 냄비를 맨손으로 잡은 후 양손 곳곳에 물집이 생겼다. 이와 같은 염증의 형태는?","choices":["장액성 염증","점액성 염증","화농성 염증","섬유소성 염증","위막성 염증"],"answer":1,"answerLabel":"①","answerPage":313,"explanation":"염증의 형태학적 분류로는 장액성 염증, 섬유소성 염증,\n화농성 염증, 점액성 염증, 출혈성 염증, 위막성 염증 등이\n있다. 화상이나 바이러스 감염 때 생기는 피부 물집은 상피\n내 혹은 상피 하에 장액성 액체가 모인 것으로 단백질이 적고\n점성이 낮은 액상 성분의 삼출이 특징적이다."},{"id":"c02-q028","chapterId":2,"number":28,"page":36,"stem":"손바닥을 못에 찔려 염증이 생긴 환자에게 염증과 통증 조절을 위해 비스테로이드소염제\n(NSAID)가 처방되었다. 이를 통해 억제하고자 하는 염증매개물질은?","choices":["히스타민","세로토닌","류코트리엔","프로스타글란딘","시토카인"],"answer":4,"answerLabel":"④","answerPage":313,"explanation":"프로스타글란딘(prostaglandin)은 염증의 혈관반응과\n전신반응에 관여하여 혈관을 확장시켜 부종을 유발하고,\n통증과 발열에도 관여한다. 조직손상 시 프로스타글란딘은\n시클로옥시게나아제(COXT, C0X-2)에 의해 생성된다.\nNSAID 는 COX 너과 C0X-2S 억제함으로써 프로스타글란딘\n합성을 억제하여 손상된 조직의 염증과 통증을 조절한다."},{"id":"c02-q029","chapterId":2,"number":29,"page":37,"stem":"급성 염증과정에서 혈류속도가 감소하여 손상 부위 혈관벽의 내피세포 쪽으로 백혈구가\n모이는 현상은?","choices":["혈관의 투과성 증가","백혈구의 변연화(margination)","백혈구의 유주(emigration)","화학주성 (chemotaxis)","포식작용"],"answer":2,"answerLabel":"②","answerPage":313,"explanation":"급성 염증과정에서 혈관의 투과성 변화와 혈류속도가\n감소하면 손상 부위 혈관벽의 내피세포에 백혈구, 특히\n호중구가 모여 달라붙는데 이를 변연화(margination)라고\n한다. 백혈구의 유주란 혈관벽을 통하여 백혈구가 빠져나가는\n현상, 화학주성은 혈관벽을 빠져나온 백혈구가 손상 부위로\n이동하는 현상, 포식작용은 이물질 인식, 섭취, 이물질의\n소화단계를 의미한다."},{"id":"c02-q030","chapterId":2,"number":30,"page":37,"stem":"다음 중 만성 염증에 주로 관여하는 세포는?","choices":["중성구(neutrophil)","대식세포(macrophage)","호산구(eosinophil)","호염기구(basophil)","비만세포(mast cell)"],"answer":2,"answerLabel":"②","answerPage":313,"explanation":"급성 염증은 과립백혈구주로 중성구가 주된 역할을\n하고, 만성 염증에서는 대식세포, 림프구, 형질세포 등의\n단핵세포들이 주로 관여한다."},{"id":"c02-q031","chapterId":2,"number":31,"page":37,"stem":"급성 염증과정에서 혈관벽을 빠져나온 백혈구가 손상 부위로 이동하는 현상은?","choices":["혈관의 투과성 증가","백혈구의 변연화(margination)","백혈구의 유주(emigration)","화학주성 (chemotaxis)","포식작용"],"answer":4,"answerLabel":"④","answerPage":313,"explanation":"급성 염증과정에서 혈관벽을 빠져나온 백혈구가 손상\n부위로 이동하는 현상을 화학주성(chemotaxis)이라고 한다.\n변연화란 손상 부위 혈관벽의 내피세포에 백혈구가 달라붙는\n현상, 백혈구의 유주는 혈관벽을 통하여 백혈구가 빠져나가는\n현상, 화학주성은 혈관벽을 빠져나온 백혈구가 손상 부위로\n이동하는 현상, 포식작용은 이물질 인식, 섭취, 이물질의\n소화단계를 의미한다."},{"id":"c02-q032","chapterId":2,"number":32,"page":37,"stem":"염증과정에서 대식세포(macrophage)의 가장 주된 역할은?","choices":["이물질 제거","혈관 확장","혈관의 투과성 증가","혈관 수축","혈류속도 감소"],"answer":1,"answerLabel":"①","answerPage":313,"explanation":"대식세포는 살균작용과 포식능력이 왕성하여 체내에서\n이물질을 제거하는 데 가장 큰 역할을 한다. 또한\n면역반응에도 관여하며 , 화학물질 방출, 신생혈관 형성 등의\n역할도 한다."},{"id":"c02-q033","chapterId":2,"number":33,"page":37,"stem":"최근 3주일 이상 지속되는 기침과 가래 호흡곤란을 주호소로 입원한 환자의 폐조직을 검\n사한 결과 상피모양세포로 변한 대식세포가 덩어리를 이루고 있는 것을 확인하였다 이\n환자에게 나타난 만성 염증 형태는?","choices":["장액성 염증","섬유소성 염증","화농성 염증","육아종성 염증","위막성 염증"],"answer":4,"answerLabel":"④","answerPage":313,"explanation":"육아종(gran니oma)은 특이한 병원체나 물질이 작용할\n때만 형성되므로 특이성 염증이라고도 하며 전형적인 면역성\n육아종은 Mycobaeterium tuberculosis 에 의해 발생한다.\n육아종은 상피모양세포유상피세포)로 변한 대식세포가\n현미경적인 덩어리를 이루고 주위에 주로 림프구와 형질세포가\n일부 포함된 단핵백혈구의 침윤이 있는 염증 형태이다."},{"id":"c02-q034","chapterId":2,"number":34,"page":38,"stem":"다음 중 손상을 받으면 재생이 불가능하여 반흔조직으로 대체되는 세포는?","choices":["피부의 편평상피세포","혈관내피세포","간의 실질세포","췌장의 실질세포","심장근세포"],"answer":5,"answerLabel":"⑤","answerPage":313,"explanation":"세포는 재생능력에 따라 불안정세포, 안정세포,\n영구세포로 구분된다 . 심장근세포는 영구세포로 세포주기를\n벗어나서 생후에는 감수분열이 일어나지 않기 때문에 한 번\n손상을 받으면 재생할 수 없다. 피부의 편평상피세포,\n혈관내피세포는 불안정세포, 간과 췌장의 실질세포는\n안정세포로 분류된다."},{"id":"c02-q035","chapterId":2,"number":35,"page":38,"stem":"입원 4일 후 이 환자의 허벅지 상처 부위에 분홍색의 부드러운 조직이 형성된 것을 확인\n하였다. 수복(repair)의 대표적인 소견인 이 조직은?","choices":["결합조직","섬유조직","육아조직","아교질조직","신생조직"],"passage":"다음 지문을 읽고 질문에 답하시오(문제 35-36).\n20대 남자가 교통사고로 오른쪽 팔이 골절되고, 오른쪽 허벅지에 7 cm 정도의 심하게 찢어진 상\n처가 생겨서 입원하였다.","answer":3,"answerLabel":"③","answerPage":313,"explanation":"손상된 조직의 수복과정 24~72시간 내에 섬유모세포,\n혈관내피세포가 증식하여 수복의 대표적인 소견인 육아조직\n(gran니ation tissue)을 형성한다. 육아조직은 분홍색이\n나고 부드럽고, 상처 표면에서 보면 과립상으로 보여 붙여진\n이름이 다. 신생혈관과 증식하는 섬유모세포가 중요한 조직\n소견이다."},{"id":"c02-q036","chapterId":2,"number":36,"page":38,"stem":"2주 후 이 환자의 허벅지 상처는 결합되었고, 상처부위는 창백하고 희게 변하였다. 이때\n상처부위에 가장 많은 것은?","choices":["아교질","육아조직","신생혈관","탄성조직","가피조직"],"passage":"다음 지문을 읽고 질문에 답하시오(문제 35-36).\n20대 남자가 교통사고로 오른쪽 팔이 골절되고, 오른쪽 허벅지에 7 cm 정도의 심하게 찢어진 상\n처가 생겨서 입원하였다.","answer":1,"answerLabel":"①","answerPage":313,"explanation":"손상된 조직의 수복과정 2주째가 되면 백혈구 침윤,\n부종, 과도한 혈관 등이 사라지고 상처부위의 아교질 증가,\n혈관이 차지하는 영역의 감소 등으로 상처가 희게 변한다.\n이때는 거의 아교섬유만 남고 모세혈관이나 염증세포는\n적어지며, 한 달이 경과하면 아교섬유로 완전히 대치되고\n상처의 표면은 가피를 형성하여 치유된다."},{"id":"c02-q037","chapterId":2,"number":37,"page":38,"stem":"다음 중 염증반응 후 이차융합(secondary uniorO에 의해 치유되는 상처는?","choices":["표피가 손상된 찰과상","복강경 수술부위","복부수술 후 봉합된 부위","감염된 상처","진피 일부가 손상된 자상"],"answer":4,"answerLabel":"④","answerPage":313,"explanation":"조직손상 시 염증반응 후의 수복과정은 피부 상처치유\n과정이 대표적이다. 일차 융합(primary union)은 깨끗한\n수술 부위나 봉합된 부위, 창상면이 붙어 있는 부위가 치유되는\n과정으로 육아조직이 소량이고 반흔조직도 적고 치유가\n빠르다. 이차 융합(secondary union)은 세포나 조직의\n결손이 심한 상처 , 감염된 상처 , 봉합되지 않은 상처 , 염증성\n궤양이 있는 상처에서 일어난다. 염증반응이 더 심하고, 더\n많은 육아조직을 형성하여 상처가 커지며 일반적으로 상처의\n수축도 일어난다."},{"id":"c02-q038","chapterId":2,"number":38,"page":39,"stem":"다음 중 염증반응 후 일차융합(primary union)에 의해 치유되는 상처는?","choices":["복부수술 후 봉합된 부위","염증성 궤양","세균감염 상처","허벅지 자상 후 봉합되지 않은 부위","둔부의 4단계 욕창"],"answer":1,"answerLabel":"①","answerPage":314,"explanation":"조직손상 시 염증반응 후의 수복과정은 피부 상처치유\n과정이 대표적이다. 일차 융합(primary union)은 깨끗한\n수술 부위나 봉합된 부위, 창상연이 붙어 있는 부위가\n치유되는 과정으로 육아조직이 소량이고 반흔조직도 적고\n치유가 빠르다. 이차 융합(secondary union)은 세포나\n조직의 결손이 심한 상처 , 감염된 상처, 봉합되지 않은 상처,\n염증성 궤양이 있는 상처에서 일어난다. 염증반응이 더\n심하고, 더 많은 육아조직을 형성하여 상처가 커지며\n일반적으로 상처의 수축도 일어난다."},{"id":"c02-q039","chapterId":2,"number":39,"page":39,"stem":"염증반응 후에 손상된 부위가 치유되는 단계로 옳은 것은?","choices":["아교질 증가 一 육아조직 형성 一 반흔 형성","육아조직 형성 一 아교질 증가, 육아조직 수축 一 반흔 형성","육아조직 형성 一 아교질 증가, 육아조직 수축 一 신생혈관 형성","아교질 증가 一 반흔 형성一 신생혈관 형성","반흔 형성 一 아교질 증가 一 육아조직 형성"],"answer":2,"answerLabel":"②","answerPage":314,"explanation":"상처치유는 크게 염증, 증식, 성숙의 세 단계로 설명할\n수 있다. 수복과정으로서 손상부위에는 24~72 시간 내에\n육아조직이 형성되고, 이후 2~3주간 새로운 혈관 생성과\n아교질이 증가로 육아조직은 수축한다. 한 달이 경과되면\n상처의 표면에는 반흔이 형성된다."},{"id":"c02-q040","chapterId":2,"number":40,"page":39,"stem":"20대 남자가 갑작스런 복부 통증, 구토, 미열을 주호소로 응급실에 내원 후 급성 충수염\n으로 진단받았다. 이와 같은 염증의 형태는?","choices":["장액성 염증","점액성 염증","화농성 염증","섬유소성 염증","위막성 염증"],"answer":3,"answerLabel":"③","answerPage":314,"explanation":"염증의 형태학적 분류로는 장액성 염증, 섬유소성 염증,\n화농성 염증, 점액성 염증, 출혈성 염증, 위막성 염증 등이\n있다. 화농성 염증은 염증성 삼출액이 고름으로 형성되어\n있는 경우로서 농을 잘 형성하는 화농성 세균인 포도상구균,\n연쇄상구균, 임질균 또는 수막구균의 감염에 의해 유발되는\n경우가 많으며 급성 화농성 충수염이 대표적이다."},{"id":"c02-q041","chapterId":2,"number":41,"page":39,"stem":"수분의 섭취량이 배설량보다 적을 경우 갈증중추를 활성화하는 자극으로 옳은 것은?","choices":["침 분비의 증가","위의 팽창","혈액 삼투압 농도의 증가","혈압 상승","레닌 분비 억제"],"answer":3,"answerLabel":"③","answerPage":314,"explanation":"수분의 섭취는 시상하부의 갈증중추를 활성화하거나\n억제하는 자극을 통해 조절된다. 수분의 섭취량이 배설량보다\n적을 때는 갈증중추를 활성화하기 위해 침 분비의 감소, 혈액\n삼투압 농도의 증가, 혈압 저하와 같은 자극이 발생한다.\n혈액 삼투압 농도가 증가하면 갈증중추가 직접 자극을 받으며 ,\n시상하부도 직접 자극을 받아 뇌하수체후엽으로\n항이뇨호르몬을 분비하라는 신경 신호를 보낸다."},{"id":"c02-q042","chapterId":2,"number":42,"page":39,"stem":"다음 중 소변배출량을 감소시키는 호르몬의 영향으로 옳은 것은?","choices":["항이뇨호르몬 분비 감소","레닌 분비 감소","앤지오텐신 H 분비 감소","알도스테론 분비 증가","심방나트륨이뇨펩티드 분비 증가"],"answer":4,"answerLabel":"④","answerPage":314,"explanation":"수분배출의 조절은 소변 배출량을 조절하는 것이다.\n소변의 배출량을 조절하는 주요 호르몬은 앤지오텐신 II,\n항이뇨호르몬 , 알도스테론, 심방나트륨이뇨펩티드이 匚卜.\n앤지오텐신 II, 항이뇨호르몬, 알도스테론 분비의 증가는\n소변의 배출량을 줄인다. 반면 심방나트륨이뇨펩티드는\n소변의 배출량을 늘려서 혈액량과 혈압을 감소시킨다."},{"id":"c02-q043","chapterId":2,"number":43,"page":40,"stem":"10회 이상의 구토와 설사를 주호소로 7세 여아가 응급실에 내원하였다 현재 체온은 38℃\n이고 보호자는 아이가 거의 먹지 못했다고 하였다. 여아에게 의심되는 상태는?","choices":["용적결핍(volume depletion)","탈수(dehydration)","용적과잉 (volume excess)","저장성 수화(hypotonic hydration)","부종(edema)"],"answer":1,"answerLabel":"①","answerPage":314,"explanation":"용적결핍(volume depletion)은 등장성 체액의 손실이\n유입보다 많은 것이다. 예로는 출혈, 심한 화상, 만성구토,\n설사, 알도스테론의 과소 분비 등이다. 탈수(dehydration)\n는 신체에 나트륨보다 많은 수분이 제거될 때 발생하는데,\n부족한수분섭취, 당뇨병, 항이뇨호르몬 분비장애, 심한\n발한, 과도한 이뇨제 사용 등이 원인이 될 수 있다. 용적과잉\n(volume excess)은 등장성 체액의 유입이 손실보다 많은\n것이고, 저장성 수화(hypotonic hydration)는 나트륨보다\n더 많은 수분이 저류되어 발생하며, 많은 양의 수분과\n나트륨을 소변이나 땀으로 배출하고 물을 마셔서 보충할 때\n일어날 수 있다."},{"id":"c02-q044","chapterId":2,"number":44,"page":40,"stem":"50대 환자의 혈청 전해질 검사결과가 다음과 같다. 이 환자에게 나타날 수 있는 가장 우\n선적인 문제는?\n• Na： 140 mEq/L\n• K: 4.0 mEq/L\n• Ca： 12.5 mg/dL\n• P ： 3.0 mg/dL","choices":["심박동수 증가","병리적 골절","설사","테타니","저혈압"],"answer":2,"answerLabel":"②","answerPage":314,"explanation":"혈청 내 전해질의 정상수치는 다음과 같다.\n• 나트륨(Na)： 135~145 mEq/L\n• 칼륨(K)： 3.5 〜5.0 mEq/L\n• 칼슘(Ca)： 8.4~ 10.2 mg/dL 또는 4.5~5.5 mEq/L\n• 인(P)： 2.7〜4.5 mg/dL 또는 1.8〜2.9 mEq/L\n환자는 현재 고칼슘혈증 상태로 병리적 골절의 위험이 있다."},{"id":"c02-q045","chapterId":2,"number":45,"page":40,"stem":"다음 중 저장성 수화(hypotonic hydration)의 위험이 가장 높은 경우는?","choices":["2 도 화상","상부 위장관 출혈","지속적인 구토","당뇨병","마라톤 후 다량의 물 섭취"],"answer":5,"answerLabel":"⑤","answerPage":314,"explanation":"저장성 수화(hypotonic hydration)는 나트륨보다 더\n많은 수분이 저류되어 발생하며 , 많은 양의 수분과 나트륨을\n소변이나 땀으로 배출한 후 물을 마셔서 보충할 때 일어날\n수 있다. 심한 화상, 출혈 , 만성구토, 설사가 있는 경우에는\n삼투압 농도가 변하지 않는 용적결핍(volume de이etioe이\n발생할 수 있고, 당뇨병은 탈수(dehydration를 유발할 수\n있다."},{"id":"c02-q046","chapterId":2,"number":46,"page":40,"stem":"급성 신부전으로 입원한 50대 남자의 혈청 칼륨 농도가 5.8 mEq/L이다. 이 환자의 심전\n도 상에 나타날 수 있는 파형으로 옳은 것은?","choices":["정상 P파","약간 상승한 P파","좁은 QRS 파","좁고 높은 T 파","높은 U 파"],"answer":4,"answerLabel":"④","answerPage":314,"explanation":"혈청 칼륨 농도의 정상수치는 3.5~5.5 mEq/L로,\n현재 이 환자는 고칼륨혈증 상태이다. 고칼륨혈증일 경우\n심전도 상 P파가 작아지거나 보이지 않고, PR 간격과 QRS\n파가 넓어지며 , 좁고 높은 T 파가 나타난다."},{"id":"c02-q047","chapterId":2,"number":47,"page":41,"stem":"다음 중 세포외액의 가장 중요한 화학적 완충계(chemical buffer system)는?","choices":["콩팥 완충계","호흡계통 완충계","중탄산염 완충계","단백질 완충계","인산염 완충계"],"answer":3,"answerLabel":"③","answerPage":314,"explanation":"인체의 pH를 조절하기 위한 화학적 완충계는 중탄산염\n완충계, 단백질 완충계, 인산염 완충계가 있다. 이 중 중탄산염\n완충계는 세포외액에서 가장 중요한 완충체계이고, 단백질\n완충계는 혈장의 세포 속에 있는 단백질로 이루어진\n완충계이고, 인산염 완충계는 세포내액에 있다. 콩팥과\n호흡계통 완충계는 생리적 완충계이다."},{"id":"c02-q048","chapterId":2,"number":48,"page":41,"stem":"세포외액의 주요 양이온이고, 총 체액량과 체액구획 사이에 수분의 분포를 결정하는 가\n장 중요한 전해질은?","choices":["나트륨","칼륨","칼슘","인","마그네슘"],"answer":1,"answerLabel":"①","answerPage":314,"explanation":"나트륨은 세포외액에 가장 많이 들어 있는 양이온으로,\n세포외액에서 가장 큰 삼투압을 형성한다. 나트륨의 농도는\n체액평형을 유지하는 데 중요하며 , 나트륨의 농도가 변하면\n채액구획 사이에 물이 이동한다."},{"id":"c02-q049","chapterId":2,"number":49,"page":41,"stem":"지주막하출혈로 입원치료 중인 환자의 소변이 시간 당 500 mL 이상으로 배출되고 요비\n중이 1.0이으로 측정되었다. 이들 증상과 관련 있는 호르몬은?","choices":["알도스테론","앤지오텐신 口","심방나트륨이뇨펩티드","항이뇨호르몬","레닌"],"answer":4,"answerLabel":"④","answerPage":314,"explanation":"요붕증(diabetes insipidus)은 항이뇨호르몬의 부족으로\n초래되는 수분대사 질환이다. 신경성 또는 중추성 요붕증,\n콩팥성 요붕증, 일차성 요붕증, 임신성 요붕증 등으로 구분할\n수 있다."},{"id":"c02-q050","chapterId":2,"number":50,"page":41,"stem":"다음 중 혈중 칼륨 농도를 증가시킬 수 있는 경우는?","choices":["furosemide 계열의 이뇨제 장기간 투여","인슐린 투여","오래된 혈액 수혈","만성적 구토","관장"],"answer":3,"answerLabel":"③","answerPage":314,"explanation":"고칼륨혈증은 콩팥기능 상실, 산증, 인슐린 감소,\n광범위한 세포손상, 오래된 혈액수혈, 용혈빈혈 등의 원인으로\n발생할 수 있다. 이뇨제 남요 인슐린 투여, 만성적 구토,\n관장 등은 저칼륨혈증을 유발할 수 있다."},{"id":"c02-q051","chapterId":2,"number":51,"page":42,"stem":"이 환자의 현재 상태로 예측될 수 있는 동맥혈가스분석(ABGA) 검사 결과는?","choices":["pH： 7.20 / PaCO,： 35.0 mmHg / HCOf： 14.0 mEq/L","pH： 7.20 / PaCO,： 55.0 mmHg / HCOf： 14.0 mEq/L","pH： 7.38 / PaCO,： 40.0 mmHg / HCOJ： 23.0 mEq/L","pH： 7.48 / PaCO,： 30.0 mmHg / HCO「： 23.0 mEq/L","pH： 7.48 / PaCO,： 40.0 mmHg / HCO「： 28.0 mEq/L"],"passage":"다음 지문을 읽고 질문에 답叶시오문제 51-52).\n10년 전부터 당뇨병을 앓고 있는 30대 남자가 구토와 복통. 과일향이 나는 깊은 호흡을 주호소로\n응급실에 내원하였다. 환자는 최근 실직으로 심하게 스트레스를 받고 있다.","answer":1,"answerLabel":"①","answerPage":315,"explanation":"현재 이 환자는 당뇨병성 케톤산증이 의심된다. 당뇨병성\n케톤산증은 산-염기 장애 중 대사성산증으로 ABGA 결과\npH와 HCO/는 감소하고, Pac。?는 정상이거나 호흡성\n보상작용으로 감소할 수 있다."},{"id":"c02-q052","chapterId":2,"number":52,"page":42,"stem":"이 환자의 치료 중 가장 주의 깊게 감시해야 하는 전해질은?","choices":["나트륨","칼륨","칼슘","인","마그네슘"],"passage":"다음 지문을 읽고 질문에 답叶시오문제 51-52).\n10년 전부터 당뇨병을 앓고 있는 30대 남자가 구토와 복통. 과일향이 나는 깊은 호흡을 주호소로\n응급실에 내원하였다. 환자는 최근 실직으로 심하게 스트레스를 받고 있다.","answer":2,"answerLabel":"②","answerPage":315,"explanation":"당뇨병성 케톤산증의 치료목표는 수액과 전해질 교정,\n혈당과 산증 교정을 위한 인슐린 투여 , 유발인자 및 동반질환의\n치료 등이다. 인슐린을 주입하면 칼륨은 세포 내로 이동한다.\n칼륨은 정맥수액에 혼합하여 몇 시간에 걸쳐 서서히 공급해야\n하며 혈중 농도가 4~5 mE 이/L가 되도록 감시하고 유지해야\n한다."},{"id":"c02-q053","chapterId":2,"number":53,"page":42,"stem":"하루 동안 20회 이상의 설사를 주호소로 40대 남자가 응급실에 내원하여 동맥혈가스분\n석(ABGA) 검사를 실시하였다. 다음의 검사 결과가 의미하는 상태는?\n• pH： 7.20\n• PaCO2： 37.5 mmHg\n• HCO3-： 16.0 mEq/L","choices":["호흡성 산증","호흡성 알칼리증","중탄산 과잉","대사성 산증","대사성 알칼리증"],"answer":4,"answerLabel":"④","answerPage":315,"explanation":"설사는 수분이 많은 대변이 과다하게 생성되는 것이다.\n대변을 통해 중탄산이온이 과다하게 배출되면 창자 내벽의\n상피세포가 중탄산이온을 보충하도록 촉발한다. 이 세포는\n창자의 속공간으로 중탄산이온을 배출하는 동시에 수소이온을\n혈액으로 운반한다. 그 결과, 혈액의 pH가 하락하고 심한\n경우 대사성 산증이 유발될 수 있다."},{"id":"c02-q054","chapterId":2,"number":54,"page":42,"stem":"호흡수가 정상보다 감소하면 수소이온의 농도와 혈액의 阴는 어떻게 변화하는가?","choices":["감소/감소","감소/증가","증가/증가","증가/감소","증가/정상"],"answer":4,"answerLabel":"④","answerPage":315,"explanation":"용액의 pH는 수소이온의 농도와 반비례한다. 산이\n추가되면 수소이온의 농도가 높아지고 pH가 낮아진다.\n염기를 추가하면 수소이온의 농도가 줄어들고 pH가 높아진다.\n호흡수가 감소하면 정체되는 이산화탄소가 증가한다. 혈중\n이산화탄소가 증가하면 탄산 농도가 증가하여 수소이온의\n농도는 높아지고 pH는 낮아진다."},{"id":"c02-q055","chapterId":2,"number":55,"page":43,"stem":"이 동맥혈가스분석(ABGA) 검사결과가 의미하는
