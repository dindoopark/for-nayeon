lanation":"이뇨제인 lasix는 소변으로 배설되는 체액량을증가시켜\n전부하를 감소시키고 morphine은 심근의 산소소모량을\n감소시킨다."},{"id":"c05-q115","chapterId":5,"number":115,"page":138,"stem":"집중치료실에 입원 중인 말기 심부전 환자가 활력징후는 혈압 80/66 mmHg, 심장박동\n수 86회/분, 호흡수 26회/분이다. 60% BiPAP facemask를 적용하고 있으며 양쪽 폐저\n부에서 수포음이 청진된다. 집에서 복용했던 약물은 furosemide, atenolol, potassium,\ncaptopril이다. 입원 중 시행한 혈액검사 결과는 albumin 2.0 g/dL, HCT 52%, BUN 62\nmg/dL, creatinine 3.0 mg/dL이다. 이 환자에게 적절한 초기 중재는?","choices":["dobutamine을 정맥주입 한다.","norepinephrine (Levophed)을 정맥주입 한다.","normal saline 250 mL를 급속 정맥주입 한다.","furosemide(Lasix) 40 mg을 정맥주사 한다.","dopamine을 고용량으로 정맥주입 한다."],"answer":3,"answerLabel":"③","answerPage":335,"explanation":"이뇨제를 투약 중인 환자는 수포음과 심부전 상태에\n있음에도 불구하고 혈관계의 체액이 고갈되어 수액보충이\n필요하다. 이 환자는 HCT 상승, BUN/creatinine 비가\n20： 1 이상이므로 저혈량증이며 또한 저알부민혈증 상태이므로\n체액이 간질강으로 이동하여 체액부족 상태를 나타낼 것으로\n보인다. Dobutamine의 정맥주입은 심근수축력을\n증가시키지만 혈관내의 혈액량이 고갈됨에 따라 일회박출량이\n적으면 혈압을 상승시키지 못한다. Norepine아'irine\n(Levophed) 앞 단어와 붙여쓰기 혈관을 수축시켜 일시적으로\n혈압을 상승시킬 수 있지만 혈관수축제는 체액부족이\n교정되었을 때만 사용해야 한다. Furosemide (Lasix)는\n혈관내 체액량을 더욱 감소시킬 수 있다."},{"id":"c05-q116","chapterId":5,"number":116,"page":138,"stem":"4일 전 전벽 심근경색증(anterior Ml)을 진단받고 입원 중인 환자가 호흡곤란이 심해져\n서 집중치료실로 전동되었고 신체검진 결과가 다음과 같다. 이 환자에게 가장 우선적인\n중재는?\n• V/S ： BP 110/82 mmHg- HR 128 회/분-RR 36 회/분-T 37.6℃-SpO2 88%\n• Lung sound： Coarse, bilateral crackles in lower lobes, poor respiratory effort\n• Heart Sound： S1, S2, S3\n• Skin： Flushed, diaphoretic, pedal edema 2+\n• ECG ： Sinus tachycardia, left ventricular hypertrophy","choices":["동맥혈가스분석","nesiritide 정맥주입","기관내관삽관 준비","심폐소생술팀 호출","Troponin I 검사"],"answer":3,"answerLabel":"③","answerPage":335,"explanation":"저산소증에 의한 빈호흡이 관찰되므로 즉시 intubation\n을시행해야 한다."},{"id":"c05-q117","chapterId":5,"number":117,"page":139,"stem":"4일 전 전벽 심근경색증(anterior Ml)을 진단받고 입원 중인 환자가 호흡곤란이 심해져\n서 집중치료실로 전동되었고 신체검진 결과가 다음과 같다. 이 환자의 호흡곤란에 가장\n큰 영향을 미친 것은?\n• V/S ： BP 110/82 mmHg- HR 128 회/분—RR 36 회/분-T 37.6℃-SpO2 88%\n• Lung sound： Coarse, bilateral crackles in lower lobes, poor respiratory effort\n• Heart Sound： S1, S2. S3\n• Skin： Flushed, diaphoretic, pedal edema 2+\n• ECG ： Sinus tachycardia, left ventricular hypertrophy","choices":["폐부종을 동반한 급성 심부전 악화","급성호흡곤란증후군(ARDS) 을 동반한 갑작스런 패혈 쇼크","급성 불안발작","저혈량 쇼크","분배성 쇼크"],"answer":1,"answerLabel":"①","answerPage":335,"explanation":"S3는 심근수축력이 상당히 저하되어 있음을 나타내는\n심음이며 수포음이 청진된다면 급성 심부전이 악화된 것으로\n볼수 있다."},{"id":"c05-q118","chapterId":5,"number":118,"page":139,"stem":"급성 심부전 환자의 약물치료에 대한 설명으로 옳지 않은 것은?","choices":["울혈 증상이나 징후가 있으면서 저혈압인 경우 dobutamine을 투여한다,","Dobutamine과 Milrinone은 cAMP 를 증가시켜 심근수축력을 증가시킨다.","Digoxin은 심부전 환자의 생존율을 향상시키기 위해 투여되어야 한다,","이뇨제를 투여하는 중에도 울혈이 호전되지 않으면 vasodilator를 투여할 수 있다","흉통이나 불안, 호흡곤란 시 단기간 증상조절을 위해 morphine을 투여한다. 다음 지문을 읽고 질문에 답하시오(문제 119T2D. 심한 호흡곤란과 발한으로 응급실에 온 환자가 활력징후는 혈압 110/90 mmHg, 심장박동수 110 회/분(불규칙함), SpO2 83% 이고, 경정맥압(JVD)은 8.7 mmHg이며. 양쪽 폐하엽에서 수포음이 들리고, 심음 청진 시 S1, S2. S3가 들린다. 동맥혈가스분석 결과가 pH 7.51, PaO2 60 mmHg. PaCO2 28 mmHg, SaO2 93% 임을 확인한 후 산소를 비강캐뉼라를 통해 4 L/ 분으로 공급 중 이다. 심전도에서 좌심실비대와 좌각차단(left bundle branch block)이 보이고, 흉부 방사선검사 에서는 심장크기가 커져 있고 심장 주변으로 양측 침윤(bilateral infiltration)이 보인다. 폐동맥카테 터를 삽입하여 측정한 혈역학학 지표는 다음과 같다. • RA ： 10 mmHg • PA ： 41/35 mmHg • PAOP ： 32 mmHg • CO： 3.8 L/min • Cl： 1.9 L/min/m2 관상동맥조영술을 시행한 결과 LAD 95% occlusion, RCA 50% occlusion. LCx 75% occlusion 이 있으며, 심초음파검사에서 EF 28% 이다."],"answer":3,"answerLabel":"③","answerPage":335,"explanation":"Digoxin은 심부전 환자의 생존율에 대한 영향은\n명백하지 않다."},{"id":"c05-q119","chapterId":5,"number":119,"page":140,"stem":"이 환자에게 Dobutamine 지속주입과 Furosemide 정맥주사가 처방되었다면 그 목적은?","choices":["심근수축력 증가와 심실 전부하 감소","심근수축력 증가와 심실 후부하 감소","심근수축력 감소와 심실 전부하 증가","심근수축력 증가와 심실 후부하 증가","심근수축력 증가와 심실 전부하 증가"],"answer":1,"answerLabel":"①","answerPage":335,"explanation":"폐부종과 심근수축력을 모두 개선하기 위해\ndobutamine과 lasix를 투여한다."},{"id":"c05-q120","chapterId":5,"number":120,"page":140,"stem":"이 환자에게 dobutamine과 furosemide를 정맥주사 했을 때 기대하는 효과는?","choices":["심장박동수 120회/분; PA 40/38； PAOP 변화 없음","심장박동수 HO회/분; PA 32/25 mmHg； PAOP 24 mmHg","심장박동수 95회/분; PA unchanged； RA 14 mmHg","혈압 105/80 mmHg； PA 49/38 mmHg； RA 14 mmHg","혈압 130/70 mmHg： PA 40/38； PAOP 변화 없음"],"answer":2,"answerLabel":"②","answerPage":335,"explanation":"PA 32/25 mmHg； PAOP 24 mmHg로 좌심실부\n하가 감소되었음을 알 수 있다."},{"id":"c05-q121","chapterId":5,"number":121,"page":140,"stem":"관상동맥조영술 결과를 토대로 이 환자에게 가장 적절한 중재는?","choices":["심장이식대체수술(destination therapy： DT) 로서 HeartMate II LVAD 삽입","좌심 실류제 거술(ventricular aneurysmectomy) 및 재건수술(reconstruction sur­ gery)","승모판막성형술(mitral valve repair)","양심실 박동조율기 (dual chamber biventricular pacemaker) 삽입","심장이식"],"answer":4,"answerLabel":"④","answerPage":335,"explanation":"EF 28%의 ICMP 환자로 양심실 박동조율기가\n필요하다."},{"id":"c05-q122","chapterId":5,"number":122,"page":140,"stem":"유두근 파열을 동반한 급성 심근경색증에 의해 초래된 심장성 쇼크 상태의 환자에게 즉\n시 적용해야 할 적절한 중재는?","choices":["관상동맥우회술과 승모판막치환술","환자를 안정화 시킨 후 관상동맥중재술과 승모판막치환술","환자를 안정화 시킨 후 혈전용해제 치료","승압제와 대동맥내풍선펌프 적용","좌심실보조장치 삽입"],"answer":1,"answerLabel":"①","answerPage":335,"explanation":"유두근 파열을 동반한 급성 심근경색증의 치료를 위해\n재관류와 판막수술성형술 또는 치환술이 필요하다. 즉각적인\n치료로는 개심술이 시행되어야 한다. 즉시 심장수술을 할\n수 없다면 관상동맥 중재술과 대동맥 내풍선펌프를 적용하여\n심장수술이 가능한 의료기관으로 이송할 때까지 환자를\n안정화시키도록 한다. 대동맥 내풍선펌프는 후부하를\n감소시ヲ I고 승모판막 폐쇄부전을 감소시킨다. 유두근 파열이\n동반된 상태이므로 혈전용해 제를 적용하면 판막치 환수술을\n지연시킬 수 있다. 대동맥내풍선펌프와 승압제는 수술 전까지\n환자를 안정화시키기 위해 투약하지만 막힌 관상동맥을\n재관류시키지는 않는다."},{"id":"c05-q123","chapterId":5,"number":123,"page":141,"stem":"이 경과를 통해 알 수 있는 환자의 쇼크 유형은?","choices":["Hypovolemic shock","Distributive shock","Cardiogenic shock","Neurogenic shock","Septic shock"],"passage":"다음 지문을 읽고 질문에 답하시오(문제 123-125).\n49세 남자가 거실에서 쓰러진 상태로 발견되었고 숨은 쉬고 있지만 피부는 차고 축축한 상태\n로 응급실에 왔다. 도착 당시 활력징후는 혈압 68/44 mmHg, 심장박동수 122회/분 호흡수 33\n회/분. 체온 36.1℃. SpO2 91%(마스크로 60% 산소 공급 중)이었고 생리식염수가 정맥으로 450 mL\n주입되었고 현재 full drip 중이며, Dopamine을 5 mcg/Kg/min 정맥주사 하기 시작했다. 심전\n도 상 V2~4 유도에서 ST 분절이 상승되어 있고, II, III, aVF 유도에서 역변화(reciprocal change)\n가 보였다. 심초음파에서 LVEF 13%, left ventricular akinesia, 관상동맥조영술에서 proximal\nLAD 99% stenosis, mid RCA 70% stenosis, LCx 정상이었으며, 관상동맥중재술을 시행하였\n다. 집중치료실 입실 직후 혈역학적 지표는 다음과 같다.\n• PA ： 45/25 mmHg\n• RA ： 15 mmHg\n• PAOP ： 22 mmHg\n• CO： 4.0 L/min\n• Cl： 1.5 L/min/m2","answer":3,"answerLabel":"③","answerPage":335,"explanation":"심전도 상 reciprocal change는 STEMIS 의심할\n수 있으므로 cardiogenic shock이다."},{"id":"c05-q124","chapterId":5,"number":124,"page":141,"stem":"이 환자에게 시행되어야 할 중재의 목적은?","choices":["심근부하 감소","폐혈관 확장","이뇨작용","산소공급을 개선하기 위한 기도내관삽관","전부하 감소"],"passage":"다음 지문을 읽고 질문에 답하시오(문제 123-125).\n49세 남자가 거실에서 쓰러진 상태로 발견되었고 숨은 쉬고 있지만 피부는 차고 축축한 상태\n로 응급실에 왔다. 도착 당시 활력징후는 혈압 68/44 mmHg, 심장박동수 122회/분 호흡수 33\n회/분. 체온 36.1℃. SpO2 91%(마스크로 60% 산소 공급 중)이었고 생리식염수가 정맥으로 450 mL\n주입되었고 현재 full drip 중이며, Dopamine을 5 mcg/Kg/min 정맥주사 하기 시작했다. 심전\n도 상 V2~4 유도에서 ST 분절이 상승되어 있고, II, III, aVF 유도에서 역변화(reciprocal change)\n가 보였다. 심초음파에서 LVEF 13%, left ventricular akinesia, 관상동맥조영술에서 proximal\nLAD 99% stenosis, mid RCA 70% stenosis, LCx 정상이었으며, 관상동맥중재술을 시행하였\n다. 집중치료실 입실 직후 혈역학적 지표는 다음과 같다.\n• PA ： 45/25 mmHg\n• RA ： 15 mmHg\n• PAOP ： 22 mmHg\n• CO： 4.0 L/min\n• Cl： 1.5 L/min/m2","answer":1,"answerLabel":"①","answerPage":335,"explanation":"심근경색증이므로 심근산소요구량을 낮추는 것이\n우선적으로 필요하다."},{"id":"c05-q125","chapterId":5,"number":125,"page":141,"stem":"이러한 목적을 달성하기 위한 다음 단계로 시행할 중재는?","choices":["후부하 감소를 위한 혈관확장제 투여","전후하 증가를 위한 수액 투여","Dopamine을 최대 7.5 mcg/Kg/min 정맥주입","대동맥내풍선펌프 삽입","심실보조장치 삽입"],"passage":"다음 지문을 읽고 질문에 답하시오(문제 123-125).\n49세 남자가 거실에서 쓰러진 상태로 발견되었고 숨은 쉬고 있지만 피부는 차고 축축한 상태\n로 응급실에 왔다. 도착 당시 활력징후는 혈압 68/44 mmHg, 심장박동수 122회/분 호흡수 33\n회/분. 체온 36.1℃. SpO2 91%(마스크로 60% 산소 공급 중)이었고 생리식염수가 정맥으로 450 mL\n주입되었고 현재 full drip 중이며, Dopamine을 5 mcg/Kg/min 정맥주사 하기 시작했다. 심전\n도 상 V2~4 유도에서 ST 분절이 상승되어 있고, II, III, aVF 유도에서 역변화(reciprocal change)\n가 보였다. 심초음파에서 LVEF 13%, left ventricular akinesia, 관상동맥조영술에서 proximal\nLAD 99% stenosis, mid RCA 70% stenosis, LCx 정상이었으며, 관상동맥중재술을 시행하였\n다. 집중치료실 입실 직후 혈역학적 지표는 다음과 같다.\n• PA ： 45/25 mmHg\n• RA ： 15 mmHg\n• PAOP ： 22 mmHg\n• CO： 4.0 L/min\n• Cl： 1.5 L/min/m2","answer":4,"answerLabel":"④","answerPage":335,"explanation":"허혈성 심질환 환자에게 관상동맥을 통한 심근관류를\n개선하고 심장의 후부하를 감소시키기 위해 대동맥내\n풍선펌프 삽입이 고려되어야 한다."},{"id":"c05-q126","chapterId":5,"number":126,"page":142,"stem":"승모판막질환의 약물치료는?","choices":["울혈 감소를 위한 이뇨제를 투여하여 호흡곤란을 치료한다.","디곡신, 베타차단제, 칼슘통로차단제를 투여하여 심실박동수를 감소시킨다.","판막역류를 감소시키기 위해 항고혈압제를 투여하여 전후하를 감소시킨다.","세균감염을 치료하기 위해 항생제를 투여한다.","혈전형성 방지를 위해 와파린을 투여한다."],"answer":1,"answerLabel":"①","answerPage":335,"explanation":"승모판막질환의 약물치료에는 이뇨제를 투여하여\n울혈을 감소시킴으로써 호흡곤란을 완화하기 위한 치료가\n필요하다 . 항고혈압제는 판막역류를 감소시켜서 후부하를\n감소시킨다. 그 외에 심방세동이 있다면 심실충만에 의한\n증상을 개선시키기 위해 항부정맥약물을 투여한다.\n베타차단제는 승모판막탈출증이 있을 때 두근거림을\n조절하기 위해 적용한다. 하지만 승모판막탈출증에서\n피로감이 있다면 베타차단제가 오히려 피로감을 악화시킬\n수 있다. 감염성 심내막염을 예방하기 위한 예방적 항생제는\n승모판탈출증 환자가 일반적인 환자와 감염성 심내막염\n발생률에 큰 차이가 없으므로 적응증이 되지 않는다.\n아스피린 등의 항응고제는 허혈성 뇌혈관질환이나\n심방세동이 동반된 승모판막탈출 환자에게 처방되기도\n한다."},{"id":"c05-q127","chapterId":5,"number":127,"page":142,"stem":"다음 중 aortic valve stenosis에 의한 특징적 증상은?","choices":["fatigue, dyspnea, pulmonary edema","fatigue, dyspnea, atrial fibrillation","fatigue, syncope, angina","fatigue, syncope, pulmonary edema","fatigue, pulmonary edema, ascites"],"answer":3,"answerLabel":"③","answerPage":335,"explanation":"대동맥판막협착이 심한 경우 뇌조직관류저하,\n심근관류저하, 전신순환저하로 인해 실신, 흉통, 피로가\n특징적으로 나타난다."},{"id":"c05-q128","chapterId":5,"number":128,"page":142,"stem":"페니실린 알레르기가 있는 환자에게 심내막염 예방을 위해 투여 가능한 약물은?","choices":["erythromycin","dicloxacillin","azithromycin","ofloxacin","ceftriaxone"],"answer":3,"answerLabel":"③","answerPage":335,"explanation":"심내막염을 예방하기 위해 침습적 시술 전 페니실린을\n투여하는데 약물에 알레르기가 있을 때 이차적으로 선택할\n수 있는 약물은 macr이ide 계열인 a기thromycin이다."},{"id":"c05-q129","chapterId":5,"number":129,"page":142,"stem":"infective endocarditis에 대한 설명으로 옳은 것은?","choices":["CABG는 수술 후 infective endocarditis 고위험 환자이다.","손가락 발가락에 단단한 작은 nodule 양상의 Janeway lesion이 있을 수 있다.","손발의 작고 딱딱한 말초출혈 양상의 Osler‘s node가 있을 수 있다.","발열이 가장 흔한 증상이며 심잡음이 청진된다.","침습적 처치 전에 항상 cephalosporin계 항생제를 투여한다."],"answer":4,"answerLabel":"④","answerPage":335,"explanation":"손가락, 발가락에 단단한 작은 nodule은 Osler s\nnode이며 손발의 작고 딱딱한 말초출혈 양상은 Janeway\nlesion이다. 관상동맥질환은 심내막염 발생 위험이 낮으며\n모든 침습적 처치 전에 항생제가 필요한 것은 아니다."},{"id":"c05-q130","chapterId":5,"number":130,"page":142,"stem":"대동맥박리 수술 전 sodium nitroprusside와 esm이이을 투여할 때 주의해야 할 것은?","choices":["두 약물은 map of 70 mmHg. HR of 70/min를 유지할 수 있도록 용량을 조절 해야 한다.","nitroprusside는 SBP (140 mmHg, esmok)l은 HR 〈100/분이 유지되도록 용량 을 조절해야 한다.","nitroprusside 10 mcg/Kg/min 이상 주입 시에도 SBP 가 감소되지 않으면 esm- ol이을 추가하여 MAP 60 mmHg가 되도록 용량을 조절해야 한다.","SBP 가 120—140 mmHg가 되도록 esmolol 용량을 조절한다.","심장박동수가 60회/분까지 감소하면 esmol이을 중단하고 nitroprusside로 대체한다"],"answer":1,"answerLabel":"①","answerPage":335,"explanation":"대동맥박리 환자에게 혈압과 맥박수를 낮추기 위해\nSodium nitroprusside 와 esm이이을 투여한다.\n투여량은 MAP of 70 mmHg 정도로 조절한다."},{"id":"c05-q131","chapterId":5,"number":131,"page":143,"stem":"aortic dissection (Stanford type A)이 관찰되는 환자에 대한 설명으로 옳은 것은?","choices":["ascending aorta에 국한된 병변이다.","ascending~descending aorta에 병변이 있다.","약물치료 후 병변이 증가할 때 수술한다.","통증부위는 병변진행부위와 관련이 없다.","신체 장기로 가는 혈류는 false lumen에 의해 공급된다."],"answer":2,"answerLabel":"②","answerPage":335,"explanation":"Standford type A는 대동맥박리가 상행대동맥에\n포함된 경우를 말하며 상행대동맥의 박리가 있는 경우\n즉각적인 수술이 필요하다."},{"id":"c05-q132","chapterId":5,"number":132,"page":143,"stem":"대동맥류 환자의 가장 흔한 증상은?","choices":["복통","파행 (claudication)","대부분 무증상","호흡곤란","변비"],"answer":3,"answerLabel":"③","answerPage":335,"explanation":"대부분의 환자가 무증상이며, 간혹 누우면 복부에서\n박동이 느껴지거나 우연히 발견되는 경우가 많다. Back\npain이 있다면 파열(rupture)를 의심해야 한다."},{"id":"c05-q133","chapterId":5,"number":133,"page":143,"stem":"급성 심근경색증 치료 후 증상이 호전되고 혈역학적으로 안정되어 퇴원예정이다. 다음\n중 이차적 예방을 위한 계획으로 옳지 않은 것은?","choices":["좌심실 부전이 없다면 베타차단제가 처방되어야 한다.","좌심실 부전이 있더라도 ACE-inhibitor는 처방되어야 한다.","renal failure나 hyperkalemia가 없다면 aldosterone blocker를 고려한다.","좌심실 부전이 없다면 calcium channel blocker가 처방되어야 한다.","항혈소판제나 항응고제가 처방되어야 한다."],"answer":4,"answerLabel":"④","answerPage":336,"explanation":"로차단제는 급성 심근경색증 환자의 장기생존율에\n도움이 되지 않으므로 필요하지 않은 경우 처방하지 않는다."},{"id":"c05-q134","chapterId":5,"number":134,"page":143,"stem":"심장재활에 대한 설명으로 옳지 않은 것은?","choices":["입원 치료 중에는 심장재활 1 단계를 적용할 수 있다.","입원 치료 중에는 심장재활 2단계를 적용할 수 있다.","운동 시 대상자의 주관적 운동강도인지도(RPE) 를 적용한다.","운동 전후 반드시 정리운동과 준비운동을 시행한다.","활동 시 산소소모량에 따라 가능한 활동내용을 처방할 수 있다."],"answer":2,"answerLabel":"②","answerPage":336,"explanation":"입원 중에 시행되는 심장재활을 1 단계라고 한다."},{"id":"c05-q135","chapterId":5,"number":135,"page":143,"stem":"심방세동으로 와파린을 복용하고 있는 50세 여자가(INR 3.0 유지) 이전에 쿠마딘 복용\n시 INR 2.4를 유지하면서 안정적이었다 매일 쿠마딘 5 mg을 복용하고 있는 환자에게\n이 검사 결과를 토대로 해야 할 중재는?","choices":["1 주간 coumadine 복용 증단 후 2.5 mg 투여","2.5 mg으로 감량 후 3일 째 INR 재검","vitamine K 투여 및 coumadine 2.5 mg으로 감량 2주 후 INR 재검","녹황색 채소를 과잉섭취하지 않도록 교육하고 관찰","환자가 정확하게 coumadine을 복용하는지 확인하고 식습관의 변동이 없었다면 동일 용량의 쿠마딘 복용 후 INR 재검"],"answer":5,"answerLabel":"⑤","answerPage":336,"explanation":"처방된 용량을 시간에 맞춰서 복용하고 약물효과에\n영향을 주는 식품은 복용하지 않도록 교육이 필요하다.\n우선 복용이력을 확인하고 그에 따라 약물복용법을\n재교육하도록 한다."},{"id":"c05-q136","chapterId":5,"number":136,"page":144,"stem":"관상동맥우회술(CABG)을 받고 수술 4일째인 50세 환자가 심방세동이 나타나고, 심실\n박동수 140회席 혈압 120/70 mmHg, 산소포화도 95% 이다. 다음 중 심실 박동수 조절\n을 위한 적절한 약물이 아닌 것은?","choices":["Digoxin","Verapamil","Nifedipine","Metoprolol","Carvedilol"],"answer":3,"answerLabel":"③","answerPage":336,"explanation":"Nifedipine은 박동을 조절하기 위해 투여하지 않는다."},{"id":"c05-q137","chapterId":5,"number":137,"page":144,"stem":"이 환자에게 예상되는 문제는?","choices":["기흉","종격동 출혈","급성호흡부전","심부전","호흡성 산증"],"passage":"다음 지문을 읽고 질문에 답하시오(문제 137-138).\n57 세 남자가 관상동맥우회술 후 집중치료실에 입원했다. 4AM 에 의식이 명료하여 어려움 없이 기\n관내관을 제거하였다. 5AM 에 진통제가 투여되지 않았는데도 환자가 기면상태였고, 한 시간 동안\n흉관을 통해 500 mL가 배액되었다. 환자의 활력징후와 혈역학적 지표는 다음과 같다.\n4AM 5AM\n혈압 100/70 100/66\n심장박동수 100 110\nPAOP 15 10\nCVP 10 7\nCardiac index 2.5 2.4\nPaO2 82 77\nPaCO2 37 39\npH 7.37 7.35\nHCO「 24 ______ 23_______________","answer":2,"answerLabel":"②","answerPage":336,"explanation":"한 시간 동안 500 mL의배액량은 수술부위출혈을\n의미하며, 출혈로 인한 저혈량성 shockOl 올 때 환자의\n의식이 저하된다. 저혈량을 의미하는 자료는 심장박동수\n증フト, PAOP, CVP 감소이다."},{"id":"c05-q138","chapterId":5,"number":138,"page":144,"stem":"이 환자에게 필요한 즉각적인 중재는?","choices":["도부타민 투여","에피네프린 투여","수혈","흉관 추가 삽입","흉부물리요법"],"passage":"다음 지문을 읽고 질문에 답하시오(문제 137-138).\n57 세 남자가 관상동맥우회술 후 집중치료실에 입원했다. 4AM 에 의식이 명료하여 어려움 없이 기\n관내관을 제거하였다. 5AM 에 진통제가 투여되지 않았는데도 환자가 기면상태였고, 한 시간 동안\n흉관을 통해 500 mL가 배액되었다. 환자의 활력징후와 혈역학적 지표는 다음과 같다.\n4AM 5AM\n혈압 100/70 100/66\n심장박동수 100 110\nPAOP 15 10\nCVP 10 7\nCardiac index 2.5 2.4\nPaO2 82 77\nPaCO2 37 39\npH 7.37 7.35\nHCO「 24 ______ 23_______________","answer":3,"answerLabel":"③","answerPage":336,"explanation":"한시간동안 500mL의 배액량은 수술부위 출혈을\n의미하며, 출혈로 인한 저혈량성 shockOl 올 때 환자의\n의식이 저하된다. 저혈량을 의미하는 자료는 심장박동수\n증가, PAOP, CVP 감소이다. 이때는 출혈로 인한 부족한\n혈액을 보충해주는 것이 첫 번째 중재이다."},{"id":"c05-q139","chapterId":5,"number":139,"page":145,"stem":"68세 여자가 관상동맥우회술 후 집중치료실에 입원하였다. 8시간 후 발관을 하였고, 약\n간의 흉부불편감만 있는 상태였다. 1 시간 뒤 환자는 흉부불편감이 조금 더 증가한다고\n호소하였다. 흉막 튜브를 통해서는 배액이 되고 있고, 종격동 튜브를 통해서는 배액량이\n보이지 않았다. 혈압은 호흡에 따라 변동이 있었는데 흡기 시 20 mmHg가 상승되었다.\n흉부 청진상 호흡음은 깨끗하고, 심음은 정상이나 소리는 감소되었다. 폐동맥카테터를\n통한 정보는 다음과 같을 때 이 환자에게 필요한 중재는?\n• 혈압 92/58 mmHg\n• 맥박 115 회/분\n• PAP 36/22 mmHg\n• CVP 18 mmHg\n• CO 3.2 L/min\n• Cl 1.9 L/min/m2","choices":["흉막 내 튜브 삽입","종격동 내 튜브 추가 삽입","도파민 주입","재삽관 및 인공호흡기 적용","Nitroprusside 주입"],"answer":2,"answerLabel":"②","answerPage":336,"explanation":"혈압, CO, Cl 감소, CVP 증가, mediastinal tube\n로 배액량이 보이지 않고 심음이 감소된 것은 pricardi이\ntamponade를 시사하며 곧 cardiac tamponade로\n악화되는 시점이므로 mediastin긔 tube를 추가로\n삽입하여 배액시켜 cardiac tamponade 악화를 막아야\n한다."},{"id":"c05-q140","chapterId":5,"number":140,"page":145,"stem":"수술 직후 환자가 맥박 126회/분 혈압 80/68 mmHg, PCWP 5 mmHg일 때, 다음 중\n가장 필요한 중재는?","choices":["0.9% 생리식염수 250 mL 주입","농축혈색소 Ipint 수혈","도파민 10 mcg/Kg/min 주입","바소프레신 40units 정맥 주입","5% 포도당 1,000 mL 주입"],"answer":2,"answerLabel":"②","answerPage":336,"explanation":"저혈압과 PCWP 의 저하는 V이ume replacement\n가 요구되는 상황이다. 수술로 인한 blood loss는 PCWP\n저하의 원인이며 수혈이 요구된다. packed c 이은\nintravascular blood v이ume을 보충해 준다.\n생리식염수는 일시적으로 V이ume replacement 해주지만\n몇시간 내에 혈관 외 공간으로 이동한다. 도파민이나\n바소프레신과 같은 혈관수축제는 V이ume 상태가 교정될\n때까지 주지 않는다. 5% 포도당은 세포 내 흡수가 더 많기\n때문에 intravascular blood v이ume을 보충해 주지\n못한다."},{"id":"c05-q141","chapterId":5,"number":141,"page":145,"stem":"관상동맥우회술을 받은 환자가 다시 수술적 처치가 필요한 적응증은?","choices":["흉관배액관을 통해 2시간동안 시간당 200 mL 이상의 혈액성 배액","도파민을 10 mcg/Kg/min 사용 중에도 2시간 동안 MAP 50 mmHg","심박출량 1.9L/min","PCWP 25 mmHg","RAP 15 mmHg"],"answer":1,"answerLabel":"①","answerPage":336,"explanation":"2시간 동안 시간당 200 mL 이상의 흉관배액은 출혈의\n교정 가능한 원인이 있는지 확인하기 위해 수술방으로\n가야하는 적응증이다. 낮은 MAP 는 도파민 용량 증가,\nnorepinephrine으로 약물변경, 혈압을 올리기 위해\n수액주입 등 약물적 보조요법이 요구되는 상황이다.\n심박출량이 낮은 경우는 혈관수축제, 수액요법 , 심박조율기\n맥박수 증가, 또는 IABP 적용이 필요하다. PCWP 상승은\n혈관이완제나 후부하를 감소시키기 위해 IABP 보조로 치료\n가능하다. RAP 증가는 이뇨제 등이 먼저 사용 가능하다."},{"id":"c05-q142","chapterId":5,"number":142,"page":146,"stem":"폐고혈압을 동반한 심방중격결손(ASD)으로 교정수술을 받은 환자가 2년 후 입원하였다.\n이 환자에게 발생 가능한 합병증은?","choices":["first degree AV block","second degree AV block (typel)","second degree AV block (type2)","complete AV block","Left branch bundle block"],"answer":4,"answerLabel":"④","answerPage":336,"explanation":"ASD repair 수술 후 scar 형성으로 인해 complete\nAV block이 가장 흔하게 나타난다. 수술 전에는 RA 와\nRV フト 커져서 RBBB 가 생기고, SA node에서 AV node\n로 conduction 지연으로 PR interv기이 연장된다. 그로\n인해 first and second degree AV block (typel)OI\n발생하지만 이는 수술 전에 나타나는 부정맥이다. 수술\n후에는 scar 형성으로 인해 complete AV block이\n발생할 수 있다."},{"id":"c05-q143","chapterId":5,"number":143,"page":146,"stem":"대동맥박리 환자의 수술 전 nitroprusside와 esmolol 을 가장 잘 사용하고 있는 경우는?","choices":["nitroprusside와 esmolol 둘 다 사용하여 MAP 70 mmHg, HR 70회/분 유지","SBP 〈140 mmHg 위해 nitroprusside 사용, HR 〈100분/회 위해 esmolol 주입","SBP 를 저하시키기 위해 nitroprusside를 10 mcg/Kg/min 이상 요구되는 경우 esmolol 추가하여 MAP 〈60 mmHg 유지","SBP 120-140 mmHg로 감소시키기 위해 esmolol 사용. HR 60회/분 이하로 감 소하면 esmolol 중지하고 nitroprusside 주입","nitroprusside는 10 mcg/Kg/min로 고정 주입하면서 SBP 140 mmHg 이상 시 esmolol 추가 주입"],"answer":1,"answerLabel":"①","answerPage":336,"explanation":"Nitroprusside와 esm이이은 혈압 감소, 심장박동수\n조절, 수축력 저하를 위해 함께 사용한다. 주입량 조절은\nMAP 70 mmHg, HR 70회/분이 되도록 해야 한다."},{"id":"c05-q144","chapterId":5,"number":144,"page":146,"stem":"관상동맥우회술을 받은 환자에게 수술 후 1~3일째 가장 잘 나타날 수 있는 부정맥 종\n류는?","choices":["심방세동","심방조동","심실상성 빈맥","방실 회귀성 빈맥","방실결절 회귀성 빈맥"],"answer":1,"answerLabel":"①","answerPage":336,"explanation":"심방세동이 심장수술 3일째 가장 흔한 부정맥이다.\n심방세동을 치료하거나 예방하기 위해 digoxin, b-blocker,\namiodarone, magnesium 등을 여러 가지 약물치료를\n함께 한다. AVNRT, SVT 와 같은 부정맥은 관상동맥 우회술\n후 나타나기도 하지만 cardiac septum을 포함한 수술을\n받은 경우 더 흔히 나타난다. 심방조동은 digoxin toxicity\n로 나타나기도 한다."},{"id":"c05-q145","chapterId":5,"number":145,"page":146,"stem":"승모판 대치술을 받은 환자의 RAP 18 mmHg, pulmonary artery diast이ic pressure\n(PAD) 4 mmHg일 때, 가장 우선적인 중재는?","choices":["생리식염수 500 mL 주입","Furosemide 40 mg IV","Norepinephrine 0.1 mcg/Kg/min 주입","vasopressin 40units IV","Aldactone 25 mg PO"],"answer":1,"answerLabel":"①","answerPage":336,"explanation":"우심실부전은 폐동맥고혈압이 있는 환자가\n승모판대치술을 받고 난후 발생할수 있다. 우심실에 부전이\n생기면 적절한 output을 위해 더 많은 volumeOl 요구된다.\nPAD나 wedge pressure를 15너8 mmHg 유지하기\n위해 crystalloid fluid를 대량 주입하면 된다. Nesiritide\n나 nitroglycerin은 우심실의 후부하를 감소시키기 위해\n수액 대량주입 시 함께 사용할 수 있다. furosemide나\n기dactone은 전부하를 감소시키고 우심실 부전을 더\n악화시킨다. Norepinephrine이나 vasopressin은\n혈관수축을 증가시키고 우심실 부전을 더 악화시킨다."},{"id":"c05-q146","chapterId":5,"number":146,"page":147,"stem":"복부대동맥 수술 후 2일째인 환자가 저혈압, 빈叫 복부팽만, 설사를 보이고 백혈구 상\n승이 나타났다. 이러한 결과가 나타난 주요 원인은?","choices":["수술 후 이식편 감염","허혈성 결장염","대동맥-장간 루","대동맥 구획증후군","이식편대 숙주반응"],"answer":2,"answerLabel":"②","answerPage":336,"explanation":"허혈성 결장염(ischemic colitis)은 mesenteric\nvessels의 embolization, occlusion, ligation 또는\nlong aortic cross-pump로 인한 hypoperfusion,\nhypov이emia로 인해 대동맥 수술 후 나타날 수 있다.\n초기증상은 부종, 백혈구 상승, 빈맥, 통증, 산증, 저혈압,\n설사 등이다. 이식편 감염은 2일 안에 나타나지 않지만\n증상은 빈맥, 저혈압, GI 증상 없는 백혈구 상승이다.\nfist니a형성 또한 늦게 나타나며 복막염, 위장출혈, 확인\n가능한 fist니a 형성 등이 증상으로 나타난다. 대동맥\n구획증후군증상은복통, rigidity, myo이obinuria가\n나타난다. 이식편대 숙주반응은 이식 환자에게 나타나는\n합병증이다."},{"id":"c05-q147","chapterId":5,"number":147,"page":147,"stem":"심장수술 후 심장외막 조율기 와이어를 제거하려고 할 때, 다음 중 바로 제거하면 안\n되는 경우는?","choices":["혈압 122/68 mmHg, 맥박 58회/분","14시간 전에 저분자 헤파린 30 mg 투여","INR 1.1","PTT 74 초","혈소판 150,000/pL"],"answer":4,"answerLabel":"④","answerPage":336,"explanation":"PTT 74초는 정상보다 거의 2배 상승되어 있는 것이다.\nPTT フト 상승된 경우 epicardia pacing wire를 제거하면\n출혈 및 심장압전이 생길 수 있다. 그러므로 PTT 가\n정상범위가 될 때까지 제거하면 안된다. 안정된 혈압과\n증상없는 서맥은 pacing이 요구되는 상황이 아니다.\n저분자 헤파린은 반감기가 길지만 12시간 이상 경과한\n경우는 안전하다. INR 와 혈소판은 정상범위이므로 제거해도\n괜찮다."},{"id":"c05-q148","chapterId":5,"number":148,"page":147,"stem":"cpb에 의한 영향에 대한 설명으로 옳은 것은?","choices":["catecholamine 분비에 의해 hypoglycemia가 있을 수 있다","CPB circuit 에 혈액이 노출되면서 보체계 활성화에 의한 혈전 형성 위험이 있다.","platelet나 RBC 손상에 의한 ARDS 가 발생할 수 있다.","initial massive diuretics에 의한 hyperkalemia가 있을 수 있다","cardiogenic solution에 의해 hyperglycemia가 있을 수 있다."],"answer":2,"answerLabel":"②","answerPage":337,"explanation":"CPB circuit 에 노출된혈액이보체계를 활성화시켜\n혈액응고를 유발하고 염증반응의 변화를 일으켜서 ARDS\n등의 다양한 장기합병증을 초래한다."},{"id":"c05-q149","chapterId":5,"number":149,"page":147,"stem":"담당의사에게 보고했을 때, 예상되는 검사처방은?","choices":["흉부 방사선검사","흉부 CT","심도자술","흉부 MRI","심전도"],"passage":"다음 지문을 읽고 질문에 답하시오(문제 149-150).\n62 세 남자가 흉골하 흉통으로 ICU에 입원하였다. 흉통은 니트로글리세린 투여 후에도 가라앉지\n않았고 모르핀 투여 후에 감소되었다. 심전도는 정상이었고, 흉부 방사선검사 상 종격이 넓어져\n있으며 aortogram에서 흉부대동맥류가 발견되었다. 수축기혈압을 낮추기 위해 nitroprusside\n가 1.0 mcg/Kg/min으로 주입되기 시작하였다. 환자가 갑자기 등이 아프다고 소리쳤다. 환자의\n신체사정 내용은 다음과 같다.\n• BP 190/100 mmHg, HR 110회/분, RR 30회/분\n• 피부차고축축함\n• 통증 10점(0~10점). 흉부 가운데와 견갑골 사이의 찢어질 듯한 통증","answer":2,"answerLabel":"②","answerPage":337,"explanation":"흉부대동맥류가 있는 환자가 혈압이 상승하고 흉부\n가운데와 견갑골 사이의 찢어질 듯한 통증을 호소하는\n것은 흉부대동맥류가 descending thoracic aorta\n쪽으로 더 진전되고 있음을 시사하므로 확인을 위해 흉부\nCT 검사가 시행되어야 한다. 방사선검사로는 확진할 수\n없으며 응급상황이므로 MRI 는 우선적이지 않다. 심전도가\n정상이므로 심전도 및 심도자술은 현재 필요하지 않다."},{"id":"c05-q150","chapterId":5,"number":150,"page":148,"stem":"이 환자에게필요한 중재는?","choices":["수축기 혈압〈120 mmHg","이완기 혈압〈40 mmHg","심장박동수 Q00회/분","심박출량 <2.0 L/min","통증점수〈4점"],"passage":"다음 지문을 읽고 질문에 답하시오(문제 149-150).\n62 세 남자가 흉골하 흉통으로 ICU에 입원하였다. 흉통은 니트로글리세린 투여 후에도 가라앉지\n않았고 모르핀 투여 후에 감소되었다. 심전도는 정상이었고, 흉부 방사선검사 상 종격이 넓어져\n있으며 aortogram에서 흉부대동맥류가 발견되었다. 수축기혈압을 낮추기 위해 nitroprusside\n가 1.0 mcg/Kg/min으로 주입되기 시작하였다. 환자가 갑자기 등이 아프다고 소리쳤다. 환자의\n신체사정 내용은 다음과 같다.\n• BP 190/100 mmHg, HR 110회/분, RR 30회/분\n• 피부차고축축함\n• 통증 10점(0~10점). 흉부 가운데와 견갑골 사이의 찢어질 듯한 통증","answer":1,"answerLabel":"①","answerPage":337,"explanation":"흉부대동맥류 환자에게는 혈압조절이 가장 중요하다.\n대동맥류가 더 악화되거나 파열되지 않도록 수축기 혈압을\n120 이하로 낮추어야 한다. 심부전이 아니므로 이완기\n혈압은 우선적인 조절사항이 아니다."},{"id":"c05-q151","chapterId":5,"number":151,"page":148,"stem":"말기 심부전으로 ICU에 입원한 환자의 므帆卜 86회/분, 혈압 80/66 mmHg, BiPAP 마스\n크를 통해 산소 60%를 공급하면서 호흡 26회/분 이고 양쪽 폐저부에서 수포음이 들렸\n다. 지참약은 furosemide, aten이이, potassium, captopril이었다. 입원 시 혈액검사 결\n과 혈청 알부민 2.0g/dL, HCT 52%, BUN 62mg/dL, creatinine 3.0mg/dL이었다. 이\n환자에게 적절한 초기 치료는?","choices":["도부타민 주입 시작","norepinephrine 주입시작","생리식염수 250mL 주입","furosemide 40mg IV 투약","aldactone 25mg 경구투약"],"answer":3,"answerLabel":"③","answerPage":337,"explanation":"이뇨제치료중인 환자에서, 수포음이 들리고 심부전이\n있음에도 불구하고 혈관시스템이 파괴되고 수액치료가\n필요한 상태이다. HCT 수치 상승은 hypovolemia를\n시사하며, 알부민 수치가 낮은 경우 interstiti기 space\n로 fluid가 loss된다. BUN/creatinine 비율이 20：1\n이상은 hypovolemia# 의미한다. 도부타민은 심실의\n수축력을 높이지만 혈관내 volumeOl 부족하기 때문에\nstroke volume이 낮은 상태에서는 혈압을 올릴 수 없다.\nnorepinephrine은 혈관수축을 통해 일시적으로 혈압을\n올리지만 혈관수축제는 V이ume 부족을 교정한 후에\n사용해야 한다. furosemide와 aldactone은 혈관내\nV이ume을 더 감소시킨다."},{"id":"c05-q152","chapterId":5,"number":152,"page":148,"stem":"응급실을 내원한 58세 여자 환자가 식은땀을 동반한 심한 흉통을 호소하였다 혈압 78/52\nmmHg, 맥박 104회/분, 호흡 20회/분, 호흡음은 깨끗하고 SpO2 98%였다. 환자에게 모\n니터를 연결하고 비강캐뉼라로 산소 2 L/min을 제공하고 정맥으로 0.9% N/S 을 10 mL/\nhr로 주입 시작하였다. 시술을 준비하는 동안 필요한 중재를 순서대로 잘 나열한 것은?","choices":["아스피린 경구투여, 심전도, 수액 대량 주입","니트로글리세린 설하투여, 산소농도 높이기, 모르핀 투여","심전도, 니트로글리세린 설하투여, 아스피린 경구투여","수액 대량 주입, 아스피린 경구투여, 심전도","모르핀 투여, 니트로글리세린 설하투여, 침상안정"],"answer":4,"answerLabel":"④","answerPage":337,"explanation":"임상증상은 저혈압이 합병증으로 나타난 acute\ncoronary syndrome이다. 제일 먼저 coronary\nperfusion을 떨어뜨리는 저혈압을 해결해야 한다. 호흡음이\n깨끗하므로(수액주입의 다른 합병증이 없으므로) 수액을 대량\n주입하여 저혈압을 개선해야 한다. 아스피린은 급성 흉통\n해결을 위해 투약하고, 정확한 진단을 위해 심전도를 찍어\n확인하는 것이 도움이 된다."},{"id":"c05-q153","chapterId":5,"number":153,"page":148,"stem":"급성관상동맥 증후군으로 중환자실에 입원한 환자에게 비강캐뉼라를 통해 산소 2 L/min\n가 투여되고 헤파린 프로토콜이 시작되었는데 환자가 상복부 통증을 호소하였다. 이때\n가장 먼저 수행해야 할 중재는?","choices":["혈청 트로포닌검사","비위관 삽입","니트로글리세닌 설하 투여","혈전용해제 투여","산소투여를 마스크로 변경"],"answer":3,"answerLabel":"③","answerPage":337,"explanation":"inf. wall Ml일 때는 상복부 통증이나 GI증상을\n보인다. 산소투여 중이므로 니트로글릿린 설하투여를\n해주어야 한다. 혈청 트로포닌은 니트로글리세린 투여\n후에 검사한다. 비위관은 헤파린 투여중으로 신중하게\n삽입해야 한다. 헤파린을 투여하고 있으므로 혈전 용해제\n투여는 필요 없다."},{"id":"c05-q154","chapterId":5,"number":154,"page":149,"stem":"심근염을 진단받은 환자가 흉통을 호소할 때 가장 효과적인 약물 중재는?","choices":["Nitroglycerin 설하투여","Furosemide 40mg IV투여","Ibuprofen 800mg 경구투여","Morphine 2mg IV 투여","Aspirin 500mg 경구투여"],"answer":4,"answerLabel":"④","answerPage":337,"explanation":"Morphine이 심근염의 흉통에 가장 효과적인\n약물이다. 심근염에서 통증은 심근의 염증과 자동면역\n침윤과 관계된다. 심근염의 통증과 관상동맥 혈류와\n관계없기 때문에 니트로글리세린은 효과가 없다. 이뇨제는\n심근염과 관련된 심부전이 있을 때 효과적이지만 통증을\n경감시키지는 않는다. NSAIDs와 아스피린은 출혈과\n심장압전과 같은 합병증을 유발할 수 있기 때문에 금기이다."},{"id":"c05-q155","chapterId":5,"number":155,"page":149,"stem":"폐울혈과 쇼크의 증상 및 징후를 보이고, 수축기 혈압이 70 mmHg 이하일 때, 우선적\n으로 사용해야 할 약물은?","choices":["도파민 20 mcg/Kg/min","도부타민 25 mcg/Kg/min","니트로글리세린 9.9 mcg/min","노에피네프린 10 mcg/min","밀리논 Q5 mcg/Kg/min"],"answer":4,"answerLabel":"④","answerPage":337,"explanation":"노에피네프린이 가장 빨리 혈압을 상승시킬 수 있는\n혈관수축제이다. 도파민은 혈압이 최소 70 이상일 때\n효과적이다. 도부타민은 혈압이 70~100 정도이면서\n쇼크의 증상이 없는 폐울혈 적응증이다. 니트로글리세린은\n혈압이 90-100 이상일 때 SVR 과 심장 일을 감소시켜\n폐울혈에 적응증이 된다. 밀리논은 강심제이나 말초혈관\n이완작용을 한다."},{"id":"c05-q156","chapterId":5,"number":156,"page":149,"stem":"icd(이식형 심장율동전환-제세동기)를 가진 환자에게 심실세동이 발생하였는데 이식형\n제세동기가 전기충격을 발생시키지 않았다. 이때 가장 적절한 중재는?","choices":["경정맥 심박조율기를 삽입한다.","적어도 3주기까지는 ICD가 리듬을 제어하도록 둔다.","monophasic 36이로 수동 제세동하기 전에 자석을 기기위에 둔다","제세동 패드를 ICD generator로부터 앞뒤로 2인치 이상 멀리 두고 monophasic 360J로 제세동한다.","제세동 패드를 왼쪽 5번째 늑간쪽 젖꼭지 왼쪽과 흉골 오른쪽 쇄골아래 두고 biphasic 50J로 제세동한다."],"answer":4,"answerLabel":"④","answerPage":337,"explanation":"ICD가 리듬을 제어하는 데 실패하면, 간호사는\nACLS에 따라 monophasic 360J0IQ biphasic\n120~200J로 제세동을 시도해야 한다. 수동 제세동을\n시행하기 전에 ICD를 끌 필요는 없다. 제세동기 패드는\nanterior-anterior 또는 anterior-posterior 에 위치하면\n되지만, ICD generator와는 2인치 이상 멀리두고\nmonophasic 360J을 시행하면 된다."},{"id":"c05-q157","chapterId":5,"number":157,"page":149,"stem":"급성 신금경색을 진단받고 입원한 환자가 갑자기 혈압 76/58mmHg, 호흡곤란 경정맥\n확장을 보였고, 크고 높은 음조의 범수축기 잡음이 들렸다. 이 환자에게 필요한 즉각적\n인 중재는?","choices":["CABG 수술을 위해 수술방으로 옮긴다.","니트로글리세린을 IV로 투여하고 IABP를 삽입한다.","PCI를 위한 준비를 한다.","수축기 혈압이 90 mmHg 이상 될 때까지 노에피네프린을 투여한다.","biphasic 50J로 심장율동전환을 시행한다."],"answer":2,"answerLabel":"②","answerPage":337,"explanation":"ventricular septal rupture와 papillary muscle\nru이ure는 급성 심근경색증 후 갑작스럽게 발생할 수\n있으며 큰 수축기잡음과 좌심실부전 증상이 나타난다.\n즉각적인 치료는 혈관이완제와 IABP를 이용하여 LV\n후부하를 감소시ヲ |는 것이다. 수술을 해야한다면 관상동맥의\n문제가 아니기 때문에 CABG는 적절하지 않다. PCI는\nventricular septal rupture와 papillary muscle\nrupture의 치료에 효과적이지 않다. 응급으로 v기ve나\nseptal 수술이 필요한 상황이다. 중격결손에 대한\nendovascular repair가 필요할 수도 있다. 혈관수축제\n사용은 심부전을 더 악화시킬 수 있다. 심장율동전환이\n필요한 부정맥에 대한 정보는 없다."},{"id":"c05-q158","chapterId":5,"number":158,"page":150,"stem":"혈압이 240/140 mmHg인 고혈압 위기 환자에게 nitroprusside# 지속주입하려고 한匚ヒ\n적절한 수축기 혈압 목표는?","choices":["1시간 안에 140 mmHg","2시간 안에 150 mmHg","2시간 안에 170 mmHg","3시간 안에 120 mmHg","3시간 안에 100 mmHg"],"answer":3,"answerLabel":"③","answerPage":337,"explanation":"갑작스런 혈압 하강은 뇌 자율조절시스템을 망가뜨릴\n수 있다. 뇌 자율조절 메카니즘을 온전하게 유지하기\n위해서는 혈압을 2시간에 걸쳐 25~30%씩 감소시켜야\n한다."},{"id":"c05-q159","chapterId":5,"number":159,"page":150,"stem":"오른쪽 다리가 차고 발가락이 푸르게 변색된 환자의 족배동맥과 후경골 동맥이 촉지되\n지 않는다. 이 환자에게 해서는 안 되는 중재는?","choices":["오른쪽 다리 거상","역 Trend이enberg 자세","헤파린 투여","혈관이완제 투여","온열담요 적용"],"answer":1,"answerLabel":"①","answerPage":337,"explanation":"맥박이 없는 사지의 거상은 perfusion을 더 감소시키므로\n금기이다. 역 Trendelenberg 자세는 dependent position\n에 있는 다리에 혈류를 증가시켜 줄 수 있다. 헤파린은 폐색을\n일으키는 혈전을 분해하는데 도움을 준다. 혈관이완제는\nCh 叩ter 05 순환기계 | 337\n다리와 발가락 혈액순환을 도와준다. 온열담요 역시\n혈관이완을 도와준다."},{"id":"c05-q160","chapterId":5,"number":160,"page":150,"stem":"만성 심방세동으로 와파린을 복용하는 환자의 INR 수치가 4.0이다 이때 적절한 중재는?","choices":["4일동안 와파린 복용을 중단하고 5일째 INR 검사를 한다","즉시 입원하게 한다.","비타민K 를 투여하고 2시간 뒤에 INR 검사를 한다.","하루동안 와파린 복용을 중단하고 다음날 INR 검사를 한다.","와파린 복용을 중단하고 헤파린을 정맥주입 한다."],"answer":4,"answerLabel":"④","answerPage":338,"explanation":"만성 심방세동에서 와파린 복용 환자의 치료적 INR\n수치는 2.0~3.0이다. INR 가 4.0 이상이면 출혈의 위험이\n있다. 출혈이 없는 INR 5.0이하이면 와파린을 일시적으로\n중단하면 된다. 만약 출혈이 있거나 출혈 위험이 큰 환자의\nINR 가 4.0 이상이면 비타민K 를 투여해야한다. INR 가\n상승되어 있으면서 출혈의 고위험 환자라면 입원하여\n집중감시가 필요하지만 동반질환(출혈, thrombocytopenia)\n이 없고, 위험도가 낮은 환자라면 외래에서 모니터링해도\n된다. INR 체크 없이 5일간 와파린을 중단할 필요는 없다."},{"id":"c05-q161","chapterId":5,"number":161,"page":150,"stem":"io년 동안 디곡신을 복용중인 노인 환자에게 심전도 상 갑자기 심방세동이 나타났다. 맥\n박은 60회/분이고 위장관 불편감을 호소하였다. 적절한 중재는?","choices":["혈청 전해질과 디곡신 수치검사","혈청 TSH, 디곡신, 전해짛 수치검사","디곡신 투약을 유지하고 하루 더 관찰","디곡신 투약 중단 후 12유도 심전도 측정","디곡신 수치를 검사하고 결과가 나오는 동안 절반 용량 투약"],"answer":2,"answerLabel":"②","answerPage":338,"explanation":"갑상샘기능항진증이 있는 경우 심방세동이 나타날\n수 있다. 전해질 불균형 특히 포타슘, 칼슘, 마그네슘이\n심방세동을 유발할 수 있다. 그리고 노인환자가 디곡신을\n처방대로 복용하지 않았을 수도 있다. 그러므로 혈청 TSH,\n디곡신, 전해질 수치를 검사해야 한다."},{"id":"c05-q162","chapterId":5,"number":162,"page":151,"stem":"모든 외상 환자는 타© monitoring을 적용해야 한다. 환자가 의식이 없고 맥박이 촉지되\n지 않은 상태에서 EKG 가 다음과 같을 때 추정 가능한 원인은?","choices":["cardiac tamponade, tension pneumothorax","tension pneumothorax, hyperkalemia","profound hypovolemia, hyperkalemia","hyperkalemia, toxin","hypokalemia, coronary thromobis"],"answer":1,"answerLabel":"①","answerPage":338,"explanation":"PEA 상태이며 cardiac tamponade나 tension\npneumothorax 등에서 나타날 수 있다."},{"id":"c05-q163","chapterId":5,"number":163,"page":151,"stem":"Gl bleeding 환자에게 asystoleOl 발생하여 30분간 CPR 을 시행 중 다음과 같은 심전\n도가 나타났을 때 가장 먼저 시행해야 할 것은?","choices":["의식을 확인한다.","경동맥 맥박을 촉지한다.","혈압을 측정한다.","epinephrine을 투여한다.","amiodarone을 투여한다."],"answer":2,"answerLabel":"②","answerPage":338,"explanation":"심전도가 회복되었으나 PEA 일 수 있으므로 맥박을\n먼저 촉지해서 자발순환회복(recovery of spontaneous\ncirculation； ROSC) 여부를 확인해야 한다."},{"id":"c05-q164","chapterId":5,"number":164,"page":151,"stem":"저체온증에 의한 심정지가 발생한 환자에게 cpr 중이다. 최초 심전도가 심실세동으로\n1,2 차 defibrillation을 시행한 상태이다. 2분 뒤 심전도가 다음과 같이 변화했다면, 이때\n중재로 옳은 것은?","choices":["즉시 맥박을 촉지한다.","즉시 제세동을 시행한다.","흉부압박을 지속한다.","intubation을 시행한다","amiodarone 300 mg을 iv한다."],"answer":3,"answerLabel":"③","answerPage":338,"explanation":"무수축상태이므로 제세동이나 항부정맥제는 필요하지\n않고 흉부압박을 지속하면서 epinephrine 1 mg을 3\n분마다 정맥주사 해야 한다."},{"id":"c05-q165","chapterId":5,"number":165,"page":152,"stem":"심전도 모니터링 중에 다음과 같이 빈맥을 보이는 환자가 갑자기 의식이 혼미해지고 호\n흡곤란을 호소한다. 환자에게 가장 우선적으로 시행해야 할 것은?","choices":["defibrillation","cardioversion","valsalva 수기","carotid massage","pacemaker"],"answer":2,"answerLabel":"②","answerPage":338,"explanation":"PSVT 상태이고 narrow QRS, regular rhythm\n이며 환자의 의식이 혼미하고 호흡곤란이 있는 전신증상이\n나타나고 있으므로 즉시 cardioversion을 실시한다."},{"id":"c05-q166","chapterId":5,"number":166,"page":152,"stem":"이 환자에게 적용할 심정지 후 통합치료의 내용으로 옳은 것은?","choices":["BST 결과가 비정상이므로, insulin을 피하주사한다.","급성 심근경색증이므로 즉시 관상동맥시술을 한다.","혈압을 상승시키기 위해 epinephrine Img 을 정맥주사한다.","산소화를 증가시키기 위해 ventilator를 조정한다.","ETC? 를 정상화시키기 위해 ventilator# 조정한다."],"passage":"다음 지문을 읽고 질문에 답하시오(문제 166-167 ).\n1 년 전 pci를 받은 환자가 가슴 중앙의 뻐근한 통증과 호흡곤란을 호소하던 중 심정지가 발생\n하였다. 즉시 ACLS 을 시행하여 ROSC 상태가 되었으나. 어떠한 자극에도 반응이 없고. E-tube\n를 통해 BVM 을 적용 중이다. V/S 및 검사결과는 다음과 같다.\n• BP 80/50 mmHg\n• HR 50 회/분\n• T 36.3℃\n• SpO294%\n• RR 12 회/분\n• ETCO 2 38\n• BST 150 mg/dL","answer":2,"answerLabel":"②","answerPage":338,"explanation":"STEMI 에 의한 심정지이므로 ROSC 이후의\n심정지후통합관리 단계에서 원인을 치료하기 위한\n관상동맥재관류 여부를 확인하고 중재술을 적용하는 것이\n필요하다."},{"id":"c05-q167","chapterId":5,"number":167,"page":153,"stem":"이 환자에게 저체온요법을 적용하기로 결정되었다면 이에 대한 설명으로 옳지 않은 것은?","choices":["ROSC 후 혼수상태를 보이는 환자에게 뇌를 포함한 다른 장기의 기능을 보호하 기 위해 적용한다.","혼수상태가 호전될 때까지 적용한다.","중심 체온 32〜34簿를 유지한다.","얼음주머니를 적용하고, 차가운 생리식염수를 빠르게 정맥주사한다.","재가온 시 고체온증이 있다면 37.6℃ 이하로 조절한다. 다음 지문을 읽고 질문에 답하시오문제 168T69). 승모판 부전으로 어제 입원한 남자환자가 기계판막 대치술을 받고 SICU로 돌아왔다. 신체사정 내용은 다음과 같다. • 체온 36.28℃ • 맥박 80 회/분(일시적 심박조율기 사요 • 혈압 86/60 mmHg • 호흡 12회(인공호흡기 ACMV mode) • PAS 15 mmHg, PAD 8 mmHg, PAOP 4 mmHg, RA 3 mmHg • CO 4.9 L/min, Cl 1.9 L/min/m2, SVR 2200 dynes/s/cm5"],"passage":"다음 지문을 읽고 질문에 답하시오(문제 166-167 ).\n1 년 전 pci를 받은 환자가 가슴 중앙의 뻐근한 통증과 호흡곤란을 호소하던 중 심정지가 발생\n하였다. 즉시 ACLS 을 시행하여 ROSC 상태가 되었으나. 어떠한 자극에도 반응이 없고. E-tube\n를 통해 BVM 을 적용 중이다. V/S 및 검사결과는 다음과 같다.\n• BP 80/50 mmHg\n• HR 50 회/분\n• T 36.3℃\n• SpO294%\n• RR 12 회/분\n• ETCO 2 38\n• BST 150 mg/dL","answer":2,"answerLabel":"②","answerPage":338,"explanation":"저체온요법의 최적온도와 기간은 결정되지 않았지만\nROSC 후 12~24시간을 권고한다."},{"id":"c05-q168","chapterId":5,"number":168,"page":153,"stem":"co/ci의 저하와 저혈압을 일으킨 원인으로 추정되는 것은?","choices":["혈량과다","심근수축력 손상","혈량과소","후부하 증가","심박조율기 부전"],"answer":3,"answerLabel":"③","answerPage":338,"explanation":"Hypov이emic shock에서는 중심정맥압(RA),\nPAOP, BP는 낮으며 SVR 은 상승한다. 심박조율기 부전에\n대한 정보는 없다."},{"id":"c05-q169","chapterId":5,"number":169,"page":153,"stem":"이 환자에게 즉시 필요한 중재는?","choices":["심실 수축력 증가를 위해 Dobutamine 투여","후부하를 감소시키기 위해 Sodium nitroprusside 투여","심장박동수를 90회/분으로 올림","전부하를 증가시키기 위해 수액 주입","후부하를 증가시키기 위해 Vasopressin 투여"],"answer":4,"answerLabel":"④","answerPage":338,"explanation":"중심정맥압(RA), PAOP, BP는 낮으며 SVR 은\n상승했으므로 hypovolemic shock이다. 이때는 전무하를\n증가시키기 위해 V이ume을 주입해야 한다."},{"id":"c05-q170","chapterId":5,"number":170,"page":154,"stem":"48세 여자가 호흡곤란과 심한 피로감으로 CCU에 입원했다. 15년 전 세균성 심내막염을\n앓았고 이후 승모판 기능부전이 있다. 입원 당일 심장박동수는 APC를 동반한 동성리듬\n을 보였고, 혈압은 150/94 mmHg였다. 흉부 청진 시 왼쪽 폐저부에서 수포음이 들렸다.\n혈역학적 사정결과는 다음과 같을 때 이 환자에게 필요한 우선적인 중재는?\n• RAP 12 mmHg. PAP 35/25 mmHg. PAOP 24 mmHg\n• CO 4.8 L/min, Cl 1.9 L/min/m2, SVR 2100 dynes/s/cm5","choices":["조직에 산소공급을 증가시킨다.","강심제 사용 시작을 고려한다.","혈압을 낮추기 위해 Sodium nitroprusside을 투여한다.","전부하를 감소시키기 위해 이뇨제를 투여한다.","심장박동수를 낮추기 위해 베타차단제를 투여한다."],"answer":4,"answerLabel":"④","answerPage":338,"explanation":"RAP, PAP, PAOP フト 모두 상승하여 전부하가\n증가되어 있고 그 결과 수포음이 들리는 pul. edema\n상태이다. 이때는 전부하를 감소시키기 위해 이뇨제를\n사용해야 한다."},{"id":"c05-q171","chapterId":5,"number":171,"page":154,"stem":"관상동맥우회술 후 2시간 경과된 환자의 사정내용은 다음과 같을 때 이 결과들이 시사\n하는 내용은?\n• HR 80 회/분(100%심박조율), BP 80/62 mmHg. MAP 68 mmHg\n• RAP 15 mmHg. PAD 14 mmHg, CO 3.0 L/min\n• 흉관배액관을 통해 2시간 동안 50 mL의 배액량을 보임","choices":["심장수술 후 정상코스","심근 기면(stunning)","심장 압전","수술 후 심근경색증","수술 후 폐울혈"],"answer":3,"answerLabel":"③","answerPage":338,"explanation":"Pericardial tamponade 시 부적절한 심장분출로\n인해 저혈압 발생 및 경정맥 확장, 빈맥이 보인다.\nPericardii tamponade의 3가지 특징은 수축기혈압\n저하, CVP/JVP 증フト, 감소된 심음이다. 심근 기면\n(stunning)로 인한 심장수술 직후 초기에 빈맥은 보이지\n않았다. 심근경색증 및 폐울혈에 대한 자료는 없다."},{"id":"c05-q172","chapterId":5,"number":172,"page":154,"stem":"심장성 쇼크로 ICU에 입원한 환자가 IABP (intra-aortic b겡loon pump)와 혈관수축제\n를 사용하고 있다. 다음 중 현재 치료가 적절함을 알려주는 가장 좋은 사정결과는?","choices":["HR 100회/분, MAP 66 mmHg, SVR 1200 dynes/s/cm5","HR 117회/분, MAP 53 mmHg, SVR 1900 dynes/s/cm5","HR 110회/분, MAP 70 mmHg, SVR 2800 dynes/s/cm5","HR 105회/분, MAP 53 mmHg, SVR 2400 dynes/s/cm5","HR 90회/분, MAP 55 mmHg, SVR 2000 dynes/s/cm5"],"answer":1,"answerLabel":"①","answerPage":338,"explanation":"심장성 쇼크 환자의 치료목표는 cental & peripheral\nperfusion을 보장하기 위해 평균혈압(MAP)을 올리는\n것이다. MAP 는 60이상이어야 cerebral perfusion을\n제공할 수 있다. 증가된 SVR 은 left ventricular work\n을 증가시키고 말단장기의 perfusion을 떨어뜨릴 수 있다.\n정상에 가까운 HR 은 myocardial workOI 감소되고\n잠정적으로 조직의 산소화가 개선됨을 알려준다."},{"id":"c05-q173","chapterId":5,"number":173,"page":155,"stem":"대동맥 역류로 대동맥판막치환술을 받은 후 다음과 같은 혈역학적 지표가 나타난 환자\n에게 적절한 중재는?\n• HR 70 회/분(100% 심박조율\n• BP 90/40 mmHg\n• MAP 56 mmHg\n• PCWP 18 mmHg\n• 소변량 100 mL/hr","choices":["생리식염수 250 mL 주입","도부타민 주입","norepinephrine 주입","심박조율 80회/분으로 올림","furosemide 40 mg IV"],"answer":3,"answerLabel":"③","answerPage":338,"explanation":"대동맥역류는 좌심실의 불응성과 확장을 초래한다.\nNorepinephrine 과 같은 alpha-adrenergic 효과가\n있는 혈관수축제는 좌심실의 수축력과 compliance를\n증가시켜주고 혈압을 상승시키기 위해 말초혈관을\n수축시킨다. V이ume 대량주입은 확장되고 불응성\n좌심실에서는 BP, CO 을 향상시키기에 충분하지 않다.\nPCWP 와 소변량은 혈관내 V이ume이 적절함을 나타낸다.\n심근에 도부타민과 같은 beta-adrenergic 효과는 LV\n수축력과 심박수를 증가시키지만 도부타민의 beta 2\n효과는 말초 혈관을 확장시켜 혈압을 떨어뜨릴 수 있다.\n순환혈량을 증가시키지 않고 pacing rate만 증가시키는\n경우 심근의 일만 증가시킨다. 이뇨제는 사용 시 혈압을\n더 떨어뜨린다."},{"id":"c05-q174","chapterId":5,"number":174,"page":155,"stem":"저혈량성 쇼크에서 수액치료가 적절하게 잘되었음을 나타내는 지표는?","choices":["SVO2 45%, CO 3.0 L/min, SVR 800 dynes/s/cm5","SVO2 45%, CO 5.0 L/min, SVR 1900 dynes/s/cm5","SVO2 68%, CO 5.0 L/min, SVR 2100 dynes/s/cm5","SVO2 68%, CO 4.4 L/min, SVR 1100 dynes/s/cm5","SVO2 50%, CO 3.5 L/min, SVR 1600 dynes/s/cm5"],"answer":4,"answerLabel":"④","answerPage":338,"explanation":"norm게 CO 4-8 L/min, SVO 2 60-80%, SVR\n800-1200\nSVO? 의 감소는 hypovolemia, 헤모글로빈 감소, 조직의 산소소비\n증가를 나타내며 , SVR 증가는 말단의 혈관수축으로 수액처치가\n적절하지 않음을 나타낸다. SVR 의 증가는 심박출량을 유지하기 위해\n더 많은 volume이 필요함을 의미한다."},{"id":"c05-q175","chapterId":5,"number":175,"page":155,"stem":"삼첨판역류 환자에게 폐동맥 카테터를 삽입하였다 이 환자의 상태로 인해 왜곡될 수 있\n는 혈역학적 지표값은?","choices":["중심정맥압","폐동맥 수축기압","폐동맥 이완기압","폐동맥 쐐기압","동맥압"],"answer":1,"answerLabel":"①","answerPage":338,"explanation":"삼첨판 역류로 인해 중심정맥압 값이 변화한다. 역류된\n혈액의 난류가 우심방을 통해 vena cava 안으로까지\n들어가기 때문이다. 삼첨판 역류가 폐동맥압이나 폐동맥\n쐐기압을 변화시키지는 않는다. 동맥압에도 영향을 미치지\n않는다."},{"id":"c05-q176","chapterId":5,"number":176,"page":156,"stem":"임신 31 주된 32세 임신부가 호흡곤란과 피로로 입원하였다. 양쪽 폐저부에 수포음을 들\n리고 말초 산소포화도는 88%이다. 심초음파 상 좌심실이 확장되고 기능감소가 보이면\n서 심박출률이 20~25%를 보였다 폐동맥 카테터를 통한 정보는 다음과 같을 때 용적\n과부하를 시사하는 혈역학적 정보는?\n• RAP 12 mmHg\n• PAP 48/26 mmHg\n• PAOP 24 mmHg\n• CO 3.7 L/min\n• Cl 1.8 L/min/m2","choices":["PAP 48/26 mmHg","RAP 12 mmHg, PAOP 24 mmHg","EF 20~ 25%","말초 산소포화도 88%","CI 1.8L/min/m2"],"answer":2,"answerLabel":"②","answerPage":338,"explanation":"심장의 pr이。ad 는 RAP 와 PAOP 를 통해 알 수\n있다. V이ume overload 시에는 RAP 와 PAOP 가\n증가한다. EF 와 CI 저하는 심박출과관계되며 PAP 상승은\n폐동맥고혈압과 관련된다."},{"id":"c05-q177","chapterId":5,"number":177,"page":156,"stem":"이 환자의 증상을 볼 때, 폐동맥 카테터를 통해 나타날 것으로 예상되는 것은?","choices":["PAOP <10 mmHg, SI >25 mL/m：, CI〈2 L/m2","PAOP >22 mmHg, SI <25 mL/m2, CI <2 L/m2","CVP >15 mmHg, CI >4/m,","SVR >2000 dynes/s/cm\\ CI >4/m2","SVR >2000 dynes/s/cm5, CVP>15 mmHg"],"passage":"다음 지문을 읽고 질문에 답하시오(문제 177-178).\n58 세 남자가 심근경색증이 의심되어 입원하였다. 혈압 82/52 mmHg, 맥브f 122회/분이었고. 기\n좌호흡과 극심한 불안을 보이면서 호흡음은 수포음이 들렸는데 특히 뒤쪽에서 저명하게 들렸다.\n한 시간 뒤 폐동맥 카테터를 삽입할 예정이다.","answer":2,"answerLabel":"②","answerPage":339,"explanation":"환자의 증상은 심장의 전부하는 상승되어 있고(좌위호흡,\n수포음), 심근의 수축력은 떨어져 있음(혈압 82/52 mmHg\n의 저혈압, 맥박 122회/분의 빈맥을 보여준다. 위 보기에서\n전부하가 증가되어 있으면서 심근수축력 저하되어 있는\n경우는 ②번이다. SVR 의 변화를 알 수 있는 정보는\n부족하다."},{"id":"c05-q178","chapterId":5,"number":178,"page":156,"stem":"이 환자에게 가장 효과적인 약물치료는?","choices":["Dopamine, nitroprusside","Furosemide, milrinone","Dobutamine, epinephrine","Morphine, furosemide","Nitroglycerin, norepinephrine part ii 전문실무영역 I 15b"],"passage":"다음 지문을 읽고 질문에 답하시오(문제 177-178).\n58 세 남자가 심근경색증이 의심되어 입원하였다. 혈압 82/52 mmHg, 맥브f 122회/분이었고. 기\n좌호흡과 극심한 불안을 보이면서 호흡음은 수포음이 들렸는데 특히 뒤쪽에서 저명하게 들렸다.\n한 시간 뒤 폐동맥 카테터를 삽입할 예정이다.","answer":2,"answerLabel":"②","answerPage":339,"explanation":"전부하를 감소시키기 위해 이뇨제(Furosemide)와,\n심수축력을 강화시키기 위해 강심제(milrinone)를 투약할\n수 있다."},{"id":"c05-q179","chapterId":5,"number":179,"page":157,"stem":"다음중 심실성 부정맥을 야기할 위험이 가장 큰 전해질 불균형은?","choices":["혈청 포타슘 3.2 mEq/L","혈청 소듐 125 mEq/L","혈청 마그네슘 20 mg/dL","혈청 칼슘 8.0 mg/dL","혈청 클로라이드 105 mEq/L"],"answer":1,"answerLabel":"①","answerPage":339,"explanation":"hypok기emia가 심실성 부정맥을 야기할 가능성이\n크다. 혈청 포타슘 정상범위는 3.5~5.0이다. 소듐\n정상치는 135~145이지만 비정상은 혈압, 근육강도,\n감각과 관련되고 심실성부정맥을 야기하지는 않는다.\n마그네슘은 심실성 부정맥 치료에 효과적이지만 2.0은\n정상수치이다. 낮은 혈청 칼슘치는 심근에 negative\ninotropic effect# フト지지만 calcium channel blocker\ntoxicity와 heart block으로 인한 부정맥이 아니라면\n심실성 부정맥에 영향을 주지는 않는다. 클로라이드는\n소듐과 비슷한 역할을 하며 심실성 부정맥을 야기하지\n않으며 정상범위수치이다."},{"id":"c05-q180","chapterId":5,"number":180,"page":157,"stem":"심장이식 후 거부반응이 예상될 때 확진을 위해 필요한 검사는?","choices":["심전도","심근생검","심장초음파","혈액배양검사","관상동맥조영술"],"answer":2,"answerLabel":"②","answerPage":339,"explanation":"혈액검사, 심전도, 초음파는 거부반응 진단에 큰\n도움이 되지 않는다. 심근생검술로 진단을 내린匚卜.\n관상동맥조영술은 거부반응이 아니라 관상동맥의 좁은\n부위를 찾는데 도움이 된다."},{"id":"c05-q181","chapterId":5,"number":181,"page":157,"stem":"심장이식 후 한달째인 환자가 전신무력감을 호소하며 발열, 저혈압 심부전 증상이 보인\n다. 가장 먼저 고려해야 할 약물중재는?","choices":["aspirin 경구투여","bactrim 경구투여","gancyclovir 정맥투여","amphotericin B 정맥투여","methylprednisolone 정맥투여"],"answer":5,"answerLabel":"⑤","answerPage":339,"explanation":"급성거부반응이 예상되므로 거부반응의 치료는 먼저\nmethylprednisolone 500~1000 mg을 3일간 정맥투여\n하는 것이다. Gancyclovir는 CMV 양성일 때, 진균감염에\namphotericin B, 폐포자충 감염방지를 위해 bactrim\n을 복용한다."},{"id":"c05-q182","chapterId":5,"number":182,"page":157,"stem":"wi 모드로 인공 심박조율기를 하고 있는 환자의 심전도가 다음과 같을 때 의미하는 것은?","choices":["i：i로 적절하게 반응하고 있다.","감지부전을 보인다.","포착부전을 보인다.","과소감지를 보인다.","과다감지를 보인다."],"answer":1,"answerLabel":"①","answerPage":339,"explanation":"VVI MODE 에서 ventri이e에서의 전기자극 감지가\n없어 1：1로 ventricle pacingOI 이루어지고 있는\n모습이다."},{"id":"c05-q183","chapterId":5,"number":183,"page":158,"stem":"심근경색증 환자가 pci와 혈전용해술 실패로 관상동맥우회술을 받았다. 환자는 의식이\n명료하고 의사소통이 가능하였다. 수술 후 흉막과 종격동에 튜브가 삽입되어 있고 중정\n도의 배액량을 보였다. 수술부위와 오른쪽 pci 시술부위에도 중정도의 삼출물이 보였다.\n환자는 폐동맥카테터, 비위관과 유치도뇨관을 가지고 있다. 이 환자에게 추가로 간호사\n가 시간마다 확인해야 하는 것은?","choices":["뇌출혈을 확인하기 위해 동공반사를 본다.","후복막 출혈 확인을 위해 등을 시진한다.","오른쪽 다리의 SMC 확인과 서혜부를 촉진한다.","위장줄혈을 사정하기 위해 장음을 청진한다.","부정맥을 확인하기 위해 12유도 심전도를 찍는다."],"answer":3,"answerLabel":"③","answerPage":339,"explanation":"혈전용해제를 사용했고 곧바로 서혜부를 통해 PCI\n한 후 CABG를 했기 때문에 시술부위 혈종 발생 가능성이\n매우 크다. 그러므로 혈종으로 인한 합병증을 사정해야\n한다. 환자의 의식이 명료하고 의사소통이 가능하므로\n혈전용해제로 인한 뇌출혈은 발생하지 않았다. 후복막\n출혈은 의심될 수는 있지만 수술 직후 나타나지 않는다.\n장음은 수술직후 바로 들리지 않으며 위장출혈의 비특이적\nindicator이며 출혈확인을 위해서는 비위관을 흡인해\n보는 것이 더 낫다. 부정맥을 확인하기 위해 시간마다 12\n유도 심전도를 찍을 필요는 없으며 증상이 있을 때 확인하면\n된다."},{"id":"c05-q184","chapterId":5,"number":184,"page":158,"stem":"ICD (implanted cardioverter defibrillator)가 삽입된 환자에게 심방세동이 발생하였고,\n부적절하게 제세동 충격이 가해졌다. 간호사가 첫 번째로 수행해야 하는 것은?","choices":["경피적 심박조율기를 달아준다.","심박조율기 generator에서 자석을 멀리 둔다.","diltiazem 15mg을 2분에 걸쳐 IV 한다.","amiodarone 150mg을 10분에 걸쳐 IV 한다.","2001로 제세동을 시행한다."],"answer":2,"answerLabel":"②","answerPage":339,"explanation":"ICD generator에 심박조율기 자석이 있으면 ICD\n를 망가뜨리게 되고 부적절한 방출을 예방할 수 없게 한다.\n경피적 심박조율기는 서맥의 적응증이다. 투약으로는\n부적절하게 방출되는 SHOCK 을 예방할 수는 없다.\nDiltiazem은 rate control, amiodarone은 심방세동을\n동성리듬으로 전환시킬 수 있다. 200J의 제세동은\n심실세동의 적응증이다."},{"id":"c05-q185","chapterId":5,"number":185,"page":158,"stem":"경정맥 일시적 심박조율기를 삽입한 환자의 혈압이 130/70 mmHg에서 96/78 mmHg\n로 떨어졌다. 호흡수는 30회/분으로 상승하였고, 호흡음은 양쪽에서 깨끗하게 들렸다.\n경정맥 확장이 보였고, 심장박동수는 심박조율기로 100% 조율되면서 70회/분 이다. 이\n때 의심할 수 있는 원인은?","choices":["혈흉","기흉","심낭 압전","심박조율기 부전","심박조율기 증후군"],"answer":3,"answerLabel":"③","answerPage":339,"explanation":"Lead perforation으로 인한 심낭압전으로 좁은\n맥압을 동반한 저혈압과 경정맥 확장 증상이 나타난다.\n혈흉이나 기흉이 있을 때는 영향을 받은 쪽 호흡음이\n감소된다. 심박조율기 증후군은 pacing 동안 atri기 kick\n때문에 나타나며 의식변화나 저혈압을 일으킬 수는 있지만\n좁은 맥압이나 경정맥 확장을 보이지는 않는다.\n심박조율기가 100% 조율하고 있기 때문에 심박조율기\n부전은 아니다."},{"id":"c05-q186","chapterId":5,"number":186,"page":158,"stem":"심장성 쇼크에서 IABP (intra-aortic balloon pump)는 무엇을 증가시키기 위함인가?","choices":["수축기동안 관상동맥 혈류","심근의 산소공급","좌심실 혈류량","좌심실 수축기압","우심실 이완기압"],"answer":2,"answerLabel":"②","answerPage":339,"explanation":"IABP는 이완기동안 풍선을 팽창시켜 관상동맥 혈류를\n증가시킴으로서 심근에 산소공급을 증가시킨다. 후부하를\n감소시켜 좌심실의 workload# 효과적으로 감소시킨다.\nBalloon augmentation은 죄심실 emptying을 더\n효과적으로 보조해줌으로써 심장수축 력을 향상시켜\n결과적으로 심박출량을 증가시킨다. 심근의 산소공급과\n좌심실 filling v이ume에는 직접적인 영향을 주진 않는다.\nBalloon-augmented systolic pressure가 대동맥\n수축기압보다 높더라도 좌심실 수축기압을 증가되지 않는다.\n우심실압에는 영향을 미치지 않는다."},{"id":"c05-q187","chapterId":5,"number":187,"page":159,"stem":"심부전 환자가 심실보조장치(VAD)에 대해 질문할 때 적절한 간호사의 교육내용은?","choices":["VAD 는 삶의 질을 향상시켜주진 못하지만 증상을 개선해 준다.","VAD 는 심박조율기처럼 흉부 상부에 삽입된다.","대부분의 VAD 는 이식 전까지 일시적으로 사용된다.","VAD 를 삽입하고 나면 입원해서 침상안정을 해야 한다.","VAD 를 삽입한 후에는 약물치료가 필요 없다."],"answer":3,"answerLabel":"③","answerPage":339,"explanation":"VAD 는 치료적 장치이지 질환을 완치해 주진 못한다.\n장치 보조로 인한 사망률은 높으며 대부분 심장이식 전까지\n사용된다. portable VAD 는 삽입 후 집으로 퇴원할 수\n있다. 펌프는 상복부에 삽입되고, 펌프와 연결된 다른\n튜브는 복벽과 연결되어 몸밖으로 나와 펌프의 베터리와\n통제시스템과 연결되어 있다. LVAD 를 가진 환자는 퇴원할\n수 있고 심장DONOR 를 기다리는 동안 삶의 질을 향상시켜\n준다. VAD 는 삽입 후 혈전 방지를 위해 항응고제를\n투약해야 한다."},{"id":"c05-q188","chapterId":5,"number":188,"page":159,"stem":"1 주일 전부터 발생한 심방세동으로 헤파린 정맥주사 중인 환자가 갑작스런 심계항진과\n호흡곤란을 호소하고 있다. 심전도는 아래와 같고 혈압은 70/30mmHg로 감소한 상태이\n다 흉부 방사선검사를 시행한 결과 양쪽 폐음영이 증가했고 폐음 청진 시 양쪽 폐전체\n에서 수포음이 청진된다. 이 환자에게 가장 우선적으로 시행해야 할 치료는?","choices":["동율동전환","경정맥 마사지","아데노신 정맥주사","베타차단제 정맥주사","칼슘통로차단제 정맥주사"],"answer":1,"answerLabel":"①","answerPage":339,"explanation":"Atrial fibrillation with rapid ventricular rhythm\n이며 저혈압과 호흡곤란 등 전신증상이 동반되고 있고\nheparin 정맥주사 중이므로 동율동전환을 적용한다."},{"id":"c05-q189","chapterId":5,"number":189,"page":159,"stem":"12유도 심전도 상 동성 서맥 44회/분, II, III, aVF 에 ST 분절 상승이 보였다. 이 환자의 문\n제를 해결하여 서맥을 치료하기 위한 적절한 중재는?","choices":["일시적 경정맥 심박조율","경피 심박조율","경피 관상동맥 중재술","아트로핀 투약","니트로글리세린 투약"],"answer":3,"answerLabel":"③","answerPage":339,"explanation":"PCI는 증상이나 징후를 치료할 뿐만 아니라 문제의\n원인을 알 수 있으므로 PCI를 해야 한다. 나머지는 증상만을\n일시적으로 해결해 줄 수 있다. 니트로글리세린은 관상동맥\n확장제로 서맥은 치료하지 못한다."},{"id":"c05-q190","chapterId":5,"number":190,"page":159,"stem":"갑작스런 흉통, 전신쇠약, 호흡곤란으로 입원한 환자의 심전도 상 II, III, aVF 에 ST 분절 상\n승이 보였匚卜. 혈압 90/60 mmHg, 므鞘 58회席 호흡 28회/분이고 호흡음은 깨끗하고 심\n잡음은 들리지 않았다. PCI를 준비하는 동안 이 환자에게 추가적으로 필요한 중재는?","choices":["니트로글리세린 투약","푸르세미드(furosemide) 투약","경피적 심박조율","모르핀 투약","수액 대량 주입"],"answer":5,"answerLabel":"⑤","answerPage":340,"explanation":"inferior wall STEMI 로 RCA occlusion이다.\nRCA oc이usion은 RV infarct을 초래할 수 있는데\n환자는 증상저혈압, 깨끗한호흡음)을 가지고 있다. 이 때는\n응급 PCI를 해야 하고 수액치료가 저혈압을 교정하고\n적절한 rv 전부하를 보장하여 관상동맥 혈류를\n증가시켜준다. 니트로글리세린 , 이뇨제 , 모르핀은 전부하를\n감소시켜 저혈압을 더 악화시키므로 사용하지 않는다."},{"id":"c05-q191","chapterId":5,"number":191,"page":160,"stem":"환자에게 적용 중인 IABP 파형이 그림과 같을 때 환자에게 나타날 수 있는 영향은?\nBalloon inflation","choices":["좌심실 부하 증가","이완기 관류 감소","관상동맥관류 증가","일회심박출량 증가","좌심실산소요구량 증가"],"answer":2,"answerLabel":"②","answerPage":340,"explanation":"그림은 IABP balloon의 early inflation 상태이다.\n이때 후부하가 증가하여 좌심실 산소소모량이 증가하고,\n이완기 관류가 감소하여 좌심실 산소공급이 감소하고,\n일회박출량이 감소하여 심박출량이 감소한다."},{"id":"c05-q192","chapterId":5,"number":192,"page":160,"stem":"대동맥내 풍선펌프(IABP)의 두 가지 주요목적은?","choices":["심장박동수 감소, 혈압 상승","심장박동수 상승 혈압 하강","전부하 증가, 혈압 상승","전부하 감소, 관상동맥 혈류 감소","후부하 감소, 관상동맥 혈류 상승"],"answer":5,"answerLabel":"⑤","answerPage":340,"explanation":"대동맥내 풍선펌프(IABP)의 사용목적은 후부하를\n감소시키고 관상동맥 혈류를 개선시키는 것이다."},{"id":"c05-q193","chapterId":5,"number":193,"page":160,"stem":"대동맥내풍선펌프 적용 및 제거에 대한 설명으로 옳은 것은?","choices":["풍선의 끝이 좌측 쇄골하동맥 기시부 보다 높게 위치하도록 한다.","흉부 방사선검사에서 풍선의 끝은 제2 늑간에 위치하도록 한다.","대동맥판막 협착이 있다면 삽입의 금기증이 된다.","카테터를 제거한 즉시 삽입부위를 지혈한다.","대퇴동맥을 통해 카테터를 삽입할 수 없다면 적용할 수 없다."],"answer":2,"answerLabel":"②","answerPage":340,"explanation":"대동맥내풍선펌프 카테터는 좌측 쇄골하동맥 보다\n2 cm 가량 낮은 위치까지 삽입하고 카테터를 제거할 때는\n카테터 주변에 혈전이 형성되었을 가능성 때문에 즉시\n지혈하지 않는다."},{"id":"c05-q194","chapterId":5,"number":194,"page":160,"stem":"대동맥내 풍선펌프(IABP)를 사용하고 있는 환자에게 IABP를 제거할 수 있는 조건을 갖\n춘경우는?","choices":["CVP 18 mmHg","CI 1.7 L/min/m2","IABP 작동비율 1：1","수축기 혈압 108 mmHg","도부타민 10 mcg/Kg/min 사용"],"answer":2,"answerLabel":"②","answerPage":340,"explanation":"대동맥내 풍선펌프(IABP) 제거 시 만족해야 하는\n조건은 다음과 같다.\n• CVP <10~15\n• CI >2.0\n• IABP 1：3or 1：4\n• 수축기혈압〉100\n• 도부타민 등 강심제 사용 최소화 또는 사용하지 않는 경우"},{"id":"c05-q195","chapterId":5,"number":195,"page":161,"stem":"다음 그림에 해당하는 pacemaker 모드는?","choices":["VOO","VVI","AOO","AAI","DDD"],"answer":2,"answerLabel":"②","answerPage":340,"explanation":"⑶을 보면 p파가 없음에도 pacing spike가 나타나지\n않으므로 atrium을 sensing 하는 모드가 아님. 또한\nQRS 군 앞에 spikeフト 있고 ventri이e이 반응하므로\nventricular pacing, QRS 군이 있을 때는 pacing\n되지 않으므로 inhibition 된 모드이다."},{"id":"c05-q196","chapterId":5,"number":196,"page":161,"stem":"다음 타＜g가 관찰되는 환자에 대한 설명으로 옳은 것은?","choices":["AAI mode, pacing failure","VVI mode, pacing failure","AAI mode, capture failure","VVI mdoe, capture failure","DDD mode, capture failure"],"answer":4,"answerLabel":"④","answerPage":340,"explanation":"Pacing spike 직후의 wide QRS 는 ventricular\nsensing과 pacing을 의미한다. 그림에서 pacing spike\n는 일정한 간격으로 전달되었지만 ventric니ar pacing\n이 나타나지 않았으므로 capture failure이다."},{"id":"c05-q197","chapterId":5,"number":197,"page":161,"stem":"VVI pacemaker 삽입 후 병실로 돌아온 환자의 pacemaker 가 제대로 작동되는지를\n평가하는 방법은?","choices":["심방과 심실이 모두 pacing 되고 sensing 되며, sensing에 따라 inhibit 하거나 pace 한다.","심실이 pacing 하고, 심실 활동을 sensing 하며, pacing은 ventricular sensing 에 대한 반응을 억제한다.","심방과 심실이 모두 pacing 하지만 ventricular pacing은 intrinsic ventricular impulse에 의해 억제된다.","심실은 감지된 intrinsic atrial impulse에 반응하여 pacing 하거나 sensed intrin­ sic ventricular impulse에 의해 억제된다.","심방과 심실이 모두 pacing 되고 sensing 되며 sensing에 따라 pacing 한다."],"answer":2,"answerLabel":"②","answerPage":340,"explanation":"VVI 란 심실이 pacing 하고, 심실활동을 sensing\n하며, pacing은 ventric니ar sensing에 대한 반응을\n억제한다."},{"id":"c05-q198","chapterId":5,"number":198,"page":162,"stem":"심실보조장치에 대한 설명으로 옳은 것은?","choices":["심장이식 대상여부를 판단하기 어려운 경우 적용하지 않는다.","감염, 출혈, 뇌졸중 기계장치관련 합병증이 발생할 수 있다.","박동형 심실보조장치가 비박동형 보다 내구성이 우수하다.","심실에 연결된 관으로 혈액이 박출되고 대동맥에 연결된 관으로 혈액이 유입된다.","우심실보조장치는 우심실에서 혈류를 배출시켜 심실보조장치를 지나 폐동맥으로 박출시 킨다."],"answer":2,"answerLabel":"②","answerPage":340,"explanation":"심실보조장치는 첫째 심장이식을 대기하고 있는\n환자의 가교치료로서 둘째 심장이식 적응증이 되지 않는\n환자에서 평생심실보조를 위해, 셋째 현재 심장이식의\n대상여부를 판단하기 어려울 때 상태를 안정시킬 목적으로\n적용한다 혈액박출 시 대동맥에 연결된 유출관에 부착된\n판막이 열려 혈액을 동맥으로 공급하고 혈액 유입 시에는\n심실에 연결된 유출관에 부착되어 있는 판막이 열려 혈액이\n심실보조장치로 유입된다. 비박동식이 박동식 보다 구조가\n간단하고 내구성이 우수하다. 우심 실보조장치는 우심 방에서\n혈류를 배출시켜 심실보조장치를 지나 폐동맥으로\n박출시킨다."},{"id":"c05-q199","chapterId":5,"number":199,"page":162,"stem":"체외막형산화기(ECMO) 모드에 대한 설명으로 옳은 것은?","choices":["VA ECMO 는 단독 호흡부전에서 이산화탄소 제거를 위해 적용한다.","VA ECMO 는 순환보조를 위해 동맥혈을 배액하여 정맥관을 통해 관류시킨다.","VV ECMO 의 경우 정맥도관의 거리를 가까이 하여 재순환을 방지한다.","VV ECMO 는 배액량을 증가시키기 위해 VA ECMO 로 전환시키기도 한다.","AV ECMO 는 펌프없이 이산화탄소제거를 위해 동맥관에서 배액하여 정맥관으로 관류시킨다"],"answer":5,"answerLabel":"⑤","answerPage":340,"explanation":"VA ECMO 는 순환보조를 위해 정맥관을 배액하여\n동맥혈을 통해 관류시킨다."},{"id":"c05-q200","chapterId":5,"number":200,"page":162,"stem":"체외막형산화기(ECMO) 를 적용 중인 환자관리에 대한 설명으로 옳은 것은?","choices":["ECMO weaning 시 flow가 3 L/min 이하의 경우 ACT 를 감소시킨다.","인공호흡기는 최대한으로 해서 폐의 회복을 도모한다.","VA ECMO 는 적용 시 높은 전신혈관저항(SVR) 이는 환자에게 nitroprusside# 투 여하여 조절한다.","VA ECMO 적용 중 사지 pulse는 모두 촉진 가능하다","VA ECMO 의 경우 arterial wave에서 dicrotic notch를 관찰한다."],"answer":3,"answerLabel":"③","answerPage":340,"explanation":"VA ECMO 는 적용 시 높은 전신혈관저항(SVR) 이는\n환자에게 nitroprusside를 투여하여 조절한다."}]},{"id":6,"part":"PART II","partTitle":"전문실무영역","title":"호흡기계","count":200,"startPage":163,"endPage":208,"questions":[{"id":"c06-q001","chapterId":6,"number":1,"page":163,"stem":"엽폐렴(lobar pneumonia)을 진단 받은 환자의 병변이 있는 폐 부위를 청진했을 때 예상\n되는 결과는?","choices":["건성수포음 (rhonchi)","협착음 (stridor)","공명음(resonance)","둔탁음(dullness)","염소울음소리 (egophony)"],"answer":5,"answerLabel":"⑤","answerPage":341,"explanation":"염소울음소리에고포니)는 대상자가 이(ee)라고 말하는\n것이 청진기를 통해 에이(ay)라고 들리는 것으로 엽폐렴이\n있을 때 청진된다."},{"id":"c06-q002","chapterId":6,"number":2,"page":163,"stem":"65세 남자가 호흡곤란으로 응급실에 왔다 50갑/년의 흡연력이 있으며 운동 시 호흡곤란\n이 있고, 발열이나 오한은 없다. 최근 감기 걸린 사람과 접촉한 적은 없다고 한다 이 환자\n의 흉부 검진 시 예상되는 결과는?","choices":["오목가슴","함몰 흉곽","흉곽의 전후직경 증가","흉곽의 좌우직경 증가","흉곽의 전후직경 : 좌우직경 =1 : 2"],"answer":3,"answerLabel":"③","answerPage":341,"explanation":"이 환자는 만성폐쇄폐질환이 의심되며, 이 질환의 경우\n흉곽의 전후직경이 증가되어 술통형 흉곽의 형태로 변화된다."},{"id":"c06-q003","chapterId":6,"number":3,"page":163,"stem":"48세 여자가 운동 시 호흡곤란이 있어 내원하였다. 지난 3일간 38℃ 이상의 발열과 오한\n이 있었고 녹색 가래가 동반된 기침을 하였다고 한다. 왼쪽 폐하엽에서 수포음이 들리고,\n단순흉부촬영상에서 왼쪽 하엽에 경화가 있다. 왼쪽 흉부 촉진 시 예상되는 촉각진동감\n(tactile fremitus)에 대한 검진 결과는?","choices":["감소","증가","변화 없음","흡기 시 소실","호기 시 증가"],"answer":2,"answerLabel":"②","answerPage":341,"explanation":"폐엽의 경화(consolidation)가 있으면 촉각진동감은\n증가된다."},{"id":"c06-q004","chapterId":6,"number":4,"page":164,"stem":"흉부 검진 시 건강한 성인의 횡격막 운동(diaphragmatic excursion) 범위는?","choices":["1~2 cm","2~3 cm","5〜6 cm","9〜10 cm","10~11 cm"],"answer":3,"answerLabel":"③","answerPage":341,"explanation":"건강한 성인의 횡격막 운동 범위는 5~6 cm이다."},{"id":"c06-q005","chapterId":6,"number":5,"page":164,"stem":"기흉이 의심되는 환자의 호흡음 청진 시 예상되는 검진 결과는?","choices":["공명음","수포음","쌕쌕거림","건성수포음","호흡음 감소"],"answer":5,"answerLabel":"⑤","answerPage":341,"explanation":"기흉인 경우 청진 시 호흡음이 감소되거나 소실된다."},{"id":"c06-q006","chapterId":6,"number":6,"page":164,"stem":"21세 남자가 갑작스러운 호흡곤란으로 내원하였다. 키 175 cm, 체중 54 Kg이었고, 발열,\n기침, 오한, 인후통은 없으며, 담배는 피우지 않는다고 한다. 이 환자의 흉부 타진 시 예\n상되는 검진 결과는?","choices":["침범된 부위의 둔탁음","침범된 부위의 공명음 감소","침범된 부위의 공명음 증가","침범된 부위의 촉각진동감 증가","침범되지 않은 부위의 공명음 증가"],"answer":3,"answerLabel":"③","answerPage":341,"explanation":"이 환자는 자발 기흉이 의심되며, 이 경우 공기가흉막강으로\n유출되어 타진 시 증가된 공명음이 들린다."},{"id":"c06-q007","chapterId":6,"number":7,"page":164,"stem":"75세 남자가 왼쪽 폐하엽절제술 후 기관내관을 발관하고 호흡곤란과 흉통을 호소한다.\n이 환자의 흉부 검진 시 나타날 수 있는 결과는?","choices":["왼쪽 폐 타진 시 둔탁음","왼쪽 폐의 쌕쌕거림","왼쪽 폐의 호흡음 증가","오른쪽으로의 기관 편위","왼쪽 폐의 촉각진동감 증가"],"answer":1,"answerLabel":"①","answerPage":341,"explanation":"이 환자는 무기폐가 의심되며 , 이 경우 타진 시 둔탁음이\n들리고, 침범된 쪽으로의 기관 편위 , 호흡음 소실, 촉각진동감\n소실이 있다."},{"id":"c06-q008","chapterId":6,"number":8,"page":164,"stem":"만성폐쇄폐질환이 있는 환자에게서 술통형 가슴이 나타나는 원인은?","choices":["척추의 뒤틀림","폐의 탄력성 상실","하부 흉골의 함몰","흉곽의 전방 돌출","늑간근의 신축성 증가"],"answer":2,"answerLabel":"②","answerPage":341,"explanation":"만성폐쇄폐질환 환자는 폐의 탄력성 감소와 횡격막의\n편평화가 유발되어 술통형 가슴으로 흉곽이 변형된다."},{"id":"c06-q009","chapterId":6,"number":9,"page":165,"stem":"저산소증이 의심되는 환자에게 청색증 여부를 확인하려고 할 때 적절한 검진 부위는?","choices":["코","귀","손톱","얼굴 피부","구강 점막과 혀"],"answer":5,"answerLabel":"⑤","answerPage":341,"explanation":"저산소증으로 인한 청색증은 혀와 구강 같은 중심부의\n점막에서 가장 잘 관찰될 수 있다."},{"id":"c06-q010","chapterId":6,"number":10,"page":165,"stem":"흉부 뒷면을 검진했을 때 오른쪽 상엽 부위의 촉각진동감이 감소되었다. 이 환자에게 의\n심되는 상태는?","choices":["폐렴","폐종양","폐기종","기관지확장증","만성 기관지염"],"answer":3,"answerLabel":"③","answerPage":341,"explanation":"촉각진동감은 폐조직의 경화가 나타난 경우 증가되므로\n폐렴, 폐종양, 만성 기관지염, 기관지확장증에서 증가되며,\n폐기종에서는 감소된다."},{"id":"c06-q011","chapterId":6,"number":11,"page":165,"stem":"흉부 검진 시 촉각진동감을 확인하기 위한 적절한 방법은?","choices":["조용히 속삭이게 한다.","호흡을 빠르게 하게 한다.","청진기의 종형을 사용한다.","심호흡을 하고 멈추게 한다.","대칭적으로 흉부를 촉진한다."],"answer":5,"answerLabel":"⑤","answerPage":341,"explanation":"촉각진동감을 확인하기 위해서는 진동을 촉진할 수\n있도록 대상자에게 큰소리로 “ninety-nine” 또는 “하나-\n하나-하나”를 반복하여 말하게 하면서 폐의 대칭 부위를\n촉진하고 비교한다."},{"id":"c06-q012","chapterId":6,"number":12,"page":165,"stem":"50세 남자가 호흡곤란으로 내원하였다. 숨 쉴 때마다 가슴 통증이 있고, 흡기와 호기 시\n거칠고 낮은 음이 들릴 때 이 호흡음은 무엇인가?","choices":["협착음","수포음","쌕쌕거림","흉막마찰음","건성수포음"],"answer":4,"answerLabel":"④","answerPage":341,"explanation":"흉막마찰음(pleural friction rub)은 염증으로 거칠어진\n두 흉막이 마찰할 때 발생하는 낮은 음조의 삐걱거리거나\n가죽이 서로 비비는 것 같은 소리로서 흡기와 호기 모두에서\n들릴 수 있다."},{"id":"c06-q013","chapterId":6,"number":13,"page":165,"stem":"왼쪽 폐 하부에서 둔탁음이 타진되고, 청진 시 흡기 말에 수포음이 들리며, 기관은 편위\n되지 않았으나 촉각진동감과 전도되는 목소리가 모두 증가되었다면 이 환자에게 의심되\n는 상태는?","choices":["기흉","무기폐","폐경화","흉막삼출","이물질 흡인"],"answer":3,"answerLabel":"③","answerPage":341,"explanation":"폐경화가 있으면 폐에 타진음이 감소되고 촉각진동감과\n전도되는 목소리가 모두 증가된다."},{"id":"c06-q014","chapterId":6,"number":14,"page":166,"stem":"다음 중 호흡음에 대한 설명으로 옳은 것은?","choices":["폐포음(vesicular sound)은 대부분 폐 전체에서 들린다.","폐포음(vesicular sound)은 호기음이 흡기음보다 길게 들린다.","쌕쌕거림(wheeze)은 큰 기도에 분비물이 있음을 의미한다","기관지폐포음(bronchovesicular sound)은 폐의 말단에서 주로 들린다.","수포음(crackle)은 폐쇄되어 좁아진 기관지로 공기가 빠르게 지나갈 때 나는 소리이다."],"answer":1,"answerLabel":"①","answerPage":341,"explanation":"폐포음은 흡기음이 호기음보다 길게 들리며, 대부분의\n폐의 전역에서 들리는 정상 호흡음이다. 수포음은 폐포에\n분비물이 있음을 의미하며 , 기관지폐포음은 정상적으로 흉부\n앞면에서는 첫 번째와 두 번째 늑간에서, 흉부 뒷면에서는\n견갑골 사이에서 들린다."},{"id":"c06-q015","chapterId":6,"number":15,"page":166,"stem":"40세 남자가 호흡곤란으로 방문하였다. 흉부 타진 시 오른쪽 폐 상부에서 과다공명음이\n들리고, 촉각진동감과 호흡음이 왼쪽에 비해 현저히 감소되었으며, 기관이 왼쪽으로 편위\n되어 있을 때, 이 환자에게 의심되는 상태는?","choices":["천식","기흉","폐경화","기관지염","만성폐쇄폐질환"],"answer":2,"answerLabel":"②","answerPage":341,"explanation":"기흉의 경우 과다공명음이 타진되고, 촉각진동감과\n호흡음은 침범된 부위에서 건강한 부위에 비해 감소되며,\n기관은 침범된 반대쪽으로 편위된다."},{"id":"c06-q016","chapterId":6,"number":16,"page":166,"stem":"흉부 타진에 대한 설명으로 옳은 것은?","choices":["손가락 패드를 이용하여 두드린다.","흉벽 표면에 타진판 손가락 전체를 완전히 닿도록 댄다.","타진추 손가락과 타진판 손가락의 각도는 45°가 되게 한다.","손목을 이완시킨 상태에서 민첩하고 탄력 있게 움직인다","한쪽 폐 전체를 타진한 다음 다른 쪽 폐를 타진한다."],"answer":4,"answerLabel":"④","answerPage":341,"explanation":"타진 시 타진지와 타진판의 각도는 수직이 되어야 하고,\n세 번째 손가락 이외에 다른 손가락이 대상자의 피부에 닿지\n않도록 한다. 타진 시 손가락 패드(pad)가 아닌 끝(tip)을\n이용하여 두드리도록 하고, 사다리 패턴으로 한쪽 흉부를\n타진한 다음 같은 높이의 다른 쪽 흉부를 타진하여 소리를\n비교한다."},{"id":"c06-q017","chapterId":6,"number":17,"page":166,"stem":"35세 폐렴을 앓고 있는 환자에게 ‘하나-둘-셋‘을 속삭이듯이 말하게 하면서 청진했을 때\n소리가 크고 분명하게 들렸다. 이것을 무엇이라고 하는가?","choices":["쌕쌕거림","정상 호흡음","염소울음소리 (egophony)","기관지소리 (bronchophony)","속삭임 가슴소리 (whispered pectoriloquy)"],"answer":5,"answerLabel":"⑤","answerPage":341,"explanation":"속삭임 가슴소리는 환자가 속삭이듯 말하는 소리가\n청진 시 크고 분명하게 들리는 것으로 폐나 흉막강에 변화가\n있음을 의미한다."},{"id":"c06-q018","chapterId":6,"number":18,"page":166,"stem":"다음 중 호흡의 깊이와 횟수가 일정하게 증가하고 간헐적으로 무호흡이 있는 형태의 호흡\n은?","choices":["무호흡 (apnea)","과다호흡 (hyperpnea)","비오 호흡(Biofs respiration)","구스마울 호읍(Kussmaul's respiration)","체인—스톡 호흡(Cheyne—Stokes respiration)"],"answer":5,"answerLabel":"⑤","answerPage":341,"explanation":"쿠스마울 호흡은 대사성 산증이 나타날 때 발생하는\n호흡으로 깊고 빠르고, 호흡 시 과일 냄새가 나는 특징이\n있다. 비오 호흡은 연수 병변 시 나타는 호흡으로\n조화운동불능호흡이라고도 하며 , 예측이 불가한 불규칙한\n호흡음이고, 얕고, 깊고 무호흡이 짧은 기간에 나타난다."},{"id":"c06-q019","chapterId":6,"number":19,"page":167,"stem":"다음 흉부 시진 결과 중 정상인 것은?","choices":["40세 남자의 늑골각이 110°이다.","24세 여자의 흉추에 척주측만증(scoliosis)이 있다.","80세 남자의 흉곽이 전후직경:좌우직경=1：1이다.","35세 남자가 호흡 시 늑간 수축 (intercostal retraction) 이 있다.","34세 여자가 호흡 시 흉부의 모순 움직임 (paradoxical motion)이 있다."],"answer":3,"answerLabel":"③","answerPage":341,"explanation":"노인의 경우 흉곽의 전후직경:좌우직경이 1：1인 술통형\n가슴이 흔히 나타날 수 있다."},{"id":"c06-q020","chapterId":6,"number":20,"page":167,"stem":"중환자실에 입원 중인 53세 환자가 오른쪽 쇄골하정맥에 중심정맥관을 삽입한 후 호흡\n곤란을 호소하며 오른쪽 폐상엽의 호흡음이 감소되었다. 이 환자에게 의심되는 상태는?","choices":["폐렴","기흉","무기폐","흉막염","기관지확장증"],"answer":2,"answerLabel":"②","answerPage":341,"explanation":"중심정맥관 삽입 시 흔히 발생할 수 있는 합병증은\n기흉이며, 기흉 발생시 침범된 부위의 호흡음이 감소된다."},{"id":"c06-q021","chapterId":6,"number":21,"page":167,"stem":"다음 중 즉시 응급조치가 필요한 비정상적인 호흡음은?","choices":["수포음(crackles)","협착음(stridor)","쌕쌕거림(wheezes)","건성수포음(rhonchi)","속삭임 가슴소리(whispered pectoriloquy)"],"answer":2,"answerLabel":"②","answerPage":341,"explanation":"협착음은 기도 혹은 후두의 협착으로 나타나는 비정상\n호흡음으로 기도폐쇄를 방지하기 위해 즉시 응급조치를\n취해야 한다."},{"id":"c06-q022","chapterId":6,"number":22,"page":167,"stem":"흉부를 청진하는 방법으로 옳은 것은?","choices":["전반적으로 청진기의 종형을 이용한다.","각 청진 부위마다 흡기 시 호흡음만 청진한다.","조용히 청진할 수 있도록 환자에게 숨을 얕게 쉬게 한다.","한쪽 폐 전체를 먼저 청진한 다음 다른 쪽 폐를 청진한다.","폐 첨부에서 기저부 방향으로 좌우를 비교하며 사다리 형태로 청진한다."],"answer":5,"answerLabel":"⑤","answerPage":341,"explanation":"청진기의 판형을 이용하여 환자에게 심호흡을 하도록\n하여 각 부위의 흡기와 호기를 청진하고, 폐 첨부에서 기저부\n방향으로 사다리 형태로 좌우를 비교하며 청진한다."},{"id":"c06-q023","chapterId":6,"number":23,"page":167,"stem":"흉곽과 폐 검진에 대한 내용으로 옳지 않은 것은?","choices":["기침이 있는 환자에게 증상 기간, 유발요인, 속쓰림이 있는지 문진한다.","흉곽의 모양과 호흡양상을 시진한다.","io번째 늑골 높이에 양손가락을 놓고 환자에게 숨을 깊게 쉬게 하여 흉곽 확장의 대칭성을 확인한다.","한쪽 흉곽에서 위에서 아래로 타진한 후 반대쪽 흉곽에서 동일하게 시행한다","흉곽의 위에서 아래 방향으로 좌우를 비교하며 청진한다."],"answer":4,"answerLabel":"④","answerPage":341,"explanation":"흉부 검진 시 타진과 청진은 사다리 형태로 좌우를\n비교하면서 위에서 아래로 시행한다."},{"id":"c06-q024","chapterId":6,"number":24,"page":168,"stem":"55세 남자가 며칠째 계속되는 기침과 객담이 있어 내원하였다. 다음 흉부 검진 결과 중\n정상으로 볼 수 없는 것은?","choices":["호흡수는 14〜 16회/분이고, 가끔 한숨을 쉰다.","안정된 호흡 시 흉골유돌근과 사각근의 수축이 있다.","양쪽 견갑골 사이에서 촉각진동감이 가장 잘 느껴진다.","횡격막 운동범위가 5 cm이다.","양쪽 폐 타진 시 공명음이 들린다."],"answer":2,"answerLabel":"②","answerPage":341,"explanation":"안정된 호흡 시 흉골유돌근과 사각근(목갈비근의 수축을\n보이는 것은 노력호흡(labored breathing)이며 비정상적인\n호흡양상이고, 성인의 정상 횡격막 운동범위는 5〜6 cm\n이다."},{"id":"c06-q025","chapterId":6,"number":25,"page":168,"stem":"60세 남자의 흉부 검진 시 호흡수가 증가되었고 오른쪽 흉곽이 잘 확장되지 않으며 오른\n쪽 하엽에서 둔탁음과 수포음이 들린다. 이 환자에게 의심되는 상태는?","choices":["천식","폐기종","엽폐렴","흉막삼출","기관지염"],"answer":3,"answerLabel":"③","answerPage":341,"explanation":"폐렴이 있으면 폐포에 삼출물이 축적되기 때문에\n가스교환이 방해되어 빠른 호흡을 하고, 폐렴이 있는 부위는\n둔탁음, 촉각진동감이 증가되고 수포음이 청진된다."},{"id":"c06-q026","chapterId":6,"number":26,"page":168,"stem":"60세 환자의 흉부 타진 시 공명음(resonance) 들린다. 이 타진음의 특징으로 옳은 것은?","choices":["약한 강도, 높은 음조, 긴 지속시간","약한 강도, 높은 음조, 짧은 지속시간","중간 강도, 중간 음조, 중간 지속시간","큰 강도, 낮은 음조, 긴 지속시간","매우 큰 강도, 낮은 음조, 더 긴 지속시간"],"answer":4,"answerLabel":"④","answerPage":342,"explanation":"공명음은 큰 강도, 낮은 음조, 긴 지속시간이 특징이다."},{"id":"c06-q027","chapterId":6,"number":27,"page":168,"stem":"왼쪽 하엽의 폐렴이 의심되는 환자에게 기관지소리(bronchophorM를 청진하고자 한다.\n이에 대한 설명으로 옳은 것은?","choices":["환자에게 “이-이”를 말하게 하였을 때 소리가 “에이로 들린다.","환자에게 “하나-둘-셋”을 말하게 하였을 때 정상인 부위에서 소리가 크고 깨끗하 게 들린다.","환자에게 “하나-둘-셋”을 말하게 하였을 때 병변이 있는 부위에서 소리가 크고 깨끗하게 들린다.","환자에게 “하나-둘-셋”을 말하게 하였을 때 병변이 있는 부위에서 소리가 작고 약 하게 들린다.","환자에게 “하나-둘-셋”을 속삭이는 목소리로 말하게 하였을 때 병변이 있는 부위 에서 소리가 작고 불분명하게 들린다."],"answer":3,"answerLabel":"③","answerPage":342,"explanation":"기관지소리는 “하나-둘-셋”를 말하게 하였을 때 병변이\n있는 부위에서 소리가 크고 분명하게 들린다. 염소울음소리는\n“이-이”를 말하게 하였을 때 소리가 에이”로 들린다. 속삭임\n가슴소리는 “하나-둘-셋”을 속삭이듯이 말하게 하였을 때,\n병변이 있는 부위에서 소리가 크고 분명하게 들린다."},{"id":"c06-q028","chapterId":6,"number":28,"page":169,"stem":"다음 호흡생리에 대한 설명으로 옳은 것은?","choices":["해부학적 사강은 공기의 이동만 있고 실제 가스교환이 이루어지지 않는 영역으로 약 150 mL 정도이다.","산증 고체오 PaCO2 상승 시 혈액은 폐에서 쉽게 산소를 얻으나 조직으로의 산소 운반은 감소된다.","흡기와 호기는 능동적으로 호흡조절중추에 의해 유발된다.","대동맥궁과 경동맥동은 호흡을 조절하는 신경중추이다.","환기/관류비가 4/2라면 저환기상태이다."],"answer":1,"answerLabel":"①","answerPage":342,"explanation":"산증, 고체온, PaCO2 상승 시 혈액은 폐에서 산소를\n늦게 얻지만 조직으로의 산소운반은 쉽게 이루어진다(산소-\n혈색소 해리곡선). 대동맥궁과 경동맥동은 호흡을 조절하는\n화학중추이고, 호흡의 호기는 수동적인 작용으로 폐가\n확장된 후 반동작용으로 용적이 줄어든다. 환기/관류비가\n환기〉관류이면 과환기, 환기〈관류이면 환기저하를 의미하고,\n환기/관류비의 정상 범위는 0.8~0.9이다."},{"id":"c06-q029","chapterId":6,"number":29,"page":169,"stem":"저산소증의 폐내 원인과 폐 이외의 원인을 감별하는 데 중요한 검사는?","choices":["동맥혈 산소분압(PaO)","동맥혈 이산화탄소분압(PaCO)","염기과잉 (BE)","동맥혈 산소포화도(SaO)","폐포동맥간 산소분압차(AaDO)"],"answer":4,"answerLabel":"④","answerPage":342,"explanation":"폐포동맥간 산소분압차는 저산소증의 원인을 감별하는\n데 중요하다. 이상적으로는 PA5와 PaC>2는 같아야 하나\n폐포-모세혈관의 확산장애, 환기/관류 불균등, 정맥혈의\n션트(shunt) 등에 의해서 차이가 발생한다."},{"id":"c06-q030","chapterId":6,"number":30,"page":169,"stem":"다음 중 저환기를 명확히 보여주는 지표는?","choices":["pO, 59 mmHg","pCO, 55 mmHg","pH 7.50","HCOJ 48 mEq/L","호흡수 10회/분"],"answer":2,"answerLabel":"②","answerPage":342,"explanation":"pc。?는 환기가 잘 되고 있는지를 보여주는 가장 좋은\n지표이며, 45 mmHg를 초과하면 정상 범위를 벗어난\n것으로 간주된다. 저산소혈증은 과소환기의 늦게 나타나는\n지표이고, pH 7.50는 과호흡의 지표이다. 호흡 깊이와\n폐포모세혈관막로의 확산에 영향을 미치는 인자가 환기에\n영향을 미치기 때문에 호흡수는 pc。］또는 호기말\n이산화탄소분압 파형)만큼 신뢰할 만한 지표가 아니다."},{"id":"c06-q031","chapterId":6,"number":31,"page":169,"stem":"폐의 환기/관류에 대한 설명으로 옳은 것은?","choices":["호흡사강은 저산소증에 의해 발생한다.","폐 각 부위의 환기/관류비는 균등하다.","폐 첨부는 폐 기저부보다 환기량이 적다.","누운 자세는 폐 첨부의 환기 영역을 확장시킨다,","환기에 비해 관류가 감소되면 저산소혈증이 유발된다."],"answer":3,"answerLabel":"③","answerPage":342,"explanation":"호흡사강은 해부학적 원인으로 정상적으로 발생하는\n것으로 흡기된 공기가 폐포까지 도달하지 않고 배출되는\n공기량을 의미한다."},{"id":"c06-q032","chapterId":6,"number":32,"page":169,"stem":"다음 중 환フ I/관류비(V/Q rati。)가 0.8 이상인 질환은?","choices":["폐기종","폐색전증","기관지확장증","만성 기관지염","만성폐쇄폐질환"],"answer":2,"answerLabel":"②","answerPage":342,"explanation":"폐색전증이나 폐고혈압인 경우는 환기는 충분하나 관류가\n감소하므로 V/Q 비율이 증가하나 폐기종이나 만성 기관지염,\n폐기종 같은 폐쇄성 폐질환의 경우는 환기가 감소되어 V/Q\n비율이 감소한다."},{"id":"c06-q033","chapterId":6,"number":33,"page":170,"stem":"다음 중 적절한 환기가 가능한 경우는?","choices":["빈혈","동요가슴","중등도 비만","척주측후만증","횡격막 운동범위 6 cm"],"answer":5,"answerLabel":"⑤","answerPage":342,"explanation":"흉곽 손상 없이 횡격막 운동으로 폐가 충분히 확장되고,\n폐조직의 손상이 없을 때 정상적인 환기가 이루어질 수\n있으며, 중등도 비만에서는 바깥쪽으로 향하는 흉벽의\n반동이 흉벽 지방의 무게와 복부 지방이 차지하고 있는 공간\n때문에 줄어들게 되고, 보존된 폐의 안쪽 반동은 흉벽의\n바깥쪽 반동을 이기게 되어 기능잔기용량이 감소된다."},{"id":"c06-q034","chapterId":6,"number":34,"page":170,"stem":"폐렴에 대한 설명으로 옳은 것은?","choices":["입원 12시간 후에 발생한 폐렴은 병원획득 폐렴으로 간주해야 한다.","폐렴 환자에서 균주 감별을 위해 시행하는 객담배양검사는 항생제 사용 후에 시행 한다.","전형적(typical) 폐렴의 가장 흔한 원인균은 폐렴연쇄구균(Streptococcus pneumo- niae) 이다.","전형적(typical) 폐렴은 비정형(atypical) 폐렴에 비해 열이 덜 나고, 아급성으로 발생 하는 경우가 많다.","기관내삽관하고 인공호흡기 적용 후 24시간째에 발생한 폐렴은 기계환기 폐렴으로 판단하고 치료해야 한다."],"answer":3,"answerLabel":"③","answerPage":342,"explanation":"병원 획득 폐렴은 입원 후 48~72시간 이후 발생한\n폐렴이고, 기계환기 48~72시간 이후 기관내삽관 환자에게\n발생하는 폐렴을 기계환기 폐렴으로 정의한다. 폐렴 환자에게\n균주 감별을 위해 시행하는 객담배양검사는 항생제 사용\n이전에 시행해야 한다."},{"id":"c06-q035","chapterId":6,"number":35,"page":170,"stem":"국내 지역사회 획득 폐렴의 가장 흔한 원인균은?","choices":["Hemophilus influenzae","Staphylococcus aureus","Streptococcus pneumoniae","Mycoplasma pneumoniae","Chlamydia pneumoniae"],"answer":3,"answerLabel":"③","answerPage":342,"explanation":"지역사회 획득 폐렴으로 입원한 경우 가장 자주 검출되는\n균은 Streptococcus pneumoniae이다. 주전되는 모든\n경험적 항생제 처방은 이 균을 목표로 한다."},{"id":"c06-q036","chapterId":6,"number":36,"page":170,"stem":"평소 건강했던 76세 남자가 1 주 전부터 열, 기침과 화농성 객담이 지속된다고 한다. 의식\n은 명료하고 혈압 110/70 mmHg, 므내브｝ 95회/분, 호흡수 32회/분이며, 단순흉부촬영상에\n서 왼쪽 폐하엽에 침윤이 있다. 이 환자에게 적절한 경험적 항생제는?","choices":["0-lactam","macrolide","，一lactam+macrolide","macrolide+fluoroquinolone","^-lactam+macrolide+fluoroquinolone"],"answer":3,"answerLabel":"③","answerPage":342,"explanation":"이 환자는 지역사회 획득 폐렴이 의심되며, 중증도 평가\n기준CRB-65 ： confusion 유무, RRN30 회/분, BP ： 수축기압490\nmmHg 또는 확장기압«60 mmHg, 연령N65)에 의해 2점이므로\n입원(non-ICU)해서 약물치료를 해야 한다. 치료 시작 단계에서\n원외획득 입원약물치료는 |3니actam+macr이ide 또는\nfluoroquin 이one 을 단독으로(결핵을 배제할수 있는 경우) 할수\n있다."},{"id":"c06-q037","chapterId":6,"number":37,"page":171,"stem":"미국 흉부학회/감염학회(ATS/IDSA) 의 성인 지역사회 획득 폐렴(community acquired\npneumonia) 관리지침에 근거하여 양쪽 자궁관결찰술을 받았고 macr이ide계 항생제에\n내성이 있는 46세 여자의 지역사회 획득 폐렴 치료를 위한 가장 적절한 항균제는?","choices":["clarithromycin","amoxicillin","doxycycline","fosfomycin","f-lactam"],"answer":3,"answerLabel":"③","answerPage":342,"explanation":"macrolide계 항생제에 내성이 있는 경우 doxycycline\n을 투여한다."},{"id":"c06-q038","chapterId":6,"number":38,"page":171,"stem":"미국 흉부학회/감염학회(ATS/DSA) 의 성인 지역사회 획득 폐렴 관리지침에 근거하여 심\n근경색 전단계이며 심부전과 2형 당뇨병이 있는 39세 남자의 지역사회 획득 폐렴 치료를\n위한 가장 적절한 항균제는?","choices":["amoxicillin","cephalosporin","clarithromycin","f-lactam고卜 macrolide","respiratory fluoroquinolone"],"answer":4,"answerLabel":"④","answerPage":342,"explanation":"심부전 같은 심장질환과 2형 당뇨병이 있는 환자의\n경우 respiratory fluoroquinolone의 사용이 권장된다."},{"id":"c06-q039","chapterId":6,"number":39,"page":171,"stem":"지역사회 획득 폐렴으로 오늘 입원한 62세의 환자를 위한 예방접종 계획으로 적절한 것\n은?","choices":["금일 인플루엔자와 페렴 백신 투여","항균치료가 끝나면 폐렴 백신 투여","2주후에 인플루엔자와 페렴 백신 투여","금일 폐렴 백신을 투여하고 2주 후에 인플루엔자 백신 투여","금일 인플루엔자 백신을 투여하고 2주 후에 폐렴 백신 투여"],"answer":1,"answerLabel":"①","answerPage":342,"explanation":"지역사회 획득 폐렴으로 입원한 환자라도 바로\n인플루엔자와 폐렴 백신을 투여할 수 있다."},{"id":"c06-q040","chapterId":6,"number":40,"page":171,"stem":"흡인 폐렴이 발생할 수 있는 위험성이 높은 경우는?","choices":["연하곤란","척추마취","하지마비","위장관 영양","면역억제제 복용"],"answer":1,"answerLabel":"①","answerPage":342,"explanation":"흡인 폐렴은 구개반사가 저하된 환자에게 발생 위험이\n높다."},{"id":"c06-q041","chapterId":6,"number":41,"page":171,"stem":"다음 중 면역이 억제된 환자에게 발생하며 환자와 환자 간에 감염이 되지 않는 폐렴은?","choices":["바이러스 폐렴","세균 폐렴","기관지 폐렴","진균 폐렴","흡인 폐렴"],"answer":4,"answerLabel":"④","answerPage":342,"explanation":"진균 폐렴은 주로 자가 면역질환이 있는 환자에게서\n유발하며 , 이는 환자 간에 감염되지 않는다."},{"id":"c06-q042","chapterId":6,"number":42,"page":172,"stem":"고관절 치환술(total hip replacement)을 받고 일주일 이상 입원 중인 환자가 산소요구량\n이 점점 많아지고 진한 녹색의 객담을 동반한 기침을 하며 발열과 호흡곤란을 호소한다.\n이 환자에게 의심되는 상태는?","choices":["진균 폐렴","흡인 폐렴","병원 획득 폐렴","인공호흡기 관련 폐렴","의료기관 관련 폐렴(healthcare-associated pneumonia)"],"answer":3,"answerLabel":"③","answerPage":342,"explanation":"이 환자는 24시간 이상 입원했으며 폐렴과 일치하는\n증상을 보이고 있다. 진균 폐렴은 환자가 심각한 면역 손상과\n같은 중요한 위험 요소를 가지지 않는 한 비전형적이고 보통\n감염되지 않기 때문에 정확하지 않다. 또한 실제 또는 잠재적\n흡인 위험에 대한 언급이 없기 때문에 흡인 폐렴은 부정확하다.\n인공호흡기 관련 폐렴은 인공호흡기 적용 후 48~72시간\n안에 발생하는 폐렴을 말한다. 의료기관 관련 폐렴은\n지역사회에서 획득한 폐렴이 병원 외부에서 감염되고 입원\n후 72시간 안에 발병하는 폐렴으로 정의되기 때문에\n부정확하다."},{"id":"c06-q043","chapterId":6,"number":43,"page":172,"stem":"다음 중 만성폐쇄폐질환에서 볼 수 있는 소견은?","choices":["폐활량 증가","기도저항 증가","FEV/FVC < 0.7","환기/관류비 균등","강제호기유속(forced expiratory flow rates) 감소"],"answer":5,"answerLabel":"⑤","answerPage":342,"explanation":"만성폐쇄폐질환은 흡연력이 있는 환자들에게 발생하고,\n폐와 흉곽이 경직되고, 호흡근이 약화되어 팽창이 제한됨으로\n인해 전체 폐활량이 감소하는 특징을 가진다. 만성폐쇄폐질환의\n가장 전형적인 소견은 강제호기유속의 지속적인 감소이며,\n환기/관류비 불균형이다. 평상 호흡동안에는 흉곽 과팽창으로\n인해 폐용적이 증가하고 폐탄성 압력 증가 및 기도 확장을\n통한 기도저항 감소로 인해 최대 호기류가 보존된다."},{"id":"c06-q044","chapterId":6,"number":44,"page":172,"stem":"만성폐쇄폐질환을 유발하는 가장 큰 원인은?","choices":["흡연","약물 중독","계절성 알레르기","과다한 알코올 섭취","오염된 환경에의 노출"],"answer":1,"answerLabel":"①","answerPage":342,"explanation":"만성폐쇄폐질환 환자의 약 80~90%는 흡연에 의해\n발생한다고 알려져 있다."},{"id":"c06-q045","chapterId":6,"number":45,"page":172,"stem":"만성폐쇄폐질환을 진단 받은 대부분의 환자에서 일치되는 소견은?","choices":["흉막염 통증","적혈구 증가증","흡기 시 호흡곤란","단순흉부촬영상 상 횡격막 상승","속효성 베타-2 작용제 투여 후에도 FEV/FVC <0.7"],"answer":5,"answerLabel":"⑤","answerPage":343,"explanation":"속효성 베타-2 작용제 투여 후에도 FEV/FVC 〈0.7인\n경우가 공기흐름 제한의 첫 징후로 만성폐쇄폐질환을 의심할\n수 있다."},{"id":"c06-q046","chapterId":6,"number":46,"page":172,"stem":"만성폐쇄폐질환이 악화된 환자에서 단순흉부촬영이 필요한 경우는?","choices":["호흡수가 증가할 때","객담의 양이 증가할 때","호흡보조근을 사용할 때","동반되는 폐렴을 배제해야 할 때","일상적으로 모든 환자에게 필요"],"answer":4,"answerLabel":"④","answerPage":343,"explanation":"폐렴 여부를확인하고자할때 단순흉부촬영이 필요하다."},{"id":"c06-q047","chapterId":6,"number":47,"page":173,"stem":"만성폐쇄폐질환이 급성으로 악화된 환자가 최소한으로 반응하며, 빈호흡과 빈맥이 있다. 동\n맥혈가스분석 결과가 pH 7.20, PaCO2 68 mmHg, PaO 2 65 mmHg일 때 우선적인 중재\n는?","choices":["기관내삽관","흉관 삽입","비침습적 인공호흡","중탄산나트륨 투여","비강캐뉼라를 통한 저농도 산소공급"],"answer":1,"answerLabel":"①","answerPage":343,"explanation":"환자의 의식수준이 저하되고 있기 때문에 환기 개선이\n우선적으로 시행 되어야 한다. 비침습적 인공호흡(NIV) 은\n호흡 환기를 다루기는 하지만 최소한의 반응을 보이는\n환자에게는 안전하지 않다. 산소 공급만으로는 주요 문제(\n호흡 환기를 해결할 수 없으며, 호흡성 산증이 있으므로\n중탄산나트륨으로 치료하면 안 된다."},{"id":"c06-q048","chapterId":6,"number":48,"page":173,"stem":"30년 동안 하루 1 갑의 담배를 피워 온 70세 남자가 만성폐쇄폐질환으로 진단 받았다. 운\n동 시 호흡곤란이 조금 있으나 일상생활을 하는 데는 별 불편함이 없을 정도일 때 적절\n한 초기 치료제는?","choices":["흡입 fluticasone","흡입 albuterol","흡입 tiotropium","경구 corticosteroid","경구 theophylline"],"answer":2,"answerLabel":"②","answerPage":343,"explanation":"경증 만성폐쇄폐질환의 초기 치료제는 흡입 베타-2\n작용제이다."},{"id":"c06-q049","chapterId":6,"number":49,"page":173,"stem":"만성폐쇄폐질환의 말기 단계에 나타나는 폐혈관의 압력 증가로 인한 우심실 기능 저하를\n무엇이라고 하는가?","choices":["폐심장증(cor pulmonale)","폐동맥 고혈압","울혈 심부전","경정맥 팽창","두방 심장(cor biloculare)"],"answer":1,"answerLabel":"①","answerPage":343,"explanation":"폐심장증은 기저 호흡기질환으로 인한 폐동맥 고혈압에\n따른 이차적인 우심실 비대나 확장으로 정의된다. 폐동맥\n고혈압은 우심실부전을 유발하지만 이를 가리키는 용어는\n아니며 울혈 심부전은 좌심실부전의 결과로 생긴다."},{"id":"c06-q050","chapterId":6,"number":50,"page":173,"stem":"만성폐쇄폐질환 환자가 상태가 악화되어 기관내삽관을 하고 기계환기가 적용되었다 기관\n내삽관 몇 분 후에 빈맥과 심각한 저혈압이 나타나고 산소포화도가 현저하게 떨어지고 있\n다. 이 환자에게 우선적인 중재는?","choices":["흉강천자를 시행한다.","기관지확장제를 투여한다.","환자의 불안을 진정시킨다.","인공호흡기 설정을 재조정한다.","높은 호기말양압을 적용한다."],"answer":1,"answerLabel":"①","answerPage":343,"explanation":"이 환자는 기계환기로 인한 긴장 기흉(tension pneumo\nthorax)0l 발생한 경우로, 이런 양압환기의 잠재적 합병증은\n기관내삽관 후 빠르게 발생한다. 즉시 흉관또는 주사바늘)\n을 삽입하여 공기를 외부로 뺌으로써 흉곽내 압력을 줄여야\n한다. 빈맥과 저혈압은 심박출량의 감소로 인해 발생하고,\n저산소혈증은 충분한 공기 교환이 일어나지 않아 생긴\n결과이다. 흥분 그 자체로 생명을 위협하는 상황은 거의\n없으며 만약에 흥분했다면 고혈압이 나타났을 것이다.\n인공호흡기 설정의 재조정은 잠재적으로 옳게 볼 수 있지만\n부적절한 인공호흡기 설정이 단기간 내에 생명에 위협을\n주는 경우는 거의 없다. 호기말양압으로 폐포의 개방 상태를\n유지하는 것은 급성 호흡곤란증후군에서 필요하다 ."},{"id":"c06-q051","chapterId":6,"number":51,"page":174,"stem":"만성폐쇄폐질환이 있는 환자에게 ipratropium bromide (Atrovent*)를 투여할 때 기대하는\n약리작용은?","choices":["염증 완화","점액 용해","기관지 확장","폐포 부피 감소","점액 섬모청소율 증가"],"answer":3,"answerLabel":"③","answerPage":343,"explanation":"지속성 항콜린제인 ipratropium bromide (Atrovent*)\n는 폐의 과팽창과 호흡곤란을 완화시키는 기관지확장제이다."},{"id":"c06-q052","chapterId":6,"number":52,"page":174,"stem":"만성폐쇄폐질환 환자가 현재 비강캐뉼라를 통해 2 L/분으로 산소 투여와 스테로이드 치\n료 중으로 오늘 시행한 동맥혈 가스분석 결과가 pH 7.23, PCO 2 47 mmHg, P02 90 mmHg,\nHCO3- 21 mEq/L, 혈당 278 mg/dL일 때, 적절한 중재는?","choices":["정맥 수액과 전해질 보충","산소 투여량을 3 L/분으로 증가","생리식염수에 소량의 인슐린을 섞어 점적 주입","중탄산염 용액 50 mL를 정맥으로 일시 주사(IV bolus)","속효인슐린(regular insulin) 6단위를 정맥으로 일시 주사"],"answer":5,"answerLabel":"⑤","answerPage":343,"explanation":"이 혼仄卜는 스테로이드 치료 및 스트레스로 인한 고혈당이\n있으며 , 다뇨증이 동반될 수 있다. 따라서 인슐린을 투여하여\n고혈당을 교정할 수 있으며 , 이 이후에는 정맥 수액과 전해질\n보충이 이루어지도록 한다. 소량의 인슐린 점적은 고혈당을\n교정하는데 시간이 많이 걸리며, 중탄산염의 수치가 약간\n감소되어 있으나 수액과 전해질이 보충되면 정상화될 수\n있으므로 지금 교정할 필요는 없다. 또한 이산화탄소분압은\n환자의 기저질환을 감안할 때 정상으로 볼 수 있다. 산소\n투여량은 동맥혈 산소분압 60~65 mmHg를 유지하는\n것이 목표이며, 고농도의 산소는 오히려 더 해롭다."},{"id":"c06-q053","chapterId":6,"number":53,"page":174,"stem":"천식에 대한 설명으로 옳은 것은?","choices":["기관지 경련과 점액분비 증가, 점액부종으로 인해 발작적 기도폐색이 야기된다.","가장 특징적인 병태생리적 변화는 폐포벽 파괴이다.","증상으로 객담이 동반된 기침과 흉부압박감이 있다.","천식 발작 시 서맥과 수축기 저혈압이 동반된다","주로 낮 동안에 증상이 악화된다."],"answer":1,"answerLabel":"①","answerPage":343,"explanation":"천식은 기관지 경련과 점액분비 증가, 점액부종으로\n인해 발작적 기도폐색이 야기되고 주로 밤이나 이른 새벽에\n증상이 악화되며 기침 발작 시에는 빈맥과 혈압 상승이 있을\n수 있고 마른 기침과 흉부압박감이 증상으로 나타날 수 있다."},{"id":"c06-q054","chapterId":6,"number":54,"page":174,"stem":"급성 천식 발작이 있는 환자의 단순흉부촬영상에서 볼 수 있는 것은?","choices":["무기폐 (atelectasis)","경화(consolidation)","폐 침윤(infiltration)","과다팽창(hyperinflation)","컬리 B선(Kerley B line)"],"answer":4,"answerLabel":"④","answerPage":343,"explanation":"천식 증상이 악화될 경우 흉곽의 과다팽창을 관찰할\n수 있다."},{"id":"c06-q055","chapterId":6,"number":55,"page":175,"stem":"중등도의 만성 천식이 있는 환자가 3일 전부터 시작된 목의 통증, 맑은 콧물과 마른 기침\n이 있어 내원하였다. 이전에는 salmeter이 (Advair)로 증상이 잘 조절되었고 가끔 색쌕거\n림이 있으면 주 1-2회 정도 albuter이을 추가적으로 사용했는데, 어제부터는 쌕쌕거림이\n있을 때 albuter이을 3시간마다 2회씩 분무해야만 안정되었다고 한다. 다음으로 시행해야\n할 것은?","choices":["폐활량 측정","기관지경검사","단순흉부촬영","산소포화도 측정","객담 도말검사"],"answer":1,"answerLabel":"①","answerPage":343,"explanation":"천식의 중증도나 증상 악화 정도는 폐활량 측정법과\n폐기능검사로 이루어진다."},{"id":"c06-q056","chapterId":6,"number":56,"page":175,"stem":"30세 여자가 급성으로 천식이 악화되어 입원하였다. 적절한 약물 치료는?","choices":["corticosteroids 흡입","theophylline 정맥 투여","beta-2 작용제 경구 투여","corticosteroids 흡입과 theophylline 정맥 투여","corticosteroids 경구 투여와 beta-2 작용제 흡입"],"answer":5,"answerLabel":"⑤","answerPage":343,"explanation":"급성 천식 발작 시 최선의 약물 치료는 corticosteroids\n의 경구 투여전신요법와 beta-2 작용제의 흡입이다."},{"id":"c06-q057","chapterId":6,"number":57,"page":175,"stem":"급성 천식 발작으로 지난 6개월 동안 3차례 입원을 했던 15세 환아에게 천식 발작 빈도\n를 감소시키기 위한 가장 적절한 약물은?","choices":["흡입 futicasone","흡입 albuterol","경구 propranolol","경-』corticosteroid","경구 theophylline"],"answer":1,"answerLabel":"①","answerPage":343,"explanation":"급성 천식 발작의 빈도를 줄이기 위한 최선의 약물은\n코르티코스테로이드를 직접 폐에 투입하는 것이다."},{"id":"c06-q058","chapterId":6,"number":58,"page":175,"stem":"천식 환자에게서 중등도의 증상이 있을 때 추가할 약물은?","choices":["경구 테오필린","비만세포 안정제","경구 코르티코스테로이드","류코트리엔 길항제","속효성 베타-2 작용제"],"answer":3,"answerLabel":"③","answerPage":343,"explanation":"중증도의 천식 증상이 발현되면 코르티코스테로이드\n복용약을 추가하게 한다."},{"id":"c06-q059","chapterId":6,"number":59,"page":175,"stem":"천식 치료에서 류코트리엔 길항제(leukotriene antagonists)의 사용 목적은?","choices":["염증 반응 억제","기관지 수축 예방","기관지 경련 예방","급성 기관지 경련 치료","기관지 경련 및 염증 치료"],"answer":1,"answerLabel":"①","answerPage":343,"explanation":"류코트리엔 길항제는 류코트리엔의 생성을 감소시켜\n염증 반응을 억제하는 조절제이다."},{"id":"c06-q060","chapterId":6,"number":60,"page":176,"stem":"천식 환자에서 흡입 코르티코스테로이드 투여를 시작한 후 증상 조절 효과를 보이는 시\n기는?","choices":["투여 첫날","투여 2~8일 이내","투여 약 3〜4주 이내","투여 약 1 ~2개월 이내","투여 약 3~5개월 이내"],"answer":2,"answerLabel":"②","answerPage":343,"explanation":"천식 환자에서 흡입 코르티코스테로이드 투여를 시작한\n후 증상 조절 효과를 보이는 시기는 투여 2〜6일 정도이다."},{"id":"c06-q061","chapterId":6,"number":61,"page":176,"stem":"천식 환자에서 속효성 베타-2 작용제(SABA)의 약리작용은?","choices":["염증 완화","분비물 억제","평활근 이완","류코트리엔 변형","비만세포 매개물질 억제"],"answer":3,"answerLabel":"③","answerPage":343,"explanation":"속효성 베타-2 작용제는 아데닐레이트 사이클레이스\n(adenylate cyclase)의 자극을 통해 CAMP 를 증가시켜\n기관지를 확장시키고 즉각적인 과민반응을 일으키는 매개체\n발생을 억제한다."},{"id":"c06-q062","chapterId":6,"number":62,"page":176,"stem":"천식이 있는 환자가 3일 전부터 시작된 맑은 콧물과 마른기침이 있어 내원하였다. 천식 증\n상은 그동안 잘 조절되었으며, 기침이나 쌕쌕거림이 있을 때는 budesonide (P니micort)\n와 게buter이을 사용해 왔다고 한다. 열은 없고, 내원하기 전 측정한 최대날숨유량(PEF) 은\n최고 55% 이며 병원에서 측정한 1 초간 노력성 호기량(FE \\/)은 65% 정도로 예측된다. 이\n환자에게 필요한 약물은?","choices":["theophylline","salmeterol","prednisone","mont이ukast","ipratropium"],"answer":3,"answerLabel":"③","answerPage":343,"explanation":"이 환자는 중등도 악화(moderate exacerbation)\n상태로 저산소혈증의 교정이 필요하다. 속효성 베타-2\n작용제와 함께 전신 코르티코스테로이드 투여가 초기에\n요구된다."},{"id":"c06-q063","chapterId":6,"number":63,"page":176,"stem":"중등도 만성 천식 치료의 기본 주축이 되는 약물은?","choices":["크로몰린","경구 테오필린","비만세포 안정제","속효성 베타-2 작용제","흡입 코르티코스테로이드"],"answer":5,"answerLabel":"⑤","answerPage":343,"explanation":"중등도 천식 환자를 위한 약물요법 중 흡입 코르티코\n스테로이드는 염증을 완화시키는 장기간 조절 약물의 기본\n주축이 된다."},{"id":"c06-q064","chapterId":6,"number":64,"page":176,"stem":"다음 중 천식 증상이 악화되어 입원한 환자에게 기관내삽관과 기계환기가 필요함을 보여\n주는 임상 징후는?","choices":["호흡성 알칼리증","흉곽의 과다팽창","양쪽 폐의 쌕쌕거림","자극에 대한 반응 감소","동맥혈 산소포화도 92%"],"answer":4,"answerLabel":"④","answerPage":343,"explanation":"천식이 악화된 환자에게 의식수준 저하는 저환기 호흡\n(호흡성 산증)과 호흡 정지의 전조 증상이다. 호흡성 알칼리증,\n흉곽의 과다팽창과 양쪽 폐의 쌕쌕거림은 천식 악화 시 흔히\n나타나는 초기 증상이다. 경미한 저산소혈증은 曰5를\n증가시켜 치료할 수 있지만 심하지 않으면 중요한 문제는\n아니다."},{"id":"c06-q065","chapterId":6,"number":65,"page":177,"stem":"38세 천식 환자가 심한 천식 발작으로 중환자실에 입원하였다. 환자는 점점 더 호흡이 힘\n들어진다고 하며, 동맥혈 가스분석 결과가 pH 7.25, PCO 2 68 mmHg, P02 60 mmHg,\nHCO3- 24 mEq/じ길 때, 가장 적절한 중재는?","choices":["흡입 스테로이드 추가","류코트리엔 조절제 투여","흡입 산화질소 투여","즉시 기관내삽관 시행","서방형 테오필린 투여"],"answer":4,"answerLabel":"④","answerPage":343,"explanation":"이 환자는 천식의 중증 급성 악화상태로 호흡성 산증과\n고탄산혈증(hypercarbia)은 가스교환 장애가 더 심해지고\n호흡노력이 감소하고 있음을 나타내며, 적극적인 치료를\n필요로 하는 극심한 정도의 발작을 시사할 수 있으므로\n일반적으로 신속한 기관내삽관이 가장 적절한 중재이다.\n스테로이드와 류코트리엔 억제제와 같은 소염제는\n기관지확장제와 같이 투여할 수 있으나 고탄산혈증이 생기기\n전에 사용해야 하며, 흡입 산화질소(nitric oxide)는 급성호흡\n곤란증후군과 폐고혈압 치료에 사용된다."},{"id":"c06-q066","chapterId":6,"number":66,"page":177,"stem":"급성 천식으로 alb니er이 (Ventolin) 흡입제를 처방 받은 환자에게 사용법을 교육하였다.\n다음 중 사용법에 대해 잘 이해했다고 판단되는 환자의 반응은?","choices":["한번 흡입하고 나서 1 분 정도 있다가 두 번째 흡입을 할 거예요.","숨쉬기 힘들지 않더라도 4시간마다 두 번씩 흡입할 거예요.","향후 천식이 재발하는 것을 예방하기 위해 정기적으로 흡입할 거예요.","숨쉬기 힘들어질 때마다 두 번씩 흡입할 거예요.","아무리 숨쉬기 힘들어도 1 번만 흡입할 거예요."],"answer":1,"answerLabel":"①","answerPage":344,"explanation":"이 치료가 가장 효과적이려면 두 번의 흡입 사이에 1\n분 정도의 시간 경과가 필요하다. 첫 번째 흡입은 상기도에\n효과를 나타내어 그 부분을 확장시킬 것이고, 이로 인해 두\n번째 흡입은 더 아래쪽 호흡기계에 효과가 나타나게 한다."},{"id":"c06-q067","chapterId":6,"number":67,"page":177,"stem":"다음 중 급성호흡곤란증후군에 대한 설명으로 옳은 것은?","choices":["염증 반응으로 폐포 모세혈관 손상과 삼출액이 폐포에 축적되어 중증도의 폐부종 이 유발된다.","특정 물질의 흡인으로 인해 폐부종이 유발된다.","초기부터 호흡곤란, 청색증 호흡성 산증이 유발된다.","잔기량이 증가되어 폐포에 과부하가 유발된다.","호흡 시 극심한 통증이 유발된다"],"answer":1,"answerLabel":"①","answerPage":344,"explanation":"급성호흡곤란증후군에서는 염증 반응으로 폐포 모세혈관\n손상과 삼출액이 폐포에 축적되어 중증도의 폐부종이\n유발된다. 쇼크, 출혈, 췌장질환에 대한 이차적인 염증\n반응으로도 나타난다."},{"id":"c06-q068","chapterId":6,"number":68,"page":177,"stem":"25세 여자가 약물과다 복용 후 의식이 저하되어 다량의 위액이 흡인된 상태로 중환자실에\n입원하였다 기관내삽관 후 실시한 동맥혈 가스분석 결과가 pH 7.30, PaCO2 30 mmHg,\nPaO 2 40 mmHg (FiO21.0)이고, 단순흉부촬영상에서 양쪽 폐에 전반적인 침윤이 나타났\n을 때, 이 환자에게 의심되는 상태는?","choices":["폐색전증","급성 기관지염","기관지확장증","폐동맥고혈압","급성호흡곤란증후군"],"answer":5,"answerLabel":"⑤","answerPage":344,"explanation":"이 환자는 급성호흡곤란증후군이 의심되며, 급성호흡\n곤란증후군의 경우 단순흉부촬영상에서 양쪽 폐포에 전반적인\n침윤이 관찰될 수 있다."},{"id":"c06-q069","chapterId":6,"number":69,"page":178,"stem":"다음 중 급성호흡곤란증후군의 임상적 특징에 해당하지 않는 것은?","choices":["빈호흡","불응성 저산소혈증","단순흉부촬영상 양쪽 폐의 미만성 침윤","동맥혈 산소분압:흡입산소농도〈200","폐 사강 감소"],"answer":5,"answerLabel":"⑤","answerPage":344,"explanation":"급성호흡곤란증후군에서는 빈호흡, 호흡곤란이 있으며,\n초기에 나타나는 저산소혈증은 산소 공급으로 호전될 수\n있으나 결국 불응성 저산소혈증(refractory hypoxemia)이\n발생한다. PaC)2：FiO2〈200이고, 단순흉부촬영상에서\n양쪽 폐에서 폐포의 반점형 침윤 소견이 보이며, 폐 사강은\n증가한다."},{"id":"c06-q070","chapterId":6,"number":70,"page":178,"stem":"급성호흡곤란증후군이 있는 환자의 단순흉부촬영상에서 볼 수 있는 것은?","choices":["농흉","양쪽 흉막삼출","왼쪽 하부의 폐허탈","과도통기 (hyperaeration)","고르지 못한 산재성 양쪽 폐 침윤"],"answer":5,"answerLabel":"⑤","answerPage":344,"explanation":"급성호흡곤란증후군의 단순흉부촬영상에서는 간질 성\n및 폐포 음영이 섞인 형태가 나타나며 대개 양측성이다."},{"id":"c06-q071","chapterId":6,"number":71,"page":178,"stem":"70 Kg인 급성호흡곤란증후군 환자가 기계환기 중으로 최고흡기압(peak inspiratory\npressure) 55 cmH20, 고평부압(plateau pressure) 50 cmH20, PaO 2 60 mmHg이다. 인\n공호흡기 설정이 보조조절방식(assist-8nt® mode), 호흡수 12회/분, 일회호흡량 700\nmL, 흡입산소농도(FiO) 1.0, 호기말양압(PEEP) 15 cmHQ일 때, 올바른 판단은?","choices":["고평부압은 적절하다.","호흡수를 증가시켜야 한다.","일회호흡량이 환자에게 적절하지 않다.","산소화를 개선하기 위해서 PEEP 을 5 cmHQ로 내려야 한다","지속기도양압(continuous positive airway pressure)으로 환기방식을 변경해야 한다."],"answer":3,"answerLabel":"③","answerPage":344,"explanation":"급성호흡곤란증후군에서는 용적손상(volutra니ma)을\n예방하기 위해 적은 일회호흡량((6 mL/Kg)을 적용한다.\n그러므로 70 Kg인 환자에게 700 ml_는 너무 많다.\n고평부압은 급성 폐손상 환자들에게는 30〜35 cmHQ를\n넘지 않도록 설정한다. PEEP 는 무기폐와 저산소혈증을\n예방하기 위해 5 cmH?。로 시작하여 3~5 cmH?。씩\n증가시켜 최대 20~24 cmHQ까지 증가시킨다(추천 10~ 15\ncmHQ). CPAP는 자발호흡이 있는 환자에게 적용하는\n것으로 이 환자에게는 적절하지 않다."},{"id":"c06-q072","chapterId":6,"number":72,"page":178,"stem":"체중 60 Kg인 급성호흡곤란증후군 환자가 흡입산소농도(FiO, 0.7, 일회호흡량(TV) 420\nmL, 호흡수 10회/분, 호기말양압(PEEP) 20 cmH2c 로 기계환기 중이며, 현재 혈압 75/60\nmmHg, 맥박 120회/분, 체온 37七이고, 동맥혈 산소분압 70 mmHg이다. 이 환자에게 적\n절한 중재는?","choices":["흡입산소농도를 올린다.","호기말양압을 10 cmH?O 로 낮춘다.","일회호흡량을 600 mL로 증가시킨다.","수축기 혈압을 올리기 위해 도파민을 투여한다.","생리식염수 500 mL를 정맥으로 일시 주사(be如s)한다."],"answer":4,"answerLabel":"④","answerPage":344,"explanation":"기계환기 중인 환자에게서 나타나는 저혈압은 정맥환류\n(venous return)를 감소시키는 높은 호기말양압으로 인해\n흉강내압이 증가되어 있기 때문일 수 있다. 따라서 호기말양압이\n적용되어 있는 경우에는 혈관내 용적 감소에 주의를 기울여야\n하며 , 수액의 일시 주사가 필요하다. 흡입산소농도는 동맥혈\n산소분압이 50 mmHg 이상이
