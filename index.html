red dots)","흰 솜털(fuzzy white blots)","뿌연 오렌지 선(blurred orange lines)","다발성 망막출혈(multiple retinal hemorrhages)"],"answer":2,"answerLabel":"②","answerPage":326,"explanation":"망막성 미세동맥류(retinal microaneurysm)는 작은\n붉은 반점으로 확인된다. 삼출물(exudate) 시 면화반(cotton\nwool spots)이 확인되며, 두 증상 모두 당뇨성 망막병증의\n소견이다."},{"id":"c04-q051","chapterId":4,"number":51,"page":86,"stem":"피부의 탄력성을 확인하기 위해 쇄골하 전흉부의 피부주름을 잡아서 들어 올린 후 손을\n놓았을 때 집어 올린 피부가 서서히 돌아가거나 그대로 멈추어 있는 것을 확인하였다. 이\n결과가 의미하는 것은?","choices":["부종(edema)","백반(vitiligo)","자반(purpura)","탈수(dehydration)","피부경화증(scleroderma)"],"answer":4,"answerLabel":"④","answerPage":326,"explanation":"탄력성 저하는 심한 탈수나 지나친 체중감소에서\n나타난다."},{"id":"c04-q052","chapterId":4,"number":52,"page":86,"stem":"피부가 동그란 모양으로 빨갛게 발적 되어 있으면서 장액성 수포와 옅은 구멍이 형성된\n경우 욕창 단계는?","choices":["1 단계","2 단계","3 단계","4단계","suspected DTI"],"answer":2,"answerLabel":"②","answerPage":326,"explanation":"욕창 2단계는 표피나 진피이 상실과 함께 부분적인\n피부 미란이 생긴다. 표재성 궤양은 찰과상 또는 분홍빛의\n적색 상처로 터진 수포처럼 보인다."},{"id":"c04-q053","chapterId":4,"number":53,"page":86,"stem":"38세 HIV 환자가 몸통에 아프고, 가려운 발진을 호소하고 있匚卜. 신체검진 시 중간선을 가\n로지르지 않는 선형 잔물집병터(vesicular lesions)가 흉부 후면에 걸쳐 있는 것을 발견하\n였다. 이 환자에게 의심되는 질환은?","choices":["건선","알레르기 반응","대상포진(herpes zoster)","연쇄구균(Streptococci) 감염","황색포도구균(Staphylococcus aureus) 감염 part I 공통영역 I 86"],"answer":3,"answerLabel":"③","answerPage":326,"explanation":"활성화된 대상포진은 피부분절에 발생하지만 중간선을\n가로지르지는 않는 특징적인 발포성 병변; 타는 듯한,\n욱신욱신 쑤시는, 칼에 베이는 듯한 통증; 때로는 심한\n가려움증의 증상을 보인다. 흉부 피부분절은 가장 흔하게\n침범되는 부위이며 그 다음이 허리 부분이다."},{"id":"c04-q054","chapterId":4,"number":54,"page":87,"stem":"대상포진이 의심되는 환자의 진단을 확정하기 위해 사용되는 검사는?","choices":["피부생검 (skin biopsy)","피부접촉검사(patch test)","병변 배양검사(culture of the lesion)","항체선별검사(antibody screening test)","Wood의 피부スト외선검사(Wood's light examination)"],"answer":3,"answerLabel":"③","answerPage":326,"explanation":"전통적으로 대상포진은 신체검진을 통해 진단된다.\n병변의 바이러스 배양검사는 확정 진단을 할 수 있는 검사이다.\n대상포진은 varicell-zoster virus의 활성화로 야기되며 이\n바이러스는 수두chickenpox의 원인 균이다. 피부접촉검사는\n피부표면에 패치를 부착하여 특정 알레르기원을 찾기 위한\n검사이며 Wood의 피부자외선검사는 피부에 자외선 불빛을\n비추어 피부 표면 감염을 확인하는 검사이다."},{"id":"c04-q055","chapterId":4,"number":55,"page":87,"stem":"28세 남자가 차량 폭파 사고로 화상을 입어 입원하였다. 화상의 범위는 환자의 얼굴 전\n체(머리의 전면부), 앞쪽 몸통의 상위부(앞 몸통의 절반) 양쪽 팔의 팔꿈치 아래 전체이다.\n불을 피하다가 옷이 불에 타면서 머리 후巴 뒤쪽 몸통의 상위부(뒤쪽 몸통의 절반)도 화\n상을 입었다. 9의 법칙(Me of nines)에 따른 환자의 화상 범위는?","choices":["18%","24%","36%","48%","60%"],"answer":3,"answerLabel":"③","answerPage":326,"explanation":"9의 법칙에 따르면 머리의 전면부 4.5%, 앞쪽 몸통의\n상위부 9%, 양쪽 팔의 아래 부분 전체 9% 머리의 후면\n4.5%, 그리고 뒤쪽 몸통의 상위부 9% 로 총 36% 이다."},{"id":"c04-q056","chapterId":4,"number":56,"page":87,"stem":"피부색이 어두운 환자의 시진 시 황달을 확인하기 적합한 신체부위는?","choices":["혀 (tongue)","공막(sclera)","결므)\"(conjunctiva)","점막(mucous membranes)","손발톱 바닥(nail beds)"],"answer":2,"answerLabel":"②","answerPage":326,"explanation":"피부색이 어두운 대상자나흑인의 경우 피부색의 변화를\n확인하기 어렵다. 공막은 황달을 확인하기에 가장 적합한\n신체부위이다. 혀, 점막 및 손발톱 바닥은 창백이나 청색증\n여부를 확인하기에 적합한 신체부위이다."},{"id":"c04-q057","chapterId":4,"number":57,"page":87,"stem":"67세 제2형 당뇨병 환자가 깜박이는 빛과 부유물이 보이고, 시력이 저하되었으며, 변형시\n증(metamorphopsia)를 호소하고 있다. 이러한 증상과 가장 관련 있는 질환은?","choices":["백내장(cataract)","앞포도막염 (anterior uveitis)","망막박리 (retinal detachment)","개방각녹내장(open-angle glaucoma)","망막중심동맥 폐쇄(central retinal artery occlusion)"],"answer":3,"answerLabel":"③","answerPage":326,"explanation":"망막박리의 날파리증(부유물이 보이는 증상), 광시증\n(깜박이는 빛이 보이는 증상), 시야장애(위, 아래, 좌우에서부터\n시야가 커튼을 친 것 같이 가려보이는 증상), 변형시증사물이 찌그러져\n보이는 증상) 등이 시력장애가 생기기 전부터 생길 수 있다."},{"id":"c04-q058","chapterId":4,"number":58,"page":87,"stem":"다음 중 녹내장의 위험요인은?","choices":["편두통","요로감염","심혈관계 질환","상부호흡기계 질환","상부위장관계 질환"],"answer":3,"answerLabel":"③","answerPage":326,"explanation":"고혈압, 심혈관계 질환, 당뇨 및 비만은 녹내장 발생의\n위험요인이다."},{"id":"c04-q059","chapterId":4,"number":59,"page":88,"stem":"외안근의 기능 검사 시 환자의 눈이 오른쪽 방향을 주시할 때는 한꺼번에 움직이는데 왼\n쪽 방향을 주시할 때는 오른 쪽 눈만 왼쪽으로 움직이고 왼쪽 눈은 움직임 없다. 손상이\n의심되는 뇌신경은?","choices":["제2뇌신경","제3뇌신경","제4뇌신경","제5뇌신경","제6뇌신경"],"answer":5,"answerLabel":"⑤","answerPage":326,"explanation":"6개 주요 방향으로 눈을 유도하면서 안구가 움직이면서\n외안근 중 약한 근육을 확인하기 위해 응시검사를 시행한다.\n정상적인 반응은 양쪽 눈이 목표물과 나란한 방향으로\n움직인다. 오른쪽이나 왼쪽 직선 방향으로 눈이 움직이지\n않는다면 제6뇌신경의 마비를 의미한다."},{"id":"c04-q060","chapterId":4,"number":60,"page":88,"stem":"시야 검사 시 정상 시야를 가진 사람은 귀쪽 몇 도에서 검진자의 움직이는 손가락을 볼\n수 있는가?","choices":["50°","60°","70°","90°","1800"],"answer":4,"answerLabel":"④","answerPage":326,"explanation":"시야검사의 정상적인 결과는 50° 상방향, 측부측 시야\n90O, 70° 하방향, 비측 시야 60°이다. 검진자는보이는데\n대상자가 볼 수 없다면 주변 시야의 상실을 의미한다."},{"id":"c04-q061","chapterId":4,"number":61,"page":88,"stem":"검안경의 사용방법에 대한 설명으로 옳은 것은?","choices":["검진자는 안경을 벗고 디옵터를0에 맞춘다.","검사실의 불을 남겨두고 대상자의 안경을 벗게 한다","작은 흰 불빛을 사용하고 대상자에게 검안경에 초점을 맞추라고 말한다.","검진자의 안경을 벗고 대상자의 왼쪽 눈에 자신의 왼쪽 눈을 가까이 한다.","녹내장이 있는 대상자의 경우 산동제를 사용하여 동공을 확대시켜서 검진한다."],"answer":4,"answerLabel":"④","answerPage":326,"explanation":"검진자와 대상자의 안경을 모두 벗어야 한다. 안저검사를\n위해서는 방을 어둡게 해서 동공이 확대되도록 한다. 필요시\n산동제를 통해 동공을 확대한 후 검사를 시행한다. 산동제\n사용은 지속적인 동공 반사가 필수적인 머리 손상 및\n혼수상태, 그리고 녹내장 환자에게는 금한다."},{"id":"c04-q062","chapterId":4,"number":62,"page":88,"stem":"한쪽 눈을 가리고 하는 차폐검사(cover test)로 사정하는 것은?","choices":["시력","안구진탕","근육 약화","주변 시야","동공의 수축력"],"answer":3,"answerLabel":"③","answerPage":326,"explanation":"차폐검사는 외안근의 기능이상을 확인하기 위해 시행하는\n검사이다. 가리지 않은 눈이 정해진 점에 시선을 고정한\n상태에서 차단물을 제거했을 때 가린 눈의 배열이 가리지\n않은 눈처럼 같은 배열로 고정되어 있다면 정상이다."},{"id":"c04-q063","chapterId":4,"number":63,"page":88,"stem":"심한 혹은 불응성 비출혈(epistaxis) 환자에서 흔히 볼 수 있는 임상적 특징은?","choices":["빈혈","고혈압","제 2형 당뇨병","알레르기성 비염","급성 박테리아성 부비동염"],"answer":2,"answerLabel":"②","answerPage":326,"explanation":"비출혈의 원인은 코 후빔, 심한 기침 또는 재채기, 골절,\n이물질, 불법적인 약물, 국소용 비강 약물, 와파린, 아스피린\n혹은 응고장애가 있다. 고혈압, 아스피린이나 알코올 남용은\n불응성 비출혈의 주요 관련 요인이다."},{"id":"c04-q064","chapterId":4,"number":64,"page":89,"stem":"26세 남자가 점점 심해지는 인두통과 연하곤란 입벌림장애, 편측 귀통증을 호소하고 있\n다. 환자는 소리를 죽인 목소리를 내며, 신체검진 시 홍반성의 부은 편도와 대측성의 구\n개 편위가 있는 것을 확인하였다. 이러한 증상과 가장 관련이 있는 질환은?","choices":["구강암(oral cancer)","초기 성홍열(scarlet fever)","편도주위 농양(peritonsillar abscess)","바이러스성 인두염 (viral pharyngitis)","감염단핵구증(infectious mononucleosis)"],"answer":3,"answerLabel":"③","answerPage":326,"explanation":"급성 인두염과 편도염은 선홍색 목구멍, 편도 종창,\n편도와 인두의 백색 또는 황색의 삼출물, 부운 목젖, 전경부와\n편도 림프절이 커지고 압통이 있다. 치료하지 않은 급성\n인두염은 화동합병증, 편도주위 농양이나 화농성\n혈전정맥염이 생길 수 있다."},{"id":"c04-q065","chapterId":4,"number":65,"page":89,"stem":"메니에르병(Meniere‘s disease) 환자의 양성 돌발성 체위성 현훈증(benign paroxysmal\npositional vertigo)의 여부를 확인하고자 한다. 환자를 앉은 자세에서 한쪽으로 머리를\n45° 돌린 뒤 수평면보다 20° 정도 아래로 젖혀서 눈동자가 특정 방향으로 튀는 안진\n(nystagmus)이 있는지를 확인하는 검사는?","choices":["Rinne test","Weber test","Fukuda test","Romberg test","Dix-Hallpike test"],"answer":5,"answerLabel":"⑤","answerPage":326,"explanation":"Dix-Hallpike검사는 환자를 앉은 자세에서 한쪽으로\n머리를 45° 돌린 뒤 수평면보다 20° 정도 아래로 젖히는\n검사법이다. Dix-H기I이ke검사 양성은 눈동자가\n특정방향으로 튀는 안진을 보이는 경우이다. 안진은 눈동자가\n상향하면서 눈동자의 위쪽 부위가 아래쪽으로 향하는 회전성\n안진을 보이게 된다."},{"id":"c04-q066","chapterId":4,"number":66,"page":89,"stem":"32세 환자가 귀의 염증으로 치료 중이다. 열이나 통증은 없으나 귀가 꽉 막힌 느낌이고,\n청력도 떨어지면서 자신의 음성도 울린다고 호소한다. 이 환자에게 의심되는 질환은?","choices":["외이도염","이경화증","메니에르병","고막 천공","장액성 중이염"],"answer":5,"answerLabel":"⑤","answerPage":326,"explanation":"노란 호박색 고막은 막혔던 유스타키오관의 음압을\n완화시키기 위해 중이로 삼출되는 장액을 의미한다. 장액성\n중이염의 증상은 가득 찬 느낌, 일시적인 청력 상실, 삼킬\n때 펑 소리가 나는 것 등이다."},{"id":"c04-q067","chapterId":4,"number":67,"page":89,"stem":"이경을 이용하여 환자의 고막 검진 시 정상이라고 판단되는 결과는?","choices":["고막의 움직임이 없다.","고막의 경련적인 움직임이 있다.","고막의 색깔이 호박색이다.","고막이 투명한 진주빛 회색이다","고막이 팽윤되어 있다."],"answer":4,"answerLabel":"④","answerPage":326,"explanation":"정상 고막은 빛이 나고 투명하고 진주빛 회색을 띠고\n있다. 광추면원추 모양의 빛 반사이 전하방 1/4에서 나타난다.\n이는 이경의 불빛이 반사된 것이다. 고막은 편평하며, 중앙이\n오목하게 들어가 있다. 정상 고막은 손상이 없다."},{"id":"c04-q068","chapterId":4,"number":68,"page":89,"stem":"전도난청(conductive hearing loss)에 대한 설명으로 옳은 것은?","choices":["제8뇌신경 손상","노화로 인한 노인성 난청","달팽이관(cochlea) 손상","대뇌피질의 청각영역 장애","소리 전달을 방해하는 물리적 막힘"],"answer":5,"answerLabel":"⑤","answerPage":326,"explanation":"전도난청은 소리 전달을 방해하는 물질은 청각에 장애를\n초래한다. 전도난청은 외이와 중이의 기계적인 기능장애이다.\n전도성 난청의 원인은 귀지,이물질, 고막천공, 중이 내의\n농이나 장액 축적, 이경화증 등이다."},{"id":"c04-q069","chapterId":4,"number":69,"page":90,"stem":"내이에 있는 전정기관(vestib니ar apparatus)의 평형 유지 능력을 사정하기 위한 검사는?","choices":["Rinne test","Weber test","Fukuda test","Romberg test","Dix-Hallpike test"],"answer":4,"answerLabel":"④","answerPage":326,"explanation":"Romberg test는 대상자에게 두 다리로 서서 양팔을\n양쪽 옆에 놓도록 지시하고 안정감 있는 자세를 유지하면 , 두\n눈을 감은 자세를 20초간 유지시키는 검사이다. 정상적으로\n대상자는 자세를 유지할 수 있고 약간의 흔들림이 있을 수\n있지만 시각정보가 차단된 상태에서도 균형을 잡는다.\n전정기능이 소실 된 경우 흔들거림, 넘어짐, 균형을 위해 보폭\n넓힘을 보인다."},{"id":"c04-q070","chapterId":4,"number":70,"page":90,"stem":"43세 여자가 12시간전부터 시작된 갑작스런 오른쪽 상복부 통증과 왼쪽 견갑골 방사통,\n발열 및 오한을 호소하며 응급실을 방문하였다. 환자는 이번 증상보다는 경하지만 비슷\n한 경험을 이전에 한 적이 있다고 한다. 신체검진 시 오른쪽 상복부에 뚜렷한 압통이 있\n었다. 이러한 증상과 가장 관련이 있는 질환은?","choices":["간암(hepatoma)","담석증(cholelithiasis)","급성 간염 (acute hepatitis)","급성 충수염 (acute appendicitis)","급성 담낭염 (acute cholecystitis)"],"answer":5,"answerLabel":"⑤","answerPage":327,"explanation":"급성 담낭염은 담도 산통으로 우상복부의 갑작스러운\n통증이며, 왼쪽 견갑골로 방사될 수 있다. 지방식, 알코올,\n혹은 카페인 섭취한 후 시간이 흐르면서 생성되며 오심과\n구토, 양성의 Murphy 징후를 보인다. 50세 이상, 여성,\n비만, 고지혈증, 갑작스러운 체중 감소, 임신 등이\n위험요인이다."},{"id":"c04-q071","chapterId":4,"number":71,"page":90,"stem":"급성 췌장염으로 입원한 환자가 호소하는 통증의 특성은?","choices":["왼쪽 하복부에 타는 듯하고 욱신욱신 쑤시는 통증과 엉덩이 부위 방사통","명치 부위에 극심한 통증과 등 부위 방사통","명치 부위에 타는 듯하고 욱신욱신 쑤시는 통증과 배꼽 부위 방사통","왼쪽 하복부에 극심한 통증과 서혜부 부위 방사통","왼쪽 하복부에 극심한 통증과 왼쪽 견갑골 부위 방사통"],"answer":2,"answerLabel":"②","answerPage":327,"explanation":"급성 췌장염은 상복부 중앙의 급성 천자통으로 등과\n가끔 왼쪽 견갑골이나 옆구리로 방사된다. 심한 오한, 구토를\n유발한다."},{"id":"c04-q072","chapterId":4,"number":72,"page":90,"stem":"최근 위 절제술을 받은 환자에게 나타날 수 있는 덤핑증후군(dumping syndrome)의 초\n기 증상은?","choices":["발한 및 창백","서맥 및 소화불량","복시 및 흉통","복부 경력 및 통증","발열 및 빈뇨"],"answer":1,"answerLabel":"①","answerPage":327,"explanation":"덤핑증후군의 초기 증상은 보통 식후 5~30분 후에\n발생한다. 현기증 빈맥, 실신, 발한 창백, 심계항진 및 눕고\n싶은 열망 등이 초기에 나타난다."},{"id":"c04-q073","chapterId":4,"number":73,"page":90,"stem":"간성 뇌병증(hepatic encephalopaty)0| 의심되는 간경화증 환자에게서 자세고정불능\n(asterixis)이 있는지를 사정하는 방법은?","choices":["복부 둘레 측정하기","몸을 앞으로 구부리게 하기","대상자의 팔을 곧게 펴게 하기","한쪽 다리를 들어 올리게 하기","대상자 발의 발등굽힘 확인하기"],"answer":3,"answerLabel":"③","answerPage":327,"explanation":"자세고정불능은 손과 팔을 곧게 폈을 때 손가락과 손목의\n불규칙적으로 파닥파닥 거리는 움직임을 말한다. 손바닥을\n아래로 하고 손목을 구부리고 손가락을 편 상태를 유지하도록\n대상자에게 요청한다. 자세고정불능은 간성 뇌병증에서 흔히\n발견 가능한 증상이다."},{"id":"c04-q074","chapterId":4,"number":74,"page":91,"stem":"간호사가 복부 신체검진을 시행하고 있다 환자의 복부 피부상태를 시진한 후 다음 단계\n로 시행할 것은?","choices":["장요근 검사","오른쪽 하복부 타진","복부 크기 측정을 위한 촉진","복부 사분위 전체에 대한 장음 청진","간과 늑골의 경계를 확인하기 위한 촉진"],"answer":4,"answerLabel":"④","answerPage":327,"explanation":"복부 검진의 순서는 시진, 청진, 타진, 촉진이다. 장음은\n타진이나 촉진으로 변형될 수 있으므로 청진은 시진 후에\n시행해야 한다."},{"id":"c04-q075","chapterId":4,"number":75,"page":91,"stem":"38세 남자가 위식도역류병(gastroesophage게 reflux disease)이 의심되는 속쓰림과 역\n류 증상이 있으며, 평소 이러한 증상이 있을 때 약국에서 제산제를 구매하여 복용하면 증\n상이 완화되었다고 말한다. 최근 몸무게의 변화는 없으며, 오심이나 구토, 설사 혹은 흑변\n은 없었다. 이 환자의 진단을 위해 필요한 검사는?","choices":["바륨관장검사","바륨음영검사","상부위내시경검사","특별한 진단적 검사 없음","헬리코박터필로리(Helicobacter pylori) 항원을 찾기 위한 분변검사"],"answer":4,"answerLabel":"④","answerPage":327,"explanation":"위식도역류병(GERD) 은 특별한 진단검사 없이 속쓰림과\n역류의 특징정인 증상으로 진단한다. 헬리코박터필로리\n(Helicobacter pylori) 항원을 찾기 위한 분변검사는 GERD\n환자에게 추천되지 않는다. 상부 위내시경 검사의 경우\nGERD 진단의 필수 조건은 아니며 보통 GERD 의 합병증이\n의심되는 경우 시행한다. 바륨검사는 GERD 의 진단에\n사용되지 않는다."},{"id":"c04-q076","chapterId":4,"number":76,"page":91,"stem":"18세 남자가 48시간 동안의 배꼽 주변 통증 구토 및 복부 경련을 주호소로 응급실에 왔\n다. 신체검진과 혈액검사에서 Blumberg 징후(+), 백혈구증가증(Ie나gcytosis), 호중구증\n가증(neutrophilia)이 있다. 급성 충수염과 충수파열이 의심되는 상황에서 명확한 진단을\n위해 시행해야 할 검사는?","choices":["바륨관장","복부 X-ray","초음파검사","자기공명영상","컴퓨터단층촬영"],"answer":5,"answerLabel":"⑤","answerPage":327,"explanation":"복부 컴퓨터단층촬영이 일반적으로 급성 충수염 진단에\n사용된다. CT 는 충수의 해부학적 이상을 확인하는 데 있어서\n다른 영상검사보다 월등하다."},{"id":"c04-q077","chapterId":4,"number":77,"page":91,"stem":"58세 대장암 환자가 복부수술을 통해 결장루(ostomy)를 보유하게 되었다 이 환자의 결\n장루가 기능을 시작했다고 판단될 수 있는 검진 결과는?","choices":["방귀 분출","장음의 소실","음식 불내성 여부","결장루 부위의 피부 발진","결장루를 통한 혈액성 삼출물 배액"],"answer":1,"answerLabel":"①","answerPage":327,"explanation":"수술 후 결장루가 기능하는 데는 72시간, 길게는 5일\n정도 걸린다. 간호사는 연동운동이 있는지 확인해야 하며\n장음을 듣고 가스의 분출 여부를 확인해야 한다. 장음의\n소실은 연동운동이 아직 회복되지 않았음을 의미한다. 장음이\n돌아올 때까지 환자는 금식을 유지해야 한다."},{"id":"c04-q078","chapterId":4,"number":78,"page":92,"stem":"36세 남자가 급성 복통으로 응급실을 방문하여 소화성 궤양을 진단받았다. 제산제와\nPromton pump inhibitor (PPI)를 복용한 후 증상이 완화되어 안정을 취하고 있는 환자를\n간호사가 사정하고 있다 간호사의 검진 결과에서 소화성 궤양의 천공이 의심되는 증상\n이나 징후는?","choices":["서맥","혈압 상승","오심과 구토","다리 저림 혹은 무감각","단단하고 판자 같은 복부"],"answer":5,"answerLabel":"⑤","answerPage":327,"explanation":"궤양의 천공은 외과적 응급상황으로 갑작스런 날카롭고\n참을 수 없이 심한 통증이 명치 중간부위에서 시작해서 복부\n전체로 퍼진다. 복부는 단단한 판자처럼 된다. 오심과 구토는\n발생할 수 있다. 저혈압 및 빈맥은 저혈량성 쇼크로 진행되면\n나타나며 다리 저림이나 무감각은 관련이 없다."},{"id":"c04-q079","chapterId":4,"number":79,"page":92,"stem":"급성 췌장염 환자의 신체검진 결과 중 마비성 장폐색이 의심되는 경우는?","choices":["가스 방출 기능 불능","항문괄약근 조절력 상실","우측 상복부 타진 시 둔탁음 들림","갑작스럽게 발생한 지속적인 심한 통증","오른쪽 늑골연 아래 부위에서 촉진되는 단단하고 압통이 없는 덩어리"],"answer":1,"answerLabel":"①","answerPage":327,"explanation":"급성 췌장염과 같은 염증성 반응은 마비성 장폐색을\n유발할 수 있다. 가스 방출 기능 불능의 경우 마비성 장페색의\n임상적 특성이다. 마비성 장폐생 환자에게 통증이 있을 수\n있으나 통증은 주로 불편감으로 표현된다. 갑작스럽게 발생한\n지속적인 심한 통증은 교액장폐색(strangulation ileus)으로\n야기된다."},{"id":"c04-q080","chapterId":4,"number":80,"page":92,"stem":"46세 남자가 장폐색을 진단받고 비위관을 삽입하여 감압치료를 받고 있다. 현재 2시간마\n다 1 시간 동안 비위관을 잠근 상태를 유지하면서 장폐색 증상의 발현 여부를 관찰 중이\n다. 이 환자의 비위관을 제거하기 전에 간호사가 확인해야 할 것은?","choices":["장요근검사","정상 전해질 수치","위액의 정상 pH 농도","비위관의 위치의 적절성","사분위에서의 장음 유무"],"answer":5,"answerLabel":"⑤","answerPage":327,"explanation":"복부팽만, 구토 및 복부 통증이 장폐색에서 나타날 수\n있는 증상이다. 비위관은 위장 내 가스와 액을 제거하여\n팽만과 구토 증상을 완화시킬 목적으로 사용된다. 장음은\n정상 장운동을 의미하며 장폐색이 해결되었음을 의미한다.\n비위관을 제거하기 전에 장의 기능을 사정해야 하는데 ,\n장폐색 증상이 있다면 비위관의 재삽입을 고려해야 한다.\n정상 전해질 수치나 pH 농도, 비위관의 위치의 적절성은\n비위관을 삽입한 환자에게 주요한 관찰 사항이지만 비위관\n제거를 판단하는 기준은 아니다."},{"id":"c04-q081","chapterId":4,"number":81,"page":92,"stem":"36세 남자가 오심, 발열, 권태감 및 복부 통증을 주호소로 입원하였다. 신체검진 시 황달\n이 있고 소변색이 진하며, 혈액검사에서 AST 480 IU/L이었다. 이 환자에게 의심되는 질\n환은?","choices":["크론병","바레트식도","위식도역류병","바이러스 간염","과민대장증후군"],"answer":4,"answerLabel":"④","answerPage":327,"explanation":"바이러스 간염의 흔한 임상적 특징은 오심, 식욕부진,\n발열, 권태감, 복부 통증 및 황달이다. 점토색 변이나 어두운\n색 소변 , 관절통이다. 진단검사에서 AST 가 정상 수치의 20\n배 이상 높게 나타난다."},{"id":"c04-q082","chapterId":4,"number":82,"page":93,"stem":"하복부 통증과 혈뇨를 호소하는 환자가 응급실에 왔다. 활력징후는 혈압 116/79 mmHg,\n호흡수 19회/분 맥브t 91 회/분, 체온 369C이었다. 이 환자에게 의심되는 상태는?","choices":["신장암","방광염","신우신염","사구체신염","복부나 방광 손상"],"answer":4,"answerLabel":"④","answerPage":327,"explanation":"하복부 통증과 혈뇨 시에는 방광 손상을 의심해야 한다.\n방광염, 사구체신염이나 신우신염의 경우 주로 발열을\n동반하나 현재 환자는 발열 증상이 없다. 신장암은 하복부\n통증을 유발하지 않으며 주로 옆구리 통증을 가진다."},{"id":"c04-q083","chapterId":4,"number":83,"page":93,"stem":"36세 남자가 자동차 사고로 인한 부상이 있어 응급실로 이송되었다. 사고 당시 안전벨트\n를 착용하고 있었으며, 현재 하복부 통증과 혈뇨가 있다. 방광 손상에 의한 통증인지 여\n부를 알기 위해 간호사가 연관통 유무를 확인해야 하는 신체부위는?","choices":["배꼽","어깨","견갑골","엉덩이","늑골척추각"],"answer":2,"answerLabel":"②","answerPage":327,"explanation":"방광 손상은 하복부 통증과 더불어 횡격막신경(phrenic\nnerve) 자극으로 인한 어깨로 방사되는 통증이 있을 수\n있다. 방광 손상으로 인한 통증은 배꼽주위나 견갑골, 엉덩이\n및 늑골척추각으로 방사되지 않는다."},{"id":"c04-q084","chapterId":4,"number":84,"page":93,"stem":"신규 입원 환자의 의무기록을 확인하던 중 신장 기능 이상이 있음을 알았다. 이 환자의\n진단검사에서 나타날 수 있는 결과는?","choices":["헤모글로빈 감소","크레아티닌(creatinine) 상승","적혈구 감소","백혈구 감소","BUN 감소"],"answer":2,"answerLabel":"②","answerPage":327,"explanation":"크레아티닌은 신기능을 확인하기 위해 자주 사용되는\n검사이다. 크레아티닌의 수치가 증가하면 적어도 신기능의\n50% 가 저하되었다는 의미이다. 감소된 헤모글로빈과 적혈구\n수치는 요로에 출혈이 있거나 신장에 의해 erythropoietic\nfunctionOI 손상되었을 때 나타날 수 있다. 증가된 WBC\n는 신기능 이상에서 자주 나타난다. BUN 도 신기능을\n확인하기 위해 자주 사용되는 검사로 BUN 상승은 신기능\n이상에서 흔히 나타난다."},{"id":"c04-q085","chapterId":4,"number":85,"page":93,"stem":"78세 남자가 피로하고 방광을 비우기 어렵다고 한다. 신체검진 상 방광이 확장된 것을 확\n인했지만 다른 이상 소견은 없었다. BUN 88 mg/dL (31.4 mmol/L), Creatinine 2.8 mg/\ndL (247.5 um이/L)이다. 이 환자에게 의심되는 질환은?","choices":["신우신염 (pyelonephritis)","콩팥전질소혈증(prerenal azotemia)","콩팥후질소혈증(postrenal azotemia)","급성요세관괴사(acute tubular necrosis)","급성 사구체신염 (acute glomerulonephritis)"],"answer":5,"answerLabel":"⑤","answerPage":327,"explanation":"콩팥후질소혈증은 소변의 흐름의 방해에 의해 발생한다.\nBUN 은 크레아티닌에 비해 눈에 띄게 증가하는 양상을\n보인다."},{"id":"c04-q086","chapterId":4,"number":86,"page":94,"stem":"68세 심부전 환자의 신체검진 시 S3와 양쪽 기저부 수포음(crackles)이 청진되었고, 활력\n징후는 BP 90/68 mmHg, HR 112회/분, BT 36.8℃이다. 혈액검사에서 BUN 58 mg/dL","choices":["신우신염 (pyelonephritis)","콩팥전질소혈증(prerenal azotemia)","콩팥후질소혈증(postrenal azotemia)","급성 요세관괴사(acute tubular necrosis)","급성 사구체신염(acute glomerulonephritis)"],"answer":2,"answerLabel":"②","answerPage":328,"explanation":"콩팥전질소혈증은 가장 흔한 급성 신부전의 원인이다.\n콩팥전질소혈증은 신장의 관류저하로 인해 발생하여 종종\n급성 요세관괴사로 이어진다. BUN 은 크레아티닌에 비해\n콩팥의 관류저하로 인해 더 눈에 띄게 증가하는 양상을\n보인다."},{"id":"c04-q087","chapterId":4,"number":87,"page":94,"stem":"왼쪽 신장비대가 의심되는 환자의 사정 시 확인 가능한 것은?","choices":["촉진 시 가장자리가 뚜렷하다.","단핵구증 외상, 백혈병, 림프종과 관련 있다.","촉진 시 절흔이 촉진된다.","타진 시 둔탁음이 들린다.","수신증의 병력이 있다."],"answer":5,"answerLabel":"⑤","answerPage":328,"explanation":"신장비대의 원인은 수신증, 낭종 종양 등이다. 양쪽\n신장비대가 있다면 다낭성 신장질환을 의심할 수 있다. 왼쪽\n옆구리에 덩어리가 있다면 비장비대 혹은 왼쪽 신장비대를\n의심할 수 있다. 좌측면에서 절흔이 촉진되고, 가장자리가\n중앙선까지 커져 있고, 탁음이 들린다면 비장비대를 의심한다."},{"id":"c04-q088","chapterId":4,"number":88,"page":94,"stem":"신부전의 위험이 있는 환자에게 소변량과 소변 양상을 확인한 다음 수행한 다른 사정 결\n과 중 신장의 기능을 간접적으로 확인할 수 있게 하는 것은?","choices":["혈압","의식수준","심첨맥박","복부 촉진","경정맥 확장"],"answer":1,"answerLabel":"①","answerPage":328,"explanation":"신장은 휴식기에도 심박출량의 20~25%를 받는匚卜.\n신장의 기능이 최적이라 함은 적절한 신장의 관류가\n필수적이다. 관류의 정도는 혈압에 의해 가장 잘 측정될 수\n있으며, 이는 심박출량을 간접적으로 반영한다. 맥박은\n심박출량에 의해 영향을 받지만 신장 기능과 관련 없는\n요인에 의해 변화가능하다. 경정맥 확장과 의식 변화는\n신장의 기능과 관련이 없다."},{"id":"c04-q089","chapterId":4,"number":89,"page":94,"stem":"66세 남자가 평소 종종 혈뇨가 있었으나 배뇨곤란은 없었다고 한다. 그러나 최근 혈뇨가\n자주 나타나며 배뇨곤란 및 빈뇨도 나타나 걱정스럽다고 한다 복부사정 결과, 위장관 기\n능에는 별다른 이상이 없었으며 촉진 시 덩어리가 만져지지 않았다. 이 환자에게 의심되\n는 질환은?","choices":["방광암","신우신염","사구체신염","급성 신부전","전립선비대증"],"answer":1,"answerLabel":"①","answerPage":328,"explanation":"방광암의 초기 증상은무통증 혈뇨이다. 혈뇨가 처음에는\n간헐적이다. 진행된 암의 징후와 증상으로는 배뇨장애를\n동반한 혈뇨 및 빈뇨가 포함된다. 방광암의 덩어리는 촉진되지\n않는다."},{"id":"c04-q090","chapterId":4,"number":90,"page":95,"stem":"55세 남자가 급성 신부전(ARF) 으로 입원하여 신체검진을 시행하려 한다. 이 환자의 활력\n징후를 측정하면서 볼 수 있을 것으로 예상되는 호흡양상은?","choices":["과호홉","무호흡","호흡수 감소","Cheyne-Stokes 호흡","쿠스마울호흠(Kussmaul's respirations)"],"answer":5,"answerLabel":"⑤","answerPage":328,"explanation":"ARF 의 임상적 특징은 대사성 산증의 결과이다. 간호사는\n쿠스마울호흡을 대사성 산증의 결과로 예상할 수 있는데\n대사성 산증 시에 몸에서는 보상기전으로 과도한 이산화탄소를\n호기한다."},{"id":"c04-q091","chapterId":4,"number":91,"page":95,"stem":"다음 중 골다공증과 관련된 정밀 신체검진이 필요한 대상자는?","choices":["36세 천식 남성","25세 매일 조깅하는 여성","55세 과도한 음주를 하는 남성","66세 흡연을 하는 좌식생활 여성","22세 PC방에서 매일 게임하는 남성"],"answer":4,"answerLabel":"④","answerPage":328,"explanation":"골다공증의 위험 요인은 여성, 폐경 후, 고령, 저칼슘\n섭취, 비타민D 부족, 과도한 알코올 섭취, 좌식생활, 흡연\n등이다. 장기간의 스테로이드, 항경련제 및 항이뇨제도\n위험요인이다."},{"id":"c04-q092","chapterId":4,"number":92,"page":95,"stem":"32세 여자의 신체검진 결과가 다음과 같을 때 의심되는 질환은?\n• 양쪽 손가락에 대칭적인 관절 기형: 부종(+), 피부가 빛이 나고 붉은 색을 보임, 통증 있음\n• 골융기 주변에 피부 결절(+): 촉진 시 통증 없음, 피하조직 움직임 가능\n• 통증 양상: 아침 기상 시 가장 심하고 활동을 시작하면 감소하는 양상","choices":["퇴행성 관절염","강직성 척추염","섬유근통증후군","류마티스 관절염","전신홍반루푸스"],"answer":4,"answerLabel":"④","answerPage":328,"explanation":"류마티스 관절염은 자가면역성 질환으로 양측 대칭적\n관절 기형의 임상적 특성을 가지고 있다. 관절통은 아침\n기상 시 가장 심하며 활동을 시작하면서 감소하는 양상을\n보인다. 관절은 붓고 빛이 나며 붉은색을 띈다. 골융기 주변\n피부에 결절을 가지고 있으며 이 결절은 촉진 시 통증이\n없으며 움직인다."},{"id":"c04-q093","chapterId":4,"number":93,"page":95,"stem":"다음 중 통풍 환자에서 나타날 수 있는 진단 검사 결과는?","choices":["Calcium 9.0 mg/dL","Uric acid 8.6 mg/dL","Potassium 4.1 mEq/L","Creatinine 1.2 mg/dL","Phosphorus 3.1 mg/dL"],"answer":2,"answerLabel":"②","answerPage":328,"explanation":"통풍 진단에 가장 핵심적인 임상 양상은 지속적인\n고요산혈증의 존재여부이다. 요산의 정상범위는 2.5〜8\nmg/dL이다."},{"id":"c04-q094","chapterId":4,"number":94,"page":96,"stem":"57세 당뇨병 환자가 당뇨병 합병증으로 인해 오른쪽 무릎아래절단수belovLknee amputation)\n을 시행하였다. 이 환자에게서 특히 주의해야 할 임상적 징후는?","choices":["출혈","절단부 부종","봉합선의 분리","절개부위 발적","건조한 절개부위 피부"],"answer":4,"answerLabel":"④","answerPage":328,"explanation":"당뇨병 환자는 상처 감염에 취약하고 상처 치유가 지연돠는\n경우가 많다. 수술 후 절단부 부종과 출혈은 절단술을 한 모든\n환자에게 나타날 수 있는 수술 후 합병증이다. 절개부위의\n발적은 감염의 징후가 될 수 있으나 피부가 건조하고 손상이\n없다면 정상이다."},{"id":"c04-q095","chapterId":4,"number":95,"page":96,"stem":"48세 남자가 칼로 찌르는 듯한 요통과 오른쪽 엉덩이에서 다리 뒤쪽으로 이어지는 통증\n이 있다고 호소하고 있다 이 환자의 통증을 악화시키는 상황을 파악하기 위해 시행할 수\n있는 것은?","choices":["침상안정 시키기","열요법 적용하기","구부리거나 물건 들어올리기","Ibuprofen (Motrin) 복용시키기","허리부위에 모래주머니 올리기"],"answer":3,"answerLabel":"③","answerPage":328,"explanation":"한 쪽 다리로 방사되는 요통은 추간판탈출증의 임상\n증상이다. 칼로 찌르는 듯한 통증은 침범 부위 근육의\n경련으로 발생한다. 이러한 통증은 구부리기, 물건\n들어올리기, 코풀기 및 기침하기 등 척추강 내에 압력을\n가하는 행위에 의해 악화된다."},{"id":"c04-q096","chapterId":4,"number":96,"page":96,"stem":"55세 남자가 건설현장에서 추락사고로 인해 왼쪽 대퇴 및 골반 골절을 입고 응급수술을\n하기 위해 대기하던 중 갑자기 호흡곤란을 호소하여 측정한 활력징후와 동맥혈가스분석\n결과가 다음과 같다. 다음 중 지방색전증(fat emb이sm)을 의심하게 하는 지표는?\n• 활력징후: BP 156/89 mmHg, RR 35 회/분, HR 123 회/분, BT 36.9℃\n• ABGA ： pH 7.35； PaCO2 43 mmHg； PaO2 58 mmHg； HCO「23 mEq/L","choices":["BP","pH","PaO,","hco3","PaCO2"],"answer":5,"answerLabel":"⑤","answerPage":328,"explanation":"지방색전증의 증상은 저산소증의 정도에 의해 결정된다.\nPaO 27F 60 mmHg 미만인 경우 저산소증을 의미한다.\n나머지 ABGA 결과는 정상 범위 안에 있다. 혈압이 높은\n것은 통증 등의 다양한 원인에 의해 발생할 수 있다."},{"id":"c04-q097","chapterId":4,"number":97,"page":96,"stem":"호만스징후(Homans’ sign) 양성이 의미하는 것은?","choices":["장음 소실","눈 감고 30초간 서 있지 못함","복부 촉진 시 반동압통 발생","발등굽힘 시 무릎 뒤 통증 발생","흡기 시 오른쪽 상복부 통증 발생"],"answer":4,"answerLabel":"④","answerPage":328,"explanation":"호만스징후는 발을 강제로 뒤쪽으로 굽히면 무릎 뒤쪽에서\n동통 혹은 불쾌감을 느끼는 것을 말하며 주로 비정맥 혈전증\n시 발견된다."},{"id":"c04-q098","chapterId":4,"number":98,"page":97,"stem":"56세 전업주부가 손목과 새끼손가락을 제외한 네 손가락이 아프고 저리다고 한다. 손목을\n굽히고 있으면 통증이 심해지며 심할 때는 손목에 땅콩만한 크기로 부어오르고 누르면 안\n으로 쑥 들어가기도 하고 다시 움직이면 튀어나오는 곳이 있다. 이런 증상은 어떤 신경이 압\n박을 받아 발생하는가?","choices":["상완신경 (bracheal nerve)","요골신경(radial nerve)","척골신경 (ulnar nerve)","액와신경(axillary nerve)","정중신경(median nerve)"],"answer":5,"answerLabel":"⑤","answerPage":328,"explanation":"손목에는 9개의 힘줄과 개의 신경이 통과하는 굴이\n있는데 이곳을 손목굴이라 하고, 이곳을 지나는 정중신경이\n눌리면 새끼손가락을 제외한 네 손가락이 아프고 저린 증상이\n나타나는데 , 이를 손목굴증후군이라 한다. 손목을 굽히고\n있으면 통증이 심하다. 손목을 반복적으로 사용하는 운전자,\n전업주부, 악기 연주자, 공장라인의 근로자, 컴퓨터 사용자,\n목수가 해당된다. 손바닥뼈가 깨지거나 넘어지면서\n손바닥으로 짚었을 때도 발생하며 드물게 진동하는 공구를\n사용해도 나타나기도 한다. 임산부, 통풍, 류마티스 관절염,\n갑상선기능저하증, 당뇨병 등이 있을 때 이런 증상이 올 수\n있다. 여자에게 더 많고 주로 자주 쓰는 손목이 해당된다.\n심할 때는 손목에 땅콩만한 크기로 부어오른다. 누르면\n안으로 쑥 들어가기도 하고 다시 움직이면 튀어나온다."},{"id":"c04-q099","chapterId":4,"number":99,"page":97,"stem":"다음 23세 여자의 신체검진 결과 중 전신홍반루푸스(systemic lupus erythematosus)#\n의심할 수 있는 임상적 특징은?","choices":["안구진탕","체중 증가","정상 이하 체온","적혈구 수의 증가","양쪽 뺨과 콧등에 나비 모양의 붉은 발진"],"answer":4,"answerLabel":"④","answerPage":328,"explanation":"전신 자가면역병의 대표적 병이다. 여성에게 압도적으로\n많고, 10~39세까지가 70%를 차지한다. 양쪽 뺨과 콧등에\n나비 모양의 붉은 발진은 초기 전신홍반루푸스의 전형적\n특징이다. 발열과 체중 감소, 심한 피로 등이 나타날 수\n있다. 빈혈은 진행된 SLE 에서 주로 나타난다."},{"id":"c04-q100","chapterId":4,"number":100,"page":97,"stem":"환자에게 선 자세에서 눈을 감고 양팔을 손바닥을 위로 하여 뻗은 상태로 20-30초간\n있게 하였더니 환자의 왼쪽 손이 돌아가고 약간 아래로 내려가는 것이 관찰되었다. 이 결\n과를 바르게 해석한 것은?","choices":["실조(ataxia)","안구진탕(nystagmus)","반사항진(hype门cflexia)","회내근 변이(pronator drift)","회외근 변이(supination drift)"],"answer":4,"answerLabel":"④","answerPage":328,"explanation":"회내근 변이는 대상자가 눈을 감은 상태에서 팔을\n펴고 손바닥을 위로 올린 자세를 유지하지 못한 상태에\n발생한다. 이 검사는 근력의 미묘한 변화를 감지하기 위해\n시행된다.\n정답및애설 I 328"}]},{"id":5,"part":"PART II","partTitle":"전문실무영역","title":"순환기계","count":200,"startPage":100,"endPage":162,"questions":[{"id":"c05-q001","chapterId":5,"number":1,"page":100,"stem":"표준 12유도 심전도검사에 관한 설명으로 옳은 것은?","choices":["심전도검사의 흉부유도는 4개이다.","심전도검사의 사지유도는 3개이다.","Augmented unipolar 유도는 3개이다.","심전도검사에서 bipolar 유도는 I, II, III. aVR, aVL, aVF 이다.","사지유도에서 II, III, aVF 의 ST 분절 상승은 심실중격부 심근경색증과 관련된다."],"answer":3,"answerLabel":"③","answerPage":329,"explanation":"사지유도는 I, II, III, aVR, aVL, aVF 이며, augmented\nbipolar lead로 I, II III가 있고, augmented unipolar\nlead로 aVR, aVL, aVF 가 있다. 흉부유도는 V1 〜6으로\n총 6개가 있다. II, III, aVF 는 하벽부 심근경색증과 관련된다."},{"id":"c05-q002","chapterId":5,"number":2,"page":100,"stem":"직장 건강검진을 위해 내원한 35세 남자가 이상지질혈증의 과거력이 있고, 하루에 1 갑 정\n도의 흡연과 주 1 회(한 번에 소주 한 병) 술을 마신다고 한다. 검진 결과에서 혈중 총 콜레\n스테롤이 310 mg/dL일 때 대상자에게 적절한 상담 내용은?","choices":["즉시 지질강하제를 복용해야 한다.","2년 후 추적검사를 시행하면 된다.","연령을 고려할 때 정상적인 콜레스테롤 수치를 보인다.","지질강하제를 복용하여 수치가 정상이 되면 투약을 중지해야 한다.","2차 검진으로 저밀도, 고밀도 콜레스테롤, 중성지방 수치를 검사해야 한다."],"answer":5,"answerLabel":"⑤","answerPage":329,"explanation":"총 콜레스테롤 수치가 높으므로 정확한 이상지질혈증의\n상태를 알기 위해 저밀도, 고밀도 콜레스테롤 및 중성지방에\n대한 평가가 필요하며 결과에 따라 투약을 어떤 약을 해야\n할지 결정한다. 지질강하제를 복용하여 부작용이 없다면\n지속적으로 복용해야 한다."},{"id":"c05-q003","chapterId":5,"number":3,"page":101,"stem":"50세 여자가 1 시간 전 걸어서 시장에 다녀오던 중 발생한 가슴 중앙에 찢어지는 듯한 통\n증이 30분간 지속되어 응급실에 왔다. 평소 당뇨병과 고혈압으로 약물을 복용 중이며 현\n재 혈압은 90/60 mmHg, 표준 12유도 심전도 결과는 다음과 같다. 이 환자의 상태에 대\n한 판단으로 옳은 것은?","choices":["심전도 상 완전방실차단이 있다.","즉시 혈전용해제의 투약을 시작한다.","심전도 상 심낭염이 의심된다.","심장박동수가 빠르므로 베타차단제를 투약한다.","ST 분절 상승 심근경색증으로 재개통술이 필요하다."],"answer":5,"answerLabel":"⑤","answerPage":329,"explanation":"심전도 상 하벽부와 측벽부의 ST 분절 상승이 보이는\n급성 심근경색증이며, lead II보다 lead III에서 ST 분절이\n더 많이 상승하여 우심실 심근경색증도 동반되어 오른쪽\n관상동맥의 중간부 이전부터 혈관의 폐쇄가 발생했을\n가능성이 높다. 최대한 빠른 시간 내에 아스피린과 P2Y12\ninhibitor (clopidogrel, ticagrelor)를 투약하고, 혈관재개\n통술을 시행해야 한다. 심근경색증에서 베타차단제를\n투약하는 것은 재개통술 시행하고, 환자의 혈역학적 상태가\n안정된 경우 최대한 저용량부터 시작하는 것이 원칙이며,\n현재 환자의 상태는 수축기 혈압이 90 mmHg이므로 투약은\n보류되어야 한다."},{"id":"c05-q004","chapterId":5,"number":4,"page":101,"stem":"평소 건강하던 55세 남자가 가슴두근거림으로 병원에 옷I다. 혈압 130/80 mmHg, 맥박수\n150회/분이었고, 내원 시 시행한 표준 12유도 심전도가 아래와 같을 때 심전도 판독 결과\n로 옳은 것은?","choices":["1 도 방실차단과 동성 빈맥","방실회귀성 심실상성 빈맥","QRS 간격이 좁은 심실빈맥","빠른 심장박동수를 보이는 심방세동","조기흥분 증후군이 동반된 심방세동"],"answer":4,"answerLabel":"④","answerPage":329,"explanation":"빠른 심장박동수를 보이는 심방세동(atrial fibrillation\nwith rapid ventric니ar response)으로 QRS 간격이 좁으며\nRR 간격은 불규칙하므로 심방세동이며, 심장박동수가\n분당 150회로 빠르다."},{"id":"c05-q005","chapterId":5,"number":5,"page":102,"stem":"허혈 성 심장질환에서 혈관재개통술로 경 피 관상동맥중재술이나 관상동맥우회 술을 시행\n하게 된다. 경피 관상동맥중재술에서 관상동맥우회술보다 더 적게 발생하는 합병증은?","choices":["뇌졸중(stroke)","スH시술(revascularization)","허혈증상(ischemic symptom)","심장 관련 사망(cardiac death)","심근경색증(myocardial infarction)"],"answer":1,"answerLabel":"①","answerPage":329,"explanation":"관상동맥중재술은 관상동맥 우회술과 비교하였을 때\nmajor adverse cardiac event, repeat revascul\narization은 더 많이 발생하고, all cause death, cardiova\nscular death는 통계적으로 유의한 차이는 없으며, stroke\n은 관상동맥우회술보다 더 적게 발생하는 것으로 알려져\n있다."},{"id":"c05-q006","chapterId":5,"number":6,"page":102,"stem":"1 개월 전 전벽부 급성 심근경색증으로 좌전하행지 근위부(proxim계 left anterior descending\nartery)에 스텐트 삽입술을 시행한 환자는 퇴원 이후 약을 복용하지 않았고, 외래도 방문\n하지 않았다. 내원 당일 30분 전부터 갑작스러운 흉통 및 의식소실이 있어 내원하였고,\n심전도 상 V1~V4 유도에서 ST 분절의 상승이 보였으며, 혈압은 90/60 mmHg이었다. 이\n환자의 상태에 대한 설명으로 옳은 것은?","choices":["스텐트 내 재협착이 의심된다.","응급 심폐소생술이 필요한 상황이다","응급으로 관상동맥조영술을 시행해야 한다.","Fundaparinux는 factor II inhibitor로서 헤파린과 같이 사용하면 안 된다.","1 개월 전 일반 금속 스텐트를 삽입한 경우에는 아스피린 단독으로 치료할 수 있다."],"answer":3,"answerLabel":"③","answerPage":329,"explanation":"1 개월 전 스텐트를 삽입한 환자가 약물을 복용하지 않았고,\n갑작스런 흉통이 발생하였으므로 스텐트 혈전증이 의심되는\n상황이므로 , 응급 관상동맥조영술을 시행하여 재개통술이\n요구된다. 일반 금속 스턴！트도 항혈소판제 병합요법을 시행해야\n한다. Fundaparinux는 factor Xa inhibitor로, 재관류\n시에는 streptokinase와 같이 사용하여 하며 시술 중 항응고\n요법으로 단독사용하면 안 된다."},{"id":"c05-q007","chapterId":5,"number":7,"page":102,"stem":"다음 중 관상동맥 CT 혈관조영술(coronary CT angiography)이 적용 가능한 경우는?","choices":["관상동맥 이외의 심장수술에서 수술하기 전","무증상이며 관상동맥질환의 위험도가 저위험도인 환자","2.0 mm 크기의 관상동맥 내 스텐트의 개통여부를 보기 위한 경우","이전 운동부하 심전도검사 결과 duke treadmill score가 고도 위험군일 경우","허혈성 흉통이 의심되는 비급성 흉통 환자에서 심전도 결과가 해석 가능하고 운동 이 가능한 환자 중 검사 전 예측도가 고위험군인 경우"],"answer":1,"answerLabel":"①","answerPage":329,"explanation":"[Clinical indication of coronary CT angiographgy]\n• 알려진 심장질환이 없는 증상이 있는 환자에서의 관상동맥질환의\n평가\n• 무증상 환자에게서 관상동맥 질환의 위험도 평가\n• 다른 심장질환에서 관상동맥의 평가\n• 다른 검사결과를확인한 이후의평가\n• 재개통술 이후의 관상동맥의 평가\n• 심장의구조및기능의평가\n• 심장내외의구조물평가\n- 운동부하검사에서 저위험군인 경우에는 약물치료 우선\n- 운동부하검사에서 고위험군인 경우에는 관상동맥조영술 우선\n- 운동부하검사에서 중등도 위험의 경우에는 부하영상검사 또는\nCT coronary angiography# 권고"},{"id":"c05-q008","chapterId":5,"number":8,"page":102,"stem":"고혈압으로 치료받던 75세 남자가 건강검진을 위해 시행한 CT 검사 결과가 다음과 같을\n때 의심되는 상태는?","choices":["대동맥류","대동맥박리","장골동맥류","대동맥협착","신장동맥협착"],"answer":1,"answerLabel":"①","answerPage":329,"explanation":"요추 앞쪽으로 풍선처럼 확장된 대동맥류가 보인다."},{"id":"c05-q009","chapterId":5,"number":9,"page":103,"stem":"32세 여자가 5일간 지속되는 다리의 부종과 통증을 주호소로 외래를 방문하였다. 신체검\n진에서는 왼쪽 다리의 발열감과 불편감 발적이 관찰되었다. 이 환자에게 추가적인 건강\n력을 조사하기 위한 내용으로 옳지 않은 것은?","choices":["심방세동의 과거력","최근 비행기 탑승 여부","최근의 수술이나 손상 여부","장기간 서있는 직업의 여부","피임약을 포함한 약물의 복용상태"],"answer":1,"answerLabel":"①","answerPage":329,"explanation":"젊은 여성에서의 하지의 부종과 불편감을 호소하는 경우,\n하지 정맥의 심부정맥 혈전증을 고려해야 하며, 건강력\n수집에서 심방세동의 과거력은 중요하지 않다. 심방세동의\n과거력은 동맥의 혈전색전증과 관련이 더 높다."},{"id":"c05-q010","chapterId":5,"number":10,"page":103,"stem":"3일 전에 대퇴골 골절로 정형외과 병동에 입원 중인 75세 여자가 갑작스런 흉통과 호흡\n곤란을 호소한다. 심전도와 흉부 방사선검사에서 특별한 이상은 보이지 않았고 혈청\nproBNP는 100 pm이/!_이다. 흉부 CT 결과가 아래와 같을 때 의심되는 상태는?","choices":["긴장 기흉","변이 협심증","폐동맥 색전증","흉부 대동맥박리","스트레스 유발성 심근병증 ch叩ter 5 순환기계 | 1.03"],"answer":3,"answerLabel":"③","answerPage":329,"explanation":"정형외과 입원 중이며 대퇴골의 손상으로 움직임의\n장애가 있을 것으로 생각되는 환자에게서 갑작스런 호흡곤란과\n흉통이 발생했을 경우, 꼭 폐동맥 색전증을 생각해야 한다.\nCT 에서 양측 폐동맥에 걸쳐있는 혈전증을 관찰할 수 있다."},{"id":"c05-q011","chapterId":5,"number":11,"page":104,"stem":"35세 여자가 3개월 전부터 발생한 가슴두근거림으로 방문하였고, 심전도가 다음과 같을\n때 적절한 중재는?","choices":["증상이 있으므로 전기적 제세동을 시행한다.","체중감소를 확인하고, 갑상선기능검사를 시행한다.","임상적으로 의미가 없는 소견이므로 외래 추적관찰 한다.","발작 심실상성 빈맥이므로 아데노신의 정주가 필요하다.","심장의 불규칙한 박동이 있으므로 뇌혈관질환을 예방하기 위해 항응고제를 투약한다"],"answer":2,"answerLabel":"②","answerPage":329,"explanation":"젊은 여성에서 발생한 가슴 두근거림으로, 심전도 상\nfrequent VPC (심실조기박동)을 보인다. 구조적인 심장질환이\n있는지 확인하기 위해 심장초음파검사, 얼마나 많이\n발생하는지, 다른 치명적인 부정맥이 생기는지 홀터\n심전도검사 및 운동부하 심전도검사를 시행해야 하며 , 갑상선\n기능항진증을 확인하기 위해서 체중감소와 갑상선기능검 사를\n시행한다."},{"id":"c05-q012","chapterId":5,"number":12,"page":104,"stem":"75세 남자가 소변량 감소 및 호흡곤란으로 중환자실로 옮겨왔다. 심전도 결과가 다음과\n같을 때 적절한 중재는?","choices":["저혈압이 발생한 경우 전기적 제세동을 실시한다.","전해질 이상을 확인하기 위해 혈액검사를 시행한다.","과거에 심근경색증이 있었는지 확인한다","폐색전증을 확인하기 위해 흉부조영증강 CT 를 시행한다.","심낭 삼출을 확인하기 위해 흉부방사선 촬영과 심장초음파를 실시한다."],"answer":2,"answerLabel":"②","answerPage":329,"explanation":"심전도 상 Tall and Peaked T wave를 보이고, 소변량\n감소가 있으므로, 급성 신부전과 관련한 hyperk에emia를\n확인해야 한다."},{"id":"c05-q013","chapterId":5,"number":13,"page":105,"stem":"55세 남자가 폐렴으로 호흡기내과 입원 중 심전도가 다음과 같이 변하여 중환자실로 옮\n겨왔다. 이 환자에게 적절한 중재는?","choices":["복부의 급성 통증 여부를 확인한다.","Amiodarone과 같은 항부정맥제의 사용 여부를 확인한다.","혈액검사를 시행하여 고칼륨혈증 고칼슘혈증을 확인한다.","폐렴 치료를 위해서 사용하였던 기관지확장제를 확인한다.","폐동맥 색전증이 의심되므로 d-dimer검사를 시행한다."],"answer":2,"answerLabel":"②","answerPage":329,"explanation":"심전도에서 QT 간격이 늘어난 long QT syndrome\n이 의심되며, T 파의 역위가 흉부유도에서 관찰된다.\nAcquired long QT syndrome의 원인은 다음과 같다.\n• 전해질의 이상: 저칼륨혈증, 저마그네슘혈증, 저칼슘혈증\n• 항부정맥제: class IA, III (amiodarone)\n• Phenothiazine 계통의 항정신병 약제\n• 항생제: amphicillin, erythrhomycin 등\n• 뇌출혈\n• 심장근육질환: 허혈성 심장질환, 심근염 등\n• 심한서맥"},{"id":"c05-q014","chapterId":5,"number":14,"page":105,"stem":"호흡곤란을 주호소로 중환자실로 입원한 65세 남자에게 시행한 흉부 방사선촬영 결과가\n다음과 같았다. 이 환자가 이전에 받은 수술 또는 시술은?","choices":["관상동맥우회술","삽입형 제세동기 삽입","영구형 심장박동기 삽입","심장 재동기화 치료","대동맥 인공판막치환술"],"answer":2,"answerLabel":"②","answerPage":330,"explanation":"삽입형 제세동기 (implantable cardiover-defibrillator)\n를 삽입한 환자의 흉부 방사선촬영 사진이다."},{"id":"c05-q015","chapterId":5,"number":15,"page":106,"stem":"다음 ST 분절 상승 급성 심근경색증 환자의 심전도 변화를 시간 순서대로 옳게 나열한 것은?","choices":["가, 나, 다, 라","나, 다, 가, 라","다, 나, 가, 라","라, 다, 나, 가","다, 라, 나, 가"],"answer":3,"answerLabel":"③","answerPage":330,"explanation":"ST 분절 상승 심근경색증의 심전도 변화는 ST 분절\n상승, Q 파 및 ST 분절의 상승, Q 파 및 T 파의 역위, T 파의\n역위 순서로 진행한다."},{"id":"c05-q016","chapterId":5,"number":16,"page":106,"stem":"그림/자료 문항입니다. 원문 PDF p.106를 함께 확인하세요.","choices":["심방조동","2 도 방실차단","3 도 방실차단","조기흥분증후군","발작 심실상성 빈맥"],"answer":3,"answerLabel":"③","answerPage":330,"explanation":"서맥과 심방-심실 해리(AV dissociation)의 소견을\n보이는 완전방실차단(3 도 방실차단의 소견이다."},{"id":"c05-q017","chapterId":5,"number":17,"page":107,"stem":"급성 관동맥증후군으로 내원한 환자가 1 시간 이내에 관상동맥조영술을 시행하려고 대기\n중이다. 다음 환자의 혈액검사 결과 중 반드시 주의해야 할 것은?","choices":["PT INR 1.2","Troponin 0.2 ng/mL","Serum Sodium 140 mEq/L","Serum Potassium 4.9 mEq/L","Serum Creatinine 2.5 mg/dL"],"answer":5,"answerLabel":"⑤","answerPage":330,"explanation":"①번부터 ④번까지의 검사결과는 정상범위이나 serum\ncreatinine은 정상범위가 아니다. 관상동맥조영술 시에는\n조영제를 사용하므로 신장기능을 평가하는 것이 매우\n중요하다."},{"id":"c05-q018","chapterId":5,"number":18,"page":107,"stem":"관상동맥조영술 후 중환자실로 입실한 환자의 시술 결과 판독이 다음과 같다. 이 환자의\n상태에 대한 설명으로 옳은 것은?\n[Report of coronary angiography and intervention]\n• vascular access: right femoral vein\n• target lesion: mid LAD and mid RCA\n• mid LAD 80% tubular luminal narrowing: dilated with a 2.5 mm sized balloon and 3.0\nmm sized drug eluting stent was deployed\n• mid RCA 90% diffuse luminal narrowing: dilated with a 3.0 mm sized balloon and 3.5\nmm sized drug eluting stent was deployed\n• fin기 diagnosis: unstable angina","choices":["치료한 병변은 좌회선지이다.","최종 진단명은 불안정 협심증이다.","단일 항혈소판제 요법을 12개월 시행한다.","이중 항혈소판제 치료를 할 경우 3개월이 추천된다.","오른쪽 요골동맥을 통해서 관상동맥중재술을 시행하였다."],"answer":2,"answerLabel":"②","answerPage":330,"explanation":"대퇴동맥을 통해 시술을 했으며, 좌전하행지와\n우관상동맥 중간부에 약물방출 스텐트를 삽입하였다. 최종\n진단명은 불안정 협심증이며, 중재술을 시행하였으므로 6\n개월 이상 항혈소판제 병합요법을 시행해야 한다."},{"id":"c05-q019","chapterId":5,"number":19,"page":107,"stem":"심부전 환자에게 B-type natriuretic peptide을 검사하려고 한다. 이 검사에 대한 설명으\n로 옳은 것은?","choices":["신장기능의 영향을 받지 않는다","심부전의 확진에 사용하는 검사이다.","심실의 용적 혹은 벽 스트레스가 상승된 것을 반영하는 수치이다.","수축기 심부전에서는 증가하지만 이완기 심부전에서는 증가하지 않는다.","민감도가 낮아서 호흡곤란 환자에서 심부전 진단을 배제하는 데 사용하기 어렵다."],"answer":3,"answerLabel":"③","answerPage":330,"explanation":"이는 신장기능의 영향을 받으며, 심부전의 확진검사는\n아니다. 심실의 용적 혹은 벽 스트레스가 상승된 것을\n반영하는 수치이고 모든 심부전에서 다 증가하는 검사법이다.\n이는 호흡곤란 환자를 진단하는 데 매우 유용한 검사이다."},{"id":"c05-q020","chapterId":5,"number":20,"page":108,"stem":"심부전의 병태생리에 대한 설명으로 옳은 것은?","choices":["심부전의 발생에 D-dimer가 일정 작용을 한다.","심장의 수축기능 장애가 이완기능 장애보다 2배 더 흔하다.","심부전 환자에서 레닌-안지오텐신 시스템의 항진은 심장 근육의 섬유화와 관련이 있다","심부전 환자에게 혈중 도파민 수치는 상당히 증가되어 있어 교감신경계가 관여함을 의미한다","심부전의 경우 magnesium channel과 phosphate pump와 관련된 유전자의 결함 이 있어 심근수축과 이완기능에 장애가 생긴다."],"answer":3,"answerLabel":"③","answerPage":330,"explanation":"D-dimer는 혈전과 관련된 검사법이다. 심장수축기능\n장애와 이완기능 장애는 동일한 비율로 발생하며, 심부전\n환자에서는 혈중 노르에피네프린 등과 같은 교감신경활성과\n관련된 수치가 상승한다. 심부전의 경우 c 긔cium chann이\n과 c 기cium pump와 관련된 유전자의 결함이 있어\n심근수축과 이완기능에 장애가 생긴다."},{"id":"c05-q021","chapterId":5,"number":21,"page":108,"stem":"74세 여자가 3일 전부터 호흡곤란과 부종이 심해져 내원하였다. 10년 전부터 고혈압으로\n경구 투약 중이고, 신체검진 상 S3 심음이 청진되었고, 심초음파에서 좌심실 박출률은\n60%, 흉부 방사선검사는 다음과 같다. 환자의 질환과 관련된 설명으로 옳은 것은?","choices":["전체 심부전의 50% 정도로 비교적 흔하다.","폐울혈은 관계가 없으므로 이뇨제는 효과가 없다.","재입원율은 좌심실 박출률이 감소된 심부전보다 흔하다.","고령, 고혈압에서 흔하며, 남자가 여자보다 더 흔하다","안지오텐신전환효소억제제 , 안지오텐신수용체차단제 , 베타차단제는 생존율을 향상 시킨다."],"answer":1,"answerLabel":"①","answerPage":330,"explanation":"좌심실 박출률이 정상인 심부전으로 heart failure\nwith preserved EF 로 진단을 할 수 있으며, 고령, 고혈압,\n여성, 당뇨, 비만한 경우에 흔하다. 좌심실 박출률이 감소된\n심부전에서 생존율의 향상이 증명된 AC티, ARB, beta\n이oker 등은 생존율 향상을 증명하지 못했으며 , 전체\n심부전의 반수를 차지하고, 재입원율은 좌심실 박출률이\n감소된 심부전과 동일한 것으로 알려져 있다."},{"id":"c05-q022","chapterId":5,"number":22,"page":108,"stem":"3일 전부터 심해진 호흡곤란으로 내원한 환자가 활력징후는 혈압 80/65 mmHg, 심장박\n동수 115회座, 호흡수 30회/분이다. 목정맥이 팽대되어 있고, 피부는 축축하며 양쪽 다\n리 부종이 2+ 정도이며 청진 시 폐야 전체의 수포음과 수축기 심잡음이 들리고 심장 초\n음파검사에서 좌심실 박출률은 35% 이다. 다음 중 이 환자에게 감소한 혈역학적 수치는?","choices":["중심정맥압","심박출계수","말초혈관저항","좌심실확장기압","폐모세혈관쐐기압"],"answer":2,"answerLabel":"②","answerPage":330,"explanation":"좌심실 부전에 의한 심장성 쇼크 환자로, 심박출계수는\n감소하며 , 중심정맥압, 폐모세혈관쐐기 압, 말초혈관저항,\n좌심실 확장기압은 증가한다."},{"id":"c05-q023","chapterId":5,"number":23,"page":109,"stem":"4일 전부터 심해진 호흡곤란으로 내원한 환자가 혈압 80/65 mmHg, 심장박동수 115회/분,\n호흡수 30회/분이다. 집중관찰실로 옮겨진 상태로 환자의 모니터는 다음과 같다. 모니터\n를 통해 다음과 같은 상태가 관찰될 때 환자에게 적용된 중재는?","choices":["혈액투석","하대정맥 필터","대동맥 풍선펌프","관상동맥중재술","일시형 심장박동기"],"answer":3,"answerLabel":"③","answerPage":330,"explanation":"심장성 쇼크 환자에게 시행한 대동마4 풍선 펌프의\n모니터링 사진으로 이완기에 대동맥 풍선펌프로 인한 압력의\n변화가 관찰된다."},{"id":"c05-q024","chapterId":5,"number":24,"page":109,"stem":"흉통을 주소로 내원한 환자의 심전도에서 심근허혈이 의심되어 관상동맥조영술을 시행하\n였으나 의미 있는 관상동맥이 발견되지 않았다. 관상동맥조영술 중에 시행한 좌심실조영\n술 결과(left ventric니ography)フト 다음과 같을 때 이 환자에게 의심되는 상태는?","choices":["폐동맥색전증","변이 협심증","확장성 심근병증","대동맥판막협착증","심첨부 비후성 심근병증"],"answer":5,"answerLabel":"⑤","answerPage":330,"explanation":"좌심실 조영술에서 spade 모양의 좌심실 조영의\n결과로 비후성 심근병증심첨부형)으로 진단할 수 있다. 이때\n심전도는 좌심실 비대와 심한 T 파의 역위가 관찰될 수 있다."},{"id":"c05-q025","chapterId":5,"number":25,"page":110,"stem":"심근허혈 상태에서 시간경과에 따른 심장의 병태생리적 변화 순서로 옳은 것은?","choices":["이완기능장애 - 수죽기능장애 一 심전도 변화 -* 흉통","수죽기능장애 -•■심전도 변화 一 융통 一 이완기능장애","심전도 변화 一 이완기능장애 一 수축기능장애 一 흉통","흉통 一 이완기능장애 一 수죽기능장애 一 심전도 변화","심전도 변화 一 흉통 一 이완기능장애 一 수축기능 장애"],"answer":1,"answerLabel":"①","answerPage":330,"explanation":"심근허혈 발생 시 시간에 따라 이완기능장애, 수축기능장애 ,\n심전도 변화, 흉통의 순서로 나타난다."},{"id":"c05-q026","chapterId":5,"number":26,"page":110,"stem":"계단을 오를 때 흉통이 발생하는 환자에게 처방된 운동부하검사(Treadmill test)에 대한\n설명으로 옳은 것은?","choices":["심방세동이 있는 경우에도 양성 예측률에는 변화가 없다.","운동 중 산소소모량을 측정하여 최대운동량을 측정한다","운동이 가능해도 dobutamine stress echocardiography 또는 관상동맥 CT 를 시행 할 수 있다.","운동부하검사 시 운동중 수축기 혈압이 10 mmHg 이상 증가한다면 불량한 예후를 시사한다.","심전도 상 완전좌각차단의 소견이 보이면 운동부하 심전도검사보다 약물 유발 핵의 학검사가 선호된다."],"answer":5,"answerLabel":"⑤","answerPage":330,"explanation":"운동부하검사로는 ST 분절의 상승이 관찰되지 않는 한\n허혈 손상부위를 알 수 없다. 스트레스 영상검사를 고려해야\n하는 경우로는 환자가 운동을 할 수 없는 경우, 운동부하\n심전도검사에서 해석이 힘든 경우좌각차단 심장박동기 , 조기흥분\n증후군, 안정시 1 mm 이상의 ST 분절의 변화가 있는 경우), 이전에\n관상동맥중재술을 받은 경우, 이전 검사에서 허혈성 심장질환의\n가능성이 높은 경우 등이 있다."},{"id":"c05-q027","chapterId":5,"number":27,"page":110,"stem":"허혈성 심질환에서 심초음파의 유용성에 대한 설명으로 옳은 것은?","choices":["협착 또는 폐색된 관상동맥부위를 예측하는 데는 유용하지 않다","도부타민 심초음파는 심근의 생존여부 판단에 유용하다.","경식도 심초음파를 시행하면 심근의 벽운동장애를 자세히 볼 수 있다.","심초음파가 정상이면 관상동맥질환의 가능성을 배제할 수 있다.","국소벽 운동 이상으로 과거 발생한 심근경색증과 급성 심근경색증을 감별할 수 있다"],"answer":2,"answerLabel":"②","answerPage":330,"explanation":"국소벽 운동장애의 소견으로 심근경색증의 시기를\n예측할 수 없으며 , 관상동맥질환의 존재를 배제하기 위해서는\n심장초음파뿐만 아니라 스트레스검사 및 다른 진단적 방법이\n필요하다."},{"id":"c05-q028","chapterId":5,"number":28,"page":110,"stem":"1 시간 전부터 발생한 흉통으로 응급 관상동맥조영술을 시행한 환자의 검사 결과가 다음\n과 같을 때 병변이 있는 관상동맥은?","choices":["좌주간부","좌전하행지","좌회선동맥","우관상동맥","심실중격분지"],"answer":2,"answerLabel":"②","answerPage":330,"explanation":"조영술에서 좌전하행지의 근위부에 완전폐쇄 소견을\n보이는 심근경색증으로 의심된다."},{"id":"c05-q029","chapterId":5,"number":29,"page":111,"stem":"흉통과 호흡곤란으로 응급실에 온 환자의 심전도에서 V2-V4 에서 ST 분절 상승과 T 파 역위\n가 관찰되어 혈전용해요법이 시작되었다 다음 중 재관류 되었음을 의미하는 지표는?","choices":["CK 의 감소, 통증의 감소","짧은 심실빈맥, 통증의 감소","통증의 감소, proBNP 수치의 감소","Troponin의 감소, proBNP 수치의 감소","심전도에서 ST 분절 하강의 발생, 짧은 심실빈맥"],"answer":1,"answerLabel":"①","answerPage":330,"explanation":"성공적인 재관류를 시사하는 소견으로 통증의 감소,\nST 분절 상승의 감소, CK 또는 Troponin의 감소 등이\n있다."},{"id":"c05-q030","chapterId":5,"number":30,"page":111,"stem":"다음과 같은 CT 관상동맥조영술에 대한 설명으로 옳은 것은?","choices":["Slice thickness는 보통 3mm로 설정하여 검사한다.","16 채널검사로 관상동맥의 협착을 평가할 수 있다.","관상동맥의 석회화가 있는 경우에도 쉽게 병변의 심한 정도를 평가할 수 있다.","관상동맥우회술 시행 후 흉통이 있는 환자에게 이식혈관을 평가하기 위해 시행할 수 있다.","좌전하행지에서 다른 관상동맥보다 심한 운동성으로 인해서 검사가 적절하지 않은 경우가 흔하다."],"answer":4,"answerLabel":"④","answerPage":330,"explanation":"Slice thickness는 보통 1 mm 이하로 세팅한다.\n관상동맥 협착은 최소 65채널 이상이 되어야 검사가\n가능하다. 관상동맥 석회화가 심한 경우에는 검사가 제대로\n시행되지 않는다. 우관상동맥은 심한 운동성으로 적절하지\n않은 경우가 흔하다."},{"id":"c05-q031","chapterId":5,"number":31,"page":111,"stem":"우관상동맥 협착 소견으로 관상동맥중재술 치료를 받고 집중치료실로 이송된 환자가 갑\n자기 심한 흉통을 호소하고 서맥과 혈압 감소를 보인다. 이 환자에게 가장 우선적으로 시\n행해야 할 검사는?","choices":["심근효소","12유도 심전도","맥박산소 측정","흉부방사선촬영","동맥혈 산소포화도"],"answer":2,"answerLabel":"②","answerPage":330,"explanation":"관상동맥조영술과 관상동맥중재술을 시행한 환자가\n갑자기 심한 흉통을 호소한 후 심장박동수가 느려지고 혈압이\n감소하였으므로 이전에 시행한 오른쪽 관상동맥 스텐트의\n급성 합병증인 스텐트 혈전증이 생겼거나 관상동맥의 박리\n등의 여러 가지 문제로 인해 합병증이 생겼을 가능성이\n높으므로 즉시 심전도검사를 시행하여 ST 분절의 상승이\n있는지, 서맥의 원인으로 부정맥이 발생하였는지 등을\n확인해야 한다."},{"id":"c05-q032","chapterId":5,"number":32,"page":112,"stem":"다음 중 불안정 협심증에서 나타나는 흉통의 특징은?","choices":["가슴 아픈 것이 물을 마시면 나아진다.","가슴을 칼로 찌르는 듯한 통증이 30초 정도 지속된다","자세의 변화에 따라 가슴이 타는 듯한 증상이 변화한다.","가만히 있어도 가슴이 아픈 통증이 20분 이상 지속된다","계단을 올라가면 5분정도 가슴이 아프다가 쉬면 나아진다."],"answer":4,"answerLabel":"④","answerPage":330,"explanation":"불안정 협심증은 다음중 최소한 한가지 이상의 특징을 나타내야\n한다. 첫째, 안정시 또는 미약한 활동에도 흉통이 있으며\n니트로글리세린을 투여하지 않으면 20분 이상 증상이 지속된다.\n둘째, CCSC 기능분류 III 이상의 흉통이 최근 1 개월 이내에 새로\n생긴 경우, 섯J째, 증상이 점점 심해지는 경우(흉통이 유발되는 활동\n정도나 강도, 지속시간, 빈도가 이전에 비해 심해질 때)"},{"id":"c05-q033","chapterId":5,"number":33,"page":112,"stem":"안정 협심증과 불안정 협심증의 감별에 가장 중요한 것은?","choices":["흉통 양상의 차이","ST 분절의 편향 정도","관상동맥조영술에서의 협착 정도","심장초음파에서의 국소 벽운동 장애","관상동맥 CT 에서 석회화 정도의 차이"],"answer":1,"answerLabel":"①","answerPage":330,"explanation":"안정과 불안정 협심증은 구분은 진단검사보다는 증상의\n특징으로 구분한다."},{"id":"c05-q034","chapterId":5,"number":34,"page":112,"stem":"대퇴관절의 무혈성괴사로 입원 중인 환자가 1 시간 전부터 발생한 흉통과 호흡곤란을 호\n소하던 중 30분 전부터 갑자기 증상이 악화되면서 의식이 혼미해졌다. 혈압은 80/50\nmmHg. 박동수는 125회/분이다. 이 환자에게 의심되는 상태가 아닌 것은?","choices":["긴장 기흉","대동맥박리","복부대동맥류","폐동맥 색전증","급성 심근경색증"],"answer":3,"answerLabel":"③","answerPage":331,"explanation":"치명적인 흉통의 원인이 되는 질병상태를 구분하는\n것이 필요하며 급성 심근경색증, 급성 대동맥박리, 급성\n폐색전증, 긴장 기흉, 식도파열, 심장압전을 동반한 심낭염\n등의 가능성을 고려해야 한다."},{"id":"c05-q035","chapterId":5,"number":35,"page":112,"stem":"9개월 전 불안정 협심증 치료를 위해 스텐트삽입술을 받은 환자가 흉통이 있어 내원하였\n다. 내원 당시 혈압 80/50 mmHg, 심장박동수 70회ほ, NT-proBNP는 1,500 pmol/L,\n심근효소수치는 정상이다. 심전도 상 V4-6의 ST 분절 하강이 있고 심장초음파에서 좌심\n실 박출률은 50% 이며, 침상내 심전도 모니터에서 비지속성 심실빈맥이 보인다. 이 환자\n에게 조기에 관상동맥조영술을 시행해야 하는 이유는?","choices":["NT —proBNP의 상승","수축기 혈압의 감소","비지속성 심실빈맥의 발생","9개월 전 스텐트 삽입","좌심실 박출률 50%"],"answer":2,"answerLabel":"②","answerPage":331,"explanation":"급성관동맥증후군 중 치료를 받고 있음에도 불구하고\n안정시 흉통이 재발하고 Troponin의 상승, 새롭게 나타난\nST 분절 하강, 심부전 증상, EF 〈40%, sustained VT,\nPCK6months, CABG 기왕력, 혈역학적 불안정상태,\n신기능장애 등이 있을 때 조기에 관상동맥 재관류가 필요하다."},{"id":"c05-q036","chapterId":5,"number":36,"page":113,"stem":"3일 전에 복부대동맥류로 스텐트 시술(endovascular aneurysm repair； EVAR) 을 받고\n집중치료실에 입원 중인 환자가 오전부터 오른쪽 슬와동맥과 발등동맥이 촉진되지 않고,\n오른쪽 발이 차고 창백해졌다. 이 환자에게 가장 의심되는 상태는?","choices":["스텐트의 이동","스텐트에서 혈액누출(endoleak) 발생","가성동맥류의 발생","동정맥기형","혈전에 의한 스텐트 폐색"],"answer":5,"answerLabel":"⑤","answerPage":331,"explanation":"Stent graft limb thrombosis로 인한 것으로 생각되며,\n시술 30일 이내에 약 6.4%에서 발생한다고 알려져 있다."},{"id":"c05-q037","chapterId":5,"number":37,"page":113,"stem":"2시간 전부터 시작된 극심한 흉통이 있어 내원한 환자가 혈압 220/120 mmHg, 심장박동\n수 120회/분이다 환자는 2년 전부터 혈압이 높다고 들었으나 병원에 다니지 않았다고 한\n匚ヒ 흉골 하연에서 심잡음이 청진되고 흉부 방사선검사 상 종격동이 확장되어 있다. 이 환\n자에게 적절한 중재는?","choices":["폐동맥 색전증의 동반 여부를 확인해야 한다.","혈심낭이 발생하면 즉시 심낭천자를 시행하고 최대한 배액시킨다.","하행 대동맥만을 침범했다 하더라도 통증이 지속될 경우 수술을 고려할 수 있다.","경흉부 초음파는 상행 하행 흉부 대동맥, 대동맥궁의 박리의 진단에 민감도와 특 이도가 높다.","Nitroprusside나 labetalol을 사용하지 못할 경우 verapamil이나 carverdilol과 같 은 칼슘통로차단제를 사용할 수 있다."],"answer":3,"answerLabel":"③","answerPage":331,"explanation":"대동맥박리가 의심되는 상태이다. 심낭천자술을 시행할\n경우 사망률이 증가할 수 있으며, 즉각적인 수술이 원칙이나\n혈압이 낮을 경우 혈압을 올리기 위한 최소한의 배액만\n시행한다. 경흉부 초음파는 대동맥궁의 박리의 진단에는\n민감도와 특이도가 낮다."},{"id":"c05-q038","chapterId":5,"number":38,"page":113,"stem":"급성 심근경색증으로 입원치료 중인 환자가 입원 io일째에 전흉부 통증을 호소한다.\nNitroglycerin® 투여해도 통증이 흡기 시에 심해진다. 심전도검사에서 새롭게 발견된 변\n화는 없으며 심근효소 수치도 정상범위 내에 있다 심장초음파에서 소량의 심낭삼출이 관\n찰되고 혈압은 정상이며 청진 시 특별한 이상은 없다. 이 환자에게 의심되는 상태와 관련\n된 설명으로 옳은 것은?","choices":["주로 후벽부의 심근경색증에서 흔하다.","증상이 심할 경우 스테로이드를 고용량으로 쓰면 호전이 빠르다.","동맥경화증의 급성 악화를 막기 위해 저용량의 아스피린을 투약한다.","흉막삼출이 동반될 수 있으며 ESR 상승과 백혈구 증가가 나타날 수 있다.","심장초음파를 시행하여 심근경색증의 합병증인 심실중격천공을 평가해야 한다."],"answer":4,"answerLabel":"④","answerPage":331,"explanation":"심근경색증 후의 dressier syndrome에 대한\n증례이며, glucocorticoids와 NSAIDs는 사용하지 않는\n것이 좋다. 심근경색증 4주 이내에 투여할 경우 경색 부위의\n회복을 방해하며, 심근의 파열, 관상동맥 저항의 증가를\n초래할 수 있다."},{"id":"c05-q039","chapterId":5,"number":39,"page":114,"stem":"급성 심근경색증으로 우관상동맥 스텐트삽입술 치료를 받은 후 집중치료실에서 경과를\n관찰 중인 환자의 심전도가 다음과 같이 변했을 때 판단으로 옳은 것은?","choices":["심근경색증 환자에게 가장 많이 발생하는 부정맥이다.","혈역학적으로 불안정한 경우에는 아트로핀을 정주한다.","전벽부 심근경색증에서 하벽부 심근경색증보다 흔하다.","심실빈맥으로의 진행을 막기 위해 리도카인을 정주한다.","스텐트 혈전증이 의심되므로 조영술을 다시 시행해야 한다."],"answer":2,"answerLabel":"②","answerPage":331,"explanation":"심근경색증 후 발생한 accelerated idioventricular\nrhythm에 대한 것으로서 치료는 대개 지켜보는 것으로\n해결이 되지만 혈역학적으로 불안정하거나 재발하는 흉통이\n있을 경우에는 atropine, atrial pacing으로 sinus rate\n를 높여서 치료할 수 있다. 그리고 심근경색증 환자에게서\n가장 많이 발생하는 부정맥은 심실 조기박동(ventric니ar\npremature complex)이다."},{"id":"c05-q040","chapterId":5,"number":40,"page":114,"stem":"급성 심근경색증으로 좌전하행지의 근위부에 스텐트삽입술을 받은 환자가 좌심실 박출\n률이 25%이고, 집중치료실에 입원 1 일째와 3일째에 심실세동이 발생하여 제세동 후 회복\n되었다. 이 환자에게 가장 적절한 중재는?","choices":["경과 관찰","심장이식","리도카인 정주","메토프로롤 정주","삽입형 제세동기의 삽입"],"answer":5,"answerLabel":"⑤","answerPage":331,"explanation":"심근경색증 48시간 이후에 발생한 sustained VT\n또는 VT 의 경우에는 퇴원 전에 ICD를 삽입해야 한다."},{"id":"c05-q041","chapterId":5,"number":41,"page":114,"stem":"7일 전 관상동맥중재술 후 입원 중인 환자가 서혜부의 통증을 호소하며 신체검진 시 서혜\n부에서 혈관잡음이 청진된다 진단을 위해 시행한 복부-골반 CT 가 다음과 같을 때 의심되\n는 상태는?","choices":["동정맥루","정맥혈전","가성동맥류","후복막 혈종","급성하지허혈"],"answer":3,"answerLabel":"③","answerPage":331,"explanation":"오른쪽 대퇴동맥에 시술 후 발생한 3 cm 크기의\n가성동맥류가 있다."},{"id":"c05-q042","chapterId":5,"number":42,"page":115,"stem":"간헐적인 흉통으로 외래를 방문한 환자가 관상동맥조영술에서 좌회선지 근위부의 90%\n가량의 협착이 발견되어 스텐트를 삽입하였다. 이 환자에게 스텐트삽입술을 시행한 목\n적은?","choices":["증상의 완화","사망률의 감소","향후 심근경색증 발생의 예방","향후 발생 가능한 심부전의 예방","향후 발생 가능한 급성 심장사의 예방"],"answer":1,"answerLabel":"①","answerPage":331,"explanation":"만성 안정 협심증에서의 중재시술의 적응증은 협심증\n증상의 완화이다."},{"id":"c05-q043","chapterId":5,"number":43,"page":115,"stem":"다음은 관상동맥중재술에 사용되는 스텐트에 대한 설명으로 옳은 것은?","choices":["약물방출스텐트에 사용되는 약물은 methotrexate이다.","일반금속스텐트의 합병증은 혈전증과 재협착이다.","약물방출스텐트는 악성종양의 발생 위험이 있다.","일반금속스텐트는 단일 항혈소판요법, 약물방출스텐트는 이중 항혈소판 요법을 시 행한다.","약물방출스텐트는 일반 금속스텐트에 비해 재협착률이 감소했다."],"answer":5,"answerLabel":"⑤","answerPage":331,"explanation":"일반 금속스텐트의 심각한 재협착 문제로 1 세대\n약물방출스텐트가 개발되었다. 그러나 재협착은 감소시켰으나\n스텐트 혈전증의 발생이 증가하여 사망률의 개선을 보이지\n못했고, 이후 2세대 약물방출스텐트는 여러 개선된 시스템을\n사용함으로써 스텐트 혈전증의 위험을 줄이고 있匚卜 스텐트는\n이중 항혈소판제제를 사용해야 한다."},{"id":"c05-q044","chapterId":5,"number":44,"page":115,"stem":"5년 전부터 정기적으로 항고혈압제를 복용 중인 환자가 1 년 전부터 등산할 때 발생하는\n흉통으로 외래를 방문했다. 외래에서 시행한 심전도와 흉부 방사선검사에서 특별한 이상\n이 발견되지 않았을 때 시행해야 할 추가검사는?","choices":["심장 MRI","심근관류스캔","홀터심전도검사","관상동맥조영술","운동부하 심전도검사"],"answer":4,"answerLabel":"④","answerPage":331,"explanation":"타인의 안전을 책임지고 있는 항공기 조종사, 소방관,\n경찰관등의 직업을 가진 자로, 허혈성 심장질환을 의심할\n만한 증상이 있거나 비침습적 검사 결과가 양성이거나 결과가\n의심스러운 경우에는 관상동맥조영술을 시행해야 한다."},{"id":"c05-q045","chapterId":5,"number":45,"page":116,"stem":"이 환자에게 가장 의심되는 상태는?","choices":["안정 협심증","불안정 협심증","전벽부 급성 심근경색증","하벽부 급성 심근경색증","비ST 분절 상승 심근경색증"],"passage":"다음 지문을 읽고 질문에 답叶시오문제 45-47).\n1 시간 전부터 지속되는 흉통으로 내원한 환자가 흉통이 가슴 중앙에서 목과 왼팔\n로 퍼진다고 한다. 내원 시 혈압은 75/55 mmHg, 심장박동수는 135 회/분, 호흡수\n는 30회/분, 체온은 36.2℃이다. 흉부 방사선검사에서 이상소견은 없었고 심전도\n는 다음과 같다.","answer":4,"answerLabel":"④","answerPage":331,"explanation":"심전도 상 II, III, aVF 에서 ST 분절 상승을 보이는\n하벽부 심근경색증우벽경색 동반이 다."},{"id":"c05-q046","chapterId":5,"number":46,"page":116,"stem":"이 환자에게 즉시 시행되어야 할 중재는?","choices":["충분한 수액을 즉각 공급한다.","심낭압전을 감별하기 위해 즉시 심장초음파를 시행한다.","변이 협심증을 감별하기 위해 니트로글리세린 설하정을 투약한다.","우선 통증 완화와 심근경색증의 악화를 막기 위해서 모르핀을 투여한다.","초기 및 후기 생존율을 증가시키기 위해 베타차단제를 조기에 사용한다"],"passage":"다음 지문을 읽고 질문에 답叶시오문제 45-47).\n1 시간 전부터 지속되는 흉통으로 내원한 환자가 흉통이 가슴 중앙에서 목과 왼팔\n로 퍼진다고 한다. 내원 시 혈압은 75/55 mmHg, 심장박동수는 135 회/분, 호흡수\n는 30회/분, 체온은 36.2℃이다. 흉부 방사선검사에서 이상소견은 없었고 심전도\n는 다음과 같다.","answer":1,"answerLabel":"①","answerPage":331,"explanation":"하벽부 심근경색증에서 심인성 쇼크의 상태이므로\n즉각적으로 resuscitation을 위해서 수액 공급을 해야\n한다."},{"id":"c05-q047","chapterId":5,"number":47,"page":116,"stem":"이 환자의 진단과 치료에 대한 설명으로 옳은 것은?","choices":["항혈소판제와 항응고제의 병합요법이 필요하다.","재관류가 필요하나 응급상황은 아닌 것으로 판단된다","서맥 또는 방실차단 같은 부정맥의 발생에도 유의해야 한다.","혈압이 낮으므로 대동맥 파열을 감별하기 위해 CT 를 시행한다","재관류의 목적은 생존 개선과 같은 예후개선보다는 증상 호전이 주목적이다."],"passage":"다음 지문을 읽고 질문에 답叶시오문제 45-47).\n1 시간 전부터 지속되는 흉통으로 내원한 환자가 흉통이 가슴 중앙에서 목과 왼팔\n로 퍼진다고 한다. 내원 시 혈압은 75/55 mmHg, 심장박동수는 135 회/분, 호흡수\n는 30회/분, 체온은 36.2℃이다. 흉부 방사선검사에서 이상소견은 없었고 심전도\n는 다음과 같다.","answer":3,"answerLabel":"③","answerPage":331,"explanation":"하벽부 심근경색증의 심인성 쇼크 상태이므로 재관류를\n시행해야 하며 , 응급상황이다. 심근경색증으로 생존개선이\n최우선목표이다. 이중 항혈소판제 병합요법을 시행해야\n하며, 서맥, 방실차단, 심실빈맥과 같은 부정맥의 발생에\n유의해야 한다."},{"id":"c05-q048","chapterId":5,"number":48,"page":117,"stem":"이 환자에게 가장 의심되는 상태와 그에 따른 가장 적절한 검사는?","choices":["기흉, 흉부 CT","폐동맥색전증, 조영증강 흉부 CT","급성 심근경색증 관상동맥조영술","대동맥박리, 조영증강 대동맥 CT","변이 협심증, 에르고노빈 유발검사"],"passage":"다음 지문을 읽고 질문에 답サ시오문제 48-49).\n4개월 전부터 새벽에 일어날 때 5 분간 지속되는 가슴통증과 어지럼증, 식은땀을 동반하는 증상\n이 있는 환자가 외래를 방문하였다. 술을 마신 다음날 깰 때 증상은 더 심하고 니트로글리세린 설\n하정을 투여하면 증상이 없어진다고 한다. 과거력이나 가족력은 없고 담배는 원래 피지 않는다\n고 한다. 외래에서 시행한 심전도. 흉부 방사선검사 및 혈액검사에서도 이상은 발견되지 않았다.","answer":5,"answerLabel":"⑤","answerPage":331,"explanation":"여러 가지 질문에 관련된 소견으로 변이 협심증을 진단할\n수 있으며 , 진단은 조영술을 통한 경련연축) 유발검사로\n약물로는 에르고노빈 , 아세틸콜린을 사용한다."},{"id":"c05-q049","chapterId":5,"number":49,"page":117,"stem":"이 환자의 치료에 대한 설명으로 옳은 것은?","choices":["흡연보다는 금주가 우선시된다.","혈관확장을 위해 아세틸콜린을 투약한다.","칼슘통로 차단제보다는 베타차단제가 선호된다.","조영술에서 협착 소견이 있다면 재관류를 고려할 수 있다.","최대한의 약물치료에도 지속되는 심실빈맥이 있을 경우 심장박동기를 고려한다."],"passage":"다음 지문을 읽고 질문에 답サ시오문제 48-49).\n4개월 전부터 새벽에 일어날 때 5 분간 지속되는 가슴통증과 어지럼증, 식은땀을 동반하는 증상\n이 있는 환자가 외래를 방문하였다. 술을 마신 다음날 깰 때 증상은 더 심하고 니트로글리세린 설\n하정을 투여하면 증상이 없어진다고 한다. 과거력이나 가족력은 없고 담배는 원래 피지 않는다\n고 한다. 외래에서 시행한 심전도. 흉부 방사선검사 및 혈액검사에서도 이상은 발견되지 않았다.","answer":4,"answerLabel":"④","answerPage":331,"explanation":"흡연이 금주보다 더 중요하며, 혈관확장을 위해 아세틸\n콜린을 사용하지는 않는다 . 베타차단제보다 칼슘통로차단제가\n더 선호되며 치료에 반응하지 않는 경우 심실빈맥이 있으면\nICD를 삽입한다."},{"id":"c05-q050","chapterId":5,"number":50,"page":117,"stem":"심근관류스캔 영상이 다음과 같을 때 협착이나 폐쇄가 의심되는 관상동맥은?\nI (、「)\nStressヤ ヤ\no 〇\narrows = ischemia","choices":["좌주간부","좌회선지","좌전하행지","좌흉골동맥","우흉골동맥"],"answer":2,"answerLabel":"②","answerPage":331,"explanation":"우관상동맥 또는 좌회선지 영역의 지배를 받는\n심근부위이다."},{"id":"c05-q051","chapterId":5,"number":51,"page":118,"stem":"다음의 관상동맥 CT 혈관조영술과 관상동맥조영술 결과에서 협착이나 폐색이 의심되는\n화살표로 표시된 관상동맥은?","choices":["좌주간부","중격분지","좌회선지","우관상동맥","좌전하행지"],"answer":5,"answerLabel":"⑤","answerPage":331,"explanation":"좌전하행지의 근위부에 협착의 소견이 보인다."},{"id":"c05-q052","chapterId":5,"number":52,"page":118,"stem":"좌심실 이완기능(left ventricular diastolic function)을 평가하기 위한 E/A ratio에 대한 설명\n으로 옳지 않은 것은?","choices":["정상 E/A ratio는 0.75〜 1.5이다.","E 와 A는 diastolic filling velocity# 의미한다.","LV relaxation 손상 후 초기에 E/A ratio가 증가한다.","E/A ratio가 정상이고 decelerating time이 증가하면 정상이다.","E/A ratio가 증가하고 decelerating time이 감소하면 심실이완기능은 회복될 수 없다."],"answer":3,"answerLabel":"③","answerPage":331,"explanation":"LV r이axation 손상 후 초フI에 E/A ratioフト 감소한다."},{"id":"c05-q053","chapterId":5,"number":53,"page":119,"stem":"심근경색 부위 심근의 생존능(viability)을 평가하기 위해 가장 적절한 검사는?","choices":["2-D echocardiography with Doppler","Stress echocardiography (low dose dobutamine)","Coronary angiography","coronary CT angiography","PET"],"answer":2,"answerLabel":"②","answerPage":331,"explanation":"Stress echocardiography (low dose dobutamine)\n로 약물부하 전후의 심근운동성 변화를 확인한다."},{"id":"c05-q054","chapterId":5,"number":54,"page":119,"stem":"다음 경흉부 초음파검사 영상에 대한 설명으로 옳은 것은?","choices":["검사 중 transducer는 apex에 있다.","papillary muscle을 관찰할 수 있다.","“가”는 anterial wall을 의미한다.","검사 중 transducer는 sternum 위에 있다","apical 2 chamber view이 匸卜"],"answer":2,"answerLabel":"②","answerPage":331,"explanation":"A는 parasternal long axis view이며 papillary\nmus이e을 확인할 수 있다."},{"id":"c05-q055","chapterId":5,"number":55,"page":120,"stem":"이 심전도의 판독결과로 옳은 것은?","choices":["QT 연장증후군","비후성심근병증","부루가다증후군","조기흥분증후군","후벽부 심근경색증"],"passage":"다음 지문을 읽고 질문에 답하시오(문제 55-56).\n다음은 반복되는 의식소실과 심실부정맥이 발생하는 환자의 중환자실에서 시행한\n안정 시 12유도 심전도이다.\nr*ー-P-fし•―『しー「/ーfしー「しー广-fし-fしー丫、彳ー，し-「\nレハ샤ハ〜4俨시ハ〜レjいへレしギヘいへレ77ノ","answer":3,"answerLabel":"③","answerPage":331,"explanation":"V1 에서 교회첨탑모양의 비정상적인 ST 분절의 상승을\n보이고 , 반복되는 의식소실과 심실부정맥을 경험하였으므로\n부루가다증후군이 가장 합당하다."},{"id":"c05-q056","chapterId":5,"number":56,"page":120,"stem":"이 환자의 상태에 대한 설명으로 옳은 것은?","choices":["발열, 수면 중에 특징적인 심전도를 볼 수 있다","Flecainide# 복용하면 심실부정맥을 예방할 수 있다.","전기생리검사를 통한 도자절제술을 통해서 생존율을 높일 수 있다.","심장 MRI 를 시용하여 우심실의 특징적인 fatty degeneration의 소견을 볼 수 있다.","도자절제술이 실패할 경우 삽입형 제세동기를 삽입하여 돌연심장사를 예방해야 한다"],"passage":"다음 지문을 읽고 질문에 답하시오(문제 55-56).\n다음은 반복되는 의식소실과 심실부정맥이 발생하는 환자의 중환자실에서 시행한\n안정 시 12유도 심전도이다.\nr*ー-P-fし•―『しー「/ーfしー「しー广-fし-fしー丫、彳ー，し-「\nレハ샤ハ〜4俨시ハ〜レjいへレしギヘいへレ77ノ","answer":1,"answerLabel":"①","answerPage":331,"explanation":"부루가다증후군에서 실신 또는 심실부정맥이 있다면\n삽입형 제세동기를 삽입해야 한다."},{"id":"c05-q057","chapterId":5,"number":57,"page":120,"stem":"일하던 중 갑자기 의식을 잃고 쓰러진 상태로 응급실에 도착한 환자가 심실세동이 확인되\n어 즉시 제세동이 시행된 후 집중치료실로 이송되었다 이 환자에게 가장 의심되는 것은?","choices":["QT 연장증후군","부루가다증후군","비후성 심근병증","급성관동맥증후군","발작 심실상성 빈맥"],"answer":4,"answerLabel":"④","answerPage":331,"explanation":"심장돌연사의 원인의 80%는 관상동맥의 동맥경화증이다."},{"id":"c05-q058","chapterId":5,"number":58,"page":120,"stem":"다음은 일주일 전부터 시작된 두근거림과 호흡곤란으로 응급실에 온 환자의 심전도 결과\n이다. 이 환자의 상태와 관련된 설명으로 옳은 것은?","choices":["즉시 심실제세동을 시행해야 한다.","치료가 필요한 부정맥 중 가장 흔하다.","심방 내에서 큰 회귀회로를 가지고 있다.","심전도 진단은 발작 심실상성 빈맥이다.","급성관동맥증후군과의 관련성을 알기 위해 관상동맥조영술을 시행한다."],"answer":3,"answerLabel":"③","answerPage":331,"explanation":"심장박동수가 빠른특징적인 saw tooth pattern이 관찰도는\n심방조동의 심전도이다. 가장 흔한 부정맥은 심방세동이다.\n심방조동은 특징적으로 심방 내에서 macroreentry를 가지고\n있다. 심방세동과 비슷하고 혈전생성의 위험이 높아 위험도를\n평가한 후에 항응고요법을 시행해야 한다."},{"id":"c05-q059","chapterId":5,"number":59,"page":121,"stem":"급성 폐부종으로 집중치료실로 입실한 환자가 혈압 90/60 mmHg, 호흡수 30회/분이다.\n수축기 심잡음이 청진되고 경동맥 박동은 bouncing 양상이다. 흉부 방사선검사에서 심\n비대와 폐울혈이 관찰되고 심전도 상 동성서맥, 좌심실비대, 완전좌각차단을 보인다. 이\n환자에게 가장 의심되는 상태는?","choices":["대동맥판막 협착","승모판막 폐쇄부전","대동맥판막 폐쇄부전","심낭삼출로 인한 심장압전","폐동맥 고혈압이 동반된 삼첨판막 폐쇄부전"],"answer":3,"answerLabel":"③","answerPage":332,"explanation":"Aortic regurgitation의 경우에 경동맥의 박동성이\n느려지고 수축기 심잡음이 to and fro murmur의 양상으로\n들리며, 저혈압의 소견을 보이며 심전도에서 상기의 결과를\n보이는 경우가 흔하다."},{"id":"c05-q060","chapterId":5,"number":60,"page":121,"stem":"대퇴전치환술을 시행 받은 환자가 혈압 80/68 mmHg, 심장박동수 126회/분, PCWP 5\nmmHg일 때 가장 적절한 중재는?","choices":["수혈","아트로핀 정주","바소프레신 정주","생리식염수 250 mL 정주(bolus)","도파민 10 microg/Kg/min으로 투여"],"answer":1,"answerLabel":"①","answerPage":332,"explanation":"저혈압과 낮은 PCWP 는 volume replacementフト\n요구되는 상황이며, 수술과 관련한 출혈은 PCWP 의 급격한\n감소를 초래하므로 수혈이 적절하다. 생리식염수는\n일시적으로 체내 수분을 공급하는 효과는 있지만 수 시간\n이내에 extravascular bed로 빠지기 때문에 일시적인\n효과만 있을 뿐이다. 체내 volume의 상태가 교정되기\n전까지 도파민 또는 바소프레신과 같은 혈관수축제는\n사용하지 않는다."},{"id":"c05-q061","chapterId":5,"number":61,"page":121,"stem":"급성관동맥증후군으로 입원 중인 환자가 비강캐뉼라를 통해 산소 2 L/분이 공급되고\nunfractionated heparinOI 지속 정맥주입 중이다. 심전도는 II, III, aVF 에서 T 파의 역위만\n관찰되어 응급실에 도착했을 때와 변화는 없다. 10분 전부터 상복부의 통증을 호소하고,\n점점 심해진다고 할 때 가장 적절한 중재는?","choices":["복부 CT","비위관 삽입","혈청 troponin검사","12유도 심전도검사","복부 방사선검사"],"answer":4,"answerLabel":"④","answerPage":332,"explanation":"심전도에서 T 파의 역위가 있고 급성 관동맥증후군으로\n헤파린 투약 중이므로 하벽부의 문제가 있을 가능성이 높아\n보이는 환자로, 하벽부 경색의 경우에는 복부 통증으로\n증상이 발현되는 경우가 흔하므로 즉시 하벽부 심근경색증의\n여부를 판별하기 위해서 심전도검사를 시행해야 한다."},{"id":"c05-q062","chapterId":5,"number":62,"page":122,"stem":"3년 전 영구 박동조율기를 삽입한 환자의 심전도 결과가 다음과 같을 때 박동조율기의 형\n태와 심전도에 대한 설명으로 옳은 것은?","choices":["complete capture, VVI pacemaker","complete capture, AAI pacemaker","complete capture, DDD pacemaker","incomplete capture, VVI pacemaker","incomplete capture, DDD pacemaker"],"answer":3,"answerLabel":"③","answerPage":332,"explanation":"P파 위치와 QRS 시작지점에 심장박동기의 전기자극이\n모두 잘 들어가는 것으로 확인되어 DDD type pacemaker\n이며, complete capture라고 할 수 있다."},{"id":"c05-q063","chapterId":5,"number":63,"page":122,"stem":"10년 전 당뇨병, 고혈압, 이상지질혈증을 진단받고 aspirin, hydrochlorothia기de, simvastatin,\ngliclazide, metformin을 복용 중인 환자의 혈압이 145/88 mmHg이다. 이 환자에게 적절\n한 중재는?","choices":["안지오텐신전환효소억제제 처방","가정에서 1 주일 동안 혈압 측정 후 재방문하도록 함","현재 복용약물이 정확한지 재확인","알파차단제를 추가 처방","이뇨제를 추가 처방"],"answer":1,"answerLabel":"①","answerPage":332,"explanation":"당뇨병을 동반하고 있으므로 혈압강하제를 처방한다."},{"id":"c05-q064","chapterId":5,"number":64,"page":122,"stem":"지난 2달 동안 가정에서 측정한 혈압이 1452155/92~96 mmHg인 환자가 외래를 방문\n했다. 심전도는 정상이고 creatinine 수치는 정상범위 내에 있다. 흉부 청진 상 이상소견\n은 없고 최대박동점은 쇄골중간선과 4번째 늑간이 만나는 지점에서 촉지된다 이 환자에\n게 가장 적절한 중재는?","choices":["atenol이로 약물치료를 시작한다.","nifedipine으로 약물치료를 시작한다","hydrochlorothiazide로 약물치료를 시작한다.","methyldopa로 약물치료를 시작한다.","지속적으로 혈압을 모니터해서 목표장기의 손상이 의심될 때 약물치료를 시작한다."],"answer":3,"answerLabel":"③","answerPage":332,"explanation":"합병증이 발생하지 않은 초기 고혈압 환자의 경우 1 차\n치료로 thiazide 계 이뇨제를 처방한다."},{"id":"c05-q065","chapterId":5,"number":65,"page":123,"stem":"신동맥협착이 의심되는 환자에게 투여 시 주의가 필요한 항고혈압제는?","choices":["안지 오텐신전환효소억 제 제","이뇨제","칼슘통로차단제","베타차단제","알파차단제"],"answer":1,"answerLabel":"①","answerPage":332,"explanation":"안지오텐신전환효소억제제는 신동맥 협착이 있는\n환자에게 투여했을 때 급격한 신손상을 초래할 수 있다."},{"id":"c05-q066","chapterId":5,"number":66,"page":123,"stem":"당뇨병으로 io년째 경구 혈당강하제를 복용 중인 환자가 최근 2단계 고혈압 진단을 받았\n다. 혈청 creatinine 1.6 mg/dL, 일반 소변검사에서 미세알부민뇨가 나타났다. 이 환자에\n게 우선적으로 처방해야 할 항고혈압제는?","choices":["안지오텐신전환 효소억제제","이뇨제","칼슘통로차단제","베타차단제","알파차단제"],"answer":1,"answerLabel":"①","answerPage":332,"explanation":"고혈압은 당뇨병 합병증망막증이나 신질환을 발생시키거나\n악화시킬 수 있다. 안지오텐신전환효소억제제는 혈압을\n낮출 뿐만 아니라 당뇨병에 의한 신질환 발생을 지연시키는\n데 도움이 된다."},{"id":"c05-q067","chapterId":5,"number":67,"page":123,"stem":"한 달 전 편두통으로 약물 복용 중인 환자가 2단계 고혈압을 진단받았다 외래에서 시행\n한 심전도에서 Mobitz I 방실차단이 발견되었을 때 편두통 약물 중 중단해야 하는 것은?","choices":["Angiotensin receptor blockers","Beta-blockers","Alpha-blockers","Calcium channel blockers","Angiotensin-converting enzyme inhibitor"],"answer":2,"answerLabel":"②","answerPage":332,"explanation":"베타차단제와 디곡신, 칼슘통로차단제는 방실차단을\n유발할 수 있다. 베타차단제는 편두통 예방을 위해 흔히\n복용되는 약물이지만 방실차단이 있는 환자라면 복용해서는\n안된다."},{"id":"c05-q068","chapterId":5,"number":68,"page":123,"stem":"다음 항고혈압제 중 두통, 홍조, 빈맥, 말초부종의 부작용이 있는 약물은?","choices":["Beta blockers","Calcium channel blockers","ACE inhibitors","Diuretics","Angiotensin receptor blocker"],"answer":5,"answerLabel":"⑤","answerPage":332,"explanation":"두통, 홍조, 빈맥, 말초부종은 칼슘통로차단제와관련된\n부작용이다. 칼슘통로차단제는 세포막의 칼슘유입 통로수용체를\n차단하여 다른 부위에서 순환에 영향을 미친다. verapamil\n이나 diltiazem은 동성 심장박동수를 감소시키고,\ndihydropyridine 은 강력한 말초혈관확장을 일으켜 두통이나\n안면홍조, 빈맥을 초래한다. 또한 칼슘통로차단제에 의한\n말초부종은 reflex postcapillary constriction 에 의한\n모세혈관정수압의 증가와 관련이 있다. 증가된\n모세 혈관정수압은 혈관내체액을 말초조직으로 이동시켜 체중\n증가 없이 말초부종이 발생한다."},{"id":"c05-q069","chapterId":5,"number":69,"page":123,"stem":"다음 중 항고혈압제로 처방된 알파차단제의 영향을 받는 상태는?","choices":["울혈성 심부전","양성 전립선비대증","잦은 편두통","협심증","요실금"],"answer":2,"answerLabel":"②","answerPage":332,"explanation":"양성전립선비대증이 있는 경우 항고혈압제로 알파차단제를\n처방할 수 있다. 이 때 처방된 알파차단제는 혈압을 낮추면서\n전립선비대증에 의한 증상을 개선한다."},{"id":"c05-q070","chapterId":5,"number":70,"page":124,"stem":"고혈압 치료를 위해 처방된 captopril을 복용 중 마른 기침이 심하고 식욕부진과 발진이\n있을 때 대체 가능한 약물은?","choices":["이뇨제","베타차단제","알파차단제","안지오텐신수용체차단제","칼슘통로차단제"],"answer":5,"answerLabel":"⑤","answerPage":332,"explanation":"기침, 식욕부진,발진은 모든 안지오텐신전환효소 억제제의\n부작용이다 . 다른 안지오텐 신전 환효소 제를 사용해도 부작용이\n있다면 약물을 중단하면 부작용은 사라진다. 이뇨제는\n전해질불균형 , 피로, 약물에 따라서는 발진과 발기부전이\n있을 수 있다. 베타차단제는 기관지경련 , 중성지방수치 상승,\n중추신경계 장애를 유발하기도 한다. 칼슘통로차단제는\n혈관확장에 의한 두통, 홍조, 두근거림, 발목부종을 초래할\n수 있다."},{"id":"c05-q071","chapterId":5,"number":71,"page":124,"stem":"고혈압과 협심증으로 약물 복용 중인 환자가 녹내장 수술 후 병실에서 관찰 중 흉통을 호\n소하며 혈압 220/110 mmHg, 맥박수 110회席 호흡수 22회/분이다 이 환자의 혈압을 낮\n추기 위해 가장 우선적으로 투여할 약물은?","choices":["Sodium nitroprusside (Nipride)","Diazoxide (Proglycen)","Labetolol (Normodine, Trandate)","Nicardipine (Cardene)","Nitrate (Nitroglycerin)"],"answer":3,"answerLabel":"③","answerPage":332,"explanation":"Labet이이은 알파수용체와 베타수용체를 모두 차단하여\n고혈압 위기나 빈맥, 협심증이 있는 환자에게 혈압을 낮추는\n데 가장 효과적인 약물이다. Nitroprusside (Nipride)는\n전부하를 감소시켜 빈맥을 초래할 수 있으며 이 때문에\n심근허혈을 악화시킨다. 시though diazoxide (Pro이ycen)\n가 혈관을 확장시켜 혈압을 낮추지만 반사성 교감신경반응을\n일으켜서 허혈성 심질환이 있는 환자의 협심증, 허혈,\n심부전을 악화시키기 때문에 절대로 사용해서는 안 된다.\nNicardipine (Cardene)은 칼슘통로차단제로 빈맥을\n일으켜서 협심증 증상이 심해지게 한다."},{"id":"c05-q072","chapterId":5,"number":72,"page":124,"stem":"두근거림과 호흡곤란을 호소하는 환자가 활력징후는 혈압 110/70 mmHg, 심장박동수 150\n회/분(규칙적), 호흡수 22회/분이다. 다음과 같은 심전도가 모니터에서 관찰될 때 일차적\n으로 사용해야 할 약물은?","choices":["atropine, isoproterenol","diltiazem, adenosine","digitalis, pronestyle","carvedilol, metoprolol","amiodarone, lidocain"],"answer":2,"answerLabel":"②","answerPage":332,"explanation":"Atri기 tachycardia이며 심장박동수 조절을 위해\n칼슘통로차단제와 아데노신을 일차적으로 고려한다 ."},{"id":"c05-q073","chapterId":5,"number":73,"page":125,"stem":"그림/자료 문항입니다. 원문 PDF p.125를 함께 확인하세요.","choices":["경동맥마사지를 실시한다.","verapamil을 정맥주사 한다.","digoxin을 정맥주사 한다.","esmolol을 정맥주사 한다.","특별한 치료 없이 원인을 조사한다."],"answer":5,"answerLabel":"⑤","answerPage":332,"explanation":"Sinus tachycardia 이므로 원인을 찾는 것이\n우선적으로 필요하다."},{"id":"c05-q074","chapterId":5,"number":74,"page":125,"stem":"준중환자실에 입원치료 중인 환자의 심전도 모니터에서 서맥 알람이 울리고 동시에 자동\n측정된 혈압은 110/60 mmHg이며, 환자는 수면 중이다. 이 환자에게 적절한 중재는?","choices":["환자를 깨워서 혈압을 재측정하여 비교한다.","수면상태로 지속적으로 모니터한다","atropine 0.5 mg을 정맥주사 한다.","비강캐뉼라를 통해 산소 2 L/분을 공급한다.","심근효소검사를 시행한다."],"answer":2,"answerLabel":"②","answerPage":332,"explanation":"이 환자의 심전도는 1 도 방실차단으로 측정된 혈압은\n문제되지 않으므로 다른 중재는 필요하지 않다. 서맥은\n건강한 사람에게도 수면 중에 나타날 수 있다. 자동측정된\n수축기압이 90 mmHg 미만일 때 환자를 깨워서 서맥에\n의한 증상유무를 확인해야 한다. 환자가 저혈압이거나\n의식변화와 같은 관류저하의 증상이 있다면 atropine을\n주사한다. 증상이 있는 서맥은 산소공급의 적응증이 된다."},{"id":"c05-q075","chapterId":5,"number":75,"page":125,"stem":"조절되지 않는 빈맥성 심방세동으로 심부전이 악화되어 집중치료실에 입원 중인 환자가\nheparinOl 지속정맥주입 상태에서 aPTT 는 45~60초로 치료범위 내에서 유지되고 있다.\n다음 중 이 환자에게 발생 위험이 가장 높고 위험한 결과를 초래하는 것은?","choices":["뇌졸중","활동내성 저하(exercise intolerance)","낙상","폐부종","폐색전증"],"answer":3,"answerLabel":"③","answerPage":332,"explanation":"항응고제를 함께 복용하고 있으므로 낙상 시 출혈\n위험이 높다. 혈종과 뇌출혈은 환자의 입원기간을 연장시킬\n수 있다. 치료적 수준을 유지하면서 항응고제를 복용하기\n때문에 뇌졸중의 위험은 낮다. 환자가 급성기일 때는 의자에\n앉는 것조차도 운동을 제한한다. 폐부종을 예방하기 위해서\n이뇨제가 투여되고 있다.\n정답및애설 I 332"},{"id":"c05-q076","chapterId":5,"number":76,"page":126,"stem":"Digoxin을 복용 중인 환자의 심전도가 다음과 같을 때 우선적으로 시행해야 할 중재 중\n가장 적절한 것은?","choices":["고박동조율(overdrive pacing)","투여 중인 digoxin 중단","digoxin 0.25 mg 추가 투약","adenosine 6 mg 투으，","경동맥 마사지"],"answer":2,"answerLabel":"②","answerPage":333,"explanation":"심전도는 심박동수 100회/분 이상의방실접합부빈맥\n(junctional tachycardia)이다. 이러한 방실접합부 빈맥은\ndigoxin toxicity와 관련이 있다. 동율동(sinus rhythm)\n으로 회복될 때까지 digoxin을 중단하고 반드시 필요한\n경우에만 투여한다. 고박동조율은 방실 결절전도를 증가시키기\n때문에 접합부빈맥에는 효과가 없다. 방실차단에서 digoxin\n투여는 금기이며 Adenosine 투여는 이 심장박동수에는\n적절하지 않다."},{"id":"c05-q077","chapterId":5,"number":77,"page":126,"stem":"두근거림과 호흡곤란으로 응급실에 온 환자의 심전도가 다음과 같다. 이 환자에게 적절\n한 중재는?","choices":["cardioversion with 100 joules, monophasic","cardioversion with 50 joules, biphasic","dofetilide 250 mg 경구투여","diltiazem 15 mg 정맥주사","adenosin 3 mg 정맥주사"],"answer":4,"answerLabel":"④","answerPage":333,"explanation":"심방세동이 시작된 시점을 알수 없을 때 혈전이 형성되었을\n가능성이 있다. 심장박동수 조절이 즉시 고려되어야 하고\n심방세동에서 심실박동수를 줄이기 위해 dilitazemOI 사용된다.\nCardioversion은 diltiazem이나 ibut이ide 등의\n약물치료에도 반응하지 않거나 환자가 불안정할 때 실시한다.\nDofetilide도 다른 약물에 반응하지 않는 심방세동에서 사용할\n수 있지만 첫 번째로 선택하는 약물은 아니다. 또한 Dofetilide\n은 QT interv 게을 주의 깊게 관찰하고 creatinine 이 earance\n에 따라 약용량을 결정한다."},{"id":"c05-q078","chapterId":5,"number":78,"page":127,"stem":"심방세동을 진단받고 정기적으로 외래 방문 중인 환자의 심전도가 다음과 같을 때 독성\n이 의심되는 약물은?","choices":["amiodarone","digoxin","dilitazem","lidocaine","metoprolol"],"answer":1,"answerLabel":"①","answerPage":333,"explanation":"amiodarone의 심혈관계 독작용으로 QT interv에\n연장을 동반한 서맥이 초래될 수 있고 이로 인해 Torsade\nde Pointes가 초래될 수 있으므로 중단하는 것이 필요하다."},{"id":"c05-q079","chapterId":5,"number":79,"page":127,"stem":"집중치료실에서 심정지가 발생한 환자의 심전도가 다음과 같을 때 가장 우선적으로 시행\n해야 할 중재는?","choices":["amiodarone 정맥주사","lidocaine 정맥주사","magnesium 정맥주사","cardioversion 100 J, biphasic","defibrillation 100 J, biphasic"],"answer":2,"answerLabel":"②","answerPage":333,"explanation":"Long QT interv기에 의한 Torsade de pointes\n에 의한 심정지는 magnesium s니fate를 정맥주사 하여\n치료한다."},{"id":"c05-q080","chapterId":5,"number":80,"page":127,"stem":"ST 분절 상승 심근경색증 환자에게 투여하는 약물 중 P2Y12 수용체에 작용하여 혈소판\n응집을 억제하는 것은?","choices":["asprin, clopidogrel","clopidogrel, prasugrel","prasugrel, abciximab","abciximab, heparin","heparin, tirofiban"],"answer":2,"answerLabel":"②","answerPage":333,"explanation":"Clopidogrel과 prasugrel 은 P2Y12 수용체에\n작용하여 혈소판 응집을 억제한다."},{"id":"c05-q081","chapterId":5,"number":81,"page":128,"stem":"직접 thrombin에 작용하여 혈소판 응집을 억제하고 작용시간과 반감기가 짧아 출혈 위험\n이 높은 경피 관상동맥중재술이 필요한 ST 분절 상승 심근경색증 환자에게 투여하는 약\n물은?","choices":["heparin","tirofiban","bivalirudin","enoxaparin","reteplase"],"answer":5,"answerLabel":"⑤","answerPage":333,"explanation":"Bivalirudin은 direct thrombin inhibitor, reteplae\n는 2세대 rt—PA로서 plasminogen에 결합하여 fibrin\nmatrix를 degration 시킨다."},{"id":"c05-q082","chapterId":5,"number":82,"page":128,"stem":"평소 건강하던 환자가 가슴이 터지는 듯한 흉통이 지속되어 응급실로 왔다. 활력징후는\n혈압 140/70 mmHg, 맥박수 85회/분, 호흡수 22회/분, SpO2 96%이고, 심전도가 다음과\n같다. 이 환자에게 적절한 중재는?\n1t…mmし5\n\"아!，52”い”\n山Wド나시아*WWW23531","choices":["증상이 발생한 후 4시간이 경과했다면 혈전용해술을 우선 고려한다.","증상 발생시간과 무관하게 관상동맥중재술을 우선 고려한다","이전에 심근경색증 경력이 있다면 관상동맥중재술을 우선 고려한다.","급성 심부전이 발생한 경우 혈전용해술을 우선 고려한다.","혈소판응집억제제의 복용 여부에 따라 관상동맥중재술을 고려한다"],"answer":3,"answerLabel":"③","answerPage":333,"explanation":"ST 분절상승 심근경색증이다. 관상동맥 개통을 통한\n재관류가 즉시 필요하다."},{"id":"c05-q083","chapterId":5,"number":83,"page":128,"stem":"다음 심전도 변화 중 혈전용해치료(throbolytic therapy)의 적응증은?","choices":["VI과 V3 유도에서 1 mm ST segment depression","aVF, V5, V6 유도에서 physiologic Q waves","VI 〜V4 유도에서 3mm ST segment elevation","aVL 과 aVR 유도에서 T wave inversion","II, III, aVF 유도에서 pathologic Q waves"],"answer":3,"answerLabel":"③","answerPage":333,"explanation":"V1 〜V4 유도에서 3 mm ST 분절 상승이 있으면\n심근경색증이 의심된다."},{"id":"c05-q084","chapterId":5,"number":84,"page":129,"stem":"급성 관동맥증후군 환자의 위험도를 평가하여 입원 직후부터 6개월까지 사망률을 예측\n하는 척도는?","choices":["CRUSADE score","EuroSCORE","Killip class","GRACE score","Framingham risk score"],"answer":4,"answerLabel":"④","answerPage":333,"explanation":"GRACE score이며 age, heart rate/pulse, systolic\nBP, creatinine, cardiac arrest at admission, ST\nsegment deviation on EKG, abnormal cardiac\nenzymes, Killip class (sign/symptoms)가 포함된다."},{"id":"c05-q085","chapterId":5,"number":85,"page":129,"stem":"관상동맥조영술에서 proximal LAD의 TIMI 0를 확인한 후 관상동맥중재술을 시행한 환자\n가 적절하게 재관류되었다고 판단할 수 있는 근거는?","choices":["치료 후 1 시간 이내에 CK-MB 수치 상승","치료 후 1시간 이내에 CK —MB 와 troponin 수치 감소","부정맥 발생","상승된 ST 분절 회복","T 파 역전"],"answer":4,"answerLabel":"④","answerPage":333,"explanation":"기저선baseline으로 ST 분절이 복귀되는 것은관상동맥\n관류가 회복되었음을 의미한다. CK_MB 와 troponin\n수치는 급성 심근경색증이 시작되고 진행될수록 증가한다.\n혈청 troponin 수치는 심근손상 후 7~10일 동안 증가되어\n있을 수 있다. 부정맥은 재관류와 연관이 있으나 급성\n심근경색증의 합병증으로도 발생 가능하다."},{"id":"c05-q086","chapterId":5,"number":86,"page":129,"stem":"6개월 전 약물방출스텐트를 삽입한 후 약물복용 중인 환자가 1 주일 전 발생한 비ST 분절\n상승 심근경색증으로 관상동맥우회술이 예정되어 있다. 다음 복용 중인 약물 중 수술 전\n에 복용을 중단해야 하는 시점이 옳은 것은?","choices":["clopidogr이 수술 5일 전","prasugrel 수술 5일 전","ticagrelor 수술 7일 전","aspirin 10일 전","heparin 1 일 전"],"answer":1,"answerLabel":"①","answerPage":333,"explanation":"Clopidogr이은 수술 5일전 중단해야 한다."},{"id":"c05-q087","chapterId":5,"number":87,"page":129,"stem":"다음 중 급성 심근경색증 환자에게 혈전용해제 치료를 하면 절대 안 되는 경우는?","choices":["혈압 210/110 mmHg","3일 전 일과성 허혈발작(transient ischemic attack： T1A) 의 과거력이 있는 경우","2년 전 허혈성 뇌졸중의 과거력이 있는 경우","乃세","스텐트 삽입 과거력이 있는 경우"],"answer":1,"answerLabel":"①","answerPage":333,"explanation":"조절되지 않는 고혈압은 혈전용해제 치료의 절대적\n금기증이다. 혈압은 뇌내출혈의 위험을 감소시키기 위해\n혈전용해제를 투여할 수 있도록 베타차단제나 혈관확장제로\n감소시킬 수 있다. 일과성허혈발작은 뇌졸중의 위험을 증가시킬\n수 있지만 반드시 혈전이 있는 것은 아니므로 뇌내출혈보다는\n혈전용해제로 얻는 장점에 무게를 더 둔다. 최근 발생한\n뇌졸중은 뇌내혈전은 정상과정을 통해 시간경과에 따라\n흡수되기 때문에 혈전용해제를 투여할 수 없는 이유가 될 수\n없다. 연령은 상대적인 금기이다. 급성 심근경색증이 있는\n노인에게 90분 이내에 관상동맥중재술(PCI)를 적용할 수\n있다면 PCI가 더 나은 대안이 될 수 있다. PCI를 적용할 수\n없다면 환자는 혈전용해제치료를 받아야 한다."},{"id":"c05-q088","chapterId":5,"number":88,"page":129,"stem":"급성 심근경색증과 관련된 합병증이나 사망률을 감소시키기 위해 금기가 아닌 경우 모든\n심근경색 후 환자 또는 5~28일 내의 급성기 환자에게 투여해야 하는 약물은?","choices":["Calcium channel blockers","Magnesium sulfate","Lidocaine","Beta blockers","Nitrates"],"answer":4,"answerLabel":"④","answerPage":333,"explanation":"베타차단제는 심근의 재경색, 부정맥 발생을 감소시키고\n심근 재형성을 감소시키고 심근의 교감신경스트레스를\n감소시킴으로써 급성 심근경색증에 의한 사망률을 감소시킨다.\n칼슘통로 차단제는 심실부정맥을 감소시키지 못하고 급성\n심근경색증에 의한 사망률 감소에는 영향이 없다. Magnesium\n은 혈전용해제 치료 후의 급성 심근경색증에서 심실성 부정맥\n발생을 감소시키지 못한다. Lidocaine은 심실성 부정맥을\n감소시키지만 서맥, 감각이상, 의식변화 등이 재관류 부정맥\n이후에 있을 수 있어서 치료에 적절한 선택이 되지 않는다."},{"id":"c05-q089","chapterId":5,"number":89,"page":130,"stem":"급성 심근경색증 치료 후 합병증과 사망률을 감소시키기 위해 베타차단제를 투여할 때\n확인해야 하는 사항은?","choices":["갑상선기능항진증 여부","울혈성 심부전 여부","심실상성 빈맥 여부","편두통 여부","천식이나 만성폐쇄폐질환 여부"],"answer":4,"answerLabel":"④","answerPage":333,"explanation":"베타차단제로 인해 천식이나 기관지수축을 동반한 만성\n폐쇄폐질환이 악화될 수 있으므로 투약 전 확인이 필요하다."},{"id":"c05-q090","chapterId":5,"number":90,"page":130,"stem":"16시간 전부터 aspirin과 nitro이ycerin을 복용했지만 효과가 없는 흉통이 간헐적으로 발\n생한 환자가 집중치료실에 입원했다. 12유도 심전도 상 leads II, III, aVF 에서 ST 분절이 상\n승되어 있을 때 이 환자에게 가장 적절한 중재는?","choices":["streptokinase 등의 혈전용해제 치료","개심술이 가능한 병원으로 전원","heparin, Gp lib/ Illa inhibitor 투약","관상동맥중재술이 가능한 시설로 이동","nitroglycerin 정맥주사 투여량 증가"],"answer":4,"answerLabel":"④","answerPage":333,"explanation":"급성 심근경색증의 증상과 징후가 시작된 지 3시간이\n경과되었다면 침습적 치료가 필요하다. 개심술 준비가 치료를\n지연시킬 수 있으므로 위 환자에게는 관상동맥중재술이\n우선시된다. 혈전용해제 치료는 증상이 나타난 지 3시간\n이상일 때 금기사항이다. 환자는 STEMI 이다. Heparin\nand G llb/llla inhibitors는 급성 관동맥증후군 환자에게\n적용 가능하다."},{"id":"c05-q091","chapterId":5,"number":91,"page":130,"stem":"관상동맥중재술 후 sheath를 제거하는 동안 환자의 심장박동수가 40회/분으로 감소되고\n혈압 80/50 mmHg, 환자는 메스꺼움을 호소한다. 다음 중 적절한 치료는?","choices":["계속해서 환자를 모니터하면 심박동수와 혈압이 5분 내에 이전 상태로 회복될 것이다","혈관미주신경 반응을 치료하기 위해 atropine 0.5 mg을 정맥주사 한다.","메스꺼움을 감소시키기 위해 prochlorperazine (Compazine) 10 mg을 정맥주사 한다","후복막출혈의 가능성이 있으므로 주치의에게 알린다.","기도내관 삽관을 준비한다."],"answer":2,"answerLabel":"②","answerPage":333,"explanation":"혈관미주신경 반응은 sheath 제거 시에 발생할 수\n있으며 atropine 주사 후 빠르게 회복된다. 서맥을 동반하지\n않고 혈압이 감소되었다면 생리식염수를 주입한다. 메스꺼움은\n혈압감소에 의해 나타날 수 있다. Prochlorperazine\n(Compazine)은 혈관이완과 연관이 있고 혈압을 더욱 낮아지게\n한다. 대개 천자부위에서 아ieath가 제거된 후에 후복벽출혈의\n징후를 발견할 수 있다."},{"id":"c05-q092","chapterId":5,"number":92,"page":130,"stem":"스텐트 삽입술 후 1 시간이 지난 환자가 허리와 서혜부의 통증을 호소한다. 활력징후는 혈\n압 100/70 mmHg, 심장박동수 112회/분 호흡수 20회/분이다. 출혈은 관찰되지 않을 때\n이 환자에게 가장 적절한 중재는?","choices":["12유도 심전도검사","통증완화를 위해 morphine 2 mg 정맥주사","혈청 hemoglobin, hematocrit검사","혈청 CK-MB, Troponin I 검사","특별한 치료가 필요하지 않음"],"answer":3,"answerLabel":"③","answerPage":333,"explanation":"관상동맥중재술 이후에 후복막출혈의 징후는 등과\n서혜부의 통증이다. 후복막출혈은 비만하거나 sheath\n삽입과정에서 장골동맥 전후가 천자되었다면 확인이 어려울\n수 있다. 후복막강으로 혈액 손실이 있다면 혈청 hemo\n이이Din과 hematocrit은 감소한다. 12유도 심전도에서는\n빈맥 또는 서맥 이외의 변화는 없다. Moiphine은 통증을\n완화시키기 위해 투여되지만 출혈을 멈추게 하지 않는다."},{"id":"c05-q093","chapterId":5,"number":93,"page":131,"stem":"불안정 협심증 진단을 받고 집중치료실에 입원 중인 환자가 저분자량헤파린, aspirin,\ncaptoprilOI 투약 중이며 eptifibatide와 nitroglycerin은 지속 정맥주입 상태이다. 다음 중\n심도자술과 관상동맥중재술 직후 가장 위험이 높은 것은?","choices":["서혜부 천자부위 출혈","관상동맥 경련","재협착","헤파린에 의한 혈소판감소증(Heparin-induced thrombocytopenia)","부정맥"],"answer":1,"answerLabel":"①","answerPage":334,"explanation":"heparin, eptifibatide, aspirin 병용투여는 출혈\n위험을 증가시킨다. 심도자술과 관상동맥 중재술은 서혜 부를\n통해 카테터를 삽입하고 서혜부 출혈 징후는 삼출출혈(oozing)\n과 혈종이다. 관상동맥 경련은 nitroglycerin 정맥주사로\n감소된다 관상동맥중재술 직후에 갑작스런 관상동맥 폐색이\n있을 수 있다. 재협착은 관상동맥중재술 후 수일에서 수년에\n발생한다. 헤파린에 의한 혈소판감소증은 이전에 heparin\n치료를 받았거나 24시간 이상 heparin을 사용한 후에\n나타날 수 있다."},{"id":"c05-q094","chapterId":5,"number":94,"page":131,"stem":"다음 중 좌심도자술 후에 발생 가능한 합병증은?","choices":["뇌졸중","폐색전증","홍조","오심","서맥"],"answer":1,"answerLabel":"①","answerPage":334,"explanation":"뇌졸중은 심장의 왼쪽에서 이동한 혈전이 대동맥과\n뇌동맥으로 이동할 수 있는 좌심도자술 중에 발생할 수\n있다."},{"id":"c05-q095","chapterId":5,"number":95,"page":131,"stem":"62세 남자 환자가 급성 심내막 심근경색증(acute endocardial infarction) 으로 입원 중\n이다. 현재 흉통은 없고 활력징후는 정상 범위 내에 있다. 환자는 간호사와 얘기하던 중\n갑작스런 호흡곤란을 호소하며, 혈압 80/50 mmHg, 맥박수 118회/분 호흡수 34회/분이\n匚卜. 심음은 들리지만 새로 생긴 수축기 심잡음이 청진되고, 혈역학적 지표가 다음과 같다.\n이 환자에게 적절한 중재는?\n• PAP ： 38/25\n• PAOP ： 24\n• CVP ： 7\n• Cardiac output： 3.2\n• Cardiac index： 1.7","choices":["즉각적인 수술","dopamine, nitroprusside 투여","다량의 수액 공급","혈전용해제 치료","관상동맥중재술"],"answer":1,"answerLabel":"①","answerPage":334,"explanation":"새로 생긴 수축기 심잡음은 급성 승모판 폐쇄부전이나\n심실중격파열의 가능성이 있으므로 즉시 수술이 필요하다."},{"id":"c05-q096","chapterId":5,"number":96,"page":132,"stem":"급성 심부전의 임상상태를 Cardiac index와 PCWP 두 지표를 이용하여 분류하는 Forrest\n분류법에 따라 “E ”의 상태일 때 적절한 약물치료는?","choices":["Digoxin","수액 투여","Vasodilators","Inotropics","Vasopressor"],"answer":3,"answerLabel":"③","answerPage":334,"explanation":"Forrest 분류에 따라 C는 pulmonary congestion\n이므로 diuretics 와 vasodilator 를 적용한다."},{"id":"c05-q097","chapterId":5,"number":97,"page":132,"stem":"만성 심부전으로 정기적으로 외래 방문 중인 환자가 3일 전부터 좌위호흡과 발작 야간호\n흡곤란이 심해져 응급실에 왔다. 이 환자가 복용하고 있는 약물 중 우선적으로 중단해야\n할 약물은?","choices":["acetaminophen","aspirin","digoxin","atenolol","naproxen"],"answer":5,"answerLabel":"⑤","answerPage":334,"explanation":"비스테로이드항염증제 , 스테로이드, 심장독성 항암제,\n알코올, 각성제 등은 급성 심부전을 악화시킬 수 있는\n약물이다. naproxen은 비스테로이드 항염증제이다."},{"id":"c05-q098","chapterId":5,"number":98,"page":133,"stem":"당뇨병과 천식을 진단받고 정기적으로 외래 추적관찰 중인 75세 환자가 1 개월 전부터\nNYHA 기능등급 II 정도의 호흡곤란 증상이 있어 외래를 방문했다. 심전도는 다음과 같고\n심초음파 상 좌심실 박출률이 45%, NT-proBNP 350 pg/mL일 때 이런 상태를 유발한\n원인으로 가장 의심되는 것은?","choices":["심근경색증","서맥","당뇨병","천식","고령"],"answer":1,"answerLabel":"①","answerPage":334,"explanation":"Right bundle branch 이ock의 심전도를 보이며\nV1~V4 에서 ST 분절 상승이 관찰된다."},{"id":"c05-q099","chapterId":5,"number":99,"page":133,"stem":"평소 건강하던 환자가 2개월 전부터 조절하지 않은 상태로 체중이 8 Kg 감소되었고 활\n동 시 호흡곤란이 있던 중 주일 전부터 NYHA 기능등급 III으로 악화되어 외래로 방문했\n다. 활력징후는 혈압 100/50 mmHg, 맥박수 110회/분, 호흡수 22회/분이고, 말라 보이며\n안절부절못하고 추운 날씨에도 반팔을 입고 있다. 흉부 방사선검사에서 양쪽 하엽의 폐\n부종이 관찰된다. 이 환자에서 심부전을 확진하기 위해 시행해야 할 혈액검사는?","choices":["T3, free T4, TSH","hemoglobin, hematocrit, platelet","Troponin I","Creatinine","serum albumin"],"answer":1,"answerLabel":"①","answerPage":334,"explanation":"갑상선기능저하 또는 항진은 급성 심부전의 악화요인이다.\n위의 환자는 원인불명의 체중감소와 안절부절못하고 열에\n대한 내성 감소가 있으므로 이 환자에게 갑상선기능검사를\n우선적으로 시행한다."},{"id":"c05-q100","chapterId":5,"number":100,"page":133,"stem":"만성 심부전 환자의 생존율을 개선하기 위한 약물이 아닌 것은?","choices":["captopril","carvedilo","digoxin","spironolactone","valsartan"],"answer":4,"answerLabel":"④","answerPage":334,"explanation":"만성 심부전 환자의 생존율을 개선하기 위한 약물은\nACE-I, angiotensin receptor blocker, Beta\nblocker, 염류코르티코이드 길항제, 하이드랄라진과\n질산 이소소르비드이다. 디곡신은 증상을 조절하여\n재입원율을 감소시키는 것으로 보고되고 있다."},{"id":"c05-q101","chapterId":5,"number":101,"page":134,"stem":"도파민과 같은 교감신경자극제는 혈류량이 교정되지 않은 상태에서는 투여 시 주의가\n필요하다. 다음 중 그 이유를 가장 잘 설명한 것은?","choices":["강력한 교감신경자극이 있으므로 적절한 체액량이 없다면 효과를 나타내지 못한다","교감신경 자극은 혈관확장이 일차적인 문제일 경우에만 작용한다.","교감신경 자극은 혈관의 압수용체가 비활성화될때까지 나타나지 않는다.","저혈량증에서 수액을 보충하기 전에 도파민을 투여해야 한다.","약물용량을 증가시키면 말초혈관 투과성을 변화시킨다."],"answer":1,"answerLabel":"①","answerPage":334,"explanation":"도파민을 투여하기 전에는 반드시 체액량이 적절한\n지 확인한 후 투여해야 한다."},{"id":"c05-q102","chapterId":5,"number":102,"page":134,"stem":"좌심실 박출률이 35% 이하인 환자에게 심근수축력에 영향을 주지 않고 맥박수만 감소\n시켜 만성 심부전의 증상을 개선하는 효과를 기대할 수 있는 약물은?","choices":["amiodarone","ivabradine","metoprolol","milrinone","carvedilol"],"answer":2,"answerLabel":"②","answerPage":334,"explanation":"2012년 유럽심장학회 가이드라인에 따르면\n심부전환자에게 ACE-I, ARB, 이뇨제, 무기질코르티코이드\n수용체길항제를 사용함에도 불구하고 증상이 조절되지 않고\nERF 35% 이하면서 심장박동수가 70 bpm 이상일 때\nivabradine을 추가하도록 권고한다. ivabradine은\n교감신경을 차단해 심장 박동 수를 낮추는 베타차단제와는\n달리 sinus node의 funny channel에 직접 작용해\n이완기의 탈분극 기울기를 낮추며 기저 심박수에 관계없이\n심박수를 55-60으로 낮춘다."},{"id":"c05-q103","chapterId":5,"number":103,"page":134,"stem":"Furosemide (Lasix)가 일회박출량(stroke v이ume)에 있어서 일차적으로 영향을 미치는\n요인은?","choices":["전부하","후부하","수축력","대동맥 확장성","말초혈관 저항"],"answer":1,"answerLabel":"①","answerPage":334,"explanation":"소변량을 증가시켜 전신순환혈액량을 감소시키므로\n전부하를 감소시키는 효과가 있다."},{"id":"c05-q104","chapterId":5,"number":104,"page":134,"stem":"spironolactone 치료 중인 환자에게 안지오텐신전환효소억제제의 의해 나타날 수 있는\n부작용은?","choices":["고혈압","고칼륨혈증","신기능부전","단백뇨","저혈량증"],"answer":2,"answerLabel":"②","answerPage":334,"explanation":"Spiron이actone은 potassium sparing diuretics\n이므로 고칼륨혈증의 부작용 위험이 있다."},{"id":"c05-q105","chapterId":5,"number":105,"page":135,"stem":"기세 남자가 호흡곤란 좌위호흡, 점진적인 운동내성 감소로 입원했다 환자는 진료를 받아본\n적이 없다고 말한다 전반적으로 양쪽 후엽에서 수포음이 청진되며 폐동맥카테터를 통한 혈\n역학적 지표 수치는 다음과 같다 이 환자의 증상 개선을 위해 가장 효과적인 치료는?\n• 혈압 118/70 mmHg\n• 맥박수 寸。회/분\n• 호흡수 28 회/분\n• 체온 37 化\n• SpO2 8\n• Cardiac index 2.2\n• Stroke index 20\n• PAP 36/22\n• PAOP 20\n• CVP 6","choices":["산소 공급","phenylephrine","f니rosemide","carvedilol","dopamine"],"answer":3,"answerLabel":"③","answerPage":334,"explanation":"폐부종이 의심되므로 이뇨제를 투여한다."},{"id":"c05-q106","chapterId":5,"number":106,"page":135,"stem":"심부전에서 이뇨제와 병용투여했을 때 후부하를 가장 효과적으로 감소시킬 수 있는 조\n합은?","choices":["Digoxin과 beta-blockers","Low-sodium diet와 fluid restriction","Nitrates와 ACE inhibitors","Nesiritide (Natrecor)와 digoxin","beta-blocker와 calcium channel blockers"],"answer":3,"answerLabel":"③","answerPage":334,"explanation":"NitratesU ACE inhibitor와 같은 혈관확장제는\n혈관수축을 감소시켜서 후부하를 낮춘다. 또한 ACE\ninhibitor는 약간의 이뇨작용이 있어서 울혈 심부전 치료에\n도움이 된다. Beta-blockers 는 심방성부정맥을 조절하여\n이완기충만을 개선하지만 후부하를 감소시키지 않는다.\nDigoxin은 심근수축력을 개선하고 심방세동을 조절하지만\n후부하에는 영향을 미치지 않는다. Nesiritide 는 혈관을\n확장시켜서 후부하를 감소시키며 이뇨작용을 한다."},{"id":"c05-q107","chapterId":5,"number":107,"page":135,"stem":"심부전 환자에서 좌심실 박출률이 35% 이하이고 QRS 간격(duration)이 증가하여 예후\n가 나빠지는 환자에게 심실의 여러 부위에 심박조율을 시행하여 증상 개선 및 사망률과\n재입원율을 감소시키는 중재는?","choices":["대동맥내풍선펌프","심율동전환 제세동기","삽입형 박동조율기","심실보조장치","심장재동기화치료"],"answer":5,"answerLabel":"⑤","answerPage":334,"explanation":"심장동기화치료를 수행한다."},{"id":"c05-q108","chapterId":5,"number":108,"page":136,"stem":"혈관확장제는 좌심실기능부전에서 심근의 산소소모량을 감소시키는 데 도움이 된다. 다\n음 중 울혈 심부전 치료에 도움이 되는 혈관확장제는?","choices":["beta blockers (e.g., carvedilol)","inotropes (e.g., dobutamine)","diuretics (e.g., Lasix)","calcium channel blockers (e.g., nicardipine)","alpha blockers (e.g., doxazosin)"],"answer":4,"answerLabel":"④","answerPage":334,"explanation":"투여 시 혈관을 이완시키는 약물은 칼슘통로차단제이다."},{"id":"c05-q109","chapterId":5,"number":109,"page":136,"stem":"울혈 심부전을 진단받고 치료 중인 환자의 혈역학적 지표가 다음과 같을 때 중단해야 하\n는 약물은?\n• Arterial pressure： 44/26\n• PAOP ： 25\n• CVP ： 15\n• Cardiac output： 3.7\n• Cardiac index： 1.6\n• SVO2： 0.40","choices":["안정 협심증 치료를 위해 장기복용 중인 Nifedipine (Procardia XL)","고혈압 치료를 위해 복용 중인 Hydrochlorothiazide (Hydro DIURIL)","고혈압 치료를 위해 복용 중인 Enalapril (Vasotec)","두통 치료를 위해 복용 중인 Butalbital (Esgic)","치과치료 후 복용 중인 penicillin"],"answer":1,"answerLabel":"①","answerPage":334,"explanation":"대부분의 항부정맥제와 마찬가지로 울혈 심부전을\n악화시킬 수 있으므로 칼슘통로차단제인 Nifedipine\n(Procardia XL)은 중단해야 한다. 단, amiodarone 은\n심부전 환자치료에도 사용가능한 항부정맥 제이다. 이뇨제는\n울혈 심부전 환자의 증상을 완화시키는 데 가장 효과적인\n약물이므로 hydro아ilorothia기de (HydroDlURL)는\n중단할 필요가 없다. ACE inhibitors인 enalapril\n(Vasotec)도 이뇨제와 마찬가지로 초기치료시 투여되어야\n하므로 지속적으로 복용해야 한다. barbiturate but게bital\n(Esgic) 은 울혈 심부전 환자에게 금기약물이 아니다."},{"id":"c05-q110","chapterId":5,"number":110,"page":136,"stem":"심부전이 급격히 악화되어 nesiritide (Natrecor)을 0.1 mcg/Kg/min로 지속적으로 주입\n중인 환자가 활력징후는 혈압 78/48 mmHg, 심장박동수 116회/분 호흡수 28회/분이고,\nBiPAP mask> 통해 40% 의 산소 공급을 하는 상태에서 산소포화도 90%이다. 심전도\n에서 조기심방수축 을 동반한 동성빈맥이 보인다. 이 환자에게 우선적인 중재는?","choices":["nesiritide (Natrecor) 주입을 중단한다.","환자가 앙와위를 취하게 한다","생리식염수 250 mL를 빠르게 정맥주입 한다.","fuosemide (Lasix) 40 mg을 추가하여 정맥주사 한다.","dopamine 3 mcg/Kg/min을 추가하여 정맥주입 한다."],"answer":1,"answerLabel":"①","answerPage":334,"explanation":"심부전 치료에 사용되는 Nesiritide (Natrecor)는\n강력한 혈관확장제로서 반동성 저혈압을 유발할 수 있다.\n혈압이 90 mmHg 이하일 때 투약을 중단해야 한다.\n앙와위가 혈압을 증가시키기도 하지만 오히려 호흡을 힘들게\n하고 SpO2를 낮출 수 있다. 수액다량주사는 환자의\n심부전을 악화시킬 수 있으므로 적절하지 않다. Furose\nmide를 투여함으로써 나타나는 이뇨작용은 이후 혈압을\n감소시킬 수 있다."},{"id":"c05-q111","chapterId":5,"number":111,"page":137,"stem":"72세 남자가 급성 후벽 심근경색증(acute inferior wall myocardial infarction)을 진단받\n고 입원 중이다. 환자는 말초혈관질환과 만성폐쇄폐질환(COPD)의 과거력이 있다. 환자\n를 관찰하던 중 호흡곤란이 시작되었고 12유도 심전도에서 V1~4까지 ST 분절 하강이\n관찰된다. 호기 쌕쌕거림(expiratory wheezing)과 함께 폐하엽에서 수포음이 들리고, S3\n와 수축기 심잡음이 III/VI 정도로 들리고, 현재 비강캐뉼라를 통해 산소가 2 L/분으로\n공급되고 있으며 Sp5는 95% 이고, 동맥혈가스분석 결과가 pH 7.37, PaCO2 52 mmHg,\nPaO 2 69 mmHg, HCO「33 mEq/L이다. cardiac biomarker는 CK-MB 4, Troponin I\n0.1 이고, 혈역학적 지표는 다음과 같을 때 이 환자의 증상을 호전시킬 수 있는 최선의 치\n료는?\n• 혈압 104/60 mmHg\n• 맥박수 1 이회/분\n• Stroke index 20\n• Cardiac index 2.0\n• PAP 40/24\n• PAOP 22\n• Central venous pressure (CVP) 11","choices":["산소공급과 혈전용해법","vasopressin 투여","nitroprusside와 수액 투여","dobutamine과 lasix 투여","관상동맥중재술"],"answer":4,"answerLabel":"④","answerPage":334,"explanation":"과 심근수축력을 모두 개선하기 위해\ndobutamine과 lasix를 투여한다."},{"id":"c05-q112","chapterId":5,"number":112,"page":137,"stem":"심근경색증이 의심되는 58세 남자가 저혈압상태로 입원했다. 혈압 82/52 mmHg, 맥박\n수 122회/분이고, 환자는 현저한 좌위호흡과 극도로 불안증상을 보이며, 폐 하엽에서 수\n포음이 청진된다. 1 시간 이내로 폐동맥카테터를 삽입하기로 결정한 상태에서 환자에게\n가장 먼저 투여해야 할 약물은?","choices":["고용량의 dopamine과 nitroprusside","furosemide와 milrinone","dobutamine과 epinephrine","digitalis와 furosemide","milrinone과 epinephrine"],"answer":2,"answerLabel":"②","answerPage":334,"explanation":"수포음이 청진되므로 폐부종을 치료하기 위해 이뇨제와\n혈압상승제를 투여해야 한다."},{"id":"c05-q113","chapterId":5,"number":113,"page":137,"stem":"울혈 심부전 환자에게 nitroprusside와 dobutamineOl 투약되고 있다면 기대하는 효과는?","choices":["전부하 감소와 수축력 증가","전부하 증가와 후부하 감소","후부하 감소와 수축력 감소","후부하 감소와 수축력 증가","후부하 증가와 수축력 감소"],"answer":4,"answerLabel":"④","answerPage":335,"explanation":"Nitroprusside는 nitrate계 약물로 혈관을 이완시키고\ndobutamine은 심근수축력을 증가시킨다."},{"id":"c05-q114","chapterId":5,"number":114,"page":138,"stem":"폐부종이 있는 환자에게 furosemide (Lasix)와 morphine이 투여되었을 때 심근기능을\n개선하는 데 효과를 미치는 생리적 기전은?","choices":["전부하와 심근의 산소소모량 감소","후부하와 심근의 산소소모량 감소","전부하 증가와 수축력 향상","후부하 증가에 따른 수축력 향상","전부하 증가와 후부하 증가"],"answer":1,"answerLabel":"①","answerPage":335,"exp
