60 mmHg 이상이면 labetarol 10 mg을 정맥투여 한다"],"answer":3,"answerLabel":"③","answerPage":355,"explanation":"뇌졸중학회 가이드라인에 따르면 혈전용해제는 용량의\n10%는 1 분 동안 bolus로 주고, 나머지 90%를 60분간\n주입한다. 환자는 모니터링을 위해 중환자실 또는\n뇌졸중병동에 입원한다. 혈전용해제 투여 중에는 신경학적\n검진을 15분마다, 다음 6시간 동안은 30분 간격으로, 다음\n16시간 동안은 매시간 시행한다. 혈압은 혈전용해제 투여\n중 또는 투여 후 첫 2시간 동안은 15분 간격으로 투여하고,\n다음 16시간은 1 시간 간격으로 투여한다. 혈압은 수축기\n180 mmHg 이상 또는 이완기 105 mmHg 이상일 때\n혈압을 낮추기 위한 약물을 투여한다."},{"id":"c07-q056","chapterId":7,"number":56,"page":221,"stem":"뇌경색의 재발 가능성을 낮추기 위한 약물 중 기전이 다른 것은?","choices":["Aspirin","Cilostazol","Clopidogrel","Ticlopidine","Wafarin"],"answer":5,"answerLabel":"⑤","answerPage":355,"explanation":"Wafarin은 항응고제이고, 나머지 4가지 약은\n항혈소판제제이 다."},{"id":"c07-q057","chapterId":7,"number":57,"page":221,"stem":"심방세동 환자의 뇌졸중 발생 예방을 위해 사용하는 약물은?","choices":["Aspirin","Wafarin","Cilostazol","Ticlopidine","Clopidogrel"],"answer":5,"answerLabel":"⑤","answerPage":355,"explanation":"항혈소판제제는 동맥경화증과 같은 백색혈전이 원인인\n뇌졸중을 예방하기 위해 사용된다. 적색혈전은 심장성\n색전증에 의한 뇌경색의 주원인으로 심방세동의 경우처럼\n심장내피세포손상과 혈류정체에 따른 점도 증가로 인한\n응고계활성화가 주된 기전이므로, 응고인자 합성을 억제하기\n위해 와파린과 같은 항응고제 처방이 필요하다."},{"id":"c07-q058","chapterId":7,"number":58,"page":221,"stem":"평소 고혈압, 당뇨병이 있는 62세 남자가 갑자기 우측 상지마비와 실어증이 발생하여 20\n분 만에 응급실에 도착하였다. 환자의 증상을 바탕으로 손상된 혈관을 추정한다면?","choices":["우측 전대뇌동맥","우측 중대뇌동맥","좌측 전대뇌동맥","좌측 중대뇌동맥","기저동맥"],"answer":4,"answerLabel":"④","answerPage":355,"explanation":"마비 증상이 주로 우측 상지에 있고 구음장애를 보이는\n것으로 보0 卜 좌측 중대뇌동맥이다. 중대뇌동맥은 뇌혈액량의\n3분의 2를 공급하는 혈관으로 반대측 반신마비를 보이되\n다리보다 팔과 얼굴에 주로 마비가 오며 , 특히 우성반구를\n침범하는 경우 실어증이 동반된다."},{"id":"c07-q059","chapterId":7,"number":59,"page":221,"stem":"심방세동 부정맥이 있는 50세 남자가 갑작스런 좌측 다리 마비와 감각장애룰 호소하며\n응급실을 방문하였다. 손상이 의심되는 뇌혈관은?","choices":["우측 전대뇌동맥","우측 중대뇌동맥","좌측 전대뇌동맥","좌측 중대뇌동맥","기저동맥"],"answer":1,"answerLabel":"①","answerPage":355,"explanation":"전대뇌동맥은 반대측 다리의 움직임과 감각조절 중추가\n있는 곳에 혈액을 공급한다."},{"id":"c07-q060","chapterId":7,"number":60,"page":221,"stem":"연하기능이 저하된 뇌졸중 환자의 음식 섭취 방법으로 적절한 것은?","choices":["물과 함께 삼킨다.","고개를 들어서 삼킨다.","음식의 점도를 높여준다","숨을 내쉬면서 음식을 삼킨다.","TV 를 보는 등 주의를 분산시키면 쉽게 삼킬 수 있다."],"answer":3,"answerLabel":"③","answerPage":355,"explanation":"연하장애가 있는 경우 앉은 자세에서 고개를 약간 숙인\n상태에서 섭취하게 하고, 음식의 점도를 높여서 제공한다.\n일반적으로 점도가 낮아 음식이 묽을수록 삼킴 후 잔류되는\n음식물은 적지만 흡인이 더 잘 일어난다. 따라서 음식이\n서로 떨어지지 않는 정도로 점도를 높여서 주는 것이 좋다."},{"id":"c07-q061","chapterId":7,"number":61,"page":222,"stem":"이 환자에게 의심되는 상태는?","choices":["뇌수막염","뇌경색","뇌출혈","안면마비","중증근무력증"],"passage":"다음 지문을 읽고 질문에 답하시오(문제 61-62).\n택배직원이 오전 10시쯤 무거운 상자를 옮기던 중 망치로 머리를 내리치는 것 같은 극심한 두통\n을 호소하다가 의식을 잃었다. 응급실 도착 당시 환자는 눈을 감고 있었고 흔들어 깨우니 묻는 말\n에 적절히 대답을 했다. 신체검진 시 목 경직이 보이고 우측 안검 하수와 동공이 확장되어 있다.","answer":3,"answerLabel":"③","answerPage":356,"explanation":"동맥류파열로 인한 갑작스런 두통은 평생 경험해 보지\n못한 극심한 두통을 유발하며 , 수막자극증상을 보이며 심할\n경우는 의식장애가 뒤따른다 . 후교통동맥이나 상소 뇌동 맥의\n동맥류가 파열될 때는 동안신경 마비가 발생하기도 한다.\n뇌경색 , 안면마비 , 중증근무력증에서는 두통이 수반되지\n않는다. 뇌수막염에서도 수막자극증상이 있고, 두통이\n동반될 수는 있으나 극심한 두통이라 말할 수 없고, 발작과\n발열, 의식저하 증상이 더 흔하게 동반된다."},{"id":"c07-q062","chapterId":7,"number":62,"page":222,"stem":"이 환자는 뇌 ct 상 뇌동맥류 파열로 인한 지주막하출혈로 진단되어 병실로 이송되었다.\n입원 당일 밤 극심한 두통과 구토를 호소하며 의식이 저하되어 반응이 없다. 이 환자에게\n의심되는 상태는?","choices":["발작","재출혈","수두증","뇌수막염","뇌혈관연축"],"passage":"다음 지문을 읽고 질문에 답하시오(문제 61-62).\n택배직원이 오전 10시쯤 무거운 상자를 옮기던 중 망치로 머리를 내리치는 것 같은 극심한 두통\n을 호소하다가 의식을 잃었다. 응급실 도착 당시 환자는 눈을 감고 있었고 흔들어 깨우니 묻는 말\n에 적절히 대답을 했다. 신체검진 시 목 경직이 보이고 우측 안검 하수와 동공이 확장되어 있다.","answer":2,"answerLabel":"②","answerPage":356,"explanation":"재출혈은 첫 24시간 이내에 가장 많이 발생하는\n합병증이며, 오심과 구토, 심한 두통 및 의식저하와 더불어\n새로운 신경학적 결손이 동반된다. 혈관연축은 지주막하출혈\n7~14일 후에 가장 많이 발생한다."},{"id":"c07-q063","chapterId":7,"number":63,"page":222,"stem":"지주막하출혈 환자가 입원 io일째에 갑자기 말이 어눌해지고 불안정한 모습을 보이다 반\n응이 떨어졌다 가장 의심되는 상태는?","choices":["발작","재출혈","수두증","뇌수막염","뇌혈관연축"],"answer":5,"answerLabel":"⑤","answerPage":356,"explanation":"혈관연축은 지주막하출혈 7~14일 정도 경과해서 가장\n많이 발생하는 합병증으로 뇌허혈과 유사한 증상을 보인다."},{"id":"c07-q064","chapterId":7,"number":64,"page":222,"stem":"지주막하출혈 환자의 뇌혈관 연축이 의심될 때 시행하는 검사는?","choices":["뇌 CT","뇌 MRI","뇌파검사","경두개초음파","뇌혈관조영술"],"answer":4,"answerLabel":"④","answerPage":356,"explanation":"혈관연축은 지주막하출혈 발생 후 7，이0일 정도 경과해서\n가장 많이 일어나는 합병증이다. 뇌혈관연축을 진단하기\n위해서 경두개초음파(Transcranial doppler； TCD) 검사를\n통해 혈류 속도에 변화가 있는지 확인해야 한다."},{"id":"c07-q065","chapterId":7,"number":65,"page":223,"stem":"뇌동맥류 결찰술 후 io일째인 환자의 말이 어눌하고 정맥주사 바늘을 빼려고 하며 불안\n정한 모습을 보인다. 뇌 CT 상 이상소견은 없고, 경두개초음파 검사 결과 중대뇌동맥의\n평균 혈류속도가 240 cm/sec이다. 이 환자에게 의심되는 상태는?","choices":["발작","재출혈","수두증","뇌수막염","뇌혈관연축"],"answer":5,"answerLabel":"⑤","answerPage":356,"explanation":"혈관연축은 지주막하출혈 7—50일 정도 경과해서 가장\n많이 발생하는 합병증으로, 뇌혈관연축을 진단하기 위해서\n경두개초음파(Transcranial doppler； TCD) 검사를 통해\n혈류속도에 변화가 있는지 확인해야 한다. 혈류속도가 200\ncm/sec 이상으로 증가되어 있거나, 하루사이에 50 cm/\nsec 이상 속도가 증가하면 뇌혈관연축을 의심해야 한다."},{"id":"c07-q066","chapterId":7,"number":66,"page":223,"stem":"지주막하출혈로 수술과 치료를 마치고 퇴원한 환자가 3개월 만에 보행장애와 소변을 지\n리는 증상으로 다시 내원하였다. 이 환자에게 의심되는 상태는?","choices":["발작","재출혈","수두증","뇌수막염","뇌혈관연축"],"answer":3,"answerLabel":"③","answerPage":356,"explanation":"수두증(hydrocephalus)은 지주막하출혈 후 3주 이후에\n발생하는 만성 합병증으로 요실금, 보행장애, 치매 등의\n증상이 나타날 수 있다. 재출혈은 출혈 직후 발생하며 ,\n혈관연축은 7~10일 정도 경과해서 주로 나타난다."},{"id":"c07-q067","chapterId":7,"number":67,"page":223,"stem":"지주막하출혈 환자의 뇌혈관연축을 예방하기 위한 중재는?","choices":["예방적 항생제 투여","스테로이드제제 투여","칼슘통로차단제 투여","중심정맥압 5 mmHg 미만 유지","수축기혈압 150 mmHg 이하로 유지"],"answer":3,"answerLabel":"③","answerPage":356,"explanation":"뇌혈관연축을 예방하기 위해서 칼슘통로차단제와\nTriple H 요법(hypevolemia, hypertension, hemodilution)\n을 시행한다. 고혈량증은 중심정맥압이 10 mmHg 정도로\n유지되도록 수약을 공급하며, 수축기 고혈압은 160-200\nmmHg 정도로 유지한다. 혈액희석을 위해 적혈구용적률\n(hematocrit)을 30~35% 정도로 유지한다."},{"id":"c07-q068","chapterId":7,"number":68,"page":223,"stem":"7세 아동이 뜨거운 라면을 먹다가 갑자기 의식을 잃은 후 일시적으로 마비 증상을 보였\n다. 이 환자에게 의심되는 상태는?","choices":["뇌염","뇌경색","동정맥기형","모야모야병","경동맥해면정맥동루"],"answer":4,"answerLabel":"④","answerPage":356,"explanation":"모야모야병이 소아에서는 주로 허혈증상으로 나타난다.\n울거나 뜨거운 음식을 먹을 때 의식을 잃고 쓰러지거나\n반신마비, 언어장애 등의 일과성 허혈발작이 나타나는데,\n이는 과호흡으로 혈중 이산화탄소 분압이 감소하거나 또는\n교감신경의 자극으로 인해 혈관이 수축함으로써 생기는\n증상이다."},{"id":"c07-q069","chapterId":7,"number":69,"page":223,"stem":"혈액순환 개선을 위해 뇌경막동맥 간접문합술(encephaBduroarteriosynangiosis； EDAS)\n이 필요한 질환은?","choices":["뇌경색","동정맥기형","모야모야병","해면혈관종","경동맥해면정맥동루"],"answer":3,"answerLabel":"③","answerPage":356,"explanation":"모야모야병에서 허혈상태나 허혈증상이 반복적으로\n있는 경우 뇌경색으로 진행하지 않도록 직 • 간접의 두개내 •\n외혈관문합술이 권장된다."},{"id":"c07-q070","chapterId":7,"number":70,"page":224,"stem":"교통사고로 입원한 환자의 안와 주변에 반상출혈이 관찰되고, 이루와 비루가 있을 때 의\n심할 수 있는 상태는?","choices":["수두증","경막하혈종","경막외혈종","기저골골절","지주막하출혈"],"answer":4,"answerLabel":"④","answerPage":356,"explanation":"이루, 비루, 너구리 눈(안와 주변 반상출혈)은 기저골\n골절에서 나타나는 증상이다."},{"id":"c07-q071","chapterId":7,"number":71,"page":224,"stem":"교통사고로 입원한 환자의 코에서 연한 붉은색의 액체가 흘러나와 포도당을 측정한 결과\n70 mg/dL이었고, 말초 혈당은 120 mg/dL이다. 이 환자에게 적절한 중재는?","choices":["조기 이상을 격려한다.","머리를 하지보다 낮게 유지한다","침상에서 절대안정을 취하게 한다.","코에 거즈를 단단하게 넣어 막아준다.","코를 풀어 이물질을 제거하도록 한다"],"answer":3,"answerLabel":"③","answerPage":356,"explanation":"코 분비물이 뇌척수액인지 여부는 포도당검사를 통해\n확인할 수 있다. 분비물의 포도당이 말초혈당의 50~80%\n사이인 것으로 보아 뇌척수액 비루(CSF rhinorrheR이다.\n뇌척수액 비루가 있는 경우 코를 풀거나 재채기를 하지 않도록\n해야 하며 , 코에 손을 넣지 않도록 교육한다. 코에 무균적\n패드를 대고 축축해지면 교환한다. 거즈를 단단히 넣어\n분비를 강제로 막으면 안 된다. 뇌척수액루의 70% 이상은\n1 주일 이내에 자연 폐쇄되므로 급성기에는 절대 안정하고\n감염방지를 위해 광범위 항생제를 사용하며 보존적 치료를\n하는 것이 좋다."},{"id":"c07-q072","chapterId":7,"number":72,"page":224,"stem":"70세 환자가 2주 전부터 시작된 두통과 어지럼증이 더 심해진다고 하면서 의식수준이 점\n차 떨어져서 내원하였다. 이 환자는 수년 전 고혈압과 심방세동 부정을 진단 받고 항고혈\n압제와 와파린을 복용하고 있었다. 한 달 전 빙판길에서 넘어진 적이 있으나 당시 큰 이\n상이 없어 병원에 내원하지는 않았다. 이 환자에게 의심되는 상태는?","choices":["경막외혈종","경막하혈종","두개저 골절","지주막하출혈","미만성 축삭손상"],"answer":4,"answerLabel":"④","answerPage":356,"explanation":"노인이 항응고제를 치료받고 있는 경우 사소한 두부\n외상으로도 손상 후 2〜3주에서 4개월 후에도 만성\n경막하혈종이 나타날 수 있다. 서서히 일어나는 모세혈관\n누출로 혈액 덩어리가 더욱 팽창되어 압박하면 증상이\n발현된다. 일반적 증상으로는 두통, 편마비, 의식장애,\n현기증, 정신둔함, 기면상태, 혼돈, 무관심이 나타난다."},{"id":"c07-q073","chapterId":7,"number":73,"page":224,"stem":"이 환자에게 손상이 의심되는 부위는?","choices":["C1-2","C3-4","C5-6","C7-8","T2-3"],"passage":"다음 지문을 읽고 질문에 딥もt시오(문제 73-77).\n50 세 남자가 지붕을 수리하던 중 발을 헛디뎌 흙바닥으로 떨어지면서 머리를 찧었고. 119 구급차\n로 병원에 호송되었다. 신체검진 시 의식은 명료하였으나 삼두근건반사(triceps deep tendon reflex)\n가 항진되어 있고, 손가락을 구부렸다 펴는 데 어려움이 있다.","answer":4,"answerLabel":"④","answerPage":356,"explanation":"삼두근건반사는 C7-8번이 관여하며, C7 손상 시\n손가락 신전, C8 손상 시 손가락 굴절에 어려움을 보인다."},{"id":"c07-q074","chapterId":7,"number":74,"page":225,"stem":"이 환자의 척수손상 기전으로 예측되는 것은?","choices":["과굴곡손상","과신전손상","압박손상","회전손상","관통손상"],"passage":"다음 지문을 읽고 질문에 딥もt시오(문제 73-77).\n50 세 남자가 지붕을 수리하던 중 발을 헛디뎌 흙바닥으로 떨어지면서 머리를 찧었고. 119 구급차\n로 병원에 호송되었다. 신체검진 시 의식은 명료하였으나 삼두근건반사(triceps deep tendon reflex)\n가 항진되어 있고, 손가락을 구부렸다 펴는 데 어려움이 있다.","answer":3,"answerLabel":"③","answerPage":356,"explanation":"압박손상은 강한 수직적인 힘에 의해 발생해서 척추의\n분쇄나 파열 등을 유발한다. 경추와 흉 •요추 부위는 가장\n흔한 손상부위이다. 머리 정수리의 타박상이나 발과 엉덩이\n등으로 땅에 강하게 내리찧는 경우 압박손상이 일어날 수\n있다."},{"id":"c07-q075","chapterId":7,"number":75,"page":225,"stem":"이 환자에게 우선적으로 시행해야 할 검사는?","choices":["척추 CT","척추 MRI","근전도검사","척추 X-ray","척추관조영술"],"passage":"다음 지문을 읽고 질문에 딥もt시오(문제 73-77).\n50 세 남자가 지붕을 수리하던 중 발을 헛디뎌 흙바닥으로 떨어지면서 머리를 찧었고. 119 구급차\n로 병원에 호송되었다. 신체검진 시 의식은 명료하였으나 삼두근건반사(triceps deep tendon reflex)\n가 항진되어 있고, 손가락을 구부렸다 펴는 데 어려움이 있다.","answer":4,"answerLabel":"④","answerPage":356,"explanation":"압박손상은 강한 수직적인 힘에 의해 발생해서 척추의\n분쇄나 파열 등을 유발한다. 따라서 척추체나 척추돌기의\n골절 혹은 탈구를 확인하기 위해서 X-ray을 우선적으로\n확인해야 한다. 어느 부위에 척추 손상이 있더라도 반드시\n척추 전체의 전후, 측면 및 사위상을 촬영해야 한다."},{"id":"c07-q076","chapterId":7,"number":76,"page":225,"stem":"병원 도착 두 시간 후에 측정한 환자의 혈압은 60/40 mmHg, 맥박은 40회/분이며, 피부\n는 건조하고 따뜻하다. 이 환자에게 의심되는 상태는?","choices":["척수공동증","출혈성 쇼크","신경성 쇼크","심부정맥혈전증","자율신경반사 항진"],"passage":"다음 지문을 읽고 질문에 딥もt시오(문제 73-77).\n50 세 남자가 지붕을 수리하던 중 발을 헛디뎌 흙바닥으로 떨어지면서 머리를 찧었고. 119 구급차\n로 병원에 호송되었다. 신체검진 시 의식은 명료하였으나 삼두근건반사(triceps deep tendon reflex)\n가 항진되어 있고, 손가락을 구부렸다 펴는 데 어려움이 있다.","answer":3,"answerLabel":"③","answerPage":356,"explanation":"척수손상은 교감신경계로의 신경지배를 차단해서\n혈압의 자동조절기능을 상실케 한다. 혈관수축을 하지\n못하고, 저혈압을 초래하며, 미주신경의 자극은 서맥을\n유발하여 저혈압을 더 악화시킨다. 말초혈관 확장으로 피부가\n따뜻하고 건조해지며 상당한 열손실을 초래한다. 신경성\n쇼크 증상은 손상을 입은 첫날 가장 뚜렷하고 이후 점차적으로\n줄어들어 10일에서 2주가 경과하면 안정된다. 자율신경반사\n항진에서는 고혈압이 동반되며 , 출혈성 쇼크에서는 맥박이\n빨라진다. 척수공동증은 척수손상 후 신경학적 기능이\n정답및애설 I 356\n뒤늦게 악화되는 환자에서 나타나는 합병증이다."},{"id":"c07-q077","chapterId":7,"number":77,"page":225,"stem":"이 환자에게 가장 적절한 중재는?","choices":["심폐소생술","도뇨관 삽입","심장율동전환","충분한 수액 정주","트렌델렌버그 자세"],"passage":"다음 지문을 읽고 질문에 딥もt시오(문제 73-77).\n50 세 남자가 지붕을 수리하던 중 발을 헛디뎌 흙바닥으로 떨어지면서 머리를 찧었고. 119 구급차\n로 병원에 호송되었다. 신체검진 시 의식은 명료하였으나 삼두근건반사(triceps deep tendon reflex)\n가 항진되어 있고, 손가락을 구부렸다 펴는 데 어려움이 있다.","answer":4,"answerLabel":"④","answerPage":357,"explanation":"척수손상 환자에서 이차손상은 척수의 허혈이 주된\n원인이다. 따라서 적정혈압 유지는 매우 중요하다. 평균\n동맥압이 85〜90 mmHg로 유지되도록 해야 한다.\n신경인성쇼크로 인한 저혈압상태는 말초혈관의 확장이 그\n원인이므로 생리적 수액을 충분히 공급해 주고 경우에\n따라서는 수혈도 같이 한다. 만약 충분히 수액을 주어\n중심 정맥압이 정상수준이 되었음에도 저혈압이 교정되지\n않을 때는 혈관수축제를 투여하여 평균동맥압을 유지해\n준다."},{"id":"c07-q078","chapterId":7,"number":78,"page":225,"stem":"흉수 1 번 손상이 있는 환자가 안면홍조와 함께 심한 두통을 호소한다 가장 적절한 중재는?","choices":["만니톨을 즉시 투여한다","마약성 진통제를 투여한다.","스테로이드 제제를 투여한다.","침상 머리를 평평하게 내려준다.","방광과 직장의 팽만 여부를 확인한다."],"answer":5,"answerLabel":"⑤","answerPage":357,"explanation":"흉수 6번 이상에서 손상에서 흔히 발생하는 교감신경의\n장애로 인한 자율신경 과다반사 증상이다. 주로 방광팽만,\n요도관 폐색, 분변매복, 불쾌감 등의 유해자극 시\n교감신경계가 흥분해서 나타나는 증상이므로, 이러한 문제가\n있는지 사정하고 원인을 제거해 주어야 한다."},{"id":"c07-q079","chapterId":7,"number":79,"page":226,"stem":"경추손상으로 인하여 Gardner-W이s 견인 치료를 받는 환자 간호로 적절한 것은?","choices":["견인 중에는 금식을 유지한다.","견인 중에는 과호흡을 피한다.","8시간마다 10분씩 견인을 풀어준다.","신체선열을 위해 트렌델렌버그 자세를 취한다","추의 무게를 올리기 전에 사지의 운동 및 감각 상태를 사정한다."],"answer":5,"answerLabel":"⑤","answerPage":357,"explanation":"척추골절 치료를 위하여 Gardner-Wells 같은\n견인장치를 이용할 수 있다. 두개골 전면에 두 개의 핀을\n사용하여 집게(tong)를 고정하고 추를 매달아 견인을\n시행한다. 추의 무게를 올리기 전후에 운동과 감각기능을\n사정한다."},{"id":"c07-q080","chapterId":7,"number":80,"page":226,"stem":"평소 건강하던 20세 환자가 3일 전부터 발열과 두통을 호소하다가 발작을 한 후 의식 수\n준이 저하되어 응급실에 호송되었다. 신체검진 시 목의 경직과 유두부종이 있었다면 가장\n우선적으로 시행해야 하는 검사는?","choices":["척수천자","경두개초음파","단순 두부촬영","뇌 자기공명영상","뇌 전산화단층촬영"],"answer":5,"answerLabel":"⑤","answerPage":357,"explanation":"초기 발열과 두통 후 의식저하, 발작 등은 중추신경계\n감염이 의심되는 증상이다. 유두부종은 두개내압이\n상승되었을 때 나타날 수 있는 증상으로, 감별진단을 위한\n뇌척수액검사 전에 반드시 뇌 전산화단층촬영 검사가\n필요하다."},{"id":"c07-q081","chapterId":7,"number":81,"page":226,"stem":"22세 대학생이 피로감 두통, 고열을 호소하며 내원하였다. 신체검진 상 경부경직과 다리\n의 점상출혈이 있었고, 뇌척수액 검사에서 그람음성균이 나왔다. 가장 가능성이 높은 원\n인균은?","choices":["Neisseria meningitidis","Listeria monocytogenes","Pseudomonas aeruginosa","Cryptococcus neoformans","Mycobacterium pneumonia"],"answer":1,"answerLabel":"①","answerPage":357,"explanation":"Neisseria meningitidis는 수막구균성 수막염(menin\ngococcal meningitis)의 원인균으로, 피로감, 두통, 고열\n등 막연한 증상과 함께 다른 수막염과는 달리 특징적으로\n붉은색 반점인 점상출혈이 동반된다. 혈류로 침범되어\n전신 감염을 초래하여 패혈증이나 파종성혈관내 응고증후군과\n같은 혈액응고장애를 초래할 수 있고, 급격하게 사망할 수도\n있다."},{"id":"c07-q082","chapterId":7,"number":82,"page":226,"stem":"수막구균성 수막염이 의심되는 환자의 뇌척수액 검사 결과는?","choices":["단백질 증가","포도당 증가","AFB 검사 양성","그람염색 음성반응","뇌척수액 압력 감소"],"answer":1,"answerLabel":"①","answerPage":357,"explanation":"수막구균성 수막염은 그람음성 세균감염으로\n뇌척수액검사상 뇌척수액 압력 증가, 단백질 상승, 포도당\n감소를 보인다. AFB 양성반응은 결핵성 수막염일 때\n나타나는 증상이다."},{"id":"c07-q083","chapterId":7,"number":83,"page":226,"stem":"수일간 발열이 지속되다 발작, 섬망, 의식저하를 주호소로 응급실에 내원한 환자의 뇌 자\n기공명영상 결과, 양쪽 측두엽에 음영이 증가되어 있다. 이 환자에게 경험적으로 적용해\n야 할 약제는?","choices":["Acyclovir","Ampicillin","Cefotaxim","Praziquantel","Streptomycin"],"answer":1,"answerLabel":"①","answerPage":357,"explanation":"발열 외에도 섬망과 의식저하 등 뇌실질을 침범한\n증상을 고려하면 뇌염일 가능성이 높다. 뇌염은 바이러스성\n뇌염이 가장흔하며, MRI 상전두엽 하부나측두엽에 병변을\n발견할 수 있다."},{"id":"c07-q084","chapterId":7,"number":84,"page":227,"stem":"전신 강직-간대성 발작으로 응급실로 이송된 환자의 의식이 회복되지 않은 상태에서 발\n작이 다시 시작될 우선적으로 제공할 중재는?","choices":["활력징후를 측정한다","다치지 않게 억제대로 환자를 묶는다.","혀를 깨물지 않도록 입에 설압자를 넣는다.","정맥경로를 확보하고 valium 5 mg을 천천히 투여한다.","의식 회복 유무를 확인하기 위해 강한 자극을 주어 환자를 깨운다."],"answer":4,"answerLabel":"④","answerPage":357,"explanation":"의식이 회복되지 않은 상태에서 전신 강직-간대성\n발작이 다시 나타났다면 간질지속증(status epilepticus)에\n준해서 발작을 멈추기 위한 적극적인 약물치료가 필요하다.\n발작이 있는 동안은 입안에 뭔가를 넣거나 억제대를 하면\n오히려 환자에게 더 큰 손상을 유발할 수 있다."},{"id":"c07-q085","chapterId":7,"number":85,"page":227,"stem":"고등학생이 선생님과 상담 중에 갑자기 순간적으로 메스꺼움을 느끼다가 기억이 없어졌\n다고 한다. 선생님은 학생이 멍하게 반응이 없으면서 입맛을 다시고 손을 만지작거리는 행\n동을 1 분 정도 반복하였다고 한다. 이 학생의 발작 유형은?","choices":["소발작","근간대발작","무긴장발작","복합부분발작","강직간대발작"],"answer":4,"answerLabel":"④","answerPage":357,"explanation":"전조증상인 메스꺼움이 있고 난 후 의식이 없어지고,\n의미 없는 행동을 반복적으로 취하는 자동증(automatism)\n이 보이는 것은 전형적인 복합부분발작 증상이다."},{"id":"c07-q086","chapterId":7,"number":86,"page":227,"stem":"간질지속증 환자에게 페니토인(phenytoin) 1 g 정맥주입이 처방되었다. 약물 투여와 관련\n된 간호중재로 옳은 것은?","choices":["포도당에 약물을 희석한다","분당 500 mg보다 빠른 속도로 주입한다.","약을 주입하는 동안 심전도를 기록하여 환자의 심장을 감시한다.","정맥 투여 직후 혈중 약물농도 검사를 시행한다.","치료적 혈중 농도는 20〜40 mcg/mL이다."],"answer":3,"answerLabel":"③","answerPage":357,"explanation":"페니토인 부하용량은 평소 투여보다 많은 용량이 들어가기\n때문에 한꺼번에 많은 용량이 주입 시 부정맥을 초래할 수\n있으므로, 분당 500 mg이 넘지 않는 속도로 주입하고\n반드시 심전도 모니터링이 필요하다. 또한 저혈압이 발생할\n수 있으므로 혈압도 주기적으로 체크한다. 정맥투여 약제는\n포도당에 희석할 경우 침전물이 생길 수 있으므로 반드시\n생리식염수에 단독투여 해야 한다. 치료적 혈중 농도는\n10~20 mcg/mL이다."},{"id":"c07-q087","chapterId":7,"number":87,"page":227,"stem":"io일 전에 발열, 콧물, 기침 등으로 감기 치료를 받은 환자에게 3일 전부터는 오심, 구토,\n식욕감퇴가 나타났다. 신체검진 상 양쪽 하지에서 시작된 쇠약은 점차 상지로 진행하고\n있으며 심부건반사가 감소되어 있다. 이 환자에게 의심되는 상태는?","choices":["길랑바레증후군","다발성경화증","중증근무력증","뇌수막염","뇌경색"],"answer":1,"answerLabel":"①","answerPage":357,"explanation":"길랑바레증후군은 상기도감염이나 위장관계 감염과\n같은 선행 감염 후 자가면역에 의해서 급성으로 발병하는\n말초신경의 수초퇴행성 질환이다. 말초신경 계 손상이므로\n심부건반사가 저하된다. 뇌경색이나 뇌수막염,\n다발성경화증과 같은 질환은 중추신경계 질환이므로\n심부건반사 저하는 보이지 않는다. 중증근무력증은 주로\n근위부 위약감으로 안검하수가 특징적 증상이며,\n심부건반사는 보존된다."},{"id":"c07-q088","chapterId":7,"number":88,"page":228,"stem":"23세 남자가 사지의 심각한 허약, 등의 통증, 하지의바늘로 쿡쿡 찌르는 느낌을 주호소\n로 응급실에 내원하였다. 2주 전 기관지염을 앓은 병력이 있고, 신체검진 상 근육의 힘은\n2-3/5점, 발한, 빈호흡, 빈맥이 있고, 혈압은 88/50 mmHg이다. 이 환자에게 의심되는\n상태는?","choices":["길랑바레증후군","다발성경화증","중증근무력증","뇌수막염","뇌경색"],"answer":1,"answerLabel":"①","answerPage":357,"explanation":"선행 감염이 있고, 하지에서부터 시작되는 근육위약감,\n저린감과 같은 경미한 감각 장애, 자율신경병증저혈압,\n부정吗 요정체. 장폐색 등)은 전형적인 길랑바레증후군의\n증상이다."},{"id":"c07-q089","chapterId":7,"number":89,"page":228,"stem":"45세 여자가 눈꺼풀이 처지고, 사물이 겹쳐 보이며, 콧소리와 발음이 어둔하고 연하장애\n를 호소하는데, 증상들이 오후에 심해지고 휴식을 취하면 쉬면 호전된다고 한다. 이 환자\n에게 의심되는 상태는?","choices":["길랑바레증후군","다발성경화증","중증근무력증","뇌수막염","뇌경색"],"answer":3,"answerLabel":"③","answerPage":357,"explanation":"중증근무력증은 근위부의 위약감이 특징적이어서\n안검하수, 복시, 연하장애, 발성장애 등이 특정적이다.\n근육을 많이 쓸수록 근위약감이 더 심해지므로, 자고\n일어나거나 쉬면 호전된다."},{"id":"c07-q090","chapterId":7,"number":90,"page":228,"stem":"중증근무력증 환자에게 나타나는 쇠약의 특성은?","choices":["아침에 가장 심함","안정 시 떨림과 동반됨","움직임 시 떨림과 동반됨","근위부가 원위부보다 심함","근육을 반복해서 사용하면 호전됨"],"answer":4,"answerLabel":"④","answerPage":357,"explanation":"중증근무력증은 근위부의 위약감이 특징적이어서\n안검하수, 복시, 연하장애, 발성장애 등이 나타난다. 근육을\n많이 쓸수록 근위약감이 더 심해지고, 자고 일어나거나 쉬면\n호전된다."},{"id":"c07-q091","chapterId":7,"number":91,"page":228,"stem":"중증근무력증이 의심되는 환자의 진단을 위해 시행하는 검사는?","choices":["뇌 CT","뇌 MRI","뇌파검사","텐실론검사","뇌척수액검사"],"answer":4,"answerLabel":"④","answerPage":357,"explanation":"중증근무력증은 신경근접합부의 손상으로\n신경전달물질인 아세틸콜린이 근육으로 잘 전달되지 않아서\n발생하는 질병이다. 항콜린에스테라제인 텐실론을 주입 후\n즉각적인 근력 향상 여부로 중증근무력증을 진단할 수 있다."},{"id":"c07-q092","chapterId":7,"number":92,"page":228,"stem":"중증근무력증 환자의 일상생활 유지를 위한 교육으로 적절한 것은?","choices":["콜린성 위기 증상이 나타나면 처방된 약을 증량해서 복용한다.","근육피로는 아침에 심하므로 낮에 활동할 수 있도록 일정을 짠다.","스트레스, 감염, 생리, 고열이 있을 때 콜린성 위기를 유발할 수 있다.","호흡근 움직임이 약하고 호흡곤란이 보이면 콜린성 위기를 의심해야 한다.","일부 항생제는 병용투여 시 증상이 더 악화될 수 있으므로 주의가 필요하다."],"answer":5,"answerLabel":"⑤","answerPage":357,"explanation":"근육의 피로는 근육을 많이 쓸수록 심해지므로,수면을\n취한 후인 오전에 활동을 주로 하도록 교육한다. 콜린성\n위기는 중증근무력증 약물이 과다했을 때 나타나는 증상으로\n발한, 과도한 눈물, 기도분비물 증가 등의 증상이 나타나므로 ,\n이 경우 약물의 용량을 줄이거나 중단한다. 스트레스, 감염과\n같은 증상은 중증근무력증 증상을 더 악화시킬 수 있고,\n이것을 근무력증 위기라고 한다."},{"id":"c07-q093","chapterId":7,"number":93,"page":229,"stem":"47세 여자가 자고 일어나면 괜찮은데 집안일을 하고 오후가 될수록 눈꺼풀이 처지고 말\n을 할 때 목소리가 변한다. 이 환자에게 가장 적절한 약물은?","choices":["Levodopa","Pregabalin","lamotrigine","Pyridostigmin","Carbamazepine"],"answer":4,"answerLabel":"④","answerPage":358,"explanation":"중증근무력 증은 신경근접합부에서 아세 틸콜린이\n근육으로 잘 전달되지 않아서 발생한다. 따라서\n항콜린에스 테라제를 투여하면 근육위약감이 개선된다 .\nLevodopa는 파킨슨병 치료제이고, carbamazepine,\nlamotrigine, pregabalin은 항간질약이다."},{"id":"c07-q094","chapterId":7,"number":94,"page":229,"stem":"오른 쪽 등이 강도의 칼에 찔린 환자의 신체검진 결과가 다음과 같을 때 가장 의심되는\n상태는?\n• 손상 이하 부위 우측 운동마비\n• 손상 이하 부위 우측 촉감, 위치감각, 진동감각 소실\n• 손상 이하 부위 좌측 통각과 온도감각 소실","choices":["전척수증후군","신경근증후군","후척수증후군","측방척수증후군","중심척수증후군"],"answer":4,"answerLabel":"④","answerPage":358,"explanation":"측방척수증후군(Brown-Sequard syndrome)은 자상,\n총상 또는 회전 손상으로 인해 척수의 한쪽만 손상되는 경우\n나타난다. 손상 이하 부위의 동측성 운동마비와 촉각, 위치,\n진동감각이 소실이 나타나고, 통각과 온도감각의 경우\n반대측이 소실된다."},{"id":"c07-q095","chapterId":7,"number":95,"page":229,"stem":"이 환자에게 가장 의심되는 상태는?","choices":["뇌전증","파킨슨병","알츠하이머병","정상압 수두증","출혈성 뇌졸중"],"passage":"다음 지문을 읽고 질문에 답하시오문제 95-96).\n72 세 남자가 친구들의 이름을 자꾸 잊어버리고. 발을 질질 끌며 걷고 자주 넘어지며. 요실금이\n심해졌다.","answer":4,"answerLabel":"④","answerPage":358,"explanation":"정상압 수두증의 3匚H 증상은 보행장애, 기억장애,\n요실금이다."},{"id":"c07-q096","chapterId":7,"number":96,"page":229,"stem":"이 환자에게 가장 적절한 치료는?","choices":["혈종제거술","뇌실-복강 단락술","면역 억제제 투약","스테로이드 부하 치료","항콜린에스테라제 투약"],"passage":"다음 지문을 읽고 질문에 답하시오문제 95-96).\n72 세 남자가 친구들의 이름을 자꾸 잊어버리고. 발을 질질 끌며 걷고 자주 넘어지며. 요실금이\n심해졌다.","answer":2,"answerLabel":"②","answerPage":358,"explanation":"전형적인 증상이 있는 정상압 수두증은 단락술(shunt\noperation로 호전될 수 있다. 가장 흔한 수술은 뇌실-복강\n단락술이다."},{"id":"c07-q097","chapterId":7,"number":97,"page":230,"stem":"뇌수막염 후 발생한 수두증으로 5일 전 뇌실-복강 단락술을 받은 아동이 두통과 어지럼\n증을 호소할 때 가장 의심되는 상태는?","choices":["과잉배액","단락 감염","단락 폐쇄","뇌실내 출혈","복강내 낭종"],"answer":1,"answerLabel":"①","answerPage":358,"explanation":"뇌척수액이 과다하게 배액되면 두통, 오심, 기립성\n저혈압과 같은 증상이 나타날 수 있다."},{"id":"c07-q098","chapterId":7,"number":98,"page":230,"stem":"다음 중 가장 악성인 뇌종양은?","choices":["뇌수막종","별아교세포종","뇌실막세포종","다형성 교모세포종","원발성 중추신경림프종"],"answer":4,"answerLabel":"④","answerPage":358,"explanation":"교모세포종은 가장 치명적인 뇌종양으로 환자의 약 3\n분의 1 이 1 년 정도 생존하며 , 5년 이상 생존하는 경우가\n5% 미만이다."},{"id":"c07-q099","chapterId":7,"number":99,"page":230,"stem":"이 환자에게 의심되는 상태는?","choices":["수두증","경막하혈종","경막외혈종","기저골 골절","지주막하출혈"],"passage":"다음 지문을 읽고 질문에 답하시오(문제 99-100).\n오토바이를 타다가 넘어진 환자의 뇌 CT 영상이 다음과 같다.","answer":3,"answerLabel":"③","answerPage":358,"explanation":"두개골의 내면과 경막(dura mater) 사이에 혈액이\n축적되어 CT 상 손톱모양 또는 볼록한 렌즈모양의 고밀도\n음영이 관찰되는 것으로 보아 경막외혈종이 의심된다."},{"id":"c07-q100","chapterId":7,"number":100,"page":231,"stem":"이 환자가 사고에 대해 이야기를 하던 중 갑자기 의식을 잃고, 왼쪽 팔다리 마비와 동공\n이 커졌다. 가장 적절한 치료는?","choices":["혈종제거술","코일색전술","보존적 치료","뇌실외 배액술","뇌실-복강 단락술"],"passage":"다음 지문을 읽고 질문에 답하시오(문제 99-100).\n오토바이를 타다가 넘어진 환자의 뇌 CT 영상이 다음과 같다.","answer":1,"answerLabel":"①","answerPage":358,"explanation":"의식이 떨어지고, 마비증상등신경학적 결손이 있고,\nCT 상에서 정중선 변위가 보이므로 수술적 치료가 필요한\n상황이다. 수술은 감압성 두개골절제술(decompressive\ncraniectomy)이나 개두술(craniotomy)을 시행하여 혈종을\n제거한다."},{"id":"c07-q101","chapterId":7,"number":101,"page":231,"stem":"지주막하출혈로 두개절제술을 받은 지 5일이 환자에게 경두개초음파(TCD) 검사를 시행\n하였다. 어떤 합병증을 확인하기 위한 검사인가?","choices":["재출혈","뇌혈관 연축","수술 후 감염","두개내압 상승","의식저하"],"answer":2,"answerLabel":"②","answerPage":358,"explanation":"경두개초음파는 혈류속도의 변화를 파악하여\n지주막하출혈의 합병증인 혀로간연축(vasospasm) 여부를\n확인하는 검사이다. ⑴ 혈류속도 120 cm/sec 이상인\n중증도 연축, (2) 혈류속도 200 cm/sec 이상인 중증\n연축, (3) 혈류 속도 증가가 24시간 이내에 50 cm/sec\n이상인 경우 지연성 허혈성 신경학적 결손(delayed ischemic\nneurologic deficits； 이ND)가 생길 가능성이 높다."},{"id":"c07-q102","chapterId":7,"number":102,"page":231,"stem":"두개내압 상승 위험이 있는 환자의 효과적인 뇌관류 유지를 위한 간호중재는?","choices":["활력징후 상 미열은 경과를 관찰한다.","환자의 안정을 지지하기 위해 앙와위를 취해준다.","동맥혈가스분석검사(ABGA)상 PaO 2 수치를 집중적으로 관찰한다.","호흡곤란 증상이 없다면 동맥혈가스분석검사(ABGA)는 시행하지 않는다.","발살바수기를 줄이기 위해 섬유식이를 제공하고, 침상변기를 이용하여 장운동을 도와준다."],"answer":5,"answerLabel":"⑤","answerPage":358,"explanation":"체온 상승은 혈관을 이완시켜 두개내압을 증가시킬 수\n있으므로 미열이라도 시원한 환경 조성 등의 중재가 필요하다.\n호흡곤란 증상이 없더라도 정기적인 동맥혈가스분 석검 사가\n필요하며, 결과 상 혈관 이완에 가장 큰 영향을 미치는\nPaCO2 수치를 잘 관찰해야 한다. 두개내압 상승 위험이\n있는 환자는 침상머리를 상승시킨다."},{"id":"c07-q103","chapterId":7,"number":103,"page":231,"stem":"다음의 뇌졸중 증상과 관련이 있는 혈관은?\n• 병변 반대측 안巴 체간 또는 팔 다리 이하의 위약 및 감각저하\n• 실어증\n• 무시증후군","choices":["전대뇌동맥","중대뇌동맥","후대뇌동맥","소뇌동맥","기저동맥"],"answer":2,"answerLabel":"②","answerPage":358,"explanation":"각 혈관별로 다음과 같은 뇌졸중 증상이 나타난다.\n• 전대뇌동맥: 병변 반대측 팔, 다리 이하의 위약 및 감각저하\n• 후대뇌동맥: 병변 반대측의 시야이상\n• 기저동맥: 운동실조, 사지의 위약 및 감각 저하, 구음장애, 동공\n비대칭, 시선이향, 환각, 초조, 기억상실\n• 소뇌동맥: 보행장애, 운동실조"},{"id":"c07-q104","chapterId":7,"number":104,"page":232,"stem":"급성 뇌경색으로 동맥 내 혈전용해술 시술 후 중환자실에 입원한 환자의 혈압이 180/100\nmmHg일 때 적절한 중재는?","choices":["Nicardipine 시간당 5 mg 정맥주입","Labetalol 10 mg 정맥주사","Hydralazine 5 mg 정맥주사","Carvedilol 25 mg 경구투약","경과관찰"],"answer":5,"answerLabel":"⑤","answerPage":358,"explanation":"급성기 뇌경색 혈압 조절 원칙 기준은 수축기 혈압\n220 mmHg 혹은 확장기 혈압이 120 mmHg를 넘지\n않는 경우 혈압조절이 불필요하며 경과를 관찰해야 한다.\n단, 대동맥 박리 , 심한 심부전, 고혈압 뇌증이 있는 경우\n신속한 혈압조절이 필요하다."},{"id":"c07-q105","chapterId":7,"number":105,"page":232,"stem":"뇌졸중으로 중환자실에 입원치료 중인 환자에게 담당 간호사가 그림 한 장을 보여주고\n그림의 상황을 설명하도록 요청하였다. 이는 NIHSS (NIH stroke scale) 검사 중 어느 항\n목에 해당하는가?","choices":["구음장애","최적의 응시","의식수준: 지시","최상의 언어능력","인식상실과 부주의 상태"],"answer":4,"answerLabel":"④","answerPage":358,"explanation":"지문에 제시된 예는 실어증 정도를 평가하는 항목인\n최상의 언어능력이다."},{"id":"c07-q106","chapterId":7,"number":106,"page":232,"stem":"뇌혈류를 증가시키는 상황은?","choices":["저체온증","교감신경 자극","세포의 pH 증가","동맥혈의 산소 감소","혈청 내 젖산의 증가"],"answer":5,"answerLabel":"⑤","answerPage":358,"explanation":"뇌의 혈류를 증가시키는 상태는 과탄산혈증, 젖산\n증가, 부교감신경 증가, 고체온, 세포의 pH 감소 등이다."},{"id":"c07-q107","chapterId":7,"number":107,"page":232,"stem":"뇌혈류 자동조절기전이 정상일 경우 뇌혈류를 일정하게 유지할 수 있는 뇌관류압의 범\n위는?","choices":["30-130 mmHg","40-140 mmHg","50—150 mmHg","60-160 mmHg","70—170 mmHg"],"answer":3,"answerLabel":"③","answerPage":358,"explanation":"뇌혈류 자동조절기전이 정상일 경우, 뇌혈류를 일정하게\n유지할수 있는 뇌관류압의 범위는 50-150 mmHg이다."},{"id":"c07-q108","chapterId":7,"number":108,"page":233,"stem":"다음 그림에서 a의 폐쇄로 발생할 수 있는 상태는?","choices":["우측 마비","두개내압 상승","모야모야병","각막반사소실","폐쇄성 수두증"],"answer":4,"answerLabel":"④","answerPage":358,"explanation":"A(몬로공)의 폐쇄는 폐쇄성 수두증을 초래한다."},{"id":"c07-q109","chapterId":7,"number":109,"page":233,"stem":"두부외상으로 인한 혈종제거 수술 후 중환자실에 입원한 환자의 활력징후와 두개내압이\n다음과 같을 때 뇌관류압은?\n• 혈압 90/60 mmHg\n• 맥박 100 회/분\n• 호흡 18 회/분\n• 두개내압 24 mmHg","choices":["26 mmHg이며 정상이다.","46 mmHg이며 정상이다.","26 mmHg이며 비정상이다.","46 mmHg이며 비정상이다.","46 mmHg이며 추가 징후를 확인해 보아야 한다."],"answer":4,"answerLabel":"④","answerPage":358,"explanation":"뇌관류압 二 평균동맥압 - 두개내압,\n평균동맥압 = (수축기혈압 + 이완기혈압 x2)/3\n정상 뇌관류압 70-100 mmHg"},{"id":"c07-q110","chapterId":7,"number":110,"page":233,"stem":"Phenytoin (Dilantin)의 첫 부하용량을 주사할 때 가장 주의해야 할 것은?","choices":["치료적 혈중 농도는 20-30 mg/mL이다.","부작용으로 피부발진, 치은증식증이 발생할 수 있다.","포도당(DW) 용액에 혼합하여 투약하는 것이 안전하다.","Phenytoin의 빠른 투약은 부정맥과 심정지를 초래할 수 있다.","항고혈압 약물을 투약 중이었다면 항고혈압 약물 용량을 증량해야 한다."],"answer":4,"answerLabel":"④","answerPage":358,"explanation":"Phenytoin 정맥투여 시 심근 억제, 부정맥, 심정지를\n일으키므로 50 mg/분보다 빠르게 투약해서는 안 된다.\n생리식염수 이외의 용액에 혼합할 경우 결정체로 침전할\n수 있다. 치료적 혈중 농도는 10~20 mg/mL이다. 약물\n상호작용으로 항고 혈압제의 작용을 강화시키므로 필요에\n따라 항고혈압 약물을 감량해야 한다. 피부발진,\n치은증식증은 가능한 부작용이므로 phenytoin을\n지속적으로 투약할 경우 환자에게 교육한다."},{"id":"c07-q111","chapterId":7,"number":111,"page":234,"stem":"이 환자에게 의심되는 상태는?","choices":["감염","두개내압 증가","콜린성 위기","급성 호흡부전","중증 근무력증 위기"],"passage":"다음 지문을 읽고 질문에 답하시오(문제 111-112).\n중증 근무력증 환자인 62 세 여자가 최근 식욕저하와 호흡곤란 증상이 심하여 중환자실에 입원\n후 약물 치료 및 경과 관찰 중이다. 오늘 아침 기관지분비물 증가, 느린호흡. 심각한 근육약화,\n서맥 및 발작 증상이 나타났다.","answer":3,"answerLabel":"③","answerPage":358,"explanation":"중증 무기력증은 아세틸콜린 수용체의 수를 감소시키는\n자가항체가 생성되는 자가면역 질환이다. 따라서\n항콜린에스터라제 약물 치료를 시행한다. 이 약물의 중요한\n부작용은 콜린성 위기로 심각한 근육약화, 약물 과다섭취 ,\n발작, 설사, 느린호흡, 기관지분비물 증가 및 기관지 경련의\n증상이 나타날 수 있다."},{"id":"c07-q112","chapterId":7,"number":112,"page":234,"stem":"이 환자에게 사용할 수 있는 응급약물은?","choices":["Flumazenil","Pheniramine","Acetylcysteine","Atropine sulfate","Sodium bicarbonate"],"passage":"다음 지문을 읽고 질문에 답하시오(문제 111-112).\n중증 근무력증 환자인 62 세 여자가 최근 식욕저하와 호흡곤란 증상이 심하여 중환자실에 입원\n후 약물 치료 및 경과 관찰 중이다. 오늘 아침 기관지분비물 증가, 느린호흡. 심각한 근육약화,\n서맥 및 발작 증상이 나타났다.","answer":4,"answerLabel":"④","answerPage":358,"explanation":"콜린성위기 해독제는 atropine sulfate다.\n정답및애설 I 358"},{"id":"c07-q113","chapterId":7,"number":113,"page":234,"stem":"길랑바레증후군과 관련 있는 균은?","choices":["Herpes simplex virus","Campylobactor jejuni","Staphylococcus aureus","Streptococcus pneumonia","Listeria monocytogeneses"],"answer":2,"answerLabel":"②","answerPage":359,"explanation":"레증후군은 염증성 말초신경병증으로 질환자의\n3분의 2에서 증상 시작 전 6주 이내에 상기도 감염이나\n위장염을 앓았다는 보고가 있다. 원인균은 Epstein-Barr\nvirus, Mycoplasma pneumoniae, Campylobacter\njejuni, cytomegak)vrus로 알려져 있다."},{"id":"c07-q114","chapterId":7,"number":114,"page":234,"stem":"수두증으로 뇌실-복강내 단락술을 받은 후 치료 중인 환자가 점점 악화되는 두통과 함\n께 극심한 어지러움을 호소하고 있다. 이 환자에게 의심되는 상태는?","choices":["과잉배액","단락 폐쇄","단락 감염","뇌실 내 출혈","두개내압 상승"],"answer":1,"answerLabel":"①","answerPage":359,"explanation":"뇌실-복강내 단락술 이후 발생하는 흔한 합병증에는\n과잉배액 현상이 있다. 이는 자세의 변화, 대상자의 키와\n관련이 있으며 고령의 경우 호발하며 두통과 어지러움 등의\n증상을 유발한다."},{"id":"c07-q115","chapterId":7,"number":115,"page":235,"stem":"뇌실외배액술(EVD) 장치의 배액량이 거의 없을 때 간호사가 가장 먼저 취해야 할 조치는?","choices":["EVD 배액을 잠근다.","주치의에게 보고한다.","뇌 CT< 찍을 준비를 한다.","Mannitol 정맥주사를 실시한다.","배액관의 진동(oscillation)을 확인한다. 다음 지문을 읽고 질문에 답하시오문제 U6-U7). 59세 남자가 교통사고로 복합외상 및 뇌출혈을 진단받고 중환실에서 장기간 치료 중이다. 주치 의는 환자의 회복 가능성이 희박한 것을 가족들에게 여러 차례 설명하였고 뇌사 가능성이 있음 을 알렸다. 가족들은 평소 환자가 연명치료를 원하지 않았고 가능하다면 장기기증을 하고 싶다 고 얘기한 것을 기억하고 담당간호사에 이에 관해 문의하였다."],"answer":5,"answerLabel":"⑤","answerPage":359,"explanation":"EVD 로 배액이 되지 않는 것을 확인하면 먼저\nosciHation을 확인하여 관의 개방성 여부를 확인하는\n것이 우선이다."},{"id":"c07-q116","chapterId":7,"number":116,"page":235,"stem":"이 환자의 가족이 원하는 절차를 진행하고자 할 때 담당간호사가 협력해야 할 기관은?","choices":["보건복지부","질병관리본부","생명윤리위원회","장기조직기증원(KODA)","장기이식관리센터(KONOS)"],"answer":4,"answerLabel":"④","answerPage":359,"explanation":"한국장기조직フI증원(Korea Organ Donation Agency；\nKODA)은 보건복지부가 지정한 국내 유일의 장기 및 조직\n구득기관으로 뇌사추정자 또는 조직기증 희망자 발생 시\n병원으로부터 통보를 받고, 기증 업무를 수행한다."},{"id":"c07-q117","chapterId":7,"number":117,"page":235,"stem":"이 환자의 장기기증을 위해 뇌사판정 절차가 시작되었다. 뇌사판정을 위한 뇌파검사 기\n준은?","choices":["20분 이상 평탄 뇌파","30분 이상 평탄 뇌파","40분 이상 평탄 뇌파","50분 이상 평탄 뇌파","60분 이상 평탄 뇌파"],"answer":2,"answerLabel":"②","answerPage":359,"explanation":"뇌사판정을 위한 뇌파검사 기준은 30분 이상 평탄\n뇌파가 지속되는 것이다."},{"id":"c07-q118","chapterId":7,"number":118,"page":235,"stem":"다음 중 신경성 쇼크에 대한 설명은?","choices":["고혈압과 역설적 서맥이 동반된 상태","척수외상 후 일시적인 이완성 마비상태","구해면체반사가 있는 급성하반신 마비의 상태","저혈량이 있으면서 심실빈맥과 고혈압을 일으키는 상태","교감신경 긴장이 저하되어 순환혈량과 혈압이 하강된 상태"],"answer":5,"answerLabel":"⑤","answerPage":359,"explanation":"신경성 쇼크는 교감신경 긴장이 저하되어 세동맥과\n세정맥이 확장되어 순환혈량과 혈압이 하강된 상태이다."},{"id":"c07-q119","chapterId":7,"number":119,"page":236,"stem":"수두증으로 뇌실-복강 단락술(VP shunt)을 받은 환자를 위한 간호중재로 적절한 것은?","choices":["뇌척수액의 색과 양을 관찰한다.","수술 직후부터 침상머리를 30° 올린 자세를 유지한다.","수술 4시간 이후에는 장음에 상관없이 유동식을 시작한다.","의식수준에 변화가 없는 것은 수술이 잘 되었다는 증거이다.","적절한 배액 여부를 확인하기 위하여 의식수준을 자주 모니터한다."],"answer":5,"answerLabel":"⑤","answerPage":359,"explanation":"VP 아iunt 수술 후에는 두부와 복부의 수술부위를\n잘 모니터해야 하며 장음을 확인하고 식이를 시작해야\n한다. 환자의 의식이 좋아지는 것은 VP shunt로 인해\n두개내압이 조절되고 있다는 증거이다. 급격한 배액이\n이루어질 수 있으므로 의식 및 활력징후 확인 후 침상머리\n높이를 조절한다."},{"id":"c07-q120","chapterId":7,"number":120,"page":236,"stem":"이 환자에게 의심되는 상태는?","choices":["척수성 쇼크","두개내압상승","중환자실 섬망","경련 전조증상","자율신경성 반사부전증"],"passage":"다음 지문을 읽고 질문에 답하시오(문제 120-121).\n24세 남자가 스키를 타다 넘어져 경추 4번(C4) 손상되어 집중치료를 받고 있다. 중환자실 입원\n10일째에 환자가 갑자기 홍조를 띠고 땀을 흘리며 두통을 호소하였다. 활력징후 측정 결과. 혈\n압 170/90 mmHg. 맥박 58 회/분. 호흡 22회/분. 체온 37.4℃이었다.","answer":5,"answerLabel":"⑤","answerPage":359,"explanation":"T6 이상의 척수에 손상이 있는 경우 자율신경성\n반사부전증(autonomic dysreflexia)이 발생할 수 있匚卜.\n이는 척수성 쇼크 기간이 끝난 후에 발생할 수 있는\n응급상황으로 손상된 척수의 아래 부위에서 유해자극에\n대한 무제한적인 교감신경 방전을 초래한다. 증상은\n손상부위 위쪽의 발한과 홍조, 아래쪽의 오한과 심각한\n혈관수축 등이다. 갑작스런 고혈압, 두통, 서맥, 비충혈,\n오심, 하지나 복부에서의 비정상적인 경련 등이 그 증상이다."},{"id":"c07-q121","chapterId":7,"number":121,"page":236,"stem":"이 환자에게 우선적으로 제공해야 할 간호중재는?","choices":["앙와위를 취해준다.","의식수준을 확인한다.","활력징후를 지속적으로 측정한다.","혈압조절을 위해 베타차단제를 투약한다.","유해자극이 있는지 확인하고 즉시 제거한다."],"passage":"다음 지문을 읽고 질문에 답하시오(문제 120-121).\n24세 남자가 스키를 타다 넘어져 경추 4번(C4) 손상되어 집중치료를 받고 있다. 중환자실 입원\n10일째에 환자가 갑자기 홍조를 띠고 땀을 흘리며 두통을 호소하였다. 활력징후 측정 결과. 혈\n압 170/90 mmHg. 맥박 58 회/분. 호흡 22회/분. 체온 37.4℃이었다.","answer":5,"answerLabel":"⑤","answerPage":359,"explanation":"자율신경성 반사부전증(autonomic dysreflexia)은\n유해자극에 의해 촉발된다. 가장 흔한 유해인자는 팽창된\n방광이나 장이다. 그 외 춥거나 뜨거운 환경 노출, 꽉 끼는\n옷이나 오랫동안 한 자세로 앉아 있을 때와 같이 피부에\n압력이 가해지는 경우, 욕창, 살 속으로 파고드는 발톱,\n배변이나 배뇨 훈련 중 장이나 방광 자극 등이 자극이 될\n수 있다. 이때 유해자극을 제거하는 것이 가장 우선적으로\n해야할 중재이다."},{"id":"c07-q122","chapterId":7,"number":122,"page":236,"stem":"중환자실 환자의 적절한 영양상태를 유지하기 위한 중재는?","choices":["현재 영양상태를 확인하기 위해 Albumin 검사를 한다.","환자의 영양상태를 증진하기 위하여 영양지원팀과 협업한다.","수술 환자의 경우 반드시 장음을 확인하고 식이를 시작한다.","경구영양이 가능한 환자의 경우 환자가 원하는 만큼만 제공한다.","위관영양은 기도흡인의 위험이 있으므로 가능하면 총비경구영양을 시행한다."],"answer":2,"answerLabel":"②","answerPage":359,"explanation":"최근의 영양상태를 잘 반영하는 지표는 pre-albumin\n이다. 중환자의 영양에 관한 최신 가이드라인에서는\n총비 경구영양보다는 경장영양을 추천하며 영양지원 팀과의\n협업 또한 좋은 방안으로 추천하고 있다."},{"id":"c07-q123","chapterId":7,"number":123,"page":237,"stem":"다음 중환자실 환자 중 재활 시작이 금기인 환자는?","choices":["경련/뇌전증 환자","인공호흡기 적용 환자","신경근육이완제를 사용하지 않는 환자","일반병실 전실을 앞두고 있으며 불안해하는 환자","RASS (Richmond agitation sedation scale) +1 ~ —2 수준 유지 환자"],"answer":1,"answerLabel":"①","answerPage":359,"explanation":"중환자 재활을 위해서는 신경근육이완제를 사용하지\n않으며 진정의 깊이가 얕고(RASS +1—2 수준을 유지하는\n환자) 협조가 가능할 정도이어야 한다. 섬망이 조절되지\n않거나, 초조-불안-흥분 상태에 있거나, 알코올 금단증상,\n경련/뇌전증이 있는 환자에게 재활을 시작하는 것은\n적절하지 않다."},{"id":"c07-q124","chapterId":7,"number":124,"page":237,"stem":"효과적인 중환자 재활의 적절한 빈도와 시간에 대한 권고기준은?","choices":["1 회 10분 이상, 하루 1 〜2회, 격일","1 회 10분 이상, 하루 1 〜2회, 매일","1 회 10분 이상, 하루 2〜3회, 매일","1 회 20분 이상 하루 1 〜2회, 매일","1 회 20분 이상, 하루 2〜3회, 매일"],"answer":5,"answerLabel":"⑤","answerPage":359,"explanation":"중환자 진료 시스템이 잘 갖춰진 외국의 경우, 연구를\n통해 1 회 20분 이상, 하루 2~3회, 매일 중환자 재활을\n하는 것을 권고하고 있다. 그러나 이는 중환자실에 24\n시간, 365일 중환자실 전문의와 전담 물리치료사 등을\n배치할 수 있는 일부 국가에서만 가능하다. 국내 현실과\n각 병원의 현실에 맞는 계획을 세워야 한다."},{"id":"c07-q125","chapterId":7,"number":125,"page":237,"stem":"이 환자의 신경학적 예후를 호전시키기 위해 사용하는 약물은?","choices":["Naloxone","Dimethyl sulfoxide","Thyrotropin-releasing hormone","Methylprednisolone","Nimodipine"],"passage":"다음 지문을 읽고 질문에 답하시오(문제 125-126).\n등산 도중 발을 헛디뎌 절벽에서 미끄러진 45세 남자 환자가 하지마비를 주호소로 중환자실\n에 입원하였다.","answer":4,"answerLabel":"④","answerPage":359,"explanation":"척수손상 환자의 신경학적 예후를 호전시키기 위해\n손상 8시간 이내에 고용량 스테로이드 요법(methyl\nprednisolone mega dose)을 시작한다. 이후 약물의\n용량을 점차 감량하면서 치료를 종료한다."},{"id":"c07-q126","chapterId":7,"number":126,"page":237,"stem":"이 약물 사용과 관련한 부작용을 예방하기 위한 간호중재로 적절한 것은?","choices":["진정제를 투여한다.","처방된 H2 blocker를 투여한다.","혈청 나트륨 수치를 모니터한다.","주기적으로 의식수준을 사정한다.","주기적으로 응고시간을 검사한다."],"passage":"다음 지문을 읽고 질문에 답하시오(문제 125-126).\n등산 도중 발을 헛디뎌 절벽에서 미끄러진 45세 남자 환자가 하지마비를 주호소로 중환자실\n에 입원하였다.","answer":2,"answerLabel":"②","answerPage":359,"explanation":"고용량 스테로이드 치료와 관련하여 위궤양이 발생할\n수 있으므로 이에 대한 관리가 필요하다. 처방된 H2\nblocker를 투여하고 경관영양 중이라면 영양공급 전\n위액의 양상을 잘 모니터한다."},{"id":"c07-q127","chapterId":7,"number":127,"page":238,"stem":"이 환자의 신체검진 소견이 의미하는 것은?","choices":["뇌교출혈","경막하혈종","경막상혈종","기저두개골절","지주막하혈종"],"passage":"다음 지문을 읽고 질문에 답하시오(문제 127-128).\n교통사고로 응급실을 통해 중환자실에 입원한 환자의 안와 및 귀 뒷부분의 반상출혈이 있었고,\n비루. 이루도 확인되었다.","answer":4,"answerLabel":"④","answerPage":359,"explanation":"기저두개골절 환자의 경우 신체검진 상 battle's sign(\n귀 뒤에서의 반상 출혈), raccoon's sign(안구주위의 반상출혈),\n비루와 이루에서의 뇌척수액 h기0 sing(달무리 징후) 등이\n나타날 수 있다."},{"id":"c07-q128","chapterId":7,"number":128,"page":238,"stem":"위 환자에게 발생할 수 있는 가장 심각한 합병증을 관리하기 위한 적절한 간호중재는?","choices":["손위생","침상안정","정서적 지지","수동적 관절가동운동","주기적인 의식수준 사정"],"passage":"다음 지문을 읽고 질문에 답하시오(문제 127-128).\n교통사고로 응급실을 통해 중환자실에 입원한 환자의 안와 및 귀 뒷부분의 반상출혈이 있었고,\n비루. 이루도 확인되었다.","answer":1,"answerLabel":"①","answerPage":359,"explanation":"기저두개골절 환자에게 발생할수 있는 가장 심각한\n합병증은 두개내 감염이다. 손위생은 감염관리에서 가장\n중요한 중재이다."},{"id":"c07-q129","chapterId":7,"number":129,"page":238,"stem":"이 환자에게 가장 먼저 투여해야 할 약물은?","choices":["Valproate","Phenytoin","Lamotrigin","Lorazepam","Phenobarbital"],"passage":"다음 지문을 읽고 질문에 답하시오(문제 129-130).\n간질지속증 의증(R/0 Status Epilepticus)으로 중환자실에 입원한 환자가 전신성 강직-간대 발\n작을 시작하였다.","answer":4,"answerLabel":"④","answerPage":359,"explanation":"간질지속증 환자에게 5분 이상 발작이 지속된다면\nV기ium이나 lorazepam을 정맥투여 한다."},{"id":"c07-q130","chapterId":7,"number":130,"page":238,"stem":"이 환자가 20년 동안 매일 소주를 2병씩 마셨다면 감별진단을 위하여 투여해야 할 약물은?","choices":["Thiamine","Naloxone","Flumazenil","Furosemide","50% dextrose water"],"passage":"다음 지문을 읽고 질문에 답하시오(문제 129-130).\n간질지속증 의증(R/0 Status Epilepticus)으로 중환자실에 입원한 환자가 전신성 강직-간대 발\n작을 시작하였다.","answer":1,"answerLabel":"①","answerPage":359,"explanation":"성인 간질지속증 환자의 경우 알코올성 뇌병증이\n의심되면 thiamine을 정맥주사 한다."},{"id":"c07-q131","chapterId":7,"number":131,"page":239,"stem":"뇌동맥류 진단을 받고 개두술을 시행한 환자에게 처방된 mannit이에 대한 내용으로 옳\n은 것은?","choices":["혈당을 상승시킬 수 있다.","혈액제제와 함께 주입할 수 있다.","저혈압인 경우에도 투여할 수 있다.","신장에 영향을 줄 수 있으므로 천천히 주입한다.","혈중 creatinine 검사 결과가 3.2 mg/dU인 경우 투여 가능하다."],"answer":1,"answerLabel":"①","answerPage":359,"explanation":"Mannit이은 두개 수술 후 두개내압을 조절하기 위한\n목적으로 투여되는 삼투성 이뇨제로 혈당을 상승시킬 수\n있다. 투여 전 결정이 있는지 약물을 점검하고 혈압과 혈중\n삼투압을 확인해야 하며 신기능이 손상된 환자에게는\n신중하게 투여해야 한다."},{"id":"c07-q132","chapterId":7,"number":132,"page":239,"stem":"다음 중 중환자의 섬망을 모니터하기 위해 추천되는 도구는?","choices":["RASS, MRC","DOS, ICDSC","RASS, ICDSC","DSM-IV, CAM","CAM-ICU, ICDSC"],"answer":5,"answerLabel":"⑤","answerPage":360,"explanation":"중환자의 섬망 평가도구로 가장 신뢰도가 높은 도구는\nCAM 시CU 와 ICDSC이다."},{"id":"c07-q133","chapterId":7,"number":133,"page":239,"stem":"반감기가 짧고 활성 대사산물이 없으며 아편양-보존 효과가 있어 중환자에게 진정 관련\n섬망 발생 부작용의 위험이 작은 진정제는?","choices":["Propofol","Diazepam","Lorazepam","Midazolam","Dexmedetomidine"],"answer":5,"answerLabel":"⑤","answerPage":360,"explanation":"Dexmedetomidine은 선택적 a2-수용체 작용제로\n짧은 반감기 등 여러 가지 이점이 있어서 최근 많이 사용되는\n진정제이다. 그러나 저혈압, 서맥 등의 부작용이 있다."},{"id":"c07-q134","chapterId":7,"number":134,"page":239,"stem":"이 환자가 구토와 발작을 보인다면 가장 먼저 해야 할 검사는?","choices":["뇌파검사","뇌혈관조영술","뇌척수액검사","뇌 자기공명영상","뇌 전산화단층촬영"],"passage":"다음 지문을 읽고 질문에 답하시오(문제 134-136).\n23세 여자 환자가 두통. 고열, 경부강직으로 응급실을 통해 중환자실에 입원하였다.","answer":5,"answerLabel":"⑤","answerPage":360,"explanation":"급성 치료가 필요한 다른 신경계 질환과 감별을 위해서는\nCT 검사를 가장 먼저 시행해야 한다."},{"id":"c07-q135","chapterId":7,"number":135,"page":240,"stem":"주치의가 이 환자에게 요추천자 처방을 내리고 검사를 준비하고 있다. 환자에게 적용할\n간호중재로 옳은 것은?","choices":["검사 전 방광을 비운다.","요오드 알레르기를 확인한다.","검사를 위해 복위를 취해준다","검사 후 4시간은 금식을 유지한다.","검사 후 적어도 6시간은 침상머리를 30O 이상 올린 자세를 취해준다."],"passage":"다음 지문을 읽고 질문에 답하시오(문제 134-136).\n23세 여자 환자가 두통. 고열, 경부강직으로 응급실을 통해 중환자실에 입원하였다.","answer":1,"answerLabel":"①","answerPage":360,"explanation":"요추천자 전 방광과 장을 비우게 하고 검사과정을\n설명해야 한다. 검사를 위해 측위를 취하여 다리를 굽히게\n하고 대퇴를 복부에 끌어당겨 붙여 다리 사이에 베개를\n넣어 고정시킨다. 검사 후에는 복압을 증가시켜\n요추천자부위가 밀폐되도록 돕기 위해 복부 아래 베개를\n대주고 삽입부위의 부종, 발적 및 배액 유무를 관찰한다.\n검사 후 두통을 감소시키기 위해 첫 2~3시간은 편평한\n곳에서 앙와위 혹은 복위를 취하도록 한다."},{"id":"c07-q136","chapterId":7,"number":136,"page":240,"stem":"이 환자의 뇌척수액 검사 결과가 다음과 같았다. 가장 의심되는 상태는?\n• 252 mmH2O\n• 단백질 117 mg/dL\n• 포도당 25 mg/dL\n• 백혈구 1250 cells/mm3\n• 균검사 Gram stain negative. Neisseria 배양","choices":["결핵수막염","무균성 수막염","진균성 수막염","수막구균수막염","바이러스성 수막염"],"passage":"다음 지문을 읽고 질문에 답하시오(문제 134-136).\n23세 여자 환자가 두통. 고열, 경부강직으로 응급실을 통해 중환자실에 입원하였다.","answer":4,"answerLabel":"④","answerPage":360,"explanation":"제시된 수치는 수막구균 수막염인 경우 예상되는\n뇌척수액 검사 결과이다. 정상 뇌척수액 검사 결과는 다음과\n같다.\n• 압력 80-200 mmHg\n• 백혈구 0-5 cells/mncP\n• 포도당 50-75 mg/dL\n• 단백질 15-40 mg/dL\n• 균검사음성"},{"id":"c07-q137","chapterId":7,"number":137,"page":240,"stem":"허혈성 뇌졸중 환자에게 정맥내 tPA(tissue plasminogen activator) 치료는 발병 후 몇\n시간 이내에 적용할 것을 권고하는가?","choices":["1 시간","2시간","3시간","4.5시간","5.5시간"],"answer":4,"answerLabel":"④","answerPage":360,"explanation":"이상 허혈성 뇌졸중 환자에서 정맥내 tPA 치료는\n발병 4.5시간 이전에 적용할 것을 권고하고 있다."},{"id":"c07-q138","chapterId":7,"number":138,"page":240,"stem":"파킨슨병 진단으로 levodopa를 처방받은 환자에게 교육해야 할 내용은?","choices":["코피가 날 수도 있다.","고단백 식이는 피해야 한다.","부작용으로 얼굴이 부울 수 있다.","양치 후 매일 아침 잇몸 마사지를 해야 한다.","오심을 예방하기 위해 음식물과 함께 복용한다."],"answer":2,"answerLabel":"②","answerPage":360,"explanation":"고단백식0 느 levodopa의 흡수를 방해할 수 있으므로\n피해야 한다."},{"id":"c07-q139","chapterId":7,"number":139,"page":241,"stem":"고혈압과 당뇨를 앓고 있는 78세 여자가 교통사고로 인한 복합외상으로 중환자실에 입\n원하였다. 환자는 깊은 혼수상태이며 인공호흡기, 승압제, 지속적 신대체요법을 적용하\n고 있으나 활력징후가 불안정하다 주치의는 환자 상태에 대해 설명하고 사망의 위험이\n있음을 알렸으며 가족들은 생애말기 치료에 대해 의사결정을 앞두고 있다. 가족들을 위\n한 간호로 적절하지 않은 것은?","choices":["가족의 심정을 이해하고 존중한다.","가능한 한 같은 의료진의 돌봄을 받도록 한다.","가족구성원이 합의를 이룰 수 있도록 돕는다.","가족들이 미리 계획을 세울 수 있도록 돕는다.","사망‘이나 ‘죽음이라는 단어는 사용하지 않는다."],"answer":5,"answerLabel":"⑤","answerPage":360,"explanation":"사망‘, ‘죽음 등의 단어를 의도적으로 사용하지 않는\n것은 의사결정에 방해가 된다. 가족들이 미리 계획을 세울\n수 있도록 돕고 시기적절한 의사소통을 할 수 있도록\n지지해야 한다."},{"id":"c07-q140","chapterId":7,"number":140,"page":241,"stem":"일과성 허혈발작의 약물 치료에 우선적으로 포함되는 것은?","choices":["Aspirin","Heparin","Dipyridamole","Beta blocker","Calcium channel blocker"],"answer":1,"answerLabel":"①","answerPage":360,"explanation":"일과성 허혈발작의 치료 목표는 뇌졸중으로 진행되는\n것을 막는 것는 것이다. 일차적으로 혈소판 응집억제제\n사용하고 혈압과 증상을 조절하며 원인을 찾아야 한다."},{"id":"c07-q141","chapterId":7,"number":141,"page":241,"stem":"파열성 뇌동맥류 환자의 뇌혈관 연축을 예방하기 위해 사용하는 약물은?","choices":["Mannitol","Nimodipine","Vasopressin","Valproic acid","Dexamethasone"],"answer":2,"answerLabel":"②","answerPage":360,"explanation":"Nimodipine은 calcium channel blocker로\n뇌동맥류 파열로 인한 지주막하 출혈 환자의 혈관연축을\n예방하기 위하여 투여한다."},{"id":"c07-q142","chapterId":7,"number":142,"page":241,"stem":"중환자실에 입원 중인 환자가 지시를 따르지 못했으나, 통증자극을 주니 눈을 뜨고 간\n호사의 손을 밀치며“아 뭐야”라고 하였다. 그러나 이름과 장소를 묻는 질문에는 대답을\n하지 않았다. 이 환자의 GCS 점수는?","choices":["3 점","5 점","7 점","10 점","12 점"],"answer":4,"answerLabel":"④","answerPage":360,"explanation":"눈뜨기 반응(eye opening) 2점, 말하기 반응(verbal\nresponse) 3점, 운동 반응(motor response) 5 점."},{"id":"c07-q143","chapterId":7,"number":143,"page":241,"stem":"다음 중 항발작 약물인 야】enytoin의 투약이 효과가 없는 발작은?","choices":["소발작","간질지속증","정신운동발작","긴장—간대발작","두부 외상을 동반한 발작"],"answer":1,"answerLabel":"①","answerPage":360,"explanation":"Phenytoin은 소발작의 치료에는 효과가 없다.\n소발작에는 trimethadione, 이onazepam,\nethosuximide, v기proic acid를 사용해야 한다."},{"id":"c07-q144","chapterId":7,"number":144,"page":242,"stem":"성인 중환자의 통증관리에 대한 내용으로 옳은 것은?","choices":["Fentanyl은 빠른 진통효과가 필요할 때 유용하다.","환자가 통증을 호소하는 즉시 관리계획을 수립한다.","말기 뇌종양 환자의 통증 조절에는 morphine이 가장 유용하다.","‘정기적인 진통제 투약‘보다는 ‘필요시 사용하는 방법이 좋다.","Acetaminophen을 투여하고 있는 환자는 신부전 및 위장관 출혈 여부를 잘 모니 터해야 한다."],"answer":1,"answerLabel":"①","answerPage":360,"explanation":"모든 중환자에게 사전에 통증 관리 계획을 수립해야\n하며 지속적인 통증 조절을 위해서는 정기적인 주사나\n지속적인 주입이 효과적이다. Ketor이ac 은 5일 이상\n사용해선 안 되며, 신부전 및 출혈 여부를 잘 모니터해야\n한다."},{"id":"c07-q145","chapterId":7,"number":145,"page":242,"stem":"WarfarinOl 과량 투여된 환자를 위해 사용하는 약물은?","choices":["Atropine","Naloxone","Vitamin K","Acetylcysteine","Protamine sulfate"],"answer":3,"answerLabel":"③","answerPage":360,"explanation":"Warfarine 과량 투여 시 해독제는 비타민 K 이다.\n헤파린의 길항제는 protamine s니fate이다."},{"id":"c07-q146","chapterId":7,"number":146,"page":242,"stem":"무수축, 무맥성 심실빈맥, 심실세동 등 모든 심정지 리듬에 사용할 수 있는 일차약물은?","choices":["Epinephrine","Atropine","Lidocaine","Amiodarone","Vasopressin"],"answer":1,"answerLabel":"①","answerPage":360,"explanation":"모든 종류의 심정지 리듬에 사용할수 있는 일차약물은\nepinephrine 이다."},{"id":"c07-q147","chapterId":7,"number":147,"page":242,"stem":"처방된 용량보다 과용량으로 헤파린이 주입되고 있을 때 적절한 간호중재는?","choices":["주치의에게 보고한다.","대상자의 aPTT 수치를 측정한다.","10분 이상에 걸쳐 protamine sulfate 50 mg을 정맥주입 한다.","헤파린이 주입된 후 경과된 시간과 주입된 헤파린의 양을 확인한다.","치료적 효과를 증가시키기 위해 비타민 K 와 protamine sulfate를 함께 투여한다."],"answer":4,"answerLabel":"④","answerPage":360,"explanation":"헤파린은 체내에서 신속하게 대사되기 때문에 투여한\n용량과 경과시간을 파악하는 것이 중요하다. 헤파린의\n해독제는 protamine s니fate이며 용량은 투여된 헤파린의\n양과 경과시간에 따라 결정된다."},{"id":"c07-q148","chapterId":7,"number":148,"page":243,"stem":"다음은 어떤 질환에 대한 설명인가?\n• 정상적인 신경 자극의 전도가 이루어지지 않아 증상이 발생한다.\n• 뇌와 척수에 있는 수초와 신경 축삭돌기가 파괴되는 만성 질환이다.\n• 뇌척수액 검사 상 clonal IgG bands. MRI. CT 및 근육 생검으로 진단한다.\n• 갑작스럽게 진행되는 사지허약. 근육경련. 안구진탕. 진전. 불안정한 결음걸이. 피로. 방광 기\n능장애. 시각장애 또는 실명 및 우울 등의 증상이 나타난다.","choices":["파킨슨병","중증근무력증","알츠하이머병","다발성 경화증","길랑바레증후군"],"answer":4,"answerLabel":"④","answerPage":360,"explanation":"다발성 경화증은 원인불명, 자가면역 또는 유전적\n요인으로 인해 발생하며 진행속도에 따라 4가지 형태(양성/\n재발-완화성/1 차성 진행성/2차적 진행성)로 분류된다.\n약물치료, 지지간호, 질병 악화요인 교육 및 관리 등의\n중재가 요구된다."},{"id":"c07-q149","chapterId":7,"number":149,"page":243,"stem":"뇌하수체종양을 진단받고 경접형동 접근법(transsphenoidal appproach； TSA) 수술 후\n집중치료를 받고 있는 검사 결과가 다음과 같을 때 적절한 간호중재는?\n• 요비중 1.001\n• 혈청 나트륨 152 mEq/L\n• 혈청 삼투질 농도 332 mOsm/Kg\n• 소변 삼투질 농도 243 mOsm/Kg","choices":["고혈압 감시","이뇨제 투여","감염의 징후 관찰","의식수준 변화 관찰","코분비물 양상 관찰"],"answer":4,"answerLabel":"④","answerPage":360,"explanation":"지문에 제시된 수치는 요붕증의 검사소견이다. TSA\n수술 이후 올 수 있는 가장 흔한 합병증은 요붕증이며,\n이는 항이뇨호르몬(ADH) 부족 때문에 발생한다. 이 경우\n섭취와 배설, 탈수 증상(피부 긴장도 저하, 건조한 피부, 움푹\n들어간 안구, 무력감, 소변량 감소 및 의식수준 변화를 잘\n모니터해야한다."},{"id":"c07-q150","chapterId":7,"number":150,"page":243,"stem":"뇌종양절제술 후 중환자실에서 치료 중인 환자의 소변량이 감소하고 요비중이 증가하였\n고, 혈액검사에서 저나트륨혈증과 삼투질 농도 저하가 확인되었다. 이 환자에게 적절한\n간호는?","choices":["DDAVP 를 투약한다.","Vasopressin을 투여한다.","Beta blocker를 투약한다.","0.45% N/S 를 정맥내로 주입한다.","혈청 나트륨 수치를 시간당 1 mEq 미만의 속도로 교정한다."],"answer":5,"answerLabel":"⑤","answerPage":360,"explanation":"제시된 지문은 항이뇨호르몬부적절증후군이ADH)\n을 시사한다. SIADH의 경우 고장성 생리식염수로\n저나트륨혈증을 서서히 교정하고 수분섭취를 제한한다.\n필요한 경우 이뇨제를 투여한다."},{"id":"c07-q151","chapterId":7,"number":151,"page":244,"stem":"지주막하출혈의 수술적 중재 후 합병증 예방을 위한 뇌혈류 증가 방법으로 적절한 것은?","choices":["Nimodipine을 투여한다.","중심정맥압을 4~5 mmHg로 유지한다.","Dopamine을 사용하여 혈압을 높게 유지한다.","수축기 혈압을 100〜 120 mmHg 사이로 유지한다.","해마토크리트를 증가시켜 산소 운반을 돕도록 한다."],"answer":1,"answerLabel":"①","answerPage":360,"explanation":"Dopamine은 natriuresis와 소변량을 증가시켜\n잠재적으로 문제를 가져올 수 있으며 , 고혈장 용량을\n유지하려는 것에 방해가 될 수 있다. 혈압 유지를 위해서는\nphenylephrim이나 norepinephrine을 사용한다. 중심\n정맥압은 10~12 mmHg 사이로 유지하도록 하고, 혈압은\n환자의 기본 혈압보다 15~20% 정도 높게 유지한다.\n고혈량 치료를 하면 헤마토크리트는 감소한다."},{"id":"c07-q152","chapterId":7,"number":152,"page":244,"stem":"다음 중 두개내압 상승의 초기 증상 및 징후에 해당하는 것은?","choices":["고열","두통","맥압 증가","맥박수 감소","시신경 유두부종"],"answer":2,"answerLabel":"②","answerPage":360,"explanation":"혈압과 맥압의 증가, 서맥, 불규칙적 호흡은 두개내압\n상승과 관련된 쿠싱 3대 징후(Chshing's triad)이다. 이러한\n쿠싱 3대 징후와 고열, 유두부종은 초기보다는 진행된\n두개내압 상승의 증상 및 징후이다."},{"id":"c07-q153","chapterId":7,"number":153,"page":244,"stem":"두개내압 상승을 방지하기 위한 간호중재로 적절한 것은?","choices":["발살바수기를 유도한다.","침상머리를 30°로 유지한다.","트렌델렌버그 자세를 취해준다.","PaCO, 45 mmHg 이상으로 유지한다.","호기말양압(PEEP) 을 15 cmH2O 이상으로 유지한다."],"answer":2,"answerLabel":"②","answerPage":361,"explanation":"발살바수기와 트렌델렌버그 자세는 복압과 흉압의\n상승으로 정맥 귀한을 방해한다. 고탄산혈중은 뇌혈관을\n확장시켜 뇌혈류량을 증가시킨다. 부적절한 PEEP 은\n흉강내압을 증가시ヲ I고 중심정맥압을 높여 두개내압 상승을\n유발 시킨다. 두개내압 상승 환자의 경우 PEEP 은 10\ncmH2O 이하로 적용한다."},{"id":"c07-q154","chapterId":7,"number":154,"page":244,"stem":"두개내압을 낮추기 위한 mannit이 치료에 대한 설명으로 옳은 것은?","choices":["저칼륨혈증을 초래한다.","체액량 과다에 주의한다.","가능한 한 천천히 주입한다.","정맥 주입 시 필터 수액세트를 사용한다","주입 시 혈청 삼투질 농도를 300 mOsm/L 미만으로 유지한다."],"answer":4,"answerLabel":"④","answerPage":361,"explanation":"mannit이은 혈액 ■ 뇌 장벽을통과하지 못하며 뇌조직의\n세포내액을 혈장으로 끌어간다. 최대효과는 15〜22분\n사이로 15분에 걸쳐 빠르게 정주해야 한다. 혈청 삼투질\n농도는 310~315 mOsm/L 정도로 유지하면서 320\nmOsm/L 이상 올라가지 않도록 하며, 신장으로 배설되므로\n신장질환이 있는 경우 사용하지 않는다. 부작용으로 수분,\n전해질 불균형고칼륨혈증), 심부전, 탈수 등이 나타날 수\n있다."},{"id":"c07-q155","chapterId":7,"number":155,"page":245,"stem":"이 환자에게 가장 먼저 시행해야 하는 것은?","choices":["뇌 전산화단층촬영을 실시한다.","뇌 자기공명영상을 촬영한다.","기도삽관을 시행한다.","응급수술을 준비한다.","진정제를 투여한다."],"passage":"다음 지문을 읽고 질문에 답하시오(문제 155-156).\n뇌출혈로 응급수술을 받고 중환자실에 입원한 환자가 신음소리만 내고, 왼쪽 동공이 이전보다\n커지고 느려졌다. 활력징후는 혈압 180/90 mmHg. 체온 37 化, 맥박 58 회得, 호흡 12회/분,\nICP는 14 mmHg에서 25 mmHg로 변화하였다.","answer":1,"answerLabel":"①","answerPage":361,"explanation":"뇌간 압박 증상이 아직 보이지 않고, 두개내압 상승이\n의심되면 뇌 전산화단층촬영을 바로 시행한다."},{"id":"c07-q156","chapterId":7,"number":156,"page":245,"stem":"이 환자의 동공 반응의 변화로 미루어볼 때 의심할 수 있는 상태는?","choices":["뇌경색","안압의 상승","두개내압 상승","시신경의 손상","뇌조직의 탈출"],"passage":"다음 지문을 읽고 질문에 답하시오(문제 155-156).\n뇌출혈로 응급수술을 받고 중환자실에 입원한 환자가 신음소리만 내고, 왼쪽 동공이 이전보다\n커지고 느려졌다. 활력징후는 혈압 180/90 mmHg. 체온 37 化, 맥박 58 회得, 호흡 12회/분,\nICP는 14 mmHg에서 25 mmHg로 변화하였다.","answer":5,"answerLabel":"⑤","answerPage":361,"explanation":"이 환자는 의식 변화 및 쿠싱 3대 징후 등 두개내압\n상승 징후가 있다."},{"id":"c07-q157","chapterId":7,"number":157,"page":245,"stem":"뇌출혈로 응급수술을 받은 환자가 다음 날 아침, 의사소통이 잘 되지 않고, 통증 자극에\n만 눈을 뜨며, 신음소리만 내고, 자극에 대해 피하려고 몸을 들썩이는 반응을 보인다 이\n환자의 글래스고 혼수척도(Glasgow Coma scale； GCS) 총점은?","choices":["5","6","7","8","9"],"answer":4,"answerLabel":"④","answerPage":361,"explanation":"글래스고혼수척도\n눈뜨기 (Eye Opening： E)\nET ： 자발적으로(spontaneous)\nE-3 ： 음성에 의해(to speech)\nE-2 ： 통증에 의해(to pain)\nE 너: 눈뜨지 않음(none)\n말하기\n(Best Verbal Response： V)\nV -5 ： 지남력 양호(orientated)\nV -4 ： 대화혼란(conhjsed conversation)\nV -3 ： 언어 혼란(inappropriate words)\nV -2： 이해 불가능한 소리\n(incomprehensible sounds)\nV -1： 발어하지 않음(none)(기관절개 •\n삽관시 : T\n운동\n(Best Motor Response： M)\nM-6 ： 명령에 따름(obey commands)\nM-5 ： 통중부위 인식 가능(localize pain)\nM-4 ： 회피굴곡 반응(withdraws)\nM-3 ： 이상굴곡반응(abnorm기 flexion)\nM-2 ： 사지신전 반응(extension)\nM-1 ： 전혀 움직이지 않음(none)"},{"id":"c07-q158","chapterId":7,"number":158,"page":245,"stem":"신경계 중환자실에 입원한 환자의 혈압이 180/90 mmHg, 체온 37.1℃, 맥박 58회/분 호\n흡 12회/분, ICP가 25 mmHg일 때 뇌관류압은?","choices":["88 mmHg","90 mmHg","95 mmHg","75 mmHg","54 mmHg"],"answer":3,"answerLabel":"③","answerPage":361,"explanation":"• 뇌관류압(CPP) = 평균동맥압(MAP) - 두개내압(ICP)\n• MAP ： (180-90) / 3 + 90 = 120 mmHg\n• CPP ： 120- 25 = 95 mmHg"},{"id":"c07-q159","chapterId":7,"number":159,"page":245,"stem":"두개내압 상승이 시작되면 가장 먼저 나타나는 보상기전은?","choices":["심박수 저하","맥압의 증가","뇌혈관의 확장","뇌혈액량의 감소","수축기압의 상승"],"answer":4,"answerLabel":"④","answerPage":361,"explanation":"두개강 내 부피 증가의 초기에는 뇌척수액과 혈액의\n완충작용으로 인해 두개강 내 압력의 증가를 보상하지만\n뇌척수액이나 혈액으로 조절할 수 있는 한계치를 넘어서면\n보상부전 상태가 된다. 뇌혈관의 확장은 뇌혈류량을\n증가시키고 수축기 혈압의 상승과 분당 60회 이하의 서맥,\n맥압의 증가는 두개내압에 상승되었을 때의 증상이다."},{"id":"c07-q160","chapterId":7,"number":160,"page":246,"stem":"정확한 두개강 내압 측정을 위한 도관 삽입 부위는?","choices":["경막하 공간","경맥외 공간","뇌실 내 공간","지주막하 공간","뇌실질 조직 내 공간"],"answer":3,"answerLabel":"③","answerPage":361,"explanation":"뇌실 내 측정은 정확성이 좋고 영점 보정이 쉽고\n뇌척수액에 대한 검사가 가능하며 뇌척수액 배액을 통해\n두개강 내압을 조절할 수 있다. 경막하, 지주막하, 경막외\n공간에서의 측정은 비교적 덜 침습적이라는 장점은 있으나\n기구의 위치에 따라 정확히 측정하지 못하는 단점이 있다."},{"id":"c07-q161","chapterId":7,"number":161,"page":246,"stem":"두개내압 상승의 만성증상 및 징후를 올바르게 설명한 것은?","choices":["복시가 발생한다.","저체온증이 나타난다.","두통은 저녁에 심하다.","망막유두 출혈이 발생한다.","병소의 반대쪽에 불완전 편마비가 나타난다."],"answer":1,"answerLabel":"①","answerPage":361,"explanation":"두통은 수면 중 이산화탄소 분압이 증가되고 뇌혈관이\n확장되어 두개내압이 상승하므로 아침에 심하다. 외전신경을\n뇌간부터 안와까지 두개기저부를 따라 분포하는데 , 두개내압\n항진 시 뇌 및 주위 구조물로부터 압력을 받아 복시가 발생할\n수 있다. 망막 유두 출혈과 불완전 편마비는 초기 증상。に卜."},{"id":"c07-q162","chapterId":7,"number":162,"page":246,"stem":"두개내압 상승 환자를 위한 간호에 해당하는 것은?","choices":["과다환기를 적용한다.","저산소증을 모니터한다.","항경련제를 지속적으로 투여한다.","예방적 목적으로 항생제를 투여한다.","반드시 두개강 내압 감시 장치를 적용한다."],"answer":2,"answerLabel":"②","answerPage":361,"explanation":"항경련제는 초기에 사용하는 것은 좋지만 간질 예방을\n위한 지속적 투여는 권유되지 않는다. 예방적 항생제의\n투여가 입원 기간이나 사망률을 줄이지 않는다. CT 촬영\n상 이상소견(혈증, 좌상, 부종, 뇌탈출)이 있는 경우에만\n두개강 내압 감시 장치를 필요로 한다. 이상적인 탄산가스\n분압은 25~30 mmHg이며 25 mmHg 이하의 경우\n뇌관류의 저하를 유발한다."},{"id":"c07-q163","chapterId":7,"number":163,"page":246,"stem":"뇌척수액 누출 환자 간호에 대한 설명 중 옳은 것은?","choices":["침상머리를 50° 이상으로 유지한다.","감염 예방을 위해 항생제를 투여한다.","기저골 골절로 인한 뇌척수액 누출은 경과가 나쁘다.","5〜7일이 지난 후에도 누출이 지속된다면 수술을 한다.","콧물의 포도당 농도가 혈당의 60%라면 뇌척수액 누출을 의심한다. 다음 지문을 읽고 질문에 답하시오(문제 164T67). 60세 남자가 30분 전에 발생한 오른쪽 팔과 다리의 마비 및 오른쪽 얼굴마비를 주호소로 응급실로 내원하였다 활력징후는 170/90-36.9-92-24이고 눈을 맞출 수 있지만 질문에 대답하지 못한다"],"answer":5,"answerLabel":"⑤","answerPage":361,"explanation":"뇌척수액의 누출이 있는 환자의 경우 침상머리를 30°\n이하로 유지하여야 하며 예방적 항생제의 사용은 수막염을\n줄여주지 못하면서 내성만 증가시킬 수 있으므로 추천되지\n않는다. 5~7일이 지난 후에도 뇌척수액이 지속적으로\n누출된다면 요추 천자를 통해 뇌척수액을 배액하여\n누공부위의 누출을 줄여준다. 만약 요추 배액 5〜7일\n후에도 누출이 지속된다면 경막 결손 부위의 재전술이\n필요하다. 측두골이나 기저골 골절로 인한 뇌척수액의\n누출이 있는 환자의 경우 90% 정도의 환자에게서 특별한\n추가적인 처치 없이도 5~7일 후 누출은 없어진다."},{"id":"c07-q164","chapterId":7,"number":164,"page":246,"stem":"이 환자에게 가장 먼저 시행해야 하는 검사는?","choices":["척수천자","뇌혈관조영술","경두개초음파","뇌 자기공명영상","뇌 컴퓨터단층촬영"],"answer":5,"answerLabel":"⑤","answerPage":361,"explanation":"뇌졸중 의심 환자의 경우 출혈성인지 확인하기 위해\n가장 먼저 시행되어야 하는 검사는 뇌 CT 이다. 뇌 MRI\n은 출혈 위험이 없고 허혈성 뇌졸중이 확인되면 촬영한다."},{"id":"c07-q165","chapterId":7,"number":165,"page":247,"stem":"이 환자의 증상을 고려할 때 의심되는 상태는?","choices":["소뇌경색","뇌교출혈","지주막하출혈","중대뇌동맥경색","후대뇌동맥경색"],"answer":4,"answerLabel":"④","answerPage":361,"explanation":"한 쪽 팔이나 다리의 마비, 얼굴마비, 감각장애,\n구음장애 , 실어증 등은 중대뇌경색의 전형적인 증상이다."},{"id":"c07-q166","chapterId":7,"number":166,"page":247,"stem":"이 환자의 뇌 자기공명영상(Brain MRI) 촬영 후 혈전 용해술이 계획되었다. 다음 중 혈\n전용해술이 가능한 경우는?","choices":["혈압이 200ハ20 mmHg이다.","두 시간 전에 증상이 시작되었다.","MCA 영역의 50% 이상에 병변이 있다.","처음 보다 신경학적 증상이 호전되었다.","NIHSS (National Institute of Health Stroke Scale) 34점이다."],"answer":2,"answerLabel":"②","answerPage":361,"explanation":"MCA 영역에서 33% 이상의 병변과 NIHSS 이 31\n점 이상인 경우 혈전 용해술은 금기이다. 뇌졸중 발병 후\n4.5시간 이내에 혈전용해 치료를 받을 수 있다. 급격히\n신경학적 증상이 호전을 보인다면 혈전용해술이 필요치\n않으며, 수축기 혈압이 185 mmHg 또는 이완기 혈압\n110 mmHg를 초과한다면 혈전용해술을 시행할 수 없다."},{"id":"c07-q167","chapterId":7,"number":167,"page":247,"stem":"이 환자의 혈전 용해제 치료가 시작된 후 적절한 중재는?","choices":["48시간 후 항응고제 치료를 시작한다.","혈압은 140/80 mmHg 이하로 조절한다","출혈 확인을 위해 위관과 배뇨관을 삽입한다.","동맥관을 삽입하여 혈압을 지속적으로 감시한다.","두통, 혈압상승 구토가 발생하면 CT 를 촬영한다."],"answer":5,"answerLabel":"⑤","answerPage":362,"explanation":"혈전용해제 투여 후 혈압은 수축기 185 mmHg 이하,\n확장기 110 mmHg 이하로 조절하도록 하고, 위관, 배뇨관,\n동맥관 삽입 등은 출혈의 위험이 있으므로 급하게 시행하지\n않는다. 혈전 용해제 투여 24시간 후 CT 를 확인한 다음\n항응고제 치료 및 항혈소판제 치료를 시작한다."},{"id":"c07-q168","chapterId":7,"number":168,"page":247,"stem":"지주막하출혈의 합병증인 혈관연축에 대한 설명 중 옳은 것은?","choices":["뇌혈류 속도가 감소된다.","베타차단제로 예방이 가능하다.","첫 7〜 10일 이내에 주로 발생한다.","지주막하출혈의 주 사망원인이다.","혈관이 좁아지면 풍선 혈관성형술을 시행한다."],"answer":3,"answerLabel":"③","answerPage":362,"explanation":"혈관연축이 있다면 좁아진 혈관으로 인해 혈류 속도가\n증가한다. CT 상 큰 범위의 경색이 있다면 출혈 위험성\n때문에 풍선 혈관성형술과 약물적 성형술은 금기이다.\n신경학적 악화가 보이면 재빨리 두부 CT 를 시행한다.\n뇌동맥류 파열 당시의 직접적인 뇌손상이 가장 높은 사망\n원인이며, 혈관연축은 생존 환자의 치료 중 가장 문제가\n되는 합병증이다."},{"id":"c07-q169","chapterId":7,"number":169,"page":248,"stem":"이 환자에게 의심되는 상태는?","choices":["뇌경색","뇌내출혈","경막하출혈","뇌실내출혈","지주막하출혈"],"passage":"다음 지문을 읽고 질문에 답하시오(문제 169-172).\n45 세 여자 환자가 운동 중 갑작스럽게 극심한 두통을 호소하면서 의식 변화를 보여 응급실에\n내원하였다. 내원 당시 의식은 일부 회복된 상태이며, 편마비 증세는 없었다. 통증 점수는 10\n점이었고. 활력징후는 130/90-37.3너08-23 이었다. 과거력은 없으며 흡연력은 15 갑년이었다","answer":5,"answerLabel":"⑤","answerPage":362,"explanation":"전구 증상 없이 돌발적으로 격렬한 두통과 발병 시\n편마비 증상이 보이지 않았다면 지주막하출혈을 의심할\n수 있다."},{"id":"c07-q170","chapterId":7,"number":170,"page":248,"stem":"응급실에서 이 환자에게 가장 먼저 시행해야 할 검사는?","choices":["요추천자","뇌혈류검사","뇌혈관조영술","뇌 자기공명영상","뇌혈관 컴퓨터단층촬영"],"passage":"다음 지문을 읽고 질문에 답하시오(문제 169-172).\n45 세 여자 환자가 운동 중 갑작스럽게 극심한 두통을 호소하면서 의식 변화를 보여 응급실에\n내원하였다. 내원 당시 의식은 일부 회복된 상태이며, 편마비 증세는 없었다. 통증 점수는 10\n점이었고. 활력징후는 130/90-37.3너08-23 이었다. 과거력은 없으며 흡연력은 15 갑년이었다","answer":5,"answerLabel":"⑤","answerPage":362,"explanation":"컴퓨터단층촬영은 지주막하출혈을 진단하는 데 가장\n먼저 선택하는 진단 방법이며, 동반될 수 있는 뇌내혈증,\n뇌경색 및 수두증 같은 합병증도 잘 보여준다. 특히 3차원\n영상을 재구성하는 뇌혈관 컴퓨터단층촬영은 뇌동맥류\n발견비율을 높여준다."},{"id":"c07-q171","chapterId":7,"number":171,"page":248,"stem":"이 환자는 코일색전술 후 중환자실에 입원 치료 중이다. 시술 후 7일 째, 의식수준이 저\n하되고 왼쪽 편마비가 발생하여 컴퓨터단층촬영을 한 결과 이상 소견이 없었다 경두개\n초음파 결과 오른쪽 중뇌동맥 평균 혈류 속도가 200 cm/sec 이상으로 증가되었다. 이\n환자에게 의심되는 합병증은?","choices":["재출혈","수두증","뇌수막염","혈관연축","두개내압 상승"],"passage":"다음 지문을 읽고 질문에 답하시오(문제 169-172).\n45 세 여자 환자가 운동 중 갑작스럽게 극심한 두통을 호소하면서 의식 변화를 보여 응급실에\n내원하였다. 내원 당시 의식은 일부 회복된 상태이며, 편마비 증세는 없었다. 통증 점수는 10\n점이었고. 활력징후는 130/90-37.3너08-23 이었다. 과거력은 없으며 흡연력은 15 갑년이었다","answer":4,"answerLabel":"④","answerPage":362,"explanation":"뇌 CT 상 출혈 증상이 보이지 않으면서 뇌혈류검사\n상 평균 혈류 속도가 200 cm/sec 이상 증가하거나 하루에\n50 cm/sec 이상 혈류 속도가 증가하였다면 뇌혈관연축이\n발생한 것으로 추정한다."},{"id":"c07-q172","chapterId":7,"number":172,"page":248,"stem":"이 환자의 합병증 치료로 옳은 것은?","choices":["수분을 제한한다.","Mannitol를 투여한다.","Nimodipine을 투여한다.","뇌실외배액술을 시행한다.","혈압을 140 mmHg 이하로 유지한다."],"passage":"다음 지문을 읽고 질문에 답하시오(문제 169-172).\n45 세 여자 환자가 운동 중 갑작스럽게 극심한 두통을 호소하면서 의식 변화를 보여 응급실에\n내원하였다. 내원 당시 의식은 일부 회복된 상태이며, 편마비 증세는 없었다. 통증 점수는 10\n점이었고. 활력징후는 130/90-37.3너08-23 이었다. 과거력은 없으며 흡연력은 15 갑년이었다","answer":3,"answerLabel":"③","answerPage":362,"explanation":"Nimodipine은 미세측부 혈류를 증가시키고 뇌세포를\n보호하여 뇌손상을 감소시키기 때문에 혈관연축 환자에게\n사용되는 약물이다. 혈관연축 예방을 위해 Triple H\n(Hypertension, hypervolemia, Hemodilution) 치료フト\n병행되어야하며, CT 상수두증이 없다면 뇌실외 배액술이\n필요하지 않다."},{"id":"c07-q173","chapterId":7,"number":173,"page":248,"stem":"두개내압 상승 환자의 증상 및 징후로 옳은 것은?","choices":["빈맥","동공축소","의식수준 저하","저녁에 심해지는 두통","오심이 동반된 투사성 구토"],"answer":3,"answerLabel":"③","answerPage":362,"explanation":"오심없는투사성 구토가발생되며,수면중 CO2\n농도의 증가로 인해 보통 이른 아침에 두통이 나타난다.\n쿠싱 3대 징후은 맥압 증가, 불규칙한 호흡, 서맥이다.\n동공 고정, 확대, 느린 반응을 보인다."},{"id":"c07-q174","chapterId":7,"number":174,"page":249,"stem":"두개 내 종양 절제를 위한 개두술 후 환자의 간호중재로 옳은 것은?","choices":["앙와위를 취해준다.","수술부위를 아래로 하여 눕게 한다.","기침을 유도하고 흡인을 자주 시행한다.","따뜻한 물주머니를 적용하여 체온을 올려준다.","필요시 비마약성 진통제를 사용하여 통증을 조절한다."],"answer":5,"answerLabel":"⑤","answerPage":362,"explanation":"수술부위에 가해지는 압력을 최소화하기 위해 수술하지\n않은 쪽으로 누워야 한다. 두개내압 상승 방지를 위해\n침상머리를 30° 유지하고, 뇌대사 요구량이 증가되지\n않도록 정상 체온을 유지하도록 한다. 기도 유지도\n중요하지만 과도한 기침과 흡인은 두개내압 상승을 유발할\n수도 있다."},{"id":"c07-q175","chapterId":7,"number":175,"page":249,"stem":"개두술 후 2일째인 환자가 두통을 호소하면서 투사성 구토를 하였다 혈압 185/72 mmHg,\n맥박 52회/분일 때 의심되는 원인은?","choices":["소뇌의 경색","두개내압 상승","통증으로 인한 과호흡","출혈로 인한 뇌교의 압박","탈수로 인한 체액량 감소"],"answer":2,"answerLabel":"②","answerPage":362,"explanation":"두통과투사성 구토, 쿠싱 3대 징후는 두개내압상승을\n시사한다."},{"id":"c07-q176","chapterId":7,"number":176,"page":249,"stem":"두개내압 상승 환자의 간호중재로 옳은 것은?","choices":["수분 섭취를 권장한다.","삼투압 이뇨제인 Mannitol을 투여한다.","두통 호소 시 Morphine sulfate를 투약한다.","낙상을 예방하고 안정을 위해 억제대를 적용한다.","뇌조직 관류를 위하여 트렌델렌버그 자세를 취해준다."],"answer":2,"answerLabel":"②","answerPage":362,"explanation":"두통 호소 시 비미약성 진통제를 투여하며, morphine\ns니fate는 연수 기능을 저하시키므로 사용하지 않는다.\n체액 균형 유지를 위해 I/O 를 모니터하면서 수분 섭취를\n제한한다. 조용하고 자극이 적은 환경을 유지하면서 억제대\n적용은 신중히 고려한다. 침상은 30° 상승시켜 정맥 유출이\n적절히 이루어지도록 한다."},{"id":"c07-q177","chapterId":7,"number":177,"page":249,"stem":"이 환자의두개내압은?","choices":["13 cmH2O","18 cmHQ","20 cmH2O","23 cmHQ","28 cmH2O"],"passage":"다음 지문을 읽고 질문에 답叶시오(문제 177-179).\n43 세 남자 환자가 지주막하출혈의 합병증으로 수두증이 발생하여 뇌실외배액술(EVD)을 시행받\n고 중환자실에서 입원 치료 중이다. EVD 는 귀구슬(tragus) 기준으로 5 cm에 설치되었고, 상방\n23 cm 위치에서 진동되고 있다.","answer":2,"answerLabel":"②","answerPage":362,"explanation":"진동위치(Oscillation) 23 cm - 귀구슬(tragus) 5\ncm = 18 cm"},{"id":"c07-q178","chapterId":7,"number":178,"page":250,"stem":"간호사는 이 환자의 의식이 저하되고, 뇌실외배액(EVD) 이 배액되지 않는 것을 발견하였\n다. 가장 적절한 중재는?","choices":["응급 수술을 준비한다.","EVD 를 내려 재고정한다.","생리식염수로 관을 세척한다.","뇌 컴퓨터단층촬영을 실시한다.","진동 여부와 관의 개방성을 확인한다."],"passage":"다음 지문을 읽고 질문에 답叶시오(문제 177-179).\n43 세 남자 환자가 지주막하출혈의 합병증으로 수두증이 발생하여 뇌실외배액술(EVD)을 시행받\n고 중환자실에서 입원 치료 중이다. EVD 는 귀구슬(tragus) 기준으로 5 cm에 설치되었고, 상방\n23 cm 위치에서 진동되고 있다.","answer":5,"answerLabel":"⑤","answerPage":362,"explanation":"방사선검사나 수술보다도 EVD 관의 꼬임이나 막힘이\n있는지를 가장 우선으로 확인하는 것이 중요하다."},{"id":"c07-q179","chapterId":7,"number":179,"page":250,"stem":"이 환자의 EVD 간호로 옳은 것은?","choices":["예방적 항생제를 사용한다.","기도 흡인 시 EVD 를 개방해 둔다.","주기적으로 생리식염수로 세척한다.","검체 채취 시 뇌척수액을 빠르게 제거한다.","챔버 높이는 항상 귀구슬 상방 1 cm에 고정한다."],"passage":"다음 지문을 읽고 질문에 답叶시오(문제 177-179).\n43 세 남자 환자가 지주막하출혈의 합병증으로 수두증이 발생하여 뇌실외배액술(EVD)을 시행받\n고 중환자실에서 입원 치료 중이다. EVD 는 귀구슬(tragus) 기준으로 5 cm에 설치되었고, 상방\n23 cm 위치에서 진동되고 있다.","answer":1,"answerLabel":"①","answerPage":362,"explanation":"챔버 높이는 두개내압에 따라 배액량이 달라지므로\n진동 위치를 확인하고 고정해야 하며, 흡인 시 급작스런\n배액 위험이 있으므로 EVD 를 잠그고 빠르게 시행흔f다.\n감염의 위험성으로 세척은 시행하지 않는다. 검체 채취 시\n뇌척수액을 천천히 제거한다."},{"id":"c07-q180","chapterId":7,"number":180,"page":250,"stem":"경접형동 접근법(TransSpenoidal Approach; TSA) 수술 후 환자를 위한 간호중재로 옳\n은 것은?","choices":["고염식이를 제공한다.","수분섭취를 제한한다.","염분섭취를 제한한다.","스테로이드를 투약한다.","혈청과 소변의 삼투질 농도를 확인한다."],"answer":5,"answerLabel":"⑤","answerPage":362,"explanation":"뇌하수체 종양 수술 후 합병증 중 하나인 요붕증을\n확인하기 위해 요비중 혈청 전해질과 삼투압, 소변의\n전해질과 삼투압을 확인하고 I/O 측정이 중요하다. 요붕증\n발현 시 이뇨제 사용은 금기이며 , 혈청 나트륨이 상승하므로\n수분섭취를 권장해야 한다."},{"id":"c07-q181","chapterId":7,"number":181,"page":250,"stem":"경접형동 접근법 수술 후 환자의 코에서 약간 붉은 액체가 흘러나올 때 적절한 간호중\n재는?","choices":["고여 있는 콧물을 풀어낸다.","침상 머리를 9\"로 유지한다.","머리를 가능한 한 낮게 유지한다.","액체의 포도당과 혈당을 측정한다.","요추 배액관을 삽입하여 뇌척수액을 제거한다."],"answer":4,"answerLabel":"④","answerPage":362,"explanation":"액체의 혈당을 측정했을 때 혈청 혈당의 60%이면\n뇌척수액의 누출을 의심할 수 있다. 이때 절대 안정을 해야\n한다. 만일 요추 배액관을 삽입 한다면 급작스런 배액은\n금기이며, 천천히 배액되도록 한다."},{"id":"c07-q182","chapterId":7,"number":182,"page":250,"stem":"두부 수술 환자의 간호로 옳은 것은?","choices":["진통제를 사용하지 않는다.","혈량 보충을 위해 저장성 수액을 정맥주입 한다.","수술 후 48시간 이내에 항응고제 치료를 시작한다.","천막하 수술 후에는 예방적 항경련제가 필요하지 않다.","뇌동맥류 결찰술 후 혈압을 130/90 mmHg보다 낮게 유지한다."],"answer":4,"answerLabel":"④","answerPage":362,"explanation":"저장성 수액은 뇌혈관장벽 방해 효과 때문에 생리식염수\n등의 등장성 수액을 선택한다. 뇌동맥류 결찰술 후에는\n일반적으로 뇌혈관 연축과 저관류 위험을 줄이기 위해 어느\n정도의 고혈압을 유지한다. 환자의 안위 수준을 유지하기\n위해서 acetaminophen 등의 약물을 사용해서 통증을\n적절히 조절한다. 혈정성 색전 합병증이 발생할 수 있는\n고위험 환자는 개두술 초기 3~5일 내 항응고제를 시작하고,\n24~48시간 이내에는 시작하면 안 된다"},{"id":"c07-q183","chapterId":7,"number":183,"page":251,"stem":"뇌수술 환자의 두개내압 상승에 대한 간호로 옳은 것은?","choices":["급성 수두증의 두개내압은 mannitol로 낮춘다.","두개내압이 상승하면 즉시 기도삽관을 시행한다.","뇌종양으로 인한 뇌부종은 스테로이드로 치료한다.","혈청 삼투압이 300 mOsm/L이면 신부전 위험이 증가한다.","PaCO2 30〜35 mmHg 미만을 유지하기 위해 과다환기를 지속한다."],"answer":3,"answerLabel":"③","answerPage":362,"explanation":"급성 수두증의 경우 뇌실배액술로 치료를 한다. 기침은\n두개내압 상승을 악화시킬 수 있다. 혈청 삼투압이 320\nmOsm/L 이상일 때 신부전 위험이 증가돈!다. 과다 환기는\n단시간 동안만 시행하고 초기 24시간이 지나면 안 된다."},{"id":"c07-q184","chapterId":7,"number":184,"page":251,"stem":"두개수술 환자의 침상머리를 30° 올리는 이유는?","choices":["분비물 배출을 돕기 위하여","호흡을 편안하게 하기 위하여","정맥 순환을 증진시키기 위하여","분비물 흡인을 예방하기 위하여","산소 공급을 원활하게 하기 위하여"],"answer":3,"answerLabel":"③","answerPage":362,"explanation":"침상머리를 상승시키면 정맥 순환계로 혈류량 유입이\n증진되면서 뇌정맥 울혈이 완화되면서 두개내압이 하강한다."},{"id":"c07-q185","chapterId":7,"number":185,"page":251,"stem":"지주막하출혈을 진단받고 긴급 수술이 결정된 환자에게 수술 전 간호로 적절한 것은?","choices":["관장을 시행한다.","발살바수기를 교육한다.","스테로이드를 투약한다.","심전도검사를 시행한다.","심호흡과 기침을 교육한다."],"answer":4,"answerLabel":"④","answerPage":363,"explanation":"심호흡, 기침교육 및 V게s겡va 수기법 등은두개내압을\n상승시킬 수 있으므로 금기이다. 예방적으로\ncorticosteroid 사용은 하지 않는다. 지주막하출혈 환자는\n때때로 특징적인 심전도 변화와 부정맥을 보일 수 있으며,\n이로 갑작스런 사망의 원인이 될 수 있으므로 주의 깊게\n관찰한다."},{"id":"c07-q186","chapterId":7,"number":186,"page":251,"stem":"경추 골절로 응급 수술을 받은 환자에 대하여 우선적으로 사정해야 할 것은?","choices":["배뇨장애","호흡곤란","운동마비","심부건반사","수술부위 감염"],"answer":4,"answerLabel":"④","answerPage":363,"explanation":"상부 척수손상환자의 경우 횡격막과 늑간근이 영향을\n받아 호흡장애가 발생할 가능성이 있으므로 지속적으로\n호흡을 관찰하고 기도 유지를 해야 한다."},{"id":"c07-q187","chapterId":7,"number":187,"page":251,"stem":"교통사고로 인한 두개내출혈 때문에 응급 개두술 후 중환자실에서 치료 중인 환자의 혈\n압이 144/93 mmHg, 체온 37.3℃, 맥브キ 63회/분, 호흡은 16회/분이다. 인공호흡기 치료\n를 받고 있으며 ABGA는 7.48-34-91-21, 뇌실외배액(EVD) 으로 추정한 두개내압은 28\nmmHg이다. 이 환자의 간호중재로 적절한 것은?","choices":["침상머리를 30°로 상승시킨다.","이뇨제를 투여하여 정맥귀환량을 줄인다.","인공호흡기 PEEP 을 15 cmHQ로 올린다.","기도흡인을 자주 실시하여 폐렴을 예방한다.","인공호흡기의 호흡수를 올려 과다환기를 유도한다."],"answer":1,"answerLabel":"①","answerPage":363,"explanation":"두개내압이 높은 환자의 경우 침상머리를 30°로\n상승시켜 정맥귀환을 향상시킨다. 지나친 과다환기는\n뇌혈류를 감소시켜 뇌허혈을 유발하고, 과도한 PEEP 은\n정맥귀환에 방해가 된다."},{"id":"c07-q188","chapterId":7,"number":188,"page":252,"stem":"뇌종양 절제술 후 환자의 의식수준이 저하되고, 혈청 나트륨 123 mEg/L, 혈청 삼투압\n232 mOsm/L일 때 적절한 간호중재는?","choices":["이뇨제를 투여한다.","항이뇨 호르몬제를 투여한다.","3% 식염수를 100 cc/hr로 투여한다.","갈증을 호소하면 수분을 충분히 제공한다.","혈청 나트륨을 1.5 mEg/L/hr 속도로 교정한다."],"answer":1,"answerLabel":"①","answerPage":363,"explanation":"저나트륨 혈증과 혈청 삼투압 저하는\n항이뇨호르몬부적절증후군 (SIADH) 의 증상이다. 수분을\n800 cc/day 이하로 제한해야 하며, 3% 식염수를\n사용하여 저나트륨 혈청 교정 시 20~50 cc/hr로 투여하되\n교정 속도는 1.3 mEg/l/hr을 넘지 않도록 해야 한다."},{"id":"c07-q189","chapterId":7,"number":189,"page":252,"stem":"중증 뇌경색으로 반두개 절제술(hemicranietomy)을 시행 후 저체온 요법을 시행 중인\n환자에게 적절한 간호중재는?","choices":["폐렴예방을 위해 자주 흡인을 한다.","심부 체온을 30℃ 미만으로 유지한다.","오한이 있으면 저체온 요법을 중지한다.","저체온으로 인한 피부 손상을 예방한다.","두개내압 상승 예방을 위해 수액공급을 제한한다."],"answer":4,"answerLabel":"④","answerPage":363,"explanation":"중등도 저체온 요법은 혼수치료가 병행되면서 32~34℃\n로유지하는것이며, 이로 인해 혈압하강이 있을수 있으므로\n혈압을 감시하면서 혈압상승제를 투여할 수 있다. 저체온\n요법을 즉시 중단하면 오히려 반동작용에 의해 고체온이\n발생하여 두개내압이 상승할 수도 있으므로 저체온 요법을\n중단할 시 적어도 1℃/hr의 속도로 가온해야 한다. 너무\n잦고 과도한 흡인은 두개내압 상승을 유발한다. 오한은\n약물을 통해 진정 요법으로 조절해야 한다."},{"id":"c07-q190","chapterId":7,"number":190,"page":252,"stem":"수두증을 진단받고 뇌실-복강 단락술(Ventric니。-peritone시 shunt)을 시행 받은 환자\n의 간호중재로 옳은 것은?","choices":["수술 후 6시간 동안 금식한다.","침상머리를 45° 이상으로 유지한다.","과소배액이 의심되면 이뇨제를 투여한다.","활력징후 및 동공반응을 자주 모니터 한다.","밸브 부위를 자주 눌러 주어 기능이 잘 되도록 한다."],"answer":4,"answerLabel":"④","answerPage":363,"explanation":"단락술 후에 뇌척수액이 빠르게 배액되면 뇌피질이\n경막으로부터 밀리게 되어 경막하 혈증이 발생할 수\n있으므로 앙와위를 유지하고 , 두부 상승은 단계별로 천천히\n해야 한다. 뇌실-복강 단락술 후에는 장음을 확인 후\n식이를 진행해야 한다. 밸브 부위에는 직접적인 압력이\n가해지지 않도록 해야 하며 , 이뇨제의 사용으로 두개내압이\n감소되지 않고 오히려 탈수를 유발할 수 있으므로 권장되지\n않는다."},{"id":"c07-q191","chapterId":7,"number":191,"page":252,"stem":"뇌실-복강 단락술 후 4일째인 환자가 두통과 오심을 호소할 때 의심되는 합병증은?","choices":["과소배액","뇌수막염","과다배액","복수의 증가","두개내압 상승"],"answer":5,"answerLabel":"⑤","answerPage":363,"explanation":"뇌척수액이 과다배액되면 두통, 오심, 기립성 저혈압\n등의 증상이 나타난다. 대부분의 단락 감염은 수술 후 2\n개월 이내에 나타나게 된다."},{"id":"c07-q192","chapterId":7,"number":192,"page":252,"stem":"수두증으로 인해 6일전 응급 뇌실 내 배액술을 시행받은 환자에게 경직과 두통, 고열이\n발생하였다 이 환자에게 의심되는 상태는?","choices":["뇌부종","뇌수막염","뇌수두증","경막하 출혈","두개내압 상승"],"answer":5,"answerLabel":"⑤","answerPage":363,"explanation":"뇌실 내 배액관을 통한수막에 세균이 침범하여 염증\n반응을 일으켜 수막 자극 증상을 보일 수 있다. 뇌수막염의\n초기 증상으로 발열, 심한두통, 발작, 의식 변화, 목 경직이\n있다."},{"id":"c07-q193","chapterId":7,"number":193,"page":253,"stem":"요추부의 척추융합술 후 환자 간호로 옳은 것은?","choices":["침상 머리를 30° 올린다.","비마약성 진통제를 사용한다.","목 뒤에 높은 베개를 대준다.","수술 12시간 후 조기 이상을 실시한다.","통나무 굴리기법으로 체위를 변경한다."],"answer":4,"answerLabel":"④","answerPage":363,"explanation":"수술 후 12~24시간 동안은 침상에 똑바로 누운\n앙와위 체위를 유지하고 낮은 베개를 사용하여 침상 안정을\n해야 하며 , 통나무 굴리기 법으로 체위를 변경해야 한다.\n필요시 마약성 진통제를 사용하여 통증을 완화시켜 줄 수\n있다."},{"id":"c07-q194","chapterId":7,"number":194,"page":253,"stem":"경막하 혈종으로 중환자실에 입원 치료 중인 환자의 두개내압 상승 예방을 위한 간호중\n재는?","choices":["쇼크 체위를 유지한다.","수분 섭취를 권장한다.","흡인은 10초 미만으로 시행한다.","낙상 예방을 위해 억제대를 적용한다.","체온을 정상보다 약간 높게 유지한다."],"answer":3,"answerLabel":"③","answerPage":363,"explanation":"뇌의 신진대사를 감소하기 위해 고체온은 피하고\n저체온 요법을 실시해야 하며 , 뇌조직의 수분을 제거하여\n뇌부종을 감소하기 위해 수분 섭취는 제한하는 것이 좋다.\n과도한 자극은 두개내압 상승을 유발할 수 있으므로\n억제대는 신중히 사용해야 한다. 정맥 순환계로 정맥배액을\n촉진하기 위해 침상은 30。로 유지한다."},{"id":"c07-q195","chapterId":7,"number":195,"page":253,"stem":"개두술 후 환자가 의식저하, 혈압상승, 불규칙한 호흡, 서맥을 보일 때 가장 우선적으로\n내릴 수 있는 간호진단은?","choices":["수술과 관련된 감염 위험성","신경학적 압박과 관련된 통증","뇌부종과 관련된 조직관류 장애","간질 발작과 관련된 잠재적 손상","신경학적 장애와 관련된 신체 기동 장애"],"answer":3,"answerLabel":"③","answerPage":363,"explanation":"두부 수술 환자가 의식저하와 혈압상승, 불규칙한\n호흡, 서맥의 증상을 보이는 것은 두개내압 상승의 증상이며 ,\n두개내압 상승과 관련된 간호진단을 우선적으로 내릴 수\n있다."},{"id":"c07-q196","chapterId":7,"number":196,"page":253,"stem":"심한 두개내압 상승이 의심되는 환자에게 요추 천자가 금기인 이유는?","choices":["척수 손상의 위험이 크다.","침습적 시술로 감염의 위험이 높다.","시술로 인한 통증이 두개내압을 더욱 상승시킬 수 있다.","의식 변화로 인해 검사 후 요구되는 앙와위 자세 유지가 힘들다.","갑작스런 뇌척수액 제거로 뇌구조가 대 후두공으로 탈출될 수 있다."],"answer":5,"answerLabel":"⑤","answerPage":363,"explanation":"두개내압 상승 환자와 뇌종양 의심 환자의 경우,\n뇌척수액의 급격한 제거로 인해 뇌구조가 대 후두공으로\n탈출되어 갑작스런 사망의 원인이 될 수 있다."},{"id":"c07-q197","chapterId":7,"number":197,"page":253,"stem":"고혈압성 뇌출혈 환자의 간호로 옳은 것은?","choices":["과호흡과 기침을 유도한다.","분비물이 많으면 20초 이상 흡인을 시행한다.","경련이 없다면 항 경련제를 투여하지 않는다.","환자가 먹거나 마실 수 없다면 즉시 위관 영양을 시행한다.","두개내압 상승 예방을 위해 mannitol과 스테로이드를 투여한다."],"answer":5,"answerLabel":"⑤","answerPage":363,"explanation":"흡인, 질식, 구토의 위험이 있으므로 24~48시간\n동안은 금식하고 이후 환자가 먹지 못할 때 위관 영양 혹은\n정맥 영양을 시작한다. 처방에 따라 진정제나 항경련제를\n투여한다. 기도 개방을 위해 흡인을 할 경우에는 10초\n이내로 한다. 과다한 기침, 구토 등은 두개내압을\n증가시킨다."},{"id":"c07-q198","chapterId":7,"number":198,"page":254,"stem":"뇌동맥류 환자의 조기 수술과 지연 수술의 장 단점에 대한 옳은 설명은?","choices":["조기 수술은 재출혈 위험이 높다.","지연 수술의 경우 뇌의 긴장으로 뇌의 견인이 어렵다.","지연 수술의 경우 뇌동맥류 박리 시 조기 파열이 많다.","지연 수술의 경우 수술 시 박리가 용이해져 사망률을 줄일 수 있다.","조기 수술을 하면 뇌부종 감소로 혈관 연축 발생 가능성이 낮아진다."],"answer":4,"answerLabel":"④","answerPage":363,"explanation":"뇌부종 감소로 혈관 연축 발생 가능성이 낮아지는\n것과 재출혈의 위험이 높은 것은 지연 수술의 장점과\n단점이다. 뇌의 긴장으로 뇌의 견인이 어렵고 뇌동맥류\n박리 시 조기 파열이 많은 것은 조기 수술의 단점이다."},{"id":"c07-q199","chapterId":7,"number":199,"page":254,"stem":"두개내압 상승 환자의 약물요법에 관한 설명 중 옳은 것은?","choices":["Dexamethasone 사용 시 제산제를 같이 투여한다.","Mannit이은 반드시 포도당과 혼합하여 정맥 주입한다.","Mannit이은 작용 유지 시간이 짧으므로 천천히 주입한다.","Barbiturate는 두개내압을 하강시키는 일차적인 치료제이다","혈청 삼투질 농도가 320 mOsm/L 이상일 때에는 이뇨제인 furosemide를 사용 한다."],"answer":1,"answerLabel":"①","answerPage":363,"explanation":"Mannit이은 부종이 있는 뇌조직의 세포내액을\n혈장으로 끌어간다. Mannit이의 투여 방법은 15분간 에\n걸쳐 빠르게 정주하며 최대 효과는 15~22분 사이이다.\n혈청 삼투압 농도가 320 mOsm/L 이상 시에는\nfurosemide도 금기이다. Barbiturate는 두개내압을\n하강시키는 일차적 치료제이기보다는 다른 방법에 효과가\n없을 때 최종적으로 사용 할 수 있다."},{"id":"c07-q200","chapterId":7,"number":200,"page":254,"stem":"뇌종양 환자의 두개내압 상승 예방을 위한 간호중재는?","choices":["산소는 최소한으로 공급한다.","정맥 수액 주입 시 저장액을 사용한다.","뇌관류압을 15~20mmHg 정도로 유지한다.","Corticosteroid를 투여하되 제산제를 함께 투여한다.","뇌조직의 수분을 제거하기 위해 furosemide를 투여한다."],"answer":4,"answerLabel":"④","answerPage":363,"explanation":"뇌관류압을 60~70 mmHg 정도로 유지될 수 있게\n혈압을 유지해야 하며, 수액은 저장성 용액은 금기이다.\n뇌에서 수분을 감소시키기 위해서는 고삼투성 이뇨제인\nmannit이을 사용해야 한다. 산소를 충분히 공급하면서\n필요 시 기관삽관을 할 수 있다."}]},{"id":8,"part":"PART II","partTitle":"전문실무영역","title":"근골격계","count":54,"startPage":255,"endPage":268,"questions":[{"id":"c08-q001","chapterId":8,"number":1,"page":255,"stem":"75세 여자의 오른쪽 고관절에 관절염이 의심될 때 예상되는 진단검사 결과는?","choices":["골밀도가 증가되어 있음","척추의 추간판이 파열됨","오른쪽 고관절의 관절강이 좁아져 있음","대퇴골두(femoral head)에 압박골절이 보임","오른쪽 고관절의 골두에 석회화가 보임"],"answer":3,"answerLabel":"③","answerPage":364,"explanation":"고관절 관절염의 진단검사 결과는 연골의 마모로 관절강이\n좁아짐이 관찰된다. 추가로 활액막 자극에 의해 골괴사가\n형성되기도 하고, 활액이 빠져나와 관절강으로 유입되면서\n연골하 낭포가 관찰될 수 있다."},{"id":"c08-q002","chapterId":8,"number":2,"page":255,"stem":"급성 통풍을 진단받은 75세 남자에게 콜히친(c이chicine) 정맥투여를 한 후 관찰해야 하\n는 부작용은?","choices":["설사","실신","고열","심정지","골수억제"],"answer":5,"answerLabel":"⑤","answerPage":364,"explanation":"노인에게 콜치신을 투여하면 설사를 유도하므로 설사는\n부작용이라기보다는 예상되는 증상이다. 콜치 신의 부작용으로\n골수억제가 나타날 수 있으므로 관찰이 요구된다."},{"id":"c08-q003","chapterId":8,"number":3,"page":255,"stem":"75세 남자가 대퇴골 골절로 입원하여 골절정복 수술을 하고 오른쪽 다리에 전체 석고붕\n대를 적용하고 있다. 수술 후 6시간이 경과하였을 때 통증조절을 위해 모르핀이 정맥투\n여 되고 있음에도 석고붕대를 한 다리에 통증이 여전히 심하고 발이 바늘로 찌르는 듯 따\n끔거린다고 호소한다. 오른쪽 족배동맥의 맥박이 촉지되지 않으며 발톱의 모세혈관 재충\n전검사에서 지연된 충전반응을 보이고 발에 부종이 있다. 이 환자에게 의심되는 상태는?","choices":["구획증후군","말초혈관염","수술부위 감염","급성 폐색전증","급성 심부 정맥 혈전증"],"answer":1,"answerLabel":"①","answerPage":364,"explanation":"구획증후군의 주 원인은 동맥손상과 골절이며, 사지에\n석고붕대 적용 후 흔히 나타난다. 구획증후군의 초기증상으로\n통증, 감각소실, 맥박의 감소 등이 관찰된다."},{"id":"c08-q004","chapterId":8,"number":4,"page":256,"stem":"손목관절의 통증을 호소하며 내원한 45세 여자에게 류마티스 관절염(rheumatoid arthritis；\nRA) 이 의심되었다. 다음 건강력 문진내용 중 RA 진단기준에 해당하는 내용은?","choices":["빈혈이 최근 심해졌어요.","다리를 구부릴 때마다 소리가 납니다.","양쪽 관절에 통증이 두 달 이상 지속됩니다.","오후가 되면 관절이 뻣뻣하고 움직이기 힘들어요.","지난주부터 팔목 관절에 증상이 시작되었어요."],"answer":3,"answerLabel":"③","answerPage":364,"explanation":"American College of Rheumat이ogy에서 제시한\nRA 의 진단기준은 ⑴아침에 나타나는 뻣뻣함(stiffness), ⑵\n최소 3개 이상의 관절에서 관절염이 6주 이상 지속될 때, ⑶\n대칭적 관절염이 6주 이상 지속될 때, (4)혈청 rheumatoid\nfactor가 양성일 때, (5)방사선상 변화가 관찰될 때이며 이\n중 4개 이상의 기준이 충족되면 RA 로 진단한다."},{"id":"c08-q005","chapterId":8,"number":5,"page":256,"stem":"75세 여자가 고관절 전치환술(total hip replacement； THR) 을 받고 퇴원하였다. THR 부\n위가 이탈되는 위험이 있어 피해야 할 자세는?","choices":["복위","앙와위","고관절 굴곡","무릎의 신전","고관절의 외회전"],"answer":3,"answerLabel":"③","answerPage":364,"explanation":"THR 을 받은 환자가 고관절을 굴곡하거나 내회전을\n하게되면 전치술 인공보철물이 후방탈구될 위험이 있으므로\n반드시 피하도록 교육한다."},{"id":"c08-q006","chapterId":8,"number":6,"page":256,"stem":"근골격계 신체검진으로 근력을 사정하고 있다. 손상된 손의 근력이 2점이었다면 어떤 상\n태인가?","choices":["일상 활동을 하기에 충분함","근육의 수축이 전혀 느껴지지 않음","중력에 거슬러 손을 들어 올릴 수 있음","근육이 약간 수축하는 것이 느껴지나 움직임이 거의 없음","몸 가까이 손을 끌어당길 수 있으나 들어 올릴 수 없음"],"answer":5,"answerLabel":"⑤","answerPage":364,"explanation":"표준 근력 평가는 0에서 5점으로 이루어진다. 0은 전혀\n수축 없음, 1 은 수축은 느껴지나 움직임이 거의 없음 2는근\n수축이 있어 평지에서 움직이나 중력을 거슬러 들어 올릴 수\n없음, 3은 중력을 거슬러 들어 올릴 수 있음 4는 약한 저항을\n이겨내고 팔을 중력에 거슬러 들어 올릴 수 있음, 5는 충분히\n저항을 이겨내며 팔을 들어 올릴 수 있음을 의미한다."},{"id":"c08-q007","chapterId":8,"number":7,"page":256,"stem":"72세 여자가 6개월 전부터 손가락 말단 지골간 관절이 붓고 통증이 심해져서 내원하여\n골관절염을 진단받았다 미국 류마티스학회에서 권장하는 골관절염 환자의 초기 중재는?","choices":["운동과 체중감소","조기 관절 치환술","고용량 스테로이드","비스테로이드성 항염제(NSAIDs)","철저한 진단검사가 완료된 후 치료시작"],"answer":1,"answerLabel":"①","answerPage":364,"explanation":"미국 류마티스학회에서 권장하는 퇴행성 골관절염의\n초기중재는 ⑴운동, (2)체중감량, ⑶휴식이다. 약물치료는\n부작용이 우려되므로 가능한 한 늦게 시작한다. 철저한\n진단검사는 진단에 문제가 있지 않으면 권장되지 않으며,\n모든 보존적 치료에도 불구하고 통증과 심한 증상이 완화되지\n않으면 관절치환술이 고려될 수 있다."},{"id":"c08-q008","chapterId":8,"number":8,"page":256,"stem":"다음 중 류마티스 관절염 환자의 통증을 지속적으로 조절하기 위해 가장 효과적인 중재는?","choices":["냉찜질","규칙적 운동","고용량 스테로이드","심부 열패드 적용","경피적 전기신경자극(TENS)"],"answer":2,"answerLabel":"②","answerPage":364,"explanation":"류마티스 관절염과 연관된 통증감소에 가장 지속적으로\n효과적인 중재는 운동이다. 운동은 혈류를 증진시키고 연골의\n건강, 관절범위와 근력을 향상시킨다. 염증이 심한 급성기에는\n관절 운동범위를 제한하고 지지하도록 교육한다. 열찜질,\n냉요법, TENS 등도 모두 통증완화를 위해 적용되는 중재이다."},{"id":"c08-q009","chapterId":8,"number":9,"page":257,"stem":"급성 요통을 호소하는 환자의 건강사정 결과 신경학적 장애가 의심되는 내용은?","choices":["방광 기능장애를 보임","심각한 외상 병력이 있음","앙와위에서 통증이 있음","하지의 반사. 근력, 감각이 저하됨","양쪽 발목에 대칭적인 부종이 관찰됨"],"answer":4,"answerLabel":"④","answerPage":364,"explanation":"반사, 감각, 근력이 감소되는 것과 하지거상검사의 통증\n등이 신경학적 장애를 나타내는 검진결과이다."},{"id":"c08-q010","chapterId":8,"number":10,"page":257,"stem":"56세 여자가 손등을 90도로 맞대고 60초를 버티게 하는 팔렌검사(Ph겡en test) 시 통증\n을 호소하였다면 이 환자에게 의심되는 상태는?","choices":["ulnar tunnel syndrome","carpal tunnel syndrome","tarsal tunnel syndrome","radial tunnel syndrome","myofascial pain syndrome"],"answer":2,"answerLabel":"②","answerPage":364,"explanation":"팔렌검사 양성은 손목터널수근관 증후군을 의심한匚卜.\n손을 많이 사용하는 경우 정중신경이 손가락을 움직이는\n힘줄인 수근관에 눌려 압박되면서 손저림과 통증을 호소하게\n된다."},{"id":"c08-q011","chapterId":8,"number":11,"page":257,"stem":"발목 염좌로 인한 손상이 있는 환자에게 첫 48시간 동안 제공되어야 할 중재는?","choices":["저항성 발목 운동","휴식과 발목 상승","발목의 저강도 스트레칭","열과 냉찜질 교환요법","방사선 촬영 후 정형외과 의뢰"],"answer":2,"answerLabel":"②","answerPage":364,"explanation":"발목부상의 85% 정도는 염좌이다. 초기대응은 ⑴\n휴식과 체중이동을 피할 것, ⑵냉요법 적용, ⑶탄력붕대로\n압박, ⑷손상부위의 상승이다. 통증조절을 위해 NSAIDs\n가 처방되며, 골절이 아닌 것으로 판단된 후 부드럽게\n관절범위운동을 시작할 수 있다."},{"id":"c08-q012","chapterId":8,"number":12,"page":257,"stem":"대퇴골에 스트레스 골절이 나타난 환자에게 제공되는 초기 중재는?","choices":["일상활동을 지속하도록 한다.","수술을 통해 골절정복을 한다.","활동을 한 후에는 얼음찜질을 한다.","매일 수동적인 관절범위운동을 시행한다.","뼈에 추가적인 부담을 주지 않기 위해 휴식한다."],"answer":5,"answerLabel":"⑤","answerPage":364,"explanation":"스트레스 골절을 진단 받고 나면 골절이 회복될 때까지\n절대 안정이 권장된다. 골절이 치유되는 4~8주 동안은\n통증이 나타나지 않도록 가벼운 활동을 한다."},{"id":"c08-q013","chapterId":8,"number":13,"page":257,"stem":"다음 중 양성이 나왔을 때 전신홍반루푸스(systemic lupus erythematosus)의 진단기준\n에 포함되는 검사는?","choices":["HLA-B27","rheumatoid factor (RF)","anti-nuclear antibody (ANA)","Erythrocyte sedimentation rate (ESR)","High sensitivity C-reactive protein (HS-CRP)"],"answer":3,"answerLabel":"③","answerPage":364,"explanation":"ANA 는 SLE 를 진단하는 11개 진단검사 기준에\n포함된다. RF 는 류마티스 관절염 진단에 사용되며 ESR\n이나 CRP 는 상승될 수 있으나 진단기준에 포함되지는\n않는다."},{"id":"c08-q014","chapterId":8,"number":14,"page":258,"stem":"Hydrochlorothiazide! 복용하고 있는 고혈압 환자에게 엄지발가락의 극심한 통증이 발\n생하여 통풍으로 진단받았다. 다음 중 급성 통풍을 치료하기 위해 적절하지 않은 약물은?","choices":["Allopurinol","Prednisone","Colchicine","Indomethacin","Naproxen"],"answer":1,"answerLabel":"①","answerPage":364,"explanation":"급성 통풍의 치료에는 NSAIDs와 corticosteroid,\nc 이chicine이 처방된다. 게lopurin이은 요산생성을 억제하는\n효과가 있어 통풍의 예방과 재발을 막는 효과가 있으나\n급성통풍발작에는 항염작용이 없으므로 효과가 없고 오히려\n투여 시 증상을 악화시킬 수 있으므로 사용하지 않는다."},{"id":"c08-q015","chapterId":8,"number":15,"page":258,"stem":"2주 전 뒷마당에서 나무를 심다가 발생한 요통을 호소하며 50세 남자가 내원하였다 허\n리의 통증은 오른쪽 다리로 가끔 방사되며 통증이 있으면 ibuprofen을 먹었다고 한다. 특\n별히 건강상 문제는 없으며 건강한 편이었다. 이 환자의 통증이 어느 정도 지속된 후 영\n상진단검사가 요구되는가?","choices":["통증 발생 2주 후","통증 발생 4주 후","통증 발생 6주 후","통증 발생 8주 후","영상진단검사가 요구되지 않음"],"answer":2,"answerLabel":"②","answerPage":364,"explanation":"건강한 편인 45세 성인이 나무 심는 일 등과 같이 몸을\n쓰는 활동을 하다가 일시적으로 발생한 요통에는 일반적으로\n영상진단검사가 요구되지 않는다. 통증이 4주이상 지속된다면\n영상진단검사를 고려한다. 초기의 환자가 암 병력 등이 있는\n경우, 50세 이상의 노령, 심한 외상이나 신경학적 장애나\n통증과 같은 병력이 있는 경우에는 요통을 호소하는 환자에게\n영상진단검사가 요구된다."},{"id":"c08-q016","chapterId":8,"number":16,"page":258,"stem":"다음 골다공증의 위험군으로 판단되어 골밀도검사 스크리닝이 요구되는 대상자는?","choices":["몸집이 작고 과체중인 30대 여자","주 1회 음주하는 40세 아시아 여자","골절된 적이 없는 55세 폐경 후 여자","비교적 건강한 편인 65세 남자","류마티스 관절염이 있는 60세 남자"],"answer":5,"answerLabel":"⑤","answerPage":364,"explanation":"골다공증 스크리닝에 대한 미국가정의학회 가이드라인에\n의하면 ⑴골절경험이 없는 65세 이상의 여자, 긴골절위험이\n높은 65세 이하의 여자, (3)흡연フト, 매일 알코올 섭취자,\n부모 골절병력, BMI 21 이하, (4)흑인, 아시아, 히스패닉\n인종 등이 골다공증 스크리닝을 해야 한다. 건강한 남성은\n스크리닝이 요구되지 않으나 류마티스관절염 등의 위험요소가\n있으면 요구된다."},{"id":"c08-q017","chapterId":8,"number":17,"page":258,"stem":"40세 남자가 무거운 책상을 들다가 발생한 요통이 있어 내원하여 요추좌상(lumbar strain)\n으로 진단받았다 걷기만 해도 요통이 심해진다고 하며 일상활동을 하기가 두렵다고 호소\n하는 환자에게 할 수 있는 설명으로 옳은 것은?","choices":["침상안정을 하시면 요통이 완화됩니다.","일상활동은 하시더라도 걷는 것은 피하세요.","앞으로 3일간 모든 일상활동을 중지하세요","일상활동을 하다가 통증이 나타나면 침상안정합니다","일상활동과 함께 걷기를 견딜수 있는 만큼 조금씩 늘려가세요."],"answer":5,"answerLabel":"⑤","answerPage":364,"explanation":"요추좌상을 진단받으면 일상생활이나 걸을 때 어느\n정도 통증이 나타나게 된다. 이때 침상안정은 요구되지\n않는다. 통증에 의해 영구적인 손상이 발생하지 않으므로\n약간의 통증을 견디면서 점차 활동을 늘려가는 것이 권장되며 ,\n침상안정을 하지 않는 것이 오히려 통증을 완화시키고\n합병증을 최소화할 수 있다."},{"id":"c08-q018","chapterId":8,"number":18,"page":259,"stem":"평소 건강하던 45세 남자가 등산을 다녀온 후 왼쪽 발 뒤꿈치에 심한 통증이 있어 내원\n하였다. 아침에 일어나서 발을 딛을 때 극심한 통증을 느낀다고 하며 외상 병력은 없다고\n한다. 이 환자에게 적절한 중재는?","choices":["항생제","휴식과 얼음찜질","고용량 스테로이드 정맥투여","5km/hr 속도로 매일 1시간 걷기","비스테로이드성 항염제(NSAIDs) 장기복용"],"answer":2,"answerLabel":"②","answerPage":365,"explanation":"족저근막염은 족저근막의 인대에 염증이 생긴 것으로\n걷는 중통증이 나타난다. 마라톤선수나 댄서, 장기간 서있는\n직업을 가진 사람들이 위험군이다. 치료중재는 휴식,\n얼음찜질, 단기간 NSAIDs, 스트레칭 운동, 스테로이드\n주사이다."},{"id":"c08-q019","chapterId":8,"number":19,"page":259,"stem":"골관절염이 있는 65세 환자가 비약물적 치료중재를 받은 후에도 통증이 지속되고 있다.\n미국 류마티스학회에서 권장하는 통증완화를 위한 1 차 치료약물은?","choices":["Naproxen","Steroid","Ibuprofen","Tramadol","Acetaminophen"],"answer":4,"answerLabel":"④","answerPage":365,"explanation":"골관절염은 만성질환으로 비약물적 치료중재가 우선\n적용되어야 한다. 통증이 지속되거나 완전 완화가 되지\n않으면 약물중재를 시작한다. acetaminophen이 1 차\n약물로 650mg을 하루 4회 투여하며 이때 간독성을\n모니터한다. acetaminephen 은 ibuprofen 또는\nnaproxen 등과 같은 NSAIDs 약물보다는 효과적이지\n않으나 부작용이 더 심하므로 특히 노인에서는\nacetaminophen 을 1 차 약물로 권장한다."},{"id":"c08-q020","chapterId":8,"number":20,"page":259,"stem":"75세 여자가 오른쪽 무릎에 경증의 골관절염을 진단받았다. 비교적 건강한 편으로 다른\n만성질환은 없으며, 무릎 통증으로 acetaminophen 2000 mg을 매일 투약하고 있는데\n통증이 완화되지 않는다고 한다. 이 환자에게 적절한 중재는?","choices":["NSAIDs로 처방을 변경한다.","acetaminophen을 하루 4000 mg으로 증량한다.","acetaminophen 현재 용량을 유지하면서 물리치료를 병행한다","acetaminophen 현재 용량을 유지하면서 수술여부를 고려한다.","48시간 침상안정을 한 후 일상활동에서 통증유발 활동을 피하도록 한다."],"answer":3,"answerLabel":"③","answerPage":365,"explanation":"acetaminophen은 하루 3250 mg 이상 복용 시\n간독성의 위험이 있으므로 4000 mg 증량은 위험하다.\n만성질환인 골관절염의 특성상 장기복용이 요구되므로\n가능한 통증완화약물은 NSAIDs로 변경하지 않고\nacetaminophen을 유지하는 것이 권장된다. 물리치료\n등 비약물적 요법으로 근육강화, 관절범위를 향상시켜\n통증을 완화시킬 수 있다."},{"id":"c08-q021","chapterId":8,"number":21,"page":259,"stem":"50세 남자가 사다리를 타고 작업을 하다 떨어져 벽에 오른쪽 어깨를 부딪친 후 심한 통\n증이 있어 내원하였다. 통증 강도는 10점 척도에서 7점 정도라고 하며, 통증이 어깨로부\n터 팔까지 방사된다고 한다. 초기 중재로 적절한 것은?","choices":["진통제를 정맥투여 한다.","물리치료를 받도록 의뢰한다.","우측 어깨와 팔에 방사선 촬영을 요청한다.","우측 어깨를 3일간 고정하여 움직이지 않도록 한다.","휴식을 취하고 얼음찜질과 함께 진통제(naproxen)를 1 주일간 처방한다."],"answer":3,"answerLabel":"③","answerPage":365,"explanation":"외상으로 인한 급성통증을 평가하기 위한 초기중재는\nX-ray로 쇄골이나 상완골의 골절을 우선 확인하여야 한다.\n대부분 연조직의 손상은 X-ray로 알 수 없으나, 우선\n골절이나 탈골 여부를 확인한 후 다른 중재를 제공할 수\n있다."},{"id":"c08-q022","chapterId":8,"number":22,"page":260,"stem":"장거리 마라톤에 참가했던 60세 남자가 다리통증으로 응급실에 내원하여 경골에 스트레\n스 골절(tbal stress fracture)을 진단받았다. 앞으로의 치료단계를 묻는 환자에게 적절한\n설명은?","choices":["2주간 휴식 후 치료를 시작합니다.","진통제는 회복을 지연시키므로 금합니다.","방사선 촬영을 하여 진단을 확인하게 됩니다.","휴식과 함께 다양한 대체운동이 처방됩니다.","일상생활을 하면서 목발을 사용하게 됩니다."],"answer":4,"answerLabel":"④","answerPage":365,"explanation":"스트레스 골절은 환자가 반복되는 신체활동을 할 때\n나타나는 과다사용에 의한 손상이다. 주로 발과 정강이에\n편측성으로 나타난다. 방사선 촬영은 스트레스 골절을\n진단하기에 적합하지 않으므로 병력과 신체검진 결과가 더\n중요하다. 통증조절을 위해 acetminophen 또는 NSAIDs\n를 투여할수 있다. 치료는 바로 시작하며 , 통증이 나타나지\n않는 수준으로 활동을 조정하며, 통증이 없는 상태에서\n휴식과 함께 대체운동예: 수영)을 서서히 늘여나가면서 골절\n부위에 부담을 줄이는 것이 권장된다. 부목이나 목발 등은\n보존적 치료가 효과적이지 않을 때 고려된다."},{"id":"c08-q023","chapterId":8,"number":23,"page":260,"stem":"급성 통풍성 관절염을 진단받은 환자가 자신이 왜 질병에 걸렸는지 문의하였다. 다음 중\n통풍의 위험요소에 해당하는 것은?","choices":["비만","여자","흡연","관절의 외상","류마티스 관절염"],"answer":1,"answerLabel":"①","answerPage":365,"explanation":"통풍성관절염, 또는 통풍은 요산배설의 감소로 초래되는\n질병으로 90% 이상 남성에게 발병되며 폐경전 여성에서는\n드물게 나타난다. 위험요소로는 비만, 당뇨, 가족력이 있으며\nthiazide diuretics, niacin, aspirin, cyclosporine\n등이 고요산혈증을 초래하여 통풍 발생을 촉진시킬 수 있다.\n흡연은 통풍의 위험을 낮춘다고 알려져 있기도 하지만 최근\n메타연구결과 연관성이 없는 것으로 보고되었다."},{"id":"c08-q024","chapterId":8,"number":24,"page":260,"stem":"골관절염 환자가 호소하는 증상을 가장 잘 설명한 것은?","choices":["얼굴의 홍조","휴식 시 나타나는 요통","피부병변이 동반되는 곤방형 손가락","체중 부하관절에 오후부터 심해지는 통증","이른 아침 관절에 대칭적으로 나타나는 뻣뻣함"],"answer":4,"answerLabel":"④","answerPage":365,"explanation":"골관절염은 가장 흔한 관절질환으로 주로 고관절과\n무릎관절에 나타난다. 류 마티스관절염에 비해 조조강직이\n비교적 덜한 반면 관절을 쓸수록 오후에 불편감이 증가한다.\n비만이 가장 대표적인 위험요소이며 가족력도 영향을 준다."},{"id":"c08-q025","chapterId":8,"number":25,"page":260,"stem":"골관절염이 의심되는 환자의 혈액검사에서 예상되는 결과는?","choices":["만성적 빈혈상태","C반응 단백 (CRP) 수준 상승","검사결과 특이사항 없음","antinuclear antibody(ANA)titler 상승","Rheumatoid factor 상승"],"answer":3,"answerLabel":"③","answerPage":365,"explanation":"일반적으로 0A는 전신 염증을 동반하지 않으므로\nESR, CRP 와 같은 염증지표가 상승하지 않고 정상범위를\n유지한다. 류마티스 관절염이나 루프스와는 달리 ANA,\nRF 또는 전신 관절염 증상을 보이는 지표들이 상승하지\n않는다."},{"id":"c08-q026","chapterId":8,"number":26,"page":260,"stem":"류마티스 관절염 환자의 대표적인 사망원인은?","choices":["감염","심근경색","종양","신부전","패혈증"],"answer":2,"answerLabel":"②","answerPage":365,"explanation":"류마티스 관절염은 만성 전신적 감염을 초래하는\n질환으로 여성에게 남성보다 3배 정도 흔히 나타난다. 생명에\n직접적인 위험을 주지 않는 만성질환이나 최근 연구결과에\n의하면 적절한 치료를 받지 않으면 심각한 장애를 초래하여\n생명에도 위협을 주는 것으로 보고된다. RA 환자들의\n사망원인 40% 는 심혈관질환으로서 허혈성 심질환이나\n뇌졸중이 주요 사망원인이다."},{"id":"c08-q027","chapterId":8,"number":27,"page":261,"stem":"26세 여자가 피로와 관절통증이 있어 내원하여 전신홍반루푸스(SLE) 를 진단받고 치료 중\n이다. 증상이 호전되면서 퇴원을 앞두고 있을 때 환자는 간호사에게 곧 아기를 가지려고\n계획하고 있다고 말하였다. 이 환자에게 할 설명으로 옳은 것은?","choices":["SLE 환자는 임신 가능성이 없습니다.","SLE 환자는 유산의 위험이 높습니다.","SLE 의 증상이 조절되면 임신이 가능합니다.","임신이 되면 SLE 치료는 중단되어야 합니다.","SLE 환자가 임신하면 태아에게도 루프스가 나타납니다."],"answer":3,"answerLabel":"③","answerPage":365,"explanation":"Lupus는 만성 염증질환으로 신체 각 기관에 영향을\n주지만 치료가 발달하면서 SLE 환자도 임신이 가능하다.\n그러나 Lupus 환자는 임신 합병증의 위험이 높으며,\nantiphospholipid 항체를 가진 경우 유산의 위험이 높다.\nSLE 증상이 완화되어 6개월 이상 잘 관리된 상태에서는\n성공적인 임신이 가능하다. 임신 중 루프스 급성증상(flare)\n이 나타나면 Prednisone으로 치료하는데, 고용량이 아닌\n경우 prednisone은 태반을 통과하지 못한다. 진성 루푸스는\n아니지만 드물게 태아에게 neonatal lupusフト 나타날 수\n있다."},{"id":"c08-q028","chapterId":8,"number":28,"page":261,"stem":"사무직으로 일하던 20대 여자가 주먹을 쥐거나 손목을 돌릴 때 통증이 있어 내원하였다.\n최근 보고서 작성이 많아 늦게까지 컴퓨터 작업을 했다고 한다. 다음 그림과 같이 손목을\n돌렸을 때 급성의 심한 통증을 호소한다면 다음 중 이 환자에게 의심되는 상태는?","choices":["방아쇠 수ス^trigger finger)","드퀘르뱅 건초염 (DeQ 니ervain tenosynovitis)","듀피트렌 구죽(Dupuytren's contract니re)","요골신경 손상(radial nerve injury)","수근관승우군(carpal t니nn이 syndrome)"],"answer":2,"answerLabel":"②","answerPage":365,"explanation":"손목을 많이 쓰는 직업에서 발생하는 것으로 알려진
